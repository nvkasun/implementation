{{- /* Generated from the staged canonical config (files/goldengate-deployments.yaml): ONE Secrets Manager fetch descriptor per UNIQUE adminSecret -- never one per deployment, since the AWS Secrets Store CSI provider rejects a duplicate top-level objectName (multiple deployments of the same role intentionally share dev/goldengate/<role>/admin) -- fanned out to deployment-specific mounted files via jmesPath objectAlias entries, plus the shared TLS object once; never a second hand-authored secret list. */ -}}
{{- $canonical := .Files.Get "files/goldengate-deployments.yaml" | fromYaml }}
{{- if not $canonical.tlsSecret }}
{{- fail "goldengate-deployments.yaml is missing tlsSecret." }}
{{- end }}
{{- $adminSecretGroups := dict }}
{{- $seenAliases := dict }}
{{- range $canonical.deployments }}
{{- if .enabled }}
{{- if not .name }}
{{- fail "goldengate-deployments.yaml: an enabled deployment is missing name." }}
{{- end }}
{{- if not .adminSecret }}
{{- fail (printf "goldengate-deployments.yaml: enabled deployment %q is missing adminSecret." .name) }}
{{- end }}
{{- $userAlias := printf "%s-admin-user" .name }}
{{- $pwdAlias := printf "%s-admin-password" .name }}
{{- if hasKey $seenAliases $userAlias }}
{{- fail (printf "goldengate-deployments.yaml: duplicate deployment name %q would produce a duplicate monitor credential alias." .name) }}
{{- end }}
{{- $_ := set $seenAliases $userAlias true }}
{{- $_ := set $seenAliases $pwdAlias true }}
{{- $existing := list }}
{{- if hasKey $adminSecretGroups .adminSecret }}
{{- $existing = get $adminSecretGroups .adminSecret }}
{{- end }}
{{- $_ := set $adminSecretGroups .adminSecret (append $existing .) }}
{{- end }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "goldengate-monitor.secretProviderClassName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate-monitor.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.aws.region | quote }}
    objects: |
{{- range $adminSecret := (keys $adminSecretGroups | sortAlpha) }}
      - objectName: "{{ $adminSecret }}"
        objectType: "secretsmanager"
        jmesPath:
{{- range (get $adminSecretGroups $adminSecret) }}
          - path: "OGG_ADMIN"
            objectAlias: "{{ .name }}-admin-user"
          - path: "OGG_ADMIN_PWD"
            objectAlias: "{{ .name }}-admin-password"
{{- end }}
{{- end }}
      - objectName: "{{ $canonical.tlsSecret }}"
        objectType: "secretsmanager"
        jmesPath:
          # The monitor is a TLS *client* to the runtime admin endpoints --
          # it only needs the CA to verify their server certificates.
          - path: '"ca-chain.pem"'
            objectAlias: "ca-chain-pem"
