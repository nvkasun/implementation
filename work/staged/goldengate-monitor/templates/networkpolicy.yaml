{{- if .Values.networkPolicy.enabled }}
# Ingress-only: deliberately no Egress policyType/rules -- egress CIDRs (DynamoDB VPC endpoint, DNS, ALB target-group traffic) are unconfirmed for this cluster; enable only after they are.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gg-monitor
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate-monitor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "goldengate-monitor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
