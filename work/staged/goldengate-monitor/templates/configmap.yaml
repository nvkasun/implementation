{{- /* Mirrors the deployment-model-generated registry verbatim into a ConfigMap -- a STAGED COPY under this chart's files/ directory, never a hand-authored second list; the deploying workflow stages it into a temporary chart directory immediately before packaging. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: goldengate-monitor-canonical-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate-monitor.labels" . | nindent 4 }}
data:
  goldengate-deployments.yaml: |
{{ .Files.Get "files/goldengate-deployments.yaml" | indent 4 }}
