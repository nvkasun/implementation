#!/usr/bin/env bash
set -u

NS="kube-system"
CLAIM="gg-mssql-repltest-01-u02"
SA="efs-csi-controller-sa"

section() {
  echo
  echo "============================================================"
  echo "$1"
  echo "============================================================"
}

section "1. EFS CSI CONTROLLER SERVICE ACCOUNT"

kubectl get sa "$SA" -n "$NS" -o yaml 2>&1 || true


section "2. EFS CSI CONTROLLER PODS + AWS IDENTITY ENV"

PODS="$(
  kubectl get pods -n "$NS" \
    -l app=efs-csi-controller \
    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
    2>/dev/null
)"

echo "$PODS"

for POD in $PODS; do
  echo
  echo "--- $POD AWS environment ---"

  kubectl exec -n "$NS" "$POD" -c efs-plugin -- \
    sh -c 'env | grep "^AWS_" | grep -v TOKEN' \
    2>&1 || true
done


section "3. BOTH EFS-PLUGIN LOGS"

for POD in $PODS; do
  echo
  echo "================ $POD / efs-plugin ================"

  kubectl logs -n "$NS" "$POD" \
    -c efs-plugin \
    --since=12h 2>&1 |
  grep -Ei \
    "${CLAIM}|CreateVolume|CreateAccessPoint|DescribeAccessPoints|DescribeFileSystems|DescribeMountTargets|AccessDenied|Unauthorized|credential|webidentity|AssumeRole|STS|elasticfilesystem|timeout|deadline|connection|error|failed" |
  tail -120 || true
done


section "4. BOTH CSI-PROVISIONER LOGS"

for POD in $PODS; do
  echo
  echo "================ $POD / csi-provisioner ================"

  kubectl logs -n "$NS" "$POD" \
    -c csi-provisioner \
    --since=12h 2>&1 |
  grep -Ei \
    "${CLAIM}|CreateVolume|Provision|error|failed|timeout|deadline" |
  tail -120 || true
done


section "5. EFS CSI ROLE POLICIES"

ROLE_ARN="$(
  kubectl get sa "$SA" -n "$NS" \
    -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}' \
    2>/dev/null
)"

ROLE_NAME="${ROLE_ARN##*/}"

echo "Role ARN : ${ROLE_ARN:-<EMPTY>}"
echo "Role Name: ${ROLE_NAME:-<EMPTY>}"

if [[ -n "$ROLE_NAME" ]]; then
  echo
  echo "Attached managed policies:"
  aws iam list-attached-role-policies \
    --role-name "$ROLE_NAME" \
    --output table 2>&1 || true

  echo
  echo "Inline policies:"
  aws iam list-role-policies \
    --role-name "$ROLE_NAME" \
    --output table 2>&1 || true

  echo
  echo "Trust relationship:"
  aws iam get-role \
    --role-name "$ROLE_NAME" \
    --query 'Role.AssumeRolePolicyDocument' \
    --output json 2>&1 || true
fi


section "6. EKS ADDON IDENTITY"

aws eks describe-addon \
  --cluster-name gg-poc-dev \
  --addon-name aws-efs-csi-driver \
  --query 'addon.{Version:addonVersion,Status:status,ServiceAccountRoleArn:serviceAccountRoleArn,PodIdentityAssociations:podIdentityAssociations}' \
  --output json 2>&1 || true


section "7. QUICK RESULT"

kubectl get pvc "$CLAIM" -n goldengate-dev \
  -o custom-columns='NAME:.metadata.name,STATUS:.status.phase,VOLUME:.spec.volumeName,SC:.spec.storageClassName' \
  2>&1 || true

echo
echo "READ-ONLY diagnostic completed."