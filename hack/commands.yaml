#!/usr/bin/env bash

# ============================================================
# Argo CD ALB - MINIMAL DIAGNOSTIC
# READ-ONLY: no resources are modified
# ============================================================

set -u

NS="argocd"
INGRESS="argocd-server-ingress"
SERVICE="argocd-server"

section() {
  echo ""
  echo "============================================================"
  echo "$1"
  echo "============================================================"
}

# ------------------------------------------------------------
section "1. ARGO INGRESS - CURRENT STATE"

kubectl get ingress "$INGRESS" -n "$NS" -o wide 2>&1 || true

echo ""
echo "Critical ingress configuration:"
kubectl get ingress "$INGRESS" -n "$NS" \
  -o jsonpath='
Name: {.metadata.name}
Class: {.spec.ingressClassName}
Host: {.spec.rules[0].host}
AddressHostname: {.status.loadBalancer.ingress[0].hostname}
AddressIP: {.status.loadBalancer.ingress[0].ip}
BackendService: {.spec.rules[0].http.paths[0].backend.service.name}
BackendPort: {.spec.rules[0].http.paths[0].backend.service.port.number}
GroupName: {.metadata.annotations.alb\.ingress\.kubernetes\.io/group\.name}
GroupOrder: {.metadata.annotations.alb\.ingress\.kubernetes\.io/group\.order}
Scheme: {.metadata.annotations.alb\.ingress\.kubernetes\.io/scheme}
TargetType: {.metadata.annotations.alb\.ingress\.kubernetes\.io/target-type}
BackendProtocol: {.metadata.annotations.alb\.ingress\.kubernetes\.io/backend-protocol}
ListenPorts: {.metadata.annotations.alb\.ingress\.kubernetes\.io/listen-ports}
CertificateARN: {.metadata.annotations.alb\.ingress\.kubernetes\.io/certificate-arn}
HealthCheckPath: {.metadata.annotations.alb\.ingress\.kubernetes\.io/healthcheck-path}
HealthCheckProtocol: {.metadata.annotations.alb\.ingress\.kubernetes\.io/healthcheck-protocol}
' 2>&1 || true

echo ""

# ------------------------------------------------------------
section "2. ALB INGRESS CLASS"

kubectl get ingressclass alb \
  -o jsonpath='Name: {.metadata.name}{"\n"}Controller: {.spec.controller}{"\n"}Parameters: {.spec.parameters.name}{"\n"}' \
  2>&1 || true

# ------------------------------------------------------------
section "3. AWS LOAD BALANCER CONTROLLER"

CONTROLLERS="$(
  kubectl get deployments -A \
    -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name' \
    --no-headers 2>/dev/null |
  grep -Ei 'aws-load-balancer|load-balancer-controller' || true
)"

if [[ -z "$CONTROLLERS" ]]; then
  echo "ERROR: AWS Load Balancer Controller deployment NOT FOUND"
else
  echo "$CONTROLLERS"

  while read -r C_NS C_DEPLOY; do
    [[ -z "${C_NS:-}" || -z "${C_DEPLOY:-}" ]] && continue

    echo ""
    echo "Deployment status:"
    kubectl get deployment "$C_DEPLOY" -n "$C_NS" 2>&1 || true

    echo ""
    echo "Controller pods:"
    kubectl get pods -n "$C_NS" \
      -l app.kubernetes.io/name=aws-load-balancer-controller \
      -o wide 2>&1 || \
    kubectl get pods -n "$C_NS" | grep -Ei 'load-balancer' || true

    echo ""
    echo "Controller ServiceAccount:"
    SA="$(
      kubectl get deployment "$C_DEPLOY" -n "$C_NS" \
        -o jsonpath='{.spec.template.spec.serviceAccountName}' \
        2>/dev/null || true
    )"

    echo "Name: ${SA:-<EMPTY>}"

    if [[ -n "$SA" ]]; then
      kubectl get sa "$SA" -n "$C_NS" \
        -o jsonpath='IRSA Role: {.metadata.annotations.eks\.amazonaws\.com/role-arn}{"\n"}' \
        2>&1 || true
    fi

    echo ""
    echo "Important controller arguments:"
    kubectl get deployment "$C_DEPLOY" -n "$C_NS" \
      -o jsonpath='{range .spec.template.spec.containers[*].args[*]}{.}{"\n"}{end}' \
      2>/dev/null |
      grep -Ei 'cluster-name|ingress-class|aws-region|aws-vpc-id|feature-gates' || true

  done <<< "$CONTROLLERS"
fi

# ------------------------------------------------------------
section "4. ARGO SERVER SERVICE + ENDPOINTS"

kubectl get service "$SERVICE" -n "$NS" \
  -o custom-columns='NAME:.metadata.name,TYPE:.spec.type,PORT:.spec.ports[0].port,TARGETPORT:.spec.ports[0].targetPort,SELECTOR:.spec.selector' \
  2>&1 || true

echo ""
echo "Service endpoints:"
kubectl get endpoints "$SERVICE" -n "$NS" \
  -o wide 2>&1 || true

# ------------------------------------------------------------
section "5. TARGET GROUP BINDINGS"

TGB="$(
  kubectl get targetgroupbindings.elbv2.k8s.aws -A 2>/dev/null || true
)"

if [[ -z "$TGB" ]]; then
  echo "No TargetGroupBindings found or CRD unavailable."
else
  echo "$TGB"
fi

# ------------------------------------------------------------
section "6. IMPORTANT INGRESS / ALB EVENTS ONLY"

kubectl get events -A --sort-by=.lastTimestamp 2>&1 |
grep -Ei \
'argocd-server-ingress|failedbuildmodel|load.?balancer|targetgroup|subnet|security.?group|certificate|listener|accessdenied|unauthor|ingress' |
tail -60 || true

# ------------------------------------------------------------
section "7. LOAD BALANCER CONTROLLER ERRORS ONLY"

if [[ -n "$CONTROLLERS" ]]; then

  while read -r C_NS C_DEPLOY; do
    [[ -z "${C_NS:-}" || -z "${C_DEPLOY:-}" ]] && continue

    echo ""
    echo "--- ${C_NS}/${C_DEPLOY} ---"

    kubectl logs deployment/"$C_DEPLOY" \
      -n "$C_NS" \
      --all-containers=true \
      --since=30m 2>&1 |
    grep -Ei \
      'error|failed|failedbuildmodel|accessdenied|unauthor|denied|subnet|security.?group|certificate|listener|targetgroup|target.?group|ingress|argocd|credential|webidentity|sts' |
    tail -100 || true

  done <<< "$CONTROLLERS"

else
  echo "Controller deployment not found."
fi

# ------------------------------------------------------------
section "8. FINAL QUICK SUMMARY"

ADDRESS="$(
  kubectl get ingress "$INGRESS" -n "$NS" \
    -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
    2>/dev/null || true
)"

if [[ -z "$ADDRESS" ]]; then
  ADDRESS="$(
    kubectl get ingress "$INGRESS" -n "$NS" \
      -o jsonpath='{.status.loadBalancer.ingress[0].ip}' \
      2>/dev/null || true
  )"
fi

echo "Ingress exists : $(kubectl get ingress "$INGRESS" -n "$NS" >/dev/null 2>&1 && echo YES || echo NO)"
echo "Ingress class  : $(kubectl get ingress "$INGRESS" -n "$NS" -o jsonpath='{.spec.ingressClassName}' 2>/dev/null || echo UNKNOWN)"
echo "ALB address    : ${ADDRESS:-<EMPTY>}"
echo "Controller     : $([[ -n "$CONTROLLERS" ]] && echo FOUND || echo NOT_FOUND)"
echo ""
echo "READ-ONLY diagnostic completed."