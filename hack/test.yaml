After the IAM workflow succeeds

Allow a short period for IAM propagation, then test the existing pod without redeploying it:

kubectl exec -n goldengate-monitoring deployment/gg-monitor -- python3 -c 'import urllib.request; r=urllib.request.urlopen("http://127.0.0.1:8080/api/status",timeout=10); print(r.status); print(r.read().decode())'

Expected beginning:

200
{"generatedAt": ...}

Then confirm the KMS error has stopped:

kubectl logs -n goldengate-monitoring deployment/gg-monitor --since=10m | grep -Ei 'AccessDenied|kms key access denied|dynamodb_read_failed'

Expected after successful requests:

No new matching output

You can also verify the portal internally:

kubectl exec -n goldengate-monitoring deployment/gg-monitor -- python3 -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8080/readyz",timeout=10).status); print(urllib.request.urlopen("http://127.0.0.1:8080/api/status",timeout=10).status)'

Expected:

200
200
Then rerun only the monitor workflow