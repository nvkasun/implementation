# global.environment/namespace.name/aws.region/serviceAccount.roleArn/ingress.host/ingress.alb.groupName/ingress.alb.certificateArn are shared environment identity, injected by the deploy workflow from envs/dev/environment.yaml.
namespace:
  create: true

# Image repository/tag intentionally NOT set here -- injected via --set-string image.repository/tag by the GoldenGate monitor GitHub Actions workflow / Argo CD Application.

dynamodb:
  tableName: gg-eks-pipeline

# canonicalConfig.root uses the library chart's default; the portal derives pipeline/role grouping from the canonical inventory ConfigMap, not a hand-configured list.

staleAfterSeconds: 120
refreshSeconds: 30

serviceAccount:
  create: true
  name: gg-monitor

ingress:
  enabled: false
  mode: shared
  className: alb
  alb:
    groupOrder: "120"
    targetType: ip
    backendProtocol: HTTP
    listenPorts: '[{"HTTPS":443}]'
    healthcheckProtocol: HTTP
    healthcheckPort: traffic-port
    healthcheckPath: /healthz
    successCodes: "200"
