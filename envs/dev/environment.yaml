# Canonical, non-secret DEV environment contract -- the single committed source of truth for AWS/EKS/network/IAM identity shared across this repository's Terraform, Python tooling, workflows, and Helm values. Consumed by hack/goldengate-environment.py and envs/dev/environment.tf; never re-typed independently elsewhere. Recreating EKS in the future should require updating only this file (especially eks.oidcIssuer) plus `render-iam-policies --write`, not a checklist of files. Contains no secret VALUES -- only non-secret names/paths/ARNs that reference where secrets live.
