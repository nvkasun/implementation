# PostgreSQL GoldenGate runtime, single-runtime deployment model; runtime identity derives from Release.Name (see helm/goldengate/templates/_helpers.tpl).
deployment:
  enabled: true
  pipeline: payments-ora-to-pg-001
  role: target

global:
  environment: dev

deploymentModel: singleRuntime

replication:
  enabled: false
  databaseCredentialSecret: ""
  extract:
    enabled: false
    name: ""
    trailName: ""
    tables: []
  distribution:
    enabled: false
    pathName: ""
    targetDeployment: ""
  replicat:
    enabled: false
    name: ""
    checkpointTable: ""
    mappings: []

runtime:
  enabled: true

  deploymentType: postgresql
  businessDomain: payments
  containerName: ogg-postgresql

  replicas: 1

  image:
    repository: 229410149234.dkr.ecr.eu-west-1.amazonaws.com/ogg-postgresql
    tag: "23.26.2.0.1"
    pullPolicy: IfNotPresent

  # region/objectName/serviceAccountRoleArn are shared platform invariants derived by the deploy workflow, never set here.
  csi:
    enabled: true

    admin:
      enabled: true
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath:
        - path: OGG_ADMIN
          objectAlias: OGG_ADMIN
        - path: OGG_ADMIN_PWD
          objectAlias: OGG_ADMIN_PWD

    certificate:
      enabled: true
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath:
        - path: '"ogg.key"'
          objectAlias: ogg.key
        - path: '"ogg.pem"'
          objectAlias: ogg.pem
        - path: '"ca-chain.pem"'
          objectAlias: ca-chain.pem

  initPermissions:
    enabled: true
    mode: "0777"

  service:
    type: ClusterIP
    ports:
      https: 8443
      dist: null
      receiver: 9014
      metrics: 9015

  storage:
    u02:
      type: efs
      existingClaim: ""
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany
    u03:
      type: emptyDir

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

ingress:
  enabled: true
  mode: shared
  className: alb

  hostDomain: goldengate-dev.adcbmis.local

  alb:
    groupName: gg-poc-dev-alb
    groupOrder: "111"
    backendProtocol: HTTPS
    listenPorts: '[{"HTTPS":443}]'
    certificateArn: arn:aws:acm:eu-west-1:668311715351:certificate/9e53e28e-3243-47fc-85a1-50f9a94acde7
    targetType: ip
    healthcheckProtocol: HTTPS
    healthcheckPort: traffic-port
    healthcheckPath: /
    successCodes: "200-499"

  annotations: {}

monitoring:
  labels:
    enabled: true

podSecurityContext: {}

securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false

nodeSelector: {}

tolerations: []

affinity: {}

# reclaimPolicy: Retain -- GoldenGate storage holds trail/checkpoint/recovery state and must survive PVC deletion.
persistence:
  enabled: true
  provider: efs
  efs:
    fileSystemId: fs-05cadf3570f23cd39
    storageClass:
      create: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      directoryPerms: "0777"
      subPathPattern: "${.PVC.name}"
      ensureUniqueDirectory: "true"
      mountOptions:
        - tls
