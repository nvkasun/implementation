# Canonical GoldenGate deployment/topology source for dev (consumed by dynamodb.tf, the monitor, the goldengate-monitor Helm ConfigMap, and tests); service host/TLS name/ports are derived, not stored here.

environment: dev
runtimeNamespace: goldengate-dev
monitoringNamespace: goldengate-monitoring
dnsDomain: goldengate-dev.adcbmis.local
tlsSecret: dev/goldengate/tls-certificate

deployments:
  - name: gg-oracle-payments-01
    type: oracle
    pipeline: payments-ora-to-pg-001
    role: source
    enabled: true
    adminSecret: dev/goldengate/source/admin

  - name: gg-postgresql-payments-01
    type: postgresql
    pipeline: payments-ora-to-pg-001
    role: target
    enabled: true
    adminSecret: dev/goldengate/target/admin
