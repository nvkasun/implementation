# Argo CD dev/test values: non-HA single-replica install; all images must resolve to private ECR (enforced by argocd-eks-deployment.yaml); no Applications/repo creds/SSO configured here.

argo-cd:
  global:
    image:
      repository: aws-cloud-factory-infra-argocd
      tag: "3.2.12"
      imagePullPolicy: IfNotPresent

  crds:
    install: true
    keep: true

  createClusterRoles: true

  controller:
    replicas: 1

  server:
    replicas: 1
    service:
      type: ClusterIP

  repoServer:
    replicas: 1

  applicationSet:
    replicas: 1

  notifications:
    enabled: true

  # Dex disabled: default image ghcr.io/dexidp/dex is public and unreachable from this cluster; mirror to private ECR before enabling.
  dex:
    enabled: false

  # HA Redis (Sentinel via bundled redis-ha subchart) not needed for a single-replica dev/test install.
  redis-ha:
    enabled: false

  redis:
    enabled: true
    image:
      repository: aws-cloud-factory-infra-redis-alpine
      tag: "8.2.3"
    # Redis metrics exporter default image ghcr.io/oliver006/redis_exporter is public; leave disabled until mirrored to private ECR.
    metrics:
      enabled: false

  configs:
    cm:
      admin.enabled: true
      timeout.reconciliation: 180s
    rbac:
      policy.default: "role:readonly"

# In-cluster CronJob that refreshes the Argo CD OCI repository Secrets with a live ECR token via IRSA, one Secret per entry in repositories below. roleArn/awsRegion/ecrRegistry are shared environment identity, injected by the deploy workflow from envs/dev/environment.yaml.
ecrTokenSync:
  enabled: true
  schedule: "0 */6 * * *"
  serviceAccountName: argocd-ecr-token-sync

  repositories:
    - name: goldengate
      helmOciRepository: helm/goldengate
      argocdRepositorySecretName: argocd-ecr-goldengate-oci

    - name: goldengate-monitor
      helmOciRepository: helm/goldengate-monitor
      argocdRepositorySecretName: argocd-ecr-goldengate-monitor-oci

    - name: goldengate-platform
      helmOciRepository: helm/goldengate-platform
      argocdRepositorySecretName: argocd-ecr-goldengate-platform-oci

    # Helm OCI chart only; the mirrored container images are pulled directly by EKS nodes via ECR repository policies, not via Argo CD token sync.
    - name: amazon-cloudwatch-observability
      helmOciRepository: helm/amazon-cloudwatch-observability
      argocdRepositorySecretName: argocd-ecr-amazon-cloudwatch-observability-oci

  image:
    repository: aws-cloud-factory-infra-aws-kubectl
    tag: "1.33.13"
    pullPolicy: Always # tag was just re-mirrored in ECR; avoid reusing a stale cached image

# Exposes the Argo CD UI on the same shared internal ALB/wildcard DNS as GoldenGate's ingress; listenPorts must match that ALB's existing listener exactly. host/groupName/certificateArn are shared environment identity, injected by the deploy workflow from envs/dev/environment.yaml.
argocdServerIngress:
  enabled: false
  ingressClassName: alb
  serviceName: argocd-server
  servicePort: 443
  groupOrder: "50"
  targetType: ip
  backendProtocol: HTTPS
  listenPorts: '[{"HTTPS":443}]'
  healthcheckProtocol: HTTPS
  healthcheckPath: /healthz
  healthcheckPort: traffic-port
