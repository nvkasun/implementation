# Oracle GoldenGate runtime, single-runtime deployment model.
# Runtime identity (name, OGG_DEPLOYMENT, Service/Secret/StorageClass/
# Ingress names) derives from Release.Name (this folder's basename) --
# see helm/goldengate/templates/_helpers.tpl.
deployment:
  enabled: true

global:
  environment: dev

deploymentModel: singleRuntime

runtime:
  enabled: true

  deploymentType: oracle
  businessDomain: payments
  containerName: ogg-oracle

  replicas: 1

  image:
    repository: 229410149234.dkr.ecr.eu-west-1.amazonaws.com/ogg-oracle
    tag: "23.26.2.0.1"
    pullPolicy: IfNotPresent

  csi:
    enabled: true
    region: eu-west-1
    serviceAccountRoleArn: arn:aws:iam::668311715351:role/GoldenGateSecretsReadRole-dev

    admin:
      enabled: true
      # TEMPORARY: shared POC Secrets Manager object, reused across
      # payments-ora-to-pg-* deployments. A later phase should scope this
      # per deployment.
      objectName: dev/goldengate/source/admin
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath:
        - path: OGG_ADMIN
          objectAlias: OGG_ADMIN
        - path: OGG_ADMIN_PWD
          objectAlias: OGG_ADMIN_PWD

    certificate:
      enabled: true
      # TEMPORARY: shared POC TLS certificate object, not deployment-specific.
      objectName: dev/goldengate/tls-certificate
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath:
        - path: '"ogg.key"'
          objectAlias: ogg.key
        - path: '"ogg.pem"'
          objectAlias: ogg.pem
        - path: '"ca-chain.pem"'
          objectAlias: ca-chain.pem

  initPermissions:
    enabled: true
    mode: "0777"

  # gg-oracle-sa is a shared, engine-level identity owned by
  # helm/goldengate-platform -- never created here.
  serviceAccount:
    create: false
    name: gg-oracle-sa
    annotations: {}

  service:
    type: ClusterIP
    ports:
      https: 8443
      dist: 9013
      receiver: null
      metrics: 9015

  storage:
    u02:
      type: efs
      existingClaim: ""
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany
    u03:
      type: emptyDir

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

ingress:
  enabled: true
  mode: shared
  className: alb

  hostDomain: goldengate-dev.adcbmis.local

  alb:
    groupName: gg-poc-dev-alb
    groupOrder: "110"
    backendProtocol: HTTPS
    listenPorts: '[{"HTTPS":443}]'
    certificateArn: arn:aws:acm:eu-west-1:668311715351:certificate/9e53e28e-3243-47fc-85a1-50f9a94acde7
    targetType: ip
    healthcheckProtocol: HTTPS
    healthcheckPort: traffic-port
    healthcheckPath: /
    successCodes: "200-499"

  annotations: {}

monitoring:
  labels:
    enabled: true

podSecurityContext: {}

securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false

nodeSelector: {}

tolerations: []

affinity: {}

# reclaimPolicy: Retain -- GoldenGate storage holds trail/checkpoint/
# recovery state and must survive PVC deletion.
persistence:
  enabled: true
  provider: efs
  efs:
    fileSystemId: fs-05cadf3570f23cd39
    storageClass:
      create: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      directoryPerms: "0777"
      subPathPattern: "${.PVC.name}"
      ensureUniqueDirectory: "true"
      mountOptions:
        - tls
