# PostgreSQL GoldenGate runtime, single-runtime deployment model; runtime identity derives from Release.Name (see helm/goldengate/templates/_helpers.tpl). SOURCE side of the logical PostgreSQL -> MSSQL pipeline repltest-pg-to-mssql-001, paired with gg-mssql-repltest-01. Platform/runtime deployment (this Helm release, its EFS storage, its Admin/TLS secrets) is fully automated by GitHub Actions/Argo CD/Helm; GoldenGate database connections, credentials, Extract, trails, Distribution Path, and process starts are NOT automated here -- they are configured MANUALLY by an operator/DBA through the GoldenGate UI after this runtime is deployed and healthy. deployment.pipeline below is logical topology metadata only (identity/monitor-grouping/UI-topology), never declarative replication desired state.
deployment:
  enabled: true
  pipeline: repltest-pg-to-mssql-001
  role: source

deploymentModel: singleRuntime

runtime:
  deploymentType: postgresql
  businessDomain: repltest
  containerName: ogg-postgresql

  replicas: 1

  image:
    repositoryName: ogg-postgresql
    tag: "23.26.2.0.1"
    pullPolicy: IfNotPresent

  # region/objectName/serviceAccountRoleArn are shared platform invariants derived by the deploy workflow, never set here.
  csi:
    enabled: true

    admin:
      enabled: true
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath:
        - path: OGG_ADMIN
          objectAlias: OGG_ADMIN
        - path: OGG_ADMIN_PWD
          objectAlias: OGG_ADMIN_PWD

    certificate:
      enabled: true
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath:
        - path: '"ogg.key"'
          objectAlias: ogg.key
        - path: '"ogg.pem"'
          objectAlias: ogg.pem
        - path: '"ca-chain.pem"'
          objectAlias: ca-chain.pem

  initPermissions:
    enabled: true
    mode: "0777"

  # SOURCE-side service contract: Distribution Server exposed (dist), Receiver unused until this runtime is paired with the gg-mssql-repltest-01 target on the same pipeline.
  service:
    type: ClusterIP
    ports:
      https: 8443
      dist: 9013
      receiver: null
      metrics: 9015

  storage:
    u02:
      type: efs
      existingClaim: ""
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany
    u03:
      type: emptyDir

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

ingress:
  enabled: true
  mode: shared
  className: alb

  alb:
    groupOrder: "112"
    backendProtocol: HTTPS
    listenPorts: '[{"HTTPS":443}]'
    targetType: ip
    healthcheckProtocol: HTTPS
    healthcheckPort: traffic-port
    healthcheckPath: /
    successCodes: "200-499"

  annotations: {}

monitoring:
  labels:
    enabled: true

podSecurityContext: {}

securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false

nodeSelector: {}

tolerations: []

affinity: {}

# reclaimPolicy: Retain -- GoldenGate storage holds trail/checkpoint/recovery state and must survive PVC deletion. mode: managed -- the FIRST real managed-EFS runtime: fileSystemId is intentionally absent (forbidden by the deployment model when mode=managed) since Terraform's generic module.goldengate_runtime_efs[each.key] (envs/dev/efs.tf, driven by local.goldengate_managed_efs_deployments) provisions and the workflow resolves the filesystem by its deterministic creation token, never a value committed here.
persistence:
  enabled: true
  provider: efs
  efs:
    mode: managed
    storageClass:
      create: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      directoryPerms: "0777"
      subPathPattern: "${.PVC.name}"
      ensureUniqueDirectory: "true"
      mountOptions:
        - tls
