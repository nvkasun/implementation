# PostgreSQL GoldenGate runtime, single-runtime deployment model. TARGET side of the logical Oracle -> PostgreSQL pipeline repltest-ora-to-pg-001, paired with gg-oracle-repltest-01. Platform/runtime deployment is automated by GitHub Actions/Argo CD/Helm. Database connections, credentials, checkpoint configuration, Replicat, and process starts are configured MANUALLY through the GoldenGate UI. deployment.pipeline is logical topology metadata only.

deployment:
  enabled: true
  pipeline: repltest-ora-to-pg-001
  role: target

deploymentModel: singleRuntime

runtime:
  deploymentType: postgresql
  businessDomain: repltest
  containerName: ogg-postgresql

  replicas: 1

  image:
    repositoryName: ogg-postgresql
    tag: "23.26.2.0.1"
    pullPolicy: IfNotPresent

  csi:
    enabled: true

    admin:
      enabled: true
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath:
        - path: OGG_ADMIN
          objectAlias: OGG_ADMIN
        - path: OGG_ADMIN_PWD
          objectAlias: OGG_ADMIN_PWD

    certificate:
      enabled: true
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath:
        - path: '"ogg.key"'
          objectAlias: ogg.key
        - path: '"ogg.pem"'
          objectAlias: ogg.pem
        - path: '"ca-chain.pem"'
          objectAlias: ca-chain.pem

  initPermissions:
    enabled: true
    mode: "0777"

  service:
    type: ClusterIP
    ports:
      https: 8443
      dist: null
      receiver: 9014
      metrics: 9015

  storage:
    u02:
      type: efs
      existingClaim: ""
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany

    u03:
      type: emptyDir

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

ingress:
  enabled: true
  mode: shared
  className: alb

  alb:
    groupOrder: "115"
    backendProtocol: HTTPS
    listenPorts: '[{"HTTPS":443}]'
    targetType: ip
    healthcheckProtocol: HTTPS
    healthcheckPort: traffic-port
    healthcheckPath: /
    successCodes: "200-499"

  annotations: {}

monitoring:
  labels:
    enabled: true

podSecurityContext: {}

securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: true
  provider: efs

  efs:
    mode: managed

    storageClass:
      create: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      directoryPerms: "0777"
      subPathPattern: "${.PVC.name}"
      ensureUniqueDirectory: "true"
      mountOptions:
        - tls
