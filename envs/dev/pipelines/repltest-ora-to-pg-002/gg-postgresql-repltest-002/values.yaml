# PostgreSQL GoldenGate runtime, single-runtime deployment model. TARGET side of the logical Oracle -> PostgreSQL pipeline repltest-ora-to-pg-002, paired with gg-oracle-repltest-002. Platform/runtime deployment is automated by GitHub Actions/Argo CD/Helm. Database connections, credentials, checkpoint configuration, Replicat, and process starts are configured MANUALLY through the GoldenGate UI. deployment.pipeline is logical topology metadata only. Pipeline-Aware Descriptor Hierarchy: this descriptor's canonical path is envs/dev/pipelines/repltest-ora-to-pg-002/gg-postgresql-repltest-002/values.yaml; both the pipeline ID (repltest-ora-to-pg-001 -> repltest-ora-to-pg-002) and the deployment ID (gg-postgresql-repltest-02 -> gg-postgresql-repltest-002) were renamed together to carry the matching 3-digit pipeline correlation suffix -002. Its pre-existing managed EFS filesystem's identity/state is explicitly preserved across this rename -- see automation/goldengate-deployment-model.py's LEGACY_MANAGED_EFS_CREATION_TOKENS.

deployment:
  enabled: true
  pipeline: repltest-ora-to-pg-002
  role: target

deploymentModel: singleRuntime

runtime:
  deploymentType: postgresql
  businessDomain: repltest
  containerName: ogg-postgresql

  replicas: 1

  image:
    repositoryName: ogg-postgresql
    tag: "23.26.2.0.1"
    pullPolicy: IfNotPresent

  csi:
    enabled: true

    admin:
      enabled: true
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath:
        - path: OGG_ADMIN
          objectAlias: OGG_ADMIN
        - path: OGG_ADMIN_PWD
          objectAlias: OGG_ADMIN_PWD

    certificate:
      enabled: true
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath:
        - path: '"ogg.key"'
          objectAlias: ogg.key
        - path: '"ogg.pem"'
          objectAlias: ogg.pem
        - path: '"ca-chain.pem"'
          objectAlias: ca-chain.pem

  initPermissions:
    enabled: true
    mode: "0777"

  service:
    type: ClusterIP
    ports:
      https: 8443
      dist: null
      receiver: 9014
      metrics: 9015

  storage:
    u02:
      type: efs
      # Runtime Identity Migration (u02 storage-preserving bridge): this deployment's OLD identity (gg-postgresql-repltest-02) still physically owns the durable /u02 PersistentVolumeClaim/EFS access-point directory -- a PVC cannot be renamed in place, and recreating a same-named PVC would legitimately provision a DIFFERENT EFS access-point directory (helm/goldengate/templates/runtime-pvc.yaml's own documented contract), so this retained claim intentionally keeps its OLD physical name permanently rather than being silently renamed/recreated. helm/goldengate/templates/runtime-pvc.yaml never creates a NEW PVC while existingClaim is set (this is the chart's own normal, pre-existing existingClaim contract, never a new descriptor field); automation/phases/phase5/phase5_runtime.py's RUNTIME_IDENTITY_MIGRATIONS is what tears down the OLD gg-postgresql-repltest-02 runtime COMPUTE (never this retained PVC) before this NEW identity is ever reconciled against it.
      existingClaim: gg-postgresql-repltest-02-u02
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany

    u03:
      type: emptyDir

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

ingress:
  enabled: true
  mode: shared
  className: alb

  alb:
    groupOrder: "115"
    backendProtocol: HTTPS
    listenPorts: '[{"HTTPS":443}]'
    targetType: ip
    healthcheckProtocol: HTTPS
    healthcheckPort: traffic-port
    healthcheckPath: /
    successCodes: "200-499"

  annotations: {}

monitoring:
  labels:
    enabled: true

podSecurityContext: {}

securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: true
  provider: efs

  efs:
    mode: managed

    storageClass:
      create: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      directoryPerms: "0777"
      subPathPattern: "${.PVC.name}"
      ensureUniqueDirectory: "true"
      mountOptions:
        - tls
