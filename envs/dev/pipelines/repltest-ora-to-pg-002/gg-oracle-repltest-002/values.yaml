# Oracle GoldenGate runtime: SOURCE side of the Oracle -> PostgreSQL pipeline repltest-ora-to-pg-002, paired with gg-postgresql-repltest-002. Its folder name is the runtime identity (Helm release, Kubernetes resources, PVC, EFS creation token, GoldenGate registration). Database connections, credentials and replication processes are configured manually through the GoldenGate UI; deployment.pipeline is topology metadata only.

deployment:
  enabled: true
  pipeline: repltest-ora-to-pg-002
  role: source

deploymentModel: singleRuntime

runtime:
  deploymentType: oracle
  businessDomain: repltest
  containerName: ogg-oracle

  replicas: 1

  image:
    repositoryName: ogg-oracle
    tag: "23.26.2.0.1"
    pullPolicy: IfNotPresent

  csi:
    enabled: true

    admin:
      enabled: true
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath:
        - path: OGG_ADMIN
          objectAlias: OGG_ADMIN
        - path: OGG_ADMIN_PWD
          objectAlias: OGG_ADMIN_PWD

    certificate:
      enabled: true
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath:
        - path: '"ogg.key"'
          objectAlias: ogg.key
        - path: '"ogg.pem"'
          objectAlias: ogg.pem
        - path: '"ca-chain.pem"'
          objectAlias: ca-chain.pem

  initPermissions:
    enabled: true
    mode: "0770"

  service:
    type: ClusterIP
    ports:
      https: 8443
      dist: 9013
      receiver: null
      metrics: 9015

  storage:
    u02:
      type: efs
      existingClaim: ""
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany

    u03:
      type: emptyDir

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

ingress:
  enabled: true
  mode: shared
  className: alb

  alb:
    groupOrder: "114"
    backendProtocol: HTTPS
    listenPorts: '[{"HTTPS":443}]'
    targetType: ip
    healthcheckProtocol: HTTPS
    healthcheckPort: traffic-port
    healthcheckPath: /
    successCodes: "200-499"

  annotations: {}

monitoring:
  labels:
    enabled: true

podSecurityContext: {}

securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: true
  provider: efs

  efs:
    mode: managed

    storageClass:
      create: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      directoryPerms: "0777"
      subPathPattern: "${.PVC.name}"
      ensureUniqueDirectory: "true"
      mountOptions:
        - tls
