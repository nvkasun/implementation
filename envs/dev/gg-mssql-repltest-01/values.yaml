# MSSQL GoldenGate runtime, single-runtime deployment model; runtime identity derives from Release.Name (see helm/goldengate/templates/_helpers.tpl). TARGET side of the PostgreSQL -> MSSQL Phase 6D1 replication test (pipeline repltest-pg-to-mssql-001), paired with the existing source gg-postgresql-repltest-01; replication remains disabled in this phase.
deployment:
  enabled: true
  pipeline: repltest-pg-to-mssql-001
  role: target

lifecycle:
  state: absent

deploymentModel: singleRuntime

replication:
  enabled: false
  databaseCredentialSecret: ""
  extract:
    enabled: false
    name: ""
    trailName: ""
    tables: []
  distribution:
    enabled: false
    pathName: ""
    targetDeployment: ""
  replicat:
    enabled: false
    name: ""
    checkpointTable: ""
    mappings: []

runtime:
  enabled: true

  deploymentType: mssql
  businessDomain: repltest
  containerName: ogg-sqlserver

  replicas: 1

  image:
    repositoryName: ogg-sqlserver
    tag: "23.26.2.0.1"
    pullPolicy: IfNotPresent

  # region/objectName/serviceAccountRoleArn are shared platform invariants derived by the deploy workflow, never set here.
  csi:
    enabled: true

    admin:
      enabled: true
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath:
        - path: OGG_ADMIN
          objectAlias: OGG_ADMIN
        - path: OGG_ADMIN_PWD
          objectAlias: OGG_ADMIN_PWD

    certificate:
      enabled: true
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath:
        - path: '"ogg.key"'
          objectAlias: ogg.key
        - path: '"ogg.pem"'
          objectAlias: ogg.pem
        - path: '"ca-chain.pem"'
          objectAlias: ca-chain.pem

  initPermissions:
    enabled: true
    mode: "0777"

  # TARGET-side service contract: Receiver exposed, Distribution Server unused -- mirrors the existing gg-postgresql-payments-01 target convention.
  service:
    type: ClusterIP
    ports:
      https: 8443
      dist: null
      receiver: 9014
      metrics: 9015

  storage:
    u02:
      type: efs
      existingClaim: ""
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany
    u03:
      type: emptyDir

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

ingress:
  enabled: true
  mode: shared
  className: alb

  alb:
    groupOrder: "113"
    backendProtocol: HTTPS
    listenPorts: '[{"HTTPS":443}]'
    targetType: ip
    healthcheckProtocol: HTTPS
    healthcheckPort: traffic-port
    healthcheckPath: /
    successCodes: "200-499"

  annotations: {}

monitoring:
  labels:
    enabled: true

podSecurityContext: {}

securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false

nodeSelector: {}

tolerations: []

affinity: {}

# reclaimPolicy: Retain -- GoldenGate storage holds trail/checkpoint/recovery state and must survive PVC deletion. mode: managed -- the second managed-EFS runtime (a NEW, distinct EFS filesystem from gg-postgresql-repltest-01's): fileSystemId is intentionally absent (forbidden by the deployment model when mode=managed) since Terraform's generic module.goldengate_runtime_efs[each.key] (envs/dev/efs.tf, driven by local.goldengate_managed_efs_deployments) provisions and the workflow resolves the filesystem by its deterministic creation token, never a value committed here.
persistence:
  enabled: true
  provider: efs
  efs:
    mode: managed
    storageClass:
      create: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      directoryPerms: "0777"
      subPathPattern: "${.PVC.name}"
      ensureUniqueDirectory: "true"
      mountOptions:
        - tls
