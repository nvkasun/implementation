environment: dev

namespaces:
  runtime:
    create: true
    name: goldengate-dev

serviceAccounts:
  oracle:
    create: true
    name: gg-oracle-sa
    roleArn: ""
  postgresql:
    create: true
    name: gg-postgresql-sa
    roleArn: ""

fluentBit:
  create: true
  serviceAccount:
    create: true
    name: gg-fluent-bit
    roleArn: ""
  aws:
    region: ""
  namespaces:
    runtime: goldengate-dev
    monitoring: goldengate-monitoring
  cloudwatch:
    runtimeLogGroupName: /adcb/goldengate/dev/runtime
    monitorLogGroupName: /adcb/goldengate/dev/monitor
    logStreamPrefix: fluent-bit-
