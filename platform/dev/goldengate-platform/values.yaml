environment: dev

namespaces:
  runtime:
    create: true
    name: goldengate-dev

# runtimeServiceAccounts is intentionally absent -- the deploy workflow injects it via --set from the folder-driven identity inventory, never hand-maintained.

fluentBit:
  create: true
  serviceAccount:
    create: true
    name: gg-fluent-bit
    roleArn: ""
  aws:
    region: ""
  namespaces:
    runtime: goldengate-dev
    monitoring: goldengate-monitoring
  cloudwatch:
    runtimeLogGroupName: /adcb/goldengate/dev/runtime
    monitorLogGroupName: /adcb/goldengate/dev/monitor
    logStreamPrefix: fluent-bit-
