clusterName: gg-poc-dev
region: eu-west-1
k8sMode: EKS

# Traditional (Fluent Bit based) container log collection stays fully
# disabled -- gg-fluent-bit remains the only application/container log
# collector. Chart default is true; this is an explicit override.
containerLogs:
  enabled: false

# Classic (non-OTel) Container Insights stays disabled -- this deployment
# uses the OTel Container Insights pipeline exclusively (below). Chart
# default is true; this is an explicit override.
containerInsights:
  enabled: false

# Application Signals (traces/APM) is out of scope for this phase. Chart
# default is true; this is an explicit override.
applicationSignals:
  enabled: false

manager:
  # Auto-instrumentation injection must never be enabled implicitly.
  # Chart computes a region-dependent default when unset; pinned to false
  # explicitly here regardless of region.
  applicationSignals:
    autoMonitor:
      monitorAllServices: false
  image:
    repository: aws-cloud-factory-cloudwatch-agent-operator
    tag: "3.4.2"
    repositoryDomainMap:
      public: 229410149234.dkr.ecr.eu-west-1.amazonaws.com

agents:
  - name: cloudwatch-agent
    mode: daemonset
    hostNetwork: true

  - name: cloudwatch-agent-cluster-scraper
    mode: deployment
    config: "default"
    hostNetwork: false

agent:
  serviceAccount:
    name: cloudwatch-agent
  # CloudWatch Agent image: private ECR only, same override shape as
  # manager.image above.
  image:
    repository: aws-cloud-factory-cloudwatch-agent
    tag: "1.300069.0b1529"
    repositoryDomainMap:
      public: 229410149234.dkr.ecr.eu-west-1.amazonaws.com
  prometheus:
    targetAllocator:
      enabled: false
otelContainerInsights:
  enabled: true
  logs:
    enabled: false

# GPU metrics (NVIDIA DCGM exporter): out of scope for this phase. Chart
# default is true; this is an explicit override.
dcgmExporter:
  enabled: false

# AWS Neuron (Trainium/Inferentia) metrics: out of scope for this phase.
# Chart default is true; this is an explicit override.
neuronMonitor:
  enabled: false

# Kubernetes resource metrics (kube-state-metrics). Already the chart
# default (true); set explicitly here for visibility, plus the private
# image override.
kubeStateMetrics:
  enabled: true
  image:
    repository: aws-cloud-factory-kube-state-metrics
    tag: "v2.18.0"
    repositoryDomainMap:
      public: 229410149234.dkr.ecr.eu-west-1.amazonaws.com

nodeExporter:
  enabled: true
  image:
    repository: aws-cloud-factory-node-exporter
    tag: "v1.11.1"
    repositoryDomainMap:
      public: 229410149234.dkr.ecr.eu-west-1.amazonaws.com
