name: "02 | PHASE | AWS Application Prerequisites"

# Called exclusively by 00-main-goldengate-orchestrator.yaml -- workflow_call only. Represents CURRENT Terraform's own scope (IAM/IRSA, Secrets Manager, managed runtime EFS, DynamoDB, CloudWatch/application prerequisites) -- the Terraform root itself is not renamed or redesigned here.
on:
  workflow_call:
    inputs:
      selected_environment:
        required: true
        type: string
      effective_deploy:
        required: true
        type: string
      has_active_deployments:
        required: true
        type: string
      active_runtime_matrix:
        required: true
        type: string
      terraform_governance_override:
        required: false
        type: string
        default: "false"
      terraform_governance_override_reason:
        required: false
        type: string
        default: ""
      has_changes:
        required: true
        type: string
      deployment_matrix:
        required: true
        type: string
      has_deletions:
        required: true
        type: string
      deletion_matrix:
        required: true
        type: string
    outputs:
      selected_environment:
        value: ${{ jobs.phase_contract.outputs.selected_environment }}
      effective_deploy:
        value: ${{ jobs.phase_contract.outputs.effective_deploy }}
      has_active_deployments:
        value: ${{ jobs.phase_contract.outputs.has_active_deployments }}
      active_runtime_matrix:
        value: ${{ jobs.phase_contract.outputs.active_runtime_matrix }}
      has_changes:
        value: ${{ jobs.phase_contract.outputs.has_changes }}
      deployment_matrix:
        value: ${{ jobs.phase_contract.outputs.deployment_matrix }}
      has_deletions:
        value: ${{ jobs.phase_contract.outputs.has_deletions }}
      deletion_matrix:
        value: ${{ jobs.phase_contract.outputs.deletion_matrix }}

jobs:
  terraform_sync_once:
    name: Synchronize Terraform (once per environment)

    # The Phase 1 prerequisite chain (EKS/OIDC/Kubernetes preflight, deployment detection, both storage guards, AWS-side EFS inventory) is already transitively guaranteed by Phase 1's own success -- MAIN only calls this phase after Phase 1 has succeeded, so the only remaining condition to check here is the resolved mode itself.
    if: ${{ inputs.effective_deploy == 'true' }}

    # The called Terraform chain needs packages/pull-requests beyond this phase's own top-level permissions; a callee can never be elevated above its caller.
    permissions:
      id-token: write
      contents: read
      packages: write
      pull-requests: read

    uses: ./.github/workflows/10-sub-iam-secrets.yaml
    secrets: inherit
    with:
      environment: ${{ inputs.selected_environment }}
      # Live Deploy Fix 5: propagates Phase 1's single-source-of-truth governance derivation -- never re-derived here.
      terraform_governance_override: ${{ inputs.terraform_governance_override == 'true' }}
      terraform_governance_override_reason: ${{ inputs.terraform_governance_override_reason }}

  phase_contract:
    name: "Phase 2 contract"

    # Reproduces the Phase 2 slice of MAIN final_validation's mode-aware contract: Terraform succeeding is required on a real Deploy, and its intentional Validate-mode skip is accepted as success -- if: always() so this phase never accidentally reports success merely because terraform_sync_once was cleanly skipped for the wrong reason.
    needs:
      - terraform_sync_once
    if: always()

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      selected_environment: ${{ steps.contract.outputs.selected_environment }}
      effective_deploy: ${{ steps.contract.outputs.effective_deploy }}
      has_active_deployments: ${{ steps.contract.outputs.has_active_deployments }}
      active_runtime_matrix: ${{ steps.contract.outputs.active_runtime_matrix }}
      has_changes: ${{ steps.contract.outputs.has_changes }}
      deployment_matrix: ${{ steps.contract.outputs.deployment_matrix }}
      has_deletions: ${{ steps.contract.outputs.has_deletions }}
      deletion_matrix: ${{ steps.contract.outputs.deletion_matrix }}

    steps:
      - name: Validate the mode-aware Phase 2 success contract and relay outputs
        id: contract
        shell: bash
        env:
          EFFECTIVE_DEPLOY: ${{ inputs.effective_deploy }}
          RESULT_terraform_sync_once: ${{ needs.terraform_sync_once.result }}
          OUT_selected_environment: ${{ inputs.selected_environment }}
          OUT_has_active_deployments: ${{ inputs.has_active_deployments }}
          OUT_active_runtime_matrix: ${{ inputs.active_runtime_matrix }}
          OUT_has_changes: ${{ inputs.has_changes }}
          OUT_deployment_matrix: ${{ inputs.deployment_matrix }}
          OUT_has_deletions: ${{ inputs.has_deletions }}
          OUT_deletion_matrix: ${{ inputs.deletion_matrix }}
        run: |
          set -euo pipefail

          echo "Resolved mode: effective_deploy=${EFFECTIVE_DEPLOY}"

          FAILED="false"

          require_success() {
            local job_name="$1"
            local result_var="RESULT_${job_name}"
            local result="${!result_var}"
            if [ "$result" != "success" ]; then
              echo "FAIL: required job '${job_name}' has result '${result}', expected 'success'."
              FAILED="true"
            else
              echo "OK: required job '${job_name}' succeeded."
            fi
          }

          allow_non_failure() {
            local job_name="$1"
            local result_var="RESULT_${job_name}"
            local result="${!result_var}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "FAIL: job '${job_name}' has result '${result}' -- not required in this mode, but a real failure/cancellation still blocks Phase 2."
              FAILED="true"
            else
              echo "OK: job '${job_name}' result '${result}' is acceptable in this mode."
            fi
          }

          if [ "$EFFECTIVE_DEPLOY" = "true" ]; then
            require_success terraform_sync_once
          else
            allow_non_failure terraform_sync_once
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "FAIL: Phase 2 | AWS Application Prerequisites did not complete successfully."
            exit 1
          fi

          echo ""
          echo "OK: Phase 2 | AWS Application Prerequisites succeeded."

          {
            echo "selected_environment=${OUT_selected_environment}"
            echo "effective_deploy=${EFFECTIVE_DEPLOY}"
            echo "has_active_deployments=${OUT_has_active_deployments}"
            echo "active_runtime_matrix=${OUT_active_runtime_matrix}"
            echo "has_changes=${OUT_has_changes}"
            echo "deployment_matrix=${OUT_deployment_matrix}"
            echo "has_deletions=${OUT_has_deletions}"
            echo "deletion_matrix=${OUT_deletion_matrix}"
          } >> "$GITHUB_OUTPUT"
