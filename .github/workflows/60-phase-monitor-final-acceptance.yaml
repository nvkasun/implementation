name: "60 | PHASE | GoldenGate Monitor & Final Acceptance"

# Internal workflow_call wrapper for Phase 6: monitor ownership, sync, dry-run validation, health acceptance, end-to-end acceptance, and final validation. Replication is configured manually through the GoldenGate UI. Retired automated replication jobs and result dependencies are absent; the passive monitor validates discovered process health without exact desired-process-name matching.

on:
  workflow_call:
    inputs:
      selected_environment:
        required: true
        type: string
      # effective_deploy/has_active_deployments/has_changes/has_deletions are deliberately consumed as literal lowercase strings "true"/"false" by phase6_final.py's mode-aware contract -- never coerced to GitHub/Python Boolean truthiness at this boundary, exactly preserving the pre-renumbering contract.
      effective_deploy:
        required: true
        type: string
      has_active_deployments:
        required: true
        type: string
      has_changes:
        required: true
        type: string
      has_deletions:
        required: true
        type: string
      result_validate_model:
        required: true
        type: string
      result_terraform_sync_once:
        required: true
        type: string
      result_validate_shared_secrets_once:
        required: true
        type: string
      result_validate_argocd_ready:
        required: true
        type: string
      result_validate_platform_ready:
        required: true
        type: string
      result_validate_observability_ready:
        required: true
        type: string
      result_runtime_ownership_preflight:
        required: true
        type: string
      result_build_publish_and_deploy:
        required: true
        type: string
      result_delete_removed_argocd_applications:
        required: true
        type: string
      result_validate_active_runtimes:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  monitor_ownership_preflight:
    name: "Phase 6A | GoldenGate Monitor Ownership Preflight"

    # Phase B3B: read-only pre-reconciliation ownership-safety classifier for the shared gg-monitor deployment -- ABSENT (safe to create) / OWNED (safe to reconcile, even if currently unhealthy/out of date) / BROKEN (ownership/collision conflict, fail closed). Like a GoldenGate runtime (never like a static prerequisite), the monitor's canonical registry input changes whenever the GLOBAL active runtime inventory changes -- OWNED (not HEALTHY) is the "safe to reconcile" state. This job never mutates the cluster -- it only runs automation/orchestration/monitor_state.py, which itself issues read-only `kubectl get` calls. GoldenGate Monitor MAIN DAG Skip-Propagation Correctness Fix: this if: previously contained no status-check function (always()/success()/failure()/cancelled()) anywhere, so GitHub Actions' own implicit default continuation check applied on top of it -- a legitimately-skipped OPTIONAL job elsewhere in the ancestor graph (e.g. delete_removed_argocd_applications, correctly skipped when has_deletions=false) silently propagated a SKIP to this job too. always() here overrides ONLY that implicit default propagation -- it does not weaken or replace a single one of the requirements below; every one of them is still checked exactly as before, and a genuine failure/cancellation of an ACTUALLY required prerequisite still prevents this job from running. Automated Replication Implementation Removal: this if: previously also required inputs.result_replication_reconcile_once == 'success' -- that automated-replication-result dependency is removed outright (not replaced) since automated replication reconciliation no longer exists anywhere in this repository; monitor ownership preflight now depends only on shared-secrets readiness. Phase 6 grouping: validate_shared_secrets_once is an external Phase 1-5 job completed before this reusable workflow is ever invoked -- its .result crosses the reusable-workflow boundary as a plain workflow_call input (never a second needs.* reference to a job outside this file).
    if: ${{ inputs.effective_deploy == 'true' && inputs.has_active_deployments == 'true' && always() && inputs.result_validate_shared_secrets_once == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      state: ${{ steps.classify.outputs.state }}

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ inputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase6/phase6_monitor.py ensure-kubectl

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/5 pattern -- these temporary credentials are consumed ONLY by the classify step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Classify monitor ownership safety
        id: classify
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.1"

          python3 automation/phases/phase6/phase6_monitor.py ownership-preflight --environment "${GG_SELECTED_ENVIRONMENT}"

  monitor_sync_once:
    name: "Phase 6B | Synchronize GoldenGate Monitor"

    needs:
      - monitor_ownership_preflight
    # 50-sub-monitor.yaml publishes unconditionally on every internal step, so this call must be skipped entirely for deploy=false. Also skipped when the canonical model has zero active runtimes (e.g. full decommission): the monitor legitimately refuses to start against an empty registry, so this orchestrator must not invoke it rather than let that be a real failure. Phase B3B: the monitor is a deployment TARGET (like a GoldenGate runtime), never a HEALTHY-skip prerequisite -- it must ALWAYS reconcile for BOTH the ABSENT and OWNED ownership-safety states (never an "OWNED -> skip" shortcut), because goldengate-deployments.yaml is derived from the GLOBAL active runtime inventory and may have changed independently of the monitor pod's own health. monitor_ownership_preflight already fails closed on BROKEN; the explicit state check below is reinforcement, never a substitute for that. Automated Replication Implementation Removal: this if: previously also required inputs.result_replication_reconcile_once != 'failure' && inputs.result_replication_reconcile_once != 'cancelled' -- both removed outright, since automated replication reconciliation no longer exists. Phase 6 grouping: monitor_ownership_preflight is the only INTERNAL Phase 6 dependency; every other reference here is an external Phase 1-5 job result crossing the reusable-workflow boundary as a workflow_call input.
    if: ${{ inputs.effective_deploy == 'true' && inputs.has_active_deployments == 'true' && always() && inputs.result_validate_shared_secrets_once == 'success' && inputs.result_build_publish_and_deploy != 'failure' && inputs.result_build_publish_and_deploy != 'cancelled' && inputs.result_delete_removed_argocd_applications != 'failure' && inputs.result_delete_removed_argocd_applications != 'cancelled' && needs.monitor_ownership_preflight.result == 'success' && (needs.monitor_ownership_preflight.outputs.state == 'ABSENT' || needs.monitor_ownership_preflight.outputs.state == 'OWNED') }}

    # Nested reusable-workflow call, unchanged: this wrapper never inlines/duplicates 50-sub-monitor.yaml's implementation, and orchestrated_by_main: true is preserved so 50-sub-monitor.yaml's own single standalone_deploy_authorization approval path is correctly skipped (MAIN's own goldengate_deploy_authorization already covers this run) -- no second GoldenGate deployment approval is introduced anywhere in this chain.
    uses: ./.github/workflows/50-sub-monitor.yaml
    with:
      environment: ${{ inputs.selected_environment }}
      deploy: true
      # The global CloudWatch publisher must never be disabled by this orchestrator; existing gates stay whatever CONFIG already has (metrics_gate_expectation=any). Phase B3B: 50-sub-monitor.yaml itself now implements the Safe Monitor Publication Bootstrap Contract internally (bootstrap/repair path when no Ready monitor exists yet, fast path otherwise) -- this call site is unchanged.
      enable_cloudwatch_publication: true
      metrics_gate_expectation: any
      orchestrated_by_main: true

  monitor_dry_run_validation:
    name: "Phase 6C | Validate GoldenGate Monitor Locally"

    # Skipped when the canonical model has zero active runtimes (e.g. full decommission): there is no reason to run the monitor's real-repository unit/chart validation against a deliberately empty runtime registry. Automated Replication Implementation Removal: this if: previously also required inputs.result_replication_dry_run_validation != 'failure' && inputs.result_replication_dry_run_validation != 'cancelled' -- both removed outright, since the automated replication dry-run validation job no longer exists. Phase 6 grouping: this is the validate-mode path and has no Phase-6-internal dependency -- every reference below is an external Phase 1-5 job result crossing the boundary as a workflow_call input.
    if: ${{ inputs.effective_deploy == 'false' && inputs.has_active_deployments == 'true' && always() && inputs.result_validate_shared_secrets_once == 'success' && inputs.result_build_publish_and_deploy != 'failure' && inputs.result_build_publish_and_deploy != 'cancelled' && inputs.result_delete_removed_argocd_applications != 'failure' && inputs.result_delete_removed_argocd_applications != 'cancelled' }}

    # Local/read-only CI validation only (checkout, Python, pip install, unit tests, folder-driven registry generation, Helm lint/template) -- no AWS credentials, no EKS access, no Argo CD/Kubernetes mutation, so it does not need (and must not depend on) the private CodeBuild runtime that every real cloud-mutating job in this workflow uses. This job's own CodeBuild runner did not carry the actions/setup-python Python 3.12 x64 distribution ("Version 3.12 was not found in the local cache"), which is a runner/toolchain issue, not a monitor application defect -- switching this ONE dry-run job to the standard GitHub-hosted runner fixes it without touching monitor_sync_once or any other job's runner.
    runs-on: ubuntu-latest

    # Least privilege: this job never authenticates to AWS/EKS/Argo, so it explicitly overrides this workflow's own top-level `permissions: id-token: write` down to contents: read only -- actions/checkout still works under contents: read, and id-token is left absent rather than set to any value, which GitHub Actions treats as no OIDC token permission for this job.
    permissions:
      contents: read

    # Live Validate Fix 3: JOB-LEVEL (not step-level) so every run: step in this job -- not just "Load resolved environment config" itself -- can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail. A step-level env: binding is scoped to that one step only and does not propagate to later steps.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ inputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            monitoring/monitor/requirements.txt
            monitoring/monitor/requirements-test.txt

      - name: Install monitor runtime and test dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check \
            -r monitoring/monitor/requirements.txt \
            -r monitoring/monitor/requirements-test.txt

      - name: Load resolved environment config
        shell: bash
        run: |
          set -euo pipefail

          # Local/read-only: this job never authenticates to AWS, but the resolver itself is a pure envs/<environment>/environment.yaml reader and needs no AWS credentials to run.
          python3 automation/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Validate the GoldenGate monitor locally (unit tests, canonical registry, Helm lint/template)
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase6/phase6_monitor.py validate-local --environment "${GG_SELECTED_ENVIRONMENT}"

  validate_monitor_ready:
    name: "Phase 6D | Validate GoldenGate Monitor Healthy"

    # Phase B3B: post-reconciliation monitor acceptance -- HEALTHY/BROKEN only (never ABSENT: an expected monitor that is missing after reconciliation IS BROKEN). Runs in two passes through automation/orchestration/monitor_acceptance.py: (1) structural-only, to prove and select a real Ready pod via the Deployment->ReplicaSet->Pod ownership chain; (2) with that EXACT verified pod's own bounded in-pod /healthz and /readyz results folded in. monitor_sync_once succeeding is not enough on its own -- this is the independent structural+health acceptance gate that end_to_end_deployment_acceptance requires before trusting the monitor. GoldenGate Monitor MAIN DAG Skip-Propagation Correctness Fix: always() added for the SAME reason as monitor_ownership_preflight above -- this if: had no status-check function, so a legitimately-skipped OPTIONAL ancestor elsewhere in the graph (e.g. delete_removed_argocd_applications) could silently propagate a SKIP here too, even though monitor_sync_once (this job's own direct, explicitly-checked prerequisite) already tolerates that exact skip and reports 'success'. Every explicit requirement below is unchanged -- always() only removes the implicit default propagation, it does not accept a genuinely failed/cancelled/skipped required prerequisite. Phase 6 grouping: monitor_sync_once is the only INTERNAL Phase 6 dependency; validate_shared_secrets_once is external and crosses the boundary as a workflow_call input.
    needs:
      - monitor_sync_once
    if: ${{ inputs.effective_deploy == 'true' && inputs.has_active_deployments == 'true' && always() && inputs.result_validate_shared_secrets_once == 'success' && needs.monitor_sync_once.result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      state: ${{ steps.strict.outputs.state }}
      ready_pod_name: ${{ steps.strict.outputs.ready_pod_name }}

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ inputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase6/phase6_monitor.py ensure-kubectl

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/5 pattern -- these temporary credentials are consumed ONLY by the strict-acceptance step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Strict monitor acceptance (structural selection + bounded /healthz + /readyz + final acceptance)
        id: strict
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
          GG_EXPECTED_IMAGE_REPOSITORY: ${{ needs.monitor_sync_once.outputs.image_repository }}
          GG_EXPECTED_IMAGE_TAG: ${{ needs.monitor_sync_once.outputs.image_tag }}
          GG_EXPECTED_CHART_VERSION: ${{ needs.monitor_sync_once.outputs.chart_version }}
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.1"

          # enable_cloudwatch_publication is always literally true in monitor_sync_once's own `with:` block -- mirrored here as the expected final value, never re-derived from a second source.
          python3 automation/phases/phase6/phase6_monitor.py strict-acceptance \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --expected-image-repository "${GG_EXPECTED_IMAGE_REPOSITORY}" \
            --expected-image-tag "${GG_EXPECTED_IMAGE_TAG}" \
            --expected-chart-version "${GG_EXPECTED_CHART_VERSION}" \
            --expected-cloudwatch-publish-enabled true

  end_to_end_deployment_acceptance:
    name: "Phase 6E | End-to-End Runtime Acceptance"

    # Phase B3B: the final gate of the DEPLOY success contract -- fetches /api/processes through the SAME verified monitor pod validate_monitor_ready already selected and health-checked, then runs the offline/pure automation/orchestration/end_to_end_acceptance.py against it (deployment inventory equality, UP/fresh/lease/critical-service health, GENERIC process discovery, per-process stale/ABENDED safety -- never exact desired-process-name conformance). Polls boundedly (never a single instant check) since STATE# records may briefly read MISSING/STARTING immediately after a rollout. Real-deploy + active-runtime only; every external prerequisite below is required at == 'success' (strict, not merely "not failure") so this can never quietly evaluate against a partially-validated stack. GoldenGate Monitor MAIN DAG Skip-Propagation Correctness Fix: always() added for the SAME reason as monitor_ownership_preflight/validate_monitor_ready above. Every == 'success' requirement below remains EXACT -- never relaxed to != 'failure'/!= 'cancelled' -- so a genuinely skipped mandatory prerequisite still blocks this job exactly as before. Automated Replication Implementation Removal: needs.replication_monitor_acceptance and inputs.result_replication_reconcile_once == 'success' are removed outright -- the former Phase 7E job (exact-desired-process-name replication acceptance) no longer exists, and this job's own generic process-safety acceptance (validate_monitor_ready plus the manual-mode-aware classifier inside end_to_end_acceptance.py) is now the complete process-health proof; a manually-unconfigured runtime (EMPTY discovery) and a manually-configured healthy runtime (OK discovery with healthy rows) are both treated as healthy here, while PARTIAL/UNAVAILABLE/INVALID_RESPONSE/stale/ABENDED/malformed rows still fail closed. Phase 6 grouping: validate_monitor_ready is the only remaining INTERNAL Phase 6 dependency; the four Phase 1-5 readiness results cross the boundary as workflow_call inputs.
    needs:
      - validate_monitor_ready
    if: ${{ inputs.effective_deploy == 'true' && inputs.has_active_deployments == 'true' && always() && inputs.result_validate_argocd_ready == 'success' && inputs.result_validate_platform_ready == 'success' && inputs.result_validate_observability_ready == 'success' && inputs.result_validate_active_runtimes == 'success' && needs.validate_monitor_ready.result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ inputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/5 pattern -- these temporary credentials are consumed ONLY by the poll step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Poll monitor-to-runtime end-to-end acceptance until convergence (bounded)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
          POD_NAME: ${{ needs.validate_monitor_ready.outputs.ready_pod_name }}
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.1"

          python3 automation/phases/phase6/phase6_monitor.py end-to-end-acceptance \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --pod-name "${POD_NAME}"

  final_validation:
    name: "Phase 6F | Final Validation"

    # Phase 6 grouping: the five Phase-6-internal jobs remain plain needs.* references; every Phase 1-5 external job result this gate requires crosses the reusable-workflow boundary as a workflow_call input instead (mapped into RESULT_* below exactly as before). Automated Replication Implementation Removal: replication_monitor_acceptance is removed from needs -- it no longer exists.
    needs:
      - monitor_ownership_preflight
      - monitor_sync_once
      - monitor_dry_run_validation
      - validate_monitor_ready
      - end_to_end_deployment_acceptance
    # Phase B3B closeout: final_validation now ALWAYS runs (never itself conditionally skipped by GitHub's default implicit "all needs succeeded" behavior) so it can fail CLOSED -- with useful diagnostics -- when a REQUIRED job was unexpectedly skipped, rather than the job itself silently disappearing. The actual mode-aware pass/fail contract lives entirely in the "Validate the mode-aware final DEPLOY success contract" step below -- one small, explicit, readable branch per resolved mode, never one giant accidental-truth if: expression.
    if: always()

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job -- including "Re-validate the folder-driven deployment model after rollout" -- can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ inputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate the mode-aware final DEPLOY success contract
        shell: bash
        env:
          EFFECTIVE_DEPLOY: ${{ inputs.effective_deploy }}
          HAS_ACTIVE_DEPLOYMENTS: ${{ inputs.has_active_deployments }}
          HAS_CHANGES: ${{ inputs.has_changes }}
          HAS_DELETIONS: ${{ inputs.has_deletions }}
          RESULT_validate_model: ${{ inputs.result_validate_model }}
          RESULT_terraform_sync_once: ${{ inputs.result_terraform_sync_once }}
          RESULT_validate_shared_secrets_once: ${{ inputs.result_validate_shared_secrets_once }}
          RESULT_validate_argocd_ready: ${{ inputs.result_validate_argocd_ready }}
          RESULT_validate_platform_ready: ${{ inputs.result_validate_platform_ready }}
          RESULT_validate_observability_ready: ${{ inputs.result_validate_observability_ready }}
          RESULT_runtime_ownership_preflight: ${{ inputs.result_runtime_ownership_preflight }}
          RESULT_build_publish_and_deploy: ${{ inputs.result_build_publish_and_deploy }}
          RESULT_delete_removed_argocd_applications: ${{ inputs.result_delete_removed_argocd_applications }}
          RESULT_validate_active_runtimes: ${{ inputs.result_validate_active_runtimes }}
          RESULT_monitor_ownership_preflight: ${{ needs.monitor_ownership_preflight.result }}
          RESULT_monitor_sync_once: ${{ needs.monitor_sync_once.result }}
          RESULT_monitor_dry_run_validation: ${{ needs.monitor_dry_run_validation.result }}
          RESULT_validate_monitor_ready: ${{ needs.validate_monitor_ready.result }}
          RESULT_end_to_end_deployment_acceptance: ${{ needs.end_to_end_deployment_acceptance.result }}
        run: |
          set -euo pipefail

          # GitHub needs.*/inputs.* expressions above are resolved into plain env values before phase6_final.py runs; the Python module only reads plain os.environ strings.
          python3 automation/phases/phase6/phase6_final.py validate

      - name: Re-validate the folder-driven deployment model after rollout
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.1"
          python3 automation/goldengate-deployment-model.py --environment "${GG_SELECTED_ENVIRONMENT}" validate

      - name: Orchestrator summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### GoldenGate onboarding orchestrator summary"
            echo ""
            echo "Phase 1 | Validate Folder-Driven Deployment Model -> Terraform Prerequisites -> Argo CD Reconciliation & Acceptance -> Platform + Observability -> Shared Secrets -> Runtime Reconciliation & Acceptance -> Shared Monitor Reconciliation & Acceptance -> Monitor-to-Runtime E2E Acceptance -> Final Validation"
            echo ""
            echo "All required stages completed successfully. GoldenGate database connections, Extract, trails, Distribution Path, and Replicat are configured manually by an operator/DBA through the GoldenGate UI after this pipeline completes; the shared monitor passively discovers and reports whatever real processes are subsequently configured."
          } >> "$GITHUB_STEP_SUMMARY"
