name: "00 | MAIN | GoldenGate EKS End-to-End Deployment"

# Live Deploy UX Fix 2: action-aware and neutral -- never claims "deploy" for a validate-only manual run, and never claims a specific deployment ID for an environment-wide run (deployment_id left blank); Destroy is deliberately never named here yet, the eventual Validate/Deploy/Destroy lifecycle UI is added only once Destroy itself is implemented. Live Deploy Fix 5: the governance-override fragment only ever appears (as a bare "governance-override=true" flag, never the written reason -- that stays in the audited workflow inputs/corporate attestation) when this is a manual workflow_dispatch run with the input literally true; every other run's title is byte-for-byte unchanged from before this task.
run-name: "MAIN | GoldenGate EKS | action=${{ github.event_name == 'workflow_dispatch' && inputs.action || 'deploy' }} | ${{ github.event_name == 'workflow_dispatch' && (inputs.deployment_id != '' && inputs.deployment_id || 'environment-wide') || format('auto: envs/dev changes on {0}', github.sha) }}${{ (github.event_name == 'workflow_dispatch' && inputs.terraform_governance_override == true) && ' | governance-override=true' || '' }} | ran by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev

      action:
        description: "GoldenGate lifecycle action"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - deploy

      deployment_id:
        description: "Optional GoldenGate runtime deployment ID. Leave blank to converge the complete selected environment and all enabled GoldenGate runtimes."
        required: false
        type: string
        default: ""

      terraform_governance_override:
        description: >
          Authorized Terraform governance break-glass override for the corporate
          reusable workflow. Leave false for normal execution.
        required: false
        type: boolean
        default: false

      terraform_governance_override_reason:
        description: >
          Required written justification when Terraform governance override is
          enabled.
        required: false
        type: string
        default: ""

  push:
    branches:
      - main
    paths:
      - 'envs/dev/**'
      - 'helm/goldengate/**'

permissions:
  id-token: write
  contents: read

# Environment identity is loaded per-job via automation/goldengate-environment.py github-env after checkout (GITHUB_ENV is job-local), never duplicated here. Phase 5's own HELM_OCI_NAMESPACE/CHART_NAME/HELM_CHART_PATH/values-file-path constants now live solely in automation/phases/phase5/phase5_runtime.py -- Python contains implementation, YAML describes orchestration only.

# Environment-level protection: only one orchestrator run per branch mutates dev at a time.
concurrency:
  group: goldengate-eks-app-orchestrator-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_model:
    name: "Phase 1 | Validate Folder-Driven Deployment Model"

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Phase 1 (this job) owns everything the removed eks_oidc_preflight/detect_changed_deployments/managed_efs_deletion_guard/storage_transition_guard/managed_efs_inventory_guard jobs used to own -- id-token: write is required for the Deploy-only AWS credential assumption inside "Verify live EKS cluster + OIDC + Kubernetes API access" and "Verify AWS-side managed-EFS inventory".
    permissions:
      id-token: write
      contents: read

    outputs:
      effective_deploy: ${{ steps.phase1_outputs.outputs.effective_deploy }}
      has_active_deployments: ${{ steps.phase1_outputs.outputs.has_active_deployments }}
      active_runtime_matrix: ${{ steps.phase1_outputs.outputs.active_runtime_matrix }}
      selected_environment: ${{ steps.phase1_outputs.outputs.selected_environment }}
      terraform_governance_override: ${{ steps.phase1_outputs.outputs.terraform_governance_override }}
      terraform_governance_override_reason: ${{ steps.phase1_outputs.outputs.terraform_governance_override_reason }}
      has_changes: ${{ steps.phase1_outputs.outputs.has_changes }}
      deployment_matrix: ${{ steps.phase1_outputs.outputs.deployment_matrix }}
      has_deletions: ${{ steps.phase1_outputs.outputs.has_deletions }}
      deletion_matrix: ${{ steps.phase1_outputs.outputs.deletion_matrix }}
      has_storage_transition_violations: ${{ steps.phase1_outputs.outputs.has_storage_transition_violations }}
      storage_transition_violations: ${{ steps.phase1_outputs.outputs.storage_transition_violations }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Python and PyYAML prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py prerequisites

      - name: Resolve selected environment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py resolve-environment

      - name: Validate the folder-driven deployment model
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py validate-model

      - name: Validate and load the selected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py load-environment

      - name: Verify generated IAM policies are in sync with environment.yaml
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py validate-iam-policies

      - name: Determine active GoldenGate runtime state
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py active-runtime-state

      - name: Compute effective deploy flag
        id: compute_effective_deploy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py effective-deploy

      - name: Derive and validate the Terraform governance override (fail closed)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OVERRIDE: ${{ inputs.terraform_governance_override }}
          INPUT_REASON: ${{ inputs.terraform_governance_override_reason }}
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py terraform-governance

      # Deploy-mode-only from here: a recreated EKS cluster keeps the SAME name but gets a DIFFERENT OIDC issuer, and every generated IRSA trust policy in envs/<environment>/policies/** is only valid for the issuer envs/<environment>/environment.yaml declares -- this must run, and must succeed, before Terraform (which owns applying those trust policies) or any deployment can proceed. Skipped entirely for Validate mode so that purely local/offline run never requires live AWS/Kubernetes access. id-token: write assumes RUNNER_ROLE_ARN once here; output-env-credentials: false keeps the assumed build-account credentials off this job's process-wide environment -- output-credentials: true exposes them ONLY as this step's own outputs, explicitly passed via step-local env: to the two steps that genuinely need live AWS access below, never to the local detection/guard steps that share this one visible job.
      - name: Configure AWS credentials (build account)
        id: aws_build_credentials
        if: ${{ steps.compute_effective_deploy.outputs.effective_deploy == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Verify live EKS cluster + OIDC + Kubernetes API access (read-only)
        if: ${{ steps.compute_effective_deploy.outputs.effective_deploy == 'true' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py eks-preflight

      - name: Detect changed GoldenGate deployments
        shell: bash
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Implementation lives in automation/phases/phase1/detect-goldengate-deployments.sh (keeps this run: block under GitHub's ~21,000 char limit); inputs arrive via env: above, never interpolated directly. On a real Deploy this step is only reached once the preceding EKS preflight succeeded -- the job is fail-fast, so no explicit dependency check is needed here.
          python3 automation/phases/phase1/phase1_readiness.py detect-deployments

      - name: Guard against destroying a managed GoldenGate EFS filesystem
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py managed-efs-deletion-guard

      - name: Guard against unsafe persistence.efs storage-identity transitions
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py storage-transition-guard

      - name: Verify AWS-side managed-EFS inventory (read-only)
        if: ${{ steps.compute_effective_deploy.outputs.effective_deploy == 'true' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py managed-efs-inventory

      - name: Publish canonical Phase 1 outputs
        id: phase1_outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py publish-outputs

      - name: Phase 1 acceptance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase1/phase1_readiness.py acceptance

  terraform_sync_once:
    name: Phase 2 | AWS Application Prerequisites

    # Phase 1 (validate_model) now owns the deletion_matrix/storage_transition_violations guards, the persistent AWS-side managed-EFS orphan check, and the live EKS/OIDC preflight internally -- a successful validate_model already proves the entire Phase 1 contract, so this job depends only on it. This job's `if:` is a custom expression, so validate_model's own success is checked explicitly below since GitHub Actions does not implicitly require needs to have succeeded once a custom if: is present.
    needs:
      - validate_model
    if: ${{ needs.validate_model.result == 'success' && needs.validate_model.outputs.effective_deploy == 'true' }}

    # The called Terraform chain needs packages/pull-requests beyond the orchestrator's own top-level permissions; a callee can never be elevated above its caller.
    permissions:
      id-token: write
      contents: read
      packages: write
      pull-requests: read

    uses: ./.github/workflows/10-sub-iam-secrets.yaml
    secrets: inherit
    with:
      environment: ${{ needs.validate_model.outputs.selected_environment }}
      # Live Deploy Fix 5: propagates validate_model's single-source-of-truth governance derivation -- never re-derived here.
      terraform_governance_override: ${{ needs.validate_model.outputs.terraform_governance_override == 'true' }}
      terraform_governance_override_reason: ${{ needs.validate_model.outputs.terraform_governance_override_reason }}

  # Phase 3A | Argo CD Ownership Preflight -- Phase 3 Python Conversion: automation/phases/phase3/argocd_state.py remains a pure OWNERSHIP-SAFETY classifier -- ABSENT (nothing installed yet) and OWNED (whatever currently exists is safely this repository's own Argo CD release, regardless of individual readiness/desired-state drift) both converge via reconcile_argocd below; BROKEN (foreign/ambiguous ownership, or a genuine inspection failure) fails closed right here, never auto-repaired. A DEPLOY is an end-to-end convergence operation, not merely a bootstrap: reconcile_argocd's own idempotent Helm reconciliation is what actually applies the current committed desired state -- this preflight job never needs to learn a new resource name merely to keep permitting that reconciliation. This job never mutates the cluster -- automation/phases/phase3/phase3_argocd.py ownership-preflight only runs the read-only classifier.
  phase_3_argocd:
    name: Phase 3 | Argo CD

    # Phase 3 grouping: this single caller replaces the four Phase 3A-3D jobs previously defined directly in MAIN -- their exact behavior now lives, unchanged, inside .github/workflows/30-phase-argocd-orchestration.yaml (the same high-level reusable-workflow presentation pattern MAIN's own Phase 7 grouping already uses). Preserves the exact former Phase-3-entry gate: Phase 3 must never run during validate-only mode or after a Terraform failure merely to obtain a green parent -- if Phase 3 was previously skipped, the grouped parent is skipped too.
    needs:
      - validate_model
      - terraform_sync_once
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' && needs.terraform_sync_once.result == 'success' }}

    uses: ./.github/workflows/30-phase-argocd-orchestration.yaml
    secrets: inherit
    with:
      selected_environment: ${{ needs.validate_model.outputs.selected_environment }}
      effective_deploy: ${{ needs.validate_model.outputs.effective_deploy }}
      result_terraform_sync_once: ${{ needs.terraform_sync_once.result }}

  platform_preflight:
    name: "Phase 4A | GoldenGate Platform Ownership Preflight"

    # Phase 3 grouping: validate_argocd_ready now lives inside the grouped Phase 3 wrapper -- both the wrapper's own overall result AND its exact internal Phase 3D result are required (never conflated), since the two are not guaranteed to mean the same thing in every failure/skip scenario.
    needs:
      - validate_model
      - phase_3_argocd
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' && needs.phase_3_argocd.result == 'success' && needs.phase_3_argocd.outputs.validate_argocd_ready_result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      state: ${{ steps.classify.outputs.state }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ needs.validate_model.outputs.selected_environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ needs.validate_model.outputs.selected_environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py ensure-kubectl

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the classify step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Classify GoldenGate Platform ownership safety
        id: classify
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py ownership-preflight --environment "${{ needs.validate_model.outputs.selected_environment }}"

  # Phase 4D | Observability Ownership Preflight -- Generic MAIN Desired-State Convergence Fix: automation/phases/phase4/observability_state.py is a pure OWNERSHIP-SAFETY classifier -- ABSENT and OWNED both reconcile via observability_sync_once below on EVERY Deploy, regardless of individual desired-state drift (chart version, image digests, the cloudwatch-agent ServiceAccount role-arn, a future new resource); BROKEN (foreign/ambiguous ownership, or a genuine inspection failure) fails closed right here, never auto-repaired. Deliberately does NOT depend on platform_preflight -- both are independent application-owned prerequisites after Argo and run in parallel. This job never mutates the cluster -- it only runs automation/phases/phase4/observability_state.py, which itself issues read-only `kubectl get` calls.
  observability_preflight:
    name: "Phase 4D | Observability Ownership Preflight"

    # Phase 3 grouping: validate_argocd_ready now lives inside the grouped Phase 3 wrapper -- both the wrapper's own overall result AND its exact internal Phase 3D result are required (never conflated), since the two are not guaranteed to mean the same thing in every failure/skip scenario.
    needs:
      - validate_model
      - phase_3_argocd
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' && needs.phase_3_argocd.result == 'success' && needs.phase_3_argocd.outputs.validate_argocd_ready_result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      state: ${{ steps.classify.outputs.state }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ needs.validate_model.outputs.selected_environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ needs.validate_model.outputs.selected_environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py ensure-tools

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the classify step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Classify Observability ownership safety
        id: classify
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py ownership-preflight --environment "${{ needs.validate_model.outputs.selected_environment }}"

  # Phase 4B | Reconcile GoldenGate Platform -- Generic MAIN Desired-State Convergence Fix: MAIN ALWAYS reconciles the Platform on Deploy whenever platform_preflight confirms it is safe (ABSENT or OWNED) -- never skipped merely because the preflight ownership classifier found the installation superficially healthy-looking. 30-sub-platform.yaml's own idempotent Argo CD sync is what actually applies the current committed desired state (Fluent Bit image/config, ServiceAccount role ARNs, any future OPTIONAL values-driven resource) -- this job never needs to learn a new resource name merely to keep permitting that reconciliation. fluentBit.create is a REQUIRED architectural invariant, not a supported optional toggle: 30-sub-platform.yaml's own post-deploy validation unconditionally requires the rendered gg-fluent-bit DaemonSet/ConfigMap/ServiceAccount to exist, so flipping fluentBit.create=false would fail that validation, not be silently pruned. Runs the reusable specialist workflow synchronously as part of this DAG -- never an asynchronous CLI/API dispatch or repository_dispatch trigger. No standalone specialist workflow is a required recovery/upgrade path -- MAIN never tells an operator to run 30-sub-platform.yaml separately to apply ordinary desired state.
  platform_sync_once:
    name: "Phase 4B | Reconcile GoldenGate Platform"

    needs:
      - validate_model
      - platform_preflight
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' && needs.platform_preflight.result == 'success' && (needs.platform_preflight.outputs.state == 'ABSENT' || needs.platform_preflight.outputs.state == 'OWNED') }}

    uses: ./.github/workflows/30-sub-platform.yaml
    with:
      environment: ${{ needs.validate_model.outputs.selected_environment }}
      deploy: true
      orchestrated_by_main: true

  # Phase 4E | Reconcile Observability -- Generic MAIN Desired-State Convergence Fix: MAIN ALWAYS reconciles Observability on Deploy whenever observability_preflight confirms it is safe (ABSENT or OWNED) -- same always-reconcile contract as platform_sync_once. 40-sub-observability.yaml's own idempotent Argo CD sync is what actually applies the current committed desired state (chart version, image digests, the cloudwatch-agent ServiceAccount role-arn, any future values-driven resource) -- this job never needs to learn a new resource name merely to keep permitting that reconciliation. No standalone specialist workflow is a required recovery/upgrade path.
  observability_sync_once:
    name: "Phase 4E | Reconcile Observability"

    needs:
      - validate_model
      - observability_preflight
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' && needs.observability_preflight.result == 'success' && (needs.observability_preflight.outputs.state == 'ABSENT' || needs.observability_preflight.outputs.state == 'OWNED') }}

    uses: ./.github/workflows/40-sub-observability.yaml
    with:
      environment: ${{ needs.validate_model.outputs.selected_environment }}
      deploy: true
      orchestrated_by_main: true

  # Phase 4C | Validate GoldenGate Platform Healthy -- always() overrides GitHub's default implicit skip-on-skipped-dependency behavior -- the explicit result check below is what actually keeps this fail-closed. platform_sync_once now ALWAYS runs for both ABSENT and OWNED (never skipped on a healthy-looking preflight), so this job's own gating simplifies to "platform_preflight succeeded and platform_sync_once succeeded" -- the strict exact-desired-state check happens entirely in the classify step below (automation/phases/phase4/platform_acceptance.py), independent of which preflight state was observed. Reconciliation success alone is never treated as proof of health.
  validate_platform_ready:
    name: "Phase 4C | Validate GoldenGate Platform Healthy"

    needs:
      - validate_model
      - platform_preflight
      - platform_sync_once
    if: ${{ always() && needs.validate_model.outputs.effective_deploy == 'true' && needs.platform_preflight.result == 'success' && needs.platform_sync_once.result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ needs.validate_model.outputs.selected_environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ needs.validate_model.outputs.selected_environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py ensure-kubectl

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the strict-acceptance step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Require GoldenGate Platform to be exactly HEALTHY
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
          # Read through a step-level environment variable, never interpolated directly into a shell statement or hardcoded here -- the same external-operational-configuration pattern 30-sub-platform.yaml itself uses for this variable. phase4_platform.py strict-acceptance validates it is non-empty before use.
          FLUENT_BIT_IMAGE: ${{ vars.FLUENT_BIT_IMAGE }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py strict-acceptance --environment "${{ needs.validate_model.outputs.selected_environment }}"

  # Phase 4F | Validate Observability Healthy -- always() overrides GitHub's default implicit skip-on-skipped-dependency behavior -- the explicit result check below is what actually keeps this fail-closed. observability_sync_once now ALWAYS runs for both ABSENT and OWNED (never skipped on a healthy-looking preflight), so this job's own gating simplifies to "observability_preflight succeeded and observability_sync_once succeeded" -- the strict exact-desired-state check happens entirely in the classify step below (automation/phases/phase4/observability_acceptance.py), independent of which preflight state was observed. Reconciliation success alone is never treated as proof of health.
  validate_observability_ready:
    name: "Phase 4F | Validate Observability Healthy"

    needs:
      - validate_model
      - observability_preflight
      - observability_sync_once
    if: ${{ always() && needs.validate_model.outputs.effective_deploy == 'true' && needs.observability_preflight.result == 'success' && needs.observability_sync_once.result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ needs.validate_model.outputs.selected_environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ needs.validate_model.outputs.selected_environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py ensure-tools

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the strict-acceptance step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Require Observability to be exactly HEALTHY
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py strict-acceptance --environment "${{ needs.validate_model.outputs.selected_environment }}"

  # Phase 4G | Validate Shared GoldenGate Secrets -- joins both the Platform and Observability branches before runtime work. Live Deployment Approval Topology Fix: no job-level environment: here -- this job is read-only (only validates that the three shared secrets already exist, never creates/mutates them), consumes only the proven repository-scoped vars.PROJECT_NAME_DEV, and is already covered end-to-end by the single goldengate_deploy_authorization approval upstream of it in the DAG.
  validate_shared_secrets_once:
    name: "Phase 4G | Validate Shared GoldenGate Secrets"

    needs:
      - validate_model
      - terraform_sync_once
      - validate_platform_ready
      - validate_observability_ready
    # Mode-aware gating preserved exactly: runs when terraform/platform/observability were legitimately skipped (deploy=false, MAIN Validate mode) -- but for a real deploy (effective_deploy=='true'), "skipped" is NOT success: this job must not run unless terraform_sync_once AND validate_platform_ready AND validate_observability_ready all actually succeeded, closing the path where an inventory-guard/terraform/platform/observability failure upstream (which makes those jobs skip rather than fail their own dependents) would otherwise let this read-only check -- and everything downstream of it -- proceed anyway.
    if: ${{ always() && needs.validate_model.result == 'success' && (needs.validate_model.outputs.effective_deploy != 'true' || (needs.terraform_sync_once.result == 'success' && needs.validate_platform_ready.result == 'success' && needs.validate_observability_ready.result == 'success')) }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ needs.validate_model.outputs.selected_environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ needs.validate_model.outputs.selected_environment }}" github-env >> "$GITHUB_ENV"

      - name: Verify Python prerequisites
        shell: bash
        run: |
          set -euo pipefail

          python3 --version

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials (the source/build-account RUNNER_ROLE_ARN identity) are consumed ONLY by the validate step below, never job-wide, never written to $GITHUB_ENV. phase4_shared_secrets.py itself performs the subsequent sts:AssumeRole into EKS_DEPLOY_ROLE_ARN (the workload account) and confines those assumed credentials to a single subprocess-local environment mapping -- never GITHUB_ENV, never GITHUB_OUTPUT, never this job's own step-level env.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Validate shared GoldenGate secrets
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_shared_secrets.py validate --environment "${{ needs.validate_model.outputs.selected_environment }}"

  runtime_ownership_preflight:
    name: "Phase 5A | GoldenGate Runtime Ownership Preflight"

    # Phase 5A: read-only pre-reconciliation ownership-safety classifier for the deployment(s) THIS RUN is about to reconcile -- ABSENT (safe to create) / OWNED (safe to reconcile, even if currently unhealthy/out of date) / BROKEN (ownership/collision conflict, fail closed). This is deliberately NOT a HEALTHY-skip prerequisite: a GoldenGate runtime is an actual desired deployment target whose descriptor/image/chart may intentionally change on every run, so OWNED (not HEALTHY) is the "proceed" state here. This job never mutates the cluster -- it only runs automation/phases/phase5/phase5_runtime.py ownership-preflight, which itself issues read-only `kubectl get` calls via automation/phases/phase5/runtime_state.py.
    needs:
      - validate_model
      - validate_shared_secrets_once
    if: ${{ needs.validate_model.result == 'success' && needs.validate_model.outputs.effective_deploy == 'true' && needs.validate_model.outputs.has_changes == 'true' && needs.validate_shared_secrets_once.result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Live Deployment Approval Topology Fix: no job-level environment: here (and deliberately not per-matrix-entry either) -- this job is read-only ownership classification, never a mutation, and a future multi-runtime matrix must never generate one approval per runtime; it is already covered end-to-end by the single goldengate_deploy_authorization approval upstream of it in the DAG.
    strategy:
      # Same sequential/fail-fast safety posture as the runtime rollout it gates: an ownership conflict on one deployment must not be masked by a concurrently-evaluated sibling.
      fail-fast: true
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.validate_model.outputs.deployment_matrix) }}

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail -- matrix jobs draw the selected environment from their own matrix entry, never needs.validate_model.outputs.selected_environment.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py ensure-kubectl

      # AWS Credential Isolation: these temporary credentials are consumed ONLY by the classify step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Classify runtime ownership safety
        id: classify
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py ownership-preflight \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

  build_publish_and_deploy:
    name: "Phase 5B | Build, Validate & Reconcile GoldenGate Runtimes"

    needs:
      - validate_model
      - validate_shared_secrets_once
      - runtime_ownership_preflight
    # Requires validate_shared_secrets_once.result == 'success' (never the weaker "not failure/not cancelled"): that job is itself now fail-closed for a real deploy (see its own if:), so requiring its strict success here is what actually closes the deploy=true path -- a failed/skipped storage guard or terraform/platform sync upstream now reliably prevents this job from building/deploying anything, while deploy=false's legitimate skip-terraform/platform path still resolves validate_shared_secrets_once to 'success' and this job still runs its read-only/dry-run path. Phase 5A: the live runtime_ownership_preflight is required ONLY on a real deploy (it never even runs on deploy=false, since its own if: is effective_deploy-gated) -- the `effective_deploy != 'true' || runtime_ownership_preflight.result == 'success'` clause below is what keeps the existing offline Helm lint/render dry-run path completely unaffected by it, while a real deploy is blocked whenever ownership safety was not confirmed ABSENT/OWNED.
    if: ${{ always() && needs.validate_model.result == 'success' && needs.validate_model.outputs.has_changes == 'true' && needs.validate_shared_secrets_once.result == 'success' && (needs.validate_model.outputs.effective_deploy != 'true' || needs.runtime_ownership_preflight.result == 'success') }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Live Deployment Approval Topology Fix: no job-level environment: here (and deliberately not per-matrix-entry either) -- this is the direct MAIN runtime deployment job, and a real rollout of N selected runtimes must never generate N approvals; the whole rollout is already authorized end-to-end by the single goldengate_deploy_authorization approval upstream of it in the DAG, fixed now (not deferred to a future runtime-activation phase).
    strategy:
      # Sequential rollout: an existing-runtime migration failure must block the next queued migration; max-parallel alone is not sufficient.
      fail-fast: true
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.validate_model.outputs.deployment_matrix) }}

    concurrency:
      group: goldengate-helm-deploy-${{ github.ref }}-${{ matrix.environment }}-${{ matrix.deployment_id }}
      cancel-in-progress: false

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail -- matrix jobs draw the selected environment from their own matrix entry, never needs.validate_model.outputs.selected_environment.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ matrix.environment }}
      ENABLE_TEMP_ARGOCD_ECR_PASSWORD_INJECTION: ${{ vars.ENABLE_TEMP_ARGOCD_ECR_PASSWORD_INJECTION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Ensure Helm/kubectl prerequisites
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py ensure-deploy-tools

      - name: Prepare runtime deployment state
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py prepare-deployment \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}" \
            --deployment-model "${{ matrix.deployment_model }}" \
            --deploy "${{ matrix.deploy }}"

      # AWS Credential Isolation: these temporary credentials are consumed ONLY by resolve-live-inputs below (and, on Deploy, by publish-chart/validate-cluster-prerequisites/reconcile-runtime/post-deploy-diagnostics later in this job) -- never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Resolve and verify live AWS inputs
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py resolve-live-inputs \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

      - name: Render, validate and package runtime locally
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py validate-local \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

      - name: Publish runtime Helm chart to private ECR
        if: ${{ matrix.deploy }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py publish-chart \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

      - name: Validate live EKS runtime prerequisites
        if: ${{ matrix.deploy }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py validate-cluster-prerequisites \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

      - name: Reconcile runtime through Argo CD
        if: ${{ matrix.deploy }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py reconcile-runtime \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

      - name: Post-deployment diagnostics
        if: ${{ matrix.deploy }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py post-deploy-diagnostics \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

      - name: Upload rendered manifests and chart package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldengate-helm-artifacts-${{ matrix.environment }}-${{ matrix.deployment_id }}
          path: |
            rendered/
            packaged/
            pulled/
          if-no-files-found: warn
          retention-days: 7

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py summary --mode reconcile \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

  delete_removed_argocd_applications:
    name: "Phase 5C | Remove Undesired GoldenGate Runtimes"

    # GoldenGate Runtime Presence Contract -- Final Safety Correction, Gap 1: this job performs the SAME class of consequential Kubernetes mutation (kubectl patch/delete application) as build_publish_and_deploy, but previously ran the instant Phase 1's deployment-detection step alone succeeded with a non-empty deletion_matrix -- entirely bypassing MAIN's single GoldenGate application deployment authorization (goldengate_deploy_authorization) and the post-reconciliation Argo CD HEALTHY acceptance gate (validate_argocd_ready). Runtime removal must not mutate Kubernetes until the normal MAIN deployment authorization has succeeded, exactly like every other mutating job in this DAG. Phase 3 grouping: that entire authorization chain (terraform_sync_once -> argocd_preflight -> goldengate_deploy_authorization -> reconcile_argocd -> validate_argocd_ready) now lives behind the Phase 3 reusable-workflow boundary -- proving it here requires BOTH the wrapper's own overall result AND its exact internal Phase 3D result explicitly, never a bare needs: reference alone, since the two are not guaranteed to mean the same thing in every failure/skip scenario. Deliberately does NOT depend on Phase 4 (platform/observability/shared secrets) -- runtime removal is not serialized behind them.
    needs:
      - validate_model
      - phase_3_argocd
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.validate_model.outputs.effective_deploy == 'true' && needs.validate_model.outputs.has_deletions == 'true' && needs.phase_3_argocd.result == 'success' && needs.phase_3_argocd.outputs.validate_argocd_ready_result == 'success'

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.validate_model.outputs.deletion_matrix) }}

    concurrency:
      group: goldengate-argocd-delete-${{ github.ref }}-${{ matrix.environment }}-${{ matrix.deployment_id }}
      cancel-in-progress: false

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail -- matrix jobs draw the selected environment from their own matrix entry, never needs.validate_model.outputs.selected_environment.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py ensure-kubectl

      - name: Prepare removal state
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py prepare-removal \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}" \
            --deployment-model "${{ matrix.deployment_model }}" \
            --efs-mode "${{ matrix.efs_mode }}" \
            --reason "${{ matrix.reason }}"

      # AWS Credential Isolation: these temporary credentials are consumed ONLY by removal-preflight/remove-runtime/post-delete-acceptance below -- never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Classify removal safety
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py removal-preflight \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

      - name: Remove owned runtime Application
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py remove-runtime \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

      - name: Verify runtime compute absence
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py post-delete-acceptance \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py summary --mode remove \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

  validate_active_runtimes:
    name: "Phase 5D | Validate Active GoldenGate Runtimes Healthy"

    # Phase 5D: post-reconciliation runtime acceptance -- HEALTHY/BROKEN only (never ABSENT: an active desired runtime that is missing IS BROKEN). Deliberately uses needs.validate_model.outputs.active_runtime_matrix (the GLOBAL canonical registry), never needs.validate_model.outputs.deployment_matrix (only the deployments THIS RUN selected) -- an unchanged active runtime must be validated too, or MAIN could claim end-to-end success while a previously-deployed runtime silently degraded. This job never mutates the cluster or AWS -- automation/phases/phase5/runtime_acceptance.py's Kubernetes calls are read-only `kubectl get`, and any managed-EFS filesystem ID is resolved via a single read-only elasticfilesystem:DescribeFileSystems call inside automation/phases/phase5/phase5_runtime.py strict-acceptance, never via EFS mutation.
    needs:
      - validate_model
      - validate_shared_secrets_once
      - build_publish_and_deploy
      - delete_removed_argocd_applications
    # always() so a legitimately-skipped build_publish_and_deploy (nothing changed this run) does not itself suppress acceptance of the OTHER active runtimes -- only an actual build failure/cancellation blocks this job. has_active_deployments=='false' cleanly skips the whole job rather than attempting an empty matrix.
    if: ${{ always() && needs.validate_model.outputs.effective_deploy == 'true' && needs.validate_model.outputs.has_active_deployments == 'true' && needs.validate_shared_secrets_once.result == 'success' && needs.build_publish_and_deploy.result != 'failure' && needs.build_publish_and_deploy.result != 'cancelled' && needs.delete_removed_argocd_applications.result != 'failure' && needs.delete_removed_argocd_applications.result != 'cancelled' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Live Deployment Approval Topology Fix: no job-level environment: here (and deliberately not per-matrix-entry either) -- this job is read-only global acceptance validation, never a mutation, and must never generate one approval per active runtime; it is already covered end-to-end by the single goldengate_deploy_authorization approval upstream of it in the DAG.
    strategy:
      # One matrix item per active deployment in the GLOBAL canonical registry; sequential/fail-fast so a BROKEN runtime is reported clearly rather than racing diagnostics from a concurrently-evaluated sibling.
      fail-fast: true
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.validate_model.outputs.active_runtime_matrix) }}

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail -- matrix jobs draw the selected environment from their own matrix entry, never needs.validate_model.outputs.selected_environment.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py ensure-kubectl

      # AWS Credential Isolation: these temporary credentials are consumed ONLY by the strict-acceptance step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Require runtime to be exactly HEALTHY
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase5/phase5_runtime.py strict-acceptance \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --deployment-id "${{ matrix.deployment_id }}"

  replication_reconcile_once:
    name: "Phase 6A | Reconcile GoldenGate Replication Pipelines"

    needs:
      - validate_model
      - validate_shared_secrets_once
      - build_publish_and_deploy
      - delete_removed_argocd_applications
      - validate_active_runtimes
    # Phase B3A: replication must wait for the GLOBAL active-runtime acceptance gate -- when active deployments exist, validate_active_runtimes.result == 'success' is required; when none exist, the existing clean no-op replication behaviour is preserved unchanged (validate_active_runtimes itself does not even run in that case, so it is excluded from the requirement entirely rather than merely tolerated as skipped).
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' && always() && needs.validate_shared_secrets_once.result == 'success' && needs.build_publish_and_deploy.result != 'failure' && needs.build_publish_and_deploy.result != 'cancelled' && needs.delete_removed_argocd_applications.result != 'failure' && needs.delete_removed_argocd_applications.result != 'cancelled' && (needs.validate_model.outputs.has_active_deployments != 'true' || needs.validate_active_runtimes.result == 'success') }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ needs.validate_model.outputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      # Phase 6 Python Conversion: pipeline discovery happens LOCALLY (automation/goldengate-deployment-model.py validate + replication-pipelines only), entirely BEFORE any AWS credential is configured or EKS connection attempted -- a true zero-pipeline run (the CURRENT state of both active runtime descriptors) never touches AWS/kubectl at all, not merely skips the reconciliation loop after already connecting.
      - name: Discover enabled replication pipelines
        id: replication_discovery
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase6/phase6_replication.py discover --environment "${GG_SELECTED_ENVIRONMENT}"

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the reconciliation step below, never job-wide, never written to $GITHUB_ENV, never written to any state file. Gated on has_pipelines == 'true' -- a zero-pipeline run never configures AWS credentials at all.
      - name: Configure AWS credentials
        if: steps.replication_discovery.outputs.has_pipelines == 'true'
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Reconcile enabled replication pipelines sequentially
        if: steps.replication_discovery.outputs.has_pipelines == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase6/phase6_replication.py reconcile \
            --environment "${GG_SELECTED_ENVIRONMENT}" \
            --execution-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: No replication pipeline enabled
        if: steps.replication_discovery.outputs.has_pipelines == 'false'
        shell: bash
        run: |
          echo "No enabled replication pipeline -- clean no-op: no Job created, no existing runtime changed."

  replication_dry_run_validation:
    name: "Phase 6B | Validate GoldenGate Replication Manifests"

    needs:
      - validate_model
      - validate_shared_secrets_once
      - build_publish_and_deploy
      - delete_removed_argocd_applications
    if: ${{ needs.validate_model.outputs.effective_deploy == 'false' && always() && needs.validate_shared_secrets_once.result == 'success' && needs.build_publish_and_deploy.result != 'failure' && needs.build_publish_and_deploy.result != 'cancelled' && needs.delete_removed_argocd_applications.result != 'failure' && needs.delete_removed_argocd_applications.result != 'cancelled' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Live Validate Fix 3: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail. A step-level env: binding is scoped to that one step only and does not propagate to later steps, which is exactly the "GG_SELECTED_ENVIRONMENT: unbound variable" defect the real VDR Validate run hit here.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ needs.validate_model.outputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      # Phase 6 Python Conversion: Validate mode remains completely local/read-only -- phase6_replication.py validate-local re-derives model validation + pipeline discovery + per-pipeline dry-run rendering + the SAME structural manifest validation Deploy uses, entirely offline; no aws command, no kubectl command, no cluster dependency anywhere in this job.
      - name: Validate GoldenGate replication locally
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase6/phase6_replication.py validate-local --environment "${GG_SELECTED_ENVIRONMENT}"

  phase_7_monitor_final_acceptance:
    name: Phase 7 | GoldenGate Monitor & Final Acceptance

    # Phase 7 grouping: this single caller replaces the seven Phase 7A-7G jobs previously defined directly in MAIN -- their exact behavior now lives, unchanged, inside .github/workflows/70-phase-monitor-final-acceptance.yaml (the same high-level reusable-workflow presentation pattern Phase 2 already uses for terraform_sync_once -> 10-sub-iam-secrets.yaml). This job must depend on every external job whose .result the grouped Phase 7 workflow or its final_validation step needs -- a reusable workflow's own needs.* context sees only jobs INSIDE that workflow, so every one of these twelve results is passed through explicitly as a workflow_call input below, never re-derived. Phase 3 grouping: validate_argocd_ready is replaced by phase_3_argocd here -- one dependency swapped, never dropped; the Phase 7 wrapper's own result_validate_argocd_ready input name is unchanged (see the with: block below for the exact fallback expression that preserves the old semantic result).
    needs:
      - validate_model
      - terraform_sync_once
      - validate_shared_secrets_once
      - phase_3_argocd
      - validate_platform_ready
      - validate_observability_ready
      - runtime_ownership_preflight
      - build_publish_and_deploy
      - delete_removed_argocd_applications
      - validate_active_runtimes
      - replication_reconcile_once
      - replication_dry_run_validation
    # GoldenGate Monitor MAIN DAG Skip-Propagation Correctness Fix, preserved across the reusable-workflow boundary: this if: must remain always() so the grouped Phase 7 workflow still executes when one of these twelve external jobs legitimately SKIPPED/FAILED/CANCELLED, allowing Phase 7G's own fail-closed mode-aware final-validation contract to run and report the exact reason -- GitHub's implicit "all needs succeeded" default must never silently suppress the entire Phase 7 workflow.
    if: always()

    uses: ./.github/workflows/70-phase-monitor-final-acceptance.yaml
    with:
      selected_environment: ${{ needs.validate_model.outputs.selected_environment }}
      effective_deploy: ${{ needs.validate_model.outputs.effective_deploy }}
      has_active_deployments: ${{ needs.validate_model.outputs.has_active_deployments }}
      has_changes: ${{ needs.validate_model.outputs.has_changes }}
      has_deletions: ${{ needs.validate_model.outputs.has_deletions }}
      result_validate_model: ${{ needs.validate_model.result }}
      result_terraform_sync_once: ${{ needs.terraform_sync_once.result }}
      result_validate_shared_secrets_once: ${{ needs.validate_shared_secrets_once.result }}
      # Phase 3 grouping: prefer the exact internal Phase 3D result when the Phase 3 wrapper actually ran it; fall back to the wrapper's own overall result (e.g. "skipped") only when validate_argocd_ready_result itself is absent (the whole Phase 3 wrapper was legitimately skipped, so it never produced this output at all). Never pass only needs.phase_3_argocd.result -- an earlier internal Phase 3 failure can fail the wrapper while validate_argocd_ready itself is genuinely SKIPPED, and phase7_final.py intentionally distinguishes those states.
      result_validate_argocd_ready: ${{ needs.phase_3_argocd.outputs.validate_argocd_ready_result || needs.phase_3_argocd.result }}
      result_validate_platform_ready: ${{ needs.validate_platform_ready.result }}
      result_validate_observability_ready: ${{ needs.validate_observability_ready.result }}
      result_runtime_ownership_preflight: ${{ needs.runtime_ownership_preflight.result }}
      result_build_publish_and_deploy: ${{ needs.build_publish_and_deploy.result }}
      result_delete_removed_argocd_applications: ${{ needs.delete_removed_argocd_applications.result }}
      result_validate_active_runtimes: ${{ needs.validate_active_runtimes.result }}
      result_replication_reconcile_once: ${{ needs.replication_reconcile_once.result }}
      result_replication_dry_run_validation: ${{ needs.replication_dry_run_validation.result }}
