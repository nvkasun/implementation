name: "00 | MAIN | GoldenGate EKS End-to-End Deployment"

# Live Deploy UX Fix 2: action-aware and neutral -- never claims "deploy" for a validate-only manual run, and never claims a specific deployment ID for an environment-wide run (deployment_id left blank); Destroy is deliberately never named here yet, the eventual Validate/Deploy/Destroy lifecycle UI is added only once Destroy itself is implemented. Live Deploy Fix 5: the governance-override fragment only ever appears (as a bare "governance-override=true" flag, never the written reason -- that stays in the audited workflow inputs/corporate attestation) when this is a manual workflow_dispatch run with the input literally true; every other run's title is byte-for-byte unchanged from before this task.
run-name: "MAIN | GoldenGate EKS | action=${{ github.event_name == 'workflow_dispatch' && inputs.action || 'deploy' }} | ${{ github.event_name == 'workflow_dispatch' && (inputs.deployment_id != '' && inputs.deployment_id || 'environment-wide') || format('auto: envs/dev changes on {0}', github.sha) }}${{ (github.event_name == 'workflow_dispatch' && inputs.terraform_governance_override == true) && ' | governance-override=true' || '' }} | ran by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev

      action:
        description: "GoldenGate lifecycle action"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - deploy

      deployment_id:
        description: "Optional GoldenGate runtime deployment ID. Leave blank to converge the complete selected environment and all enabled GoldenGate runtimes."
        required: false
        type: string
        default: ""

      terraform_governance_override:
        description: >
          Authorized Terraform governance break-glass override for the corporate
          reusable workflow. Leave false for normal execution.
        required: false
        type: boolean
        default: false

      terraform_governance_override_reason:
        description: >
          Required written justification when Terraform governance override is
          enabled.
        required: false
        type: string
        default: ""

  push:
    branches:
      - main
    paths:
      - 'envs/dev/**'
      - 'helm/goldengate/**'

permissions:
  id-token: write
  contents: read

# Environment-level protection: only one orchestrator run per branch mutates dev at a time.
concurrency:
  group: goldengate-eks-app-orchestrator-dev-${{ github.ref }}
  cancel-in-progress: false

# PHASE-ORIENTED ORCHESTRATION (non-functional readability refactor): MAIN itself now only calls seven phase-level reusable workflows (01-07) plus Final Validation -- the ~30 individual implementation jobs those phases used to contain directly now live inside 01-phase-readiness-safety.yaml through 07-phase-monitor-acceptance.yaml, each still calling the existing 10/20/30/40/50-sub-*.yaml specialist workflows exactly as before. Every phase-calling job below deliberately has NO explicit if: -- a job with no status-check function implicitly requires its needs (the single preceding phase) to have succeeded, which is exactly the desired fail-fast linear chain (Phase 1 -> 2 -> 3 -> 4 -> 5 -> 6 -> 7); each phase's own internal "phase contract" job (if: always()) already resolves that phase's mode-aware (Deploy vs Validate) success/failure explicitly, so a phase call itself is never ambiguously "skipped" -- only success or failure, which this simple needs-chain can safely gate on directly.
jobs:
  phase_1_readiness_safety:
    name: "Phase 1 | Environment Readiness & Safety"

    uses: ./.github/workflows/01-phase-readiness-safety.yaml
    with:
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      deployment_id: ${{ inputs.deployment_id }}
      # Booleans cannot safely cross a reusable-workflow with: boundary as an empty/undefined value (inputs.* is only populated for an actual workflow_dispatch event) -- resolved to a literal false for a push event, exactly matching Phase 1's own governance step's push-event branch.
      terraform_governance_override: ${{ github.event_name == 'workflow_dispatch' && inputs.terraform_governance_override || false }}
      terraform_governance_override_reason: ${{ inputs.terraform_governance_override_reason }}

  phase_2_aws_prerequisites:
    name: "Phase 2 | AWS Application Prerequisites"

    needs:
      - phase_1_readiness_safety

    # The called Terraform chain (via 10-sub-iam-secrets.yaml) needs packages/pull-requests beyond this job's own top-level permissions; a callee can never be elevated above its caller, so this phase call must carry them explicitly.
    permissions:
      id-token: write
      contents: read
      packages: write
      pull-requests: read

    uses: ./.github/workflows/02-phase-aws-prerequisites.yaml
    secrets: inherit
    with:
      selected_environment: ${{ needs.phase_1_readiness_safety.outputs.selected_environment }}
      effective_deploy: ${{ needs.phase_1_readiness_safety.outputs.effective_deploy }}
      has_active_deployments: ${{ needs.phase_1_readiness_safety.outputs.has_active_deployments }}
      active_runtime_matrix: ${{ needs.phase_1_readiness_safety.outputs.active_runtime_matrix }}
      terraform_governance_override: ${{ needs.phase_1_readiness_safety.outputs.terraform_governance_override }}
      terraform_governance_override_reason: ${{ needs.phase_1_readiness_safety.outputs.terraform_governance_override_reason }}
      has_changes: ${{ needs.phase_1_readiness_safety.outputs.has_changes }}
      deployment_matrix: ${{ needs.phase_1_readiness_safety.outputs.deployment_matrix }}
      has_deletions: ${{ needs.phase_1_readiness_safety.outputs.has_deletions }}
      deletion_matrix: ${{ needs.phase_1_readiness_safety.outputs.deletion_matrix }}

  phase_3_argocd:
    name: "Phase 3 | Argo CD Bootstrap & Acceptance"

    needs:
      - phase_2_aws_prerequisites

    uses: ./.github/workflows/03-phase-argocd.yaml
    secrets: inherit
    with:
      selected_environment: ${{ needs.phase_2_aws_prerequisites.outputs.selected_environment }}
      effective_deploy: ${{ needs.phase_2_aws_prerequisites.outputs.effective_deploy }}
      has_active_deployments: ${{ needs.phase_2_aws_prerequisites.outputs.has_active_deployments }}
      active_runtime_matrix: ${{ needs.phase_2_aws_prerequisites.outputs.active_runtime_matrix }}
      has_changes: ${{ needs.phase_2_aws_prerequisites.outputs.has_changes }}
      deployment_matrix: ${{ needs.phase_2_aws_prerequisites.outputs.deployment_matrix }}
      has_deletions: ${{ needs.phase_2_aws_prerequisites.outputs.has_deletions }}
      deletion_matrix: ${{ needs.phase_2_aws_prerequisites.outputs.deletion_matrix }}

  phase_4_platform_observability:
    name: "Phase 4 | GoldenGate Platform & Observability"

    needs:
      - phase_3_argocd

    uses: ./.github/workflows/04-phase-platform-observability.yaml
    with:
      selected_environment: ${{ needs.phase_3_argocd.outputs.selected_environment }}
      effective_deploy: ${{ needs.phase_3_argocd.outputs.effective_deploy }}
      has_active_deployments: ${{ needs.phase_3_argocd.outputs.has_active_deployments }}
      active_runtime_matrix: ${{ needs.phase_3_argocd.outputs.active_runtime_matrix }}
      has_changes: ${{ needs.phase_3_argocd.outputs.has_changes }}
      deployment_matrix: ${{ needs.phase_3_argocd.outputs.deployment_matrix }}
      has_deletions: ${{ needs.phase_3_argocd.outputs.has_deletions }}
      deletion_matrix: ${{ needs.phase_3_argocd.outputs.deletion_matrix }}

  phase_5_runtimes:
    name: "Phase 5 | GoldenGate Runtime Deployment"

    needs:
      - phase_4_platform_observability

    uses: ./.github/workflows/05-phase-runtimes.yaml
    with:
      selected_environment: ${{ needs.phase_4_platform_observability.outputs.selected_environment }}
      effective_deploy: ${{ needs.phase_4_platform_observability.outputs.effective_deploy }}
      has_active_deployments: ${{ needs.phase_4_platform_observability.outputs.has_active_deployments }}
      active_runtime_matrix: ${{ needs.phase_4_platform_observability.outputs.active_runtime_matrix }}
      has_changes: ${{ needs.phase_4_platform_observability.outputs.has_changes }}
      deployment_matrix: ${{ needs.phase_4_platform_observability.outputs.deployment_matrix }}
      has_deletions: ${{ needs.phase_4_platform_observability.outputs.has_deletions }}
      deletion_matrix: ${{ needs.phase_4_platform_observability.outputs.deletion_matrix }}

  phase_6_replication:
    name: "Phase 6 | Replication Reconciliation"

    needs:
      - phase_5_runtimes

    uses: ./.github/workflows/06-phase-replication.yaml
    with:
      selected_environment: ${{ needs.phase_5_runtimes.outputs.selected_environment }}
      effective_deploy: ${{ needs.phase_5_runtimes.outputs.effective_deploy }}
      has_active_deployments: ${{ needs.phase_5_runtimes.outputs.has_active_deployments }}

  phase_7_monitor_acceptance:
    name: "Phase 7 | Shared Monitor & End-to-End Acceptance"

    needs:
      - phase_6_replication

    uses: ./.github/workflows/07-phase-monitor-acceptance.yaml
    with:
      selected_environment: ${{ needs.phase_6_replication.outputs.selected_environment }}
      effective_deploy: ${{ needs.phase_6_replication.outputs.effective_deploy }}
      has_active_deployments: ${{ needs.phase_6_replication.outputs.has_active_deployments }}

  final_validation:
    name: "Final Validation"

    # Phase B3B closeout (preserved through the phase refactor): ALWAYS runs (never itself conditionally skipped by GitHub's default implicit "all needs succeeded" behavior) so it can fail CLOSED -- with a clean phase-level summary -- when a phase did not complete successfully, rather than final_validation itself silently disappearing.
    needs:
      - phase_1_readiness_safety
      - phase_2_aws_prerequisites
      - phase_3_argocd
      - phase_4_platform_observability
      - phase_5_runtimes
      - phase_6_replication
      - phase_7_monitor_acceptance
    if: always()

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    env:
      GG_SELECTED_ENVIRONMENT: ${{ needs.phase_1_readiness_safety.outputs.selected_environment }}

    steps:
      - name: Validate that every phase completed successfully
        shell: bash
        env:
          RESULT_phase_1_readiness_safety: ${{ needs.phase_1_readiness_safety.result }}
          RESULT_phase_2_aws_prerequisites: ${{ needs.phase_2_aws_prerequisites.result }}
          RESULT_phase_3_argocd: ${{ needs.phase_3_argocd.result }}
          RESULT_phase_4_platform_observability: ${{ needs.phase_4_platform_observability.result }}
          RESULT_phase_5_runtimes: ${{ needs.phase_5_runtimes.result }}
          RESULT_phase_6_replication: ${{ needs.phase_6_replication.result }}
          RESULT_phase_7_monitor_acceptance: ${{ needs.phase_7_monitor_acceptance.result }}
        run: |
          set -euo pipefail

          FAILED="false"

          require_phase() {
            local phase_key="$1"
            local display_name="$2"
            local result_var="RESULT_${phase_key}"
            local result="${!result_var}"
            if [ "$result" != "success" ]; then
              echo "FAIL: Phase ${display_name} did not complete successfully; downstream deployment state is not accepted (result='${result}')."
              FAILED="true"
            else
              echo "OK: Phase ${display_name} completed successfully."
            fi
          }

          require_phase phase_1_readiness_safety "1 | Environment Readiness & Safety"
          require_phase phase_2_aws_prerequisites "2 | AWS Application Prerequisites"
          require_phase phase_3_argocd "3 | Argo CD Bootstrap & Acceptance"
          require_phase phase_4_platform_observability "4 | GoldenGate Platform & Observability"
          require_phase phase_5_runtimes "5 | GoldenGate Runtime Deployment"
          require_phase phase_6_replication "6 | Replication Reconciliation"
          require_phase phase_7_monitor_acceptance "7 | Shared Monitor & End-to-End Acceptance"

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "FAIL: one or more phases did not complete successfully -- see diagnostics above. MAIN cannot claim deployment success. Detailed job-level diagnosis remains available inside the corresponding phase workflow run."
            exit 1
          fi

          echo ""
          echo "OK: every phase completed successfully."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Re-validate the folder-driven deployment model after rollout
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.1"
          python3 hack/goldengate-deployment-model.py --environment "${GG_SELECTED_ENVIRONMENT}" validate

      - name: Orchestrator summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### GoldenGate onboarding orchestrator summary"
            echo ""
            echo "Phase 1 | Environment Readiness & Safety -> Phase 2 | AWS Application Prerequisites -> Phase 3 | Argo CD Bootstrap & Acceptance -> Phase 4 | GoldenGate Platform & Observability -> Phase 5 | GoldenGate Runtime Deployment -> Phase 6 | Replication Reconciliation -> Phase 7 | Shared Monitor & End-to-End Acceptance -> Final Validation"
            echo ""
            echo "All required stages completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"
