name: "00 | MAIN | GoldenGate EKS End-to-End Deployment"

run-name: "MAIN | GoldenGate Helm build and deploy | ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_id || format('auto: envs/dev changes on {0}', github.sha) }} | ran by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev

      deployment_id:
        description: "Unique GoldenGate deployment ID, example: gg-oracle-payments-01"
        required: true
        type: string
        default: gg-oracle-payments-01

      deploy:
        description: "Deploy to EKS after publishing Helm chart"
        required: true
        type: boolean
        default: true

  push:
    branches:
      - main
    paths:
      - 'envs/dev/**'
      - 'helm/goldengate/**'

permissions:
  id-token: write
  contents: read

# Environment identity is loaded per-job via hack/goldengate-environment.py github-env after checkout (GITHUB_ENV is job-local), never duplicated here.
env:
  HELM_OCI_NAMESPACE: helm
  CHART_NAME: goldengate
  HELM_CHART_PATH: helm/goldengate
  ENVS_ROOT: envs

# Environment-level protection: only one orchestrator run per branch mutates dev at a time.
concurrency:
  group: goldengate-eks-app-orchestrator-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_model:
    name: Validate the folder-driven deployment model

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      effective_deploy: ${{ steps.compute.outputs.effective_deploy }}
      has_active_deployments: ${{ steps.active_runtime_state.outputs.has_active_deployments }}
      active_runtime_matrix: ${{ steps.active_runtime_state.outputs.active_runtime_matrix }}
      selected_environment: ${{ steps.resolve_environment.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python and PyYAML prerequisites
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v python3 >/dev/null 2>&1; then
            echo "FAIL: python3 is required and is not available on this runner."
            exit 1
          fi

          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            echo "FAIL: PyYAML is required and is not available on this runner."
            exit 1
          fi

          echo "OK: python3 and PyYAML are available."

      - name: Resolve selected environment
        id: resolve_environment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          # workflow_dispatch carries an explicit choice; the push trigger is scoped to envs/dev/** only, so the trigger itself selects dev -- never a second independent environment source.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SELECTED_ENVIRONMENT="$INPUT_ENVIRONMENT"
          else
            SELECTED_ENVIRONMENT="dev"
          fi

          echo "GG_SELECTED_ENVIRONMENT=${SELECTED_ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "environment=${SELECTED_ENVIRONMENT}" >> "$GITHUB_OUTPUT"

      - name: Validate the folder-driven deployment model
        shell: bash
        run: |
          set -euo pipefail

          # Fail-closed gate: no downstream job runs while any envs/<environment>/*/values.yaml descriptor is invalid.
          python3 hack/goldengate-deployment-model.py --environment "${GG_SELECTED_ENVIRONMENT}" validate

      - name: Validate and load the selected environment configuration
        id: load_environment
        shell: bash
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" validate
          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Verify generated IAM policies are in sync with environment.yaml
        shell: bash
        run: |
          set -euo pipefail

          # Fails closed if envs/<environment>/policies/**/assume_role_policy/sts.json or policies_1.json were hand-edited out of step with environment.yaml (for example, after eks.oidcIssuer changed) -- the fix is `render-iam-policies --write`, never a manual JSON edit.
          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" render-iam-policies --check

      - name: Determine active GoldenGate runtime state
        id: active_runtime_state
        shell: bash
        run: |
          set -euo pipefail

          # GLOBAL folder-driven desired state (not deployment_matrix, which only reflects deployments selected by this push's changed files) -- the canonical registry is the single source of truth monitor_sync_once/monitor_dry_run_validation gate on below.
          TMP="$(mktemp)"
          trap 'rm -f "$TMP"' EXIT

          python3 hack/goldengate-deployment-model.py --environment "${GG_SELECTED_ENVIRONMENT}" registry --output "$TMP"

          ACTIVE_COUNT="$(python3 - "$TMP" <<'PY'
          import sys

          import yaml

          with open(sys.argv[1]) as f:
              doc = yaml.safe_load(f)

          if not isinstance(doc, dict):
              raise SystemExit("registry document is not a mapping")

          deployments = doc.get("deployments")
          if not isinstance(deployments, list):
              raise SystemExit("registry deployments is not a list")

          print(len(deployments))
          PY
          )"

          if ! [[ "$ACTIVE_COUNT" =~ ^[0-9]+$ ]]; then
            echo "FAIL: could not determine a numeric active GoldenGate runtime count from the generated registry."
            exit 1
          fi

          echo "Active GoldenGate runtime count: ${ACTIVE_COUNT}"

          if [ "$ACTIVE_COUNT" -gt 0 ]; then
            echo "has_active_deployments=true" >> "$GITHUB_OUTPUT"
          else
            echo "No active GoldenGate runtimes remain; runtime-dependent monitor stages will be skipped."
            echo "has_active_deployments=false" >> "$GITHUB_OUTPUT"
          fi

          # Phase B3A: active_runtime_matrix -- the SAME canonical registry, reshaped into {environment, deployment_id} entries -- is the GLOBAL active-runtime inventory validate_active_runtimes (post-reconciliation acceptance) consumes below. Deliberately NOT re-scanned independently: derived from the identical "$TMP" registry file has_active_deployments above already validated.
          ACTIVE_RUNTIME_MATRIX="$(python3 - "$TMP" "$GG_SELECTED_ENVIRONMENT" <<'PY'
          import json
          import sys

          import yaml

          with open(sys.argv[1]) as f:
              doc = yaml.safe_load(f)
          environment = sys.argv[2]

          deployments = doc.get("deployments")
          if not isinstance(deployments, list):
              raise SystemExit("registry deployments is not a list")

          matrix = [{"environment": environment, "deployment_id": d["name"]} for d in deployments]
          print(json.dumps(matrix, sort_keys=True))
          PY
          )"

          echo "Active GoldenGate runtime matrix: ${ACTIVE_RUNTIME_MATRIX}"
          echo "active_runtime_matrix=${ACTIVE_RUNTIME_MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Compute effective deploy flag
        id: compute
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DEPLOY: ${{ inputs.deploy }}
        run: |
          set -euo pipefail

          # A push event carries no workflow_dispatch inputs and always implies deploy=true, matching the existing detect-goldengate-deployments.sh push-path contract.
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$INPUT_DEPLOY" = "true" ]; then
            echo "effective_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "effective_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  eks_oidc_preflight:
    name: Verify live EKS cluster + OIDC issuer match the selected environment's environment.yaml (read-only)

    # Read-only DescribeCluster preflight only -- never creates/modifies EKS, the IAM OIDC provider, or any AWS resource. Skipped for deploy=false (a purely local/offline validation run) so an existing intentionally-offline dry-run path never starts requiring live AWS access. This is the critical safety gate for cluster recreation: a recreated EKS cluster keeps the SAME name but gets a DIFFERENT OIDC issuer, and every generated IRSA trust policy in envs/<environment>/policies/** is only valid for the issuer envs/<environment>/environment.yaml declares -- so this must run, and must succeed, before Terraform (which owns applying those trust policies) or any deployment can proceed.
    needs:
      - validate_model
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        env:
          GG_SELECTED_ENVIRONMENT: ${{ needs.validate_model.outputs.selected_environment }}
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Configure AWS credentials (build account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}

      - name: DescribeCluster and verify against the selected environment's environment.yaml (read-only)
        shell: bash
        env:
          GG_SELECTED_ENVIRONMENT: ${{ needs.validate_model.outputs.selected_environment }}
        run: |
          set -euo pipefail

          # Same cross-account pattern as validate_shared_secrets_once/managed_efs_inventory_guard: assume EKS_DEPLOY_ROLE_ARN, verify the assumed identity's own account, and never let the unverified job-level credentials touch EKS. Confined to this step's subshells only -- never written to $GITHUB_ENV.
          ASSUME_JSON="$(aws sts assume-role --role-arn "$EKS_DEPLOY_ROLE_ARN" --role-session-name "gg-eks-oidc-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --duration-seconds 900 --output json)"
          PRE_TMP_KEY_ID="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["Credentials"]["AccessKeyId"])' <<< "$ASSUME_JSON")"
          PRE_TMP_SECRET="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["Credentials"]["SecretAccessKey"])' <<< "$ASSUME_JSON")"
          PRE_TMP_TOKEN="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["Credentials"]["SessionToken"])' <<< "$ASSUME_JSON")"
          unset ASSUME_JSON
          echo "::add-mask::${PRE_TMP_KEY_ID}"
          echo "::add-mask::${PRE_TMP_SECRET}"
          echo "::add-mask::${PRE_TMP_TOKEN}"

          ACTUAL_ACCOUNT="$(AWS_ACCESS_KEY_ID="$PRE_TMP_KEY_ID" AWS_SECRET_ACCESS_KEY="$PRE_TMP_SECRET" AWS_SESSION_TOKEN="$PRE_TMP_TOKEN" aws sts get-caller-identity --query Account --output text --region "$AWS_REGION")"
          if [ -z "$ACTUAL_ACCOUNT" ] || [ "$ACTUAL_ACCOUNT" != "$WORKLOAD_ACCOUNT_ID" ]; then
            echo "FAIL: assumed role resolved to caller account '${ACTUAL_ACCOUNT}', expected the GoldenGate workload account ${WORKLOAD_ACCOUNT_ID}. Refusing to call DescribeCluster."
            unset PRE_TMP_KEY_ID PRE_TMP_SECRET PRE_TMP_TOKEN
            exit 1
          fi

          CLUSTER_JSON="$(AWS_ACCESS_KEY_ID="$PRE_TMP_KEY_ID" AWS_SECRET_ACCESS_KEY="$PRE_TMP_SECRET" AWS_SESSION_TOKEN="$PRE_TMP_TOKEN" aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --output json)"
          unset PRE_TMP_KEY_ID PRE_TMP_SECRET PRE_TMP_TOKEN
          export CLUSTER_JSON

          python3 - "$EKS_CLUSTER_ARN" "$EKS_OIDC_ISSUER" "$GG_SELECTED_ENVIRONMENT" <<'PYEOF'
          import json
          import os
          import sys

          expected_arn, expected_oidc_issuer, selected_environment = sys.argv[1], sys.argv[2], sys.argv[3]
          environment_yaml_path = f"envs/{selected_environment}/environment.yaml"
          cluster = json.loads(os.environ["CLUSTER_JSON"])["cluster"]

          problems = []
          if cluster.get("status") != "ACTIVE":
              problems.append(f"cluster status is {cluster.get('status')!r}, expected ACTIVE")
          if cluster.get("arn") != expected_arn:
              problems.append(f"live cluster ARN {cluster.get('arn')!r} does not match {environment_yaml_path}-derived ARN {expected_arn!r}")
          live_oidc_issuer = cluster.get("identity", {}).get("oidc", {}).get("issuer")
          if live_oidc_issuer != expected_oidc_issuer:
              problems.append(
                  "Configured EKS OIDC issuer does not match the live cluster. "
                  f"Update {environment_yaml_path} to the current EKS issuer and regenerate IAM policies before deployment. "
                  f"(live={live_oidc_issuer!r}, configured={expected_oidc_issuer!r})"
              )

          if problems:
              for p in problems:
                  print(f"FAIL: {p}")
              sys.exit(1)
          print(f"OK: live EKS cluster {cluster.get('name')!r} is ACTIVE, ARN and OIDC issuer match {environment_yaml_path}.")
          PYEOF

  terraform_sync_once:
    name: Synchronize Terraform (once per environment)

    # Must observe detect_changed_deployments' deletion_matrix and storage_transition_violations (via managed_efs_deletion_guard and storage_transition_guard) plus the persistent AWS-side orphan check (managed_efs_inventory_guard) plus the live EKS/OIDC preflight before any Terraform apply can run, or a physically-deleted persistence.efs.mode=managed descriptor, an unsafe managed<->existing/fileSystemId mutation, an AWS-side orphaned managed EFS, or a stale-OIDC-issuer configuration could reach `terraform apply`; this job's `if:` is a custom expression, so each needed job's result is checked explicitly below since GitHub Actions does not implicitly require needs to have succeeded once a custom if: is present.
    needs:
      - validate_model
      - eks_oidc_preflight
      - detect_changed_deployments
      - managed_efs_deletion_guard
      - storage_transition_guard
      - managed_efs_inventory_guard
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' && needs.eks_oidc_preflight.result == 'success' && needs.detect_changed_deployments.result == 'success' && needs.managed_efs_deletion_guard.result == 'success' && needs.storage_transition_guard.result == 'success' && needs.managed_efs_inventory_guard.result == 'success' }}

    # The called Terraform chain needs packages/pull-requests beyond the orchestrator's own top-level permissions; a callee can never be elevated above its caller.
    permissions:
      id-token: write
      contents: read
      packages: write
      pull-requests: read

    uses: ./.github/workflows/10-sub-iam-secrets.yaml
    secrets: inherit
    with:
      environment: ${{ needs.validate_model.outputs.selected_environment }}

  argocd_preflight:
    name: Classify Argo CD prerequisite state (read-only)

    # First implementation of the ownership-aware application-prerequisite state machine (Phase B1): ABSENT -> bootstrap, HEALTHY -> continue, BROKEN -> fail closed, never auto-repaired. This job never mutates the cluster -- it only runs hack/orchestration/argocd_state.py, which itself issues read-only `kubectl get` calls.
    needs:
      - validate_model
      - terraform_sync_once
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' && needs.terraform_sync_once.result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      state: ${{ steps.classify.outputs.state }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        env:
          GG_SELECTED_ENVIRONMENT: ${{ needs.validate_model.outputs.selected_environment }}
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}

      - name: Install kubectl if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking/installing kubectl..."

          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL_VERSION="v1.35.0"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                KUBECTL_ARCH="amd64"
                ;;
              aarch64|arm64)
                KUBECTL_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for kubectl: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" -o /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

          kubectl version --client=true

      - name: Connect to EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

          echo "Current kube context:"
          kubectl config current-context

      - name: Classify Argo CD prerequisite state
        id: classify
        shell: bash
        env:
          GG_SELECTED_ENVIRONMENT: ${{ needs.validate_model.outputs.selected_environment }}
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.1"

          # A non-zero exit here is a classifier inspection error (API unreachable, permission denied, malformed JSON) -- never treated as ABSENT.
          if ! CLASSIFIER_OUTPUT="$(python3 hack/orchestration/argocd_state.py --environment "${GG_SELECTED_ENVIRONMENT}")"; then
            echo "FAIL: the Argo CD classifier could not determine cluster state (inspection error, not ABSENT) -- see diagnostics above."
            exit 1
          fi

          echo "$CLASSIFIER_OUTPUT"

          STATE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<< "$CLASSIFIER_OUTPUT")"
          echo "Argo CD prerequisite state: ${STATE}"
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"

          if [ "$STATE" = "BROKEN" ]; then
            echo "FAIL: Argo CD prerequisite state is BROKEN. This is not auto-repaired here -- investigate the diagnostics above and repair Argo CD (or run 20 | SUB | Argo CD -- .github/workflows/20-sub-argocd.yaml -- standalone) before re-running."
            exit 1
          fi

  bootstrap_argocd:
    name: Bootstrap Argo CD (only when currently absent)

    # Runs the reusable specialist workflow synchronously as part of this DAG -- never an asynchronous CLI/API dispatch or repository_dispatch trigger. Skipped entirely (not run) whenever Argo CD is already HEALTHY or preflight found it BROKEN.
    needs:
      - validate_model
      - argocd_preflight
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' && needs.argocd_preflight.result == 'success' && needs.argocd_preflight.outputs.state == 'ABSENT' }}

    uses: ./.github/workflows/20-sub-argocd.yaml
    secrets: inherit
    with:
      environment: ${{ needs.validate_model.outputs.selected_environment }}

  validate_argocd_ready:
    name: Validate Argo CD is healthy (convergence point for the already-healthy and just-bootstrapped paths)

    # always() overrides GitHub's default implicit skip-on-skipped-dependency behavior (bootstrap_argocd is legitimately skipped on the already-HEALTHY path) -- the explicit result/state checks below are what actually keep this fail-closed, exactly like validate_shared_secrets_once's established always()-plus-explicit-result pattern elsewhere in this workflow.
    needs:
      - validate_model
      - argocd_preflight
      - bootstrap_argocd
    if: ${{ always() && needs.validate_model.outputs.effective_deploy == 'true' && needs.argocd_preflight.result == 'success' && (needs.argocd_preflight.outputs.state == 'HEALTHY' || (needs.argocd_preflight.outputs.state == 'ABSENT' && needs.bootstrap_argocd.result == 'success')) }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        env:
          GG_SELECTED_ENVIRONMENT: ${{ needs.validate_model.outputs.selected_environment }}
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}

      - name: Install kubectl if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking/installing kubectl..."

          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL_VERSION="v1.35.0"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                KUBECTL_ARCH="amd64"
                ;;
              aarch64|arm64)
                KUBECTL_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for kubectl: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" -o /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

          kubectl version --client=true

      - name: Connect to EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

          echo "Current kube context:"
          kubectl config current-context

      - name: Re-classify and require Argo CD to be exactly HEALTHY
        shell: bash
        env:
          GG_SELECTED_ENVIRONMENT: ${{ needs.validate_model.outputs.selected_environment }}
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.1"

          # Bootstrap success (the reusable workflow job returning) is never assumed to mean healthy -- the same read-only classifier is re-run here and must independently confirm HEALTHY.
          if ! CLASSIFIER_OUTPUT="$(python3 hack/orchestration/argocd_state.py --environment "${GG_SELECTED_ENVIRONMENT}")"; then
            echo "FAIL: the Argo CD classifier could not determine cluster state (inspection error) during post-bootstrap validation."
            exit 1
          fi

          echo "$CLASSIFIER_OUTPUT"

          STATE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<< "$CLASSIFIER_OUTPUT")"

          if [ "$STATE" != "HEALTHY" ]; then
            echo "FAIL: Argo CD prerequisite state is ${STATE}, expected HEALTHY after preflight/bootstrap. Refusing to proceed to the platform stage."
            exit 1
          fi

          echo "OK: Argo CD prerequisite state is HEALTHY."

  platform_preflight:
    name: Classify GoldenGate Platform prerequisite state (read-only)

    # Phase B2: the ownership-aware application-prerequisite state machine extended to the GoldenGate Platform chart -- ABSENT -> reconcile via 30-sub-platform.yaml, HEALTHY -> continue, BROKEN -> fail closed, never auto-repaired. Runs independently of observability_preflight (siblings after Argo, not a chain) so both branches can execute in parallel. This job never mutates the cluster -- it only runs hack/orchestration/platform_state.py, which itself issues read-only `kubectl get` calls.
    needs:
      - validate_model
      - validate_argocd_ready
    if: ${{ needs.validate_model.outputs.effective_deploy == 'true' && needs.validate_argocd_ready.result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      state: ${{ steps.classify.outputs.state }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        env:
          GG_SELECTED_ENVIRONMENT: ${{ needs.validate_model.outputs.selected_environment }}
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}

      - name: Install kubectl if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking/installing kubectl..."

          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL_VERSION="v1.35.0"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                KUBECTL_ARCH="amd64"
                ;;
              aarch64|arm64)
                KUBECTL_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for kubectl: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" -o /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

          kubectl version --client=true

      - name: Connect to EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

          echo "Current kube context:"
          kubectl config current-context

      - name: Classify GoldenGate Platform prerequisite state
        id: classify
        shell: bash
        env:
          GG_SELECTED_ENVIRONMENT: ${{ needs.validate_model.outputs.selected_environment }}
          # Read through a step-level environment variable, never interpolated directly into a shell statement or hardcoded here -- the same external-operational-configuration pattern 30-sub-platform.yaml itself already uses for this variable.
          FLUENT_BIT_IMAGE: ${{ vars.FLUENT_BIT_IMAGE }}
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.1"

          if [ -z "${FLUENT_BIT_IMAGE:-}" ]; then
            echo "FAIL: the FLUENT_BIT_IMAGE repository variable is not set."
            exit 1
          fi

          # A non-zero exit here is a classifier inspection error (API unreachable, permission denied, malformed JSON) -- never treated as ABSENT.
          if ! CLASSIFIER_OUTPUT="$(python3 hack/orchestration/platform_state.py --environment "${GG_SELECTED_ENVIRONMENT}" --fluent-bit-image "${FLUENT_BIT_IMAGE}")"; then
            echo "FAIL: the GoldenGate Platform classifier could not determine cluster state (inspection error, not ABSENT) -- see diagnostics above."
            exit 1
          fi

          echo "$CLASSIFIER_OUTPUT"

          STATE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<< "$CLASSIFIER_OUTPUT")"
          echo "GoldenGate Platform prerequisite state: ${STATE}"
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"

          if [ "$STATE" = "BROKEN" ]; then
            echo "FAIL: GoldenGate Platform prerequisite state is BROKEN. This is not auto-repaired here -- investigate the diagnostics above and repair the platform (or run 30 | SUB | GoldenGate Platform -- .github/workflows/30-sub-platform.yaml -- standalone) before re-running."
