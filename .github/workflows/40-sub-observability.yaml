name: "40 | SUB | Observability"

# Already trigger-neutral (inputs.environment/inputs.deploy, no github.event_name branching); restyled only to match the same "SUB | <Name> | env=... | deploy=..." convention now used across 30-sub-platform.yaml/50-sub-monitor.yaml after Phase B2 added workflow_call here.
run-name: "SUB | Observability | env=${{ inputs.environment }} | deploy=${{ inputs.deploy }} | ran by ${{ github.actor }}"

# Deploys the upstream amazon-cloudwatch-observability Helm chart directly from private ECR (no wrapper chart) for EKS cluster/node/pod metrics only; logs and GoldenGate-specific metrics are handled by gg-fluent-bit and gg-monitor respectively. Also reusable via workflow_call (MAIN's observability_sync_once invokes this synchronously, only when observability_preflight classifies ABSENT/OWNED), alongside the pre-existing manual workflow_dispatch -- no push trigger either way. The manual dispatch's own deploy=false default is unchanged: that standalone safety behavior is independent of MAIN's explicit deploy=true reconciliation call.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev

      deploy:
        description: "false (default) = validation only (pull/verify/render/inspect, no cluster changes). true = additionally create/update the goldengate-observability Argo CD Application and perform live Kubernetes validation."
        required: true
        type: boolean
        default: false

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      deploy:
        required: true
        type: boolean
      # Live Deployment Approval Topology Fix: an internal workflow_call-only caller contract, never a workflow_dispatch input and never operator-facing -- literal boolean true means MAIN already obtained its own single goldengate_deploy_authorization approval and this reusable workflow must not open a second one; missing/false (including every direct standalone workflow_dispatch run, which cannot set this input at all) means standalone and the approval below still applies.
      orchestrated_by_main:
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: goldengate-observability-deploy-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Live Deployment Approval Topology Fix, MODE B (direct standalone workflow_dispatch): the one remaining protected-environment gate in this workflow. Skipped entirely when MAIN already authorized this run (orchestrated_by_main: true) -- MAIN's own goldengate_deploy_authorization job is the approval in that case, never this one.
  standalone_deploy_authorization:
    name: Authorize standalone Observability deployment

    if: ${{ inputs.orchestrated_by_main != true }}

    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Record standalone Observability deployment authorization
        shell: bash
        run: |
          set -euo pipefail

          echo "Standalone Observability deployment authorized for environment ${{ inputs.environment }}."

  # Phase 4 Python Conversion: implementation lives in automation/phases/phase4/phase4_observability.py -- this job is a thin sequence of subcommand invocations, never a reimplementation.
  validate_and_deploy:
    name: "Phase 4E | Validate & Reconcile Observability"

    # Must run on the VPC-connected private CodeBuild runner, not GitHub-hosted: the EKS API endpoint is private and unreachable from ubuntu-latest.
    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # always() lets a deliberately-skipped standalone_deploy_authorization (MAIN-orchestrated run) through without being treated as a failed dependency, while the explicit result check still fails closed on a real standalone run whose authorization failed, was cancelled, or was unexpectedly skipped.
    needs:
      - standalone_deploy_authorization
    if: ${{ always() && (inputs.orchestrated_by_main == true || needs.standalone_deploy_authorization.result == 'success') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ inputs.environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ inputs.environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure required tools
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py ensure-tools

      - name: Prepare local Observability state/inventory
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py prepare --environment "${{ inputs.environment }}"

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the steps below that reference steps.aws_build_credentials.outputs.*, never job-wide, never written to $GITHUB_ENV, never written to any state file. kubectl calls after "Reconcile Observability through Argo CD" still require these credentials at invocation time because the kubeconfig written by `aws eks update-kubeconfig` embeds an exec credential plugin (`aws eks get-token`) that itself needs live AWS credentials.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Resolve and verify private ECR artifacts
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py resolve-private-artifacts --environment "${{ inputs.environment }}"

      # deploy=false contract preserved exactly: still generates values, renders the chart, and performs semantic/local safety validation -- no AWS credentials, no EKS mutation. The private chart was already pulled locally by the previous (credentialed) step.
      - name: Generate values, render, and validate Observability locally
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py validate-local --environment "${{ inputs.environment }}"

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldengate-observability-artifacts-${{ inputs.environment }}
          path: |
            rendered/
            work/generated-values.yaml
            work/image-digests.psv
          if-no-files-found: warn
          retention-days: 7

      - name: Reconcile Observability through Argo CD
        if: ${{ inputs.deploy }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py reconcile-cluster --environment "${{ inputs.environment }}"

      - name: Run live post-deployment validation
        if: ${{ inputs.deploy }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py post-deploy-validation --environment "${{ inputs.environment }}"

      # Non-authoritative: diagnostic only, never fails the job, never masks an earlier deployment failure. Bounded log inspection only -- never credential/token values.
      - name: Check bounded recent logs for authorization and startup failures
        if: ${{ always() && inputs.deploy }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -uo pipefail

          python3 automation/phases/phase4/phase4_observability.py diagnostics --environment "${{ inputs.environment }}"
          exit 0

      - name: Workflow summary
        if: always()
        shell: bash
        env:
          OBSERVABILITY_DEPLOY_REQUESTED: ${{ inputs.deploy }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py summary --environment "${{ inputs.environment }}"
