name: Goldengate observability deployment

run-name: "Cloud Factory - GoldenGate observability (CloudWatch metrics) build and deploy | ${{ inputs.environment }} | deploy=${{ inputs.deploy }} | ran by ${{ github.actor }}"

# Deploys the upstream amazon-cloudwatch-observability Helm chart directly from private ECR (no wrapper chart) for EKS cluster/node/pod metrics only; logs and GoldenGate-specific metrics are handled by gg-fluent-bit and gg-monitor respectively. workflow_dispatch only, no push trigger.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev

      deploy:
        description: "false (default) = validation only (pull/verify/render/inspect, no cluster changes). true = additionally create/update the goldengate-observability Argo CD Application and perform live Kubernetes validation."
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# Environment identity is loaded via hack/goldengate-environment.py github-env after checkout, never duplicated here.
env:
  # Pinned private chart (Phase 6B1). Never the public chart, never "latest".
  HELM_OCI_NAMESPACE: helm
  CHART_NAME: amazon-cloudwatch-observability
  CHART_VERSION: "6.2.0"
  CHART_ECR_REPOSITORY: helm/amazon-cloudwatch-observability

  RELEASE_NAME: amazon-cloudwatch-observability
  ARGOCD_APP_NAME: goldengate-observability
  ARGOCD_OBSERVABILITY_SECRET_NAME: argocd-ecr-amazon-cloudwatch-observability-oci

  # ServiceAccount the CLOUDWATCH_METRICS_ROLE_ARN IRSA role is exclusively for; annotated via kubectl (see step below) rather than a Helm value.
  CLOUDWATCH_AGENT_SERVICE_ACCOUNT: cloudwatch-agent

  WORKDIR: work

concurrency:
  group: goldengate-observability-deploy-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate_and_deploy:
    name: Validate and (optionally) deploy the goldengate-observability Argo CD Application

    # Must run on the VPC-connected private CodeBuild runner, not GitHub-hosted: the EKS API endpoint is private and unreachable from ubuntu-latest.
    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${{ inputs.environment }}" validate
          python3 hack/goldengate-environment.py --environment "${{ inputs.environment }}" github-env >> "$GITHUB_ENV"

          # VALUES_FILE/TARGET_NAMESPACE are derived from the canonical GG_ENVIRONMENT/OBSERVABILITY_NAMESPACE, never independent literals.
          echo "VALUES_FILE=platform/${{ inputs.environment }}/goldengate-observability/values.yaml" >> "$GITHUB_ENV"
          echo "TARGET_NAMESPACE=$(python3 hack/goldengate-environment.py --environment "${{ inputs.environment }}" get OBSERVABILITY_NAMESPACE)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}

      - name: Install or validate required tools
        shell: bash
        run: |
          set -euo pipefail

          # CodeBuild runner is not guaranteed to be x86_64, unlike ubuntu-latest, so detect arch instead of hardcoding linux-amd64.
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.15.4"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                HELM_ARCH="amd64"
                ;;
              aarch64|arm64)
                HELM_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for Helm: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz" -o /tmp/helm.tar.gz
            tar -zxvf /tmp/helm.tar.gz -C /tmp
            sudo mv "/tmp/linux-${HELM_ARCH}/helm" /usr/local/bin/helm
            sudo chmod +x /usr/local/bin/helm
          fi
          HELM_SEMVER="$(helm version --short | sed -E 's/^v//' | cut -d+ -f1)"
          echo "Helm version: ${HELM_SEMVER} (required: 3.9 or later)"
          HELM_MAJOR="$(echo "$HELM_SEMVER" | cut -d. -f1)"
          HELM_MINOR="$(echo "$HELM_SEMVER" | cut -d. -f2)"
          if [ "$HELM_MAJOR" -lt 3 ] || { [ "$HELM_MAJOR" -eq 3 ] && [ "$HELM_MINOR" -lt 9 ]; }; then
            echo "FAIL: Helm ${HELM_SEMVER} is older than the required 3.9."
            exit 1
          fi

          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL_VERSION="v1.35.0"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                KUBECTL_ARCH="amd64"
                ;;
              aarch64|arm64)
                KUBECTL_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for kubectl: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" -o /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi
          kubectl version --client=true

          # Prefer apt-get, fall back to dnf then yum; fail clearly if none exist rather than continuing without jq.
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y jq
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y jq
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y jq
            else
              echo "FAIL: jq is not installed and no supported package manager (apt-get, dnf, yum) is available to install it."
              exit 1
            fi
          fi
          jq --version

          python3 --version
          if ! python3 -c "import yaml" 2>/dev/null; then
            if command -v pip3 >/dev/null 2>&1 || python3 -m pip --version >/dev/null 2>&1; then
              python3 -m pip install --user PyYAML
            elif command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y python3-yaml
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y python3-pyyaml
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y python3-pyyaml
            else
              echo "FAIL: PyYAML is not installed and no pip or supported package manager is available to install it."
              exit 1
            fi
          fi
          # Verify the import actually succeeds; later steps that parse/generate YAML depend on it.
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Fail closed unless the AWS caller account is the approved build/ECR account
        shell: bash
        run: |
          set -euo pipefail

          CALLER_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$CALLER_ACCOUNT" != "$ECR_ACCOUNT_ID" ]; then
            echo "FAIL: AWS caller account is ${CALLER_ACCOUNT}, expected ${ECR_ACCOUNT_ID}."
            exit 1
          fi
          echo "OK: AWS caller account is ${ECR_ACCOUNT_ID}."

      - name: Write the private image mirror inventory (single source of truth)
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$WORKDIR"

          # repository|tag single source of truth driving mutability/tag checks, digest resolution, and generated-values injection below.
          cat > "$WORKDIR/image-table.psv" <<'EOF'
          aws-cloud-factory-cloudwatch-agent-operator|3.4.2
          aws-cloud-factory-cloudwatch-agent|1.300069.0b1529
          aws-cloud-factory-kube-state-metrics|v2.18.0
          aws-cloud-factory-node-exporter|v1.11.1
          EOF
          echo "Image mirror inventory:"
          cat "$WORKDIR/image-table.psv"

      - name: Verify all five ECR repositories exist
        shell: bash
        run: |
          set -euo pipefail

          check_repo_exists() {
            local repo="$1"
            if ! aws ecr describe-repositories --region "$AWS_REGION" --repository-names "$repo" >/dev/null 2>"${WORKDIR}/describe-error.txt"; then
              echo "FAIL: ECR repository ${repo} does not exist or could not be described:"
              cat "${WORKDIR}/describe-error.txt"
              exit 1
            fi
            echo "OK: repository ${repo} exists."
          }

          check_repo_exists "$CHART_ECR_REPOSITORY"
          while IFS='|' read -r repo _tag; do
            [ -z "$repo" ] && continue
            check_repo_exists "$repo"
          done < "${WORKDIR}/image-table.psv"

      - name: Verify all five repositories (chart + four images) are IMMUTABLE
        shell: bash
        run: |
          set -euo pipefail

          # Fails closed rather than modifying mutability; this workflow never calls put-image-tag-mutability.
          check_repo_immutable() {
            local repo="$1"
            local mutability
            mutability="$(aws ecr describe-repositories --region "$AWS_REGION" --repository-names "$repo" --query 'repositories[0].imageTagMutability' --output text)"
            if [ "$mutability" != "IMMUTABLE" ]; then
              echo "FAIL: repository ${repo} has imageTagMutability=${mutability}, expected IMMUTABLE."
              exit 1
            fi
            echo "OK: repository ${repo} is IMMUTABLE."
          }

          check_repo_immutable "$CHART_ECR_REPOSITORY"
          while IFS='|' read -r repo _tag; do
            [ -z "$repo" ] && continue
            check_repo_immutable "$repo"
          done < "${WORKDIR}/image-table.psv"

      - name: Verify all four expected image tags exist and resolve manifest digests
        shell: bash
        run: |
          set -euo pipefail

          : > "${WORKDIR}/image-digests.psv"
          SEEN_REPOS=""

          while IFS='|' read -r repo tag; do
            [ -z "$repo" ] && continue

            # Guard against the table above listing the same repository twice.
            if grep -qx -- "$repo" <<< "$SEEN_REPOS"; then
              echo "FAIL: repository ${repo} appears more than once in the image inventory."
              exit 1
            fi
            SEEN_REPOS="$(printf '%s\n%s' "$SEEN_REPOS" "$repo")"

            if ! DESCRIBE_JSON="$(aws ecr describe-images \
                --region "$AWS_REGION" \
                --repository-name "$repo" \
                --image-ids imageTag="$tag" \
                --output json 2>"${WORKDIR}/describe-images-error.txt")"; then
              echo "FAIL: tag ${tag} not found in repository ${repo}:"
              cat "${WORKDIR}/describe-images-error.txt"
              exit 1
            fi

            DIGEST="$(echo "$DESCRIBE_JSON" | jq -r '.imageDetails[0].imageDigest // empty')"
            if [ -z "$DIGEST" ]; then
              echo "FAIL: empty digest resolved for ${repo}:${tag}."
              exit 1
            fi
            if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "FAIL: malformed digest resolved for ${repo}:${tag}: ${DIGEST}"
              exit 1
            fi

            echo "OK: ${repo}:${tag} -> ${DIGEST}"
            echo "${repo}|${tag}|${DIGEST}" >> "${WORKDIR}/image-digests.psv"
          done < "${WORKDIR}/image-table.psv"

          echo "Resolved digests:"
          cat "${WORKDIR}/image-digests.psv"

      - name: Authenticate Helm to private ECR
        shell: bash
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Pull only the private chart
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${WORKDIR}/chart"

          # Only the already-mirrored private OCI chart, never the public aws-observability repository.
          helm pull "oci://${ECR_REGISTRY}/${HELM_OCI_NAMESPACE}/${CHART_NAME}" \
            --version "$CHART_VERSION" \
            --untar \
            --untardir "${WORKDIR}/chart"

          CHART_DIR="${WORKDIR}/chart/${CHART_NAME}"
          if [ ! -f "${CHART_DIR}/Chart.yaml" ]; then
            echo "FAIL: expected chart directory ${CHART_DIR} was not produced by helm pull."
            exit 1
          fi
          echo "CHART_DIR=${CHART_DIR}" >> "$GITHUB_ENV"

      - name: Verify the private chart's name and version exactly
        shell: bash
        run: |
          set -euo pipefail

          python3 - "${CHART_DIR}/Chart.yaml" "$CHART_NAME" "$CHART_VERSION" <<'PYEOF'
          import sys, yaml
          path, expected_name, expected_version = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path) as f:
              chart = yaml.safe_load(f)
          name = chart.get("name")
          version = chart.get("version")
          if name != expected_name:
              sys.exit(f"FAIL: chart name is {name!r}, expected {expected_name!r}.")
          if version != expected_version:
              sys.exit(f"FAIL: chart version is {version!r}, expected {expected_version!r}.")
          print(f"OK: private chart name={name} version={version}")
          PYEOF

      - name: Generate the temporary deployment values file
        shell: bash
        run: |
          set -euo pipefail

          # Injects tag@digest image references, plus clusterName/region/repositoryDomainMap.public (shared environment identity, resolved from envs/dev/environment.yaml, never committed to VALUES_FILE) into the generated values file; the committed file itself is never mutated. The CloudWatch Agent IRSA role annotation is applied later via kubectl since this chart has no serviceAccount.annotations values path.
          python3 - "$VALUES_FILE" "${WORKDIR}/image-digests.psv" "${WORKDIR}/generated-values.yaml" "$EKS_CLUSTER_NAME" "$AWS_REGION" "$ECR_REGISTRY" <<'PYEOF'
          import sys
          import yaml

          committed_values_path, digests_path, output_path, cluster_name, region, ecr_registry = sys.argv[1:7]

          class DupKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      sys.exit(f"FAIL: duplicate key {key!r} in {committed_values_path}")
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          DupKeyLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, construct_mapping)

          with open(committed_values_path) as f:
              values = yaml.load(f, Loader=DupKeyLoader)

          values["clusterName"] = cluster_name
          values["region"] = region

          digests_by_repo = {}
          with open(digests_path) as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  repo, tag, digest = line.split("|")
                  digests_by_repo[repo] = (tag, digest)

          image_paths = {
              "aws-cloud-factory-cloudwatch-agent-operator": ("manager", "image"),
              "aws-cloud-factory-cloudwatch-agent": ("agent", "image"),
              "aws-cloud-factory-kube-state-metrics": ("kubeStateMetrics", "image"),
              "aws-cloud-factory-node-exporter": ("nodeExporter", "image"),
          }

          for repo, (top_key, image_key) in image_paths.items():
              if repo not in digests_by_repo:
                  sys.exit(f"FAIL: no resolved digest for repository {repo}")
              tag, digest = digests_by_repo[repo]
              image_block = values[top_key][image_key]
              if image_block["repository"] != repo:
                  sys.exit(f"FAIL: {top_key}.{image_key}.repository is {image_block['repository']!r}, expected {repo!r}")
              if image_block["tag"] != tag:
                  sys.exit(f"FAIL: {top_key}.{image_key}.tag is {image_block['tag']!r}, expected base tag {tag!r} before digest injection")
              image_block["tag"] = f"{tag}@{digest}"
              image_block["repositoryDomainMap"] = {"public": ecr_registry}

          with open(output_path, "w") as f:
              yaml.safe_dump(values, f, default_flow_style=False, sort_keys=False)

          print(f"OK: generated {output_path} with clusterName/region/repositoryDomainMap.public and tag@digest for all four images.")
          PYEOF

          echo "Generated values file (committed file is unchanged):"
          cat "${WORKDIR}/generated-values.yaml"

      - name: Semantically validate the generated deployment values
        shell: bash
        run: |
          set -euo pipefail

          python3 - "${WORKDIR}/generated-values.yaml" "$EKS_CLUSTER_NAME" "$AWS_REGION" "$ECR_REGISTRY" <<'PYEOF'
          import sys
          import yaml

          values_path, expected_cluster_name, expected_region, expected_ecr_registry = sys.argv[1:5]
          with open(values_path) as f:
              v = yaml.safe_load(f)

          def expect(actual, expected, label):
              if actual != expected:
                  sys.exit(f"FAIL: {label} is {actual!r}, expected {expected!r}")
              print(f"OK: {label} == {expected!r}")

          expect(v.get("clusterName"), expected_cluster_name, "clusterName")
          expect(v.get("region"), expected_region, "region")
          expect(v.get("k8sMode"), "EKS", "k8sMode")
          expect(v.get("containerLogs", {}).get("enabled"), False, "containerLogs.enabled")
          expect(v.get("containerInsights", {}).get("enabled"), False, "containerInsights.enabled")
          expect(v.get("applicationSignals", {}).get("enabled"), False, "applicationSignals.enabled")
          expect(v.get("manager", {}).get("applicationSignals", {}).get("autoMonitor", {}).get("monitorAllServices"), False, "manager.applicationSignals.autoMonitor.monitorAllServices")
          expect(v.get("otelContainerInsights", {}).get("enabled"), True, "otelContainerInsights.enabled")
          expect(v.get("otelContainerInsights", {}).get("logs", {}).get("enabled"), False, "otelContainerInsights.logs.enabled")
          expect(v.get("dcgmExporter", {}).get("enabled"), False, "dcgmExporter.enabled")
          expect(v.get("neuronMonitor", {}).get("enabled"), False, "neuronMonitor.enabled")
          expect(v.get("kubeStateMetrics", {}).get("enabled"), True, "kubeStateMetrics.enabled")
          expect(v.get("nodeExporter", {}).get("enabled"), True, "nodeExporter.enabled")
          expect(v.get("agent", {}).get("prometheus", {}).get("targetAllocator", {}).get("enabled"), False, "agent.prometheus.targetAllocator.enabled")
          expect(v.get("agent", {}).get("serviceAccount", {}).get("name"), "cloudwatch-agent", "agent.serviceAccount.name")

          # Top-level `agents` list must contain exactly 2 entries: DaemonSet (hostNetwork=true) and scraper Deployment (hostNetwork=false), to avoid a port collision on 127.0.0.1:8888.
          agents = v.get("agents")
          if not isinstance(agents, list):
              sys.exit(f"FAIL: agents is {type(agents).__name__}, expected a list")
          if len(agents) != 2:
              sys.exit(f"FAIL: agents has {len(agents)} entries, expected exactly 2")
          print(f"OK: agents is a list of exactly {len(agents)} entries.")

          agent_names = [a.get("name") for a in agents]
          if len(agent_names) != len(set(agent_names)):
              sys.exit(f"FAIL: agents contains duplicate names: {agent_names}")
          expected_names = {"cloudwatch-agent", "cloudwatch-agent-cluster-scraper"}
          if set(agent_names) != expected_names:
              sys.exit(f"FAIL: agents names are {sorted(agent_names)}, expected exactly {sorted(expected_names)} -- no other agent installation is permitted")
          print(f"OK: agents names are exactly {sorted(expected_names)}, no duplicates.")

          agents_by_name = {a.get("name"): a for a in agents}

          cw_agent = agents_by_name["cloudwatch-agent"]
          expect(cw_agent.get("mode"), "daemonset", "agents[cloudwatch-agent].mode")
          if cw_agent.get("hostNetwork") is not True:
              sys.exit(f"FAIL: agents[cloudwatch-agent].hostNetwork is {cw_agent.get('hostNetwork')!r}, expected literal true")
          print("OK: agents[cloudwatch-agent].hostNetwork is literal true.")

          scraper_agent = agents_by_name["cloudwatch-agent-cluster-scraper"]
          expect(scraper_agent.get("mode"), "deployment", "agents[cloudwatch-agent-cluster-scraper].mode")
          expect(scraper_agent.get("config"), "default", "agents[cloudwatch-agent-cluster-scraper].config")
          if scraper_agent.get("hostNetwork") is not False:
              sys.exit(f"FAIL: agents[cloudwatch-agent-cluster-scraper].hostNetwork is {scraper_agent.get('hostNetwork')!r}, expected literal false")
          print("OK: agents[cloudwatch-agent-cluster-scraper].hostNetwork is literal false.")

          for top_key, image_key in [("manager", "image"), ("agent", "image"), ("kubeStateMetrics", "image"), ("nodeExporter", "image")]:
              block = v[top_key][image_key]
              domain = block.get("repositoryDomainMap", {}).get("public")
              expect(domain, expected_ecr_registry, f"{top_key}.{image_key}.repositoryDomainMap.public")
              tag = block.get("tag", "")
              if "@sha256:" not in tag:
                  sys.exit(f"FAIL: {top_key}.{image_key}.tag ({tag!r}) does not contain @sha256:")
              print(f"OK: {top_key}.{image_key}.tag contains @sha256: ({tag})")

          print("OK: generated values file passes every semantic check.")
          PYEOF

      - name: Render the private chart locally
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p rendered

          helm template "$RELEASE_NAME" "$CHART_DIR" \
            --namespace "$TARGET_NAMESPACE" \
            --include-crds \
            --values "${WORKDIR}/generated-values.yaml" \
            > "rendered/${RELEASE_NAME}.yaml"

          echo "Rendered manifest: rendered/${RELEASE_NAME}.yaml ($(wc -l < "rendered/${RELEASE_NAME}.yaml") lines)"

      - name: Recursively extract and validate rendered image references
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${RELEASE_NAME}.yaml"

          # Recursively collects every "image:" field in the parsed document tree, including those inside operator custom resources like AmazonCloudWatchAgent.
          python3 - "$RENDERED" <<'PYEOF' > "${WORKDIR}/rendered-images.txt"
          import sys, yaml

          with open(sys.argv[1]) as f:
              docs = list(yaml.safe_load_all(f))

          images = set()

          def walk(node):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k == "image" and isinstance(v, str):
                          images.add(v)
                      else:
                          walk(v)
              elif isinstance(node, list):
                  for item in node:
                      walk(item)

          for d in docs:
              if d is not None:
                  walk(d)

          for img in sorted(images):
              print(img)
          PYEOF

          echo "Rendered image set:"
          cat "${WORKDIR}/rendered-images.txt"

          EXPECTED_PREFIX="${ECR_REGISTRY}/"
          ALLOWED_REPOS="aws-cloud-factory-cloudwatch-agent-operator aws-cloud-factory-cloudwatch-agent aws-cloud-factory-kube-state-metrics aws-cloud-factory-node-exporter"

          UNAPPROVED_REGISTRIES='public\.ecr\.aws|registry\.k8s\.io|quay\.io|docker\.io|ghcr\.io|gcr\.io|nvcr\.io'
          if grep -Eiq "$UNAPPROVED_REGISTRIES" "${WORKDIR}/rendered-images.txt"; then
            echo "FAIL: rendered image set references an unapproved public registry:"
            grep -Ei "$UNAPPROVED_REGISTRIES" "${WORKDIR}/rendered-images.txt"
            exit 1
          fi
          echo "OK: no unapproved public registry reference."

          IMAGE_COUNT=0
          while IFS= read -r image_ref; do
            [ -z "$image_ref" ] && continue
            IMAGE_COUNT=$((IMAGE_COUNT + 1))

            if [[ "$image_ref" != "${EXPECTED_PREFIX}"* ]]; then
              echo "FAIL: image ${image_ref} does not use the private registry ${EXPECTED_PREFIX}"
              exit 1
            fi
            if [[ "$image_ref" != *"@sha256:"* ]]; then
              echo "FAIL: image ${image_ref} has no @sha256: digest."
              exit 1
            fi

            REPO_AND_REST="${image_ref#"$EXPECTED_PREFIX"}"
            REPO="${REPO_AND_REST%%:*}"
            FOUND_ALLOWED="false"
            for allowed in $ALLOWED_REPOS; do
              if [ "$REPO" = "$allowed" ]; then
                FOUND_ALLOWED="true"
                break
              fi
            done
            if [ "$FOUND_ALLOWED" != "true" ]; then
              echo "FAIL: image ${image_ref} belongs to repository ${REPO}, which is outside the four allow-listed repositories."
              exit 1
            fi
          done < "${WORKDIR}/rendered-images.txt"

          if [ "$IMAGE_COUNT" -ne 4 ]; then
            echo "FAIL: expected exactly 4 unique rendered images, found ${IMAGE_COUNT}."
            exit 1
          fi
          echo "OK: exactly 4 unique rendered images, all private, all repository-allow-listed, all digest-pinned."

      - name: Validate no forbidden component was rendered
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${RELEASE_NAME}.yaml"

          # CRD schemas for these kinds are always rendered regardless of feature flags, so this checks for CR instances, not the CRD definitions.
          python3 - "$RENDERED" <<'PYEOF'
          import sys, yaml

          with open(sys.argv[1]) as f:
              docs = [d for d in yaml.safe_load_all(f) if d]

          forbidden_kinds = {"DcgmExporter", "NeuronMonitor", "Instrumentation"}
          present_forbidden_kinds = {d.get("kind") for d in docs} & forbidden_kinds
          if present_forbidden_kinds:
              sys.exit(f"FAIL: forbidden CR instance kind(s) rendered: {sorted(present_forbidden_kinds)}")

          forbidden_name_substrings = ["fluent-bit", "fluentbit", "dcgm", "neuron", "adot", "target-allocator", "auto-instrumentation"]
          for d in docs:
              if d.get("kind") == "CustomResourceDefinition":
                  # CRD schemas are expected and harmless (see comment above).
                  continue
              name = ((d.get("metadata") or {}).get("name") or "").lower()
              for f in forbidden_name_substrings:
                  if f in name:
                      sys.exit(f"FAIL: forbidden resource name '{name}' (kind={d.get('kind')}) matches forbidden substring '{f}'.")

          print("OK: no DcgmExporter/NeuronMonitor/Instrumentation CR instance, and no fluent-bit/dcgm/neuron/adot/target-allocator/auto-instrumentation named resource, was rendered.")

          # otelContainerInsights.logs.enabled is false, so no CR's otelConfig may contain a filelog receiver.
          for d in docs:
              if d.get("kind") == "AmazonCloudWatchAgent":
                  otel_config = str(d.get("spec", {}).get("otelConfig", ""))
                  if "filelog" in otel_config:
                      sys.exit(f"FAIL: AmazonCloudWatchAgent/{d['metadata']['name']} otelConfig contains a filelog receiver -- OTel logs must stay disabled.")
          print("OK: no filelog receiver in any rendered AmazonCloudWatchAgent otelConfig.")
          PYEOF

          if grep -q "kind: DaemonSet" "$RENDERED" && grep -B5 "kind: DaemonSet" "$RENDERED" | grep -qi "fluent-bit"; then
            echo "FAIL: a Fluent Bit DaemonSet was rendered."
            exit 1
          fi
          echo "OK: no Fluent Bit DaemonSet or container rendered."

      - name: Validate the rendered CloudWatch Agent ServiceAccount
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${RELEASE_NAME}.yaml"

          python3 - "$RENDERED" <<'PYEOF'
          import sys, yaml

          with open(sys.argv[1]) as f:
              docs = [d for d in yaml.safe_load_all(f) if d]

          service_accounts = [d for d in docs if d.get("kind") == "ServiceAccount"]
          cw_agent_sas = [sa for sa in service_accounts
                          if sa["metadata"]["name"] == "cloudwatch-agent"
                          and sa["metadata"].get("namespace") == "amazon-cloudwatch"]
          if len(cw_agent_sas) != 1:
              sys.exit(f"FAIL: expected exactly 1 ServiceAccount amazon-cloudwatch/cloudwatch-agent, found {len(cw_agent_sas)}.")
          print("OK: ServiceAccount amazon-cloudwatch/cloudwatch-agent is rendered by the chart.")

          # Locks in that this chart never renders an eks.amazonaws.com/role-arn annotation via values; fails loudly if a future chart version starts doing so unexpectedly.
          for sa in service_accounts:
              annotations = sa["metadata"].get("annotations") or {}
              role_arn = annotations.get("eks.amazonaws.com/role-arn")
              if role_arn and sa["metadata"]["name"] != "cloudwatch-agent":
                  sys.exit(f"FAIL: unexpected eks.amazonaws.com/role-arn annotation on unrelated ServiceAccount {sa['metadata']['name']}: {role_arn}")
              if role_arn and sa["metadata"]["name"] == "cloudwatch-agent":
                  sys.exit("FAIL: chart unexpectedly renders a role-arn annotation on cloudwatch-agent directly -- update the digest-injection step to stop double-annotating.")
          print("OK: no ServiceAccount carries an eks.amazonaws.com/role-arn annotation from the chart render itself (applied post-sync instead -- see below).")
          PYEOF

      - name: Document and verify the exact chart-rendered resource names
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${RELEASE_NAME}.yaml"

          # Exact names as rendered by chart 6.2.0 with the metrics-only values above. Two Windows-only AmazonCloudWatchAgent CRs also render unconditionally but are harmless (no Windows nodes on this cluster).
          python3 - "$RENDERED" <<'PYEOF'
          import sys, yaml

          with open(sys.argv[1]) as f:
              docs = [d for d in yaml.safe_load_all(f) if d]

          def find_one(kind, name):
              matches = [d for d in docs if d.get("kind") == kind and (d.get("metadata") or {}).get("name") == name]
              if len(matches) != 1:
                  sys.exit(f"FAIL: expected exactly 1 {kind}/{name}, found {len(matches)}.")
              return matches[0]

          find_one("AmazonCloudWatchAgent", "cloudwatch-agent")
          find_one("AmazonCloudWatchAgent", "cloudwatch-agent-cluster-scraper")
          find_one("Deployment", "amazon-cloudwatch-observability-controller-manager")
          find_one("Deployment", "kube-state-metrics")
          find_one("DaemonSet", "node-exporter")
          find_one("ServiceAccount", "kube-state-metrics-service-acct")
          find_one("ServiceAccount", "node-exporter-service-acct")
          find_one("ServiceAccount", "amazon-cloudwatch-observability-controller-manager")

          print("OK: every expected chart-rendered resource name is present exactly once.")
          PYEOF

      - name: Validate rendered CloudWatch Agent host-network isolation
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${RELEASE_NAME}.yaml"

          # Only the two AmazonCloudWatchAgent CRs are renderable offline; the actual DaemonSet/Deployment hostNetwork values are set by the operator at reconcile time and are checked later in the deploy=true "Live Kubernetes validation" step.
          python3 - "$RENDERED" <<'PYEOF'
          import sys, yaml

          with open(sys.argv[1]) as f:
              docs = [d for d in yaml.safe_load_all(f) if d]

          def find_one(kind, name):
              matches = [d for d in docs if d.get("kind") == kind and (d.get("metadata") or {}).get("name") == name]
              if len(matches) != 1:
                  sys.exit(f"FAIL: expected exactly 1 {kind}/{name}, found {len(matches)}.")
              return matches[0]

          cw_agent_cr = find_one("AmazonCloudWatchAgent", "cloudwatch-agent")
          cw_mode = cw_agent_cr.get("spec", {}).get("mode")
          cw_host_network = cw_agent_cr.get("spec", {}).get("hostNetwork")
          if cw_mode != "daemonset":
              sys.exit(f"FAIL: AmazonCloudWatchAgent/cloudwatch-agent spec.mode is {cw_mode!r}, expected 'daemonset'.")
          if cw_host_network is not True:
              sys.exit(f"FAIL: AmazonCloudWatchAgent/cloudwatch-agent spec.hostNetwork is {cw_host_network!r}, expected literal true.")
          print(f"OK: AmazonCloudWatchAgent/cloudwatch-agent mode={cw_mode} hostNetwork={cw_host_network}")

          scraper_cr = find_one("AmazonCloudWatchAgent", "cloudwatch-agent-cluster-scraper")
          scraper_mode = scraper_cr.get("spec", {}).get("mode")
          scraper_host_network = scraper_cr.get("spec", {}).get("hostNetwork")
          if scraper_mode != "deployment":
              sys.exit(f"FAIL: AmazonCloudWatchAgent/cloudwatch-agent-cluster-scraper spec.mode is {scraper_mode!r}, expected 'deployment'.")
          if scraper_host_network is not False:
              sys.exit(f"FAIL: AmazonCloudWatchAgent/cloudwatch-agent-cluster-scraper spec.hostNetwork is {scraper_host_network!r}, expected literal false.")
          print(f"OK: AmazonCloudWatchAgent/cloudwatch-agent-cluster-scraper mode={scraper_mode} hostNetwork={scraper_host_network}")

          print("OK: rendered CloudWatch Agent custom resources have the expected host-network isolation (node-level agent=true, cluster scraper=false).")
          PYEOF

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldengate-observability-artifacts-${{ inputs.environment }}
          path: |
            rendered/
            work/generated-values.yaml
            work/image-digests.psv
          if-no-files-found: warn
          retention-days: 7

      # Everything below this point only runs when inputs.deploy=true and performs live Kubernetes/Argo CD operations.
      - name: Connect to EKS cluster
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

          kubectl config current-context
          kubectl version --client=true

      - name: Verify private EKS API connectivity and access
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          # Proves the runner can reach the private EKS API before a later step misdiagnoses a connection failure as a missing CRD; output stays bounded and is never a full kubeconfig/credential/token dump.
          set +e
          kubectl get --raw="/readyz" --request-timeout=20s >"${WORKDIR}/readyz-stdout.txt" 2>"${WORKDIR}/readyz-stderr.txt"
          READYZ_STATUS=$?
          set -e

          READYZ_OUTPUT="$(cat "${WORKDIR}/readyz-stdout.txt" "${WORKDIR}/readyz-stderr.txt" 2>/dev/null || true)"

          if [ "$READYZ_STATUS" -eq 0 ]; then
            echo "Private EKS API is reachable from the CodeBuild runner."
            exit 0
          fi

          NETWORK_ERROR_PATTERN='i/o timeout|connection timed out|no route to host|context deadline exceeded|connection refused'
          AUTH_ERROR_PATTERN='Unauthorized|[Ff]orbidden|the server has asked for the client to provide credentials|exec credential|AssumeRole'

          if echo "$READYZ_OUTPUT" | grep -qEi "$NETWORK_ERROR_PATTERN"; then
            echo "FAIL: the CodeBuild runner cannot reach the private EKS API endpoint."
            echo "This is a network-reachability failure, not proof that Argo CD or its"
            echo "applications.argoproj.io CRD is missing -- do not reinstall Argo CD"
            echo "based on this error alone."
            echo "This workflow must run from the VPC-connected private CodeBuild runner"
            echo "(runs-on: codebuild-\${{ vars.PROJECT_NAME_DEV }}-...), which it now does;"
            echo "if this still fails, the runner's VPC/security-group/routing configuration"
            echo "to the EKS API endpoint needs investigation, not this workflow's logic."
            echo "Matched network error pattern in the readyz response."
            exit 1
          fi

          if echo "$READYZ_OUTPUT" | grep -qE "$AUTH_ERROR_PATTERN"; then
            echo "FAIL: the Kubernetes API responded, but EKS authentication or RBAC authorization failed."
            echo "This indicates a problem with EKS_DEPLOY_ROLE_ARN's aws-auth mapping or"
            echo "IAM trust, not a missing CRD and not a network-reachability problem."
            exit 1
          fi

          echo "FAIL: the private EKS API connectivity check failed for an unexpected reason."
          echo "Bounded diagnostic (readyz exit status ${READYZ_STATUS}):"
          echo "$READYZ_OUTPUT" | head -n 15
          exit 1

      - name: Ensure Argo CD Application CRD exists
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          # Connectivity was already proven above, so a failure here is about this specific CRD lookup, not network reachability; each outcome is classified explicitly rather than treating any failure as "CRD missing".
          set +e
          kubectl get crd applications.argoproj.io --request-timeout=20s >"${WORKDIR}/crd-stdout.txt" 2>"${WORKDIR}/crd-stderr.txt"
          CRD_STATUS=$?
          set -e

          CRD_OUTPUT="$(cat "${WORKDIR}/crd-stdout.txt" "${WORKDIR}/crd-stderr.txt" 2>/dev/null || true)"

          if [ "$CRD_STATUS" -eq 0 ]; then
            echo "OK: Argo CD Application CRD (applications.argoproj.io) is present."
            exit 0
          fi

          if echo "$CRD_OUTPUT" | grep -qEi 'NotFound|not found'; then
            echo "FAIL: the Kubernetes API is reachable, but applications.argoproj.io is genuinely absent."
            echo "Argo CD must be installed on this cluster before this Application can be deployed."
            echo "Run the argocd-eks-deployment.yaml workflow first."
            exit 1
          fi

          if echo "$CRD_OUTPUT" | grep -qEi 'Forbidden'; then
            echo "FAIL: the deploy identity (EKS_DEPLOY_ROLE_ARN) lacks permission to read"
            echo "CustomResourceDefinitions (applications.argoproj.io). This is an RBAC"
            echo "authorization gap, not a missing CRD."
            exit 1
          fi

          echo "FAIL: the Argo CD Application CRD check failed for an unexpected reason"
          echo "(status ${CRD_STATUS}) -- this is not a confirmed 'CRD missing' result."
          echo "Bounded diagnostic:"
          echo "$CRD_OUTPUT" | head -n 15
          exit 1

      - name: Confirm the observability Argo CD repository Secret exists
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          if ! kubectl get secret "$ARGOCD_OBSERVABILITY_SECRET_NAME" -n "$ARGOCD_NAMESPACE" >/dev/null 2>&1; then
            echo "PREREQUISITE NOT MET: Secret ${ARGOCD_OBSERVABILITY_SECRET_NAME} does not exist in namespace ${ARGOCD_NAMESPACE}."
            echo ""
            echo "Required order before running this workflow with deploy=true:"
            echo "  1. Phase 6B2A IAM/Terraform workflow completed (GoldenGateCloudWatchMetricsRole-dev, performance log group)."
            echo "  2. Re-run argocd-eks-deployment.yaml (picks up the new amazon-cloudwatch-observability"
            echo "     entry in envs/dev/argocd/values.yaml ecrTokenSync.repositories and provisions this Secret)."
            echo "  3. Re-run this workflow (goldengate-observability.yaml) with deploy=true."
            echo ""
            echo "Refusing to inject a short-lived credential as a workaround -- the in-cluster IRSA token sync is the only long-term credential mechanism."
            exit 1
          fi

          ACTUAL_URL="$(kubectl get secret "$ARGOCD_OBSERVABILITY_SECRET_NAME" -n "$ARGOCD_NAMESPACE" -o jsonpath='{.data.url}' | base64 --decode)"
          EXPECTED_URL="oci://${ECR_REGISTRY}/${HELM_OCI_NAMESPACE}/${CHART_NAME}"
          if [ "$ACTUAL_URL" != "$EXPECTED_URL" ]; then
            echo "FAIL: Secret ${ARGOCD_OBSERVABILITY_SECRET_NAME} url mismatch. Expected ${EXPECTED_URL}, got ${ACTUAL_URL}."
            exit 1
          fi
          echo "OK: ${ARGOCD_OBSERVABILITY_SECRET_NAME} exists and points to ${EXPECTED_URL}."

      - name: Create or update the Argo CD Application
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          HELM_CHART_REF="oci://${ECR_REGISTRY}/${HELM_OCI_NAMESPACE}/${CHART_NAME}"

          # Generated via Python/PyYAML since the Helm values content is too large/structurally rich to safely inline through shell string interpolation.
          python3 - "${WORKDIR}/generated-values.yaml" "${WORKDIR}/application.yaml" "$HELM_CHART_REF" "$CHART_VERSION" "$RELEASE_NAME" "$ARGOCD_APP_NAME" "$ARGOCD_NAMESPACE" "$OBSERVABILITY_NAMESPACE" <<'PYEOF'
          import sys
          import yaml

          values_path, output_path, helm_chart_ref, chart_version, release_name, argocd_app_name, argocd_namespace, observability_namespace = sys.argv[1:9]

          with open(values_path) as f:
              values_text = f.read()

          class LiteralStr(str):
              pass

          def literal_str_representer(dumper, data):
              return dumper.represent_scalar("tag:yaml.org,2002:str", data, style="|")

          yaml.add_representer(LiteralStr, literal_str_representer)

          application = {
              "apiVersion": "argoproj.io/v1alpha1",
              "kind": "Application",
              "metadata": {
                  "name": argocd_app_name,
                  "namespace": argocd_namespace,
                  "finalizers": ["resources-finalizer.argocd.argoproj.io"],
                  "labels": {
                      "app.kubernetes.io/name": argocd_app_name,
                      "app.kubernetes.io/managed-by": "argocd",
                  },
              },
              "spec": {
                  "project": "default",
                  "source": {
                      "repoURL": helm_chart_ref,
                      "targetRevision": chart_version,
                      # path: "." identifies the chart root within the OCI artifact itself (never a "chart:" field, which is for the Helm-repository source model).
                      "path": ".",
                      "helm": {
                          "releaseName": release_name,
                          "values": LiteralStr(values_text),
                      },
                  },
                  "destination": {
                      "server": "https://kubernetes.default.svc",
                      "namespace": observability_namespace,
                  },
                  "syncPolicy": {
                      "automated": {
                          "prune": True,
                          "selfHeal": True,
                      },
                      "syncOptions": [
                          "CreateNamespace=true",
                          # Required because this CRD is ~603KB, over the ~262144-byte limit for the client-side last-applied-configuration annotation.
                          "ServerSideApply=true",
                          # Required for ignoreDifferences (below) to survive later selfHeal syncs, not just the first one.
                          "RespectIgnoreDifferences=true",
                      ],
                      "managedNamespaceMetadata": {
                          "labels": {
                              "app.kubernetes.io/name": argocd_app_name,
                              "app.kubernetes.io/managed-by": "argocd",
                          },
                      },
                  },
                  # Stops selfHeal from reverting the post-sync role-arn annotation (applied outside the chart) back to the chart's unannotated render; if this ServiceAccount is ever recreated, rerun this workflow with deploy=true to restore the annotation.
                  "ignoreDifferences": [
                      {
                          "group": "",
                          "kind": "ServiceAccount",
                          "name": "cloudwatch-agent",
                          "namespace": observability_namespace,
                          "jsonPointers": [
                              "/metadata/annotations/eks.amazonaws.com~1role-arn",
                          ],
                      },
                  ],
                  "revisionHistoryLimit": 10,
              },
          }

          with open(output_path, "w") as f:
              yaml.dump(application, f, default_flow_style=False, sort_keys=False)

          print(f"Generated {output_path}")
          PYEOF

          echo "Applying Argo CD Application: ${ARGOCD_APP_NAME}"
          kubectl apply -f "${WORKDIR}/application.yaml"

          kubectl annotate application "${ARGOCD_APP_NAME}" \
            -n "${ARGOCD_NAMESPACE}" \
            argocd.argoproj.io/refresh=hard \
            --overwrite

      - name: Wait for Argo CD sync and health
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          TIMEOUT_SECONDS=900
          INTERVAL_SECONDS=15
          ELAPSED=0

          while true; do
            if kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" >/dev/null 2>&1; then
              SYNC_STATUS="$(kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")"
              HEALTH_STATUS="$(kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")"

              echo "[$(date -u +%H:%M:%S)] sync=${SYNC_STATUS} health=${HEALTH_STATUS} (elapsed ${ELAPSED}s / ${TIMEOUT_SECONDS}s)"

              if [ "${HEALTH_STATUS}" = "Degraded" ]; then
                echo "FAIL: Argo CD Application ${ARGOCD_APP_NAME} is Degraded."
                kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o wide
                exit 1
              fi

              if [ "${SYNC_STATUS}" = "Synced" ] && [ "${HEALTH_STATUS}" = "Healthy" ]; then
                echo "Argo CD Application ${ARGOCD_APP_NAME} is Synced and Healthy."
                break
              fi
            else
              echo "[$(date -u +%H:%M:%S)] Argo CD Application ${ARGOCD_APP_NAME} not found yet (elapsed ${ELAPSED}s / ${TIMEOUT_SECONDS}s)."
            fi

            if [ "${ELAPSED}" -ge "${TIMEOUT_SECONDS}" ]; then
              echo "FAIL: timed out after ${TIMEOUT_SECONDS}s waiting for ${ARGOCD_APP_NAME} to become Synced and Healthy."
              kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o wide || true
              kubectl get pods -n "${TARGET_NAMESPACE}" || true
              exit 1
            fi

            sleep "${INTERVAL_SECONDS}"
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
          done

      - name: Ensure cluster-scraper Deployment host-network isolation
        # Works around an operator bug (mutateDeployment's mergo.WithOverride merge never overwrites an existing hostNetwork=true with the CR's false); deleting the stale Deployment lets the operator recreate it correctly from scratch.
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_SCRAPER_CR="cloudwatch-agent-cluster-scraper"
          CLUSTER_SCRAPER_DEPLOYMENT="cloudwatch-agent-cluster-scraper"
          RECONCILE_ANNOTATION="cloudfactory.adcb/reconcile-requested-at"
          CORRECTION_SUMMARY_FILE="${WORKDIR}/cluster-scraper-correction-summary.txt"
          echo "unknown" > "$CORRECTION_SUMMARY_FILE"

          ensure_cluster_scraper_host_network_isolated() {
            # 1. Read the live CR; fails closed via set -e if missing.
            local cr_json
            cr_json="$(kubectl get amazoncloudwatchagents.cloudwatch.aws.amazon.com "$CLUSTER_SCRAPER_CR" -n "$TARGET_NAMESPACE" -o json)"

            local cr_mode cr_hostnetwork cr_uid
            cr_mode="$(jq -r '.spec.mode // empty' <<<"$cr_json")"
            cr_hostnetwork="$(jq -r '.spec.hostNetwork' <<<"$cr_json")"
            cr_uid="$(jq -r '.metadata.uid // empty' <<<"$cr_json")"
            echo "AmazonCloudWatchAgent/${CLUSTER_SCRAPER_CR}: mode=${cr_mode} hostNetwork=${cr_hostnetwork}"

            # 2. Require mode==deployment and hostNetwork==false; only ever acts on a CR that already carries the corrected value.
            if [ "$cr_mode" != "deployment" ]; then
              echo "FAIL: CR ${CLUSTER_SCRAPER_CR} spec.mode is ${cr_mode}, expected deployment."
              exit 1
            fi
            if [ "$cr_hostnetwork" != "false" ]; then
              echo "FAIL: CR ${CLUSTER_SCRAPER_CR} spec.hostNetwork is ${cr_hostnetwork}, expected false -- refusing to touch the Deployment based on a CR that does not yet carry the corrected value."
              exit 1
            fi
            if [ -z "$cr_uid" ]; then
              echo "FAIL: could not read metadata.uid for CR ${CLUSTER_SCRAPER_CR}."
              exit 1
            fi

            # 3. Read the existing Deployment, if any.
            local deploy_json=""
            if kubectl get deployment "$CLUSTER_SCRAPER_DEPLOYMENT" -n "$TARGET_NAMESPACE" >/dev/null 2>&1; then
              deploy_json="$(kubectl get deployment "$CLUSTER_SCRAPER_DEPLOYMENT" -n "$TARGET_NAMESPACE" -o json)"
            fi

            if [ -z "$deploy_json" ]; then
              echo "Deployment/${CLUSTER_SCRAPER_DEPLOYMENT} does not exist yet -- nothing to correct; the operator's normal creation path (not the buggy merge/update path) will produce hostNetwork=false directly."
              echo "not_required" > "$CORRECTION_SUMMARY_FILE"
              return 0
            fi

            local deploy_hostnetwork
            deploy_hostnetwork="$(jq -r '.spec.template.spec.hostNetwork // false' <<<"$deploy_json")"

            # 4. Already false: nothing to do, idempotent success.
            if [ "$deploy_hostnetwork" = "false" ]; then
              echo "OK: Deployment/${CLUSTER_SCRAPER_DEPLOYMENT} spec.template.spec.hostNetwork is already false -- correction not required."
              echo "not_required" > "$CORRECTION_SUMMARY_FILE"
              return 0
            fi

            # 5. hostNetwork == true: perform every ownership check before any deletion.
            echo "Deployment/${CLUSTER_SCRAPER_DEPLOYMENT} spec.template.spec.hostNetwork is true -- verifying ownership before any deletion."

            local owner_count
            owner_count="$(jq '[.metadata.ownerReferences[]? | select(.controller == true)] | length' <<<"$deploy_json")"
            if [ "$owner_count" -ne 1 ]; then
              echo "FAIL: Deployment/${CLUSTER_SCRAPER_DEPLOYMENT} has ${owner_count} controller ownerReferences, expected exactly 1. Refusing to delete."
              exit 1
            fi

            local owner_kind owner_name owner_apiversion owner_uid deploy_namespace deploy_name
            owner_kind="$(jq -r '[.metadata.ownerReferences[]? | select(.controller == true)][0].kind' <<<"$deploy_json")"
            owner_name="$(jq -r '[.metadata.ownerReferences[]? | select(.controller == true)][0].name' <<<"$deploy_json")"
            owner_apiversion="$(jq -r '[.metadata.ownerReferences[]? | select(.controller == true)][0].apiVersion' <<<"$deploy_json")"
            owner_uid="$(jq -r '[.metadata.ownerReferences[]? | select(.controller == true)][0].uid' <<<"$deploy_json")"
            deploy_namespace="$(jq -r '.metadata.namespace' <<<"$deploy_json")"
            deploy_name="$(jq -r '.metadata.name' <<<"$deploy_json")"

            local ownership_ok="true"
            [ "$owner_kind" = "AmazonCloudWatchAgent" ] || { echo "FAIL: ownerReference.kind is ${owner_kind}, expected AmazonCloudWatchAgent."; ownership_ok="false"; }
            [ "$owner_name" = "$CLUSTER_SCRAPER_CR" ] || { echo "FAIL: ownerReference.name is ${owner_name}, expected ${CLUSTER_SCRAPER_CR}."; ownership_ok="false"; }
            case "$owner_apiversion" in
              cloudwatch.aws.amazon.com/*) ;;
              *) echo "FAIL: ownerReference.apiVersion is ${owner_apiversion}, expected the cloudwatch.aws.amazon.com API group."; ownership_ok="false" ;;
            esac
            [ "$deploy_namespace" = "$TARGET_NAMESPACE" ] || { echo "FAIL: Deployment namespace is ${deploy_namespace}, expected ${TARGET_NAMESPACE}."; ownership_ok="false"; }
            [ "$deploy_name" = "$CLUSTER_SCRAPER_DEPLOYMENT" ] || { echo "FAIL: Deployment name is ${deploy_name}, expected ${CLUSTER_SCRAPER_DEPLOYMENT}."; ownership_ok="false"; }

            local uid_match="false"
            [ "$owner_uid" = "$cr_uid" ] && uid_match="true"
            [ "$uid_match" = "true" ] || { echo "FAIL: ownerReference.uid does not match the live CR metadata.uid."; ownership_ok="false"; }

            echo "Ownership validation: name=${deploy_name} uidMatch=${uid_match} hostNetwork=${deploy_hostnetwork} result=${ownership_ok}"

            if [ "$ownership_ok" != "true" ]; then
              echo "FAIL: ownership validation failed -- never deleting an unowned, differently owned, or ambiguously owned Deployment."
              exit 1
            fi

            # Task 4: controlled delete and recreate -- at most one deletion per workflow run.
            local old_uid
            old_uid="$(jq -r '.metadata.uid' <<<"$deploy_json")"

            echo "Deleting deployment/${CLUSTER_SCRAPER_DEPLOYMENT} in ${TARGET_NAMESPACE} (bounded, idempotent corrective recreation -- the operator's own creation path will rebuild it with the correct hostNetwork=false)."
            kubectl delete deployment "$CLUSTER_SCRAPER_DEPLOYMENT" -n "$TARGET_NAMESPACE" --wait=true --timeout=60s

            # UID replacement, not an observed NotFound interval, is the recreation signal: the operator can recreate a same-named Deployment between polls, so NotFound may never be witnessed.
            local RECREATE_TIMEOUT=180
            local NUDGE_AFTER=60
            local recreate_elapsed=0
            local nudged="false"
            local new_uid new_deletion_ts new_deploy_json

            while true; do
              if new_deploy_json="$(kubectl get deployment "$CLUSTER_SCRAPER_DEPLOYMENT" -n "$TARGET_NAMESPACE" -o json 2>/dev/null)"; then
                new_uid="$(jq -r '.metadata.uid // empty' <<<"$new_deploy_json")"
                new_deletion_ts="$(jq -r '.metadata.deletionTimestamp // empty' <<<"$new_deploy_json")"

                if [ -n "$new_uid" ] && [ "$new_uid" != "$old_uid" ]; then
                  echo "OK: Deployment/${CLUSTER_SCRAPER_DEPLOYMENT} was recreated by the operator (new UID differs from the deleted one)."
                  break
                elif [ -n "$new_deletion_ts" ]; then
                  echo "Deployment/${CLUSTER_SCRAPER_DEPLOYMENT} still carries the old UID and is terminating -- continuing to wait."
                else
                  echo "Deployment/${CLUSTER_SCRAPER_DEPLOYMENT} still carries the old UID -- continuing to wait for recreation."
                fi
              else
                echo "Deployment/${CLUSTER_SCRAPER_DEPLOYMENT} not found (not yet recreated) -- continuing to wait."
              fi

              if [ "$recreate_elapsed" -ge "$RECREATE_TIMEOUT" ]; then
                echo "FAIL: operator did not recreate deployment/${CLUSTER_SCRAPER_DEPLOYMENT} with a new UID within ${RECREATE_TIMEOUT}s."
                exit 1
              fi

              if [ "$nudged" != "true" ] && [ "$recreate_elapsed" -ge "$NUDGE_AFTER" ]; then
                echo "Operator has not recreated the Deployment after ${NUDGE_AFTER}s -- triggering a harmless reconciliation nudge via a dedicated CR annotation (no spec field is touched)."
                kubectl annotate amazoncloudwatchagents.cloudwatch.aws.amazon.com "$CLUSTER_SCRAPER_CR" -n "$TARGET_NAMESPACE" \
                  "${RECONCILE_ANNOTATION}=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite
                nudged="true"
              fi

              sleep 10
              recreate_elapsed=$((recreate_elapsed + 10))
            done

            # Task 5: validate the recreated Deployment via bounded polling.
            local RECREATE_VALIDATE_TIMEOUT=180
            local validate_elapsed=0
            while true; do
              deploy_json="$(kubectl get deployment "$CLUSTER_SCRAPER_DEPLOYMENT" -n "$TARGET_NAMESPACE" -o json)"

              local d_uid d_deletion_ts d_generation d_observed d_hostnetwork d_desired d_updated d_available d_unavailable
              d_uid="$(jq -r '.metadata.uid' <<<"$deploy_json")"
              d_deletion_ts="$(jq -r '.metadata.deletionTimestamp // empty' <<<"$deploy_json")"
              d_generation="$(jq -r '.metadata.generation // 0' <<<"$deploy_json")"
              d_observed="$(jq -r '.status.observedGeneration // 0' <<<"$deploy_json")"
              d_hostnetwork="$(jq -r '.spec.template.spec.hostNetwork // false' <<<"$deploy_json")"
              d_desired="$(jq -r '.spec.replicas // 0' <<<"$deploy_json")"
              d_updated="$(jq -r '.status.updatedReplicas // 0' <<<"$deploy_json")"
              d_available="$(jq -r '.status.availableReplicas // 0' <<<"$deploy_json")"
              d_unavailable="$(jq -r '.status.unavailableReplicas // 0' <<<"$deploy_json")"

              echo "Recreated Deployment poll: uidChanged=$([ "$d_uid" != "$old_uid" ] && echo true || echo false) hostNetwork=${d_hostnetwork} generation=${d_generation} observed=${d_observed} desired=${d_desired} updated=${d_updated} available=${d_available} unavailable=${d_unavailable}"

              if [ "$d_uid" = "$old_uid" ]; then
                echo "FAIL: Deployment UID did not change -- this is not actually a recreated object."
                exit 1
              fi
              if [ -n "$d_deletion_ts" ]; then
                echo "FAIL: recreated Deployment already has a deletionTimestamp."
                exit 1
              fi
              if [ "$d_hostnetwork" != "false" ]; then
                echo "FAIL: recreated Deployment spec.template.spec.hostNetwork is ${d_hostnetwork}, expected false -- the corrective recreate did not fix the issue. Not deleting a second time."
                exit 1
              fi

              if [ "$d_generation" = "$d_observed" ] && [ "$d_desired" -gt 0 ] && [ "$d_updated" -eq "$d_desired" ] && [ "$d_available" -eq "$d_desired" ] && { [ -z "$d_unavailable" ] || [ "$d_unavailable" = "0" ]; }; then
                echo "OK: recreated Deployment/${CLUSTER_SCRAPER_DEPLOYMENT} is fully ready and available (hostNetwork=false, ${d_available}/${d_desired})."
                break
              fi

              if [ "$validate_elapsed" -ge "$RECREATE_VALIDATE_TIMEOUT" ]; then
                echo "FAIL: recreated Deployment/${CLUSTER_SCRAPER_DEPLOYMENT} did not become fully ready within ${RECREATE_VALIDATE_TIMEOUT}s."
                exit 1
              fi
              sleep 10
              validate_elapsed=$((validate_elapsed + 10))
            done

            echo "recreated_once" > "$CORRECTION_SUMMARY_FILE"
          }

          ensure_cluster_scraper_host_network_isolated

          # Task 6: validate active scraper pod(s) unconditionally; selector is dynamically derived from the live Deployment, never hardcoded.
          FINAL_DEPLOY_JSON="$(kubectl get deployment "$CLUSTER_SCRAPER_DEPLOYMENT" -n "$TARGET_NAMESPACE" -o json)"
          FINAL_DEPLOY_UID="$(jq -r '.metadata.uid' <<<"$FINAL_DEPLOY_JSON")"
          FINAL_SELECTOR="$(jq -r '(.spec.selector.matchLabels // {}) | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$FINAL_DEPLOY_JSON")"
          if [ -z "$FINAL_SELECTOR" ] || [ "$FINAL_SELECTOR" = "null" ]; then
            echo "FAIL: could not derive a pod selector for Deployment/${CLUSTER_SCRAPER_DEPLOYMENT}."
            exit 1
          fi

          ALL_SCRAPER_PODS_JSON="$(kubectl get pods -n "$TARGET_NAMESPACE" -l "$FINAL_SELECTOR" -o json)"
          ACTIVE_POD_FOUND="false"

          while IFS= read -r pod_name; do
            [ -z "$pod_name" ] && continue
            pod_json="$(jq -c --arg n "$pod_name" '.items[] | select(.metadata.name==$n)' <<<"$ALL_SCRAPER_PODS_JSON")"

            deletion_ts="$(jq -r '.metadata.deletionTimestamp // empty' <<<"$pod_json")"
            [ -n "$deletion_ts" ] && continue

            rs_owner_name="$(jq -r '[.metadata.ownerReferences[]? | select(.controller==true and .kind=="ReplicaSet")][0].name // empty' <<<"$pod_json")"
            [ -z "$rs_owner_name" ] && continue

            rs_json="$(kubectl get replicaset "$rs_owner_name" -n "$TARGET_NAMESPACE" -o json 2>/dev/null || true)"
            [ -z "$rs_json" ] && continue
            rs_deploy_uid="$(jq -r '[.metadata.ownerReferences[]? | select(.controller==true and .kind=="Deployment")][0].uid // empty' <<<"$rs_json")"
            [ "$rs_deploy_uid" != "$FINAL_DEPLOY_UID" ] && continue

            phase="$(jq -r '.status.phase // ""' <<<"$pod_json")"
            ready_status="$(jq -r '([.status.conditions[]? | select(.type=="Ready")] | first | .status) // "Unknown"' <<<"$pod_json")"
            pod_hostnetwork="$(jq -r '.spec.hostNetwork // false' <<<"$pod_json")"
            pod_ip="$(jq -r '.status.podIP // ""' <<<"$pod_json")"
            host_ip="$(jq -r '.status.hostIP // ""' <<<"$pod_json")"
            node_name="$(jq -r '.spec.nodeName // "<none>"' <<<"$pod_json")"
            pod_sa="$(jq -r '.spec.serviceAccountName // ""' <<<"$pod_json")"
            env_names="$(jq -r '[.spec.containers[]?.env[]?.name] | .[]' <<<"$pod_json")"

            [ "$phase" != "Running" ] && continue
            [ "$ready_status" != "True" ] && continue

            ACTIVE_POD_FOUND="true"
            ip_differs="false"
            [ -n "$pod_ip" ] && [ -n "$host_ip" ] && [ "$pod_ip" != "$host_ip" ] && ip_differs="true"

            echo "pod/${pod_name}: node=${node_name} hostNetwork=${pod_hostnetwork} podIPDiffersFromHostIP=${ip_differs} ready=${ready_status} serviceAccount=${pod_sa}"

            if [ "$pod_hostnetwork" != "false" ]; then
              echo "FAIL: active scraper pod ${pod_name} spec.hostNetwork is ${pod_hostnetwork}, expected false."
              exit 1
            fi
            if [ "$ip_differs" != "true" ]; then
              echo "FAIL: active scraper pod ${pod_name} podIP does not differ from hostIP (podIP=${pod_ip:-<empty>})."
              exit 1
            fi
            if [ "$pod_sa" != "$CLOUDWATCH_AGENT_SERVICE_ACCOUNT" ]; then
              echo "FAIL: active scraper pod ${pod_name} serviceAccountName is ${pod_sa}, expected ${CLOUDWATCH_AGENT_SERVICE_ACCOUNT}."
              exit 1
            fi
            if ! grep -qx "AWS_ROLE_ARN" <<< "$env_names"; then
              echo "FAIL: active scraper pod ${pod_name} is missing the AWS_ROLE_ARN environment variable."
              exit 1
            fi
            if ! grep -qx "AWS_WEB_IDENTITY_TOKEN_FILE" <<< "$env_names"; then
              echo "FAIL: active scraper pod ${pod_name} is missing the AWS_WEB_IDENTITY_TOKEN_FILE environment variable."
              exit 1
            fi
            echo "OK: pod/${pod_name} -- IRSA variable names present (values not printed)."
          done < <(jq -r '.items[].metadata.name' <<<"$ALL_SCRAPER_PODS_JSON")

          if [ "$ACTIVE_POD_FOUND" != "true" ]; then
            echo "FAIL: no active (Running, Ready, current-ReplicaSet) cluster-scraper pod was found."
            exit 1
          fi
          echo "OK: every active cluster-scraper pod has hostNetwork=false, a distinct podIP/hostIP, the correct ServiceAccount, and both IRSA environment variable names present."

          echo "Cluster-scraper correction summary: $(cat "$CORRECTION_SUMMARY_FILE")"

      - name: Annotate the CloudWatch Agent ServiceAccount with the dedicated IRSA role
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          # This chart has no values-driven ServiceAccount annotation mechanism, so this annotates the existing ServiceAccount directly; it survives selfHeal only via the Application's ignoreDifferences + RespectIgnoreDifferences=true (see "Create or update the Argo CD Application" above).
          kubectl get serviceaccount "$CLOUDWATCH_AGENT_SERVICE_ACCOUNT" -n "$TARGET_NAMESPACE" >/dev/null

          kubectl annotate serviceaccount "$CLOUDWATCH_AGENT_SERVICE_ACCOUNT" -n "$TARGET_NAMESPACE" \
            "eks.amazonaws.com/role-arn=${CLOUDWATCH_METRICS_ROLE_ARN}" \
            --overwrite

          ACTUAL_ROLE_ARN="$(kubectl get serviceaccount "$CLOUDWATCH_AGENT_SERVICE_ACCOUNT" -n "$TARGET_NAMESPACE" -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}')"
          if [ "$ACTUAL_ROLE_ARN" != "$CLOUDWATCH_METRICS_ROLE_ARN" ]; then
            echo "FAIL: ServiceAccount ${CLOUDWATCH_AGENT_SERVICE_ACCOUNT} role-arn annotation is ${ACTUAL_ROLE_ARN}, expected ${CLOUDWATCH_METRICS_ROLE_ARN}."
            exit 1
          fi
          echo "OK: ServiceAccount ${TARGET_NAMESPACE}/${CLOUDWATCH_AGENT_SERVICE_ACCOUNT} annotated with ${CLOUDWATCH_METRICS_ROLE_ARN}."

          # Restart workloads using this ServiceAccount so existing pods pick up the projected IRSA token volume.
          if kubectl get daemonset cloudwatch-agent -n "$TARGET_NAMESPACE" >/dev/null 2>&1; then
            kubectl rollout restart daemonset/cloudwatch-agent -n "$TARGET_NAMESPACE"
          fi
          if kubectl get deployment cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE" >/dev/null 2>&1; then
            kubectl rollout restart deployment/cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE"
          fi

      - name: Wait for CloudWatch Agent workloads to roll out
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          # `kubectl rollout status` on a DaemonSet can report success while a pod is still not Ready (e.g. READY=1 AVAILABLE=1 against DESIRED=2 with maxUnavailable=1); wait_for_daemonset_fully_ready below is an additional exact-readiness gate on top of it.
          wait_for_daemonset_fully_ready() {
            local namespace="$1"
            local ds_name="$2"
            local timeout_seconds="$3"
            local poll_interval=10
            local start_ts elapsed now_ts
            local generation observed desired current updated ready available unavailable
            local ds_json

            start_ts="$(date +%s)"

            while true; do
              ds_json="$(kubectl get daemonset "$ds_name" -n "$namespace" -o json)"

              generation="$(jq -r '.metadata.generation // 0' <<<"$ds_json")"
              observed="$(jq -r '.status.observedGeneration // 0' <<<"$ds_json")"
              desired="$(jq -r '.status.desiredNumberScheduled // 0' <<<"$ds_json")"
              current="$(jq -r '.status.currentNumberScheduled // 0' <<<"$ds_json")"
              updated="$(jq -r '.status.updatedNumberScheduled // 0' <<<"$ds_json")"
              ready="$(jq -r '.status.numberReady // 0' <<<"$ds_json")"
              available="$(jq -r '.status.numberAvailable // 0' <<<"$ds_json")"
              unavailable="$(jq -r '.status.numberUnavailable // 0' <<<"$ds_json")"

              echo "${ds_name}: generation=${generation} observed=${observed} desired=${desired} current=${current} updated=${updated} ready=${ready} available=${available} unavailable=${unavailable}"

              if [ "$generation" = "$observed" ] \
                && [ "$desired" -gt 0 ] \
                && [ "$current" -eq "$desired" ] \
                && [ "$updated" -eq "$desired" ] \
                && [ "$ready" -eq "$desired" ] \
                && [ "$available" -eq "$desired" ] \
                && [ "$unavailable" -eq 0 ]; then
                echo "OK: ${ds_name} is fully ready (${ready}/${desired}, generation=${generation} observed=${observed})."
                return 0
              fi

              now_ts="$(date +%s)"
              elapsed=$(( now_ts - start_ts ))
              if [ "$elapsed" -ge "$timeout_seconds" ]; then
                return 1
              fi
              sleep "$poll_interval"
            done
          }

          show_daemonset_diagnostics() {
            local namespace="$1"
            local ds_name="$2"
            local ds_json selector pods_json not_ready_pods

            echo "----- DaemonSet diagnostics: ${namespace}/${ds_name} -----"

            ds_json="$(kubectl get daemonset "$ds_name" -n "$namespace" -o json 2>/dev/null || true)"
            if [ -z "$ds_json" ]; then
              echo "Could not retrieve DaemonSet ${ds_name} for diagnostics."
              return 0
            fi

            echo "Status fields:"
            jq -r '.status | "desiredNumberScheduled=\(.desiredNumberScheduled // 0) currentNumberScheduled=\(.currentNumberScheduled // 0) updatedNumberScheduled=\(.updatedNumberScheduled // 0) numberReady=\(.numberReady // 0) numberAvailable=\(.numberAvailable // 0) numberUnavailable=\(.numberUnavailable // 0) numberMisscheduled=\(.numberMisscheduled // 0) observedGeneration=\(.observedGeneration // 0)"' <<<"$ds_json"

            selector="$(jq -r '(.spec.selector.matchLabels // {}) | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$ds_json")"
            if [ -z "$selector" ] || [ "$selector" = "null" ]; then
              echo "Could not derive a pod selector from spec.selector.matchLabels."
              return 0
            fi
            echo "Derived pod selector (from spec.selector.matchLabels): ${selector}"

            pods_json="$(kubectl get pods -n "$namespace" -l "$selector" -o json 2>/dev/null || true)"
            if [ -z "$pods_json" ]; then
              echo "Could not list pods for selector ${selector}."
              return 0
            fi

            echo ""
            echo "Matching pods (bounded table, no full pod spec):"
            echo "NAME|NODE|PHASE|READY|CONTAINERS_READY|RESTARTS|WAITING_REASON|TERMINATED_REASON"
            jq -r '
              .items[]
              | [
                  .metadata.name,
                  (.spec.nodeName // "<none>"),
                  (.status.phase // "<none>"),
                  ([.status.conditions[]? | select(.type=="Ready") | .status] | first // "Unknown"),
                  ((([.status.containerStatuses[]? | select(.ready==true)] | length) | tostring) + "/" + ((.status.containerStatuses // []) | length | tostring)),
                  (([.status.containerStatuses[]?.restartCount] | add // 0) | tostring),
                  (([.status.containerStatuses[]?.state.waiting.reason] | map(select(. != null))) | join(";")),
                  (([.status.containerStatuses[]?.state.terminated.reason] | map(select(. != null))) | join(";"))
                ]
              | join("|")
            ' <<<"$pods_json" || true

            not_ready_pods="$(jq -r '.items[] | select(([.status.conditions[]? | select(.type=="Ready" and .status=="True")] | length) == 0) | .metadata.name' <<<"$pods_json")"

            if [ -z "$not_ready_pods" ]; then
              echo ""
              echo "No non-Ready pods matched the selector (the readiness gap is in another exact-readiness field)."
              echo "----- end diagnostics: ${namespace}/${ds_name} -----"
              return 0
            fi

            while IFS= read -r pod_name; do
              [ -z "$pod_name" ] && continue

              local pod_json node_name restart_count container_names container_name

              pod_json="$(jq -c --arg n "$pod_name" '.items[] | select(.metadata.name==$n)' <<<"$pods_json")"
              node_name="$(jq -r '.spec.nodeName // "<none>"' <<<"$pod_json")"
              restart_count="$(jq -r '[.status.containerStatuses[]?.restartCount] | add // 0' <<<"$pod_json")"

              echo ""
              echo "--- Not-Ready pod: ${pod_name} (node: ${node_name}) ---"

              echo "Recent events (bounded to ~20 lines):"
              kubectl get events -n "$namespace" --field-selector "involvedObject.name=${pod_name}" --sort-by=.lastTimestamp 2>/dev/null | tail -n 20 || echo "Could not retrieve events."

              # Container name(s) come from the pod's own spec, never an assumed/invented name.
              container_names="$(jq -r '.spec.containers[]?.name' <<<"$pod_json")"

              while IFS= read -r container_name; do
                [ -z "$container_name" ] && continue

                echo ""
                echo "Current logs, container '${container_name}' (last 80 lines, no env values/tokens/full spec):"
                kubectl logs "$pod_name" -n "$namespace" -c "$container_name" --tail=80 2>/dev/null || echo "No current logs available."

                if [ "${restart_count:-0}" -gt 0 ]; then
                  echo ""
                  echo "Previous logs, container '${container_name}' (last 80 lines, --previous):"
                  kubectl logs "$pod_name" -n "$namespace" -c "$container_name" --tail=80 --previous 2>/dev/null || echo "No previous logs available (tolerated)."
                fi
              done <<< "$container_names"
            done <<< "$not_ready_pods"

            echo "----- end diagnostics: ${namespace}/${ds_name} -----"
          }

          if kubectl get daemonset cloudwatch-agent -n "$TARGET_NAMESPACE" >/dev/null 2>&1; then
            kubectl rollout status daemonset/cloudwatch-agent -n "$TARGET_NAMESPACE" --timeout=10m
            if ! wait_for_daemonset_fully_ready "$TARGET_NAMESPACE" cloudwatch-agent 600; then
              show_daemonset_diagnostics "$TARGET_NAMESPACE" cloudwatch-agent
              echo "FAIL: cloudwatch-agent did not reach full readiness before the bounded timeout."
              exit 1
            fi
          fi
          if kubectl get deployment cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE" >/dev/null 2>&1; then
            kubectl rollout status deployment/cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE" --timeout=10m
          fi
          kubectl rollout status deployment/amazon-cloudwatch-observability-controller-manager -n "$TARGET_NAMESPACE" --timeout=10m
          kubectl rollout status deployment/kube-state-metrics -n "$TARGET_NAMESPACE" --timeout=10m
          kubectl rollout status daemonset/node-exporter -n "$TARGET_NAMESPACE" --timeout=10m
          if ! wait_for_daemonset_fully_ready "$TARGET_NAMESPACE" node-exporter 600; then
            show_daemonset_diagnostics "$TARGET_NAMESPACE" node-exporter
            echo "FAIL: node-exporter did not reach full readiness before the bounded timeout."
            exit 1
          fi

      - name: Verify IRSA injection on the recreated CloudWatch Agent pods
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          # Only checks env var NAMES for presence, never a value/token/full pod spec. Checks EVERY node-level cloudwatch-agent DaemonSet pod, not just one sample, so a single unready pod cannot hide behind an already-healthy one picked at random.
          find_ready_pod_owned_by() {
            local owner_kind="$1"
            local owner_name_prefix="$2"
            kubectl get pods -n "$TARGET_NAMESPACE" -o json \
              | jq -r --arg kind "$owner_kind" --arg prefix "$owner_name_prefix" '
                  .items[]
                  | select(.status.phase == "Running")
                  | select([.status.conditions[]? | select(.type == "Ready" and .status == "True")] | length > 0)
                  | select(.metadata.ownerReferences[]? | .kind == $kind and (.name | startswith($prefix)))
                  | .metadata.name
                ' | head -n1
          }

          verify_pod_irsa() {
            local workload_label="$1"
            local pod_name="$2"

            if [ -z "$pod_name" ]; then
              echo "FAIL: no pod name supplied for ${workload_label}."
              exit 1
            fi
            echo "Checking ${workload_label} pod: ${pod_name}"

            local pod_json phase ready_status pod_sa env_names

            pod_json="$(kubectl get pod "$pod_name" -n "$TARGET_NAMESPACE" -o json)"

            phase="$(jq -r '.status.phase // ""' <<<"$pod_json")"
            if [ "$phase" != "Running" ]; then
              echo "FAIL: ${workload_label} pod ${pod_name} is in phase ${phase}, expected Running."
              exit 1
            fi

            ready_status="$(jq -r '([.status.conditions[]? | select(.type=="Ready")] | first | .status) // "Unknown"' <<<"$pod_json")"
            if [ "$ready_status" != "True" ]; then
              echo "FAIL: ${workload_label} pod ${pod_name} Ready condition is ${ready_status}, expected True."
              exit 1
            fi
            echo "OK: phase=Running, Ready=True"

            pod_sa="$(jq -r '.spec.serviceAccountName // ""' <<<"$pod_json")"
            if [ "$pod_sa" != "$CLOUDWATCH_AGENT_SERVICE_ACCOUNT" ]; then
              echo "FAIL: ${workload_label} pod ${pod_name} uses serviceAccountName=${pod_sa}, expected ${CLOUDWATCH_AGENT_SERVICE_ACCOUNT}."
              exit 1
            fi
            echo "OK: serviceAccountName == ${CLOUDWATCH_AGENT_SERVICE_ACCOUNT}"

            env_names="$(jq -r '[.spec.containers[]?.env[]?.name] | .[]' <<<"$pod_json")"

            if ! grep -qx "AWS_ROLE_ARN" <<< "$env_names"; then
              echo "FAIL: ${workload_label} pod ${pod_name} is missing the AWS_ROLE_ARN environment variable."
              exit 1
            fi
            echo "OK: AWS_ROLE_ARN is present (value not printed)."

            if ! grep -qx "AWS_WEB_IDENTITY_TOKEN_FILE" <<< "$env_names"; then
              echo "FAIL: ${workload_label} pod ${pod_name} is missing the AWS_WEB_IDENTITY_TOKEN_FILE environment variable."
              exit 1
            fi
            echo "OK: AWS_WEB_IDENTITY_TOKEN_FILE is present (value not printed)."
          }

          verify_daemonset_irsa_all_pods() {
            local namespace="$1"
            local ds_name="$2"
            local ds_json desired selector pods_json pod_count pod_names checked pod_name

            ds_json="$(kubectl get daemonset "$ds_name" -n "$namespace" -o json)"
            desired="$(jq -r '.status.desiredNumberScheduled // 0' <<<"$ds_json")"
            selector="$(jq -r '(.spec.selector.matchLabels // {}) | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$ds_json")"

            if [ -z "$selector" ] || [ "$selector" = "null" ]; then
              echo "FAIL: could not derive a pod selector for DaemonSet ${ds_name} from spec.selector.matchLabels."
              exit 1
            fi
            if [ -z "$desired" ] || [ "$desired" -eq 0 ]; then
              echo "FAIL: DaemonSet ${ds_name} desiredNumberScheduled is zero or empty (${desired})."
              exit 1
            fi

            echo "Verifying IRSA on every ${ds_name} pod (selector: ${selector}, expected count: ${desired})..."

            pods_json="$(kubectl get pods -n "$namespace" -l "$selector" -o json)"
            pod_count="$(jq '.items | length' <<<"$pods_json")"
            if [ "$pod_count" -ne "$desired" ]; then
              echo "FAIL: found ${pod_count} pods for DaemonSet ${ds_name}, expected exactly ${desired} (desiredNumberScheduled) -- a desired node-agent pod is missing."
              exit 1
            fi

            pod_names="$(jq -r '.items[].metadata.name' <<<"$pods_json")"
            checked=0
            while IFS= read -r pod_name; do
              [ -z "$pod_name" ] && continue
              verify_pod_irsa "${ds_name} DaemonSet" "$pod_name"
              checked=$((checked + 1))
            done <<< "$pod_names"

            if [ "$checked" -ne "$desired" ]; then
              echo "FAIL: checked ${checked} ${ds_name} pods, expected ${desired}."
              exit 1
            fi
            echo "OK: IRSA verified on all ${checked} ${ds_name} DaemonSet pods (matches desiredNumberScheduled=${desired})."
          }

          verify_daemonset_irsa_all_pods "$TARGET_NAMESPACE" cloudwatch-agent

          CLUSTER_SCRAPER_POD="$(find_ready_pod_owned_by "ReplicaSet" "cloudwatch-agent-cluster-scraper")"
          verify_pod_irsa "cloudwatch-agent-cluster-scraper Deployment" "$CLUSTER_SCRAPER_POD"

          echo "OK: IRSA injection verified on every cloudwatch-agent DaemonSet pod and the cluster-scraper pod."

      - name: Validate no recent CloudWatch export errors
        # Proves only the ABSENCE of recent authorization/export/port-collision error signatures in collector pod logs; it does not call the CloudWatch API and does not prove metrics are visible in CloudWatch (this role has no CloudWatch read permissions).
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          # Captured before the observation period so --since-time excludes historical errors already in the logs from before this run.
          VALIDATION_START_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Bounded wait to let a couple of export cycles occur before inspecting logs; this only needs to observe, not wait for a state transition.
          OBSERVATION_PERIOD_SECONDS=90
          echo "Observing active CloudWatch Agent pod logs for ${OBSERVATION_PERIOD_SECONDS}s starting at ${VALIDATION_START_TS} (covers multiple export attempts)."
          sleep "$OBSERVATION_PERIOD_SECONDS"

          AUTH_ERROR_PATTERN='PermissionDenied|HTTP Status Code 403|not authorized to perform: cloudwatch:PutMetricData|no identity-based policy allows|Exporting failed\. Dropping data\.|error exporting items|resource: arn:aws:cloudwatch:|dataset/default'
          STARTUP_ERROR_PATTERN='binding address localhost:8888|listen tcp 127\.0\.0\.1:8888|bind: address already in use|failed to create SDK'

          ANY_NEW_ERROR="false"

          # Deliberately no "|| true" on kubectl logs: a failed retrieval must fail this step rather than being silently treated as "no errors found".
          check_pod_logs() {
            local pod_name="$1"
            local pod_json="$2"

            local container_names container_name
            container_names="$(jq -r '.spec.containers[]?.name' <<<"$pod_json")"

            while IFS= read -r container_name; do
              [ -z "$container_name" ] && continue

              local log_tail log_status
              set +e
              log_tail="$(kubectl logs "$pod_name" -n "$TARGET_NAMESPACE" -c "$container_name" --since-time="$VALIDATION_START_TS" --tail=80 2>&1)"
              log_status=$?
              set -e

              if [ "$log_status" -ne 0 ]; then
                echo "FAIL: could not retrieve logs for pod ${pod_name} container ${container_name} (kubectl logs exited ${log_status})."
                exit 1
              fi

              local auth_found="false"
              local startup_found="false"
              echo "$log_tail" | grep -qEi "$AUTH_ERROR_PATTERN" && auth_found="true"
              echo "$log_tail" | grep -qEi "$STARTUP_ERROR_PATTERN" && startup_found="true"

              echo "pod/${pod_name} container/${container_name}: newAuthorizationErrors=${auth_found} newPortCollisionErrors=${startup_found}"

              if [ "$auth_found" = "true" ]; then
                echo "FAIL: pod ${pod_name} container ${container_name} emitted a new CloudWatch metrics authorization/export error since ${VALIDATION_START_TS} (bounded, matching lines only):"
                echo "$log_tail" | grep -Ei "$AUTH_ERROR_PATTERN" | head -n 15
                ANY_NEW_ERROR="true"
              fi
              if [ "$startup_found" = "true" ]; then
                echo "FAIL: pod ${pod_name} container ${container_name} emitted a new port-collision/startup error since ${VALIDATION_START_TS}:"
                echo "$log_tail" | grep -Ei "$STARTUP_ERROR_PATTERN" | head -n 15
                ANY_NEW_ERROR="true"
              fi
            done <<< "$container_names"
          }

          # Active, current-revision cloudwatch-agent DaemonSet pods.
          CW_DS_JSON_AUTH="$(kubectl get daemonset cloudwatch-agent -n "$TARGET_NAMESPACE" -o json)"
          CW_DS_UID_AUTH="$(jq -r '.metadata.uid' <<<"$CW_DS_JSON_AUTH")"
          CW_DS_DESIRED_AUTH="$(jq -r '.status.desiredNumberScheduled // 0' <<<"$CW_DS_JSON_AUTH")"
          CW_SELECTOR_AUTH="$(jq -r '(.spec.selector.matchLabels // {}) | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$CW_DS_JSON_AUTH")"
          CW_PODS_JSON_AUTH="$(kubectl get pods -n "$TARGET_NAMESPACE" -l "$CW_SELECTOR_AUTH" -o json)"

          CHECKED_NODE_AGENT_PODS=0
          while IFS= read -r pod_name; do
            [ -z "$pod_name" ] && continue
            pod_json="$(jq -c --arg n "$pod_name" '.items[] | select(.metadata.name==$n)' <<<"$CW_PODS_JSON_AUTH")"
            deletion_ts="$(jq -r '.metadata.deletionTimestamp // empty' <<<"$pod_json")"
            [ -n "$deletion_ts" ] && continue
            owner_uid="$(jq -r '[.metadata.ownerReferences[]? | select(.controller==true and .kind=="DaemonSet")][0].uid // empty' <<<"$pod_json")"
            [ "$owner_uid" != "$CW_DS_UID_AUTH" ] && continue
            check_pod_logs "$pod_name" "$pod_json"
            CHECKED_NODE_AGENT_PODS=$((CHECKED_NODE_AGENT_PODS + 1))
          done < <(jq -r '.items[].metadata.name' <<<"$CW_PODS_JSON_AUTH")

          echo "Checked node-agent pods: ${CHECKED_NODE_AGENT_PODS} (DaemonSet desiredNumberScheduled=${CW_DS_DESIRED_AUTH})"
          if [ "$CHECKED_NODE_AGENT_PODS" -ne "$CW_DS_DESIRED_AUTH" ]; then
            echo "FAIL: checked ${CHECKED_NODE_AGENT_PODS} active node-agent pods, expected exactly desiredNumberScheduled=${CW_DS_DESIRED_AUTH}."
            exit 1
          fi

          # Active, current-ReplicaSet cloudwatch-agent-cluster-scraper pods.
          SCRAPER_DEPLOY_JSON_AUTH="$(kubectl get deployment cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE" -o json)"
          SCRAPER_DEPLOY_UID_AUTH="$(jq -r '.metadata.uid' <<<"$SCRAPER_DEPLOY_JSON_AUTH")"
          SCRAPER_SELECTOR_AUTH="$(jq -r '(.spec.selector.matchLabels // {}) | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$SCRAPER_DEPLOY_JSON_AUTH")"
          SCRAPER_PODS_JSON_AUTH="$(kubectl get pods -n "$TARGET_NAMESPACE" -l "$SCRAPER_SELECTOR_AUTH" -o json)"

          CHECKED_SCRAPER_PODS=0
          while IFS= read -r pod_name; do
            [ -z "$pod_name" ] && continue
            pod_json="$(jq -c --arg n "$pod_name" '.items[] | select(.metadata.name==$n)' <<<"$SCRAPER_PODS_JSON_AUTH")"
            deletion_ts="$(jq -r '.metadata.deletionTimestamp // empty' <<<"$pod_json")"
            [ -n "$deletion_ts" ] && continue
            rs_owner_name="$(jq -r '[.metadata.ownerReferences[]? | select(.controller==true and .kind=="ReplicaSet")][0].name // empty' <<<"$pod_json")"
            [ -z "$rs_owner_name" ] && continue
            rs_json="$(kubectl get replicaset "$rs_owner_name" -n "$TARGET_NAMESPACE" -o json 2>/dev/null || true)"
            [ -z "$rs_json" ] && continue
            rs_deploy_uid="$(jq -r '[.metadata.ownerReferences[]? | select(.controller==true and .kind=="Deployment")][0].uid // empty' <<<"$rs_json")"
            [ "$rs_deploy_uid" != "$SCRAPER_DEPLOY_UID_AUTH" ] && continue
            check_pod_logs "$pod_name" "$pod_json"
            CHECKED_SCRAPER_PODS=$((CHECKED_SCRAPER_PODS + 1))
          done < <(jq -r '.items[].metadata.name' <<<"$SCRAPER_PODS_JSON_AUTH")

          echo "Checked cluster-scraper pods: ${CHECKED_SCRAPER_PODS}"
          if [ "$CHECKED_SCRAPER_PODS" -lt 1 ]; then
            echo "FAIL: checked ${CHECKED_SCRAPER_PODS} active cluster-scraper pods, expected at least 1."
            exit 1
          fi

          if [ "$ANY_NEW_ERROR" = "true" ]; then
            echo "FAIL: at least one active, current-revision CloudWatch Agent pod emitted a new authorization or port-collision error since ${VALIDATION_START_TS}."
            exit 1
          fi
          echo "OK: no active, current-revision CloudWatch Agent pod emitted a new authorization or port-collision error in the ${OBSERVATION_PERIOD_SECONDS}s observation window (this does not by itself confirm successful export to CloudWatch -- see Phase 6B3)."

      - name: Live Kubernetes validation
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          echo "1. Namespace:"
          kubectl get namespace "$TARGET_NAMESPACE"

          echo ""
          echo "2. CloudWatch Agent ServiceAccount annotation:"
          ROLE_ARN_ANNOTATION="$(kubectl get serviceaccount "$CLOUDWATCH_AGENT_SERVICE_ACCOUNT" -n "$TARGET_NAMESPACE" -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}')"
          if [ "$ROLE_ARN_ANNOTATION" != "$CLOUDWATCH_METRICS_ROLE_ARN" ]; then
            echo "FAIL: unexpected role-arn annotation: ${ROLE_ARN_ANNOTATION}"
            exit 1
          fi
          echo "OK: ${ROLE_ARN_ANNOTATION}"

          echo ""
          echo "3. Operator Deployment:"
          kubectl get deployment amazon-cloudwatch-observability-controller-manager -n "$TARGET_NAMESPACE"
          kubectl wait --for=condition=Available deployment/amazon-cloudwatch-observability-controller-manager -n "$TARGET_NAMESPACE" --timeout=60s

          echo ""
          echo "4. Node-level CloudWatch Agent DaemonSet (confirmation after the earlier exact-readiness wait in \"Wait for CloudWatch Agent workloads to roll out\" -- this is not the first place complete readiness is enforced):"
          kubectl get daemonset cloudwatch-agent -n "$TARGET_NAMESPACE"
          CW_DS_JSON="$(kubectl get daemonset cloudwatch-agent -n "$TARGET_NAMESPACE" -o json)"
          DESIRED="$(jq -r '.status.desiredNumberScheduled // empty' <<<"$CW_DS_JSON")"
          READY="$(jq -r '.status.numberReady // 0' <<<"$CW_DS_JSON")"
          AVAILABLE="$(jq -r '.status.numberAvailable // 0' <<<"$CW_DS_JSON")"
          echo "desired=${DESIRED:-<empty>} ready=${READY} available=${AVAILABLE}"
          if [ -z "${DESIRED:-}" ] || [ "$DESIRED" -eq 0 ]; then
            echo "FAIL: cloudwatch-agent DaemonSet desiredNumberScheduled is zero or empty -- cannot validate readiness."
            exit 1
          fi
          if [ "$READY" -ne "$DESIRED" ] || [ "$AVAILABLE" -ne "$DESIRED" ]; then
            echo "FAIL: cloudwatch-agent DaemonSet does not have all desired pods ready and available (desired=${DESIRED} ready=${READY} available=${AVAILABLE})."
            exit 1
          fi
          echo "OK: cloudwatch-agent DaemonSet is fully ready and available (${READY}/${DESIRED})."

          echo ""
          echo "5. Cluster scraper Deployment:"
          kubectl get deployment cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE"
          kubectl wait --for=condition=Available deployment/cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE" --timeout=60s

          echo ""
          echo "6. kube-state-metrics:"
          kubectl get deployment kube-state-metrics -n "$TARGET_NAMESPACE"
          kubectl wait --for=condition=Available deployment/kube-state-metrics -n "$TARGET_NAMESPACE" --timeout=60s

          echo ""
          echo "7. node-exporter (confirmation after the earlier exact-readiness wait, not the first place complete readiness is enforced):"
          kubectl get daemonset node-exporter -n "$TARGET_NAMESPACE"
          NE_DS_JSON="$(kubectl get daemonset node-exporter -n "$TARGET_NAMESPACE" -o json)"
          NE_DESIRED="$(jq -r '.status.desiredNumberScheduled // empty' <<<"$NE_DS_JSON")"
          NE_READY="$(jq -r '.status.numberReady // 0' <<<"$NE_DS_JSON")"
          NE_AVAILABLE="$(jq -r '.status.numberAvailable // 0' <<<"$NE_DS_JSON")"
          echo "desired=${NE_DESIRED:-<empty>} ready=${NE_READY} available=${NE_AVAILABLE}"
          if [ -z "${NE_DESIRED:-}" ] || [ "$NE_DESIRED" -eq 0 ]; then
            echo "FAIL: node-exporter DaemonSet desiredNumberScheduled is zero or empty -- cannot validate readiness."
            exit 1
          fi
          if [ "$NE_READY" -ne "$NE_DESIRED" ] || [ "$NE_AVAILABLE" -ne "$NE_DESIRED" ]; then
            echo "FAIL: node-exporter DaemonSet does not have all desired pods ready and available (desired=${NE_DESIRED} ready=${NE_READY} available=${NE_AVAILABLE})."
            exit 1
          fi
          echo "OK: node-exporter DaemonSet is fully ready and available (${NE_READY}/${NE_DESIRED})."

          echo ""
          echo "8. Every running image (containers and initContainers) in ${TARGET_NAMESPACE} is private, allow-listed, and digest-pinned:"
          RUNNING_IMAGES="$(kubectl get pods -n "$TARGET_NAMESPACE" -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{range .spec.initContainers[*]}{.image}{"\n"}{end}{end}' | sort -u)"
          echo "$RUNNING_IMAGES"
          ALLOWED_REPOS="aws-cloud-factory-cloudwatch-agent-operator aws-cloud-factory-cloudwatch-agent aws-cloud-factory-kube-state-metrics aws-cloud-factory-node-exporter"
          while IFS= read -r image_ref; do
            [ -z "$image_ref" ] && continue
            if [[ "$image_ref" != "${ECR_REGISTRY}/"* ]]; then
              echo "FAIL: running image ${image_ref} is not on the private registry."
              exit 1
            fi
            if [[ "$image_ref" != *"@sha256:"* ]]; then
              echo "FAIL: running image ${image_ref} has no immutable digest."
              exit 1
            fi
            REPO="${image_ref#"${ECR_REGISTRY}/"}"
            REPO="${REPO%%:*}"
            FOUND="false"
            for allowed in $ALLOWED_REPOS; do
              [ "$REPO" = "$allowed" ] && FOUND="true"
            done
            if [ "$FOUND" != "true" ]; then
              echo "FAIL: running image ${image_ref} belongs to an unapproved repository ${REPO}."
              exit 1
            fi
          done <<< "$RUNNING_IMAGES"
          echo "OK: every running image in ${TARGET_NAMESPACE} is private, allow-listed, and digest-pinned."

          echo ""
          echo "9. No Fluent Bit container or DaemonSet in ${TARGET_NAMESPACE}:"
          if kubectl get daemonset -n "$TARGET_NAMESPACE" -o name | grep -qi fluent; then
            echo "FAIL: a Fluent Bit-like DaemonSet exists in ${TARGET_NAMESPACE}."
            exit 1
          fi
          echo "OK: none found."

          echo ""
          echo "10. No Application Signals instrumentation resources created by this Application (scoped to ${TARGET_NAMESPACE} only -- this cluster may host unrelated Applications elsewhere that legitimately use this resource kind):"
          if kubectl get instrumentations.cloudwatch.aws.amazon.com -n "$TARGET_NAMESPACE" --no-headers 2>/dev/null | grep -q .; then
            echo "FAIL: an Instrumentation resource exists in ${TARGET_NAMESPACE}."
            exit 1
          fi
          echo "OK: none found in ${TARGET_NAMESPACE}."

          echo ""
          echo "11. No GPU or Neuron workload created by this Application (scoped to ${TARGET_NAMESPACE} only -- same reasoning as #10):"
          if kubectl get dcgmexporters.cloudwatch.aws.amazon.com -n "$TARGET_NAMESPACE" --no-headers 2>/dev/null | grep -q .; then
            echo "FAIL: a DcgmExporter resource exists in ${TARGET_NAMESPACE}."
            exit 1
          fi
          if kubectl get neuronmonitors.cloudwatch.aws.amazon.com -n "$TARGET_NAMESPACE" --no-headers 2>/dev/null | grep -q .; then
            echo "FAIL: a NeuronMonitor resource exists in ${TARGET_NAMESPACE}."
            exit 1
          fi
          echo "OK: none found in ${TARGET_NAMESPACE}."

          echo ""
          echo "12. No target allocator:"
          if kubectl get pods -n "$TARGET_NAMESPACE" -o name | grep -qi target-allocator; then
            echo "FAIL: a target-allocator pod exists."
            exit 1
          fi
          echo "OK: none found."

          echo ""
          echo "13. No deployed AmazonCloudWatchAgent resource has a filelog receiver / container-log pipeline (every CR in ${TARGET_NAMESPACE}, not just one):"
          # Only resource names and pass/fail are ever printed, never a complete otelConfig.
          AGENT_CR_NAMES="$(kubectl get amazoncloudwatchagents.cloudwatch.aws.amazon.com -n "$TARGET_NAMESPACE" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
          if [ -z "$AGENT_CR_NAMES" ]; then
            echo "FAIL: no AmazonCloudWatchAgent resource found in ${TARGET_NAMESPACE}."
            exit 1
          fi
          while IFS= read -r cr_name; do
            [ -z "$cr_name" ] && continue
            CR_OTEL_CONFIG="$(kubectl get amazoncloudwatchagents.cloudwatch.aws.amazon.com "$cr_name" -n "$TARGET_NAMESPACE" -o jsonpath='{.spec.otelConfig}')"
            if echo "$CR_OTEL_CONFIG" | grep -qi filelog; then
              echo "FAIL: AmazonCloudWatchAgent/${cr_name} otelConfig contains a filelog receiver."
              exit 1
            fi
            echo "OK: AmazonCloudWatchAgent/${cr_name} -- no filelog receiver."
          done <<< "$AGENT_CR_NAMES"

          echo ""
          # Confirmation only: the "Ensure cluster-scraper Deployment host-network isolation" step above already guarantees the Deployment reflects the CR's hostNetwork=false by the time this step runs.
          echo "14. CloudWatch Agent host-network isolation (Phase 6B2B correction -- fixes the 127.0.0.1:8888 bind collision documented in platform/dev/goldengate-observability/values.yaml). Only resource name, mode, and hostNetwork are printed -- never a full spec:"

          CW_AGENT_CR_JSON="$(kubectl get amazoncloudwatchagents.cloudwatch.aws.amazon.com cloudwatch-agent -n "$TARGET_NAMESPACE" -o json)"
          CW_AGENT_CR_MODE="$(jq -r '.spec.mode // empty' <<<"$CW_AGENT_CR_JSON")"
          CW_AGENT_CR_HOSTNET="$(jq -r '.spec.hostNetwork' <<<"$CW_AGENT_CR_JSON")"
          echo "AmazonCloudWatchAgent/cloudwatch-agent: mode=${CW_AGENT_CR_MODE} hostNetwork=${CW_AGENT_CR_HOSTNET}"
          if [ "$CW_AGENT_CR_HOSTNET" != "true" ]; then
            echo "FAIL: AmazonCloudWatchAgent/cloudwatch-agent spec.hostNetwork is ${CW_AGENT_CR_HOSTNET}, expected true."
            exit 1
          fi

          SCRAPER_CR_JSON="$(kubectl get amazoncloudwatchagents.cloudwatch.aws.amazon.com cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE" -o json)"
          SCRAPER_CR_MODE="$(jq -r '.spec.mode // empty' <<<"$SCRAPER_CR_JSON")"
          SCRAPER_CR_HOSTNET="$(jq -r '.spec.hostNetwork' <<<"$SCRAPER_CR_JSON")"
          echo "AmazonCloudWatchAgent/cloudwatch-agent-cluster-scraper: mode=${SCRAPER_CR_MODE} hostNetwork=${SCRAPER_CR_HOSTNET}"
          if [ "$SCRAPER_CR_HOSTNET" != "false" ]; then
            echo "FAIL: AmazonCloudWatchAgent/cloudwatch-agent-cluster-scraper spec.hostNetwork is ${SCRAPER_CR_HOSTNET}, expected false."
            exit 1
          fi

          CW_DS_HOSTNET="$(kubectl get daemonset cloudwatch-agent -n "$TARGET_NAMESPACE" -o jsonpath='{.spec.template.spec.hostNetwork}')"
          echo "DaemonSet/cloudwatch-agent: mode=daemonset hostNetwork=${CW_DS_HOSTNET:-false}"
          if [ "$CW_DS_HOSTNET" != "true" ]; then
            echo "FAIL: DaemonSet/cloudwatch-agent spec.template.spec.hostNetwork is ${CW_DS_HOSTNET:-<absent>}, expected true."
            exit 1
          fi

          SCRAPER_DEPLOY_HOSTNET="$(kubectl get deployment cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE" -o jsonpath='{.spec.template.spec.hostNetwork}')"
          echo "Deployment/cloudwatch-agent-cluster-scraper: mode=deployment hostNetwork=${SCRAPER_DEPLOY_HOSTNET:-false}"
          if [ -n "$SCRAPER_DEPLOY_HOSTNET" ] && [ "$SCRAPER_DEPLOY_HOSTNET" != "false" ]; then
            echo "FAIL: Deployment/cloudwatch-agent-cluster-scraper spec.template.spec.hostNetwork is ${SCRAPER_DEPLOY_HOSTNET}, expected false (Kubernetes omits an explicit false, so an absent value is also acceptable)."
            exit 1
          fi

          echo ""
          echo "Every node-agent pod (selector dynamically derived from DaemonSet/cloudwatch-agent spec.selector.matchLabels, never hardcoded):"
          CW_DS_JSON2="$(kubectl get daemonset cloudwatch-agent -n "$TARGET_NAMESPACE" -o json)"
          CW_SELECTOR="$(jq -r '(.spec.selector.matchLabels // {}) | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$CW_DS_JSON2")"
          if [ -z "$CW_SELECTOR" ] || [ "$CW_SELECTOR" = "null" ]; then
            echo "FAIL: could not derive a pod selector for DaemonSet/cloudwatch-agent."
            exit 1
          fi
          CW_PODS_JSON="$(kubectl get pods -n "$TARGET_NAMESPACE" -l "$CW_SELECTOR" -o json)"
          CW_POD_COUNT="$(jq '.items | length' <<<"$CW_PODS_JSON")"
          if [ "$CW_POD_COUNT" -eq 0 ]; then
            echo "FAIL: no node-agent pods found for selector ${CW_SELECTOR}."
            exit 1
          fi
          while IFS= read -r pod_name; do
            [ -z "$pod_name" ] && continue
            pod_hostnet="$(jq -r --arg n "$pod_name" '.items[] | select(.metadata.name==$n) | (.spec.hostNetwork // false)' <<<"$CW_PODS_JSON")"
            echo "pod/${pod_name}: mode=daemonset hostNetwork=${pod_hostnet}"
            if [ "$pod_hostnet" != "true" ]; then
              echo "FAIL: node-agent pod ${pod_name} spec.hostNetwork is ${pod_hostnet}, expected true."
              exit 1
            fi
          done < <(jq -r '.items[].metadata.name' <<<"$CW_PODS_JSON")
          echo "OK: all ${CW_POD_COUNT} node-agent pods have hostNetwork=true."

          echo ""
          echo "Every active (Running) cluster-scraper pod (selector dynamically derived from Deployment/cloudwatch-agent-cluster-scraper spec.selector.matchLabels):"
          SCRAPER_DEPLOY_JSON="$(kubectl get deployment cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE" -o json)"
          SCRAPER_SELECTOR="$(jq -r '(.spec.selector.matchLabels // {}) | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$SCRAPER_DEPLOY_JSON")"
          if [ -z "$SCRAPER_SELECTOR" ] || [ "$SCRAPER_SELECTOR" = "null" ]; then
            echo "FAIL: could not derive a pod selector for Deployment/cloudwatch-agent-cluster-scraper."
            exit 1
          fi
          SCRAPER_PODS_JSON="$(kubectl get pods -n "$TARGET_NAMESPACE" -l "$SCRAPER_SELECTOR" --field-selector=status.phase=Running -o json)"
          SCRAPER_POD_COUNT="$(jq '.items | length' <<<"$SCRAPER_PODS_JSON")"
          if [ "$SCRAPER_POD_COUNT" -eq 0 ]; then
            echo "FAIL: no active (Running) cluster-scraper pods found for selector ${SCRAPER_SELECTOR}."
            exit 1
          fi
          while IFS= read -r pod_name; do
            [ -z "$pod_name" ] && continue
            pod_hostnet="$(jq -r --arg n "$pod_name" '.items[] | select(.metadata.name==$n) | (.spec.hostNetwork // false)' <<<"$SCRAPER_PODS_JSON")"
            echo "pod/${pod_name}: mode=deployment hostNetwork=${pod_hostnet}"
            if [ "$pod_hostnet" != "false" ]; then
              echo "FAIL: cluster-scraper pod ${pod_name} spec.hostNetwork is ${pod_hostnet}, expected false."
              exit 1
            fi
          done < <(jq -r '.items[].metadata.name' <<<"$SCRAPER_PODS_JSON")
          echo "OK: all ${SCRAPER_POD_COUNT} active cluster-scraper pods have hostNetwork=false."

          echo ""
          echo "15. Bounded log check (last 80 lines per pod) for the previously observed 127.0.0.1:8888 port-collision crash on active, current-revision node-agent and cluster-scraper pods only:"
          CRASH_PATTERN='bind: address already in use|binding address localhost:8888|listen tcp 127\.0\.0\.1:8888|failed to create SDK'
          CRASH_FOUND="false"

          # Node-agent (DaemonSet) pods: exclude terminating pods (a pod mid-termination can still linger briefly with a deletionTimestamp).
          while IFS= read -r pod_name; do
            [ -z "$pod_name" ] && continue
            pod_deletion_ts="$(jq -r --arg n "$pod_name" '.items[] | select(.metadata.name==$n) | (.metadata.deletionTimestamp // empty)' <<<"$CW_PODS_JSON")"
            [ -n "$pod_deletion_ts" ] && continue
            POD_LOG_TAIL="$(kubectl logs "$pod_name" -n "$TARGET_NAMESPACE" --tail=80 2>/dev/null || true)"
            if echo "$POD_LOG_TAIL" | grep -qEi "$CRASH_PATTERN"; then
              echo "FAIL: node-agent pod ${pod_name} log (last 80 lines) matches the previously observed host-network port-collision symptom:"
              echo "$POD_LOG_TAIL" | grep -Ei "$CRASH_PATTERN"
              CRASH_FOUND="true"
            fi
          done < <(jq -r '.items[].metadata.name' <<<"$CW_PODS_JSON")

          # Cluster-scraper (Deployment) pods: exclude terminating pods and pods owned by an old/stale ReplicaSet; only pods owned by the CURRENT Deployment UID are inspected.
          SCRAPER_DEPLOY_UID_FOR_LOGS="$(jq -r '.metadata.uid' <<<"$SCRAPER_DEPLOY_JSON")"
          while IFS= read -r pod_name; do
            [ -z "$pod_name" ] && continue
            pod_json_for_logs="$(jq -c --arg n "$pod_name" '.items[] | select(.metadata.name==$n)' <<<"$SCRAPER_PODS_JSON")"

            pod_deletion_ts="$(jq -r '.metadata.deletionTimestamp // empty' <<<"$pod_json_for_logs")"
            [ -n "$pod_deletion_ts" ] && continue

            rs_owner_name_for_logs="$(jq -r '[.metadata.ownerReferences[]? | select(.controller==true and .kind=="ReplicaSet")][0].name // empty' <<<"$pod_json_for_logs")"
            [ -z "$rs_owner_name_for_logs" ] && continue
            rs_json_for_logs="$(kubectl get replicaset "$rs_owner_name_for_logs" -n "$TARGET_NAMESPACE" -o json 2>/dev/null || true)"
            [ -z "$rs_json_for_logs" ] && continue
            rs_deploy_uid_for_logs="$(jq -r '[.metadata.ownerReferences[]? | select(.controller==true and .kind=="Deployment")][0].uid // empty' <<<"$rs_json_for_logs")"
            [ "$rs_deploy_uid_for_logs" != "$SCRAPER_DEPLOY_UID_FOR_LOGS" ] && continue

            POD_LOG_TAIL="$(kubectl logs "$pod_name" -n "$TARGET_NAMESPACE" --tail=80 2>/dev/null || true)"
            if echo "$POD_LOG_TAIL" | grep -qEi "$CRASH_PATTERN"; then
              echo "FAIL: cluster-scraper pod ${pod_name} log (last 80 lines) matches the previously observed host-network port-collision symptom:"
              echo "$POD_LOG_TAIL" | grep -Ei "$CRASH_PATTERN"
              CRASH_FOUND="true"
            fi
          done < <(jq -r '.items[].metadata.name' <<<"$SCRAPER_PODS_JSON")

          if [ "$CRASH_FOUND" = "true" ]; then
            echo "FAIL: at least one active, current-revision node-agent or cluster-scraper pod still shows the 127.0.0.1:8888 bind collision -- the host-network isolation fix did not take effect."
            exit 1
          fi
          echo "OK: no active, current-revision node-agent or cluster-scraper pod log (last 80 lines each) shows the previously observed 127.0.0.1:8888 bind collision."

      - name: Check bounded recent logs for authorization and startup failures
        # always() ensures this evidence-only diagnostic still runs even if an earlier deploy=true step already failed the job; paired with inputs.deploy so it never runs on deploy=false.
        if: ${{ always() && inputs.deploy }}
        shell: bash
        run: |
          set -uo pipefail
          # Deliberately no "set -e": every command is individually guarded so this diagnostic always finishes with exit 0 and never masks the original failure.

          # Bounded (--tail, --since) and pattern-matched only, never a full/unbounded log dump or credentials/tokens/env vars.
          ERROR_PATTERNS='AccessDenied|UnauthorizedOperation|NoCredentialProviders|WebIdentityErr|AssumeRoleWithWebIdentity|PutMetricData|PutLogEvents|ImagePullBackOff|ErrImagePull|CrashLoopBackOff|[Rr]eadiness probe failed|connection refused|[Tt]imeout|OOMKilled|x509|webhook.*certificate'

          echo "Operator logs (last 80 lines, last 15m):"
          OPERATOR_POD="$(kubectl get pods -n "$TARGET_NAMESPACE" -l control-plane=controller-manager -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -n "$OPERATOR_POD" ]; then
            kubectl logs "$OPERATOR_POD" -n "$TARGET_NAMESPACE" --tail=80 --since=15m 2>/dev/null | grep -Ei "$ERROR_PATTERNS" || echo "No matching error patterns found."
          else
            echo "Operator pod not found (label control-plane=controller-manager)."
          fi

          echo ""
          echo "CloudWatch Agent node-agent pod logs (every DaemonSet pod, last 80 lines each, last 15m):"
          CW_DS_JSON="$(kubectl get daemonset cloudwatch-agent -n "$TARGET_NAMESPACE" -o json 2>/dev/null || true)"
          if [ -n "$CW_DS_JSON" ]; then
            CW_SELECTOR="$(jq -r '(.spec.selector.matchLabels // {}) | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$CW_DS_JSON" 2>/dev/null || true)"
            if [ -n "$CW_SELECTOR" ] && [ "$CW_SELECTOR" != "null" ]; then
              AGENT_PODS="$(kubectl get pods -n "$TARGET_NAMESPACE" -l "$CW_SELECTOR" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
              if [ -n "$AGENT_PODS" ]; then
                while IFS= read -r agent_pod; do
                  [ -z "$agent_pod" ] && continue
                  echo "-- ${agent_pod}:"
                  kubectl logs "$agent_pod" -n "$TARGET_NAMESPACE" --tail=80 --since=15m 2>/dev/null | grep -Ei "$ERROR_PATTERNS" || echo "No matching error patterns found."
                done <<< "$AGENT_PODS"
              else
                echo "No cloudwatch-agent pods found for selector ${CW_SELECTOR}."
              fi
            else
              echo "Could not derive a pod selector from the cloudwatch-agent DaemonSet's spec.selector.matchLabels."
            fi
          else
            echo "cloudwatch-agent DaemonSet not found."
          fi

          echo ""
          echo "cloudwatch-agent-cluster-scraper logs (last 80 lines, last 15m):"
          SCRAPER_JSON="$(kubectl get deployment cloudwatch-agent-cluster-scraper -n "$TARGET_NAMESPACE" -o json 2>/dev/null || true)"
          SCRAPER_POD=""
          if [ -n "$SCRAPER_JSON" ]; then
            SCRAPER_SELECTOR="$(jq -r '(.spec.selector.matchLabels // {}) | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$SCRAPER_JSON" 2>/dev/null || true)"
            if [ -n "$SCRAPER_SELECTOR" ] && [ "$SCRAPER_SELECTOR" != "null" ]; then
              SCRAPER_POD="$(kubectl get pods -n "$TARGET_NAMESPACE" -l "$SCRAPER_SELECTOR" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            fi
          fi
          if [ -n "$SCRAPER_POD" ]; then
            kubectl logs "$SCRAPER_POD" -n "$TARGET_NAMESPACE" --tail=80 --since=15m 2>/dev/null | grep -Ei "$ERROR_PATTERNS" || echo "No matching error patterns found."
          else
            echo "cloudwatch-agent-cluster-scraper pod not found."
          fi

          echo ""
          echo "NOTE: healthy pods and absent error patterns above do NOT confirm CloudWatch metrics are"
          echo "actually visible in the console/API. That final data-plane confirmation belongs to"
          echo "Phase 6B3 and requires actual CloudWatch evidence supplied by the user."

          exit 0

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GoldenGate observability (CloudWatch metrics) deploy summary"
            echo ""
            echo "**Phase 6B2B** -- private-image-only GitOps source and deployment workflow."
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Deploy requested: \`${{ inputs.deploy }}\`"
            echo "- Chart: \`oci://${ECR_REGISTRY}/${HELM_OCI_NAMESPACE}/${CHART_NAME}:${CHART_VERSION}\`"
            echo "- Argo CD Application: \`${ARGOCD_APP_NAME}\` (namespace \`${ARGOCD_NAMESPACE}\`)"
            echo "- Release: \`${RELEASE_NAME}\` -> namespace \`${TARGET_NAMESPACE}\`"
            echo "- Values source: \`${VALUES_FILE}\` (committed; never mutated)"
            echo ""
            echo "### Private images (Phase 6B1, verified in this run)"
            echo ""
            echo "| Repository | Tag |"
            echo "|---|---|"
            if [ -f "${WORKDIR}/image-digests.psv" ]; then
              while IFS='|' read -r repo tag _digest; do
                [ -z "$repo" ] && continue
                echo "| \`${repo}\` | \`${tag}\` |"
              done < "${WORKDIR}/image-digests.psv"
            fi
            echo ""
            if [ "${{ inputs.deploy }}" = "true" ]; then
              echo "### Cluster-scraper Deployment host-network correction"
              echo ""
              CORRECTION_SUMMARY_FILE="${WORKDIR}/cluster-scraper-correction-summary.txt"
              CORRECTION_RESULT="$(cat "$CORRECTION_SUMMARY_FILE" 2>/dev/null || echo "unknown")"
              case "$CORRECTION_RESULT" in
                not_required)
                  echo "Correction: not required (Deployment already had hostNetwork=false)."
                  ;;
                recreated_once)
                  echo "Correction: Deployment recreated once (was hostNetwork=true, operator recreation confirmed hostNetwork=false)."
                  ;;
                *)
                  echo "Correction: unknown (summary marker file was not found -- see the \"Ensure cluster-scraper Deployment host-network isolation\" step log)."
                  ;;
              esac
              echo ""
            fi
            echo "### Explicitly out of scope for this phase"
            echo ""
            echo "- CloudWatch alarms, SNS, dashboards"
            echo "- Shared alerter, metrics-history writer"
            echo "- GoldenGate replication"
            echo "- Fluent Bit changes (gg-fluent-bit remains the sole log collector)"
            echo "- EKS Terraform module enable_cloudwatch (not used by this repository)"
            echo "- CloudWatch data-plane confirmation (Phase 6B3)"
            echo ""
            if [ "${{ inputs.deploy }}" != "true" ]; then
              echo "### Validation-only run"
              echo ""
              echo "deploy=false: no Argo CD Application was created or updated, and no live Kubernetes"
              echo "validation was performed. Re-run with deploy=true after confirming the required order:"
              echo "1. Phase 6B2A IAM/Terraform workflow completed."
              echo "2. argocd-eks-deployment.yaml re-run after this Phase 6B2B source change."
              echo "3. This workflow (goldengate-observability.yaml) run with deploy=true."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
