name: Goldengate EKS app deployment

run-name: "Cloud Factory - GoldenGate Helm build and deploy | ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_id || format('auto: envs/dev changes on {0}', github.sha) }} | ran by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev

      deployment_id:
        description: "Unique GoldenGate deployment ID, example: gg-oracle-payments-01"
        required: true
        type: string
        default: gg-oracle-payments-01

      deploy:
        description: "Deploy to EKS after publishing Helm chart"
        required: true
        type: boolean
        default: true

  push:
    branches:
      - main
    paths:
      - 'envs/dev/**'
      - 'helm/goldengate/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

  # ECR / runner account where Helm OCI chart will be pushed.
  ECR_ACCOUNT_ID: "229410149234"
  ECR_REGISTRY: 229410149234.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

  # Role used by GitHub Actions / CodeBuild runner.
  ROLE_ARN: ${{ vars.GOLDENGATE_AWS_ROLE_ARN }}

  # Target EKS cluster details.
  EKS_ACCOUNT_ID: ${{ vars.ACCOUNT_ID_DEV }}
  EKS_CLUSTER_NAME: ${{ vars.AWS_CLUSTER_NAME }}
  EKS_CLUSTER_ARN: ${{ vars.AWS_CLUSTER_ARN }}

  # Optional. Add this repo variable later only if cross-account EKS auth fails.
  EKS_DEPLOY_ROLE_ARN: ${{ vars.EKS_DEPLOY_ROLE_ARN }}

  # IRSA role the in-cluster argocd-ecr-token-sync CronJob assumes to pull
  # the GoldenGate Helm OCI chart. The helm/goldengate ECR repository policy
  # must grant this exact role pull access -- see the "Ensure Helm ECR
  # repository policy allows Argo CD pull" step below.
  ARGOCD_ECR_READ_ROLE_ARN: arn:aws:iam::668311715351:role/GoldenGateArgocdECRRead-dev

  HELM_OCI_NAMESPACE: helm
  CHART_NAME: goldengate
  HELM_CHART_PATH: helm/goldengate
  ENVS_ROOT: envs

jobs:
  detect_changed_deployments:
    name: Detect changed GoldenGate deployments

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      deployment_matrix: ${{ steps.detect.outputs.deployment_matrix }}
      has_deletions: ${{ steps.detect.outputs.has_deletions }}
      deletion_matrix: ${{ steps.detect.outputs.deletion_matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Python and PyYAML prerequisites
        shell: bash
        run: |
          set -euo pipefail

          # GoldenGate deployment classification (deploymentModel detection,
          # used to decide what enters the active/deletion matrices) requires
          # actual YAML parsing -- there is no regex/text fallback. Fail
          # closed here, with a fixed message, rather than ever letting the
          # classifier silently accept malformed input.
          if ! command -v python3 >/dev/null 2>&1; then
            echo "FAIL: python3 is required to classify GoldenGate deployment values files and is not available on this runner."
            exit 1
          fi

          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            echo "FAIL: PyYAML is required to classify GoldenGate deployment values files and is not available on this runner."
            exit 1
          fi

          echo "OK: python3 and PyYAML are available."

      - name: Detect changed deployments
        id: detect
        shell: bash
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          INPUT_DEPLOY: ${{ inputs.deploy }}
        run: |
          set -euo pipefail

          # Returns 0 (active) or 1 (inactive) on stdout as a one-line
          # reason, for a given envs/dev/<id>/values.yaml path. A deployment
          # is inactive if: the file is missing, empty, comment-only, parses
          # to null/empty YAML, or explicitly disables itself via
          # enabled: false, deployment.enabled: false, or
          # lifecycle.state: absent. Prefers PyYAML (safe, full parse) and
          # falls back to conservative text patterns only if PyYAML isn't
          # installed on the runner -- never installs anything.
          is_active_deployment_values_file() {
            local values_file="$1"

            if [ ! -f "$values_file" ]; then
              echo "missing values.yaml"
              return 1
            fi

            if [ ! -s "$values_file" ]; then
              echo "empty values.yaml"
              return 1
            fi

            if command -v python3 >/dev/null 2>&1; then
              python3 - "$values_file" <<'PYEOF'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r") as f:
              raw = f.read()

          non_comment_lines = [
              line for line in raw.splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]
          if not non_comment_lines:
              print("empty/comment-only values.yaml")
              sys.exit(1)

          try:
              import yaml
          except ImportError:
              # Conservative fallback without PyYAML: only recognizes the three
              # documented disable-flag shapes, not arbitrary YAML nesting.
              if re.search(r'(?m)^\s*enabled\s*:\s*false\s*$', raw):
                  print("enabled=false (text fallback, PyYAML unavailable)")
                  sys.exit(1)
              if re.search(r'(?ms)^deployment\s*:\s*\n(?:[ \t]+\S.*\n?)*?[ \t]+enabled\s*:\s*false\s*$', raw):
                  print("deployment.enabled=false (text fallback, PyYAML unavailable)")
                  sys.exit(1)
              if re.search(r'(?ms)^lifecycle\s*:\s*\n(?:[ \t]+\S.*\n?)*?[ \t]+state\s*:\s*["\']?absent["\']?\s*$', raw):
                  print("lifecycle.state=absent (text fallback, PyYAML unavailable)")
                  sys.exit(1)
              print("active (text fallback, PyYAML unavailable)")
              sys.exit(0)

          try:
              data = yaml.safe_load(raw)
          except yaml.YAMLError as exc:
              print(f"unparsable YAML: {exc}")
              sys.exit(1)

          if not data:
              print("empty/null parsed YAML")
              sys.exit(1)

          if not isinstance(data, dict):
              print("parsed YAML is not a mapping")
              sys.exit(1)

          if data.get("enabled") is False:
              print("enabled=false")
              sys.exit(1)

          deployment = data.get("deployment")
          if isinstance(deployment, dict) and deployment.get("enabled") is False:
              print("deployment.enabled=false")
              sys.exit(1)

          lifecycle = data.get("lifecycle")
          if isinstance(lifecycle, dict) and lifecycle.get("state") == "absent":
              print("lifecycle.state=absent")
              sys.exit(1)

          print("active")
          sys.exit(0)
          PYEOF
              return $?
            fi

            echo "python3 not available on this runner, using conservative bash fallback"

            local non_comment
            non_comment="$(grep -vE '^[[:space:]]*(#.*)?$' "$values_file" || true)"
            if [ -z "$non_comment" ]; then
              echo "empty/comment-only values.yaml (bash fallback)"
              return 1
            fi

            if grep -Eq '^enabled[[:space:]]*:[[:space:]]*false[[:space:]]*$' "$values_file"; then
              echo "enabled=false (bash fallback)"
              return 1
            fi

            if awk '
              /^deployment:[[:space:]]*$/ { in_block=1; next }
              in_block && /^[[:space:]]+enabled:[[:space:]]*false[[:space:]]*$/ { found=1; exit }
              in_block && /^[^[:space:]]/ { in_block=0 }
              END { exit !found }
            ' "$values_file"; then
              echo "deployment.enabled=false (bash fallback)"
              return 1
            fi

            if awk '
              /^lifecycle:[[:space:]]*$/ { in_block=1; next }
              in_block && /^[[:space:]]+state:[[:space:]]*"?absent"?[[:space:]]*$/ { found=1; exit }
              in_block && /^[^[:space:]]/ { in_block=0 }
              END { exit !found }
            ' "$values_file"; then
              echo "lifecycle.state=absent (bash fallback)"
              return 1
            fi

            echo "active (bash fallback, python3 unavailable)"
            return 0
          }

          # Strict, fail-closed YAML classifier shared by every GoldenGate-
          # deployment classification call site in this workflow. No regex/
          # text fallback: this repository's runner is required (see
          # "Verify Python and PyYAML prerequisites" above) to have python3
          # + PyYAML, so a values file only ever qualifies after actual YAML
          # parsing. $1 is a path to a file already known to exist and be
          # non-empty (the two callers below each check that themselves,
          # since a working-tree file and a git-show'd temp file have
          # different "missing"/"empty" semantics). $2 is a comma-separated
          # list of the deploymentModel values this call site accepts --
          # there is no built-in default set here, and a value outside that
          # list is never silently accepted no matter which caller invokes
          # this.
          #
          # Two explicit, distinct contracts share this one parser:
          #   ACTIVE CONTRACT ($2="singleRuntime", via
          #   is_goldengate_deployment_values_file below): used by
          #   workflow_dispatch validation, the active push build/update
          #   matrix, and the build/deploy job. legacyPair, missing, and
          #   unknown models all fail closed here -- excluded from every
          #   active path, never inferred or defaulted to anything.
          #   HISTORICAL DELETION CONTRACT ($2="singleRuntime,legacyPair",
          #   via is_goldengate_deployment_values_file_at_ref below): used
          #   only to classify a deployment's content as it existed at a
          #   *previous* Git revision, for deletion purposes -- a removed/
          #   renamed file, or the base-revision fallback for a current file
          #   that was deliberately emptied. legacyPair still classifies
          #   correctly here because a historical legacyPair deployment must
          #   remain deletable even though the model is no longer
          #   deployable. An unrecognized value still fails closed and is
          #   never defaulted under this contract either.
          _classify_deployment_model_yaml() {
            local content_file="$1"
            local allowed_models_csv="$2"

            python3 - "$content_file" "$allowed_models_csv" <<'PYEOF'
          import sys

          import yaml

          path, allowed_models_csv = sys.argv[1:3]
          ALLOWED_MODELS = tuple(m for m in allowed_models_csv.split(",") if m)

          with open(path, "r") as f:
              raw = f.read()

          non_comment_lines = [
              line for line in raw.splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]
          if not non_comment_lines:
              print("empty/comment-only values.yaml")
              sys.exit(1)

          try:
              data = yaml.safe_load(raw)
          except yaml.YAMLError as exc:
              print(f"unparsable YAML: {exc}")
              sys.exit(1)

          if not data:
              print("empty/null parsed YAML")
              sys.exit(1)

          if not isinstance(data, dict):
              print("parsed YAML is not a mapping")
              sys.exit(1)

          model = data.get("deploymentModel")

          if isinstance(model, str) and model in ALLOWED_MODELS:
              print(f"deploymentModel={model}")
              sys.exit(0)

          print(f"not a GoldenGate deployment values file: deploymentModel={model!r}")
          sys.exit(1)
          PYEOF
            return $?
          }

          # ACTIVE CONTRACT. Returns 0 (is an actively deployable GoldenGate
          # runtime deployment values file) or 1 (is not) on stdout as a
          # one-line reason, for a given envs/dev/<id>/values.yaml path in
          # the current working tree. Classification is based solely on
          # content -- never on directory name, and never on
          # deployment.enabled/lifecycle.state (that is a separate,
          # orthogonal active/inactive concern handled by
          # is_active_deployment_values_file above). A file only qualifies
          # when it is a non-empty, valid YAML mapping whose top-level
          # deploymentModel is a string exactly equal to "singleRuntime" --
          # legacyPair is a historical-only model and is rejected here just
          # like any other unrecognized value, never accepted or defaulted.
          # This is what keeps unrelated envs/dev/<x>/ values files (e.g.
          # the separate goldengate-monitor chart's own values, or Argo
          # CD's own values) -- and any legacyPair deployment someone might
          # try to (re)introduce -- out of every active GoldenGate workflow
          # path, without hardcoding folder names.
          is_goldengate_deployment_values_file() {
            local values_file="$1"

            if [ ! -f "$values_file" ]; then
              echo "missing values.yaml"
              return 1
            fi

            if [ ! -s "$values_file" ]; then
              echo "empty values.yaml"
              return 1
            fi

            _classify_deployment_model_yaml "$values_file" "singleRuntime"
            return $?
          }

          # HISTORICAL DELETION CONTRACT. Same shape of classification
          # (0/1 plus a one-line reason on stdout), applied to a values
          # file's content as it existed at a specific Git revision (never
          # the working tree) -- used only for a removed/renamed deletion
          # candidate, or the base-revision fallback for a current file that
          # was deliberately emptied, whose current working-tree content no
          # longer reflects what needs classifying. Accepts singleRuntime
          # *and* legacyPair, since a historical legacyPair deployment must
          # still be classifiable for deletion even though legacyPair is no
          # longer an active, deployable model. Fails closed (returns 1,
          # never defaults to any deploymentModel) when the path did not
          # exist at that revision, was empty, or fails the same strict
          # YAML/mapping/deploymentModel checks as the working-tree version.
          is_goldengate_deployment_values_file_at_ref() {
            local ref="$1"
            local path="$2"
            local tmp_file
            tmp_file="$(mktemp)"

            if ! git show "${ref}:${path}" > "$tmp_file" 2>/dev/null; then
              echo "missing at ${ref}:${path}"
              rm -f "$tmp_file"
              return 1
            fi

            if [ ! -s "$tmp_file" ]; then
              echo "empty at ${ref}:${path}"
              rm -f "$tmp_file"
              return 1
            fi

            local reason status
            reason="$(_classify_deployment_model_yaml "$tmp_file" "singleRuntime,legacyPair")"
            status=$?
            rm -f "$tmp_file"
            echo "$reason"
            return $status
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Inert assignment only -- the actual GitHub expression is never
            # interpolated into this (or any) run script body, only passed
            # through the step-level env: mapping above. $INPUT_* is always
            # treated as opaque string data by bash, never as shell source.
            ENVIRONMENT="$INPUT_ENVIRONMENT"
            DEPLOYMENT_ID="$INPUT_DEPLOYMENT_ID"
            DEPLOY="$INPUT_DEPLOY"

            if [[ ! "$DEPLOYMENT_ID" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
              echo "Invalid deployment_id: $DEPLOYMENT_ID"
              echo "Use lowercase letters, numbers, and hyphens only."
              echo "Example: gg-oracle-payments-01"
              exit 1
            fi

            VALUES_FILE="envs/${ENVIRONMENT}/${DEPLOYMENT_ID}/values.yaml"

            echo "Manual workflow_dispatch trigger for deployment_id=${DEPLOYMENT_ID}, environment=${ENVIRONMENT}."
            echo "Validating deployment values file: ${VALUES_FILE}"

            # Fail closed: a manually requested deployment_id must resolve to
            # an actual GoldenGate runtime deployment values file (never a
            # different chart's values under envs/dev/, e.g. the shared
            # monitor's or Argo CD's own values file).
            set +e
            GG_REASON="$(is_goldengate_deployment_values_file "$VALUES_FILE")"
            GG_STATUS=$?
            set -e

            if [ "$GG_STATUS" -ne 0 ]; then
              echo "Deployment values file check failed: ${GG_REASON}"
              echo ""
              echo "${VALUES_FILE} is not an actively deployable GoldenGate runtime deployment values file (deploymentModel must be exactly singleRuntime -- legacyPair is retired and is no longer deployable). Refusing to build a matrix for it."
              exit 1
            fi

            # GG_REASON is exactly "deploymentModel=singleRuntime" on success
            # under the active contract (the only value it ever accepts) --
            # carried into the matrix below so the build job never has to
            # re-infer or default deploymentModel itself.
            ACTIVE_DEPLOYMENT_MODEL="${GG_REASON#deploymentModel=}"

            set +e
            REASON="$(is_active_deployment_values_file "$VALUES_FILE")"
            STATUS=$?
            set -e

            if [ "$STATUS" -ne 0 ]; then
              echo "Deployment values file check failed: ${REASON}"
              echo ""
              echo "Deployment values file is missing or inactive. Use Git deletion/disable flow for cleanup, or restore active values before manual deploy."
              exit 1
            fi

            echo "Deployment values file is active (${REASON}). Building single-item matrix."

            MATRIX_JSON="$(jq -nc \
              --arg environment "$ENVIRONMENT" \
              --arg deployment_id "$DEPLOYMENT_ID" \
              --arg deployment_model "$ACTIVE_DEPLOYMENT_MODEL" \
              --argjson deploy "$DEPLOY" \
              '[{environment: $environment, deployment_id: $deployment_id, deployment_model: $deployment_model, deploy: $deploy}]')"

            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "deployment_matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
            echo "has_deletions=false" >> "$GITHUB_OUTPUT"
            echo "deletion_matrix=[]" >> "$GITHUB_OUTPUT"

            echo "Matrix: ${MATRIX_JSON}"
            exit 0
          fi

          echo "Push trigger. Detecting changed deployment folders under envs/dev/ and helm/goldengate/..."

          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"
          EMPTY_TREE_SHA="4b825dc642cb6eb9a060e54bf8d69288fbee4904"

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable previous commit (new branch or first push). Diffing against the empty tree."
            BEFORE_SHA="$EMPTY_TREE_SHA"
          fi

          CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'envs/dev/**' 'helm/goldengate/**' || true)"

          echo "Changed files under envs/dev/ and helm/goldengate/:"
          echo "${CHANGED_FILES:-<none>}"

          CHART_CHANGED="false"
          if echo "$CHANGED_FILES" | grep -q '^helm/goldengate/'; then
            CHART_CHANGED="true"
          fi

          echo "Chart changed: ${CHART_CHANGED}"

          DEPLOYMENT_MATRIX_ITEMS="[]"
          DELETION_MATRIX_ITEMS="[]"
          ACTIVE_LOG=""
          INACTIVE_LOG=""

          # envs/dev/argocd/ holds Argo CD's own values file, deployed by the
          # separate argocd-eks-deployment.yaml workflow. It is never a
          # GoldenGate deployment and must be excluded here.
          #
          # Selection reason: a shared Helm chart change affects every active
          # deployment, so it selects all active deployments. A deployment-
          # values-only change only affects its own folder.
          if [ "$CHART_CHANGED" = "true" ]; then
            echo "Selection reason: shared GoldenGate Helm chart changed. Selecting all active dev deployments."

            DEPLOYMENT_CANDIDATE_IDS="$(find envs/dev -mindepth 2 -maxdepth 2 -name values.yaml -not -path 'envs/dev/argocd/*' \
              | sed -E 's#^envs/dev/([^/]+)/values\.yaml$#\1#' \
              | sort -u || true)"
          else
            echo "Selection reason: only envs/dev/<deployment> changed. Selecting changed deployment folders."

            DEPLOYMENT_CANDIDATE_IDS="$(echo "$CHANGED_FILES" \
              | grep -E '^envs/dev/[^/]+/' \
              | grep -v '^envs/dev/argocd/' \
              | sed -E 's#^envs/dev/([^/]+)/.*#\1#' \
              | sort -u || true)"
          fi

          for DEPLOYMENT_ID in $DEPLOYMENT_CANDIDATE_IDS; do
            VALUES_FILE="envs/dev/${DEPLOYMENT_ID}/values.yaml"

            # Applies to both shared-chart-change candidates (every
            # envs/dev/<id>/values.yaml) and per-folder push candidates:
            # only a values file whose own deploymentModel is singleRuntime
            # (the active contract -- legacyPair fails closed here just like
            # any other unrecognized value) is ever eligible for the active
            # build/update matrix -- never inferred from folder name, so a
            # different chart's values file under envs/dev/ (e.g. the shared
            # monitor's or Argo CD's own), or a legacyPair deployment, is
            # excluded here regardless of trigger reason.
            set +e
            GG_REASON="$(is_goldengate_deployment_values_file "$VALUES_FILE")"
            GG_STATUS=$?
            set -e

            if [ "$GG_STATUS" -ne 0 ]; then
              echo "Not an actively deployable GoldenGate deployment: ${DEPLOYMENT_ID} (${GG_REASON}) -- excluded from the build/update matrix."
              continue
            fi

            # GG_REASON is exactly "deploymentModel=singleRuntime" on success
            # under the active contract -- carried into the matrix entry
            # below so the build job never has to re-infer or default
            # deploymentModel itself.
            ACTIVE_DEPLOYMENT_MODEL="${GG_REASON#deploymentModel=}"

            set +e
            REASON="$(is_active_deployment_values_file "$VALUES_FILE")"
            STATUS=$?
            set -e

            if [ "$STATUS" -eq 0 ]; then
              echo "Active: ${DEPLOYMENT_ID} (${REASON})"
              ACTIVE_LOG="${ACTIVE_LOG}  - ${DEPLOYMENT_ID} (${REASON})\n"
              DEPLOYMENT_MATRIX_ITEMS="$(echo "$DEPLOYMENT_MATRIX_ITEMS" | jq -c \
                --arg deployment_id "$DEPLOYMENT_ID" \
                --arg deployment_model "$ACTIVE_DEPLOYMENT_MODEL" \
                '. + [{environment: "dev", deployment_id: $deployment_id, deployment_model: $deployment_model, deploy: true}]')"
            else
              echo "Not active: ${DEPLOYMENT_ID} (${REASON}) -- skipping build/update for this candidate."
            fi
          done

          echo ""
          echo "Detecting deleted or newly-inactive deployment folders under envs/dev/..."

          NAME_STATUS="$(git diff --name-status "$BEFORE_SHA" "$AFTER_SHA" -- 'envs/dev/**' 'helm/goldengate/**' || true)"

          echo "Name-status diff under envs/dev/ and helm/goldengate/:"
          echo "${NAME_STATUS:-<none>}"

          # A path is a deletion candidate when it was removed (D) or is the
          # old side of a rename (R). Only envs/dev/<id>/ paths matter here;
          # helm/goldengate/** changes never produce a deployment deletion.
          REMOVED_PATH_IDS="$(echo "$NAME_STATUS" \
            | awk '$1 ~ /^D/ { print $2 } $1 ~ /^R/ { print $2 }' \
            | grep -E '^envs/dev/[^/]+/' \
            | grep -v '^envs/dev/argocd/' \
            | sed -E 's#^envs/dev/([^/]+)/.*#\1#' \
            | sort -u || true)"

          # Deployments whose values.yaml itself changed (added/modified) in
          # this push must be re-checked too: the file can still exist but
          # have just become comment-only/empty/disabled.
          CHANGED_VALUES_IDS="$(echo "$CHANGED_FILES" \
            | grep -E '^envs/dev/[^/]+/values\.yaml$' \
            | grep -v '^envs/dev/argocd/' \
            | sed -E 's#^envs/dev/([^/]+)/values\.yaml$#\1#' \
            | sort -u || true)"

          DELETION_CANDIDATE_IDS="$(printf '%s\n%s\n' "$REMOVED_PATH_IDS" "$CHANGED_VALUES_IDS" | sed '/^$/d' | sort -u || true)"

          for CANDIDATE_ID in $DELETION_CANDIDATE_IDS; do
            VALUES_FILE="envs/dev/${CANDIDATE_ID}/values.yaml"

            # Classify once, from whichever source actually has content: the
            # working tree when the file still exists (was modified, not
            # removed/renamed), otherwise its content at the base revision
            # (BEFORE_SHA) -- the last point a removed/renamed file's
            # content can still be read. Fails closed either way: a
            # candidate that does not resolve to a valid GoldenGate
            # deploymentModel (singleRuntime/legacyPair) from EITHER source
            # is never added to the deletion matrix, and is never assumed to
            # be legacyPair (or any other value) by default. This is what
            # keeps a removed/renamed different-chart values file (e.g. the
            # separate goldengate-monitor chart's own, or Argo CD's own)
            # from ever entering the GoldenGate deletion matrix.
            if [ -f "$VALUES_FILE" ]; then
              GG_SOURCE="working tree"
              set +e
              GG_REASON="$(is_goldengate_deployment_values_file "$VALUES_FILE")"
              GG_STATUS=$?
              set -e

              if [ "$GG_STATUS" -ne 0 ]; then
                case "$GG_REASON" in
                  "empty values.yaml"|"empty/comment-only values.yaml"|"empty/null parsed YAML")
                    # The file still exists but was deliberately emptied
                    # (zero-byte, whitespace/comment-only, or YAML null) --
                    # this is a recognized intentional-deletion shape, not a
                    # classification failure. Fall back to the previous
                    # valid content at the base revision to determine
                    # whether it used to be a genuine GoldenGate deployment
                    # and, if so, which deploymentModel it was.
                    echo "${VALUES_FILE} is now deliberately empty (${GG_REASON}). Checking its previous content at base revision (${BEFORE_SHA})..."
                    GG_SOURCE="base revision (${BEFORE_SHA}), current file deliberately emptied"
                    set +e
                    GG_REASON="$(is_goldengate_deployment_values_file_at_ref "$BEFORE_SHA" "$VALUES_FILE")"
                    GG_STATUS=$?
                    set -e
                    ;;
                  "unparsable YAML:"*|"parsed YAML is not a mapping")
                    # Malformed or structurally invalid current YAML is
                    # never treated as an intentional deletion signal, and
                    # never silently ignored either -- fail the workflow
                    # closed with a clear error so the mistake is visible.
                    echo "FAIL: ${VALUES_FILE} could not be classified: ${GG_REASON}"
                    echo "This is not a recognized intentional-deletion shape (missing, zero-byte, whitespace/comment-only, or YAML null) -- it looks like invalid content instead. Fix or intentionally empty the file, or remove it entirely, before this push can be processed."
                    exit 1
                    ;;
                  *)
                    # A syntactically valid mapping that simply isn't a
                    # GoldenGate deployment (no/unknown deploymentModel) --
                    # not a deletion signal, not an error either.
                    ;;
                esac
              fi
            else
              GG_SOURCE="base revision (${BEFORE_SHA})"
              set +e
              GG_REASON="$(is_goldengate_deployment_values_file_at_ref "$BEFORE_SHA" "$VALUES_FILE")"
              GG_STATUS=$?
              set -e
            fi

            if [ "$GG_STATUS" -ne 0 ]; then
              echo "Not a GoldenGate deployment: ${CANDIDATE_ID} (${GG_REASON}, from ${GG_SOURCE}) -- ignoring for deletion evaluation."
              continue
            fi

            # GG_REASON is exactly "deploymentModel=<singleRuntime|legacyPair>"
            # on success (see _classify_deployment_model_yaml) -- the
            # deployment_model placed in the deletion matrix below comes
            # directly from this same successfully parsed and classified
            # document, never re-derived separately.
            CANDIDATE_DEPLOYMENT_MODEL="${GG_REASON#deploymentModel=}"

            set +e
            REASON="$(is_active_deployment_values_file "$VALUES_FILE")"
            STATUS=$?
            set -e

            if [ "$STATUS" -ne 0 ]; then
              # deployment.enabled=false is a "retired but retained" signal
              # only: the values folder is kept for rollback/reference and
              # must never drive live Argo CD Application or namespace
              # deletion. Only a genuinely removed file (missing/deleted) or
              # an explicit lifecycle.state=absent is treated as a real
              # deletion request. enabled=false (top-level) is treated the
              # same as deployment.enabled=false here for consistency.
              case "$REASON" in
                deployment.enabled=false*|enabled=false*)
                  echo "Inactive (retained, not deleted): ${CANDIDATE_ID} (${REASON})"
                  INACTIVE_LOG="${INACTIVE_LOG}  - ${CANDIDATE_ID} (${REASON}) [retained -- no deletion request]\n"
                  ;;
                *)
                  echo "Inactive/deleted: ${CANDIDATE_ID} (${REASON})"
                  INACTIVE_LOG="${INACTIVE_LOG}  - ${CANDIDATE_ID} (${REASON})\n"
                  echo "  deploymentModel (${GG_SOURCE}): ${CANDIDATE_DEPLOYMENT_MODEL}"

                  DELETION_MATRIX_ITEMS="$(echo "$DELETION_MATRIX_ITEMS" | jq -c \
                    --arg deployment_id "$CANDIDATE_ID" \
                    --arg deployment_model "$CANDIDATE_DEPLOYMENT_MODEL" \
                    '. + [{environment: "dev", deployment_id: $deployment_id, deployment_model: $deployment_model}]')"
                  ;;
              esac
            else
              echo "Still active: ${CANDIDATE_ID} (${REASON}) -- not a deletion."
            fi
          done

          # Deletion wins: drop any ID from the deployment matrix that also
          # ended up in the deletion matrix (e.g. a deployment that changed
          # to inactive content in the same push helm/goldengate/** changed).
          DEPLOYMENT_MATRIX_ITEMS="$(echo "$DEPLOYMENT_MATRIX_ITEMS" | jq -c \
            --argjson deletions "$DELETION_MATRIX_ITEMS" \
            '[ .[] | select(.deployment_id as $id | ($deletions | map(.deployment_id) | index($id)) == null) ]')"

          echo ""
          echo "Active deployment IDs selected for build/update:"
          echo -e "${ACTIVE_LOG:-  <none>}"

          echo "Inactive/deleted deployment IDs selected for deletion:"
          echo -e "${INACTIVE_LOG:-  <none>}"

          MATRIX_COUNT="$(echo "$DEPLOYMENT_MATRIX_ITEMS" | jq 'length')"

          if [ "$MATRIX_COUNT" -eq 0 ]; then
            echo "No active deployment folders selected for build/update."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "deployment_matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "deployment_matrix=${DEPLOYMENT_MATRIX_ITEMS}" >> "$GITHUB_OUTPUT"
          fi

          DELETION_COUNT="$(echo "$DELETION_MATRIX_ITEMS" | jq 'length')"

          if [ "$DELETION_COUNT" -eq 0 ]; then
            echo "No inactive/deleted deployment folders detected."
            echo "has_deletions=false" >> "$GITHUB_OUTPUT"
            echo "deletion_matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_deletions=true" >> "$GITHUB_OUTPUT"
            echo "deletion_matrix=${DELETION_MATRIX_ITEMS}" >> "$GITHUB_OUTPUT"
          fi

          echo "Deployment matrix: ${DEPLOYMENT_MATRIX_ITEMS}"
          echo "Deletion matrix: ${DELETION_MATRIX_ITEMS}"

  build_publish_and_deploy:
    name: Build, publish, and deploy GoldenGate Helm chart via Argo CD

    needs:
      - detect_changed_deployments
    if: needs.detect_changed_deployments.outputs.has_changes == 'true'

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    environment: ${{ matrix.environment }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect_changed_deployments.outputs.deployment_matrix) }}

    concurrency:
      group: goldengate-helm-deploy-${{ github.ref }}-${{ matrix.environment }}-${{ matrix.deployment_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}

      - name: Install Helm and kubectl if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking/installing Helm..."

          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.15.4"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                HELM_ARCH="amd64"
                ;;
              aarch64|arm64)
                HELM_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for Helm: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz" -o /tmp/helm.tar.gz
            tar -zxvf /tmp/helm.tar.gz -C /tmp
            sudo mv "/tmp/linux-${HELM_ARCH}/helm" /usr/local/bin/helm
            sudo chmod +x /usr/local/bin/helm
          fi

          helm version --short

          echo "Checking/installing kubectl..."

          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL_VERSION="v1.35.0"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                KUBECTL_ARCH="amd64"
                ;;
              aarch64|arm64)
                KUBECTL_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for kubectl: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" -o /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

          kubectl version --client=true

      - name: Verify runner tools and AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "Checking required tools..."
          aws --version
          helm version --short
          kubectl version --client=true

          echo "Repository variable summary:"
          echo "AWS_REGION=${AWS_REGION}"
          echo "ECR_ACCOUNT_ID=${ECR_ACCOUNT_ID}"
          echo "ECR_REGISTRY=${ECR_REGISTRY}"
          echo "EKS_ACCOUNT_ID=${EKS_ACCOUNT_ID}"
          echo "EKS_CLUSTER_NAME=${EKS_CLUSTER_NAME}"
          echo "EKS_CLUSTER_ARN=${EKS_CLUSTER_ARN}"

      - name: Prepare deployment variables
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ matrix.environment }}"
          DEPLOYMENT_ID="${{ matrix.deployment_id }}"

          if [[ ! "$DEPLOYMENT_ID" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "Invalid deployment_id: $DEPLOYMENT_ID"
            echo "Use lowercase letters, numbers, and hyphens only."
            echo "Example: gg-oracle-payments-01"
            exit 1
          fi

          VALUES_FILE="${ENVS_ROOT}/${ENVIRONMENT}/${DEPLOYMENT_ID}/values.yaml"

          # deploymentModel is never inferred or defaulted here -- it comes
          # straight from the validated active matrix built by
          # detect_changed_deployments, which only ever admits a deployment
          # whose own values file classified as deploymentModel=singleRuntime
          # under the active contract (see is_goldengate_deployment_values_file
          # in that job). This is a defense-in-depth assertion, not a guess:
          # any other value reaching this job is a bug upstream and must fail
          # closed immediately rather than silently proceed under a defaulted
          # or re-inferred model.
          DEPLOYMENT_MODEL="${{ matrix.deployment_model }}"

          if [ "$DEPLOYMENT_MODEL" != "singleRuntime" ]; then
            echo "FAIL: matrix.deployment_model is '${DEPLOYMENT_MODEL}', expected exactly 'singleRuntime'."
            echo "The active build/deploy path only ever supports deploymentModel=singleRuntime -- legacyPair is retired and is never deployed by this job. This indicates the upstream active matrix admitted an unexpected value; refusing to guess or default."
            exit 1
          fi

          echo "deploymentModel: ${DEPLOYMENT_MODEL} (from the validated active matrix, deployment_id=${DEPLOYMENT_ID})"

          TARGET_NAMESPACE="goldengate-${ENVIRONMENT}"
          RELEASE_NAME="${DEPLOYMENT_ID}"
          # Remove the leading "gg-" only for the Argo CD Application name
          # suffix, e.g. gg-oracle-payments-01 -> goldengate-dev-oracle-payments-01.
          APP_SUFFIX="${DEPLOYMENT_ID#gg-}"
          ARGOCD_APP_NAME="goldengate-${ENVIRONMENT}-${APP_SUFFIX}"

          TEMP_CHART_PATH="work/charts/${DEPLOYMENT_ID}/goldengate"

          ARGOCD_NAMESPACE="argocd"

          echo "DEPLOYMENT_MODEL=${DEPLOYMENT_MODEL}" >> "$GITHUB_ENV"
          echo "deployment_model=${DEPLOYMENT_MODEL}" >> "$GITHUB_OUTPUT"

          if [ ${#TARGET_NAMESPACE} -gt 63 ]; then
            echo "Namespace is too long: $TARGET_NAMESPACE"
            echo "Kubernetes namespace names must be 63 characters or less."
            echo "Please shorten deployment_id."
            exit 1
          fi

          if [ ${#RELEASE_NAME} -gt 53 ]; then
            echo "Helm release name is too long: $RELEASE_NAME"
            echo "Please shorten deployment_id because resource names add suffixes."
            exit 1
          fi

          # Unique per deployment: matrix jobs for different deployment_ids
          # share the same run_number, so the shared suffix alone would
          # collide when they package different deployment-specific values.
          CHART_VERSION="0.1.${{ github.run_number }}-${DEPLOYMENT_ID}"
          HELM_ECR_REPOSITORY="${HELM_OCI_NAMESPACE}/${CHART_NAME}"
          HELM_PUSH_URL="oci://${ECR_REGISTRY}/${HELM_OCI_NAMESPACE}"
          HELM_CHART_REF="oci://${ECR_REGISTRY}/${HELM_ECR_REPOSITORY}"

          echo "ENVIRONMENT=${ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> "$GITHUB_ENV"
          echo "TARGET_NAMESPACE=${TARGET_NAMESPACE}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"
          echo "VALUES_FILE=${VALUES_FILE}" >> "$GITHUB_ENV"
          echo "TEMP_CHART_PATH=${TEMP_CHART_PATH}" >> "$GITHUB_ENV"
          echo "ARGOCD_NAMESPACE=${ARGOCD_NAMESPACE}" >> "$GITHUB_ENV"
          echo "ARGOCD_APP_NAME=${ARGOCD_APP_NAME}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${CHART_VERSION}" >> "$GITHUB_ENV"
          echo "HELM_ECR_REPOSITORY=${HELM_ECR_REPOSITORY}" >> "$GITHUB_ENV"
          echo "HELM_PUSH_URL=${HELM_PUSH_URL}" >> "$GITHUB_ENV"
          echo "HELM_CHART_REF=${HELM_CHART_REF}" >> "$GITHUB_ENV"

          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "target_namespace=${TARGET_NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "values_file=${VALUES_FILE}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "helm_chart_ref=${HELM_CHART_REF}" >> "$GITHUB_OUTPUT"
          echo "argocd_app_name=${ARGOCD_APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$HELM_CHART_PATH/Chart.yaml" ]; then
            echo "Missing Helm Chart.yaml: $HELM_CHART_PATH/Chart.yaml"
            exit 1
          fi

          if [ ! -f "$HELM_CHART_PATH/values.yaml" ]; then
            echo "Missing Helm values.yaml: $HELM_CHART_PATH/values.yaml"
            exit 1
          fi

          if [ ! -f "$VALUES_FILE" ]; then
            echo "Missing deployment values file: $VALUES_FILE"
            echo "Create: envs/${ENVIRONMENT}/${DEPLOYMENT_ID}/values.yaml"
            exit 1
          fi

          echo "Required files are present."
          echo "Helm chart path: $HELM_CHART_PATH"
          echo "Deployment values: $VALUES_FILE"

      - name: Login Helm to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Ensure Helm ECR repository exists
        shell: bash
        run: |
          set -euo pipefail

          if aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$HELM_ECR_REPOSITORY" >/dev/null 2>&1; then
            echo "ECR repository already exists: $HELM_ECR_REPOSITORY"
          else
            echo "Creating ECR repository: $HELM_ECR_REPOSITORY"

            aws ecr create-repository \
              --region "$AWS_REGION" \
              --repository-name "$HELM_ECR_REPOSITORY" \
              --tags Key=ApplicationName,Value=CloudFactory Key=DataClassification,Value=General Key=BusinessCriticality,Value=Low Key=BusinessUnit,Value=TechnologyPlatform Key=CostCenter,Value=219 \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE >/dev/null

            echo "Created ECR repository: $HELM_ECR_REPOSITORY"
          fi

      - name: Ensure Helm ECR repository policy allows Argo CD pull
        shell: bash
        run: |
          set -euo pipefail

          # Runs every time (repo newly created or already existing) so the
          # in-cluster Argo CD ECR OCI IRSA role always has pull access,
          # without clobbering any other statements already on this repo.
          ARGOCD_ECR_STATEMENT_SID="AllowArgocdEksRolePullGoldengateHelmChart"

          echo "Fetching existing ECR repository policy for ${HELM_ECR_REPOSITORY}..."

          EXISTING_POLICY="$(aws ecr get-repository-policy \
            --region "$AWS_REGION" \
            --repository-name "$HELM_ECR_REPOSITORY" \
            --query policyText \
            --output text 2>/tmp/ecr-get-policy-error.txt)" || {
              if grep -q "RepositoryPolicyNotFoundException" /tmp/ecr-get-policy-error.txt; then
                echo "No existing repository policy found. Starting from an empty policy."
                EXISTING_POLICY='{"Version":"2012-10-17","Statement":[]}'
              else
                echo "Failed to read the existing ECR repository policy:"
                cat /tmp/ecr-get-policy-error.txt
                echo ""
                echo "The workflow role must have ecr:GetRepositoryPolicy and ecr:SetRepositoryPolicy"
                echo "on this repository. Grant those permissions and re-run."
                exit 1
              fi
            }

          echo "Merging in Sid ${ARGOCD_ECR_STATEMENT_SID} (existing statements are preserved)..."

          echo "$EXISTING_POLICY" | jq \
            --arg sid "$ARGOCD_ECR_STATEMENT_SID" \
            --arg roleArn "$ARGOCD_ECR_READ_ROLE_ARN" \
            '
            .Statement = ([.Statement[] | select(.Sid != $sid)]
              + [{
                  Sid: $sid,
                  Effect: "Allow",
                  Principal: { AWS: $roleArn },
                  Action: [
                    "ecr:BatchCheckLayerAvailability",
                    "ecr:BatchGetImage",
                    "ecr:GetDownloadUrlForLayer",
                    "ecr:DescribeImages",
                    "ecr:DescribeRepositories"
                  ]
                }])
            ' > /tmp/ecr-repository-policy.json

          echo "Applying merged ECR repository policy to ${HELM_ECR_REPOSITORY}..."

          aws ecr set-repository-policy \
            --region "$AWS_REGION" \
            --repository-name "$HELM_ECR_REPOSITORY" \
            --policy-text file:///tmp/ecr-repository-policy.json >/dev/null

          echo "ECR repository policy on ${HELM_ECR_REPOSITORY} now allows pull from ${ARGOCD_ECR_READ_ROLE_ARN}."

      - name: Build Helm dependencies
        shell: bash
        run: |
          set -euo pipefail

          helm dependency build "$HELM_CHART_PATH" || true

      - name: Helm lint deployment
        shell: bash
        run: |
          set -euo pipefail

          # global.deploymentId is not consumed anywhere in helm/goldengate
          # (the runtime name/labels derive from Release.Name /
          # runtime.name/runtime.fullnameOverride -- see
          # goldengate.runtimeName in _helpers.tpl), so it is never passed
          # here. deploymentModel itself is never set via --set either: the
          # deployment values file ($VALUES_FILE) always declares its own
          # deploymentModel, and this job has already asserted it is exactly
          # "singleRuntime" above -- helm/goldengate's own unconditional
          # goldengate.assertSupportedDeploymentModel check re-verifies the
          # same thing at render time as a second, independent gate. The
          # chart no longer has an observer sidecar or monitoring.observer
          # value at all.
          helm lint "$HELM_CHART_PATH" \
            --values "$VALUES_FILE" \
            --set global.environment="$ENVIRONMENT"

      - name: Render manifest for validation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p rendered

          helm template "$RELEASE_NAME" "$HELM_CHART_PATH" \
            --namespace "$TARGET_NAMESPACE" \
            --values "$VALUES_FILE" \
            --set global.environment="$ENVIRONMENT" \
            > "rendered/${RELEASE_NAME}.yaml"

          echo "Rendered manifest: rendered/${RELEASE_NAME}.yaml"

      - name: Validate GoldenGate namespace is rendered
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${RELEASE_NAME}.yaml"

          echo "deploymentModel=singleRuntime: checking that NO Namespace document is rendered from this release: ${RENDERED}"

          # A single-runtime release must never render a Namespace -- it
          # deploys into the shared goldengate-<environment> namespace,
          # which this release does not create or own. The chart's
          # legacyPair Namespace template was removed entirely once
          # legacyPair rendering was retired (helm/goldengate/templates/
          # namespace.yaml no longer exists), so this is now the only
          # deployment model this job ever handles, and this check is
          # unconditional.
          if grep -qE '^kind: Namespace$' "$RENDERED"; then
            echo "FAIL: a Namespace document was rendered for a singleRuntime release. This must never happen -- singleRuntime releases must not create or own the shared namespace."
            exit 1
          fi

          echo "OK: no Namespace document rendered, as expected for deploymentModel=singleRuntime."

      - name: Validate EFS persistence resources are rendered
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${RELEASE_NAME}.yaml"

          if ! command -v python3 >/dev/null 2>&1; then
            echo "FAIL: python3 is required to validate EFS persistence configuration and is not available on this runner."
            exit 1
          fi

          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            echo "FAIL: PyYAML is required to validate EFS persistence configuration and is not available on this runner."
            exit 1
          fi

          # Strict, fail-closed values-file parsing: never grep for an
          # optional key (an absent persistence.efs.storageClass.basePath is
          # expected and must not abort the script under set -euo
          # pipefail). Derives the expected default basePath using exactly
          # the same contract as helm/goldengate/templates/_helpers.tpl's
          # goldengate.efsBasePath -- never a re-invented name.
          set +e
          EFS_FACTS="$(python3 - "$VALUES_FILE" "$DEPLOYMENT_ID" "$DEPLOYMENT_MODEL" <<'PYEOF'
          import sys

          import yaml

          values_path, deployment_id, deployment_model = sys.argv[1:4]

          # Defense in depth: this job asserted deployment_model ==
          # "singleRuntime" already in "Prepare deployment variables" -- this
          # is that same validated value passed through, never re-inferred.
          # legacyPair's EFS basePath derivation (global.deploymentId-based)
          # was removed entirely along with the rest of the active legacyPair
          # path; only singleRuntime is ever handled here now.
          if deployment_model != "singleRuntime":
              print(f"FAIL: unexpected deploymentModel {deployment_model!r} reached EFS validation -- only singleRuntime is supported for active deployments.")
              sys.exit(1)

          with open(values_path) as f:
              raw = f.read()

          try:
              data = yaml.safe_load(raw)
          except yaml.YAMLError as exc:
              print(f"FAIL: {values_path} is not valid YAML: {exc}")
              sys.exit(1)

          if not data or not isinstance(data, dict):
              print(f"FAIL: {values_path} root must be a non-empty YAML mapping.")
              sys.exit(1)

          persistence = data.get("persistence")
          if persistence is not None and not isinstance(persistence, dict):
              print(f"FAIL: {values_path} persistence must be a mapping, got {type(persistence).__name__}.")
              sys.exit(1)

          persistence = persistence or {}
          efs_enabled = persistence.get("enabled") is True and persistence.get("provider") == "efs"

          if not efs_enabled:
              print("PERSISTENCE_EFS_ENABLED=false")
              sys.exit(0)

          efs = persistence.get("efs")
          if not isinstance(efs, dict):
              print(f"FAIL: {values_path} persistence.efs must be a mapping when persistence.enabled=true and provider=efs.")
              sys.exit(1)

          file_system_id = efs.get("fileSystemId")
          if not isinstance(file_system_id, str) or not file_system_id.strip():
              print(f"FAIL: {values_path} persistence.efs.fileSystemId must be a non-empty string when EFS is enabled.")
              sys.exit(1)

          storage_class = efs.get("storageClass")
          if storage_class is not None and not isinstance(storage_class, dict):
              print(f"FAIL: {values_path} persistence.efs.storageClass must be a mapping when present, got {type(storage_class).__name__}.")
              sys.exit(1)

          explicit_base_path = (storage_class or {}).get("basePath")
          if explicit_base_path is not None and not isinstance(explicit_base_path, str):
              print(f"FAIL: {values_path} persistence.efs.storageClass.basePath must be a string when present, got {type(explicit_base_path).__name__}.")
              sys.exit(1)

          if isinstance(explicit_base_path, str) and explicit_base_path.strip():
              base_path = explicit_base_path
          else:
              # Mirrors goldengate.efsBasePath: an absent/null/empty basePath
              # derives from the canonical runtime name (fullnameOverride,
              # then name, then -- matching Release.Name in the chart --
              # this workflow's own deployment_id, since envs/dev/<id>/ is
              # itself named after the canonical runtime name).
              runtime = data.get("runtime") or {}
              runtime_name = runtime.get("fullnameOverride") or runtime.get("name") or deployment_id
              if not isinstance(runtime_name, str) or not runtime_name.strip():
                  print(f"FAIL: {values_path} could not resolve a runtime name for the default EFS basePath.")
                  sys.exit(1)
              base_path = f"/{runtime_name}"

          print("PERSISTENCE_EFS_ENABLED=true")
          print(f"EFS_FILESYSTEM_ID={file_system_id}")
          print(f"EFS_BASE_PATH={base_path}")
          PYEOF
          )"
          EFS_FACTS_STATUS=$?
          set -e

          if [ "$EFS_FACTS_STATUS" -ne 0 ]; then
            echo "$EFS_FACTS"
            exit 1
          fi

          source <(printf '%s\n' "$EFS_FACTS")

          if [ "${PERSISTENCE_EFS_ENABLED:-false}" != "true" ]; then
            echo "persistence.enabled/provider=efs not set in ${VALUES_FILE}. Skipping EFS persistence render checks."
            exit 0
          fi

          echo "persistence.enabled=true and provider=efs in ${VALUES_FILE}. Checking rendered manifest: ${RENDERED}"
          echo "Expected EFS fileSystemId: ${EFS_FILESYSTEM_ID}"
          echo "Expected EFS basePath: ${EFS_BASE_PATH}"

          python3 - "$RENDERED" "$VALUES_FILE" "$DEPLOYMENT_ID" "$DEPLOYMENT_MODEL" "$ENVIRONMENT" "$EFS_FILESYSTEM_ID" "$EFS_BASE_PATH" <<'PYEOF'
          import re
          import sys

          import yaml


          class DuplicateKeyError(Exception):
              pass


          class StrictSafeLoader(yaml.SafeLoader):
              pass


          def _no_duplicates_constructor(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise DuplicateKeyError(
                          f"duplicate mapping key {key!r} at line {key_node.start_mark.line + 1}"
                      )
                  value = loader.construct_object(value_node, deep=deep)
                  mapping[key] = value
              return mapping


          StrictSafeLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, _no_duplicates_constructor
          )

          (rendered_path, values_path, deployment_id, deployment_model,
           environment, expected_file_system_id, expected_base_path) = sys.argv[1:8]

          with open(rendered_path) as f:
              raw = f.read()

          # Attribute each rendered document to the template that rendered
          # it using Helm's own leading "# Source: <path>" comment -- never
          # re-deriving the chart's resource-naming fallback chains
          # (goldengate.sourceName/targetName/...) independently in Python.
          documents = []
          for chunk in re.split(r"(?m)^---$", raw):
              chunk = chunk.strip("\n")
              if not chunk.strip():
                  continue
              source_template = None
              for line in chunk.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("# Source:"):
                      source_template = line[len("# Source:"):].strip()
                  break
              try:
                  doc = yaml.load(chunk, Loader=StrictSafeLoader)
              except DuplicateKeyError as exc:
                  print(f"FAIL: duplicate YAML mapping key in rendered manifest ({source_template}): {exc}")
                  sys.exit(1)
              except yaml.YAMLError as exc:
                  print(f"FAIL: rendered manifest document is not valid YAML ({source_template}): {exc}")
                  sys.exit(1)
              if doc:
                  documents.append((source_template, doc))

          expected_storage_class_name = f"gg-efs-{environment}-{deployment_id}"

          storage_classes = [
              doc for _, doc in documents
              if doc.get("kind") == "StorageClass"
              and (doc.get("metadata") or {}).get("name") == expected_storage_class_name
          ]
          if len(storage_classes) != 1:
              all_names = [(doc.get("metadata") or {}).get("name") for _, doc in documents if doc.get("kind") == "StorageClass"]
              print(f"FAIL: expected exactly one StorageClass named {expected_storage_class_name!r}, found {len(storage_classes)} (all rendered StorageClass names: {all_names}).")
              sys.exit(1)

          sc = storage_classes[0]
          parameters = sc.get("parameters") or {}

          checks = [
              (sc.get("provisioner") == "efs.csi.aws.com",
               f"provisioner (expected 'efs.csi.aws.com', got {sc.get('provisioner')!r})"),
              (parameters.get("provisioningMode") == "efs-ap",
               f"parameters.provisioningMode (expected 'efs-ap', got {parameters.get('provisioningMode')!r})"),
              (parameters.get("fileSystemId") == expected_file_system_id,
               f"parameters.fileSystemId (expected {expected_file_system_id!r}, got {parameters.get('fileSystemId')!r})"),
              (parameters.get("basePath") == expected_base_path,
               f"parameters.basePath (expected {expected_base_path!r}, got {parameters.get('basePath')!r})"),
              (parameters.get("subPathPattern") == "${.PVC.name}",
               f"parameters.subPathPattern (expected '\x24{{.PVC.name}}', got {parameters.get('subPathPattern')!r})"),
              (parameters.get("ensureUniqueDirectory") == "true",
               f"parameters.ensureUniqueDirectory (expected 'true', got {parameters.get('ensureUniqueDirectory')!r})"),
              (sc.get("reclaimPolicy") == "Retain",
               f"reclaimPolicy (expected 'Retain', got {sc.get('reclaimPolicy')!r})"),
          ]
          failed = [msg for ok, msg in checks if not ok]
          if failed:
              print(f"FAIL: rendered StorageClass {expected_storage_class_name!r} does not match the expected configuration:")
              for msg in failed:
                  print(f"  - {msg}")
              sys.exit(1)

          print(f"OK: StorageClass {expected_storage_class_name!r} matches the expected configuration (provisioner, provisioningMode, fileSystemId, basePath={expected_base_path!r}, subPathPattern, ensureUniqueDirectory, reclaimPolicy).")

          def _volume(sts_doc, name):
              volumes = ((sts_doc.get("spec") or {}).get("template") or {}).get("spec", {}).get("volumes") or []
              for v in volumes:
                  if v.get("name") == name:
                      return v
              return None

          def _check_u02_u03(label, sts_doc, expected_pvc_name):
              u02 = _volume(sts_doc, "u02")
              if not u02 or (u02.get("persistentVolumeClaim") or {}).get("claimName") != expected_pvc_name:
                  print(f"FAIL: {label} StatefulSet u02 volume does not use persistentVolumeClaim.claimName={expected_pvc_name!r} (found: {u02!r}).")
                  sys.exit(1)
              u03 = _volume(sts_doc, "u03")
              if not u03 or "emptyDir" not in u03:
                  print(f"FAIL: {label} StatefulSet u03 volume is not emptyDir (found: {u03!r}).")
                  sys.exit(1)

          # Defense in depth, matching the same assertion above: only
          # singleRuntime is ever validated here. legacyPair's source/target
          # PVC and StatefulSet validation was removed entirely along with
          # the rest of the active legacyPair path -- helm/goldengate no
          # longer renders source-statefulset.yaml/target-statefulset.yaml
          # at all (see Git history for the removed templates).
          if deployment_model != "singleRuntime":
              print(f"FAIL: unexpected deploymentModel {deployment_model!r} reached EFS rendered-resource validation -- only singleRuntime is supported for active deployments.")
              sys.exit(1)

          expected_pvc_name = f"{deployment_id}-u02"

          pvcs = [
              doc for _, doc in documents
              if doc.get("kind") == "PersistentVolumeClaim"
              and (doc.get("metadata") or {}).get("name") == expected_pvc_name
          ]
          if len(pvcs) != 1:
              print(f"FAIL: expected exactly one PersistentVolumeClaim named {expected_pvc_name!r}, found {len(pvcs)}.")
              sys.exit(1)

          statefulsets = [doc for _, doc in documents if doc.get("kind") == "StatefulSet"]
          if len(statefulsets) != 1:
              print(f"FAIL: expected exactly one StatefulSet, found {len(statefulsets)}.")
              sys.exit(1)

          _check_u02_u03("runtime", statefulsets[0], expected_pvc_name)

          print("OK: EFS StorageClass, runtime PVC, and StatefulSet u02/u03 volumes all match the expected persistence configuration.")
          PYEOF

      - name: Validate no observer sidecar is rendered
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${RELEASE_NAME}.yaml"

          echo "deploymentModel=singleRuntime: validating the generic runtime resource contract with Python/PyYAML -- never indentation-based grep for Kubernetes object structure."

          if ! command -v python3 >/dev/null 2>&1; then
            echo "FAIL: python3 is required to validate singleRuntime rendered manifests and is not available on this runner."
            exit 1
          fi

          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            echo "FAIL: PyYAML is required to validate singleRuntime rendered manifests and is not available on this runner."
            exit 1
          fi

          python3 - "$RENDERED" "$VALUES_FILE" "$DEPLOYMENT_ID" "$TARGET_NAMESPACE" <<'PYEOF'
          import sys
          import yaml


          class DuplicateKeyError(Exception):
              pass


          class StrictSafeLoader(yaml.SafeLoader):
              pass


          def _no_duplicates_constructor(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise DuplicateKeyError(
                          f"duplicate mapping key {key!r} at line {key_node.start_mark.line + 1}"
                      )
                  value = loader.construct_object(value_node, deep=deep)
                  mapping[key] = value
              return mapping


          StrictSafeLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, _no_duplicates_constructor
          )

          FORBIDDEN_CONTAINER_SUBSTRINGS = (
              "goldengate-observer",
              "utility-sidecar",
              "fluent-bit",
              "fluentbit",
          )

          rendered_path, values_path, deployment_id, target_namespace = sys.argv[1:5]

          with open(rendered_path) as f:
              raw = f.read()

          try:
              documents = [d for d in yaml.load_all(raw, Loader=StrictSafeLoader) if d]
          except DuplicateKeyError as exc:
              print(f"FAIL: duplicate YAML mapping key in rendered manifest: {exc}")
              sys.exit(1)
          except yaml.YAMLError as exc:
              print(f"FAIL: rendered manifest is not valid YAML: {exc}")
              sys.exit(1)

          print(f"OK: rendered manifest parsed as {len(documents)} document(s) with no duplicate mapping keys.")

          with open(values_path) as f:
              values = yaml.safe_load(f) or {}

          runtime_values = values.get("runtime") or {}
          expected_container_name = runtime_values.get("containerName")
          if not expected_container_name:
              print(f"FAIL: runtime.containerName not found in {values_path}.")
              sys.exit(1)

          # --- exactly one StatefulSet, exactly one regular container --------------
          statefulsets = [d for d in documents if d.get("kind") == "StatefulSet"]
          if len(statefulsets) != 1:
              print(f"FAIL: expected exactly one StatefulSet, found {len(statefulsets)}.")
              sys.exit(1)

          sts = statefulsets[0]
          pod_spec = (sts.get("spec") or {}).get("template", {}).get("spec", {}) or {}

          containers = pod_spec.get("containers") or []
          if len(containers) != 1:
              names = [c.get("name") for c in containers]
              print(
                  "FAIL: expected exactly one regular application container in "
                  f"spec.template.spec.containers, found {len(containers)}: {names}"
              )
              sys.exit(1)

          main_container = containers[0]
          main_container_name = main_container.get("name")
          if main_container_name != expected_container_name:
              print(
                  f"FAIL: expected main container name {expected_container_name!r}, "
                  f"found {main_container_name!r}."
              )
              sys.exit(1)
          print(
              "OK: exactly one regular application container "
              f"(spec.template.spec.containers), name={main_container_name!r}."
          )

          name_lower = (main_container_name or "").lower()
          image_lower = (main_container.get("image") or "").lower()
          for substring in FORBIDDEN_CONTAINER_SUBSTRINGS:
              if substring in name_lower or substring in image_lower:
                  print(
                      "FAIL: the regular container unexpectedly references "
                      f"{substring!r} (name={main_container_name!r}, image={main_container.get('image')!r})."
                  )
                  sys.exit(1)
          print("OK: no observer/utility-sidecar/Fluent Bit reference in the regular container.")

          # --- initContainers: exactly one prepare-u02-permissions, with the
          # stale ServiceManager.pid safeguard intact. An empty initContainers
          # list must fail here, not pass vacuously -- the mandatory
          # permissions/stale-PID init container is required, not optional.
          init_containers = pod_spec.get("initContainers") or []
          init_names = [c.get("name") for c in init_containers]

          if init_names != ["prepare-u02-permissions"]:
              print(
                  "FAIL: expected exactly one init container named "
                  f"'prepare-u02-permissions', found {init_names}."
              )
              sys.exit(1)

          init_container = init_containers[0]

          def _init_script_text(container):
              # command/args entries are ordinarily strings, but tolerate a
              # non-string entry (e.g. a Helm-rendered number) rather than
              # crashing on it -- only string entries can ever contain the
              # shell script text we are looking for.
              parts = []
              for item in list(container.get("command") or []) + list(container.get("args") or []):
                  if isinstance(item, str):
                      parts.append(item)
              return "\n".join(parts)

          init_script_text = _init_script_text(init_container)

          if "ServiceManager.pid" not in init_script_text:
              print(
                  "FAIL: the prepare-u02-permissions init container does not reference "
                  "ServiceManager.pid -- the stale GoldenGate Service Manager PID "
                  "safeguard is missing."
              )
              sys.exit(1)

          if 'rm -f -- "$SERVICE_MANAGER_PID_FILE"' not in init_script_text:
              print(
                  "FAIL: the prepare-u02-permissions init container does not contain "
                  "the expected stale-PID removal command "
                  '(rm -f -- "$SERVICE_MANAGER_PID_FILE").'
              )
              sys.exit(1)

          print(
              "OK: required prepare-u02-permissions init container and stale "
              "ServiceManager.pid cleanup are present."
          )

          # --- Services: exactly one ClusterIP, one headless -----------------------
          # Exact partition, not a substring/"occurs somewhere" check: every
          # rendered Service is classified into exactly one of two disjoint
          # buckets by its own clusterIP (and, for the normal bucket, its
          # type), and each bucket's length must be exactly 1.
          services = [d for d in documents if d.get("kind") == "Service"]
          if len(services) != 2:
              print(f"FAIL: expected exactly 2 Service documents (one ClusterIP, one headless), found {len(services)}.")
              sys.exit(1)

          headless_services = [
              s for s in services
              if (s.get("spec") or {}).get("clusterIP") == "None"
          ]
          normal_services = [
              s for s in services
              if (s.get("spec") or {}).get("clusterIP") != "None"
              and (s.get("spec") or {}).get("type") in (None, "ClusterIP")
          ]

          if len(headless_services) != 1:
              print(
                  "FAIL: expected exactly one headless Service (spec.clusterIP == 'None'), "
                  f"found {len(headless_services)}."
              )
              sys.exit(1)

          if len(normal_services) != 1:
              print(
                  "FAIL: expected exactly one normal ClusterIP Service "
                  "(spec.clusterIP != 'None' and type ClusterIP or omitted/defaulted), "
                  f"found {len(normal_services)}."
              )
              sys.exit(1)
          print("OK: exactly one ClusterIP Service and one headless Service.")

          # --- Ingress: exactly one, with exactly one host, when enabled -----------
          ingress_enabled = bool((values.get("ingress") or {}).get("enabled"))
          ingresses = [d for d in documents if d.get("kind") == "Ingress"]
          if ingress_enabled:
              if len(ingresses) != 1:
                  print(f"FAIL: expected exactly one rendered Ingress, found {len(ingresses)}.")
                  sys.exit(1)
              rules = (ingresses[0].get("spec") or {}).get("rules") or []
              if len(rules) != 1:
                  print(f"FAIL: expected exactly one Ingress host rule, found {len(rules)}.")
                  sys.exit(1)
              print("OK: exactly one Ingress with one host.")
          else:
              print("ingress.enabled is not true. Skipping Ingress checks.")

          # --- runtime-qualified resource names + shared namespace -----------------
          expected_names = {deployment_id, f"{deployment_id}-headless"}
          found_names = {
              (doc.get("metadata") or {}).get("name")
              for doc in documents
              if (doc.get("metadata") or {}).get("name") in expected_names
          }
          missing_names = expected_names - found_names
          if missing_names:
              print(f"FAIL: expected resource name(s) not found in the rendered manifest: {sorted(missing_names)}")
              sys.exit(1)

          spcs = [d for d in documents if d.get("kind") == "SecretProviderClass"]
          for spc in spcs:
              name = (spc.get("metadata") or {}).get("name", "")
              if not name.startswith(f"{deployment_id}-"):
                  print(f"FAIL: SecretProviderClass name {name!r} is not qualified by the runtime name {deployment_id!r}.")
                  sys.exit(1)
          if spcs:
              print(f"OK: {len(spcs)} SecretProviderClass name(s) are runtime-qualified.")

          # --- namespaced resources reference the shared namespace -----------------
          namespace_found = False
          for doc in documents:
              if doc.get("kind") == "Namespace":
                  print("FAIL: a Namespace document was rendered for a singleRuntime release.")
                  sys.exit(1)
              metadata = doc.get("metadata") or {}
              ns = metadata.get("namespace")
              if ns is not None:
                  namespace_found = True
                  if ns != target_namespace:
                      print(
                          f"FAIL: {doc.get('kind')} {(doc.get('metadata') or {}).get('name')} uses "
                          f"unexpected namespace {ns!r}, expected {target_namespace!r}."
                      )
                      sys.exit(1)
          if not namespace_found:
              print(f"FAIL: no namespaced resource references the expected shared namespace {target_namespace!r}.")
              sys.exit(1)
          print(f"OK: namespaced resources reference the shared namespace {target_namespace!r}.")

          print("OK: singleRuntime rendered manifest passed all generic runtime contract checks (Python/PyYAML, duplicate-key-safe).")
          PYEOF

      - name: Package deployment-specific Helm chart
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p packaged
          rm -rf "$TEMP_CHART_PATH"
          mkdir -p "$TEMP_CHART_PATH"

          # Argo CD (running inside the private EKS cluster) cannot reach
          # this GitHub repo's envs/dev/<id>/values.yaml path directly, so
          # the deployment values file is baked into a deployment-specific,
          # self-contained copy of the chart before packaging.
          echo "Copying base chart from $HELM_CHART_PATH into $TEMP_CHART_PATH..."
          cp -a "$HELM_CHART_PATH/." "$TEMP_CHART_PATH/"

          echo "Copying deployment values file $VALUES_FILE into $TEMP_CHART_PATH/values-deployment.yaml..."
          cp "$VALUES_FILE" "$TEMP_CHART_PATH/values-deployment.yaml"

          helm package "$TEMP_CHART_PATH" \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            --destination packaged

          ls -lrt packaged

      - name: Push Helm chart to ECR as OCI artifact
        shell: bash
        run: |
          set -euo pipefail

          helm push "packaged/${CHART_NAME}-${CHART_VERSION}.tgz" "$HELM_PUSH_URL"

          echo "Published Helm chart:"
          echo "$HELM_CHART_REF:$CHART_VERSION"

      - name: Verify Helm chart can be pulled from ECR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pulled

          helm pull "$HELM_CHART_REF" \
            --version "$CHART_VERSION" \
            --destination pulled

          ls -lrt pulled

      - name: Connect to EKS cluster
        if: ${{ matrix.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Target EKS cluster name: ${EKS_CLUSTER_NAME}"
          echo "Target EKS cluster ARN: ${EKS_CLUSTER_ARN}"
          echo "Target EKS account ID: ${EKS_ACCOUNT_ID}"
          echo "Current AWS identity:"
          aws sts get-caller-identity

          echo "Connecting to EKS using cross-account EKS deploy role:"
          echo "${EKS_DEPLOY_ROLE_ARN}"

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

          echo "Current kube context:"
          kubectl config current-context
          kubectl version --client=true

          echo "Verifying EKS access..."

          echo "Checking permission to read CSIDriver..."
          kubectl auth can-i get csidrivers.storage.k8s.io || true

          echo "Checking permission to read SecretProviderClass..."
          kubectl auth can-i get secretproviderclasses.secrets-store.csi.x-k8s.io --all-namespaces || true

          echo "Checking permission to manage Argo CD Applications..."
          kubectl auth can-i create applications.argoproj.io -n "${ARGOCD_NAMESPACE}" || true

      - name: Validate Secrets Store CSI configuration
        if: ${{ matrix.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Secrets Store CSI Driver prerequisites..."

          echo "Checking CSIDriver secrets-store.csi.k8s.io exists..."
          kubectl get csidriver secrets-store.csi.k8s.io >/dev/null || {
            echo "CSIDriver secrets-store.csi.k8s.io not found. Secrets Store CSI Driver is not installed on this cluster."
            exit 1
          }

          echo "Checking SecretProviderClass CRD exists..."
          kubectl get crd secretproviderclasses.secrets-store.csi.x-k8s.io >/dev/null || {
            echo "CRD secretproviderclasses.secrets-store.csi.x-k8s.io not found."
            exit 1
          }

          echo "Checking CSIDriver tokenRequests audiences..."
          TOKEN_REQUESTS="$(kubectl get csidriver secrets-store.csi.k8s.io -o jsonpath='{.spec.tokenRequests}')"

          echo "${TOKEN_REQUESTS}" | grep -q "sts.amazonaws.com" || {
            echo "CSIDriver secrets-store.csi.k8s.io is missing tokenRequests audience sts.amazonaws.com."
            echo "Current tokenRequests: ${TOKEN_REQUESTS}"
            exit 1
          }

          echo "${TOKEN_REQUESTS}" | grep -q "pods.eks.amazonaws.com" || {
            echo "CSIDriver secrets-store.csi.k8s.io is missing tokenRequests audience pods.eks.amazonaws.com."
            echo "Current tokenRequests: ${TOKEN_REQUESTS}"
            exit 1
          }

          echo "tokenRequests OK: ${TOKEN_REQUESTS}"

          echo "Checking Secrets Store CSI Driver Helm release for syncSecret.enabled..."
          if helm status secrets-store-csi-driver -n kube-system >/dev/null 2>&1; then
            SYNC_SECRET_VALUES="$(helm get values secrets-store-csi-driver -n kube-system -a | grep -A3 -i syncSecret || true)"

            echo "${SYNC_SECRET_VALUES}"

            echo "${SYNC_SECRET_VALUES}" | grep -qi "enabled: true" || {
              echo "syncSecret.enabled=true not found in Helm release secrets-store-csi-driver."
              echo "GoldenGate admin credentials require CSI secretObjects to sync AWS Secrets Manager data into Kubernetes Secret ogg-oracle-admin."
              exit 1
            }

            echo "syncSecret.enabled=true confirmed."
          else
            echo "Helm release secrets-store-csi-driver not found in kube-system. Skipping syncSecret check (driver may be managed outside Helm)."
          fi

          echo "Secrets Store CSI Driver prerequisites validated."

      - name: Ensure Argo CD Application CRD exists
        if: ${{ matrix.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Argo CD Application CRD..."

          kubectl get crd applications.argoproj.io >/dev/null || {
            echo "CRD applications.argoproj.io not found."
            echo "Argo CD must be installed on this cluster before GoldenGate can be deployed through it."
            echo "Run the argocd-eks-deployment.yaml workflow first."
            exit 1
          }

          echo "Argo CD Application CRD is present."

      - name: (Emergency fallback only) Refresh temporary Argo CD ECR OCI password
        # Not the long-term auth path. Long-term, Argo CD's ECR OCI repository
        # credentials are refreshed in-cluster by the argocd-ecr-token-sync
        # component via IRSA role GoldenGateArgocdECRRead-dev (see
        # policies/argocd-ecr-oci-read-dev/ and the ECR repository policy
        # step above). This step only runs if explicitly enabled via the
        # ENABLE_TEMP_ARGOCD_ECR_PASSWORD_INJECTION repository variable, for
        # emergency use before that component is deployed.
        if: ${{ matrix.deploy && vars.ENABLE_TEMP_ARGOCD_ECR_PASSWORD_INJECTION == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "EMERGENCY FALLBACK: injecting a short-lived ECR password into Argo CD."
          echo "This is not the long-term auth path -- disable ENABLE_TEMP_ARGOCD_ECR_PASSWORD_INJECTION"
          echo "once the in-cluster argocd-ecr-token-sync (IRSA role GoldenGateArgocdECRRead-dev) is live."

          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"

          cat <<EOF | kubectl apply -f - >/dev/null
          apiVersion: v1
          kind: Secret
          metadata:
            name: argocd-ecr-goldengate-oci
            namespace: ${ARGOCD_NAMESPACE}
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            type: helm
            enableOCI: "true"
            url: ${ECR_REGISTRY}/${HELM_OCI_NAMESPACE}/${CHART_NAME}
            username: AWS
            password: "${ECR_PASSWORD}"
          EOF

          unset ECR_PASSWORD

          echo "Argo CD repository credentials Secret applied: argocd-ecr-goldengate-oci"

      - name: Create or update Argo CD Application
        if: ${{ matrix.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Applying Argo CD Application: ${ARGOCD_APP_NAME} (deploymentModel=${DEPLOYMENT_MODEL})"

          # singleRuntime deploys into the shared goldengate-<environment>
          # namespace, which this Application does not create or own: no
          # CreateNamespace=true, no managedNamespaceMetadata. That namespace
          # is provisioned and owned by a separate, later platform/bootstrap
          # step. No observer Helm parameters either -- the generic runtime
          # chart resources never reference monitoring.observer. No
          # global.deploymentId parameter either -- it has no call-site
          # anywhere in helm/goldengate (the runtime name derives from
          # Release.Name/runtime.name/runtime.fullnameOverride). This is now
          # the only deployment model this job ever handles (legacyPair's
          # CreateNamespace=true / managedNamespaceMetadata Application shape
          # was removed along with the rest of the active legacyPair path).
          cat <<EOF | kubectl apply -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ${ARGOCD_APP_NAME}
            namespace: ${ARGOCD_NAMESPACE}
            finalizers:
              - resources-finalizer.argocd.argoproj.io
            labels:
              app.kubernetes.io/name: goldengate
              app.kubernetes.io/managed-by: argocd
              goldengate.adcb/environment: ${ENVIRONMENT}
              goldengate.adcb/deployment-id: ${DEPLOYMENT_ID}
          spec:
            project: default
            source:
              repoURL: ${HELM_CHART_REF}
              targetRevision: ${CHART_VERSION}
              path: .
              helm:
                releaseName: ${RELEASE_NAME}
                valueFiles:
                  - values-deployment.yaml
                parameters:
                  - name: global.environment
                    value: ${ENVIRONMENT}
            destination:
              server: https://kubernetes.default.svc
              namespace: ${TARGET_NAMESPACE}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
            revisionHistoryLimit: 10
          EOF

          echo "Forcing Argo CD refresh for ${ARGOCD_APP_NAME}..."

          kubectl annotate application "${ARGOCD_APP_NAME}" \
            -n "${ARGOCD_NAMESPACE}" \
            argocd.argoproj.io/refresh=hard \
            --overwrite

      - name: Wait for Argo CD sync and health
        if: ${{ matrix.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Argo CD Application ${ARGOCD_APP_NAME} to become Synced and Healthy..."

          TIMEOUT_SECONDS=1200
          INTERVAL_SECONDS=30
          ELAPSED=0

          while true; do
            if kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" >/dev/null 2>&1; then
              SYNC_STATUS="$(kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")"
              HEALTH_STATUS="$(kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")"
              OPERATION_PHASE="$(kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o jsonpath='{.status.operationState.phase}' 2>/dev/null || echo "")"

              echo "[$(date -u +%H:%M:%S)] sync=${SYNC_STATUS} health=${HEALTH_STATUS} operation=${OPERATION_PHASE:-none} (elapsed ${ELAPSED}s / ${TIMEOUT_SECONDS}s)"

              if [ "${HEALTH_STATUS}" = "Degraded" ]; then
                echo "Argo CD Application ${ARGOCD_APP_NAME} is Degraded."
                kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o wide
                exit 1
              fi

              if [ "${OPERATION_PHASE}" = "Failed" ] || [ "${OPERATION_PHASE}" = "Error" ]; then
                echo "Argo CD sync operation for ${ARGOCD_APP_NAME} ${OPERATION_PHASE}."
                kubectl describe application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}"
                exit 1
              fi

              if [ "${SYNC_STATUS}" = "Synced" ] && [ "${HEALTH_STATUS}" = "Healthy" ]; then
                echo "Argo CD Application ${ARGOCD_APP_NAME} is Synced and Healthy."
                break
              fi
            else
              echo "[$(date -u +%H:%M:%S)] Argo CD Application ${ARGOCD_APP_NAME} not found yet (elapsed ${ELAPSED}s / ${TIMEOUT_SECONDS}s)."
            fi

            if [ "${ELAPSED}" -ge "${TIMEOUT_SECONDS}" ]; then
              echo "Timed out after ${TIMEOUT_SECONDS}s waiting for ${ARGOCD_APP_NAME} to become Synced and Healthy."
              kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o wide || true
              kubectl describe application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" || true
              exit 1
            fi

            sleep "${INTERVAL_SECONDS}"
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
          done

          echo "Final Argo CD Application status:"
          kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o wide

      - name: Verify Argo CD deployment
        if: ${{ matrix.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Argo CD Application:"
          kubectl get application "$ARGOCD_APP_NAME" -n "$ARGOCD_NAMESPACE" -o wide

          echo ""
          echo "Argo CD Application details:"
          kubectl describe application "$ARGOCD_APP_NAME" -n "$ARGOCD_NAMESPACE"

          echo ""
          echo "Kubernetes resources in target namespace:"
          kubectl get all -n "$TARGET_NAMESPACE" || true

          echo ""
          echo "Ingress:"
          kubectl get ingress -n "$TARGET_NAMESPACE" || true

          echo ""
          echo "PVCs:"
          kubectl get pvc -n "$TARGET_NAMESPACE" || true

          echo ""
          echo "EFS StorageClass for this deployment:"
          # Not fatal: grep exits non-zero if no line matches, but that's a
          # meaningful "not found" signal here, not a script failure.
          kubectl get storageclass | grep "gg-efs-${ENVIRONMENT}-${DEPLOYMENT_ID}" || true

          echo ""
          echo "PersistentVolumes (cluster-scoped; PV output may not show namespace"
          echo "depending on -o format, so this is informational, not filtered):"
          kubectl get pv || true

          echo ""
          echo "PVC details:"
          kubectl describe pvc -n "$TARGET_NAMESPACE" || true

      - name: Upload rendered manifests and chart package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldengate-helm-artifacts-${{ matrix.environment }}-${{ matrix.deployment_id }}
          path: |
            rendered/
            packaged/
            pulled/
          if-no-files-found: warn
          retention-days: 7

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GoldenGate EKS Argo CD-based Deploy Summary"
            echo ""
            echo "### Deployment details"
            echo ""
            echo "- Environment: \`${ENVIRONMENT}\`"
            echo "- Deployment ID: \`${DEPLOYMENT_ID}\`"
            echo "- Target namespace: \`${TARGET_NAMESPACE}\`"
            echo "- Argo CD Application: \`${ARGOCD_APP_NAME}\` (namespace: \`${ARGOCD_NAMESPACE}\`)"
            echo "- Helm releaseName (used by Argo CD): \`${RELEASE_NAME}\`"
            echo "- Values file: \`${VALUES_FILE}\`"
            echo "- Deploy enabled: \`${{ matrix.deploy }}\`"
            echo ""
            echo "### AWS / EKS details"
            echo ""
            echo "- AWS region: \`${AWS_REGION}\`"
            echo "- ECR registry: \`${ECR_REGISTRY}\`"
            echo "- EKS account ID: \`${EKS_ACCOUNT_ID}\`"
            echo "- EKS cluster name: \`${EKS_CLUSTER_NAME}\`"
            echo "- EKS cluster ARN: \`${EKS_CLUSTER_ARN}\`"
            echo ""
            echo "### Published Helm OCI chart"
            echo ""
            echo "- Chart ref: \`${HELM_CHART_REF}\`"
            echo "- Chart version: \`${CHART_VERSION}\`"
            echo "- ECR OCI repo: \`${HELM_ECR_REPOSITORY}\`"
            echo ""
            echo "- Selected deployments this run: \`${{ needs.detect_changed_deployments.outputs.deployment_matrix }}\`"
            echo ""
            echo "Observer sidecar support has been retired (Phase 5A). No observer image is"
            echo "built, and no goldengate-observer container is rendered for any deployment"
            echo "model. Shared GoldenGate monitoring is performed by the shared gg-monitor"
            echo "Deployment (goldengate-monitoring namespace) polling Admin REST/PMS and"
            echo "publishing manager-compatible CloudWatch metrics under the GoldenGate/Pipelines"
            echo "namespace."
            echo ""
            echo "Independent CloudWatch verification (read-capable identity required):"
            echo ""
            echo "\`\`\`bash"
            echo "aws cloudwatch list-metrics --namespace GoldenGate/Pipelines --region ${AWS_REGION}"
            echo "\`\`\`"
            echo ""
            echo "### ECR repository policy prerequisites"
            echo ""
            echo "The \"Ensure Helm ECR repository policy allows Argo CD pull\" step requires the"
            echo "GitHub Actions workflow role (\`${ROLE_ARN}\`) to have \`ecr:GetRepositoryPolicy\`"
            echo "and \`ecr:SetRepositoryPolicy\` on \`${HELM_ECR_REPOSITORY}\`. If that step failed"
            echo "above with an access-denied error, grant those two actions to the role before"
            echo "re-running."
            echo ""
            echo "### Ownership"
            echo ""
            echo "Argo CD owns create/update/delete of this GoldenGate deployment's Kubernetes"
            echo "resources. GitHub Actions only packages/publishes the Helm OCI chart and"
            echo "creates/updates the Argo CD Application resource -- it does not run"
            echo "\`helm upgrade --install\` or \`helm uninstall\` against the cluster."
            echo ""
            echo "Argo CD ECR OCI repository credentials are expected to be maintained by the"
            echo "in-cluster token refresh component using IRSA role GoldenGateArgocdECRRead-dev."
            echo "GitHub Actions ensures the helm/goldengate ECR repository policy grants that"
            echo "role pull access on every run, but is not the long-term source of Argo CD's"
            echo "ECR credentials."
            echo ""
            echo "A values.yaml is inactive (excluded from the build/update matrix) when it is"
            echo "missing, zero-byte, whitespace-only, comment-only, parses to YAML null,"
            echo "enabled=false, deployment.enabled=false, or lifecycle.state=absent."
            echo ""
            echo "Of those, deletion (deletes the Argo CD Application and, if safely"
            echo "identifiable, its namespace) is triggered by:"
            echo "- physical removal of the values file or its whole deployment folder"
            echo "  (including removal of the entire envs/dev/ directory);"
            echo "- a values file that still exists but is now zero-byte;"
            echo "- a values file that still exists but is now whitespace-only;"
            echo "- a values file that still exists but is now comment-only;"
            echo "- a values file that still exists but now parses to YAML null;"
            echo "- an explicit lifecycle.state=absent."
            echo "The four \"still exists but emptied\" shapes above only trigger deletion when"
            echo "the previous revision at that path was a valid GoldenGate deployment -- the"
            echo "deployment_model recorded for deletion is always read from that previous,"
            echo "valid revision, never inferred or defaulted."
            echo ""
            echo "enabled=false and deployment.enabled=false mark a deployment as"
            echo "retired-but-retained for rollback/reference and never trigger deletion --"
            echo "the values folder stays in place and is excluded from the build/update"
            echo "matrix, but no Argo CD Application or namespace is touched."
            echo ""
            echo "### Validation commands"
            echo ""
            echo "\`\`\`bash"
            echo "kubectl get application ${ARGOCD_APP_NAME} -n ${ARGOCD_NAMESPACE} -o wide"
            echo "kubectl describe application ${ARGOCD_APP_NAME} -n ${ARGOCD_NAMESPACE}"
            echo "kubectl get all -n ${TARGET_NAMESPACE}"
            echo "kubectl get pvc -n ${TARGET_NAMESPACE}"
            echo "kubectl get ingress -n ${TARGET_NAMESPACE}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  delete_removed_argocd_applications:
    name: Delete removed GoldenGate Argo CD Applications

    needs: detect_changed_deployments
    if: github.event_name == 'push' && needs.detect_changed_deployments.outputs.has_deletions == 'true'

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect_changed_deployments.outputs.deletion_matrix) }}

    concurrency:
      group: goldengate-argocd-delete-${{ github.ref }}-${{ matrix.environment }}-${{ matrix.deployment_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}

      - name: Install kubectl if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking/installing kubectl..."

          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL_VERSION="v1.35.0"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                KUBECTL_ARCH="amd64"
                ;;
              aarch64|arm64)
                KUBECTL_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for kubectl: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" -o /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

          kubectl version --client=true

      - name: Verify AWS identity and kubectl
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "Checking kubectl..."
          kubectl version --client=true

      - name: Prepare deletion variables
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ matrix.environment }}"
          DEPLOYMENT_ID="${{ matrix.deployment_id }}"
          DEPLOYMENT_MODEL="${{ matrix.deployment_model }}"

          if [[ ! "$DEPLOYMENT_ID" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "Invalid deployment_id: $DEPLOYMENT_ID"
            echo "Use lowercase letters, numbers, and hyphens only."
            exit 1
          fi

          # deployment_model comes from detect_changed_deployments' deletion
          # matrix, which only ever emits exactly "singleRuntime" or
          # "legacyPair" under the historical deletion contract (see
          # is_goldengate_deployment_values_file_at_ref/
          # _classify_deployment_model_yaml in that job) -- it never defaults
          # an unrecognized value to either model. This value directly
          # controls namespace deletion safety below, so re-verify it here
          # defensively too, and fail closed (never default/guess) if it is
          # ever anything else: that would mean the upstream matrix is
          # broken, not a case to paper over.
          if [ "$DEPLOYMENT_MODEL" != "legacyPair" ] && [ "$DEPLOYMENT_MODEL" != "singleRuntime" ]; then
            echo "FAIL: unrecognized deployment_model '${DEPLOYMENT_MODEL}' from the deletion matrix (expected exactly 'singleRuntime' or 'legacyPair')."
            echo "Refusing to guess or default this value -- it directly controls which namespace/Application this job targets for deletion. This indicates a bug in the upstream deletion matrix; investigate detect_changed_deployments before re-running."
            exit 1
          fi

          ARGOCD_NAMESPACE="argocd"

          # legacyPair mapping is retained here ONLY (not in the active
          # build/deploy job) because historical legacyPair resources that
          # may still need deletion used this exact naming:
          #   Application: goldengate-<deployment-id>
          #   namespace:   gg-<environment>-<deployment-id>
          if [ "$DEPLOYMENT_MODEL" = "singleRuntime" ]; then
            TARGET_NAMESPACE="goldengate-${ENVIRONMENT}"
            APP_SUFFIX="${DEPLOYMENT_ID#gg-}"
            ARGOCD_APP_NAME="goldengate-${ENVIRONMENT}-${APP_SUFFIX}"
          else
            TARGET_NAMESPACE="gg-${ENVIRONMENT}-${DEPLOYMENT_ID}"
            ARGOCD_APP_NAME="goldengate-${DEPLOYMENT_ID}"
          fi

          echo "ENVIRONMENT=${ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_MODEL=${DEPLOYMENT_MODEL}" >> "$GITHUB_ENV"
          echo "ARGOCD_NAMESPACE=${ARGOCD_NAMESPACE}" >> "$GITHUB_ENV"
          echo "ARGOCD_APP_NAME=${ARGOCD_APP_NAME}" >> "$GITHUB_ENV"
          echo "TARGET_NAMESPACE=${TARGET_NAMESPACE}" >> "$GITHUB_ENV"

          echo "Deletion target:"
          echo "Environment: ${ENVIRONMENT}"
          echo "Deployment ID: ${DEPLOYMENT_ID}"
          echo "Deployment model: ${DEPLOYMENT_MODEL}"
          echo "Argo CD Application: ${ARGOCD_APP_NAME}"
          echo "Target namespace: ${TARGET_NAMESPACE}"

      - name: Connect to EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          echo "Connecting to EKS using cross-account EKS deploy role:"
          echo "${EKS_DEPLOY_ROLE_ARN}"

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

          echo "Current kube context:"
          kubectl config current-context

      - name: Delete Argo CD Application
        shell: bash
        run: |
          set -euo pipefail

          if kubectl get application "$ARGOCD_APP_NAME" -n "$ARGOCD_NAMESPACE" >/dev/null 2>&1; then
            echo "Argo CD Application ${ARGOCD_APP_NAME} found. Deleting..."

            kubectl patch application "$ARGOCD_APP_NAME" \
              -n "$ARGOCD_NAMESPACE" \
              --type merge \
              -p '{"metadata":{"finalizers":["resources-finalizer.argocd.argoproj.io"]}}'

            kubectl delete application "$ARGOCD_APP_NAME" \
              -n "$ARGOCD_NAMESPACE" \
              --wait=true \
              --timeout=10m

            echo "Argo CD Application ${ARGOCD_APP_NAME} deleted."
            echo "Argo CD will cascade-delete its managed resources in ${TARGET_NAMESPACE}."
          else
            echo "Argo CD Application ${ARGOCD_APP_NAME} not found in namespace ${ARGOCD_NAMESPACE}. Nothing to delete."
          fi

      - name: Clean up remaining GoldenGate namespace if still present
        shell: bash
        run: |
          set -euo pipefail

          # HARD FAIL-SAFE (unconditional, checked before anything else,
          # regardless of deployment_model or namespace labels): a
          # singleRuntime release's TARGET_NAMESPACE is always the shared
          # goldengate-<environment> namespace. That namespace is never
          # created or owned by any individual runtime release/Application,
          # so it must never be deleted from here -- even if it happened to
          # carry matching-looking ownership labels. This check is
          # deliberately independent of DEPLOYMENT_MODEL: it triggers on the
          # namespace *value* itself, so it still protects the shared
          # namespace even if deployment_model were ever wrong/missing.
          if [ "$TARGET_NAMESPACE" = "goldengate-${ENVIRONMENT}" ]; then
            echo "Refusing to delete namespace ${TARGET_NAMESPACE}: this is the shared goldengate-${ENVIRONMENT} namespace, never owned by an individual deployment/Application. Namespace deletion is unconditionally skipped for singleRuntime deployments."
            exit 0
          fi

          # CreateNamespace=true only guarantees the namespace exists for
          # sync -- it is not a guaranteed cleanup mechanism on Application
          # deletion. This is a guarded fallback: it only deletes the
          # namespace when it still exists AND carries exactly the
          # ownership labels this deployment would have set, so it can
          # never touch a namespace it doesn't unambiguously own.
          if kubectl get namespace "$TARGET_NAMESPACE" >/dev/null 2>&1; then
            echo "Namespace ${TARGET_NAMESPACE} still exists after Argo CD Application deletion. Verifying ownership labels before cleanup..."

            APP_NAME_LABEL="$(kubectl get namespace "$TARGET_NAMESPACE" -o jsonpath='{.metadata.labels.app\.kubernetes\.io/name}' 2>/dev/null || true)"
            MANAGED_BY_LABEL="$(kubectl get namespace "$TARGET_NAMESPACE" -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}' 2>/dev/null || true)"
            ENV_LABEL="$(kubectl get namespace "$TARGET_NAMESPACE" -o jsonpath='{.metadata.labels.goldengate\.adcb/environment}' 2>/dev/null || true)"
            DEPLOYMENT_LABEL="$(kubectl get namespace "$TARGET_NAMESPACE" -o jsonpath='{.metadata.labels.goldengate\.adcb/deployment-id}' 2>/dev/null || true)"

            if [ "$APP_NAME_LABEL" = "goldengate" ] &&
               [ "$MANAGED_BY_LABEL" = "argocd" ] &&
               [ "$ENV_LABEL" = "$ENVIRONMENT" ] &&
               [ "$DEPLOYMENT_LABEL" = "$DEPLOYMENT_ID" ]; then
              echo "Namespace labels match expected GoldenGate ownership. Deleting namespace ${TARGET_NAMESPACE}..."
              kubectl delete namespace "$TARGET_NAMESPACE" --wait=true --timeout=10m
            else
              echo "Namespace ${TARGET_NAMESPACE} still exists but ownership labels do not match expected values."
              echo "app.kubernetes.io/name=${APP_NAME_LABEL}"
              echo "app.kubernetes.io/managed-by=${MANAGED_BY_LABEL}"
              echo "goldengate.adcb/environment=${ENV_LABEL}"
              echo "goldengate.adcb/deployment-id=${DEPLOYMENT_LABEL}"
              echo "Refusing to delete namespace automatically."
              exit 1
            fi
          else
            echo "Namespace ${TARGET_NAMESPACE} already removed."
          fi

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GoldenGate Argo CD Application Deletion Summary"
            echo ""
            echo "- Environment: \`${ENVIRONMENT}\`"
            echo "- Deployment ID: \`${DEPLOYMENT_ID}\`"
            echo "- Argo CD Application: \`${ARGOCD_APP_NAME}\` (namespace: \`${ARGOCD_NAMESPACE}\`)"
            echo "- Target namespace: \`${TARGET_NAMESPACE}\`"
            echo "- Delete requested: \`true\`"
            echo ""
            echo "Argo CD cascade deletion removes the Application-managed resources. The"
            echo "workflow also performs a guarded namespace cleanup only when the remaining"
            echo "namespace has the expected GoldenGate ownership labels."
          } >> "$GITHUB_STEP_SUMMARY"
