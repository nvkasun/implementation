name: "03 | PHASE | Argo CD Bootstrap & Acceptance"

# Called exclusively by 00-main-goldengate-orchestrator.yaml -- workflow_call only. Owns the single MAIN-orchestrated GoldenGate application deployment approval; every later mutation-capable phase remains transitively downstream of it.
on:
  workflow_call:
    inputs:
      selected_environment:
        required: true
        type: string
      effective_deploy:
        required: true
        type: string
      has_active_deployments:
        required: true
        type: string
      active_runtime_matrix:
        required: true
        type: string
      has_changes:
        required: true
        type: string
      deployment_matrix:
        required: true
        type: string
      has_deletions:
        required: true
        type: string
      deletion_matrix:
        required: true
        type: string
    outputs:
      selected_environment:
        value: ${{ jobs.phase_contract.outputs.selected_environment }}
      effective_deploy:
        value: ${{ jobs.phase_contract.outputs.effective_deploy }}
      has_active_deployments:
        value: ${{ jobs.phase_contract.outputs.has_active_deployments }}
      active_runtime_matrix:
        value: ${{ jobs.phase_contract.outputs.active_runtime_matrix }}
      has_changes:
        value: ${{ jobs.phase_contract.outputs.has_changes }}
      deployment_matrix:
        value: ${{ jobs.phase_contract.outputs.deployment_matrix }}
      has_deletions:
        value: ${{ jobs.phase_contract.outputs.has_deletions }}
      deletion_matrix:
        value: ${{ jobs.phase_contract.outputs.deletion_matrix }}

permissions:
  id-token: write
  contents: read

jobs:
  argocd_preflight:
    name: Classify Argo CD ownership safety (read-only)

    # Generic MAIN Desired-State Convergence Fix: hack/orchestration/argocd_state.py is now a pure OWNERSHIP-SAFETY classifier -- ABSENT (nothing installed yet) and OWNED (whatever currently exists is safely this repository's own Argo CD release, regardless of individual readiness/desired-state drift) both converge via reconcile_argocd below; BROKEN (foreign/ambiguous ownership, or a genuine inspection failure) fails closed right here, never auto-repaired. A DEPLOY is an end-to-end convergence operation, not merely a bootstrap: reconcile_argocd's own idempotent Helm reconciliation is what actually applies the current committed desired state (ecrTokenSync repositories, argocdServerIngress.enabled true<->false, image/tag, any future wrapper-chart resource) -- this preflight job never needs to learn a new resource name merely to keep permitting that reconciliation. This job never mutates the cluster -- it only runs hack/orchestration/argocd_state.py, which itself issues read-only `kubectl get` calls. Phase 2's own success is already guaranteed transitively (MAIN only calls Phase 3 after Phase 2 succeeds), so terraform_sync_once's result is no longer re-checked here directly.
    if: ${{ inputs.effective_deploy == 'true' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      state: ${{ steps.classify.outputs.state }}

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ inputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}

      - name: Install kubectl if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking/installing kubectl..."

          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL_VERSION="v1.35.0"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                KUBECTL_ARCH="amd64"
                ;;
              aarch64|arm64)
                KUBECTL_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for kubectl: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" -o /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

          kubectl version --client=true

      - name: Connect to EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

          echo "Current kube context:"
          kubectl config current-context

      - name: Classify Argo CD ownership safety
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          # A non-zero exit here is a classifier inspection error (API unreachable, permission denied, malformed JSON) -- never treated as ABSENT.
          if ! CLASSIFIER_OUTPUT="$(python3 hack/orchestration/argocd_state.py --environment "${GG_SELECTED_ENVIRONMENT}")"; then
            echo "FAIL: the Argo CD ownership classifier could not determine cluster state (inspection error, not ABSENT) -- see diagnostics above."
            exit 1
          fi

          echo "$CLASSIFIER_OUTPUT"

          STATE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<< "$CLASSIFIER_OUTPUT")"
          echo "Argo CD ownership-safety state: ${STATE}"
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"

          # ABSENT/OWNED both succeed here -- MAIN owns automatic reconciliation for both (see reconcile_argocd below), regardless of what individual desired-state drift 20-sub-argocd.yaml's own idempotent Helm reconciliation is about to converge. Only BROKEN is not auto-repaired: a genuine foreign/ambiguous ownership conflict, or an inspection failure, fails closed for investigation -- never a normal recovery path.
          if [ "$STATE" = "BROKEN" ]; then
            echo "FAIL: Argo CD ownership-safety state is BROKEN -- an unsafe or ambiguous condition that is not auto-repaired. Investigate the diagnostics above before re-running MAIN."
            exit 1
          fi

  goldengate_deploy_authorization:
    name: Authorize GoldenGate application deployment

    # Live Deployment Approval Topology Fix: the single, GoldenGate-owned protected-environment approval covering the entire end-to-end Deploy DAG that follows -- Argo CD reconciliation, Platform, Observability, the runtime matrix, replication, and the Monitor all run afterward as MAIN-orchestrated jobs/reusable workflow calls (orchestrated_by_main: true) and never create an approval of their own. Deliberately placed after Phase 2 (Terraform) and argocd_preflight so a human is never asked to authorize a deployment that Terraform already failed or that Argo CD classified as unsafe (argocd_preflight's own classify step already fails closed on BROKEN before this job can even be reached). Performs no AWS/Terraform/Kubernetes/Helm/ECR/Argo CD mutation of its own -- ubuntu-latest is sufficient because this job exists purely as a GitHub deployment-protection point, distinct from the corporate Terraform governance approval owned entirely by 10-sub-iam-secrets.yaml.
    needs:
      - argocd_preflight
    if: ${{ inputs.effective_deploy == 'true' && needs.argocd_preflight.result == 'success' }}

    runs-on: ubuntu-latest
    environment: ${{ inputs.selected_environment }}

    steps:
      - name: Record GoldenGate application deployment authorization
        shell: bash
        env:
          SELECTED_ENVIRONMENT: ${{ inputs.selected_environment }}
        run: |
          set -euo pipefail

          echo "GoldenGate application deployment authorized for environment ${SELECTED_ENVIRONMENT}."

  reconcile_argocd:
    name: Reconcile Argo CD desired state

    # Generic MAIN Desired-State Convergence Fix: MAIN ALWAYS reconciles Argo CD on Deploy whenever the preflight ownership classifier confirms it is safe to do so -- ABSENT (nothing installed yet) or OWNED (whatever currently exists is safely this repository's own release, no matter what individual desired-state drift exists). A DEPLOY is an end-to-end convergence operation, not only a bootstrap operation: 20-sub-argocd.yaml's own idempotent `helm upgrade --install` is what actually applies the current committed desired state, so this job never skips reconciliation merely because the preflight classifier found the installation superficially healthy-looking. argocd_preflight's own classify step already fails the job closed on BROKEN, so needs.argocd_preflight.result == 'success' alone already guarantees a non-BROKEN state; the explicit state check below is still listed for defense in depth and readability. Runs the reusable specialist workflow synchronously as part of this DAG -- never an asynchronous CLI/API dispatch or repository_dispatch trigger. 20-sub-argocd.yaml itself remains fully usable standalone; no standalone specialist workflow is a required recovery/upgrade path -- MAIN never tells an operator to run it separately to apply ordinary desired state. Live Deployment Approval Topology Fix: now also requires goldengate_deploy_authorization's own success -- the single GoldenGate application approval above -- so this reusable call runs already-authorized (orchestrated_by_main: true) and never opens a second approval of its own.
    needs:
      - argocd_preflight
      - goldengate_deploy_authorization
    if: ${{ inputs.effective_deploy == 'true' && needs.argocd_preflight.result == 'success' && needs.goldengate_deploy_authorization.result == 'success' && (needs.argocd_preflight.outputs.state == 'ABSENT' || needs.argocd_preflight.outputs.state == 'OWNED') }}

    uses: ./.github/workflows/20-sub-argocd.yaml
    secrets: inherit
    with:
      environment: ${{ inputs.selected_environment }}
      orchestrated_by_main: true

  validate_argocd_ready:
    name: Validate Argo CD is healthy (strict post-reconciliation acceptance)

    # always() overrides GitHub's default implicit skip-on-skipped-dependency behavior -- the explicit result checks below are what actually keep this fail-closed, exactly like validate_shared_secrets_once's established always()-plus-explicit-result pattern elsewhere in this workflow. reconcile_argocd is now applicable for every state argocd_preflight can succeed with (ABSENT/OWNED), so a plain needs.reconcile_argocd.result == 'success' is sufficient -- no per-state branching is needed here anymore. Generic MAIN Desired-State Convergence Fix: the strict exact-desired-state check happens entirely in the re-classification step below (hack/orchestration/argocd_acceptance.py), independent of which preflight state was observed.
    needs:
      - argocd_preflight
      - reconcile_argocd
    if: ${{ always() && inputs.effective_deploy == 'true' && needs.argocd_preflight.result == 'success' && needs.reconcile_argocd.result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ inputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}

      - name: Install kubectl if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking/installing kubectl..."

          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL_VERSION="v1.35.0"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                KUBECTL_ARCH="amd64"
                ;;
              aarch64|arm64)
                KUBECTL_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for kubectl: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" -o /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

          kubectl version --client=true

      - name: Connect to EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

          echo "Current kube context:"
          kubectl config current-context

      - name: Re-classify and require Argo CD to be exactly HEALTHY
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.1"

          # Generic MAIN Desired-State Convergence Fix: post-reconciliation acceptance is now a SEPARATE, strict classifier (hack/orchestration/argocd_acceptance.py) from the pre-reconciliation ownership-safety preflight (hack/orchestration/argocd_state.py) -- reconciliation success (the reusable workflow job returning) is never assumed to mean healthy; this independently re-inspects the live cluster against the full current desired-state contract (core readiness, ecr-token-sync identity, repository Secrets, and -- only when argocdServerIngress.enabled -- the exact Ingress contract, including AWS Load Balancer Controller readiness; symmetrically, a still-present Ingress after argocdServerIngress.enabled=false is itself a failure, proving true->false pruning genuinely completed).
          if ! CLASSIFIER_OUTPUT="$(python3 hack/orchestration/argocd_acceptance.py --environment "${GG_SELECTED_ENVIRONMENT}")"; then
            echo "FAIL: the Argo CD acceptance classifier could not determine cluster state (inspection error) during post-reconciliation validation."
            exit 1
          fi

          echo "$CLASSIFIER_OUTPUT"

          STATE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<< "$CLASSIFIER_OUTPUT")"

          if [ "$STATE" != "HEALTHY" ]; then
            echo "FAIL: Argo CD acceptance state is ${STATE}, expected HEALTHY after preflight/reconciliation. Refusing to proceed to the platform stage."
            exit 1
          fi

          echo "OK: Argo CD acceptance state is HEALTHY."

  phase_contract:
    name: "Phase 3 contract"

    # Reproduces the Phase 3 slice of MAIN final_validation's mode-aware contract -- if: always() so this phase never accidentally reports success merely because every Argo job was cleanly skipped (Validate mode).
    needs:
      - argocd_preflight
      - goldengate_deploy_authorization
      - reconcile_argocd
      - validate_argocd_ready
    if: always()

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      selected_environment: ${{ steps.contract.outputs.selected_environment }}
      effective_deploy: ${{ steps.contract.outputs.effective_deploy }}
      has_active_deployments: ${{ steps.contract.outputs.has_active_deployments }}
      active_runtime_matrix: ${{ steps.contract.outputs.active_runtime_matrix }}
      has_changes: ${{ steps.contract.outputs.has_changes }}
      deployment_matrix: ${{ steps.contract.outputs.deployment_matrix }}
      has_deletions: ${{ steps.contract.outputs.has_deletions }}
      deletion_matrix: ${{ steps.contract.outputs.deletion_matrix }}

    steps:
      - name: Validate the mode-aware Phase 3 success contract and relay outputs
        id: contract
        shell: bash
        env:
          EFFECTIVE_DEPLOY: ${{ inputs.effective_deploy }}
          RESULT_argocd_preflight: ${{ needs.argocd_preflight.result }}
          RESULT_goldengate_deploy_authorization: ${{ needs.goldengate_deploy_authorization.result }}
          RESULT_reconcile_argocd: ${{ needs.reconcile_argocd.result }}
          RESULT_validate_argocd_ready: ${{ needs.validate_argocd_ready.result }}
          OUT_selected_environment: ${{ inputs.selected_environment }}
          OUT_has_active_deployments: ${{ inputs.has_active_deployments }}
          OUT_active_runtime_matrix: ${{ inputs.active_runtime_matrix }}
          OUT_has_changes: ${{ inputs.has_changes }}
          OUT_deployment_matrix: ${{ inputs.deployment_matrix }}
          OUT_has_deletions: ${{ inputs.has_deletions }}
          OUT_deletion_matrix: ${{ inputs.deletion_matrix }}
        run: |
          set -euo pipefail

          echo "Resolved mode: effective_deploy=${EFFECTIVE_DEPLOY}"

          FAILED="false"

          require_success() {
            local job_name="$1"
            local result_var="RESULT_${job_name}"
            local result="${!result_var}"
            if [ "$result" != "success" ]; then
              echo "FAIL: required job '${job_name}' has result '${result}', expected 'success'."
              FAILED="true"
            else
              echo "OK: required job '${job_name}' succeeded."
            fi
          }

          allow_non_failure() {
            local job_name="$1"
            local result_var="RESULT_${job_name}"
            local result="${!result_var}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "FAIL: job '${job_name}' has result '${result}' -- not required in this mode, but a real failure/cancellation still blocks Phase 3."
              FAILED="true"
            else
              echo "OK: job '${job_name}' result '${result}' is acceptable in this mode."
            fi
          }

          if [ "$EFFECTIVE_DEPLOY" = "true" ]; then
            require_success argocd_preflight
            require_success goldengate_deploy_authorization
            require_success reconcile_argocd
            require_success validate_argocd_ready
          else
            allow_non_failure argocd_preflight
            allow_non_failure goldengate_deploy_authorization
            allow_non_failure reconcile_argocd
            allow_non_failure validate_argocd_ready
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "FAIL: Phase 3 | Argo CD Bootstrap & Acceptance did not complete successfully."
            exit 1
          fi

          echo ""
          echo "OK: Phase 3 | Argo CD Bootstrap & Acceptance succeeded."

          {
            echo "selected_environment=${OUT_selected_environment}"
            echo "effective_deploy=${EFFECTIVE_DEPLOY}"
            echo "has_active_deployments=${OUT_has_active_deployments}"
            echo "active_runtime_matrix=${OUT_active_runtime_matrix}"
            echo "has_changes=${OUT_has_changes}"
            echo "deployment_matrix=${OUT_deployment_matrix}"
            echo "has_deletions=${OUT_has_deletions}"
            echo "deletion_matrix=${OUT_deletion_matrix}"
          } >> "$GITHUB_OUTPUT"
