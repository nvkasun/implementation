name: "20 | SUB | Argo CD"

run-name: "SUB | Argo CD Helm build and deploy | ${{ inputs.environment }} | ran by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      # Live Deployment Approval Topology Fix: an internal workflow_call-only caller contract, never a workflow_dispatch input and never operator-facing -- literal boolean true means MAIN already obtained its own single goldengate_deploy_authorization approval and this reusable workflow must not open a second one; missing/false (including every direct standalone workflow_dispatch run, which cannot set this input at all) means standalone and the approval below still applies.
      orchestrated_by_main:
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# Environment identity is loaded via hack/goldengate-environment.py github-env after checkout, never duplicated here.
env:
  HELM_OCI_NAMESPACE: helm
  CHART_NAME: argocd
  HELM_CHART_PATH: helm/argocd
  ENVS_ROOT: envs

  ARGOCD_RELEASE_NAME: argocd

concurrency:
  group: argocd-helm-deploy-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Live Deployment Approval Topology Fix, MODE B (direct standalone workflow_dispatch): the one remaining protected-environment gate in this workflow. Skipped entirely when MAIN already authorized this run (orchestrated_by_main: true) -- MAIN's own goldengate_deploy_authorization job is the approval in that case, never this one.
  standalone_deploy_authorization:
    name: Authorize standalone Argo CD deployment

    if: ${{ inputs.orchestrated_by_main != true }}

    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Record standalone Argo CD deployment authorization
        shell: bash
        run: |
          set -euo pipefail

          echo "Standalone Argo CD deployment authorized for environment ${{ inputs.environment }}."

  build_publish_and_deploy:
    name: Build, publish, and deploy Argo CD Helm chart

    # always() lets a deliberately-skipped standalone_deploy_authorization (MAIN-orchestrated run) through without being treated as a failed dependency, while the explicit result check still fails closed on a real standalone run whose authorization failed, was cancelled, or was unexpectedly skipped.
    needs:
      - standalone_deploy_authorization
    if: ${{ always() && (inputs.orchestrated_by_main == true || needs.standalone_deploy_authorization.result == 'success') }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${{ inputs.environment }}" validate
          python3 hack/goldengate-environment.py --environment "${{ inputs.environment }}" github-env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}

      - name: Install Helm and kubectl if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking/installing Helm..."

          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.15.4"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                HELM_ARCH="amd64"
                ;;
              aarch64|arm64)
                HELM_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for Helm: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz" -o /tmp/helm.tar.gz
            tar -zxvf /tmp/helm.tar.gz -C /tmp
            sudo mv "/tmp/linux-${HELM_ARCH}/helm" /usr/local/bin/helm
            sudo chmod +x /usr/local/bin/helm
          fi

          helm version --short

          echo "Checking/installing kubectl..."

          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL_VERSION="v1.35.0"

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)
                KUBECTL_ARCH="amd64"
                ;;
              aarch64|arm64)
                KUBECTL_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture for kubectl: $ARCH"
                exit 1
                ;;
            esac

            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" -o /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

          kubectl version --client=true

      - name: Verify runner tools and AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "Checking required tools..."
          aws --version
          helm version --short
          kubectl version --client=true

          echo "Resolved environment identity summary:"
          echo "AWS_REGION=${AWS_REGION}"
          echo "ECR_ACCOUNT_ID=${ECR_ACCOUNT_ID}"
          echo "ECR_REGISTRY=${ECR_REGISTRY}"
          echo "WORKLOAD_ACCOUNT_ID=${WORKLOAD_ACCOUNT_ID}"
          echo "EKS_CLUSTER_NAME=${EKS_CLUSTER_NAME}"
          echo "EKS_CLUSTER_ARN=${EKS_CLUSTER_ARN}"

      - name: Prepare Argo CD deployment variables
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ inputs.environment }}"
          VALUES_FILE="${ENVS_ROOT}/${ENVIRONMENT}/argocd/values.yaml"
          CHART_VERSION="0.1.${{ github.run_number }}"
          HELM_ECR_REPOSITORY="${HELM_OCI_NAMESPACE}/${CHART_NAME}"
          HELM_PUSH_URL="oci://${ECR_REGISTRY}/${HELM_OCI_NAMESPACE}"
          HELM_CHART_REF="oci://${ECR_REGISTRY}/${HELM_ECR_REPOSITORY}"

          echo "ENVIRONMENT=${ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "VALUES_FILE=${VALUES_FILE}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${CHART_VERSION}" >> "$GITHUB_ENV"
          echo "HELM_ECR_REPOSITORY=${HELM_ECR_REPOSITORY}" >> "$GITHUB_ENV"
          echo "HELM_PUSH_URL=${HELM_PUSH_URL}" >> "$GITHUB_ENV"
          echo "HELM_CHART_REF=${HELM_CHART_REF}" >> "$GITHUB_ENV"

          echo "Prepared Argo CD deployment variables:"
          echo "ENVIRONMENT=${ENVIRONMENT}"
          echo "VALUES_FILE=${VALUES_FILE}"
          echo "CHART_VERSION=${CHART_VERSION}"
          echo "HELM_ECR_REPOSITORY=${HELM_ECR_REPOSITORY}"
          echo "HELM_PUSH_URL=${HELM_PUSH_URL}"
          echo "HELM_CHART_REF=${HELM_CHART_REF}"

      - name: Validate vendored Argo CD chart dependency
        shell: bash
        run: |
          set -euo pipefail

          VENDORED_CHART="${HELM_CHART_PATH}/charts/argo-cd"

          echo "Checking vendored dependency: ${VENDORED_CHART}"

          if [ ! -f "${VENDORED_CHART}/Chart.yaml" ]; then
            echo "Missing vendored Argo CD chart: ${VENDORED_CHART}/Chart.yaml"
            echo "This workflow only deploys from the local, file:// vendored"
            echo "dependency under ${VENDORED_CHART} -- it never fetches the"
            echo "argo-cd chart from a public Helm repository at build time."
            echo "Vendor the upstream chart into that path before re-running."
            exit 1
          fi

          VENDORED_VERSION="$(grep -E '^version:' "${VENDORED_CHART}/Chart.yaml" | awk '{print $2}')"
          echo "Vendored argo-cd chart version: ${VENDORED_VERSION}"

          echo "Confirming Chart.yaml declares a local file:// dependency..."
          grep -q 'repository: "file://charts/argo-cd"' "${HELM_CHART_PATH}/Chart.yaml" || {
            echo "${HELM_CHART_PATH}/Chart.yaml does not declare a file://charts/argo-cd dependency."
            exit 1
          }

          echo "Vendored dependency present and correctly declared."

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$HELM_CHART_PATH/Chart.yaml" ]; then
            echo "Missing Helm Chart.yaml: $HELM_CHART_PATH/Chart.yaml"
            exit 1
          fi

          if [ ! -f "$HELM_CHART_PATH/values.yaml" ]; then
            echo "Missing Helm values.yaml: $HELM_CHART_PATH/values.yaml"
            exit 1
          fi

          if [ ! -f "$VALUES_FILE" ]; then
            echo "Missing environment values file: $VALUES_FILE"
            echo "Create: envs/${ENVIRONMENT}/argocd/values.yaml"
            exit 1
          fi

          echo "Required files are present."
          echo "Helm chart path: $HELM_CHART_PATH"
          echo "Environment values: $VALUES_FILE"

      - name: Validate Argo CD ECR read IAM policy covers all four Helm OCI repositories
        shell: bash
        run: |
          set -euo pipefail

          # Static check (no AWS calls) that the ECR read policy grants pull access via an exact ARN match per repository, not a wildcard. Folder name follows the generator's policy_folder = "argocd-ecr-oci-read-<environment>" naming contract (hack/goldengate-environment.py _IRSA_ROLE_FOLDERS) -- never a second hardcoded environment literal.
          POLICY_FILE="envs/${GG_ENVIRONMENT}/policies/argocd-ecr-oci-read-${GG_ENVIRONMENT}/policies/policies_1.json"

          if [ ! -f "$POLICY_FILE" ]; then
            echo "FAIL: missing IAM policy file: ${POLICY_FILE}"
            exit 1
          fi

          python3 - "$POLICY_FILE" "$AWS_REGION" "$ECR_ACCOUNT_ID" <<'PYEOF'
          import json
          import sys

          policy_file, region, ecr_account_id = sys.argv[1:4]
          with open(policy_file) as f:
              policy = json.load(f)

          required_actions = {
              "ecr:BatchCheckLayerAvailability",
              "ecr:BatchGetImage",
              "ecr:GetDownloadUrlForLayer",
              "ecr:DescribeImages",
              "ecr:DescribeRepositories",
          }
          # Derived from the canonical AWS_REGION/ECR_ACCOUNT_ID (never a second hardcoded account/region) plus the application's own repository names.
          expected_repos = {
              name: f"arn:aws:ecr:{region}:{ecr_account_id}:repository/{name}"
              for name in (
                  "helm/goldengate",
                  "helm/goldengate-monitor",
                  "helm/goldengate-platform",
                  "helm/amazon-cloudwatch-observability",
              )
          }

          statements = policy.get("Statement", [])
          found_arns = set()
          for stmt in statements:
              resource = stmt.get("Resource")
              resources = resource if isinstance(resource, list) else [resource]
              actions = stmt.get("Action")
              actions = set(actions if isinstance(actions, list) else [actions])
              for r in resources:
                  if r in expected_repos.values():
                      found_arns.add(r)
                      if not required_actions.issubset(actions):
                          missing = required_actions - actions
                          print(f"FAIL: statement for {r} is missing actions: {sorted(missing)}")
                          sys.exit(1)
                      if r == "*" or r.endswith("/*"):
                          print(f"FAIL: statement for {r} uses a wildcard resource -- must be an exact repository ARN.")
                          sys.exit(1)

          missing_repos = set(expected_repos.values()) - found_arns
          if missing_repos:
              print(f"FAIL: IAM policy is missing a statement for: {sorted(missing_repos)}")
              sys.exit(1)

          for repo, arn in expected_repos.items():
              print(f"OK: {repo} -> {arn} present with required actions.")

          print(f"OK: {policy_file} grants exactly the four expected repository ARNs, no wildcards.")
          PYEOF

      - name: Login Helm to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Ensure Helm ECR repository exists
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking/creating ECR repository: ${HELM_ECR_REPOSITORY}"

          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$HELM_ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --region "$AWS_REGION" \
            --repository-name "$HELM_ECR_REPOSITORY" \
            --tags Key=ApplicationName,Value=CloudFactory Key=DataClassification,Value=General Key=BusinessCriticality,Value=Low Key=BusinessUnit,Value=TechnologyPlatform Key=CostCenter,Value=219 \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE

      - name: Build Helm dependencies if required
        shell: bash
        run: |
          set -euo pipefail

          helm dependency build "$HELM_CHART_PATH" || true

      - name: Helm lint Argo CD chart
        shell: bash
        run: |
          set -euo pipefail

          helm lint "$HELM_CHART_PATH" \
            --values "$VALUES_FILE" \
            --set-string argo-cd.global.image.repository="${ECR_REGISTRY}/aws-cloud-factory-infra-argocd" \
            --set-string argo-cd.redis.image.repository="${ECR_REGISTRY}/aws-cloud-factory-infra-redis-alpine" \
            --set-string ecrTokenSync.roleArn="${ARGOCD_ECR_READ_ROLE_ARN}" \
            --set-string ecrTokenSync.awsRegion="${AWS_REGION}" \
            --set-string ecrTokenSync.ecrRegistry="${ECR_REGISTRY}" \
            --set-string ecrTokenSync.image.repository="${ECR_REGISTRY}/aws-cloud-factory-infra-aws-kubectl" \
            --set-string argocdServerIngress.host="${ARGOCD_HOST}" \
            --set-string argocdServerIngress.groupName="${ALB_GROUP_NAME}" \
            --set-string argocdServerIngress.certificateArn="${ACM_CERTIFICATE_ARN}"

      - name: Render Argo CD manifests for validation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p rendered

          helm template "$ARGOCD_RELEASE_NAME" "$HELM_CHART_PATH" \
            --namespace "$ARGOCD_NAMESPACE" \
            --values "$VALUES_FILE" \
            --set-string argo-cd.global.image.repository="${ECR_REGISTRY}/aws-cloud-factory-infra-argocd" \
            --set-string argo-cd.redis.image.repository="${ECR_REGISTRY}/aws-cloud-factory-infra-redis-alpine" \
            --set-string ecrTokenSync.roleArn="${ARGOCD_ECR_READ_ROLE_ARN}" \
            --set-string ecrTokenSync.awsRegion="${AWS_REGION}" \
            --set-string ecrTokenSync.ecrRegistry="${ECR_REGISTRY}" \
            --set-string ecrTokenSync.image.repository="${ECR_REGISTRY}/aws-cloud-factory-infra-aws-kubectl" \
            --set-string argocdServerIngress.host="${ARGOCD_HOST}" \
            --set-string argocdServerIngress.groupName="${ALB_GROUP_NAME}" \
            --set-string argocdServerIngress.certificateArn="${ACM_CERTIFICATE_ARN}" \
            > "rendered/${ARGOCD_RELEASE_NAME}.yaml"

          echo "Rendered manifest: rendered/${ARGOCD_RELEASE_NAME}.yaml"

      - name: Validate ECR token sync resources are rendered
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${ARGOCD_RELEASE_NAME}.yaml"

          echo "Checking rendered manifest for ECR token sync resources: ${RENDERED}"

          ECR_TOKEN_SYNC_TAG="$(python3 -c "import yaml; print(yaml.safe_load(open('${VALUES_FILE}'))['ecrTokenSync']['image']['tag'])")"

          # Fails before package/push/deploy if the CronJob, its RBAC, IRSA annotation, or pinned image are missing from the rendered chart.
          grep -q "kind: CronJob" "$RENDERED"
          grep -q "name: argocd-ecr-token-sync" "$RENDERED"
          grep -q "eks.amazonaws.com/role-arn: ${ARGOCD_ECR_READ_ROLE_ARN}" "$RENDERED"
          grep -q "${ECR_REGISTRY}/aws-cloud-factory-infra-aws-kubectl:${ECR_TOKEN_SYNC_TAG}" "$RENDERED"

          echo "Checking multi-repository token sync (all four GoldenGate/CloudWatch Observability Helm OCI repositories: goldengate, goldengate-monitor, goldengate-platform, amazon-cloudwatch-observability)..."

          # All four Helm OCI repository names must be baked into the rendered CronJob's bash arrays.
          grep -q 'helm/goldengate"' "$RENDERED"
          grep -q 'helm/goldengate-monitor"' "$RENDERED"
          grep -q 'helm/goldengate-platform"' "$RENDERED"
          grep -q 'helm/amazon-cloudwatch-observability"' "$RENDERED"

          # All four Argo CD repository Secret names must be baked in too.
          grep -q "argocd-ecr-goldengate-oci" "$RENDERED"
          grep -q "argocd-ecr-goldengate-monitor-oci" "$RENDERED"
          grep -q "argocd-ecr-goldengate-platform-oci" "$RENDERED"
          grep -q "argocd-ecr-amazon-cloudwatch-observability-oci" "$RENDERED"

          echo "Checking RBAC resourceNames includes all four repository Secrets, using the exact argocd-ecr-token-sync Role (not merely the first rendered Role -- the Argo CD wrapper chart renders many Role/ClusterRole objects for its own components)..."

          RBAC_SPLIT_DIR="$(mktemp -d)"
          awk -v outdir="$RBAC_SPLIT_DIR" '
            BEGIN { docnum = 0; fname = outdir "/doc-0.yaml" }
            /^---$/ { docnum++; fname = outdir "/doc-" docnum ".yaml"; next }
            { print > fname }
          ' "$RENDERED"

          RBAC_BLOCK=""
          for RBAC_DOC in "$RBAC_SPLIT_DIR"/doc-*.yaml; do
            if grep -q '^kind: Role$' "$RBAC_DOC" && grep -q '^  name: argocd-ecr-token-sync$' "$RBAC_DOC"; then
              RBAC_BLOCK="$(cat "$RBAC_DOC")"
              break
            fi
          done
          rm -rf "$RBAC_SPLIT_DIR"

          if [ -z "$RBAC_BLOCK" ]; then
            echo "FAIL: no rendered document has both kind: Role and metadata.name: argocd-ecr-token-sync."
            echo "Selecting the first rendered Role is unsafe -- it may belong to an unrelated Argo CD component instead of argocd-ecr-token-sync."
            exit 1
          fi

          echo "Explicitly verifying the extracted document..."

          if ! grep -Fq -- "kind: Role" <<< "$RBAC_BLOCK"; then
            echo "FAIL: extracted document is not kind: Role."
            exit 1
          fi
          if ! grep -Fq -- "  name: argocd-ecr-token-sync" <<< "$RBAC_BLOCK"; then
            echo "FAIL: extracted Role's metadata.name is not argocd-ecr-token-sync."
            exit 1
          fi
          if ! grep -Fq -- "argocd-ecr-goldengate-oci" <<< "$RBAC_BLOCK"; then
            echo "FAIL: Role resourceNames is missing argocd-ecr-goldengate-oci."
            exit 1
          fi
          if ! grep -Fq -- "argocd-ecr-goldengate-monitor-oci" <<< "$RBAC_BLOCK"; then
            echo "FAIL: Role resourceNames is missing argocd-ecr-goldengate-monitor-oci."
            exit 1
          fi
          if ! grep -Fq -- "argocd-ecr-goldengate-platform-oci" <<< "$RBAC_BLOCK"; then
            echo "FAIL: Role resourceNames is missing argocd-ecr-goldengate-platform-oci."
            exit 1
          fi
          if ! grep -Fq -- "argocd-ecr-amazon-cloudwatch-observability-oci" <<< "$RBAC_BLOCK"; then
            echo "FAIL: Role resourceNames is missing argocd-ecr-amazon-cloudwatch-observability-oci."
            exit 1
          fi
          if ! grep -Fq -- "- get" <<< "$RBAC_BLOCK"; then
            echo "FAIL: Role does not grant the get verb."
            exit 1
          fi
          if ! grep -Fq -- "- update" <<< "$RBAC_BLOCK"; then
            echo "FAIL: Role does not grant the update verb."
            exit 1
          fi
          if ! grep -Fq -- "- patch" <<< "$RBAC_BLOCK"; then
            echo "FAIL: Role does not grant the patch verb."
            exit 1
          fi
          if grep -Eq -- '^[[:space:]]*-[[:space:]]*(delete|list|watch)[[:space:]]*$' <<< "$RBAC_BLOCK"; then
            echo "FAIL: Role grants a forbidden verb (delete, list, or watch)."
            exit 1
          fi

          echo "OK: ServiceAccount/Role/RoleBinding/CronJob for ECR token sync are all present in the rendered manifest, covering all four repositories, using the existing ${ARGOCD_ECR_READ_ROLE_NAME} IRSA role. (The next step's public-registry scan covers every rendered image reference, including this CronJob's -- no new public image is introduced here.)"

      - name: Validate rendered Argo CD server Ingress
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${ARGOCD_RELEASE_NAME}.yaml"

          # Structural YAML validation (never a fragile grep chain) of a multi-field resource. Environment-specific identity (host/group name/certificate ARN) comes from the canonical environment resolver (already loaded into $ARGOCD_HOST/$ALB_GROUP_NAME/$ACM_CERTIFICATE_ARN); every other expected value is read directly from the committed application-constant contract in $VALUES_FILE, never a second, independently hardcoded literal in this script.
          python3 - "$RENDERED" "$VALUES_FILE" "$ARGOCD_NAMESPACE" "$ARGOCD_HOST" "$ALB_GROUP_NAME" "$ACM_CERTIFICATE_ARN" <<'PYEOF'
          import sys
          import yaml

          rendered_path, values_path, expected_namespace, expected_host, expected_group_name, expected_cert_arn = sys.argv[1:7]

          with open(rendered_path) as f:
              docs = [d for d in yaml.safe_load_all(f) if d]

          with open(values_path) as f:
              ingress_values = (yaml.safe_load(f) or {}).get("argocdServerIngress") or {}

          if not ingress_values.get("enabled"):
              print(f"argocdServerIngress.enabled is not true in {values_path}. Skipping rendered Ingress validation.")
              sys.exit(0)

          def expect(actual, expected, label):
              if actual != expected:
                  sys.exit(f"FAIL: {label} is {actual!r}, expected {expected!r}")
              print(f"OK: {label} == {expected!r}")

          ingresses = [d for d in docs if d.get("kind") == "Ingress" and (d.get("metadata") or {}).get("name") == "argocd-server-ingress"]
          if len(ingresses) != 1:
              sys.exit(f"FAIL: expected exactly 1 rendered Ingress named argocd-server-ingress, found {len(ingresses)}.")
          ingress = ingresses[0]
          print("OK: exactly 1 rendered Ingress named argocd-server-ingress.")

          metadata = ingress.get("metadata") or {}
          expect(metadata.get("namespace"), expected_namespace, "metadata.namespace")

          expected_ingress_class = ingress_values.get("ingressClassName") or "alb"
          spec = ingress.get("spec") or {}
          expect(spec.get("ingressClassName"), expected_ingress_class, "spec.ingressClassName")

          rules = spec.get("rules") or []
          if len(rules) != 1:
              sys.exit(f"FAIL: expected exactly 1 rendered rule, found {len(rules)}.")
          expect(rules[0].get("host"), expected_host, "spec.rules[0].host")

          paths = ((rules[0].get("http") or {}).get("paths")) or []
          if len(paths) != 1:
              sys.exit(f"FAIL: expected exactly 1 rendered path, found {len(paths)}.")
          backend_service = ((paths[0].get("backend") or {}).get("service")) or {}
          expected_service_name = ingress_values.get("serviceName") or "argocd-server"
          expected_service_port = ingress_values.get("servicePort")
          if expected_service_port is None:
              expected_service_port = 443
          expect(backend_service.get("name"), expected_service_name, "backend service name")
          expect((backend_service.get("port") or {}).get("number"), expected_service_port, "backend service port")

          annotations = metadata.get("annotations") or {}
          expect(annotations.get("alb.ingress.kubernetes.io/group.name"), expected_group_name, "annotations[group.name]")
          expected_group_order = ingress_values.get("groupOrder")
          if expected_group_order is not None:
              expect(annotations.get("alb.ingress.kubernetes.io/group.order"), str(expected_group_order), "annotations[group.order]")
          expect(annotations.get("alb.ingress.kubernetes.io/certificate-arn"), expected_cert_arn, "annotations[certificate-arn]")

          for annotation_key, values_key in (
              ("alb.ingress.kubernetes.io/listen-ports", "listenPorts"),
              ("alb.ingress.kubernetes.io/target-type", "targetType"),
              ("alb.ingress.kubernetes.io/backend-protocol", "backendProtocol"),
              ("alb.ingress.kubernetes.io/healthcheck-protocol", "healthcheckProtocol"),
              ("alb.ingress.kubernetes.io/healthcheck-path", "healthcheckPath"),
              ("alb.ingress.kubernetes.io/healthcheck-port", "healthcheckPort"),
          ):
              expected_value = ingress_values.get(values_key)
              if expected_value:
                  expect(annotations.get(annotation_key), str(expected_value), f"annotations[{values_key}]")

          # Standalone resident anchor: this Ingress must own the ALB scheme. A shared-mode Ingress must NOT carry this annotation at all -- never asserted in that mode.
          if ingress_values.get("mode") == "standalone":
              expected_scheme = ingress_values.get("scheme")
              if expected_scheme:
                  expect(annotations.get("alb.ingress.kubernetes.io/scheme"), expected_scheme, "annotations[scheme] (standalone resident anchor)")

          print("OK: rendered Argo CD server Ingress passed every structural/contract check.")
          PYEOF

      - name: Extract and validate rendered image references
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${ARGOCD_RELEASE_NAME}.yaml"

          echo "Extracting rendered image references..."

          IMAGES="$(grep -E '^[[:space:]]*image:[[:space:]]*\S' "$RENDERED" | sed -E 's/^[[:space:]]*image:[[:space:]]*//' | tr -d "\"'" | sort -u)"

          if [ -z "$IMAGES" ]; then
            echo "No image references found in rendered manifest. This is unexpected -- failing."
            exit 1
          fi

          echo "Rendered image references:"
          echo "$IMAGES"

          echo ""
          echo "Checking for public container registries..."

          PUBLIC_REGISTRIES='quay\.io|ghcr\.io|docker\.io|public\.ecr\.aws|registry\.k8s\.io|gcr\.io|k8s\.gcr\.io'

          if echo "$IMAGES" | grep -Ei "$PUBLIC_REGISTRIES" >/dev/null; then
            echo "One or more rendered images reference a public registry:"
            echo "$IMAGES" | grep -Ei "$PUBLIC_REGISTRIES"
            echo ""
            echo "This EKS cluster has no public internet access. Every runtime"
            echo "image must be mirrored to private ECR and referenced from there."
            exit 1
          fi

          echo "OK: no public registry references found."

          echo ""
          echo "Checking for unresolved placeholder values..."

          if echo "$IMAGES" | grep -E '<[A-Z_][A-Z0-9_]*>' >/dev/null; then
            echo "One or more rendered images still contain an unresolved placeholder:"
            echo "$IMAGES" | grep -E '<[A-Z_][A-Z0-9_]*>'
            echo ""
            echo "Replace the placeholder tag(s) above in envs/${ENVIRONMENT}/argocd/values.yaml"
            echo "with a real, approved image tag that has been mirrored to private ECR,"
            echo "then re-run this workflow."
            exit 1
          fi

          echo "OK: no placeholder values found."

      - name: Package Argo CD Helm chart
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p packaged

          helm package "$HELM_CHART_PATH" \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            --destination packaged

          ls -lrt packaged

      - name: Push Argo CD Helm chart to ECR as OCI artifact
        shell: bash
        run: |
          set -euo pipefail

          helm push "packaged/${CHART_NAME}-${CHART_VERSION}.tgz" "$HELM_PUSH_URL"

          echo "Published Helm chart:"
          echo "${HELM_CHART_REF}:${CHART_VERSION}"

      - name: Verify Helm chart can be pulled from ECR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pulled

          helm pull "$HELM_CHART_REF" \
            --version "$CHART_VERSION" \
            --destination pulled

          ls -lrt pulled

      - name: Connect to EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          echo "Target EKS cluster name: ${EKS_CLUSTER_NAME}"
          echo "Target EKS cluster ARN: ${EKS_CLUSTER_ARN}"
          echo "Target EKS account ID: ${WORKLOAD_ACCOUNT_ID}"
          echo "Current AWS identity:"
          aws sts get-caller-identity

          echo "Connecting to EKS using cross-account EKS deploy role:"
          echo "${EKS_DEPLOY_ROLE_ARN}"

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

          echo "Current kube context:"
          kubectl config current-context
          kubectl version --client=true

          echo "Verifying EKS access without requiring the target namespace to exist yet..."

          echo "Checking permission to create namespaces..."
          kubectl auth can-i create namespace || true

          echo "Checking permission to read CustomResourceDefinitions..."
          kubectl auth can-i get customresourcedefinitions.apiextensions.k8s.io || true

      - name: Create argocd namespace if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Ensuring namespace exists: ${ARGOCD_NAMESPACE}"

          kubectl create namespace "${ARGOCD_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          echo "Labeling namespace: ${ARGOCD_NAMESPACE}"

          kubectl label namespace "${ARGOCD_NAMESPACE}" \
            app.kubernetes.io/name=argocd \
            app.kubernetes.io/managed-by=github-actions \
            goldengate.adcb/environment="${ENVIRONMENT}" \
            --overwrite

          kubectl get namespace "${ARGOCD_NAMESPACE}" --show-labels

      - name: Deploy Argo CD Helm release to EKS
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying Helm release..."
          echo "Release: ${ARGOCD_RELEASE_NAME}"
          echo "Namespace: ${ARGOCD_NAMESPACE}"
          echo "Chart: ${HELM_CHART_REF}"
          echo "Chart version: ${CHART_VERSION}"
          echo "Values: ${VALUES_FILE}"

          helm upgrade --install "$ARGOCD_RELEASE_NAME" "$HELM_CHART_REF" \
            --version "$CHART_VERSION" \
            --namespace "$ARGOCD_NAMESPACE" \
            --values "$VALUES_FILE" \
            --set-string argo-cd.global.image.repository="${ECR_REGISTRY}/aws-cloud-factory-infra-argocd" \
            --set-string argo-cd.redis.image.repository="${ECR_REGISTRY}/aws-cloud-factory-infra-redis-alpine" \
            --set-string ecrTokenSync.roleArn="${ARGOCD_ECR_READ_ROLE_ARN}" \
            --set-string ecrTokenSync.awsRegion="${AWS_REGION}" \
            --set-string ecrTokenSync.ecrRegistry="${ECR_REGISTRY}" \
            --set-string ecrTokenSync.image.repository="${ECR_REGISTRY}/aws-cloud-factory-infra-aws-kubectl" \
            --set-string argocdServerIngress.host="${ARGOCD_HOST}" \
            --set-string argocdServerIngress.groupName="${ALB_GROUP_NAME}" \
            --set-string argocdServerIngress.certificateArn="${ACM_CERTIFICATE_ARN}" \
            --wait \
            --atomic \
            --cleanup-on-fail \
            --timeout 15m

      - name: Wait for Argo CD pods to become ready
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Argo CD workload rollouts to complete..."

          kubectl rollout status deployment/argocd-server -n "$ARGOCD_NAMESPACE" --timeout=10m
          kubectl rollout status deployment/argocd-repo-server -n "$ARGOCD_NAMESPACE" --timeout=10m
          kubectl rollout status deployment/argocd-redis -n "$ARGOCD_NAMESPACE" --timeout=10m
          kubectl rollout status deployment/argocd-applicationset-controller -n "$ARGOCD_NAMESPACE" --timeout=10m
          kubectl rollout status deployment/argocd-notifications-controller -n "$ARGOCD_NAMESPACE" --timeout=10m
          kubectl rollout status statefulset/argocd-application-controller -n "$ARGOCD_NAMESPACE" --timeout=10m

          echo "Pods:"
          kubectl get pods -n "$ARGOCD_NAMESPACE"

          echo "Services:"
          kubectl get svc -n "$ARGOCD_NAMESPACE"

      - name: Verify Argo CD deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "Pods:"
          kubectl get pods -n "${ARGOCD_NAMESPACE}"

          echo ""
          echo "Services:"
          kubectl get svc -n "${ARGOCD_NAMESPACE}"

          echo ""
          echo "Deployments:"
          kubectl get deploy -n "${ARGOCD_NAMESPACE}"

          echo ""
          echo "StatefulSets:"
          kubectl get statefulset -n "${ARGOCD_NAMESPACE}"

          echo ""
          echo "Argo CD CRDs:"
          kubectl get crd | grep argoproj || true

          echo ""
          echo "ECR token sync resources:"
          # No "|| true": a missing resource here aborts the job under set -e instead of silently passing.
          kubectl get serviceaccount argocd-ecr-token-sync -n "${ARGOCD_NAMESPACE}"
          kubectl get role argocd-ecr-token-sync -n "${ARGOCD_NAMESPACE}"
          kubectl get rolebinding argocd-ecr-token-sync -n "${ARGOCD_NAMESPACE}"
          kubectl get cronjob argocd-ecr-token-sync -n "${ARGOCD_NAMESPACE}"

          echo ""
          echo "Helm values (ecrTokenSync section) for release ${ARGOCD_RELEASE_NAME}:"
          helm get values "${ARGOCD_RELEASE_NAME}" -n "${ARGOCD_NAMESPACE}" -a | grep -A40 ecrTokenSync || true

          echo ""
          echo "Helm manifest (ECR token sync resources) for release ${ARGOCD_RELEASE_NAME}:"
          helm get manifest "${ARGOCD_RELEASE_NAME}" -n "${ARGOCD_NAMESPACE}" | grep -n "argocd-ecr-token-sync" -A10 -B10 || true

          # Ingress/ALB readiness is verified separately, in the dedicated bounded "Wait for Argo CD server Ingress readiness" step below -- never merely "an Ingress with that name exists" here.

      - name: Wait for Argo CD server Ingress readiness (bounded)
        shell: bash
        run: |
          set -euo pipefail

          ARGOCD_INGRESS_ENABLED="false"
          if grep -A1 '^argocdServerIngress:' "$VALUES_FILE" | grep -q 'enabled: true'; then
            ARGOCD_INGRESS_ENABLED="true"
          fi

          if [ "$ARGOCD_INGRESS_ENABLED" != "true" ]; then
            echo "argocdServerIngress.enabled is not true in ${VALUES_FILE}. Skipping Argo CD server Ingress readiness wait."
            exit 0
          fi

          echo "argocdServerIngress.enabled is true in ${VALUES_FILE}. Waiting (bounded) for argocd-server-ingress to exist, carry the expected host, and receive a published AWS Load Balancer Controller address..."

          TIMEOUT_SECONDS=300
          INTERVAL_SECONDS=15
          ELAPSED=0
          LB_ADDRESS=""

          while [ "$ELAPSED" -lt "$TIMEOUT_SECONDS" ]; do
            if kubectl get ingress argocd-server-ingress -n "$ARGOCD_NAMESPACE" >/dev/null 2>&1; then
              ACTUAL_HOST="$(kubectl get ingress argocd-server-ingress -n "$ARGOCD_NAMESPACE" -o jsonpath='{.spec.rules[0].host}' 2>/dev/null || true)"
              if [ "$ACTUAL_HOST" != "$ARGOCD_HOST" ]; then
                echo "FAIL: argocd-server-ingress spec.rules[0].host is '${ACTUAL_HOST}', expected '${ARGOCD_HOST}'. This is a live desired-state mismatch, never a transient readiness gap -- refusing to wait further."
                kubectl get ingress argocd-server-ingress -n "$ARGOCD_NAMESPACE" -o wide || true
                exit 1
              fi

              LB_ADDRESS="$(kubectl get ingress argocd-server-ingress -n "$ARGOCD_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
              if [ -n "$LB_ADDRESS" ]; then
                echo "OK: argocd-server-ingress carries the expected host and has a published load-balancer address: ${LB_ADDRESS}"
                break
              fi
            fi

            echo "Not yet ready (elapsed ${ELAPSED}s/${TIMEOUT_SECONDS}s) -- waiting ${INTERVAL_SECONDS}s..."
            sleep "$INTERVAL_SECONDS"
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
          done

          if [ -z "$LB_ADDRESS" ]; then
            echo "FAIL: argocd-server-ingress did not receive a published load-balancer address from the AWS Load Balancer Controller within ${TIMEOUT_SECONDS}s."
            echo ""
            echo "Diagnostics:"
            kubectl get ingress argocd-server-ingress -n "$ARGOCD_NAMESPACE" -o wide || true
            echo ""
            kubectl describe ingress argocd-server-ingress -n "$ARGOCD_NAMESPACE" || true
            exit 1
          fi

          echo ""
          echo "Ingress:"
          kubectl get ingress argocd-server-ingress -n "$ARGOCD_NAMESPACE"
          echo ""
          echo "Ingress details:"
          kubectl describe ingress argocd-server-ingress -n "$ARGOCD_NAMESPACE"

      - name: Run immediate bounded ECR token-sync validation
        shell: bash
        run: |
          set -euo pipefail

          # run_attempt (not just run_id): reruns keep the same run_id but bump run_attempt, and failed validation Jobs are retained as evidence, so the name must not collide with one still retained.
          JOB_NAME="ecr-token-sync-verify-${{ github.run_id }}-${{ github.run_attempt }}"
          # Kubernetes Job names must be <=63 chars, lowercase alphanumeric/hyphen.
          JOB_NAME="$(echo "$JOB_NAME" | tr '[:upper:]' '[:lower:]' | cut -c1-63 | sed -E 's/-+$//')"

          echo "Creating one-off Job ${JOB_NAME} from cronjob/argocd-ecr-token-sync in namespace ${ARGOCD_NAMESPACE}..."
          # Triggers a bounded Job now instead of waiting for the CronJob's own schedule; reuses the CronJob's in-cluster IRSA script, no ECR password from GitHub Actions.
          kubectl create job "$JOB_NAME" \
            --from=cronjob/argocd-ecr-token-sync \
            -n "$ARGOCD_NAMESPACE"

          echo "Waiting (bounded) for Job ${JOB_NAME} to finish..."
          TIMEOUT_SECONDS=180
          INTERVAL_SECONDS=10
          ELAPSED=0
          JOB_RESULT=""

          while [ "$ELAPSED" -lt "$TIMEOUT_SECONDS" ]; do
            SUCCEEDED="$(kubectl get job "$JOB_NAME" -n "$ARGOCD_NAMESPACE" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
            FAILED="$(kubectl get job "$JOB_NAME" -n "$ARGOCD_NAMESPACE" -o jsonpath='{.status.failed}' 2>/dev/null || true)"

            if [ "${SUCCEEDED:-0}" -ge 1 ] 2>/dev/null; then
              JOB_RESULT="succeeded"
              break
            fi
            if [ "${FAILED:-0}" -ge 1 ] 2>/dev/null; then
              JOB_RESULT="failed"
              break
            fi

            echo "[$(date -u +%H:%M:%S)] Job ${JOB_NAME} still running (elapsed ${ELAPSED}s / ${TIMEOUT_SECONDS}s)..."
            sleep "$INTERVAL_SECONDS"
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
          done

          if [ "$JOB_RESULT" != "succeeded" ]; then
            echo "FAIL: Job ${JOB_NAME} did not succeed within ${TIMEOUT_SECONDS}s (result: ${JOB_RESULT:-timeout})."
            echo "Job status (evidence retained -- the failed Job/Pod is deliberately NOT deleted):"
            kubectl get job "$JOB_NAME" -n "$ARGOCD_NAMESPACE" -o wide || true
            kubectl describe job "$JOB_NAME" -n "$ARGOCD_NAMESPACE" || true
            echo "Job logs:"
            kubectl logs "job/${JOB_NAME}" -n "$ARGOCD_NAMESPACE" --all-containers=true || true
            exit 1
          fi

          echo "Job ${JOB_NAME} completed successfully. Logs:"
          kubectl logs "job/${JOB_NAME}" -n "$ARGOCD_NAMESPACE" --all-containers=true || true

          echo "Verifying all four Argo CD repository Secrets exist with the expected label and URL..."

          verify_repo_secret() {
            local secret_name="$1"
            local expected_repo="$2"

            if ! kubectl get secret "$secret_name" -n "$ARGOCD_NAMESPACE" >/dev/null 2>&1; then
              echo "FAIL: Secret ${secret_name} does not exist in namespace ${ARGOCD_NAMESPACE}."
              exit 1
            fi

            local secret_type_label
            secret_type_label="$(kubectl get secret "$secret_name" -n "$ARGOCD_NAMESPACE" \
              -o jsonpath='{.metadata.labels.argocd\.argoproj\.io/secret-type}')"
            if [ "$secret_type_label" != "repository" ]; then
              echo "FAIL: Secret ${secret_name} is missing the argocd.argoproj.io/secret-type=repository label (got: ${secret_type_label:-<none>})."
              exit 1
            fi

            local actual_url
            actual_url="$(kubectl get secret "$secret_name" -n "$ARGOCD_NAMESPACE" \
              -o jsonpath='{.data.url}' | base64 --decode)"
            local expected_url="oci://${ECR_REGISTRY}/${expected_repo}"
            if [ "$actual_url" != "$expected_url" ]; then
              echo "FAIL: Secret ${secret_name} url mismatch. Expected ${expected_url}, got ${actual_url}."
              exit 1
            fi

            # Password is intentionally never read or printed here.
            echo "OK: Secret ${secret_name} exists, labeled repository, url=${actual_url}."
          }

          verify_repo_secret "argocd-ecr-goldengate-oci" "helm/goldengate"
          verify_repo_secret "argocd-ecr-goldengate-monitor-oci" "helm/goldengate-monitor"
          verify_repo_secret "argocd-ecr-goldengate-platform-oci" "helm/goldengate-platform"
          verify_repo_secret "argocd-ecr-amazon-cloudwatch-observability-oci" "helm/amazon-cloudwatch-observability"

          echo "Deleting one-off validation Job ${JOB_NAME} (validation succeeded)..."
          kubectl delete job "$JOB_NAME" -n "$ARGOCD_NAMESPACE" --wait=true --timeout=60s

          echo "OK: immediate bounded ECR token-sync validation passed for all four repositories."

      - name: Upload rendered manifests and chart package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argocd-helm-artifacts-${{ inputs.environment }}
          path: |
            rendered/
            packaged/
            pulled/
          if-no-files-found: warn
          retention-days: 7

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Argo CD EKS Helm Build and Deploy Summary"
            echo ""
            echo "### Deployment details"
            echo ""
            echo "- Environment: \`${ENVIRONMENT}\`"
            echo "- Namespace: \`${ARGOCD_NAMESPACE}\`"
            echo "- Helm release: \`${ARGOCD_RELEASE_NAME}\`"
            echo "- Values file: \`${VALUES_FILE}\`"
            echo ""
            echo "### Published Helm OCI chart"
            echo ""
            echo "- Chart ref: \`${HELM_CHART_REF:-not published}\`"
            echo "- Chart version: \`${CHART_VERSION:-unknown}\`"
            echo ""
            echo "### Validation commands"
            echo ""
            echo "\`\`\`bash"
            echo "kubectl get pods -n ${ARGOCD_NAMESPACE}"
            echo "kubectl get svc -n ${ARGOCD_NAMESPACE}"
            echo "kubectl get deploy -n ${ARGOCD_NAMESPACE}"
            echo "kubectl get statefulset -n ${ARGOCD_NAMESPACE}"
            echo "kubectl get crd | grep argoproj"
            echo "\`\`\`"
            echo ""
            echo "### Not configured yet"
            echo ""
            echo "This workflow only installs the Argo CD platform itself. It does NOT:"
            echo "- Configure any Git repository credentials (HTTPS/PAT or SSH) for Argo CD."
            echo "- Create any Argo CD Application or ApplicationSet resources (including for GoldenGate)."
            echo "- Expose Argo CD outside the cluster (server Service stays ClusterIP)."
            echo ""
            echo "Those are handled in a follow-up change."
          } >> "$GITHUB_STEP_SUMMARY"
