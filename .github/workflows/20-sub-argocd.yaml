name: "20 | SUB | Argo CD"

run-name: "SUB | Argo CD Helm build and deploy | ${{ inputs.environment }} | ran by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      # Live Deployment Approval Topology Fix: an internal workflow_call-only caller contract, never a workflow_dispatch input and never operator-facing -- literal boolean true means MAIN already obtained its own single goldengate_deploy_authorization approval and this reusable workflow must not open a second one; missing/false (including every direct standalone workflow_dispatch run, which cannot set this input at all) means standalone and the approval below still applies.
      orchestrated_by_main:
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: argocd-helm-deploy-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Live Deployment Approval Topology Fix, MODE B (direct standalone workflow_dispatch): the one remaining protected-environment gate in this workflow. Skipped entirely when MAIN already authorized this run (orchestrated_by_main: true) -- MAIN's own goldengate_deploy_authorization job is the approval in that case, never this one.
  standalone_deploy_authorization:
    name: Authorize standalone Argo CD deployment

    if: ${{ inputs.orchestrated_by_main != true }}

    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Record standalone Argo CD deployment authorization
        shell: bash
        run: |
          set -euo pipefail

          echo "Standalone Argo CD deployment authorized for environment ${{ inputs.environment }}."

  # Phase 3C | Build, Publish & Deploy Argo CD -- Phase 3 Python Conversion: every implementation step below is a thin call into automation/phases/phase3/phase3_argocd.py; the reusable workflow itself carries no large inline run: blocks. Local chart validation/packaging (steps before "Configure AWS credentials") never touches live AWS/Kubernetes; only the three explicitly-scoped steps after it receive live AWS credentials.
  build_publish_and_deploy:
    name: "Phase 3C | Build, Publish & Deploy Argo CD"

    # always() lets a deliberately-skipped standalone_deploy_authorization (MAIN-orchestrated run) through without being treated as a failed dependency, while the explicit result check still fails closed on a real standalone run whose authorization failed, was cancelled, or was unexpectedly skipped.
    needs:
      - standalone_deploy_authorization
    if: ${{ always() && (inputs.orchestrated_by_main == true || needs.standalone_deploy_authorization.result == 'success') }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ inputs.environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ inputs.environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure Helm and kubectl prerequisites
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase3/phase3_argocd.py ensure-deploy-tools

      - name: Prepare Argo CD deployment state
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase3/phase3_argocd.py prepare-deployment --environment "${{ inputs.environment }}"

      - name: Validate and package Argo CD locally
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase3/phase3_argocd.py validate-local --environment "${{ inputs.environment }}"

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/2 pattern -- these temporary credentials are consumed ONLY by the three steps below (via steps.aws_build_credentials.outputs.* in each step's own env:), never job-wide, never written to $GITHUB_ENV, never written to the Phase 3 state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Publish Argo CD chart to private ECR
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase3/phase3_argocd.py publish-chart --environment "${{ inputs.environment }}"

      - name: Reconcile Argo CD release in EKS
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase3/phase3_argocd.py reconcile-cluster --environment "${{ inputs.environment }}"

      - name: Run bounded post-deployment validation
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase3/phase3_argocd.py post-deploy-validation --environment "${{ inputs.environment }}"

      - name: Upload rendered manifests and chart package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argocd-helm-artifacts-${{ inputs.environment }}
          path: |
            rendered/
            packaged/
            pulled/
          if-no-files-found: warn
          retention-days: 7

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase3/phase3_argocd.py summary --environment "${{ inputs.environment }}"
