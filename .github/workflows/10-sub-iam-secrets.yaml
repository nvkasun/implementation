name: "10 | SUB | IAM & Secrets"
run-name: "SUB | Deploy IAM/Secrets for ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - dev

      terraform_version:
        required: false
        type: string
        default: "1.7.2"

      # Live Deploy Fix 5: mirrors MAIN's manual-only governance override inputs so this workflow's own standalone workflow_dispatch entrypoint (bypassing 00-main-goldengate-orchestrator.yaml's validate_model gate entirely) still exposes the corporate reusable workflow's officially supported break-glass mechanism safely and explicitly -- never enabled implicitly.
      terraform_governance_override:
        description: >
          Authorized Terraform governance break-glass override for the corporate
          reusable workflow. Leave false for normal execution.
        required: false
        type: boolean
        default: false

      terraform_governance_override_reason:
        description: >
          Required written justification when Terraform governance override is
          enabled.
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: "1.7.2"
      terraform_governance_override:
        required: false
        type: boolean
        default: false
      terraform_governance_override_reason:
        required: false
        type: string
        default: ""

permissions:
  id-token: write    # This is required for requesting the JWT
  contents: read     # This is required for actions/checkout
  packages: write    # Allow github.token to write packages
  pull-requests: read

jobs:
  validate_environment_config:
    name: Phase 2A | Validate AWS Application Prerequisites

    # Read-only, local-only, no AWS credentials -- a direct manual run of this workflow (bypassing 00-main-goldengate-orchestrator.yaml's own validate_model gate) must not be able to apply stale/hand-edited IAM policy JSON that is out of sync with envs/<environment>/environment.yaml. Business logic lives in automation/phases/phase2/phase2_prerequisites.py, which orchestrates -- never reimplements -- automation/goldengate-environment.py.
    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      aws_region: ${{ steps.phase2_outputs.outputs.aws_region }}
      terraform_governance_override: ${{ steps.phase2_outputs.outputs.terraform_governance_override }}
      terraform_governance_override_reason: ${{ steps.phase2_outputs.outputs.terraform_governance_override_reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase2/phase2_prerequisites.py prerequisites

      - name: Validate environment configuration
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          python3 automation/phases/phase2/phase2_prerequisites.py validate-environment

      - name: Verify generated IAM policies
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase2/phase2_prerequisites.py validate-iam-policies

      # The sole Terraform region source: envs/<environment>/environment.yaml via the canonical resolver, exposed as a job output for the apply job below -- never a second caller-supplied region input.
      - name: Resolve canonical Terraform region
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase2/phase2_prerequisites.py resolve-region

      # Live Deploy Fix 5: whether this job was reached via 00-main-goldengate-orchestrator.yaml's own validate_model derivation (workflow_call) or a direct standalone workflow_dispatch of this workflow, the received value is re-validated here before it ever reaches the corporate reusable workflow -- a claimed override=true without a real written reason is refused, defense-in-depth against a caller that skips its own validation.
      - name: Validate Terraform governance inputs
        shell: bash
        env:
          INPUT_OVERRIDE: ${{ inputs.terraform_governance_override }}
          INPUT_REASON: ${{ inputs.terraform_governance_override_reason }}
        run: |
          set -euo pipefail
          python3 automation/phases/phase2/phase2_prerequisites.py validate-governance

      - name: Publish canonical Phase 2 outputs
        id: phase2_outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase2/phase2_prerequisites.py publish-outputs

      - name: Phase 2A acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/phases/phase2/phase2_prerequisites.py acceptance

  apply:
    needs: validate_environment_config
    name: Phase 2B | Corporate Terraform Apply
    uses: AbuDhabiCommercialBank/adcb-reusable-workflows/.github/workflows/aws-terraform-apply.yaml@main
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      region: ${{ needs.validate_environment_config.outputs.aws_region }}
      terraform_version: ${{ inputs.terraform_version }}
      # Live Deploy Fix 5: maps to the corporate reusable workflow's EXACT, officially supported break-glass input names -- never an invented alternative name.
      override_noncompliance: ${{ needs.validate_environment_config.outputs.terraform_governance_override == 'true' }}
      override_reason: ${{ needs.validate_environment_config.outputs.terraform_governance_override_reason }}
