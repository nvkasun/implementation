name: "10 | SUB | IAM & Secrets"
run-name: "SUB | Deploy IAM/Secrets for ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - dev

      terraform_version:
        required: false
        type: string
        default: "1.7.2"

      # Live Deploy Fix 5: mirrors MAIN's manual-only governance override inputs so this workflow's own standalone workflow_dispatch entrypoint (bypassing 00-main-goldengate-orchestrator.yaml's validate_model gate entirely) still exposes the corporate reusable workflow's officially supported break-glass mechanism safely and explicitly -- never enabled implicitly.
      terraform_governance_override:
        description: >
          Authorized Terraform governance break-glass override for the corporate
          reusable workflow. Leave false for normal execution.
        required: false
        type: boolean
        default: false

      terraform_governance_override_reason:
        description: >
          Required written justification when Terraform governance override is
          enabled.
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: "1.7.2"
      terraform_governance_override:
        required: false
        type: boolean
        default: false
      terraform_governance_override_reason:
        required: false
        type: string
        default: ""

permissions:
  id-token: write    # This is required for requesting the JWT
  contents: read     # This is required for actions/checkout
  packages: write    # Allow github.token to write packages
  pull-requests: read

jobs:
  validate_environment_config:
    name: Validate environment config + generated IAM policy sync

    # Read-only, local-only, no AWS credentials -- a direct manual run of this workflow (bypassing 00-main-goldengate-orchestrator.yaml's own validate_model gate) must not be able to apply stale/hand-edited IAM policy JSON that is out of sync with envs/<environment>/environment.yaml.
    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      aws_region: ${{ steps.resolve_environment.outputs.aws_region }}
      terraform_governance_override: ${{ steps.governance.outputs.override }}
      terraform_governance_override_reason: ${{ steps.governance.outputs.reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate envs/<environment>/environment.yaml
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${TARGET_ENVIRONMENT}" validate

      - name: Verify generated IAM policies are in sync with environment.yaml
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${TARGET_ENVIRONMENT}" render-iam-policies --check

      # The sole Terraform region source: envs/<environment>/environment.yaml via the canonical resolver, exposed as a job output for the apply job below -- never a second caller-supplied region input.
      - name: Resolve canonical Terraform region
        id: resolve_environment
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          AWS_REGION="$(python3 automation/goldengate-environment.py --environment "${TARGET_ENVIRONMENT}" get AWS_REGION)"

          if [ -z "${AWS_REGION}" ]; then
            echo "FAIL: canonical AWS_REGION resolved empty for environment ${TARGET_ENVIRONMENT} from envs/${TARGET_ENVIRONMENT}/environment.yaml."
            exit 1
          fi

          echo "aws_region=${AWS_REGION}" >> "$GITHUB_OUTPUT"

      # Live Deploy Fix 5: whether this job was reached via 00-main-goldengate-orchestrator.yaml's own validate_model derivation (workflow_call) or a direct standalone workflow_dispatch of this workflow, the received value is re-validated here before it ever reaches the corporate reusable workflow -- a claimed override=true without a real written reason is refused, defense-in-depth against a caller that skips its own validation.
      - name: Validate the Terraform governance override inputs (fail closed)
        id: governance
        shell: bash
        env:
          INPUT_OVERRIDE: ${{ inputs.terraform_governance_override }}
          INPUT_REASON: ${{ inputs.terraform_governance_override_reason }}
        run: |
          set -euo pipefail

          if [ "$INPUT_OVERRIDE" != "true" ] && [ "$INPUT_OVERRIDE" != "false" ]; then
            echo "FAIL: terraform_governance_override resolved to '${INPUT_OVERRIDE}', expected literal 'true' or 'false'."
            exit 1
          fi

          TRIMMED_REASON="$(echo "$INPUT_REASON" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [ "$INPUT_OVERRIDE" = "true" ]; then
            if [ -z "$TRIMMED_REASON" ]; then
              echo "FAIL: terraform_governance_override=true requires a non-empty, non-whitespace terraform_governance_override_reason. Refusing to activate the corporate Terraform governance break-glass without a written justification."
              exit 1
            fi

            echo "override=true" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<GG_TF_GOVERNANCE_REASON_EOF"
              echo "$INPUT_REASON"
              echo "GG_TF_GOVERNANCE_REASON_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Terraform governance override is ENABLED for this run -- the corporate reusable workflow will receive override_noncompliance=true with the supplied override_reason. This is not a bypass: non-compliance remains recorded, and manual approval itself cannot be overridden."
          else
            echo "override=false" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
            echo "OK: Terraform governance override is disabled -- normal corporate PR-governance/Kosli attestation applies."
          fi

  apply:
    needs: validate_environment_config
    uses: AbuDhabiCommercialBank/adcb-reusable-workflows/.github/workflows/aws-terraform-apply.yaml@main
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      region: ${{ needs.validate_environment_config.outputs.aws_region }}
      terraform_version: ${{ inputs.terraform_version }}
      # Live Deploy Fix 5: maps to the corporate reusable workflow's EXACT, officially supported break-glass input names -- never an invented alternative name.
      override_noncompliance: ${{ needs.validate_environment_config.outputs.terraform_governance_override == 'true' }}
      override_reason: ${{ needs.validate_environment_config.outputs.terraform_governance_override_reason }}
