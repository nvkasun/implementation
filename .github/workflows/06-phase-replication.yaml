name: "06 | PHASE | Replication Reconciliation"

# Called exclusively by 00-main-goldengate-orchestrator.yaml -- workflow_call only. Both current real descriptors retain replication.enabled=false, so Deploy-mode reconciliation remains a safe successful no-op for the current PostgreSQL -> MSSQL pipeline.
on:
  workflow_call:
    inputs:
      selected_environment:
        required: true
        type: string
      effective_deploy:
        required: true
        type: string
      has_active_deployments:
        required: true
        type: string
    outputs:
      selected_environment:
        value: ${{ jobs.phase_contract.outputs.selected_environment }}
      effective_deploy:
        value: ${{ jobs.phase_contract.outputs.effective_deploy }}
      has_active_deployments:
        value: ${{ jobs.phase_contract.outputs.has_active_deployments }}

permissions:
  id-token: write
  contents: read

jobs:
  replication_reconcile_once:
    name: Reconcile GoldenGate replication pipelines (once, after all runtimes)

    # Phase 5's own success (validate_shared_secrets_once/build_publish_and_deploy/delete_removed_argocd_applications/validate_active_runtimes, including the active-runtime acceptance gate) is already guaranteed transitively -- MAIN only calls Phase 6 after Phase 1-5 succeed.
    if: ${{ inputs.effective_deploy == 'true' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Live Deploy Fix 4: JOB-LEVEL (not step-level) so every run: step in this job -- including "List enabled replication pipelines" and "Reconcile each enabled pipeline sequentially", which previously relied on an unbound raw reference -- can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ inputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}

      - name: Connect to EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

      - name: List enabled replication pipelines
        id: pipelines
        shell: bash
        run: |
          set -euo pipefail

          PIPELINES="$(python3 hack/goldengate-deployment-model.py --environment "${GG_SELECTED_ENVIRONMENT}" replication-pipelines)"
          if [ -z "$PIPELINES" ]; then
            echo "has_pipelines=false" >> "$GITHUB_OUTPUT"
            echo "No enabled replication pipelines."
          else
            echo "has_pipelines=true" >> "$GITHUB_OUTPUT"
            echo "Enabled replication pipelines:"
            echo "$PIPELINES"
          fi
          {
            echo "pipelines<<REPL_PIPELINES_EOF"
            echo "$PIPELINES"
            echo "REPL_PIPELINES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile each enabled pipeline sequentially (fail-fast)
        if: steps.pipelines.outputs.has_pipelines == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r pipeline_id; do
            [ -z "$pipeline_id" ] && continue
            echo "::group::Reconciling ${pipeline_id}"

            OUTDIR="work/replication/${pipeline_id}"
            mkdir -p "$OUTDIR"
            python3 hack/goldengate-replication.py render-job \
              --environment "${GG_SELECTED_ENVIRONMENT}" --region "${AWS_REGION}" --namespace "${RUNTIME_NAMESPACE}" \
              --execution-id "${{ github.run_id }}-${{ github.run_attempt }}" \
              --output-dir "$OUTDIR" "$pipeline_id"

            JOB_NAME="$(python3 -c "import yaml; print(yaml.safe_load(open('${OUTDIR}/job.yaml'))['metadata']['name'])")"

            kubectl apply -f "${OUTDIR}/secretproviderclass.yaml"
            kubectl apply -f "${OUTDIR}/configmap.yaml"
            kubectl apply -f "${OUTDIR}/job.yaml"

            if ! kubectl wait --for=condition=complete --timeout=600s "job/${JOB_NAME}" -n "${RUNTIME_NAMESPACE}"; then
              echo "FAIL: reconciliation Job ${JOB_NAME} for ${pipeline_id} did not complete successfully."
              echo "Sanitized Job logs (the worker never prints a mounted secret file):"
              kubectl logs "job/${JOB_NAME}" -n "${RUNTIME_NAMESPACE}" --all-containers || true
              echo "Job evidence retained for diagnosis: job/${JOB_NAME}, configmap/${JOB_NAME}, secretproviderclass/${JOB_NAME} in ${RUNTIME_NAMESPACE}."
              exit 1
            fi

            echo "Sanitized Job logs (the worker never prints a mounted secret file):"
            kubectl logs "job/${JOB_NAME}" -n "${RUNTIME_NAMESPACE}" --all-containers

            kubectl delete job "$JOB_NAME" -n "${RUNTIME_NAMESPACE}" --ignore-not-found
            kubectl delete configmap "$JOB_NAME" -n "${RUNTIME_NAMESPACE}" --ignore-not-found
            kubectl delete secretproviderclass "$JOB_NAME" -n "${RUNTIME_NAMESPACE}" --ignore-not-found
            echo "::endgroup::"
          done <<< "${{ steps.pipelines.outputs.pipelines }}"

      - name: No replication pipeline enabled
        if: steps.pipelines.outputs.has_pipelines == 'false'
        shell: bash
        run: |
          echo "No enabled replication pipeline -- clean no-op: no Job created, no existing runtime changed."

  replication_dry_run_validation:
    name: Validate GoldenGate replication manifests locally (deploy=false, no cluster mutation)

    if: ${{ inputs.effective_deploy == 'false' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Live Validate Fix 3: JOB-LEVEL (not step-level) so every run: step in this job -- not just "Load resolved environment config" itself -- can safely reference "$GG_SELECTED_ENVIRONMENT" under set -euo pipefail. A step-level env: binding is scoped to that one step only and does not propagate to later steps, which is exactly the "GG_SELECTED_ENVIRONMENT: unbound variable" defect the real VDR Validate run hit here.
    env:
      GG_SELECTED_ENVIRONMENT: ${{ inputs.selected_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load resolved environment config
        shell: bash
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${GG_SELECTED_ENVIRONMENT}" github-env >> "$GITHUB_ENV"

      - name: Validate the full replication schema and pipeline pairing (read-only)
        shell: bash
        run: |
          set -euo pipefail

          python3 hack/goldengate-deployment-model.py --environment "${GG_SELECTED_ENVIRONMENT}" validate

      - name: Render and validate replication manifests for every enabled pipeline (no cluster mutation)
        shell: bash
        run: |
          set -euo pipefail

          PIPELINES="$(python3 hack/goldengate-deployment-model.py --environment "${GG_SELECTED_ENVIRONMENT}" replication-pipelines)"
          if [ -z "$PIPELINES" ]; then
            echo "No enabled replication pipelines -- clean no-op."
            exit 0
          fi

          while IFS= read -r pipeline_id; do
            [ -z "$pipeline_id" ] && continue
            echo "::group::Validating ${pipeline_id}"

            OUTDIR="work/replication/${pipeline_id}"
            mkdir -p "$OUTDIR"
            python3 hack/goldengate-replication.py render-job \
              --environment "${GG_SELECTED_ENVIRONMENT}" --region "${AWS_REGION}" --namespace "${RUNTIME_NAMESPACE}" \
              --execution-id "dry-run" \
              --output-dir "$OUTDIR" "$pipeline_id"

            for manifest in secretproviderclass configmap job; do
              python3 -c "import yaml; yaml.safe_load(open('${OUTDIR}/${manifest}.yaml'))"
            done

            if grep -qE "^[[:space:]]*(aws_secret_access_key|password)[[:space:]]*:" "${OUTDIR}/configmap.yaml" "${OUTDIR}/job.yaml" "${OUTDIR}/secretproviderclass.yaml"; then
              echo "FAIL: a literal secret-like value was found in a rendered replication manifest for ${pipeline_id}."
              exit 1
            fi

            echo "OK: ${pipeline_id} replication manifests render and validate cleanly (no secret value, no cluster mutation)."
            echo "::endgroup::"
          done <<< "$PIPELINES"

  phase_contract:
    name: "Phase 6 contract"

    # Reproduces the Phase 6 slice of MAIN final_validation's mode-aware contract -- if: always() so this phase never accidentally reports success merely because the applicable job was cleanly skipped for the wrong reason.
    needs:
      - replication_reconcile_once
      - replication_dry_run_validation
    if: always()

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      selected_environment: ${{ steps.contract.outputs.selected_environment }}
      effective_deploy: ${{ steps.contract.outputs.effective_deploy }}
      has_active_deployments: ${{ steps.contract.outputs.has_active_deployments }}

    steps:
      - name: Validate the mode-aware Phase 6 success contract and relay outputs
        id: contract
        shell: bash
        env:
          EFFECTIVE_DEPLOY: ${{ inputs.effective_deploy }}
          HAS_ACTIVE_DEPLOYMENTS: ${{ inputs.has_active_deployments }}
          RESULT_replication_reconcile_once: ${{ needs.replication_reconcile_once.result }}
          RESULT_replication_dry_run_validation: ${{ needs.replication_dry_run_validation.result }}
          OUT_selected_environment: ${{ inputs.selected_environment }}
        run: |
          set -euo pipefail

          echo "Resolved mode: effective_deploy=${EFFECTIVE_DEPLOY} has_active_deployments=${HAS_ACTIVE_DEPLOYMENTS}"

          FAILED="false"

          require_success() {
            local job_name="$1"
            local result_var="RESULT_${job_name}"
            local result="${!result_var}"
            if [ "$result" != "success" ]; then
              echo "FAIL: required job '${job_name}' has result '${result}', expected 'success'."
              FAILED="true"
            else
              echo "OK: required job '${job_name}' succeeded."
            fi
          }

          allow_non_failure() {
            local job_name="$1"
            local result_var="RESULT_${job_name}"
            local result="${!result_var}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "FAIL: job '${job_name}' has result '${result}' -- not required in this mode, but a real failure/cancellation still blocks Phase 6."
              FAILED="true"
            else
              echo "OK: job '${job_name}' result '${result}' is acceptable in this mode."
            fi
          }

          if [ "$EFFECTIVE_DEPLOY" = "true" ]; then
            allow_non_failure replication_dry_run_validation
            if [ "$HAS_ACTIVE_DEPLOYMENTS" = "true" ]; then
              require_success replication_reconcile_once
            else
              allow_non_failure replication_reconcile_once
            fi
          else
            # Replication dry-run validates the global replication schema/pipeline model and must succeed even with zero active runtimes -- unconditionally required for every dry run.
            allow_non_failure replication_reconcile_once
            require_success replication_dry_run_validation
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "FAIL: Phase 6 | Replication Reconciliation did not complete successfully."
            exit 1
          fi

          echo ""
          echo "OK: Phase 6 | Replication Reconciliation succeeded."

          {
            echo "selected_environment=${OUT_selected_environment}"
            echo "effective_deploy=${EFFECTIVE_DEPLOY}"
            echo "has_active_deployments=${HAS_ACTIVE_DEPLOYMENTS}"
          } >> "$GITHUB_OUTPUT"
