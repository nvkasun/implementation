name: Goldengate platform deployment

run-name: "Cloud Factory - GoldenGate platform bootstrap build and deploy | ${{ github.event_name == 'workflow_dispatch' && format('manual dispatch (deploy={0})', inputs.deploy) || format('auto: platform changes on {0}', github.sha) }} | ran by ${{ github.actor }}"

# Manual-only (workflow_dispatch), deliberately with no push trigger. This
# enforces the required deployment order:
#   1. IAM Terraform apply (applies the extended trust policy on the
#      existing, proven GoldenGateSecretsReadRole-dev role -- see
#      envs/dev/policies/goldengate-secrets-read-dev/assume_role_policy/sts.json
#      -- this workflow's roleArn inputs would be invalid before this runs).
#   2. argocd-eks-deployment.yaml (provisions the
#      argocd-ecr-goldengate-platform-oci repository Secret this workflow's
#      "Confirm the platform Argo CD repository Secret exists" step
#      requires).
#   3. This workflow.
# A push trigger on helm/goldengate-platform/** or
# platform/dev/goldengate-platform/** could fire before steps 1-2 complete
# and fail (or worse, half-succeed) against a cluster/IAM state that isn't
# ready yet. Do not re-add a push trigger or workflow_run chaining without
# also solving that ordering problem.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev

      deploy:
        description: "Deploy to EKS after publishing the Helm chart"
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

  # ECR / runner account where the platform Helm OCI chart is pushed.
  ECR_ACCOUNT_ID: "229410149234"
  ECR_REGISTRY: 229410149234.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

  # Role used by GitHub Actions / CodeBuild runner.
  ROLE_ARN: ${{ vars.GOLDENGATE_AWS_ROLE_ARN }}

  # Target EKS cluster details.
  EKS_ACCOUNT_ID: ${{ vars.ACCOUNT_ID_DEV }}
  EKS_CLUSTER_NAME: ${{ vars.AWS_CLUSTER_NAME }}
  EKS_CLUSTER_ARN: ${{ vars.AWS_CLUSTER_ARN }}
  EKS_DEPLOY_ROLE_ARN: ${{ vars.EKS_DEPLOY_ROLE_ARN }}

  # IRSA role the in-cluster argocd-ecr-token-sync CronJob assumes to pull
  # the goldengate-platform Helm OCI chart. envs/dev/argocd/values.yaml
  # ecrTokenSync.repositories carries a "goldengate-platform" entry
  # (argocdRepositorySecretName: argocd-ecr-goldengate-platform-oci) so the
  # existing, generic ecr-token-sync-cronjob.yaml template (helm/argocd)
  # provisions and refreshes that Secret the same way it already does for
  # the goldengate and goldengate-monitor repositories -- no chart template
  # changes were required for that. This role, its trust policy, and its
  # ServiceAccount are unchanged by this workflow -- see
  # envs/dev/policies/argocd-ecr-oci-read-dev/.
  ARGOCD_ECR_READ_ROLE_ARN: arn:aws:iam::668311715351:role/GoldenGateArgocdECRRead-dev

  HELM_OCI_NAMESPACE: helm
  CHART_NAME: goldengate-platform
  HELM_CHART_PATH: helm/goldengate-platform
  ENVIRONMENT: dev
  VALUES_FILE: platform/dev/goldengate-platform/values.yaml

  RELEASE_NAME: goldengate-dev-platform
  ARGOCD_NAMESPACE: argocd
  ARGOCD_APP_NAME: goldengate-dev-platform
  ARGOCD_PLATFORM_SECRET_NAME: argocd-ecr-goldengate-platform-oci

  # Shared, engine-level runtime identities this chart is the single owner
  # of. Never used by an individual GoldenGate runtime release.
  RUNTIME_NAMESPACE: goldengate-dev
  ORACLE_SA_NAME: gg-oracle-sa
  POSTGRESQL_SA_NAME: gg-postgresql-sa

  # Phase 6A: the second namespace the Fluent Bit DaemonSet is permitted to
  # ship logs from (the shared monitor's namespace, owned by
  # helm/goldengate-monitor, never created or altered by this chart), and
  # the exact pre-created CloudWatch Logs destinations
  # (envs/dev/cloudwatch_logs.tf) it must write to.
  MONITOR_NAMESPACE: goldengate-monitoring
  FLUENT_BIT_RUNTIME_LOG_GROUP: /adcb/goldengate/dev/runtime
  FLUENT_BIT_MONITOR_LOG_GROUP: /adcb/goldengate/dev/monitor

  # Both ServiceAccounts use the shared GoldenGateSecretsReadRole-dev role
  # (also used by the shared monitor). See
  # envs/dev/policies/goldengate-secrets-read-dev/assume_role_policy/sts.json
  # for the extended trust (adds goldengate-dev:gg-oracle-sa and
  # goldengate-dev:gg-postgresql-sa alongside the untouched legacy
  # gg-dev-*:ogg-oracle-sa subject).
  #
  # Deterministic IRSA role ARN -- this repository has no Terraform
  # outputs.tf anywhere (every other role ARN referenced by these workflows,
  # e.g. ARGOCD_ECR_READ_ROLE_ARN above, is also a literal predicted ARN):
  # arn:aws:iam::<account>:role/<name>.
  ORACLE_RUNTIME_ROLE_ARN: arn:aws:iam::668311715351:role/GoldenGateSecretsReadRole-dev
  POSTGRESQL_RUNTIME_ROLE_ARN: arn:aws:iam::668311715351:role/GoldenGateSecretsReadRole-dev

  # Phase 6A: platform-level Fluent Bit DaemonSet (centralized container
  # logging). Dedicated least-privilege role -- see
  # envs/dev/policies/goldengate-platform-logging-dev/. Same deterministic
  # ARN-prediction pattern as the two role ARNs above (no Terraform
  # outputs.tf in this repository).
  FLUENT_BIT_ROLE_ARN: arn:aws:iam::668311715351:role/GoldenGatePlatformLoggingRole-dev
  FLUENT_BIT_SA_NAME: gg-fluent-bit

  # Phase 6A production-readiness correction: the private, immutable
  # digest-pinned Fluent Bit image reference. The official AWS-published
  # image was already mirrored into this account's own ECR repository
  # (aws-cloud-factory-fluent-bit) outside this workflow -- this workflow
  # never mirrors, copies, or writes an image, it only reads and verifies
  # the already-mirrored digest via the "Validate FLUENT_BIT_IMAGE format"
  # and "Private ECR digest preflight" steps below.
  FLUENT_BIT_ECR_REPOSITORY_EXPECTED: aws-cloud-factory-fluent-bit
  FLUENT_BIT_IMAGE_PREFIX_EXPECTED: "229410149234.dkr.ecr.eu-west-1.amazonaws.com/aws-cloud-factory-fluent-bit@"

concurrency:
  group: goldengate-platform-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Single job. This chart creates no container image of its own to
  # build/push (Namespaces, shared engine ServiceAccounts, and -- Phase
  # 6A -- the platform-level Fluent Bit DaemonSet with its supporting
  # RBAC/ConfigMap/ServiceAccount), so there is no separate image-build job
  # like goldengate-monitor.yaml's ensure_monitor_image. The Fluent Bit
  # container image itself is never built or copied here either: it is a
  # pre-mirrored, immutable digest reference read from the FLUENT_BIT_IMAGE
  # repository variable and verified read-only against the already-mirrored
  # private ECR repository (see "Validate FLUENT_BIT_IMAGE format" and
  # "Private ECR digest preflight for the Fluent Bit image" below). Runs on
  # the private CodeBuild runner, same as every other Helm/Argo CD
  # deployment job in this repository.
  # ---------------------------------------------------------------------
  package_publish_and_deploy:
    name: Build, publish, and deploy the GoldenGate platform bootstrap via Argo CD

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}

      - name: Install Helm and kubectl if missing
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.15.4"
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64) HELM_ARCH="amd64" ;;
              aarch64|arm64) HELM_ARCH="arm64" ;;
              *) echo "Unsupported architecture for Helm: $ARCH"; exit 1 ;;
            esac
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz" -o /tmp/helm.tar.gz
            tar -zxvf /tmp/helm.tar.gz -C /tmp
            sudo mv "/tmp/linux-${HELM_ARCH}/helm" /usr/local/bin/helm
            sudo chmod +x /usr/local/bin/helm
          fi
          helm version --short

          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL_VERSION="v1.35.0"
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64) KUBECTL_ARCH="amd64" ;;
              aarch64|arm64) KUBECTL_ARCH="arm64" ;;
              *) echo "Unsupported architecture for kubectl: $ARCH"; exit 1 ;;
            esac
            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" -o /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi
          kubectl version --client=true

      - name: Verify runner tools and AWS identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity
          aws --version
          helm version --short
          kubectl version --client=true

      - name: Validate FLUENT_BIT_IMAGE format
        shell: bash
        env:
          # Read through a step-level environment variable, per the
          # required correction -- never interpolated directly into a
          # shell statement, exactly like every other vars./secrets.
          # reference in this repository's workflows.
          FLUENT_BIT_IMAGE: ${{ vars.FLUENT_BIT_IMAGE }}
        run: |
          set -euo pipefail

          if [ -z "${FLUENT_BIT_IMAGE:-}" ]; then
            echo "FAIL: the FLUENT_BIT_IMAGE repository variable is not set."
            exit 1
          fi

          # Exact private, immutable digest reference only -- no tag
          # suffix, no public.ecr.aws, no other registry or repository.
          EXPECTED_PATTERN='^229410149234\.dkr\.ecr\.eu-west-1\.amazonaws\.com/aws-cloud-factory-fluent-bit@sha256:[a-f0-9]{64}$'
          if ! [[ "$FLUENT_BIT_IMAGE" =~ $EXPECTED_PATTERN ]]; then
            echo "FAIL: FLUENT_BIT_IMAGE does not match the required private immutable digest format."
            echo "Expected pattern: ${EXPECTED_PATTERN}"
            echo "Got: ${FLUENT_BIT_IMAGE}"
            exit 1
          fi
          if [[ "$FLUENT_BIT_IMAGE" == *public.ecr.aws* ]]; then
            echo "FAIL: FLUENT_BIT_IMAGE references public.ecr.aws -- the deployed image must be the private ECR mirror only."
            exit 1
          fi

          # Parsed from FLUENT_BIT_IMAGE itself -- never maintained as a
          # second, independently-editable deployment value that could
          # drift from the actual variable.
          FLUENT_BIT_ECR_DIGEST="${FLUENT_BIT_IMAGE#*@}"
          REGISTRY_AND_REPOSITORY="${FLUENT_BIT_IMAGE%@*}"
          FLUENT_BIT_ECR_REPOSITORY="${REGISTRY_AND_REPOSITORY#*/}"

          if [ "$FLUENT_BIT_ECR_REPOSITORY" != "$FLUENT_BIT_ECR_REPOSITORY_EXPECTED" ]; then
            echo "FAIL: FLUENT_BIT_IMAGE repository is ${FLUENT_BIT_ECR_REPOSITORY}, expected ${FLUENT_BIT_ECR_REPOSITORY_EXPECTED}."
            exit 1
          fi

          echo "FLUENT_BIT_IMAGE=${FLUENT_BIT_IMAGE}" >> "$GITHUB_ENV"
          echo "FLUENT_BIT_ECR_REPOSITORY=${FLUENT_BIT_ECR_REPOSITORY}" >> "$GITHUB_ENV"
          echo "FLUENT_BIT_ECR_DIGEST=${FLUENT_BIT_ECR_DIGEST}" >> "$GITHUB_ENV"

          echo "OK: FLUENT_BIT_IMAGE is a validly-formatted private immutable digest reference."
          echo "Repository: ${FLUENT_BIT_ECR_REPOSITORY}"
          echo "Digest:     ${FLUENT_BIT_ECR_DIGEST}"

      - name: Private ECR digest preflight for the Fluent Bit image
        shell: bash
        run: |
          set -euo pipefail

          CALLER_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$CALLER_ACCOUNT" != "$ECR_ACCOUNT_ID" ]; then
            echo "FAIL: AWS caller account is ${CALLER_ACCOUNT}, expected ${ECR_ACCOUNT_ID}."
            exit 1
          fi
          echo "OK: AWS caller account is ${ECR_ACCOUNT_ID}."

          # Read-only Describe call only -- no ECR write permission is used
          # or required, and this workflow never copies/mirrors the image
          # itself.
          if ! DESCRIBE_IMAGES_JSON="$(aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$FLUENT_BIT_ECR_REPOSITORY" \
              --image-ids imageDigest="$FLUENT_BIT_ECR_DIGEST" \
              --output json 2>/tmp/fluent-bit-describe-images-error.txt)"; then
            if grep -q "RepositoryNotFoundException" /tmp/fluent-bit-describe-images-error.txt; then
              echo "FAIL: private ECR repository ${FLUENT_BIT_ECR_REPOSITORY} was not found."
            elif grep -q "ImageNotFoundException" /tmp/fluent-bit-describe-images-error.txt; then
              echo "FAIL: digest ${FLUENT_BIT_ECR_DIGEST} was not found in repository ${FLUENT_BIT_ECR_REPOSITORY}."
            else
              echo "FAIL: aws ecr describe-images failed:"
              cat /tmp/fluent-bit-describe-images-error.txt
            fi
            exit 1
          fi

          RETURNED_DIGEST="$(echo "$DESCRIBE_IMAGES_JSON" | jq -r '.imageDetails[0].imageDigest // empty')"
          if [ "$RETURNED_DIGEST" != "$FLUENT_BIT_ECR_DIGEST" ]; then
            echo "FAIL: ECR returned digest ${RETURNED_DIGEST}, expected ${FLUENT_BIT_ECR_DIGEST}."
            exit 1
          fi

          echo "OK: verified digest ${FLUENT_BIT_ECR_DIGEST} exists in ${FLUENT_BIT_ECR_REPOSITORY} (account ${ECR_ACCOUNT_ID})."

      - name: Prepare platform deployment variables
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          CHART_VERSION="0.1.${{ github.run_number }}"
          TEMP_CHART_PATH="work/charts/goldengate-platform"
          HELM_ECR_REPOSITORY="${HELM_OCI_NAMESPACE}/${CHART_NAME}"
          HELM_PUSH_URL="oci://${ECR_REGISTRY}/${HELM_OCI_NAMESPACE}"
          HELM_CHART_REF="oci://${ECR_REGISTRY}/${HELM_ECR_REPOSITORY}"

          echo "CHART_VERSION=${CHART_VERSION}" >> "$GITHUB_ENV"
          echo "TEMP_CHART_PATH=${TEMP_CHART_PATH}" >> "$GITHUB_ENV"
          echo "HELM_ECR_REPOSITORY=${HELM_ECR_REPOSITORY}" >> "$GITHUB_ENV"
          echo "HELM_PUSH_URL=${HELM_PUSH_URL}" >> "$GITHUB_ENV"
          echo "HELM_CHART_REF=${HELM_CHART_REF}" >> "$GITHUB_ENV"

          echo "Chart version: ${CHART_VERSION}"
          echo "Helm chart ref: ${HELM_CHART_REF}"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          for f in "$HELM_CHART_PATH/Chart.yaml" "$HELM_CHART_PATH/values.yaml" "$VALUES_FILE"; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
          done
          echo "Required files are present."

      - name: Login Helm to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Ensure Helm ECR repository exists
        shell: bash
        run: |
          set -euo pipefail

          if aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$HELM_ECR_REPOSITORY" >/dev/null 2>&1; then
            echo "ECR repository already exists: $HELM_ECR_REPOSITORY"
          else
            echo "Creating ECR repository: $HELM_ECR_REPOSITORY"

            aws ecr create-repository \
              --region "$AWS_REGION" \
              --repository-name "$HELM_ECR_REPOSITORY" \
              --tags Key=ApplicationName,Value=CloudFactory Key=DataClassification,Value=General Key=BusinessCriticality,Value=Low Key=BusinessUnit,Value=TechnologyPlatform Key=CostCenter,Value=219 \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE >/dev/null

            echo "Created ECR repository: $HELM_ECR_REPOSITORY"
          fi

      - name: Ensure Helm ECR repository policy allows Argo CD pull
        shell: bash
        run: |
          set -euo pipefail

          ARGOCD_ECR_STATEMENT_SID="AllowArgocdEksRolePullGoldengatePlatformHelmChart"

          EXISTING_POLICY="$(aws ecr get-repository-policy \
            --region "$AWS_REGION" \
            --repository-name "$HELM_ECR_REPOSITORY" \
            --query policyText \
            --output text 2>/tmp/platform-helm-ecr-get-policy-error.txt)" || {
              if grep -q "RepositoryPolicyNotFoundException" /tmp/platform-helm-ecr-get-policy-error.txt; then
                echo "No existing repository policy found. Starting from an empty policy."
                EXISTING_POLICY='{"Version":"2012-10-17","Statement":[]}'
              else
                echo "Failed to read the existing ECR repository policy:"
                cat /tmp/platform-helm-ecr-get-policy-error.txt
                exit 1
              fi
            }

          echo "Merging in Sid ${ARGOCD_ECR_STATEMENT_SID} (existing statements are preserved)..."

          echo "$EXISTING_POLICY" | jq \
            --arg sid "$ARGOCD_ECR_STATEMENT_SID" \
            --arg roleArn "$ARGOCD_ECR_READ_ROLE_ARN" \
            '
            .Statement = ([.Statement[] | select(.Sid != $sid)]
              + [{
                  Sid: $sid,
                  Effect: "Allow",
                  Principal: { AWS: $roleArn },
                  Action: [
                    "ecr:BatchCheckLayerAvailability",
                    "ecr:BatchGetImage",
                    "ecr:GetDownloadUrlForLayer",
                    "ecr:DescribeImages",
                    "ecr:DescribeRepositories"
                  ]
                }])
            ' > /tmp/platform-helm-ecr-repository-policy.json

          aws ecr set-repository-policy \
            --region "$AWS_REGION" \
            --repository-name "$HELM_ECR_REPOSITORY" \
            --policy-text file:///tmp/platform-helm-ecr-repository-policy.json >/dev/null

          echo "ECR repository policy on ${HELM_ECR_REPOSITORY} now allows pull from ${ARGOCD_ECR_READ_ROLE_ARN}."

      - name: Helm lint platform chart
        shell: bash
        run: |
          set -euo pipefail

          helm lint "$HELM_CHART_PATH" \
            --values "$VALUES_FILE" \
            --set-string serviceAccounts.oracle.roleArn="$ORACLE_RUNTIME_ROLE_ARN" \
            --set-string serviceAccounts.postgresql.roleArn="$POSTGRESQL_RUNTIME_ROLE_ARN" \
            --set-string fluentBit.serviceAccount.roleArn="$FLUENT_BIT_ROLE_ARN" \
            --set-string fluentBit.aws.region="$AWS_REGION" \
            --set-string fluentBit.image.reference="$FLUENT_BIT_IMAGE"

      - name: Render platform manifest for validation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p rendered

          helm template "$RELEASE_NAME" "$HELM_CHART_PATH" \
            --values "$VALUES_FILE" \
            --set-string serviceAccounts.oracle.roleArn="$ORACLE_RUNTIME_ROLE_ARN" \
            --set-string serviceAccounts.postgresql.roleArn="$POSTGRESQL_RUNTIME_ROLE_ARN" \
            --set-string fluentBit.serviceAccount.roleArn="$FLUENT_BIT_ROLE_ARN" \
            --set-string fluentBit.aws.region="$AWS_REGION" \
            --set-string fluentBit.image.reference="$FLUENT_BIT_IMAGE" \
            > "rendered/${RELEASE_NAME}.yaml"

          echo "Rendered manifest: rendered/${RELEASE_NAME}.yaml"

      - name: Validate rendered platform manifest
        shell: bash
        run: |
          set -euo pipefail

          RENDERED="rendered/${RELEASE_NAME}.yaml"

          # Reusable, dependency-free (no yq/jq/PyYAML) exact-document
          # selector, same pattern as goldengate-monitor.yaml: splits the
          # multi-document rendered manifest on "---" and returns the one
          # document whose kind and metadata.name match exactly.
          select_document() {
            local rendered_file="$1"
            local expected_kind="$2"
            local expected_name="$3"
            local split_dir
            split_dir="$(mktemp -d)"
            awk -v outdir="$split_dir" '
              BEGIN { docnum = 0; fname = outdir "/doc-0.yaml" }
              /^---$/ { docnum++; fname = outdir "/doc-" docnum ".yaml"; next }
              { print > fname }
            ' "$rendered_file"

            local found=""
            local doc
            for doc in "$split_dir"/doc-*.yaml; do
              if grep -q "^kind: ${expected_kind}\$" "$doc" && grep -q "^  name: ${expected_name}\$" "$doc"; then
                found="$(cat "$doc")"
                break
              fi
            done
            rm -rf "$split_dir"
            printf '%s' "$found"
          }

          normalize_value() {
            local value="$1"
            value="${value//$'\r'/}"
            read -r value <<< "$value"
            if [[ "$value" == \"*\" && "$value" == *\" ]]; then
              value="${value#\"}"
              value="${value%\"}"
            elif [[ "$value" == \'*\' && "$value" == *\' ]]; then
              value="${value#\'}"
              value="${value%\'}"
            fi
            printf '%s' "$value"
          }

          echo "Validating exactly one Namespace document..."
          NAMESPACE_COUNT="$(grep -c '^kind: Namespace$' "$RENDERED")"
          if [ "$NAMESPACE_COUNT" -ne 1 ]; then
            echo "FAIL: expected exactly 1 rendered Namespace document, found ${NAMESPACE_COUNT}."
            exit 1
          fi

          RUNTIME_NS_BLOCK="$(select_document "$RENDERED" "Namespace" "${RUNTIME_NAMESPACE}")"
          if [ -z "$RUNTIME_NS_BLOCK" ]; then
            echo "FAIL: rendered Namespace ${RUNTIME_NAMESPACE} was not found."
            exit 1
          fi
          echo "OK: exactly 1 Namespace document, ${RUNTIME_NAMESPACE}."

          echo "Validating the shared namespace carries no per-runtime ownership label..."
          if grep -Fq -- "goldengate.adcb/deployment-id" <<< "$RUNTIME_NS_BLOCK"; then
            echo "FAIL: Namespace ${RUNTIME_NAMESPACE} carries a per-runtime ownership label (goldengate.adcb/deployment-id)."
            exit 1
          fi
          echo "OK: no per-runtime ownership label on the shared namespace."

          # Shared objects must be protected from Argo CD prune/cascading
          # deletion via Prune=false,Delete=false -- PruneLast=true alone
          # only affects prune *ordering*, it does not make an object
          # unprunable/undeletable.
          assert_deletion_protected() {
            local kind="$1"
            local block="$2"
            if ! grep -Fq -- "argocd.argoproj.io/sync-options: Prune=false,Delete=false" <<< "$block"; then
              echo "FAIL: ${kind} is missing argocd.argoproj.io/sync-options: Prune=false,Delete=false."
              exit 1
            fi
            if grep -Fq -- "argocd.argoproj.io/sync-options: PruneLast=true" <<< "$block"; then
              echo "FAIL: ${kind} still carries sync-options: PruneLast=true instead of Prune=false,Delete=false."
              exit 1
            fi
            echo "OK: ${kind} carries sync-options: Prune=false,Delete=false (not merely PruneLast=true)."
          }

          assert_deletion_protected "Namespace ${RUNTIME_NAMESPACE}" "$RUNTIME_NS_BLOCK"

          echo "Validating exactly three ServiceAccount documents..."
          SERVICEACCOUNT_COUNT="$(grep -c '^kind: ServiceAccount$' "$RENDERED")"
          if [ "$SERVICEACCOUNT_COUNT" -ne 3 ]; then
            echo "FAIL: expected exactly 3 rendered ServiceAccount documents (oracle, postgresql, gg-fluent-bit), found ${SERVICEACCOUNT_COUNT}."
            exit 1
          fi

          # deletion_protected: "true" for the shared, engine-level
          # oracle/postgresql identities (must survive this Application's
          # own deletion -- other runtime releases still reference them by
          # name); "false" for gg-fluent-bit, which belongs solely to this
          # platform release's own DaemonSet and should be pruned/deleted
          # normally along with it.
          validate_runtime_sa() {
            local sa_name="$1"
            local expected_role_arn="$2"
            local deletion_protected="$3"
            local sa_block
            sa_block="$(select_document "$RENDERED" "ServiceAccount" "${sa_name}")"
            if [ -z "$sa_block" ]; then
              echo "FAIL: rendered ServiceAccount ${sa_name} was not found."
              exit 1
            fi
            if ! grep -Fq -- "namespace: \"${RUNTIME_NAMESPACE}\"" <<< "$sa_block"; then
              echo "FAIL: ServiceAccount ${sa_name} is not in namespace ${RUNTIME_NAMESPACE}."
              exit 1
            fi

            local role_arn_line
            role_arn_line="$(grep -m1 -- "eks.amazonaws.com/role-arn:" <<< "$sa_block" || true)"
            if [ -z "$role_arn_line" ]; then
              echo "FAIL: eks.amazonaws.com/role-arn annotation is missing from ServiceAccount ${sa_name}."
              exit 1
            fi
            local role_arn_actual
            role_arn_actual="$(normalize_value "${role_arn_line#*role-arn:}")"
            if [ "$role_arn_actual" != "$expected_role_arn" ]; then
              echo "FAIL: ServiceAccount ${sa_name} IRSA role ARN mismatch."
              echo "Expected: ${expected_role_arn}"
              echo "Actual:   ${role_arn_actual}"
              exit 1
            fi
            echo "OK: ServiceAccount ${sa_name} is in ${RUNTIME_NAMESPACE} with the expected IRSA role ARN."

            if [ "$deletion_protected" = "true" ]; then
              assert_deletion_protected "ServiceAccount ${sa_name}" "$sa_block"
            fi
          }

          validate_runtime_sa "$ORACLE_SA_NAME" "$ORACLE_RUNTIME_ROLE_ARN" "true"
          validate_runtime_sa "$POSTGRESQL_SA_NAME" "$POSTGRESQL_RUNTIME_ROLE_ARN" "true"
          validate_runtime_sa "$FLUENT_BIT_SA_NAME" "$FLUENT_BIT_ROLE_ARN" "false"

          echo "Validating no GoldenGate runtime/workload resources are rendered by this chart..."
          # DaemonSet is deliberately no longer forbidden here: Phase 6A adds
          # exactly one platform-level Fluent Bit DaemonSet
          # (gg-fluent-bit) to this chart. This chart still owns no
          # GoldenGate runtime workload of any kind -- StatefulSet/
          # Deployment/Service/Ingress/PersistentVolumeClaim/
          # SecretProviderClass remain forbidden, and the DaemonSet count
          # is validated exactly below.
          for forbidden_kind in StatefulSet Deployment Service Ingress PersistentVolumeClaim SecretProviderClass; do
            if grep -qE "^kind: ${forbidden_kind}\$" "$RENDERED"; then
              echo "FAIL: a ${forbidden_kind} was rendered by the platform chart -- it must only create shared namespaces, shared runtime ServiceAccounts, and the platform logging DaemonSet."
              exit 1
            fi
          done
          echo "OK: no StatefulSet/Deployment/Service/Ingress/PersistentVolumeClaim/SecretProviderClass rendered."

          echo "Validating exactly one Fluent Bit DaemonSet document..."
          DAEMONSET_COUNT="$(grep -c '^kind: DaemonSet$' "$RENDERED")"
          if [ "$DAEMONSET_COUNT" -ne 1 ]; then
            echo "FAIL: expected exactly 1 rendered DaemonSet document, found ${DAEMONSET_COUNT}."
            exit 1
          fi

          FLUENT_BIT_DS_BLOCK="$(select_document "$RENDERED" "DaemonSet" "gg-fluent-bit")"
          if [ -z "$FLUENT_BIT_DS_BLOCK" ]; then
            echo "FAIL: rendered DaemonSet gg-fluent-bit was not found."
            exit 1
          fi
          echo "OK: exactly 1 DaemonSet document, gg-fluent-bit."

          echo "Validating the Fluent Bit DaemonSet carries no privileged mode..."
          if grep -Fq -- "privileged: true" <<< "$FLUENT_BIT_DS_BLOCK"; then
            echo "FAIL: gg-fluent-bit DaemonSet requests privileged mode."
            exit 1
          fi
          if ! grep -Fq -- "privileged: false" <<< "$FLUENT_BIT_DS_BLOCK"; then
            echo "FAIL: gg-fluent-bit DaemonSet does not explicitly set privileged: false."
            exit 1
          fi
          echo "OK: gg-fluent-bit DaemonSet is not privileged."

          echo "Validating the Fluent Bit DaemonSet has no hostNetwork..."
          if ! grep -Fq -- "hostNetwork: false" <<< "$FLUENT_BIT_DS_BLOCK"; then
            echo "FAIL: gg-fluent-bit DaemonSet does not explicitly set hostNetwork: false."
            exit 1
          fi
          echo "OK: gg-fluent-bit DaemonSet does not use host networking."

          echo "Validating the Fluent Bit DaemonSet's host log mount is read-only..."
          # hostPath volume named "varlog" must be paired with a matching
          # volumeMount that sets readOnly: true -- a plain string search
          # for "readOnly: true" alone would not prove it applies to the
          # host mount specifically, so the hostPath volume block and its
          # matching mount are extracted first.
          if ! grep -Fq -- "hostPath:" <<< "$FLUENT_BIT_DS_BLOCK"; then
            echo "FAIL: gg-fluent-bit DaemonSet does not mount a host path for container logs."
            exit 1
          fi
          VARLOG_MOUNT_BLOCK="$(awk '/name: varlog/{found=1} found{print} found && /readOnly:/{exit}' <<< "$FLUENT_BIT_DS_BLOCK")"
          if ! grep -Fq -- "readOnly: true" <<< "$VARLOG_MOUNT_BLOCK"; then
            echo "FAIL: gg-fluent-bit DaemonSet's varlog host mount is not read-only."
            exit 1
          fi
          echo "OK: gg-fluent-bit DaemonSet's host log mount (varlog) is read-only."

          echo "Validating the Fluent Bit ConfigMap enforces namespace filtering and exact CloudWatch log-group destinations..."
          FLUENT_BIT_CM_BLOCK="$(select_document "$RENDERED" "ConfigMap" "gg-fluent-bit-config")"
          if [ -z "$FLUENT_BIT_CM_BLOCK" ]; then
            echo "FAIL: rendered ConfigMap gg-fluent-bit-config was not found."
            exit 1
          fi
          if ! grep -Fq -- 'Name   grep' <<< "$FLUENT_BIT_CM_BLOCK"; then
            echo "FAIL: gg-fluent-bit-config does not contain a namespace-filtering grep FILTER."
            exit 1
          fi
          if ! grep -Fq -- "${RUNTIME_NAMESPACE}|${MONITOR_NAMESPACE}" <<< "$FLUENT_BIT_CM_BLOCK"; then
            echo "FAIL: gg-fluent-bit-config's namespace filter does not reference exactly ${RUNTIME_NAMESPACE} and ${MONITOR_NAMESPACE}."
            exit 1
          fi
          for expected_log_group in "$FLUENT_BIT_RUNTIME_LOG_GROUP" "$FLUENT_BIT_MONITOR_LOG_GROUP"; do
            if ! grep -Eq -- "log_group_name[[:space:]]+${expected_log_group}$" <<< "$FLUENT_BIT_CM_BLOCK"; then
              echo "FAIL: gg-fluent-bit-config does not target the exact pre-created log group ${expected_log_group}."
              exit 1
            fi
          done
          if grep -Eq -- "auto_create_group[[:space:]]+true" <<< "$FLUENT_BIT_CM_BLOCK"; then
            echo "FAIL: gg-fluent-bit-config allows Fluent Bit to auto-create CloudWatch log groups."
            exit 1
          fi
          if ! grep -Eq -- "auto_create_group[[:space:]]+false" <<< "$FLUENT_BIT_CM_BLOCK"; then
            echo "FAIL: gg-fluent-bit-config does not explicitly disable auto_create_group."
            exit 1
          fi
          echo "OK: namespace filtering is present and both CloudWatch log-group destinations are exact and pre-created (auto_create_group false)."

          echo "Validating the rendered Fluent Bit DaemonSet image matches FLUENT_BIT_IMAGE exactly..."
          RENDERED_IMAGE_LINE="$(grep -m1 -- "image:" <<< "$FLUENT_BIT_DS_BLOCK" || true)"
          if [ -z "$RENDERED_IMAGE_LINE" ]; then
            echo "FAIL: gg-fluent-bit DaemonSet has no image: field."
            exit 1
          fi
          RENDERED_IMAGE="$(normalize_value "${RENDERED_IMAGE_LINE#*image:}")"
          if [ "$RENDERED_IMAGE" != "$FLUENT_BIT_IMAGE" ]; then
            echo "FAIL: rendered gg-fluent-bit image does not match FLUENT_BIT_IMAGE."
            echo "Expected: ${FLUENT_BIT_IMAGE}"
            echo "Actual:   ${RENDERED_IMAGE}"
            exit 1
          fi
          echo "OK: rendered gg-fluent-bit image exactly matches FLUENT_BIT_IMAGE: ${RENDERED_IMAGE}"

          echo "Validating no public.ecr.aws reference remains in the active (non-comment) Phase 6A chart values/templates or the rendered manifest..."
          # Exclude comment-only lines (# ...) -- this repository's chart
          # source deliberately documents "never public.ecr.aws" as a
          # prohibition in prose/required-message text, which must not
          # itself be flagged as a live reference. The rendered manifest
          # check below (no comments possible in rendered output) is the
          # authoritative proof of the actually-deployed image.
          PUBLIC_ECR_HITS="$(grep -rn "public.ecr.aws" "$HELM_CHART_PATH/values.yaml" "$HELM_CHART_PATH/templates"/fluent-bit-*.yaml 2>/dev/null \
            | grep -vE ':\s*#|"[^"]*public\.ecr\.aws[^"]*"' || true)"
          if [ -n "$PUBLIC_ECR_HITS" ]; then
            echo "FAIL: a live public.ecr.aws reference remains in the Phase 6A chart source:"
            echo "${PUBLIC_ECR_HITS}"
            exit 1
          fi
          if grep -q "public.ecr.aws" "$RENDERED"; then
            echo "FAIL: a public.ecr.aws reference remains in the rendered manifest."
            exit 1
          fi
          echo "OK: no live public.ecr.aws reference anywhere in the Phase 6A chart source or rendered manifest."

          echo "Validating the Tail input Path is restricted to exactly the two approved namespace patterns..."
          EXPECTED_TAIL_PATH="/var/log/containers/*_${RUNTIME_NAMESPACE}_*.log,/var/log/containers/*_${MONITOR_NAMESPACE}_*.log"
          if ! grep -Fq -- "Path              ${EXPECTED_TAIL_PATH}" "$RENDERED"; then
            echo "FAIL: Fluent Bit tail INPUT Path is not restricted to exactly: ${EXPECTED_TAIL_PATH}"
            exit 1
          fi
          if grep -Fq -- "Path              /var/log/containers/*.log" "$RENDERED"; then
            echo "FAIL: Fluent Bit tail INPUT Path still tails every container log cluster-wide."
            exit 1
          fi
          echo "OK: Tail input Path is restricted to exactly the two approved namespace patterns."

          echo "Validating both cloudwatch_logs OUTPUTs are filesystem-buffer bounded..."
          TOTAL_LIMIT_SIZE_COUNT="$(grep -v '^\s*#' "$RENDERED" | grep -cE 'storage\.total_limit_size[[:space:]]+[0-9]')"
          if [ "$TOTAL_LIMIT_SIZE_COUNT" -ne 2 ]; then
            echo "FAIL: expected storage.total_limit_size on both cloudwatch_logs OUTPUTs, found ${TOTAL_LIMIT_SIZE_COUNT} occurrence(s)."
            exit 1
          fi
          echo "OK: both cloudwatch_logs OUTPUTs set storage.total_limit_size."

          echo "Validating the fluent-bit-state emptyDir has a sizeLimit..."
          STATE_VOLUME_BLOCK="$(awk '/name: fluent-bit-state/{found=1} found{print} found && /emptyDir:/{c++} c==1 && /sizeLimit:|hostPath:|configMap:|- name:/{if (++n>1) exit}' <<< "$FLUENT_BIT_DS_BLOCK")"
          if ! echo "$STATE_VOLUME_BLOCK" | grep -q 'sizeLimit:'; then
            echo "FAIL: the fluent-bit-state emptyDir volume does not set sizeLimit."
            exit 1
          fi
          echo "OK: the fluent-bit-state emptyDir volume sets sizeLimit."

          echo "Validating no GoldenGate runtime StatefulSet template gained a Fluent Bit sidecar..."
          if grep -rlq "fluent-bit\|fluentbit" helm/goldengate/templates/runtime-statefulset.yaml 2>/dev/null; then
            echo "FAIL: helm/goldengate/templates/runtime-statefulset.yaml references Fluent Bit -- no GoldenGate runtime sidecar is permitted."
            exit 1
          fi
          echo "OK: no Fluent Bit sidecar reference in the GoldenGate runtime StatefulSet template."

          echo "OK: rendered platform manifest passed all checks."

      - name: Package platform Helm chart
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p packaged
          rm -rf "$TEMP_CHART_PATH"
          mkdir -p "$TEMP_CHART_PATH"

          cp -a "$HELM_CHART_PATH/." "$TEMP_CHART_PATH/"
          cp "$VALUES_FILE" "$TEMP_CHART_PATH/values-deployment.yaml"

          helm package "$TEMP_CHART_PATH" \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            --destination packaged

          ls -lrt packaged

      - name: Push platform Helm chart to ECR as OCI artifact
        shell: bash
        run: |
          set -euo pipefail

          helm push "packaged/${CHART_NAME}-${CHART_VERSION}.tgz" "$HELM_PUSH_URL"

          echo "Published Helm chart:"
          echo "${HELM_CHART_REF}:${CHART_VERSION}"

      - name: Verify platform Helm chart can be pulled from ECR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pulled

          helm pull "$HELM_CHART_REF" \
            --version "$CHART_VERSION" \
            --destination pulled

          ls -lrt pulled

      - name: Connect to EKS cluster
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --role-arn "${EKS_DEPLOY_ROLE_ARN}" \
            --assume-role-arn "${EKS_DEPLOY_ROLE_ARN}"

          kubectl config current-context
          kubectl version --client=true

      - name: Ensure Argo CD Application CRD exists
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl get crd applications.argoproj.io >/dev/null || {
            echo "CRD applications.argoproj.io not found."
            echo "Argo CD must be installed on this cluster before the platform bootstrap can be deployed through it."
            echo "Run the argocd-eks-deployment.yaml workflow first."
            exit 1
          }

          echo "Argo CD Application CRD is present."

      - name: Confirm the platform Argo CD repository Secret exists
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          # Same required-order check as goldengate-monitor.yaml: this
          # workflow must fail clearly here, not inject a credential, if
          # argocd-eks-deployment.yaml has not yet been re-run since the
          # goldengate-platform entry was added to
          # envs/dev/argocd/values.yaml ecrTokenSync.repositories.
          if ! kubectl get secret "$ARGOCD_PLATFORM_SECRET_NAME" -n "$ARGOCD_NAMESPACE" >/dev/null 2>&1; then
            echo "PREREQUISITE NOT MET: Secret ${ARGOCD_PLATFORM_SECRET_NAME} does not exist in namespace ${ARGOCD_NAMESPACE}."
            echo ""
            echo "Required order before running this workflow:"
            echo "  1. Run the IAM/Secrets Terraform workflow (applies the extended trust policy on GoldenGateSecretsReadRole-dev)."
            echo "  2. Re-run the argocd-eks-deployment.yaml workflow (picks up the new goldengate-platform"
            echo "     entry in envs/dev/argocd/values.yaml ecrTokenSync.repositories and provisions this Secret)."
            echo "  3. Re-run this workflow."
            echo ""
            echo "Refusing to inject a short-lived credential as a workaround -- the in-cluster IRSA token sync is the only long-term credential mechanism."
            exit 1
          fi

          ACTUAL_URL="$(kubectl get secret "$ARGOCD_PLATFORM_SECRET_NAME" -n "$ARGOCD_NAMESPACE" -o jsonpath='{.data.url}' | base64 --decode)"
          EXPECTED_URL="oci://${ECR_REGISTRY}/${HELM_OCI_NAMESPACE}/${CHART_NAME}"
          if [ "$ACTUAL_URL" != "$EXPECTED_URL" ]; then
            echo "FAIL: Secret ${ARGOCD_PLATFORM_SECRET_NAME} url mismatch. Expected ${EXPECTED_URL}, got ${ACTUAL_URL}."
            exit 1
          fi

          echo "OK: ${ARGOCD_PLATFORM_SECRET_NAME} exists and points to ${EXPECTED_URL}."

      - name: Create or update Argo CD Application
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Applying Argo CD Application: ${ARGOCD_APP_NAME}"

          # This Application is the single designated owner of the shared
          # runtime namespace, so (unlike every per-runtime
          # goldengate-eks-app.yaml Application) it is allowed
          # CreateNamespace=true and managedNamespaceMetadata.
          kubectl apply -f - <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ${ARGOCD_APP_NAME}
            namespace: ${ARGOCD_NAMESPACE}
            finalizers:
              - resources-finalizer.argocd.argoproj.io
            labels:
              app.kubernetes.io/name: goldengate-platform
              app.kubernetes.io/managed-by: argocd
          spec:
            project: default
            source:
              repoURL: ${HELM_CHART_REF}
              targetRevision: ${CHART_VERSION}
              path: .
              helm:
                releaseName: ${RELEASE_NAME}
                valueFiles:
                  - values-deployment.yaml
                parameters:
                  - name: serviceAccounts.oracle.roleArn
                    value: ${ORACLE_RUNTIME_ROLE_ARN}
                  - name: serviceAccounts.postgresql.roleArn
                    value: ${POSTGRESQL_RUNTIME_ROLE_ARN}
                  - name: fluentBit.serviceAccount.roleArn
                    value: ${FLUENT_BIT_ROLE_ARN}
                  - name: fluentBit.aws.region
                    value: ${AWS_REGION}
                  - name: fluentBit.image.reference
                    value: ${FLUENT_BIT_IMAGE}
            destination:
              server: https://kubernetes.default.svc
              namespace: ${RUNTIME_NAMESPACE}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
              managedNamespaceMetadata:
                labels:
                  app.kubernetes.io/name: goldengate-platform
                  app.kubernetes.io/managed-by: argocd
            revisionHistoryLimit: 10
          EOF

          kubectl annotate application "${ARGOCD_APP_NAME}" \
            -n "${ARGOCD_NAMESPACE}" \
            argocd.argoproj.io/refresh=hard \
            --overwrite

      - name: Wait for Argo CD sync and health
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          TIMEOUT_SECONDS=600
          INTERVAL_SECONDS=15
          ELAPSED=0

          while true; do
            if kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" >/dev/null 2>&1; then
              SYNC_STATUS="$(kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")"
              HEALTH_STATUS="$(kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")"

              echo "[$(date -u +%H:%M:%S)] sync=${SYNC_STATUS} health=${HEALTH_STATUS} (elapsed ${ELAPSED}s / ${TIMEOUT_SECONDS}s)"

              if [ "${HEALTH_STATUS}" = "Degraded" ]; then
                echo "Argo CD Application ${ARGOCD_APP_NAME} is Degraded."
                kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o wide
                exit 1
              fi

              if [ "${SYNC_STATUS}" = "Synced" ] && [ "${HEALTH_STATUS}" = "Healthy" ]; then
                echo "Argo CD Application ${ARGOCD_APP_NAME} is Synced and Healthy."
                break
              fi
            else
              echo "[$(date -u +%H:%M:%S)] Argo CD Application ${ARGOCD_APP_NAME} not found yet (elapsed ${ELAPSED}s / ${TIMEOUT_SECONDS}s)."
            fi

            if [ "${ELAPSED}" -ge "${TIMEOUT_SECONDS}" ]; then
              echo "Timed out after ${TIMEOUT_SECONDS}s waiting for ${ARGOCD_APP_NAME} to become Synced and Healthy."
              kubectl get application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" -o wide || true
              kubectl describe application "${ARGOCD_APP_NAME}" -n "${ARGOCD_NAMESPACE}" || true
              exit 1
            fi

            sleep "${INTERVAL_SECONDS}"
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
          done

      - name: Verify GoldenGate platform runtime state
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Namespace:"
          kubectl get namespace "$RUNTIME_NAMESPACE"

          echo "ServiceAccounts and IRSA annotations:"
          kubectl get serviceaccount "$ORACLE_SA_NAME" -n "$RUNTIME_NAMESPACE"
          ORACLE_ROLE_ANNOTATION="$(kubectl get serviceaccount "$ORACLE_SA_NAME" -n "$RUNTIME_NAMESPACE" -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}')"
          if [ "$ORACLE_ROLE_ANNOTATION" != "$ORACLE_RUNTIME_ROLE_ARN" ]; then
            echo "FAIL: unexpected IRSA role annotation on ServiceAccount ${ORACLE_SA_NAME}: ${ORACLE_ROLE_ANNOTATION}"
            exit 1
          fi
          echo "OK: ${ORACLE_SA_NAME} IRSA role annotation matches ${ORACLE_RUNTIME_ROLE_ARN}."

          kubectl get serviceaccount "$POSTGRESQL_SA_NAME" -n "$RUNTIME_NAMESPACE"
          POSTGRESQL_ROLE_ANNOTATION="$(kubectl get serviceaccount "$POSTGRESQL_SA_NAME" -n "$RUNTIME_NAMESPACE" -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}')"
          if [ "$POSTGRESQL_ROLE_ANNOTATION" != "$POSTGRESQL_RUNTIME_ROLE_ARN" ]; then
            echo "FAIL: unexpected IRSA role annotation on ServiceAccount ${POSTGRESQL_SA_NAME}: ${POSTGRESQL_ROLE_ANNOTATION}"
            exit 1
          fi
          echo "OK: ${POSTGRESQL_SA_NAME} IRSA role annotation matches ${POSTGRESQL_RUNTIME_ROLE_ARN}."

          echo "Confirming this Application owns no GoldenGate runtime workload resources (namespaces/ServiceAccounts and the Phase 6A Fluent Bit DaemonSet only)..."
          WORKLOAD_COUNT=0
          for kind in statefulset deployment; do
            COUNT="$(kubectl get "$kind" -n "$RUNTIME_NAMESPACE" -l app.kubernetes.io/instance="$RELEASE_NAME" --no-headers 2>/dev/null | wc -l | tr -d ' ')"
            WORKLOAD_COUNT=$((WORKLOAD_COUNT + COUNT))
          done
          if [ "$WORKLOAD_COUNT" -ne 0 ]; then
            echo "FAIL: found ${WORKLOAD_COUNT} StatefulSet/Deployment resource(s) owned by ${RELEASE_NAME} -- the platform release must never own a GoldenGate runtime workload."
            exit 1
          fi
          echo "OK: no StatefulSet/Deployment resources are owned by ${RELEASE_NAME}."

          echo "Confirming this Application owns exactly one DaemonSet (gg-fluent-bit)..."
          DAEMONSET_COUNT="$(kubectl get daemonset -n "$RUNTIME_NAMESPACE" -l app.kubernetes.io/instance="$RELEASE_NAME" --no-headers 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$DAEMONSET_COUNT" -ne 1 ]; then
            echo "FAIL: expected exactly 1 DaemonSet owned by ${RELEASE_NAME}, found ${DAEMONSET_COUNT}."
            exit 1
          fi
          kubectl get daemonset gg-fluent-bit -n "$RUNTIME_NAMESPACE" >/dev/null
          echo "OK: exactly 1 DaemonSet (gg-fluent-bit) is owned by ${RELEASE_NAME}."

      - name: Upload rendered manifests and chart package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldengate-platform-helm-artifacts
          path: |
            rendered/
            packaged/
            pulled/
          if-no-files-found: warn
          retention-days: 7

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GoldenGate platform deploy summary"
            echo ""
            echo "- Chart version: \`${CHART_VERSION:-unknown}\`"
            echo "- Chart ref: \`${HELM_CHART_REF:-unknown}\`"
            echo "- Runtime namespace: \`${RUNTIME_NAMESPACE}\`"
            echo "- Argo CD Application: \`${ARGOCD_APP_NAME}\` (namespace: \`${ARGOCD_NAMESPACE}\`)"
            echo "- Deploy enabled: \`${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}\`"
            echo ""
            echo "### Ownership"
            echo ""
            echo "This is the single designated owner of Namespace/${RUNTIME_NAMESPACE},"
            echo "ServiceAccount/${ORACLE_SA_NAME}, and"
            echo "ServiceAccount/${POSTGRESQL_SA_NAME}. Individual GoldenGate runtime"
            echo "Applications (goldengate-eks-app.yaml) reference these ServiceAccounts by"
            echo "name only (serviceAccount.create=false) and never own or delete them."
            echo ""
            echo "Phase 6A: this Application also owns DaemonSet/gg-fluent-bit"
            echo "(platform-level centralized container logging, ServiceAccount/${FLUENT_BIT_SA_NAME},"
            echo "and its supporting ClusterRole/ClusterRoleBinding and ConfigMap). It runs the"
            echo "private, immutable digest image \`${FLUENT_BIT_IMAGE:-unknown}\`."
            echo "It ships Kubernetes container stdout/stderr only, from"
            echo "\`${RUNTIME_NAMESPACE}\` and \`${MONITOR_NAMESPACE}\`, to the pre-created"
            echo "CloudWatch Logs groups \`${FLUENT_BIT_RUNTIME_LOG_GROUP}\` and"
            echo "\`${FLUENT_BIT_MONITOR_LOG_GROUP}\`. It is never a GoldenGate runtime or"
            echo "observer sidecar and provides no EFS /u02 application file-log coverage."
            echo ""
            echo "### Required deployment order"
            echo ""
            echo "1. IAM/Secrets Terraform workflow (applies the trust policy on GoldenGateSecretsReadRole-dev -- see envs/dev/policies/goldengate-secrets-read-dev/)."
            echo "2. argocd-eks-deployment.yaml (provisions the argocd-ecr-goldengate-platform-oci repository Secret)."
            echo "3. This workflow."
            echo "4. Only then may a runtime candidate (gg-oracle-payments-01, gg-postgresql-payments-01) set deployment.enabled=true."
          } >> "$GITHUB_STEP_SUMMARY"
