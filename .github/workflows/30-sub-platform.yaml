name: "30 | SUB | GoldenGate Platform"

# Trigger-neutral: previously branched on github.event_name to say "manual dispatch" vs "auto: platform changes on <sha>", but a workflow_call from MAIN (Phase B2's platform_sync_once) is neither -- it fell through to the misleading "auto" wording. inputs.environment/inputs.deploy are always populated regardless of trigger (workflow_dispatch or workflow_call), so the run-name is accurate for both.
run-name: "SUB | GoldenGate Platform | env=${{ inputs.environment }} | deploy=${{ inputs.deploy }} | ran by ${{ github.actor }}"

# Manual dispatch only, deliberately with no push trigger: this workflow must run after the IAM Terraform apply and 20-sub-argocd.yaml (see the required order in the "Workflow summary" step); do not re-add a push trigger without also solving that ordering problem.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev

      deploy:
        description: "Deploy to EKS after publishing the Helm chart"
        required: true
        type: boolean
        default: true

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      deploy:
        required: true
        type: boolean
      # Live Deployment Approval Topology Fix: an internal workflow_call-only caller contract, never a workflow_dispatch input and never operator-facing -- literal boolean true means MAIN already obtained its own single goldengate_deploy_authorization approval and this reusable workflow must not open a second one; missing/false (including every direct standalone workflow_dispatch run, which cannot set this input at all) means standalone and the approval below still applies.
      orchestrated_by_main:
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: goldengate-platform-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Live Deployment Approval Topology Fix, MODE B (direct standalone workflow_dispatch): the one remaining protected-environment gate in this workflow. Skipped entirely when MAIN already authorized this run (orchestrated_by_main: true) -- MAIN's own goldengate_deploy_authorization job is the approval in that case, never this one.
  standalone_deploy_authorization:
    name: Authorize standalone GoldenGate platform deployment

    if: ${{ inputs.orchestrated_by_main != true }}

    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Record standalone GoldenGate platform deployment authorization
        shell: bash
        run: |
          set -euo pipefail

          echo "Standalone GoldenGate platform deployment authorized for environment ${{ inputs.environment }}."

  # Phase 4 Python Conversion: implementation lives in automation/phases/phase4/phase4_platform.py -- this job is a thin sequence of subcommand invocations, never a reimplementation. This chart builds/pushes no container image of its own (Namespaces, shared ServiceAccounts, and the Fluent Bit DaemonSet are the only resources) -- the Fluent Bit image is a pre-mirrored digest reference only read and verified here, never built or copied.
  package_publish_and_deploy:
    name: "Phase 4B | Build, Publish & Reconcile GoldenGate Platform"

    # always() lets a deliberately-skipped standalone_deploy_authorization (MAIN-orchestrated run) through without being treated as a failed dependency, while the explicit result check still fails closed on a real standalone run whose authorization failed, was cancelled, or was unexpectedly skipped.
    needs:
      - standalone_deploy_authorization
    if: ${{ always() && (inputs.orchestrated_by_main == true || needs.standalone_deploy_authorization.result == 'success') }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ inputs.environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ inputs.environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure Helm/kubectl prerequisites
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py ensure-deploy-tools

      # deploy=false contract preserved exactly: still builds/packages/publishes the Helm chart and performs the existing ECR repository/policy behavior -- only the reconcile-cluster/post-deploy-validation steps below are gated on inputs.deploy. This step and Fluent Bit ECR verification never mutate EKS.
      - name: Prepare and validate local Platform deployment
        shell: bash
        env:
          # Read through a step-level environment variable, never interpolated directly into a shell statement or hardcoded here.
          FLUENT_BIT_IMAGE: ${{ vars.FLUENT_BIT_IMAGE }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py prepare-and-validate --environment "${{ inputs.environment }}"

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the steps below that reference steps.aws_build_credentials.outputs.*, never job-wide, never written to $GITHUB_ENV, never written to any state file. kubectl calls after "Reconcile Platform Argo CD Application" still require these credentials at invocation time because the kubeconfig written by `aws eks update-kubeconfig` embeds an exec credential plugin (`aws eks get-token`) that itself needs live AWS credentials.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Verify private Fluent Bit ECR artifact
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py verify-fluent-bit-artifact --environment "${{ inputs.environment }}"

      - name: Publish GoldenGate Platform Helm chart
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py publish-chart --environment "${{ inputs.environment }}"

      - name: Reconcile Platform Argo CD Application
        if: ${{ inputs.deploy }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py reconcile-cluster --environment "${{ inputs.environment }}"

      - name: Run Platform post-deployment validation
        if: ${{ inputs.deploy }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py post-deploy-validation --environment "${{ inputs.environment }}"

      - name: Upload rendered manifests and chart package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldengate-platform-helm-artifacts
          path: |
            rendered/
            packaged/
            pulled/
          if-no-files-found: warn
          retention-days: 7

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py summary --environment "${{ inputs.environment }}"
