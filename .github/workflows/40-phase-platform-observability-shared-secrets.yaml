name: "40 | PHASE | Platform, Observability & Shared Secrets"

# Internal orchestration wrapper ONLY -- workflow_call, never workflow_dispatch/push/pull_request/schedule. This groups the seven already-live-proven Phase 4A-4G jobs (Platform ownership preflight -> Platform reconciliation -> Platform health acceptance, Observability ownership preflight -> Observability reconciliation -> Observability health acceptance, and the joining shared-secrets validation) beneath ONE MAIN-facing parent job, purely to present Phase 4 as a single clean phase in the GitHub Actions UI -- exactly the same high-level reusable-workflow grouping pattern MAIN's own Phase 3 and Phase 7 groupings already use (phase_3_argocd -> 30-phase-argocd-orchestration.yaml; phase_7_monitor_final_acceptance -> 70-phase-monitor-final-acceptance.yaml). No business logic changes: every job body below is byte-for-byte the same as its pre-grouping MAIN counterpart except for the mechanical translations required by the reusable-workflow boundary (outer needs.*.result/outputs.* become inputs.*; internal Phase-4-to-Phase-4 references remain needs.*). automation/phases/phase4/*.py is untouched and remains the sole implementation authority. .github/workflows/30-sub-platform.yaml and .github/workflows/40-sub-observability.yaml remain the standalone/operator-facing specialist workflows, called here as genuine nested reusable-workflow calls, never inlined/duplicated. Phase 4G (validate_shared_secrets_once) spans both DEPLOY and VALIDATE modes -- this wrapper is therefore never gated on effective_deploy alone; each internal job remains responsible for its own exact mode-aware gating, exactly as it was directly inside MAIN.

on:
  workflow_call:
    inputs:
      selected_environment:
        required: true
        type: string
      effective_deploy:
        required: true
        type: string
      result_validate_model:
        required: true
        type: string
      result_terraform_sync_once:
        required: true
        type: string
      result_phase_3_argocd:
        required: true
        type: string
      result_validate_argocd_ready:
        required: true
        type: string
    outputs:
      validate_platform_ready_result:
        description: "The exact result (success/failure/cancelled/skipped) of the internal Phase 4C validate_platform_ready job -- never conflated with this wrapper's OWN overall result, since the two are not guaranteed to mean the same thing in every failure/skip scenario. Materialized through fromJSON(toJSON(...)) rather than a bare jobs.<job_id>.result reference -- actions/runner#2495 documents that the bare form can resolve as an empty string in the caller even though the internal job has a valid result (the same hardening already applied to the Phase 3 wrapper's validate_argocd_ready_result output)."
        value: ${{ fromJSON(toJSON(jobs.validate_platform_ready)).result }}
      validate_observability_ready_result:
        description: "The exact result (success/failure/cancelled/skipped) of the internal Phase 4F validate_observability_ready job -- never conflated with this wrapper's OWN overall result. Materialized through fromJSON(toJSON(...)), matching the Phase 3 wrapper's hardened pattern."
        value: ${{ fromJSON(toJSON(jobs.validate_observability_ready)).result }}
      validate_shared_secrets_once_result:
        description: "The exact result (success/failure/cancelled/skipped) of the internal Phase 4G validate_shared_secrets_once job -- never conflated with this wrapper's OWN overall result. Consumed downstream by Phase 5A/5B/5D entry gates and Phase 6A/6B replication gates. Materialized through fromJSON(toJSON(...)), matching the Phase 3 wrapper's hardened pattern."
        value: ${{ fromJSON(toJSON(jobs.validate_shared_secrets_once)).result }}

permissions:
  id-token: write
  contents: read

jobs:
  platform_preflight:
    name: "Phase 4A | GoldenGate Platform Ownership Preflight"

    # Phase 4 grouping: validate_model/phase_3_argocd are external jobs completed before this reusable workflow is ever invoked -- their result/outputs cross the reusable-workflow boundary as plain workflow_call inputs (never a needs.* reference to a job outside this file). Phase 3 grouping: both the Phase 3 wrapper's own overall result AND its exact internal Phase 3D result are required (never conflated), since the two are not guaranteed to mean the same thing in every failure/skip scenario.
    if: ${{ inputs.effective_deploy == 'true' && inputs.result_phase_3_argocd == 'success' && inputs.result_validate_argocd_ready == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      state: ${{ steps.classify.outputs.state }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ inputs.selected_environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ inputs.selected_environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py ensure-kubectl

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the classify step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Classify GoldenGate Platform ownership safety
        id: classify
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py ownership-preflight --environment "${{ inputs.selected_environment }}"

  # Phase 4D | Observability Ownership Preflight -- Generic MAIN Desired-State Convergence Fix: automation/phases/phase4/observability_state.py is a pure OWNERSHIP-SAFETY classifier -- ABSENT and OWNED both reconcile via observability_sync_once below on EVERY Deploy, regardless of individual desired-state drift (chart version, image digests, the cloudwatch-agent ServiceAccount role-arn, a future new resource); BROKEN (foreign/ambiguous ownership, or a genuine inspection failure) fails closed right here, never auto-repaired. Deliberately does NOT depend on platform_preflight -- both are independent application-owned prerequisites after Argo and run in parallel. This job never mutates the cluster -- it only runs automation/phases/phase4/observability_state.py, which itself issues read-only `kubectl get` calls.
  observability_preflight:
    name: "Phase 4D | Observability Ownership Preflight"

    # Phase 3 grouping: both the Phase 3 wrapper's own overall result AND its exact internal Phase 3D result are required (never conflated), since the two are not guaranteed to mean the same thing in every failure/skip scenario.
    if: ${{ inputs.effective_deploy == 'true' && inputs.result_phase_3_argocd == 'success' && inputs.result_validate_argocd_ready == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      state: ${{ steps.classify.outputs.state }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ inputs.selected_environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ inputs.selected_environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py ensure-tools

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the classify step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Classify Observability ownership safety
        id: classify
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py ownership-preflight --environment "${{ inputs.selected_environment }}"

  # Phase 4B | Reconcile GoldenGate Platform -- Generic MAIN Desired-State Convergence Fix: MAIN ALWAYS reconciles the Platform on Deploy whenever platform_preflight confirms it is safe (ABSENT or OWNED) -- never skipped merely because the preflight ownership classifier found the installation superficially healthy-looking. 30-sub-platform.yaml's own idempotent Argo CD sync is what actually applies the current committed desired state (Fluent Bit image/config, ServiceAccount role ARNs, any future OPTIONAL values-driven resource) -- this job never needs to learn a new resource name merely to keep permitting that reconciliation. fluentBit.create is a REQUIRED architectural invariant, not a supported optional toggle: 30-sub-platform.yaml's own post-deploy validation unconditionally requires the rendered gg-fluent-bit DaemonSet/ConfigMap/ServiceAccount to exist, so flipping fluentBit.create=false would fail that validation, not be silently pruned. Runs the reusable specialist workflow synchronously as part of this DAG -- never an asynchronous CLI/API dispatch or repository_dispatch trigger. No standalone specialist workflow is a required recovery/upgrade path -- MAIN never tells an operator to run 30-sub-platform.yaml separately to apply ordinary desired state.
  platform_sync_once:
    name: "Phase 4B | Reconcile GoldenGate Platform"

    needs:
      - platform_preflight
    if: ${{ inputs.effective_deploy == 'true' && needs.platform_preflight.result == 'success' && (needs.platform_preflight.outputs.state == 'ABSENT' || needs.platform_preflight.outputs.state == 'OWNED') }}

    uses: ./.github/workflows/30-sub-platform.yaml
    with:
      environment: ${{ inputs.selected_environment }}
      deploy: true
      orchestrated_by_main: true

  # Phase 4E | Reconcile Observability -- Generic MAIN Desired-State Convergence Fix: MAIN ALWAYS reconciles Observability on Deploy whenever observability_preflight confirms it is safe (ABSENT or OWNED) -- same always-reconcile contract as platform_sync_once. 40-sub-observability.yaml's own idempotent Argo CD sync is what actually applies the current committed desired state (chart version, image digests, the cloudwatch-agent ServiceAccount role-arn, any future values-driven resource) -- this job never needs to learn a new resource name merely to keep permitting that reconciliation. No standalone specialist workflow is a required recovery/upgrade path.
  observability_sync_once:
    name: "Phase 4E | Reconcile Observability"

    needs:
      - observability_preflight
    if: ${{ inputs.effective_deploy == 'true' && needs.observability_preflight.result == 'success' && (needs.observability_preflight.outputs.state == 'ABSENT' || needs.observability_preflight.outputs.state == 'OWNED') }}

    uses: ./.github/workflows/40-sub-observability.yaml
    with:
      environment: ${{ inputs.selected_environment }}
      deploy: true
      orchestrated_by_main: true

  # Phase 4C | Validate GoldenGate Platform Healthy -- always() overrides GitHub's default implicit skip-on-skipped-dependency behavior -- the explicit result check below is what actually keeps this fail-closed. platform_sync_once now ALWAYS runs for both ABSENT and OWNED (never skipped on a healthy-looking preflight), so this job's own gating simplifies to "platform_preflight succeeded and platform_sync_once succeeded" -- the strict exact-desired-state check happens entirely in the classify step below (automation/phases/phase4/platform_acceptance.py), independent of which preflight state was observed. Reconciliation success alone is never treated as proof of health.
  validate_platform_ready:
    name: "Phase 4C | Validate GoldenGate Platform Healthy"

    needs:
      - platform_preflight
      - platform_sync_once
    if: ${{ always() && inputs.effective_deploy == 'true' && needs.platform_preflight.result == 'success' && needs.platform_sync_once.result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ inputs.selected_environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ inputs.selected_environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py ensure-kubectl

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the strict-acceptance step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Require GoldenGate Platform to be exactly HEALTHY
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
          # Read through a step-level environment variable, never interpolated directly into a shell statement or hardcoded here -- the same external-operational-configuration pattern 30-sub-platform.yaml itself uses for this variable. phase4_platform.py strict-acceptance validates it is non-empty before use.
          FLUENT_BIT_IMAGE: ${{ vars.FLUENT_BIT_IMAGE }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_platform.py strict-acceptance --environment "${{ inputs.selected_environment }}"

  # Phase 4F | Validate Observability Healthy -- always() overrides GitHub's default implicit skip-on-skipped-dependency behavior -- the explicit result check below is what actually keeps this fail-closed. observability_sync_once now ALWAYS runs for both ABSENT and OWNED (never skipped on a healthy-looking preflight), so this job's own gating simplifies to "observability_preflight succeeded and observability_sync_once succeeded" -- the strict exact-desired-state check happens entirely in the classify step below (automation/phases/phase4/observability_acceptance.py), independent of which preflight state was observed. Reconciliation success alone is never treated as proof of health.
  validate_observability_ready:
    name: "Phase 4F | Validate Observability Healthy"

    needs:
      - observability_preflight
      - observability_sync_once
    if: ${{ always() && inputs.effective_deploy == 'true' && needs.observability_preflight.result == 'success' && needs.observability_sync_once.result == 'success' }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ inputs.selected_environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ inputs.selected_environment }}" github-env >> "$GITHUB_ENV"

      - name: Ensure kubectl prerequisite
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py ensure-tools

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials are consumed ONLY by the strict-acceptance step below, never job-wide, never written to $GITHUB_ENV, never written to any state file.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Require Observability to be exactly HEALTHY
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_observability.py strict-acceptance --environment "${{ inputs.selected_environment }}"

  # Phase 4G | Validate Shared GoldenGate Secrets -- joins both the Platform and Observability branches before runtime work. Live Deployment Approval Topology Fix: no job-level environment: here -- this job is read-only (only validates that the three shared secrets already exist, never creates/mutates them), consumes only the proven repository-scoped vars.PROJECT_NAME_DEV, and is already covered end-to-end by the single goldengate_deploy_authorization approval upstream of it in the DAG (now behind the grouped Phase 3 wrapper). Phase 4 grouping: this job spans both DEPLOY and VALIDATE modes -- its own if: below (never the wrapper's own if:, which is always()) is what determines whether it legitimately runs in Validate mode.
  validate_shared_secrets_once:
    name: "Phase 4G | Validate Shared GoldenGate Secrets"

    needs:
      - validate_platform_ready
      - validate_observability_ready
    # Mode-aware gating preserved exactly: runs when terraform/platform/observability were legitimately skipped (deploy=false, MAIN Validate mode) -- but for a real deploy (effective_deploy=='true'), "skipped" is NOT success: this job must not run unless terraform_sync_once AND validate_platform_ready AND validate_observability_ready all actually succeeded, closing the path where an inventory-guard/terraform/platform/observability failure upstream (which makes those jobs skip rather than fail their own dependents) would otherwise let this read-only check -- and everything downstream of it -- proceed anyway.
    if: ${{ always() && inputs.result_validate_model == 'success' && (inputs.effective_deploy != 'true' || (inputs.result_terraform_sync_once == 'success' && needs.validate_platform_ready.result == 'success' && needs.validate_observability_ready.result == 'success')) }}

    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load canonical environment configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 automation/goldengate-environment.py --environment "${{ inputs.selected_environment }}" validate
          python3 automation/goldengate-environment.py --environment "${{ inputs.selected_environment }}" github-env >> "$GITHUB_ENV"

      - name: Verify Python prerequisites
        shell: bash
        run: |
          set -euo pipefail

          python3 --version

      # AWS Credential Isolation: output-credentials/output-env-credentials scoping matches the established Phase 1/3 pattern -- these temporary credentials (the source/build-account RUNNER_ROLE_ARN identity) are consumed ONLY by the validate step below, never job-wide, never written to $GITHUB_ENV. phase4_shared_secrets.py itself performs the subsequent sts:AssumeRole into EKS_DEPLOY_ROLE_ARN (the workload account) and confines those assumed credentials to a single subprocess-local environment mapping -- never GITHUB_ENV, never GITHUB_OUTPUT, never this job's own step-level env.
      - name: Configure AWS credentials
        id: aws_build_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false

      - name: Validate shared GoldenGate secrets
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws_build_credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws_build_credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws_build_credentials.outputs.aws-session-token }}
        run: |
          set -euo pipefail

          python3 automation/phases/phase4/phase4_shared_secrets.py validate --environment "${{ inputs.selected_environment }}"
