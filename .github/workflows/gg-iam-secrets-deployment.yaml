name: IAM/Secrets deployment
run-name: "Deploy IAM/Secrets for ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - dev

      terraform_version:
        required: false
        type: string
        default: "1.7.2"

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: "1.7.2"

permissions:
  id-token: write    # This is required for requesting the JWT
  contents: read     # This is required for actions/checkout
  packages: write    # Allow github.token to write packages
  pull-requests: read

jobs:
  validate_environment_config:
    name: Validate environment config + generated IAM policy sync

    # Read-only, local-only, no AWS credentials -- a direct manual run of this workflow (bypassing goldengate-eks-app.yaml's own validate_model gate) must not be able to apply stale/hand-edited IAM policy JSON that is out of sync with envs/<environment>/environment.yaml.
    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      aws_region: ${{ steps.resolve_environment.outputs.aws_region }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate envs/<environment>/environment.yaml
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${TARGET_ENVIRONMENT}" validate

      - name: Verify generated IAM policies are in sync with environment.yaml
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${TARGET_ENVIRONMENT}" render-iam-policies --check

      # The sole Terraform region source: envs/<environment>/environment.yaml via the canonical resolver, exposed as a job output for the apply job below -- never a second caller-supplied region input.
      - name: Resolve canonical Terraform region
        id: resolve_environment
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          AWS_REGION="$(python3 hack/goldengate-environment.py --environment "${TARGET_ENVIRONMENT}" get AWS_REGION)"

          if [ -z "${AWS_REGION}" ]; then
            echo "FAIL: canonical AWS_REGION resolved empty for environment ${TARGET_ENVIRONMENT} from envs/${TARGET_ENVIRONMENT}/environment.yaml."
            exit 1
          fi

          echo "aws_region=${AWS_REGION}" >> "$GITHUB_OUTPUT"

  apply:
    needs: validate_environment_config
    uses: AbuDhabiCommercialBank/adcb-reusable-workflows/.github/workflows/aws-terraform-apply.yaml@main
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      region: ${{ needs.validate_environment_config.outputs.aws_region }}
      terraform_version: ${{ inputs.terraform_version }}
