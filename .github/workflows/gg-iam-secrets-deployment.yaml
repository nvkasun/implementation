name: IAM/Secrets deployment
run-name: "Deploy ${{ github.event.inputs.environment }} on ${{ github.event.inputs.region }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - dev

      region:
        description: "AWS Region"
        type: choice
        required: true
        options:
          - eu-west-1

      terraform_version:
        required: false
        type: string
        default: "1.7.2"

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      region:
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: "1.7.2"

permissions:
  id-token: write    # This is required for requesting the JWT
  contents: read     # This is required for actions/checkout
  packages: write    # Allow github.token to write packages
  pull-requests: read

jobs:
  validate_environment_config:
    name: Validate environment config + generated IAM policy sync

    # Read-only, local-only, no AWS credentials -- a direct manual run of this workflow (bypassing goldengate-eks-app.yaml's own validate_model gate) must not be able to apply stale/hand-edited IAM policy JSON that is out of sync with envs/<environment>/environment.yaml.
    runs-on: codebuild-${{ vars.PROJECT_NAME_DEV }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate envs/<environment>/environment.yaml
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${TARGET_ENVIRONMENT}" validate

      - name: Verify generated IAM policies are in sync with environment.yaml
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          python3 hack/goldengate-environment.py --environment "${TARGET_ENVIRONMENT}" render-iam-policies --check

      # Phase 12 removes the separate `region` input; until then, fail closed on a region/environment.yaml mismatch.
      - name: Verify supplied region matches the canonical environment region
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          SUPPLIED_REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail

          CANONICAL_REGION="$(python3 hack/goldengate-environment.py --environment "${TARGET_ENVIRONMENT}" get AWS_REGION)"

          if [ "${SUPPLIED_REGION}" != "${CANONICAL_REGION}" ]; then
            echo "FAIL: the region input (${SUPPLIED_REGION}) does not match the canonical AWS_REGION (${CANONICAL_REGION}) for environment ${TARGET_ENVIRONMENT} in envs/${TARGET_ENVIRONMENT}/environment.yaml."
            echo "Refusing to apply Terraform for one environment's identity against a different region."
            exit 1
          fi

          echo "OK: supplied region ${SUPPLIED_REGION} matches the canonical region for environment ${TARGET_ENVIRONMENT}."

  apply:
    needs: validate_environment_config
    uses: AbuDhabiCommercialBank/adcb-reusable-workflows/.github/workflows/aws-terraform-apply.yaml@main
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      region: ${{ inputs.region }}
      terraform_version: ${{ inputs.terraform_version }}