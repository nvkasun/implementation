# Phase 3: environment topology-as-data document for the payments-ora-to-pg-001
# logical pipeline. Consumed starting in Phase 4 by
# monitoring/gg-monitor-core/inventory.py.
#
# Deliberately NOT under envs/dev/: the GoldenGate runtime deployment
# workflow scans envs/dev/* first-level folders as runtime deployment IDs --
# this is topology metadata, not a deployment.
#
# Why this file exists, and what it does NOT replace:
#   - DynamoDB CONFIG (envs/dev/dynamodb.tf) is a monitoring/alerting-policy
#     record only, mirroring the manager reference schema exactly. It
#     deliberately carries no endpoint, namespace, serviceName, or
#     secret-reference fields -- inspection of the manager reference code
#     (charts/gg-monitor/files/gg-monitor.py, charts/gg-deployment/files/
#     utility-sidecar.py) confirmed CONFIG is never read for that data.
#   - The manager's own equivalent of this file is a ConfigMap-mounted
#     topology (CONFIG_MAP_DIR=/etc/gg-topology, process-pipeline-map.json /
#     deployments.json) -- a structurally separate concept from DynamoDB
#     CONFIG. This document is this repository's own topology-as-data
#     artifact for the same purpose; it does not copy the manager's
#     ConfigMap/sidecar deployment mechanism, and it is NOT itself in the
#     exact manager deployments.json / process-pipeline-map.json format --
#     monitoring/gg-monitor-core/inventory.py (Phase 4) derives those
#     manager-compatible equivalents from this file plus
#     pipelines/deployments.yaml AT CONTAINER STARTUP, in memory; no
#     separate generated artifact/file is produced, and this document
#     remains the single canonical source.
#   - This is our source topology for the shared gg-monitor's GoldenGate
#     Admin REST polling (Phase 4, monitoring/gg-monitor-core/, port 8443
#     only -- the manager utility-sidecar this is modeled on polls only the
#     Admin REST API, never the separate PMS/metrics endpoint on 9015; each
#     runtime's metrics endpoint below is retained for a later, explicitly
#     implemented PMS phase and is currently UNUSED by gg-monitor-core).
#     The endpoints below are exactly what that passive-only monitor polls.
#     See helm/gg-monitor/templates/configmap.yaml for how this file reaches
#     the running monitor pod (a staged, byte-identical copy under
#     helm/gg-monitor/files/, re-staged by
#     .github/workflows/gg-monitor-core.yaml on every run -- Helm cannot
#     read files outside its own chart directory).
#   - Each admin endpoint's tlsServerName is the hostname the shared monitor
#     sends as TLS SNI and verifies the server certificate against -- it
#     intentionally differs from host (the internal Kubernetes Service DNS
#     name used for the actual TCP connection) because the shared wildcard
#     certificate's SAN matches the external Ingress hostname pattern
#     (*.goldengate-dev.adcbmis.local), not *.svc.cluster.local. The
#     connection still never leaves the cluster network -- only the TLS
#     identity check target differs from the connect address.
#   - No credentials, secret values, private keys, or tokens appear here --
#     only Secrets Manager object-name references, matching the same
#     objectName values already used by the runtime Helm charts'
#     SecretProviderClasses.
#
# recordType ownership (see envs/dev/dynamodb.tf for the authoritative
# statement): Terraform owns CONFIG; the shared gg-monitor (not yet
# deployed) owns LEASE, STATE#_deployment, and STATE#<process>. This
# document has no bearing on that ownership -- it is not a DynamoDB item.

pipelineId: payments-ora-to-pg-001
environment: dev

lifecycle:
  enabled: true
  state: runtime-ready

deployments:
  source:
    deploymentName: gg-oracle-payments-01
    deploymentType: oracle
    namespace: goldengate-dev
    serviceName: gg-oracle-payments-01

    # Internal Kubernetes Service DNS only -- this is what shared-monitor
    # polling must use. The external Ingress URL is not the primary
    # internal polling endpoint and is intentionally not listed here.
    endpoints:
      admin:
        scheme: https
        host: gg-oracle-payments-01.goldengate-dev.svc.cluster.local
        tlsServerName: gg-oracle-payments-01.goldengate-dev.adcbmis.local
        port: 8443
      distribution:
        scheme: https
        host: gg-oracle-payments-01.goldengate-dev.svc.cluster.local
        port: 9013
      # UNUSED by gg-monitor-core (Phase 4 polls Admin REST on 8443 only,
      # matching the manager utility-sidecar). Retained for a later,
      # explicitly implemented PMS phase.
      metrics:
        scheme: https
        host: gg-oracle-payments-01.goldengate-dev.svc.cluster.local
        port: 9015

    # Secrets Manager object-name references only -- never secret values.
    secretReferences:
      admin: dev/goldengate/source/admin
      tls: dev/goldengate/tls-certificate

    # No Extract, Replicat, or Distribution Path currently exists for this
    # deployment. Left empty rather than populated with placeholder names.
    processes:
      extracts: []
      distributionPaths: []
      replicats: []

  target:
    deploymentName: gg-postgresql-payments-01
    deploymentType: postgresql
    namespace: goldengate-dev
    serviceName: gg-postgresql-payments-01

    endpoints:
      admin:
        scheme: https
        host: gg-postgresql-payments-01.goldengate-dev.svc.cluster.local
        tlsServerName: gg-postgresql-payments-01.goldengate-dev.adcbmis.local
        port: 8443
      receiver:
        scheme: https
        host: gg-postgresql-payments-01.goldengate-dev.svc.cluster.local
        port: 9014
      # UNUSED by gg-monitor-core (Phase 4 polls Admin REST on 8443 only,
      # matching the manager utility-sidecar). Retained for a later,
      # explicitly implemented PMS phase.
      metrics:
        scheme: https
        host: gg-postgresql-payments-01.goldengate-dev.svc.cluster.local
        port: 9015

    secretReferences:
      admin: dev/goldengate/target/admin
      tls: dev/goldengate/tls-certificate

    processes:
      extracts: []
      distributionPaths: []
      replicats: []
