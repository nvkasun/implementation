There is another excellent test

Try SSH once:

ssh azureuser@10.114.80.10

wait until you get:

kex_exchange_identification: Connection closed by remote host

Then immediately go back to:

Azure VM → Run command → RunShellScript

and run:

journalctl -u sshd --since "5 minutes ago" --no-pager

If there is nothing corresponding to your SSH attempt, we can be almost certain the connection never reaches the VM's sshd.

If it does show something like:

Connection from x.x.x.x port xxxxx

then we investigate SSH itself.

