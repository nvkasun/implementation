
#!/usr/bin/env bash
set -u

NS="goldengate-dev"
POD="gg-postgresql-repltest-002-0"

echo "=== GoldenGate Service Startup Investigation ==="

kubectl exec -n "$NS" "$POD" \
  -c ogg-postgresql -- sh -c '

echo "--- Registered service configuration files ---"
find /u02/ServiceManager/var/run \
  -maxdepth 1 -name "*config.dat" \
  -printf "%f\n" 2>/dev/null | sort

echo
echo "--- Service Manager recent admin events ---"
grep -Ei "adminsrvr|administration|autostart|auto.start|restart|stopped" \
  /u02/ServiceManager/var/log/ServiceManager.log \
  2>/dev/null | tail -n 25 | cut -c 1-180

echo
echo "--- Administration Server process ---"
if ps -ef | grep -q "[/]u01/ogg/bin/adminsrvr"; then
  echo "RUNNING"
else
  echo "STOPPED"
fi

echo
echo "--- Administration Server configuration metadata ---"
stat -c "%n | size=%s | modified=%y" \
  /u02/ServiceManager/var/run/*adminsrvr* \
  2>/dev/null
'

echo
echo "=== Check Complete ==="
