Next read-only checks on CIBG VM2
Now run this first:
sudo -u oracle bash -c '
export ORACLE_HOME=/OraHome/ora26ai_DB_Home
export ORACLE_SID=DFCASHDEV2
export PATH=$ORACLE_HOME/bin:$PATH
export LD_LIBRARY_PATH=$ORACLE_HOME/lib
$ORACLE_HOME/bin/lsnrctl status LISTENER_DFCASHDEV2
'

Then:
sudo -u oracle bash -c '
export ORACLE_HOME=/OraHome/ora26ai_DB_Home
export ORACLE_SID=DFCASHDEV2
export PATH=$ORACLE_HOME/bin:$PATH
export LD_LIBRARY_PATH=$ORACLE_HOME/lib
$ORACLE_HOME/bin/lsnrctl services LISTENER_DFCASHDEV2
'

These are read-only. They should give us the registered services and READY handlers that our Python service needs to validate.
Then test local OS-authenticated SQL using the actual running SID:
sudo -u oracle bash -c '
export ORACLE_HOME=/OraHome/ora26ai_DB_Home
export ORACLE_SID=DFCASHDEV2
export PATH=$ORACLE_HOME/bin:$PATH
export LD_LIBRARY_PATH=$ORACLE_HOME/lib
printf "SELECT name, open_mode, database_role, cdb FROM v\$database;\nEXIT;\n" |
"$ORACLE_HOME/bin/sqlplus" -s "/ as sysdba"
'