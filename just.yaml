Now back up the current working hostname script:

sudo cp \
  /usr/local/sbin/oracle-hostname-fix.sh \
  /usr/local/sbin/oracle-hostname-fix.sh.backup-before-imds

Replace it completely with this:

sudo tee /usr/local/sbin/oracle-hostname-fix.sh >/dev/null <<'EOF'
#!/bin/bash

set -euo pipefail

IMDS_BASE="http://169.254.169.254/metadata/instance"
API_VERSION="2025-04-07"
MARKER="# ORACLE_VM_HOST_MAPPING"

NAME_URL="${IMDS_BASE}/compute/name?api-version=${API_VERSION}&format=text"
IP_URL="${IMDS_BASE}/network/interface/0/ipv4/ipAddress/0/privateIpAddress?api-version=${API_VERSION}&format=text"

echo "Starting Oracle Azure hostname configuration..."

if [[ ! -x /usr/bin/curl ]]; then
    echo "ERROR: /usr/bin/curl is not available."
    exit 1
fi

if [[ ! -x /usr/bin/hostnamectl ]]; then
    echo "ERROR: /usr/bin/hostnamectl is not available."
    exit 1
fi

VM_NAME=""
PRIVATE_IP=""

# Azure networking/IMDS may need a few seconds during early boot.
# Retry for up to approximately 60 seconds.
for attempt in $(seq 1 30); do

    VM_NAME=$(
        /usr/bin/curl \
            --noproxy "*" \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 2 \
            --max-time 5 \
            -H "Metadata:true" \
            "${NAME_URL}" 2>/dev/null || true
    )

    PRIVATE_IP=$(
        /usr/bin/curl \
            --noproxy "*" \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 2 \
            --max-time 5 \
            -H "Metadata:true" \
            "${IP_URL}" 2>/dev/null || true
    )

    VM_NAME=$(printf '%s' "${VM_NAME}" | tr -d '\r\n')
    PRIVATE_IP=$(printf '%s' "${PRIVATE_IP}" | tr -d '\r\n')

    if [[ -n "${VM_NAME}" && -n "${PRIVATE_IP}" ]]; then
        break
    fi

    echo "IMDS not ready yet - attempt ${attempt}/30"
    sleep 2
done

if [[ -z "${VM_NAME}" ]]; then
    echo "ERROR: Unable to obtain Azure VM name from IMDS."
    exit 1
fi

if [[ -z "${PRIVATE_IP}" ]]; then
    echo "ERROR: Unable to obtain Azure primary private IP from IMDS."
    exit 1
fi

if ! [[ "${PRIVATE_IP}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
    echo "ERROR: Invalid IPv4 address returned by IMDS: ${PRIVATE_IP}"
    exit 1
fi

echo "Azure VM name    : ${VM_NAME}"
echo "Azure private IP : ${PRIVATE_IP}"

CURRENT_HOSTNAME="$(hostname)"

if [[ "${CURRENT_HOSTNAME}" != "${VM_NAME}" ]]; then
    echo "Changing hostname:"
    echo "  Old: ${CURRENT_HOSTNAME}"
    echo "  New: ${VM_NAME}"

    /usr/bin/hostnamectl set-hostname "${VM_NAME}"
else
    echo "Hostname already correct: ${VM_NAME}"
fi

# Remove only the entry previously managed by this script.
TMP_HOSTS="$(mktemp)"

awk -v marker="${MARKER}" '
    index($0, marker) == 0
' /etc/hosts > "${TMP_HOSTS}"

printf '%s\t%s\t%s\n' \
    "${PRIVATE_IP}" \
    "${VM_NAME}" \
    "${MARKER}" >> "${TMP_HOSTS}"

# Write into the existing /etc/hosts file instead of replacing its inode.
cat "${TMP_HOSTS}" > /etc/hosts
rm -f "${TMP_HOSTS}"

echo
echo "Current managed /etc/hosts entry:"
grep -F "${MARKER}" /etc/hosts

RESOLVED_IP="$(
    getent ahostsv4 "${VM_NAME}" 2>/dev/null |
    awk 'NR == 1 {print $1}'
)"

if [[ "${RESOLVED_IP}" != "${PRIVATE_IP}" ]]; then
    echo "ERROR: Hostname ${VM_NAME} resolved to '${RESOLVED_IP}', expected '${PRIVATE_IP}'."
    exit 1
fi

echo
echo "Hostname resolution verified:"
echo "${VM_NAME} -> ${RESOLVED_IP}"

echo
echo "Oracle hostname mapping configured successfully."
EOF

Set the permissions:

sudo chown root:root /usr/local/sbin/oracle-hostname-fix.sh
sudo chmod 755 /usr/local/sbin/oracle-hostname-fix.sh

Now replace the hostname systemd unit so the order is unambiguous:

sudo cp \
  /etc/systemd/system/oracle-hostname-fix.service \
  /etc/systemd/system/oracle-hostname-fix.service.backup-before-imds

Then:

sudo tee /etc/systemd/system/oracle-hostname-fix.service >/dev/null <<'EOF'
[Unit]
Description=Configure Oracle VM hostname from Azure IMDS
Wants=network-online.target
After=network-online.target
Before=oracle-database.service

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/oracle-hostname-fix.sh
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
EOF

Reload and verify:

sudo systemctl daemon-reload

sudo systemd-analyze verify \
  /etc/systemd/system/oracle-hostname-fix.service

No output from systemd-analyze verify = good.

Your oracle-database.service already has the important dependency we created earlier:

After=network-online.target oracle-hostname-fix.service
Requires=oracle-hostname-fix.service

So do not modify oracle-database.service now. That means our final boot dependency becomes:

network-online
      ↓
oracle-hostname-fix
      ↓
oracle-database
      ↓
oracle-health

Now test the new hostname script without rebooting yet:

