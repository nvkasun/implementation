First — check VM4 before restarting

On VM4 as your normal azureuser, run:

hostname

sudo ss -lntp | grep 1521
sudo ss -lntp | grep 8080

sudo systemctl status oracle-health --no-pager
sudo systemctl is-enabled oracle-health

sudo firewall-cmd --list-all

Then check the listener as Oracle:

sudo su - oracle
export ORACLE_HOME=/u01/app/oracle/product/21.0.0/dbhome_1
export ORACLE_SID=ORCL
export PATH=$ORACLE_HOME/bin:$PATH

lsnrctl status

Then:

sqlplus / as sysdba

Inside SQL*Plus:

select instance_name, status from v$instance;

select name, open_mode from v$database;

show pdbs;

exit

Then return to azureuser:

exit

Finally check the health endpoint:

curl -v http://127.0.0.1:8080/health

Ideally before reboot we see:

ORCL      OPEN
database  READ WRITE
PDB1      READ WRITE
listener  1521
health    HTTP 200
Then reboot VM4

From azureuser:

sudo reboot

Reconnect after the VM comes back.

Do not run lsnrctl start, startup, or restart the health service yet.

Immediately run:

uptime

sudo ss -lntp | grep 1521
sudo ss -lntp | grep 8080

sudo systemctl status oracle-health --no-pager

Then:

curl -v http://127.0.0.1:8080/health

If that already returns:

HTTP/1.x 200

with something like:

"healthy": true

that's a very strong sign that Oracle and the listener came back correctly.

Then confirm Oracle itself:

sudo su - oracle
export ORACLE_HOME=/u01/app/oracle/product/21.0.0/dbhome_1
export ORACLE_SID=ORCL
export PATH=$ORACLE_HOME/bin:$PATH

lsnrctl status

Then:

sqlplus / as sysdba

Run:

select instance_name, status from v$instance;
select name, open_mode from v$database;
show pdbs;
exit