#!/bin/bash

set -euo pipefail

SCRIPT_VERSION="4.0-db-sid-config"
DB_SID="${DB_SID:-ORCL}"
TARGET_PDB="${TARGET_PDB:-}"
TARGET_SERVICE="${TARGET_SERVICE:-}"
HEALTH_PORT="${HEALTH_PORT:-8080}"
MAX_ACTIVE_SESSIONS="${MAX_ACTIVE_SESSIONS:-}"
MAX_SESSION_UTILIZATION_PERCENT="${MAX_SESSION_UTILIZATION_PERCENT:-}"
MAX_BLOCKING_SESSIONS="${MAX_BLOCKING_SESSIONS:-}"

INSTALL_DIR="/opt/oracle-health"
HEALTH_SCRIPT="${INSTALL_DIR}/oracle_health.py"
SERVICE_FILE="/etc/systemd/system/oracle-health.service"
ENV_FILE="/etc/oracle-health.env"
ORATAB="${ORATAB:-/etc/oratab}"

echo "Oracle health-agent installer ${SCRIPT_VERSION}"
echo "Configured DB_SID=${DB_SID}"

if [ "$(id -u)" -ne 0 ]; then
  echo "ERROR: Run this script with sudo or as root."
  exit 1
fi

if [ -z "${DB_SID}" ]; then
  echo "ERROR: DB_SID must be configured."
  exit 1
fi

if ss -lnt 2>/dev/null | awk '{print $4}' | grep -Eq "(^|:)${HEALTH_PORT}$"; then
  echo "ERROR: TCP port ${HEALTH_PORT} is already in use."
  ss -lntp 2>/dev/null | grep -E "[:.]${HEALTH_PORT}[[:space:]]" || true
  exit 1
fi

PYTHON="${PYTHON:-$(command -v python || true)}"

if [ -z "${PYTHON}" ] || [ ! -x "${PYTHON}" ]; then
  echo "ERROR: Python executable could not be located."
  exit 1
fi

if [ ! -r "${ORATAB}" ]; then
  echo "ERROR: Oracle inventory file '${ORATAB}' is not readable."
  exit 1
fi

ORACLE_HOME="$(
  awk -F: -v sid="${DB_SID}" '
    $0 !~ /^[[:space:]]*#/ && NF >= 2 {
      current_sid=$1
      home=$2
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", current_sid)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", home)
      if (toupper(current_sid) == toupper(sid) && home != "") {
        print home
        exit
      }
    }
  ' "${ORATAB}"
)"

if [ -z "${ORACLE_HOME}" ]; then
  echo "ERROR: DB_SID '${DB_SID}' was not found in ${ORATAB}."
  echo "Configured Oracle entries:"
  awk -F: '
    $0 !~ /^[[:space:]]*#/ && NF >= 2 && $1 != "" && $2 != "" {
      print "  SID=" $1 " ORACLE_HOME=" $2
    }
  ' "${ORATAB}"
  exit 1
fi

ORACLE_SID="${DB_SID}"
SQLPLUS="${ORACLE_HOME}/bin/sqlplus"
LSNRCTL="${ORACLE_HOME}/bin/lsnrctl"
ORACLE_BINARY="${ORACLE_HOME}/bin/oracle"

if [ ! -x "${SQLPLUS}" ]; then
  echo "ERROR: SQLPlus not found at ${SQLPLUS}."
  exit 1
fi

if [ ! -x "${LSNRCTL}" ]; then
  echo "ERROR: LSNRCTL not found at ${LSNRCTL}."
  exit 1
fi

ORACLE_USER=""

if [ -e "${ORACLE_BINARY}" ]; then
  ORACLE_USER="$(stat -c '%U' "${ORACLE_BINARY}" 2>/dev/null || true)"
fi

if [ -z "${ORACLE_USER}" ] || [ "${ORACLE_USER}" = "UNKNOWN" ]; then
  ORACLE_USER="$(stat -c '%U' "${SQLPLUS}" 2>/dev/null || true)"
fi

if [ -z "${ORACLE_USER}" ] || ! id "${ORACLE_USER}" >/dev/null 2>&1; then
  echo "ERROR: Unable to determine the Oracle OS user for ${ORACLE_HOME}."
  exit 1
fi

ORACLE_GROUP="$(id -gn "${ORACLE_USER}")"

echo "Oracle health-agent configuration:"
echo "DB_SID=${DB_SID}"
echo "ORACLE_HOME=${ORACLE_HOME}"
echo "ORACLE_USER=${ORACLE_USER}"
if [ -n "${TARGET_PDB}" ]; then
  echo "TARGET_PDB=${TARGET_PDB}"
else
  echo "TARGET_PDB=auto-discover"
fi

VALIDATION_OUTPUT="$(
  sudo -u "${ORACLE_USER}" env \
    ORACLE_HOME="${ORACLE_HOME}" \
    ORACLE_SID="${ORACLE_SID}" \
    PATH="${ORACLE_HOME}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin" \
    "${SQLPLUS}" -s "/ as sysdba" <<'SQL'
WHENEVER SQLERROR EXIT 2
WHENEVER OSERROR EXIT 3
SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
SELECT 'INSTANCE_NAME=' || TRIM(instance_name) FROM v$instance;
SELECT 'INSTANCE_STATUS=' || TRIM(status) FROM v$instance;
SELECT 'DATABASE_STATUS=' || TRIM(database_status) FROM v$instance;
EXIT;
SQL
)" || {
  echo "ERROR: Unable to connect locally to Oracle SID '${ORACLE_SID}'."
  exit 1
}

echo "${VALIDATION_OUTPUT}"

if ! echo "${VALIDATION_OUTPUT}" | grep -q '^INSTANCE_STATUS=OPEN$'; then
  echo "ERROR: Oracle instance '${ORACLE_SID}' is not OPEN."
  exit 1
fi

if ! echo "${VALIDATION_OUTPUT}" | grep -q '^DATABASE_STATUS=ACTIVE$'; then
  echo "ERROR: Oracle database '${ORACLE_SID}' is not ACTIVE."
  exit 1
fi

mkdir -p "${INSTALL_DIR}"

cat > "${HEALTH_SCRIPT}" <<'PY'
#!/usr/bin/env python

import BaseHTTPServer
import SocketServer
import json
import os
import re
import socket
import subprocess
import threading
import time

HOST = os.environ.get("HEALTH_HOST", "0.0.0.0")
HEALTH_PORT = int(os.environ.get("HEALTH_PORT", "8080"))

ORACLE_HOME = os.environ.get("ORACLE_HOME", "").strip()
ORACLE_SID = os.environ.get("ORACLE_SID", "").strip()

TARGET_PDB = os.environ.get("TARGET_PDB", "").strip()
TARGET_SERVICE = os.environ.get("TARGET_SERVICE", "").strip()

MAX_ACTIVE_SESSIONS = os.environ.get(
    "MAX_ACTIVE_SESSIONS",
    ""
).strip()

MAX_SESSION_UTILIZATION_PERCENT = os.environ.get(
    "MAX_SESSION_UTILIZATION_PERCENT",
    ""
).strip()

MAX_BLOCKING_SESSIONS = os.environ.get(
    "MAX_BLOCKING_SESSIONS",
    ""
).strip()

CHECK_INTERVAL = int(os.environ.get("CHECK_INTERVAL", "5"))
SUCCESS_THRESHOLD = int(os.environ.get("SUCCESS_THRESHOLD", "2"))
FAILURE_THRESHOLD = int(os.environ.get("FAILURE_THRESHOLD", "3"))
SQL_TIMEOUT = int(os.environ.get("SQL_TIMEOUT", "8"))
COMMAND_TIMEOUT = int(os.environ.get("COMMAND_TIMEOUT", "8"))

SQLPLUS = os.path.join(ORACLE_HOME, "bin", "sqlplus")
LSNRCTL = os.path.join(ORACLE_HOME, "bin", "lsnrctl")

state_lock = threading.Lock()

state = {
    "healthy": False,
    "status": "STARTING",
    "oracle_sid": ORACLE_SID or None,
    "database_name": None,
    "database_role": None,
    "cdb": None,
    "target_pdb": None,
    "target_service": None,
    "pdb_open_mode": None,
    "pdb_restricted": None,
    "sql_query": False,
    "listener_running": False,
    "listener_name": None,
    "listener_port": None,
    "listener_reachable": False,
    "service_registered": False,
    "service_ready": False,
    "active_sessions": None,
    "total_user_sessions": None,
    "blocked_sessions": None,
    "blocking_sessions": None,
    "session_current_utilization": None,
    "session_limit": None,
    "session_utilization_percent": None,
    "consecutive_successes": 0,
    "consecutive_failures": 0,
    "last_check": None,
    "last_error": None
}


def oracle_environment():
    env = os.environ.copy()
    env["ORACLE_HOME"] = ORACLE_HOME
    env["ORACLE_SID"] = ORACLE_SID
    env["PATH"] = ORACLE_HOME + "/bin:" + env.get("PATH", "")
    return env


def run_process(command, input_data=None, timeout=COMMAND_TIMEOUT):
    process = subprocess.Popen(
        command,
        stdin=subprocess.PIPE if input_data is not None else None,
        stdout=subprocess.PIPE,
        stderr=subprocess.PIPE,
        env=oracle_environment()
    )

    if input_data is not None:
        process.stdin.write(input_data)
        process.stdin.close()

    start_time = time.time()

    while process.poll() is None:
        if time.time() - start_time > timeout:
            process.kill()

            try:
                process.wait()
            except Exception:
                pass

            raise RuntimeError(
                "Command timed out: %s" % " ".join(command)
            )

        time.sleep(0.1)

    stdout = process.stdout.read()
    stderr = process.stderr.read()

    return process.returncode, stdout, stderr


def validate_runtime():
    if not ORACLE_HOME:
        raise RuntimeError("ORACLE_HOME is not configured")

    if not ORACLE_SID:
        raise RuntimeError("ORACLE_SID is not configured")

    if not os.path.isfile(SQLPLUS) or not os.access(SQLPLUS, os.X_OK):
        raise RuntimeError(
            "SQLPlus is not executable at %s" % SQLPLUS
        )

    if not os.path.isfile(LSNRCTL) or not os.access(LSNRCTL, os.X_OK):
        raise RuntimeError(
            "LSNRCTL is not executable at %s" % LSNRCTL
        )


def run_sql(sql):
    return_code, stdout, stderr = run_process(
        [SQLPLUS, "-s", "/ as sysdba"],
        input_data=sql,
        timeout=SQL_TIMEOUT
    )

    if return_code != 0:
        raise RuntimeError(
            "SQLPlus failed: %s" %
            (
                stderr.strip() or
                stdout.strip() or
                "exit code %s" % return_code
            )
        )

    return stdout


def collect_database_inventory():
    sql = """
WHENEVER SQLERROR EXIT 2
WHENEVER OSERROR EXIT 3
SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF TRIMSPOOL ON

SELECT 'CHECK=' || COUNT(*)
FROM dual;

SELECT 'DB_NAME=' || TRIM(name)
FROM v$database;

SELECT 'DB_OPEN_MODE=' || TRIM(open_mode)
FROM v$database;

SELECT 'DATABASE_ROLE=' || TRIM(database_role)
FROM v$database;

SELECT 'CDB=' || TRIM(cdb)
FROM v$database;

SELECT
    'PDB=' ||
    TRIM(name) || '|' ||
    con_id || '|' ||
    TRIM(open_mode) || '|' ||
    TRIM(restricted)
FROM v$pdbs
WHERE UPPER(name) <> 'PDB$SEED'
ORDER BY con_id;

SELECT
    'SERVICE=' ||
    TRIM(name) || '|' ||
    TRIM(NVL(network_name, '')) || '|' ||
    con_id
FROM v$services
WHERE name NOT IN ('SYS$BACKGROUND', 'SYS$USERS')
ORDER BY con_id, name;

SELECT
    'SESSIONS=' ||
    con_id || '|' ||
    SUM(CASE WHEN type = 'USER' THEN 1 ELSE 0 END) || '|' ||
    SUM(
        CASE
            WHEN type = 'USER'
             AND status = 'ACTIVE'
            THEN 1
            ELSE 0
        END
    ) || '|' ||
    SUM(
        CASE
            WHEN type = 'USER'
             AND blocking_session IS NOT NULL
            THEN 1
            ELSE 0
        END
    )
FROM v$session
GROUP BY con_id
ORDER BY con_id;

SELECT
    'BLOCKERS=' ||
    w.con_id || '|' ||
    COUNT(DISTINCT b.sid)
FROM v$session w
JOIN v$session b
  ON b.sid = w.blocking_session
WHERE w.type = 'USER'
  AND w.blocking_session IS NOT NULL
GROUP BY w.con_id
ORDER BY w.con_id;

SELECT
    'SESSION_RESOURCE=' ||
    current_utilization || '|' ||
    limit_value
FROM v$resource_limit
WHERE resource_name = 'sessions';

EXIT;
"""

    output = run_sql(sql)

    inventory = {
        "database_name": None,
        "database_open_mode": None,
        "database_role": None,
        "cdb": None,
        "pdbs": [],
        "services": {},
        "sessions": {},
        "blockers": {},
        "session_current_utilization": None,
        "session_limit": None,
        "session_utilization_percent": None
    }

    check_ok = False

    for raw_line in output.splitlines():
        line = raw_line.strip()

        if not line:
            continue

        if line == "CHECK=1":
            check_ok = True
            continue

        if line.startswith("DB_NAME="):
            inventory["database_name"] = line.split("=", 1)[1].strip()

        elif line.startswith("DB_OPEN_MODE="):
            inventory["database_open_mode"] = line.split("=", 1)[1].strip()

        elif line.startswith("DATABASE_ROLE="):
            inventory["database_role"] = line.split("=", 1)[1].strip()

        elif line.startswith("CDB="):
            inventory["cdb"] = line.split("=", 1)[1].strip().upper()

        elif line.startswith("PDB="):
            parts = line.split("=", 1)[1].split("|")

            if len(parts) == 4:
                inventory["pdbs"].append({
                    "name": parts[0].strip(),
                    "con_id": int(parts[1]),
                    "open_mode": parts[2].strip(),
                    "restricted": parts[3].strip().upper()
                })

        elif line.startswith("SERVICE="):
            parts = line.split("=", 1)[1].split("|")

            if len(parts) == 3:
                con_id = int(parts[2])
                inventory["services"].setdefault(con_id, []).append({
                    "name": parts[0].strip(),
                    "network_name": parts[1].strip()
                })

        elif line.startswith("SESSIONS="):
            parts = line.split("=", 1)[1].split("|")

            if len(parts) == 4:
                inventory["sessions"][int(parts[0])] = {
                    "total": int(parts[1]),
                    "active": int(parts[2]),
                    "blocked": int(parts[3])
                }

        elif line.startswith("BLOCKERS="):
            parts = line.split("=", 1)[1].split("|")

            if len(parts) == 2:
                inventory["blockers"][int(parts[0])] = int(parts[1])

        elif line.startswith("SESSION_RESOURCE="):
            parts = line.split("=", 1)[1].split("|")

            if len(parts) == 2:
                try:
                    current_value = float(parts[0])
                    limit_value = float(parts[1])

                    inventory["session_current_utilization"] = int(current_value)
                    inventory["session_limit"] = int(limit_value)

                    if limit_value > 0:
                        inventory["session_utilization_percent"] = round(
                            (current_value / limit_value) * 100.0,
                            2
                        )
                except ValueError:
                    pass

    if not check_ok:
        raise RuntimeError(
            "Oracle validation query did not return CHECK=1"
        )

    if not inventory["database_name"]:
        raise RuntimeError(
            "Unable to determine Oracle database name"
        )

    return inventory


def choose_target_database(inventory):
    if inventory["database_open_mode"] != "READ WRITE":
        raise RuntimeError(
            "Database OPEN_MODE is %s" %
            (inventory["database_open_mode"] or "UNKNOWN")
        )

    if inventory["cdb"] != "YES":
        return {
            "name": inventory["database_name"],
            "con_id": 0,
            "open_mode": inventory["database_open_mode"],
            "restricted": "NO",
            "is_pdb": False
        }

    application_pdbs = inventory["pdbs"]

    if TARGET_PDB:
        matches = [
            pdb for pdb in application_pdbs
            if pdb["name"].upper() == TARGET_PDB.upper()
        ]

        if len(matches) != 1:
            raise RuntimeError(
                "Configured TARGET_PDB '%s' was not found" % TARGET_PDB
            )

        target = matches[0]
    else:
        if len(application_pdbs) == 0:
            raise RuntimeError(
                "No application PDB was discovered"
            )

        if len(application_pdbs) > 1:
            raise RuntimeError(
                "Multiple application PDBs discovered: %s. "
                "Set TARGET_PDB explicitly." %
                ", ".join([pdb["name"] for pdb in application_pdbs])
            )

        target = application_pdbs[0]

    if target["open_mode"] != "READ WRITE":
        raise RuntimeError(
            "Target PDB '%s' OPEN_MODE is %s" %
            (target["name"], target["open_mode"])
        )

    if target["restricted"] == "YES":
        raise RuntimeError(
            "Target PDB '%s' is in restricted mode" % target["name"]
        )

    target = dict(target)
    target["is_pdb"] = True
    return target


def choose_target_service(inventory, target):
    services = inventory["services"].get(target["con_id"], [])

    if not services:
        raise RuntimeError(
            "No Oracle service was discovered for '%s'" % target["name"]
        )

    if TARGET_SERVICE:
        matches = []

        for service in services:
            for value in [service["name"], service["network_name"]]:
                if value and value.upper() == TARGET_SERVICE.upper():
                    matches.append(service)
                    break

        if len(matches) != 1:
            raise RuntimeError(
                "Configured TARGET_SERVICE '%s' was not uniquely found for '%s'" %
                (TARGET_SERVICE, target["name"])
            )

        return matches[0]

    exact_matches = []

    for service in services:
        for value in [service["name"], service["network_name"]]:
            if value and value.upper() == target["name"].upper():
                exact_matches.append(service)
                break

    if len(exact_matches) == 1:
        return exact_matches[0]

    if len(services) == 1:
        return services[0]

    raise RuntimeError(
        "Multiple Oracle services discovered for '%s': %s. "
        "Set TARGET_SERVICE explicitly." %
        (
            target["name"],
            ", ".join([
                service["network_name"] or service["name"]
                for service in services
            ])
        )
    )


def service_display_name(service):
    return service["network_name"] or service["name"]


def service_match_names(service):
    names = []

    for value in [service["name"], service["network_name"]]:
        value = value.strip()

        if value and value.upper() not in [name.upper() for name in names]:
            names.append(value)

    return names


def check_target_sql(target):
    alter_container = ""

    if target["is_pdb"]:
        safe_name = target["name"].replace('"', '""')
        alter_container = 'ALTER SESSION SET CONTAINER = "%s";' % safe_name

    sql = """
WHENEVER SQLERROR EXIT 2
WHENEVER OSERROR EXIT 3
SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF TRIMSPOOL ON
%s
SELECT 'TARGET_CHECK=' || COUNT(*)
FROM dual;

SELECT 'TARGET_CONTAINER=' || SYS_CONTEXT('USERENV', 'CON_NAME')
FROM dual;

EXIT;
""" % alter_container

    output = run_sql(sql)

    if "TARGET_CHECK=1" not in output:
        raise RuntimeError(
            "SQL validation against target database failed"
        )

    return True


def get_default_listener_status():
    return_code, stdout, stderr = run_process(
        [LSNRCTL, "status"],
        timeout=COMMAND_TIMEOUT
    )

    if return_code != 0:
        raise RuntimeError(
            "Oracle listener status failed: %s" %
            (
                stderr.strip() or
                stdout.strip() or
                "exit code %s" % return_code
            )
        )

    return stdout


def discover_listener_name(status_output):
    match = re.search(
        r"^Alias\s+(.+?)\s*$",
        status_output,
        re.IGNORECASE | re.MULTILINE
    )

    if not match:
        raise RuntimeError(
            "Unable to determine Oracle listener name"
        )

    return match.group(1).strip()


def get_listener_services(listener_name):
    return_code, stdout, stderr = run_process(
        [LSNRCTL, "services", listener_name],
        timeout=COMMAND_TIMEOUT
    )

    if return_code != 0:
        raise RuntimeError(
            "Oracle listener services query failed: %s" %
            (
                stderr.strip() or
                stdout.strip() or
                "exit code %s" % return_code
            )
        )

    return stdout


def discover_listener_port(status_output):
    matches = re.findall(
        r"\(PROTOCOL=tcp\)[^\n]*?\(PORT=(\d+)\)",
        status_output,
        re.IGNORECASE
    )

    if not matches:
        raise RuntimeError(
            "Unable to determine Oracle listener TCP port"
        )

    ports = []

    for value in matches:
        port = int(value)

        if port not in ports:
            ports.append(port)

    if len(ports) != 1:
        raise RuntimeError(
            "Multiple Oracle listener TCP ports discovered: %s" %
            ", ".join([str(port) for port in ports])
        )

    return ports[0]


def check_listener_tcp(port):
    hosts = [
        "127.0.0.1",
        socket.gethostname(),
        socket.getfqdn()
    ]

    checked = []

    for host in hosts:
        if not host or host in checked:
            continue

        checked.append(host)

        try:
            sock = socket.create_connection((host, port), 2)
            sock.close()
            return True
        except Exception:
            pass

    return False


def check_service_registration(services_output, service_names):
    for service_name in service_names:
        pattern = (
            r'Service\s+"%s"\s+has.*?'
            r'(?=Service\s+"|\Z)'
        ) % re.escape(service_name)

        match = re.search(
            pattern,
            services_output,
            re.IGNORECASE | re.DOTALL
        )

        if not match:
            continue

        service_block = match.group(0)

        ready = re.search(
            r"\bstatus\s+READY\b",
            service_block,
            re.IGNORECASE
        ) is not None

        return True, ready

    return False, False


def inspect_listener(target_service):
    status_output = get_default_listener_status()
    listener_name = discover_listener_name(status_output)
    listener_port = discover_listener_port(status_output)
    listener_reachable = check_listener_tcp(listener_port)

    services_output = get_listener_services(listener_name)
    service_names = service_match_names(target_service)

    registered, ready = check_service_registration(
        services_output,
        service_names
    )

    return {
        "listener_running": True,
        "listener_name": listener_name,
        "listener_port": listener_port,
        "listener_reachable": listener_reachable,
        "service_registered": registered,
        "service_ready": ready
    }


def parse_optional_int(name, value):
    if not value:
        return None

    try:
        parsed = int(value)
    except ValueError:
        raise RuntimeError("%s must be an integer" % name)

    if parsed < 0:
        raise RuntimeError("%s cannot be negative" % name)

    return parsed


def parse_optional_float(name, value):
    if not value:
        return None

    try:
        parsed = float(value)
    except ValueError:
        raise RuntimeError("%s must be numeric" % name)

    if parsed < 0:
        raise RuntimeError("%s cannot be negative" % name)

    return parsed


def evaluate_thresholds(result):
    errors = []

    max_active = parse_optional_int(
        "MAX_ACTIVE_SESSIONS",
        MAX_ACTIVE_SESSIONS
    )

    max_blocking = parse_optional_int(
        "MAX_BLOCKING_SESSIONS",
        MAX_BLOCKING_SESSIONS
    )

    max_utilization = parse_optional_float(
        "MAX_SESSION_UTILIZATION_PERCENT",
        MAX_SESSION_UTILIZATION_PERCENT
    )

    if (
        max_active is not None and
        result["active_sessions"] is not None and
        result["active_sessions"] > max_active
    ):
        errors.append(
            "Active sessions %s exceeded configured maximum %s" %
            (result["active_sessions"], max_active)
        )

    if (
        max_blocking is not None and
        result["blocking_sessions"] is not None and
        result["blocking_sessions"] > max_blocking
    ):
        errors.append(
            "Blocking sessions %s exceeded configured maximum %s" %
            (result["blocking_sessions"], max_blocking)
        )

    if (
        max_utilization is not None and
        result["session_utilization_percent"] is not None and
        result["session_utilization_percent"] >= max_utilization
    ):
        errors.append(
            "Session utilization %.2f%% reached configured maximum %.2f%%" %
            (result["session_utilization_percent"], max_utilization)
        )

    return errors


def new_result():
    return {
        "oracle_sid": ORACLE_SID or None,
        "database_name": None,
        "database_role": None,
        "cdb": None,
        "target_pdb": None,
        "target_service": None,
        "pdb_open_mode": None,
        "pdb_restricted": None,
        "sql_query": False,
        "listener_running": False,
        "listener_name": None,
        "listener_port": None,
        "listener_reachable": False,
        "service_registered": False,
        "service_ready": False,
        "active_sessions": None,
        "total_user_sessions": None,
        "blocked_sessions": None,
        "blocking_sessions": None,
        "session_current_utilization": None,
        "session_limit": None,
        "session_utilization_percent": None
    }


def perform_health_check():
    result = new_result()
    errors = []

    validate_runtime()

    inventory = collect_database_inventory()

    result["database_name"] = inventory["database_name"]
    result["database_role"] = inventory["database_role"]
    result["cdb"] = inventory["cdb"]

    target = choose_target_database(inventory)
    target_service = choose_target_service(inventory, target)

    result["target_pdb"] = target["name"]
    result["target_service"] = service_display_name(target_service)
    result["pdb_open_mode"] = target["open_mode"]
    result["pdb_restricted"] = target["restricted"] == "YES"
    result["sql_query"] = check_target_sql(target)

    sessions = inventory["sessions"].get(
        target["con_id"],
        {"total": 0, "active": 0, "blocked": 0}
    )

    result["total_user_sessions"] = sessions["total"]
    result["active_sessions"] = sessions["active"]
    result["blocked_sessions"] = sessions["blocked"]
    result["blocking_sessions"] = inventory["blockers"].get(
        target["con_id"],
        0
    )
    result["session_current_utilization"] = inventory[
        "session_current_utilization"
    ]
    result["session_limit"] = inventory["session_limit"]
    result["session_utilization_percent"] = inventory[
        "session_utilization_percent"
    ]

    try:
        result.update(inspect_listener(target_service))
    except Exception as error:
        errors.append(str(error))

    if not result["listener_running"]:
        errors.append("Oracle listener is not running")

    if not result["listener_reachable"]:
        errors.append("Oracle listener TCP endpoint is not reachable")

    if not result["service_registered"]:
        errors.append(
            "Target Oracle service '%s' is not registered" %
            result["target_service"]
        )
    elif not result["service_ready"]:
        errors.append(
            "Target Oracle service '%s' is not READY" %
            result["target_service"]
        )

    if not result["sql_query"]:
        errors.append("SQL query against target database failed")

    errors.extend(evaluate_thresholds(result))

    return len(errors) == 0, result, errors


def monitor_database():
    while True:
        result = new_result()
        candidate_healthy = False
        errors = []

        try:
            candidate_healthy, result, errors = perform_health_check()
        except Exception as error:
            candidate_healthy = False
            errors = [str(error)]

        with state_lock:
            for key, value in result.items():
                state[key] = value

            state["last_check"] = int(time.time())
            state["last_error"] = "; ".join(errors) if errors else None

            if candidate_healthy:
                state["consecutive_successes"] += 1
                state["consecutive_failures"] = 0

                if state["consecutive_successes"] >= SUCCESS_THRESHOLD:
                    state["healthy"] = True
                    state["status"] = "HEALTHY"
            else:
                state["consecutive_successes"] = 0
                state["consecutive_failures"] += 1

                if state["consecutive_failures"] >= FAILURE_THRESHOLD:
                    state["healthy"] = False
                    state["status"] = "UNHEALTHY"

        time.sleep(CHECK_INTERVAL)


class HealthHandler(BaseHTTPServer.BaseHTTPRequestHandler):

    def do_GET(self):
        if self.path != "/health":
            self.send_response(404)
            self.end_headers()
            return

        with state_lock:
            response = dict(state)

        body = json.dumps(response, sort_keys=True)
        status_code = 200 if response["healthy"] else 503

        self.send_response(status_code)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

    def log_message(self, format, *args):
        return


class ThreadedHTTPServer(
    SocketServer.ThreadingMixIn,
    BaseHTTPServer.HTTPServer
):
    daemon_threads = True
    allow_reuse_address = True


if __name__ == "__main__":
    monitor_thread = threading.Thread(target=monitor_database)
    monitor_thread.daemon = True
    monitor_thread.start()

    server = ThreadedHTTPServer((HOST, HEALTH_PORT), HealthHandler)
    server.serve_forever()
PY

chown "${ORACLE_USER}:${ORACLE_GROUP}" "${HEALTH_SCRIPT}"
chmod 750 "${HEALTH_SCRIPT}"

cat > "${ENV_FILE}" <<EOF
ORACLE_HOME=${ORACLE_HOME}
ORACLE_SID=${ORACLE_SID}
HEALTH_PORT=${HEALTH_PORT}
EOF

if [ -n "${TARGET_PDB}" ]; then
  echo "TARGET_PDB=${TARGET_PDB}" >> "${ENV_FILE}"
fi

if [ -n "${TARGET_SERVICE}" ]; then
  echo "TARGET_SERVICE=${TARGET_SERVICE}" >> "${ENV_FILE}"
fi

if [ -n "${MAX_ACTIVE_SESSIONS}" ]; then
  echo "MAX_ACTIVE_SESSIONS=${MAX_ACTIVE_SESSIONS}" >> "${ENV_FILE}"
fi

if [ -n "${MAX_SESSION_UTILIZATION_PERCENT}" ]; then
  echo "MAX_SESSION_UTILIZATION_PERCENT=${MAX_SESSION_UTILIZATION_PERCENT}" >> "${ENV_FILE}"
fi

if [ -n "${MAX_BLOCKING_SESSIONS}" ]; then
  echo "MAX_BLOCKING_SESSIONS=${MAX_BLOCKING_SESSIONS}" >> "${ENV_FILE}"
fi

chmod 640 "${ENV_FILE}"
chown root:"${ORACLE_GROUP}" "${ENV_FILE}"

cat > "${SERVICE_FILE}" <<EOF
[Unit]
Description=Oracle Database Health Agent
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=${ORACLE_USER}
Group=${ORACLE_GROUP}
EnvironmentFile=${ENV_FILE}
Environment=PATH=${ORACLE_HOME}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
ExecStart=${PYTHON} ${HEALTH_SCRIPT}
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
EOF

systemctl daemon-reload
systemctl enable --now oracle-health.service

if systemctl is-active --quiet firewalld; then
  firewall-cmd --permanent \
    --add-rich-rule="rule family=\"ipv4\" source address=\"168.63.129.16/32\" port protocol=\"tcp\" port=\"${HEALTH_PORT}\" accept" \
    >/dev/null 2>&1 || true

  firewall-cmd --reload >/dev/null
fi

echo "Oracle health agent installed."
echo "ORACLE_USER=${ORACLE_USER}"
echo "ORACLE_SID=${ORACLE_SID}"
echo "ORACLE_HOME=${ORACLE_HOME}"
echo "HEALTH_PORT=${HEALTH_PORT}"
echo "Waiting for health checks..."

sleep 12

echo
systemctl --no-pager --full status oracle-health.service || true

echo
if command -v curl >/dev/null 2>&1; then
  curl -sS "http://127.0.0.1:${HEALTH_PORT}/health" || true
  echo
else
  echo "curl is not installed. Check http://127.0.0.1:${HEALTH_PORT}/health manually."
fi
