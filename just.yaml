sudo mkdir -p /opt/oracle-health

sudo cp ./install_oracle_health_agent.sh \
  /opt/oracle-health/oracle_health.py

sudo chown oracle:oinstall \
  /opt/oracle-health/oracle_health.py

sudo chmod 750 \
  /opt/oracle-health/oracle_health.py

sudo tee /etc/systemd/system/oracle-health.service >/dev/null <<'EOF'
[Unit]
Description=Oracle Database Health Agent
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=oracle
Group=oinstall
Environment=ORACLE_HOME=/u01/app/oracle/product/21.0.0/dbhome_1
Environment=ORACLE_SID=ORCL
Environment=HEALTH_PORT=8080
Environment=PATH=/u01/app/oracle/product/21.0.0/dbhome_1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
ExecStart=/usr/bin/python /opt/oracle-health/oracle_health.py
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
EOF

sudo systemctl daemon-reload
sudo systemctl enable --now oracle-health