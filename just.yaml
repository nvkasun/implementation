kubectl -n goldengate-dev exec \
  gg-oracle-repltest-002-0 -c ogg-oracle -- \
  bash -c '
set -o pipefail
curl -fsS --max-time 10 \
  -u "$OGG_ADMIN:$OGG_ADMIN_PWD" \
  http://127.0.0.1:9011/services/v2/deployments |
python3 -c '"'"'
import json, sys

try:
    data = json.load(sys.stdin)
    print("=== SERVICE MANAGER API ===")
    print("Root keys:", sorted(data.keys()) if isinstance(data, dict) else "not an object")

    response = data.get("response", {}) if isinstance(data, dict) else {}
    print("Response type:", type(response).__name__)

    if isinstance(response, dict):
        print("Response keys:", sorted(response.keys()))

    items = response.get("items", []) if isinstance(response, dict) else []
    print("Items count:", len(items) if isinstance(items, list) else "invalid")

    if isinstance(items, list):
        for i, item in enumerate(items):
            if isinstance(item, dict):
                print("Item", i, "keys:", sorted(item.keys()))
                print("Deployment name:", item.get("name", "NOT FOUND"))
except Exception as exc:
    print("ERROR:", type(exc).__name__, str(exc))
    sys.exit(1)
'"'"'
'