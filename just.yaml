
echo "========== GOLDENGATE DEV RESET INVENTORY =========="

echo
echo "1. Argo CD ApplicationSets"
kubectl -n argocd get applicationsets | grep -E 'NAME|goldengate-dev'

echo
echo "2. Argo CD Applications"
kubectl -n argocd get applications | grep -E 'NAME|goldengate-dev'

echo
echo "3. GoldenGate StatefulSets"
kubectl -n goldengate-dev get statefulsets

echo
echo "4. GoldenGate Pods"
kubectl -n goldengate-dev get pods -o wide

echo
echo "5. GoldenGate PVCs"
kubectl -n goldengate-dev get pvc -o wide

echo
echo "6. GoldenGate EFS StorageClasses"
kubectl get storageclass | grep -E 'NAME|gg-efs-dev'

echo
echo "7. GoldenGate Persistent Volumes"
kubectl get pv -o custom-columns='NAME:.metadata.name,STATUS:.status.phase,CLAIM:.spec.claimRef.name,EFS_HANDLE:.spec.csi.volumeHandle'

echo
echo "========== INVENTORY COMPLETE =========="
