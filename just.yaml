1. Change /etc/oratab from N to Y

You currently have:

DFCASHUAT1:/OraHome/ora26ai_DB_Home:N

As azureuser, first back it up:

sudo cp /etc/oratab /etc/oratab.backup-before-autostart

Then:

sudo sed -i \
's#^DFCASHUAT1:/OraHome/ora26ai_DB_Home:N#DFCASHUAT1:/OraHome/ora26ai_DB_Home:Y#' \
/etc/oratab

Verify:

grep DFCASHUAT1 /etc/oratab

Expected:

DFCASHUAT1:/OraHome/ora26ai_DB_Home:Y
2. Create the Oracle startup service

Create:

sudo vi /etc/systemd/system/oracle-database.service

Use this:

[Unit]
Description=Oracle Database and Listener
RequiresMountsFor=/OraHome /OraData
After=network-online.target oracle-hostname-fix.service
Wants=network-online.target
Requires=oracle-hostname-fix.service

[Service]
Type=oneshot
User=oracle
Group=dba
RemainAfterExit=yes

Environment="ORACLE_HOME=/OraHome/ora26ai_DB_Home"
Environment="ORACLE_SID=DFCASHUAT1"
Environment="PATH=/OraHome/ora26ai_DB_Home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin"

ExecStart=/bin/bash -c '/OraHome/ora26ai_DB_Home/bin/lsnrctl start >/tmp/oracle-listener-start.log 2>&1 || true; /OraHome/ora26ai_DB_Home/bin/dbstart /OraHome/ora26ai_DB_Home'
ExecStop=/bin/bash -c '/OraHome/ora26ai_DB_Home/bin/dbshut /OraHome/ora26ai_DB_Home; /OraHome/ora26ai_DB_Home/bin/lsnrctl stop || true'

TimeoutStartSec=300
TimeoutStopSec=300

[Install]
WantedBy=multi-user.target

Then:

sudo systemctl daemon-reload
sudo systemctl enable oracle-database.service

Check:

sudo systemctl is-enabled oracle-hostname-fix.service
sudo systemctl is-enabled oracle-database.service

Both should say:

enabled
3. Don't restart it right now

Your DB and listener are already running manually, so don't run:

sudo systemctl start oracle-database

on top of the current Oracle processes.

Instead, first validate the unit:

sudo systemd-analyze verify /etc/systemd/system/oracle-database.service