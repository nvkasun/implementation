
-- GoldenGate POC: MSSQL target final verification

SELECT
    DB_NAME() AS database_name,
    s.name AS schema_name,
    t.name AS table_name
FROM sys.tables t
JOIN sys.schemas s
    ON t.schema_id = s.schema_id
WHERE s.name = 'gg_poc'
  AND t.name = 'replication_test';

SELECT COUNT(*) AS initial_row_count
FROM gg_poc.replication_test;
