From Windows Command Prompt on the jump host, run:

scp azureuser@10.114.32.132:/opt/oracle-health/oracle_health.py C:\Users\Kasun\Downloads\oracle_health.py

Enter the VM1 azureuser password when prompted.

Then you should have:

C:\Users\Kasun\Downloads\oracle_health.py

If you get Permission denied because /opt/oracle-health/oracle_health.py isn't readable by azureuser, first on VM1 run:

sudo cp /opt/oracle-health/oracle_health.py /tmp/oracle_health.py
sudo chown azureuser:azureuser /tmp/oracle_health.py

Then from Windows:

scp azureuser@10.114.32.132:/tmp/oracle_health.py C:\Users\Kasun\Downloads\oracle_health.py

After confirming the file is downloaded, you can clean the temporary copy on VM1:

rm /tmp/oracle_health.py