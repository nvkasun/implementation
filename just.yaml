On VM1, run exactly these commands as oracle
export ORACLE_HOME=/u01/app/oracle/product/21.0.0/dbhome_1
export ORACLE_SID=ORCL
export PATH=$ORACLE_HOME/bin:$PATH

Confirm:

echo $ORACLE_HOME
echo $ORACLE_SID
which lsnrctl

You should get approximately:

/u01/app/oracle/product/21.0.0/dbhome_1
ORCL
/u01/app/oracle/product/21.0.0/dbhome_1/bin/lsnrctl

Now start the listener:

lsnrctl start

Do not put sudo in front.

Then:

lsnrctl status

We want to see something similar to:

STATUS of the LISTENER
...
Listening Endpoints Summary...
(DESCRIPTION=(ADDRESS=(PROTOCOL=tcp)(HOST=...)(PORT=1521)))

Then exit back to azureuser:

exit

and verify:

sudo ss -lntp | grep 1521

We should now see:

LISTEN ... :1521 ...
Then test VM1 from VM3

From 10.114.32.135:

timeout 5 bash -c '</dev/tcp/10.114.32.132/1521' \
&& echo "VM1 SUCCESS" || echo "VM1 FAILED"


=========================================================

First, start Oracle DB manually on VM1

You're already logged in as oracle and already have:

export ORACLE_HOME=/u01/app/oracle/product/21.0.0/dbhome_1
export ORACLE_SID=ORCL
export PATH=$ORACLE_HOME/bin:$PATH

You're currently inside SQL*Plus, so run:

startup;

Wait for:

ORACLE instance started.
Database mounted.
Database opened.

Then verify:

select instance_name, status from v$instance;

Expected roughly:

ORCL    OPEN

Then:

select name, open_mode from v$database;

Expected:

ORCL    READ WRITE

Then:

show pdbs;

Since your test client connects to:

pdb1

we want PDB1 to show:

READ WRITE

If PDB1 isn't open, run:

alter pluggable database PDB1 open;

Then make it survive future DB restarts:

alter pluggable database PDB1 save state;

Then force listener registration:

alter system register;

Exit:

exit

Now as the oracle user run:

lsnrctl status

This time you should not see:

The listener supports no services

You should see ORCL/PDB1 registered.

Then:

exit

to return to azureuser.

Check the health agent again

Run:

curl -v http://127.0.0.1:8080/health

This is the important test.

Previously:

HTTP 503
healthy: false

After Oracle is up, we want:

HTTP 200
healthy: true

with fields approximately showing:

{
  "listener_running": true,
  "listener_reachable": true,
  "oracle_service": "ORCL",
  "open_mode": "READ WRITE",
  "healthy": true
}

Once /health becomes 200, Azure's 168.63.129.16 probe should start considering VM1 healthy.

Then test from VM3 again

First direct:

timeout 5 bash -c '</dev/tcp/10.114.32.132/1521' \
&& echo "VM1 SUCCESS" || echo "VM1 FAILED"

Then wait maybe 10–20 seconds for the LB health probes and test:

timeout 5 bash -c '</dev/tcp/10.114.32.134/1521' \
&& echo "LB SUCCESS" || echo "LB FAILED"