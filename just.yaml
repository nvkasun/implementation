rpm -q azure-vm-utils 2>/dev/null || echo "azure-vm-utils not installed"

echo "=== Azure SR-IOV rules ==="
sudo ls -l \
  /usr/lib/udev/rules.d/*azure* \
  /etc/udev/rules.d/*azure* 2>/dev/null

echo "=== Look for MANA unmanaged configuration ==="
sudo grep -RniE 'mana|NM_UNMANAGED|AZURE_UNMANAGED_SRIOV' \
  /usr/lib/udev/rules.d \
  /etc/udev/rules.d \
  /etc/NetworkManager 2>/dev/null

echo "=== eth1 udev properties ==="
sudo udevadm info -q property -p /sys/class/net/eth1 \
  | grep -E 'NM_UNMANAGED|AZURE_UNMANAGED_SRIOV|ID_NET_MANAGED_BY' \
  || echo "No Azure unmanaged properties found"