while VM2 independently gets:

Azure VM2 metadata
name = vm-002-prod-...
IP   = <VM2 new IP>

                 ↓

/etc/hosts
<VM2-IP> vm-002-prod-...

There is zero subnet, VNet, IP, resource-group, or hostname hardcoding in this mechanism.

