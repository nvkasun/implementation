
set -euo pipefail

NS="argocd"

APPSETS=(
  goldengate-dev-mssql-repltest-001-appset
  goldengate-dev-oracle-repltest-002-appset
  goldengate-dev-postgresql-repltest-001-appset
  goldengate-dev-postgresql-repltest-002-appset
)

echo "=== VERIFY EXACT APPLICATIONSETS ==="

for appset in "${APPSETS[@]}"; do
  kubectl -n "$NS" get applicationset "$appset" \
    -o custom-columns='NAME:.metadata.name'
done

echo
echo "=== DELETE OLD GOLDENGATE RUNTIME APPLICATIONSETS ==="

for appset in "${APPSETS[@]}"; do
  kubectl -n "$NS" delete applicationset "$appset" \
    --wait=true
done

echo
echo "=== VERIFY REMAINING APPLICATIONS ==="

kubectl -n "$NS" get applicationsets
kubectl -n "$NS" get applications
kubectl -n goldengate-dev get statefulsets
kubectl -n goldengate-dev get pods

echo
echo "=== RUNTIME REMOVAL STAGE COMPLETED ==="
