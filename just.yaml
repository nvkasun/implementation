Before changing the code, check whether the listener is still running
Run these right now on VM2:
ps -ef | grep '[t]nslsnr'

then:
sudo ss -lntp | grep 1701

then run the same command that worked before:
sudo -u oraade env \
ORACLE_HOME=/OraHome/ora26ai_DB_Home \
ORACLE_SID=DFCASHDEV2 \
PATH=/OraHome/ora26ai_DB_Home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin \
LD_LIBRARY_PATH=/OraHome/ora26ai_DB_Home/lib \
/OraHome/ora26ai_DB_Home/bin/lsnrctl status LISTENER_DFCASHDEV2


Very useful exact comparison test
First get the health service PID:
systemctl show oracle-health.service -p MainPID

Then show what environment the service actually has:
sudo systemctl show oracle-health.service --property=Environment

Also:
sudo systemctl cat oracle-health.service