Hi Paleri, quick update on the Oracle DB load balancer POC. The end-to-end testing is now completed successfully.

I tested from a separate client VM using only the Azure Internal Load Balancer endpoint 10.114.32.134:1521/pdb1. The test establishes real Oracle sessions, inserts sample records, commits them, and identifies which backend handled each connection. All 20 test connections completed successfully with no failures.

In the first screenshot, with both DB VMs healthy, the connections were handled by VM1. Azure Load Balancer uses a 5-tuple hash-based distribution rather than round-robin, so traffic from a single client can be skewed to one backend even when both are healthy.

I then performed a failover test by stopping the health-agent service on VM1. Azure detected VM1 as unhealthy through the /health probe and automatically routed all new Oracle connections to VM2. Again, all 20 connections, inserts and commits completed successfully with zero failures, as shown in the second screenshot.

So the current implementation validates the full flow: Application → Azure LB → healthy Oracle backend, including health-based backend exclusion and automatic failover.