#!/usr/bin/env bash
# Read-only Oracle GoldenGate runtime startup evidence collector.
set -u
NS="goldengate-dev"
POD="gg-oracle-repltest-002-0"
CONTAINER="ogg-oracle"
K=(kubectl -n "$NS" exec "$POD" -c "$CONTAINER" --)
section(){ printf '\n===== %s =====\n' "$1"; }
section "Context and pod"
kubectl config current-context 2>&1
kubectl -n "$NS" get pod "$POD" -o jsonpath='pod={.metadata.name} phase={.status.phase} ready={.status.containerStatuses[0].ready}{"\n"}' 2>&1
section "Process and selected environment (no secret values)"
"${K[@]}" sh -c 'printf "PID1: "; tr "\000" " " </proc/1/cmdline; echo; for v in OGG_DEPLOYMENT OGG_DEPLOYMENT_HOME OGG_DEPLOYMENT_SCRIPTS OGG_HOME; do eval "x=\${$v-}"; printf "%s=%s\n" "$v" "$x"; done' 2>&1
section "Entrypoint shell and startup call sites"
"${K[@]}" sh -c 'p=/usr/local/bin/deployment-main.sh; if test -r "$p"; then head -n 1 "$p"; grep -nE "run_user_scripts|(^|[[:space:]])source[[:space:]]|replace-variables|start_ogg|start_nginx|deployment-init|OGG_DEPLOYMENT" "$p" | head -70; else echo "startup script unavailable"; fi' 2>&1
section "Setup hook directory metadata (not contents)"
"${K[@]}" sh -c 'if test -n "${OGG_DEPLOYMENT_SCRIPTS:-}"; then for d in "$OGG_DEPLOYMENT_SCRIPTS" "$OGG_DEPLOYMENT_SCRIPTS/setup" "$OGG_DEPLOYMENT_SCRIPTS/startup"; do if test -d "$d"; then printf "%s: PRESENT\n" "$d"; find "$d" -maxdepth 1 -mindepth 1 -printf "%f %y\n" 2>/dev/null | head -20; else printf "%s: MISSING\n" "$d"; fi; done; else echo "OGG_DEPLOYMENT_SCRIPTS unset"; fi' 2>&1
section "NGINX route inventory (only listen and location names)"
"${K[@]}" sh -c 'grep -hE "^[[:space:]]*(listen|location)[[:space:]]" /etc/nginx/*.conf 2>/dev/null | head -45' 2>&1
section "Service Manager response status and deployment names"
"${K[@]}" sh -c '
  for p in 9011 9000 8080 8443; do
    case "$p" in 8443) u="https://127.0.0.1:$p/services/v2/deployments"; tls="-k";; *) u="http://127.0.0.1:$p/services/v2/deployments"; tls="";; esac
    code=$(curl -s $tls --connect-timeout 1 --max-time 4 -o /dev/null -w "%{http_code}" "$u" 2>/dev/null) || code="ERR"
    printf "port %s unauthenticated HTTP=%s\n" "$p" "$code"
  done
  if test -n "${OGG_ADMIN:-}" && test -n "${OGG_ADMIN_PWD:-}"; then
    for u in "http://127.0.0.1:9011/services/v2/deployments" "https://127.0.0.1:8443/services/v2/deployments"; do
      case "$u" in https:*) tls="-k";; *) tls="";; esac
      curl -sS $tls --connect-timeout 1 --max-time 5 -u "$OGG_ADMIN:$OGG_ADMIN_PWD" "$u" -o /dev/null -w "authenticated endpoint ${u%%/services*}: HTTP=%{http_code}\n" 2>/dev/null || echo "request failed"
    done
  else echo "Admin env credentials unavailable; authenticated check skipped"; fi
' 2>&1
section "Registration file metadata (no contents)"
"${K[@]}" sh -c 'for f in /u02/ServiceManager/etc/conf/deploymentRegistry.dat /u02/Deployment/etc; do if test -e "$f"; then ls -ld "$f" | awk "{print \$1,\$5,\$9}"; else echo "MISSING: $f"; fi; done' 2>&1
section "Complete — read only"
