
-- PostgreSQL admin replication permissions
-- READ ONLY

SELECT
    current_database() AS database_name,
    current_user AS username,
    pg_has_role(
        current_user,
        'rds_replication',
        'MEMBER'
    ) AS has_rds_replication_role,
    has_database_privilege(
        current_user,
        current_database(),
        'CONNECT'
    ) AS has_connect_permission,
    has_schema_privilege(
        current_user,
        'gg_poc',
        'USAGE'
    ) AS has_schema_usage,
    has_table_privilege(
        current_user,
        'gg_poc.replication_test',
        'SELECT'
    ) AS has_table_select;
