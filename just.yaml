{
  "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
  "contentVersion": "1.0.0.0",
  "parameters": {
    "location": {
      "type": "string",
      "defaultValue": "uaenorth"
    },
    "osDiskResourceId": {
      "type": "string",
      "metadata": {
        "description": "Full ARM resource ID of VM04 OS managed disk."
      }
    },
    "dataDiskResourceId": {
      "type": "string",
      "metadata": {
        "description": "Full ARM resource ID of VM04 400 GB data disk."
      }
    },
    "diskEncryptionSetResourceId": {
      "type": "string",
      "metadata": {
        "description": "Full ARM resource ID of the Disk Encryption Set used by VM04."
      }
    },
    "osSnapshotName": {
      "type": "string",
      "defaultValue": "snap-vm004-os-rhel98"
    },
    "dataSnapshotName": {
      "type": "string",
      "defaultValue": "snap-vm004-data-400gb"
    }
  },
  "variables": {
    "commonTags": {
      "ApplicationName": "CloudFactory",
      "BusinessCriticality": "Low",
      "BusinessUnit": "TechnologyPlatform",
      "CostCenter": "219",
      "DataClassification": "General",
      "DeployedBy": "Manual",
      "Environment": "dev",
      "RequestReference": "PO15763"
    }
  },
  "resources": [
    {
      "type": "Microsoft.Compute/snapshots",
      "apiVersion": "2024-03-02",
      "name": "[parameters('osSnapshotName')]",
      "location": "[parameters('location')]",
      "sku": {
        "name": "Standard_ZRS"
      },
      "tags": "[variables('commonTags')]",
      "properties": {
        "creationData": {
          "createOption": "Copy",
          "sourceResourceId": "[parameters('osDiskResourceId')]"
        },
        "encryption": {
          "type": "EncryptionAtRestWithCustomerKey",
          "diskEncryptionSetId": "[parameters('diskEncryptionSetResourceId')]"
        },
        "incremental": false,
        "networkAccessPolicy": "DenyAll",
        "publicNetworkAccess": "Disabled"
      }
    },
    {
      "type": "Microsoft.Compute/snapshots",
      "apiVersion": "2024-03-02",
      "name": "[parameters('dataSnapshotName')]",
      "location": "[parameters('location')]",
      "sku": {
        "name": "Standard_ZRS"
      },
      "tags": "[variables('commonTags')]",
      "properties": {
        "creationData": {
          "createOption": "Copy",
          "sourceResourceId": "[parameters('dataDiskResourceId')]"
        },
        "encryption": {
          "type": "EncryptionAtRestWithCustomerKey",
          "diskEncryptionSetId": "[parameters('diskEncryptionSetResourceId')]"
        },
        "incremental": false,
        "networkAccessPolicy": "DenyAll",
        "publicNetworkAccess": "Disabled"
      }
    }
  ],
  "outputs": {
    "osSnapshotId": {
      "type": "string",
      "value": "[resourceId('Microsoft.Compute/snapshots', parameters('osSnapshotName'))]"
    },
    "dataSnapshotId": {
      "type": "string",
      "value": "[resourceId('Microsoft.Compute/snapshots', parameters('dataSnapshotName'))]"
    }
  }
}