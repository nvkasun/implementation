{
  "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
  "contentVersion": "1.0.0.0",

  "parameters": {
    "galleryName": {
      "type": "string",
      "defaultValue": "acgCloudFactorydevuaenorthoracledb",
      "metadata": {
        "description": "Existing Azure Compute Gallery name."
      }
    },

    "imageDefinitionName": {
      "type": "string",
      "defaultValue": "RHEL-9.8-oracle-db",
      "metadata": {
        "description": "Existing specialized image definition."
      }
    },

    "imageVersion": {
      "type": "string",
      "defaultValue": "4.0.1",
      "metadata": {
        "description": "New Azure Compute Gallery image version."
      }
    },

    "location": {
      "type": "string",
      "defaultValue": "uaenorth",
      "metadata": {
        "description": "Azure region containing the source OS disk, gallery and DES."
      }
    },

    "osDiskResourceId": {
      "type": "string",
      "defaultValue": "/subscriptions/1a233215-09f6-404f-8536-bc83100ba1fa/resourceGroups/rg-CloudFactory-dev-uaenorth-oracledb/providers/Microsoft.Compute/disks/vm-006-dev-uan-56ozvj-osdisk",
      "metadata": {
        "description": "Resource ID of VM6 OS disk only."
      }
    },

    "diskEncryptionSetResourceId": {
      "type": "string",
      "defaultValue": "/subscriptions/1a233215-09f6-404f-8536-bc83100ba1fa/resourceGroups/rg-CloudFactory-dev-uaenorth-oracledb/providers/Microsoft.Compute/diskEncryptionSets/vm-006-dev-uan-56ozvj-des",
      "metadata": {
        "description": "Disk Encryption Set used to CMK-encrypt the gallery OS disk image."
      }
    }
  },

  "variables": {
    "commonTags": {
      "ApplicationName": "CloudFactory",
      "BusinessCriticality": "Low",
      "BusinessUnit": "TechnologyPlatform",
      "BusinessUnitOwner": "TechnologyPlatform",
      "CostCenter": "219",
      "DataClassification": "General",
      "DeployedBy": "Manual",
      "Environment": "dev",
      "RequestReference": "P015763"
    }
  },

  "resources": [
    {
      "type": "Microsoft.Compute/galleries/images/versions",
      "apiVersion": "2024-03-03",

      "name": "[format('{0}/{1}/{2}', parameters('galleryName'), parameters('imageDefinitionName'), parameters('imageVersion'))]",

      "location": "[parameters('location')]",

      "tags": "[variables('commonTags')]",

      "properties": {
        "publishingProfile": {
          "excludeFromLatest": false,
          "replicaCount": 1,
          "replicationMode": "Full",
          "storageAccountType": "Standard_LRS",

          "targetRegions": [
            {
              "name": "[parameters('location')]",
              "regionalReplicaCount": 1,
              "storageAccountType": "Standard_LRS",
              "excludeFromLatest": false,

              "encryption": {
                "osDiskImage": {
                  "diskEncryptionSetId": "[parameters('diskEncryptionSetResourceId')]"
                }
              }
            }
          ]
        },

        "storageProfile": {
          "osDiskImage": {
            "source": {
              "id": "[parameters('osDiskResourceId')]"
            }
          }
        },

        "safetyProfile": {
          "allowDeletionOfReplicatedLocations": false,
          "blockDeletionBeforeEndOfLife": false
        }
      }
    }
  ],

  "outputs": {
    "imageVersionId": {
      "type": "string",
      "value": "[resourceId('Microsoft.Compute/galleries/images/versions', parameters('galleryName'), parameters('imageDefinitionName'), parameters('imageVersion'))]"
    },

    "sourceOsDiskId": {
      "type": "string",
      "value": "[parameters('osDiskResourceId')]"
    },

    "diskEncryptionSetId": {
      "type": "string",
      "value": "[parameters('diskEncryptionSetResourceId')]"
    }
  }
}