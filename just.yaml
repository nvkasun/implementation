#!/usr/bin/env bash
set -u

echo "===== GOLDENGATE STATEFULSETS ====="
kubectl get statefulset -n goldengate-dev \
  -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,DESIRED:.spec.replicas'

echo
echo "===== GOLDENGATE PODS ====="
kubectl get pods -n goldengate-dev \
  -o custom-columns='NAME:.metadata.name,READY:.status.containerStatuses[*].ready,PHASE:.status.phase,NODE:.spec.nodeName' \
  | grep -E 'NAME|gg-(oracle|postgresql|mssql)-repltest'

echo
echo "===== PERSISTENT STORAGE ====="
kubectl get pvc -n goldengate-dev \
  -o custom-columns='NAME:.metadata.name,STATUS:.status.phase,CAPACITY:.status.capacity.storage'

echo
echo "===== ARGO APPLICATIONS ====="
kubectl get applications -n argocd \
  -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status' \
  | grep -E 'NAME|goldengate'

echo
echo "===== MONITOR ====="
kubectl get deployment gg-monitor -n goldengate-monitoring \
  -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas'

echo
echo "===== U02 PERMISSIONS ====="
for POD in \
  gg-postgresql-repltest-001-0 \
  gg-mssql-repltest-001-0 \
  gg-oracle-repltest-002-0 \
  gg-postgresql-repltest-002-0
do
  echo "--- $POD ---"
  kubectl exec -n goldengate-dev "$POD" -- \
    stat -c '%a %U:%G %n' \
      /u02 \
      /u02/oggf \
      /u02/oggf/certificate \
    2>/dev/null || echo "CHECK FAILED"
done