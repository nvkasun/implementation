So let's temporarily allow only the jump VM to 8080 and retest. On VM1 run:

sudo firewall-cmd \
  --add-rich-rule='rule family="ipv4" source address="10.115.7.5/32" port protocol="tcp" port="8080" accept'

Don't use --permanent yet. Then confirm:

sudo firewall-cmd --list-all

You should now see two rich rules for 8080:

168.63.129.16/32 → 8080
10.115.7.5/32    → 8080

Then from the Windows jump VM:

curl -v --noproxy "*" http://10.114.32.132:8080/health