#!/usr/bin/env python

from __future__ import print_function

import getpass
import os
import socket
import subprocess
import sys
import time
import uuid
from collections import Counter
from datetime import datetime


LB_HOST = "10.114.32.134"
LB_PORT = 1521
SERVICE_NAME = "pdb1"

DB_USER = "SYSTEM"

ORACLE_HOME = "/u01/app/oracle/product/21.0.0/dbhome_1"
SQLPLUS = os.path.join(ORACLE_HOME, "bin", "sqlplus")

DEFAULT_CONNECTIONS = 20


def escape_sql(value):
    return value.replace("'", "''")


def build_sql(run_id, test_number, client_host):
    test_id = "{}-{:02d}".format(run_id, test_number)
    message = "Azure LB application test record {}".format(test_number)

    test_id_sql = escape_sql(test_id)
    message_sql = escape_sql(message)
    client_host_sql = escape_sql(client_host)

    return """
WHENEVER OSERROR EXIT 2
WHENEVER SQLERROR EXIT 3

SET HEADING OFF
SET FEEDBACK OFF
SET PAGESIZE 0
SET VERIFY OFF
SET ECHO OFF
SET TERMOUT ON
SET LINESIZE 1000
SET TRIMSPOOL ON

SELECT
    '__SESSION__|' ||
    SYS_CONTEXT('USERENV', 'SERVER_HOST') || '|' ||
    SYS_CONTEXT('USERENV', 'INSTANCE_NAME') || '|' ||
    SYS_CONTEXT('USERENV', 'SERVICE_NAME') || '|' ||
    SYS_CONTEXT('USERENV', 'CON_NAME')
FROM dual;

BEGIN
    EXECUTE IMMEDIATE '
        CREATE TABLE LB_TEST_DATA (
            TEST_ID        VARCHAR2(64) PRIMARY KEY,
            TEST_RUN       VARCHAR2(64),
            TEST_NUMBER    NUMBER,
            CLIENT_HOST    VARCHAR2(128),
            CLIENT_IP      VARCHAR2(64),
            BACKEND_HOST   VARCHAR2(128),
            INSTANCE_NAME  VARCHAR2(64),
            SERVICE_NAME   VARCHAR2(128),
            MESSAGE        VARCHAR2(200),
            CREATED_AT     TIMESTAMP
        )
    ';
EXCEPTION
    WHEN OTHERS THEN
        IF SQLCODE != -955 THEN
            RAISE;
        END IF;
END;
/

INSERT INTO LB_TEST_DATA (
    TEST_ID,
    TEST_RUN,
    TEST_NUMBER,
    CLIENT_HOST,
    CLIENT_IP,
    BACKEND_HOST,
    INSTANCE_NAME,
    SERVICE_NAME,
    MESSAGE,
    CREATED_AT
)
SELECT
    '{test_id}',
    '{run_id}',
    {test_number},
    '{client_host}',
    SYS_CONTEXT('USERENV', 'IP_ADDRESS'),
    SYS_CONTEXT('USERENV', 'SERVER_HOST'),
    SYS_CONTEXT('USERENV', 'INSTANCE_NAME'),
    SYS_CONTEXT('USERENV', 'SERVICE_NAME'),
    '{message}',
    SYSTIMESTAMP
FROM dual;

COMMIT;

SELECT
    '__INSERT_OK__|' ||
    TEST_ID || '|' ||
    BACKEND_HOST || '|' ||
    INSTANCE_NAME || '|' ||
    SERVICE_NAME
FROM LB_TEST_DATA
WHERE TEST_ID = '{test_id}';

EXIT 0
""".format(
        test_id=test_id_sql,
        run_id=escape_sql(run_id),
        test_number=test_number,
        client_host=client_host_sql,
        message=message_sql
    )


def run_connection(test_number, total, run_id, password, client_host):
    connect_string = "{}@//{}:{}/{}".format(
        DB_USER,
        LB_HOST,
        LB_PORT,
        SERVICE_NAME
    )

    command = [
        SQLPLUS,
        "-s",
        "-L",
        connect_string
    ]

    env = os.environ.copy()
    env["ORACLE_HOME"] = ORACLE_HOME
    env["PATH"] = ORACLE_HOME + "/bin:" + env.get("PATH", "")
    env["LD_LIBRARY_PATH"] = (
        ORACLE_HOME + "/lib:" + env.get("LD_LIBRARY_PATH", "")
    )

    sql = build_sql(
        run_id,
        test_number,
        client_host
    )

    print()
    print(
        "[{:02d}/{:02d}] START".format(
            test_number,
            total
        )
    )
    print(
        "          Opening new Oracle session -> "
        "{}:{}/{}".format(
            LB_HOST,
            LB_PORT,
            SERVICE_NAME
        )
    )

    start_time = time.time()

    process = subprocess.Popen(
        command,
        stdin=subprocess.PIPE,
        stdout=subprocess.PIPE,
        stderr=subprocess.STDOUT,
        env=env,
        universal_newlines=True,
        bufsize=1
    )

    process.stdin.write(password + "\n")
    process.stdin.write(sql)
    process.stdin.flush()
    process.stdin.close()

    backend_host = None
    instance_name = None
    service_name = None
    inserted = False
    raw_output = []

    while True:
        line = process.stdout.readline()

        if not line:
            break

        raw_output.append(line)
        clean = line.strip()

        if clean.startswith("__SESSION__|"):
            parts = clean.split("|")

            if len(parts) >= 5:
                backend_host = parts[1]
                instance_name = parts[2]
                service_name = parts[3]
                container_name = parts[4]

                print("          CONNECTION ESTABLISHED")
                print(
                    "          Selected backend : {}".format(
                        backend_host
                    )
                )
                print(
                    "          Oracle instance  : {}".format(
                        instance_name
                    )
                )
                print(
                    "          Oracle service   : {}".format(
                        service_name
                    )
                )
                print(
                    "          PDB/container    : {}".format(
                        container_name
                    )
                )

        elif clean.startswith("__INSERT_OK__|"):
            parts = clean.split("|")

            if len(parts) >= 5:
                inserted = True

                print(
                    "          DATA INSERT      : SUCCESS"
                )
                print(
                    "          Test record ID   : {}".format(
                        parts[1]
                    )
                )

    process.stdout.close()
    return_code = process.wait()

    elapsed = time.time() - start_time

    if return_code == 0 and backend_host and inserted:
        print(
            "          COMMIT            : SUCCESS"
        )
        print(
            "          SESSION CLOSED    : SUCCESS"
        )
        print(
            "          Duration          : {:.2f} seconds".format(
                elapsed
            )
        )
        print(
            "          RESULT            : PASS"
        )

        return True, backend_host

    print(
        "          RESULT            : FAILED"
    )
    print(
        "          SQL*Plus exit code: {}".format(
            return_code
        )
    )

    useful_lines = [
        line.strip()
        for line in raw_output
        if line.strip()
    ]

    if useful_lines:
        print("          SQL*Plus output:")

        for line in useful_lines[-10:]:
            print(
                "            {}".format(line)
            )

    return False, backend_host


def main():
    try:
        total_connections = int(sys.argv[1])
    except (IndexError, ValueError):
        total_connections = DEFAULT_CONNECTIONS

    if not os.path.isfile(SQLPLUS):
        print(
            "ERROR: SQL*Plus not found at {}".format(
                SQLPLUS
            )
        )
        sys.exit(1)

    client_host = socket.gethostname()

    run_id = "{}-{}".format(
        datetime.now().strftime("%Y%m%d%H%M%S"),
        uuid.uuid4().hex[:6]
    )

    print()
    print("Oracle Azure Load Balancer End-to-End Test")
    print("-------------------------------------------")
    print(
        "Client VM        : {}".format(
            client_host
        )
    )
    print(
        "LB endpoint      : {}:{}".format(
            LB_HOST,
            LB_PORT
        )
    )
    print(
        "Oracle service   : {}".format(
            SERVICE_NAME
        )
    )
    print(
        "Database user    : {}".format(
            DB_USER
        )
    )
    print(
        "Test connections : {}".format(
            total_connections
        )
    )
    print(
        "Test run ID      : {}".format(
            run_id
        )
    )

    print()
    print(
        "Each test creates a new Oracle connection through "
        "the Load Balancer."
    )
    print(
        "The selected backend VM is reported by Oracle "
        "after the session is established."
    )

    password = getpass.getpass(
        "\nOracle {} password: ".format(
            DB_USER
        )
    )

    backend_counts = Counter()
    successful = 0
    failed = 0

    for test_number in range(
        1,
        total_connections + 1
    ):
        success, backend = run_connection(
            test_number,
            total_connections,
            run_id,
            password,
            client_host
        )

        if success:
            successful += 1

            if backend:
                backend_counts[backend] += 1

        else:
            failed += 1

        time.sleep(0.5)

    print()
    print("Final Test Summary")
    print("------------------")
    print(
        "LB endpoint            : {}:{}/{}".format(
            LB_HOST,
            LB_PORT,
            SERVICE_NAME
        )
    )
    print(
        "Total connections      : {}".format(
            total_connections
        )
    )
    print(
        "Successful connections : {}".format(
            successful
        )
    )
    print(
        "Failed connections     : {}".format(
            failed
        )
    )

    print()
    print("Backend Distribution")
    print("--------------------")

    if backend_counts:
        for backend in sorted(backend_counts):
            print(
                "{:<35} {} connection(s)".format(
                    backend,
                    backend_counts[backend]
                )
            )
    else:
        print("No successful backend connections detected.")

    print()

    if (
        failed == 0 and
        successful == total_connections and
        len(backend_counts) >= 2
    ):
        print(
            "FINAL RESULT: PASS"
        )
        print(
            "Both Oracle backend VMs successfully received "
            "application connections through the Azure Load Balancer."
        )

    elif successful > 0 and len(backend_counts) == 1:
        print(
            "FINAL RESULT: PARTIAL PASS"
        )
        print(
            "Oracle connectivity through the Load Balancer is working, "
            "but only one backend VM was observed during this test run."
        )
        print(
            "Confirm that both Azure LB health probes report Healthy "
            "and rerun with more connections."
        )

    else:
        print(
            "FINAL RESULT: FAILED"
        )
        print(
            "One or more Oracle application connections failed."
        )


if __name__ == "__main__":
    main()