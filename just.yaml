
-- GoldenGate POC - RDS SQL Server msdb audit
-- READ ONLY

SELECT
    SUSER_SNAME() AS connected_login,
    USER_NAME() AS current_database_user,
    DB_NAME() AS current_database;

-- Check the login's mapping in msdb
SELECT
    dp.name AS msdb_user,
    dp.type_desc AS user_type,
    rp.name AS assigned_role
FROM msdb.sys.database_principals dp
LEFT JOIN msdb.sys.database_role_members drm
    ON dp.principal_id = drm.member_principal_id
LEFT JOIN msdb.sys.database_principals rp
    ON drm.role_principal_id = rp.principal_id
WHERE dp.sid = SUSER_SID()
ORDER BY dp.name, rp.name;

-- Check role membership in the msdb context
EXEC(N'
USE msdb;
SELECT
    DB_NAME() AS database_name,
    USER_NAME() AS database_user,
    IS_ROLEMEMBER(''SQLAgentUserRole'') AS is_sql_agent_user,
    IS_MEMBER(''db_owner'') AS is_db_owner;
');
