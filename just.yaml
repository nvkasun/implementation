#!/bin/bash

set -u

NS="goldengate-dev"
ARGO_NS="argocd"

OLD_IDS=(
  "gg-postgresql-repltest-01"
  "gg-mssql-repltest-01"
  "gg-oracle-repltest-01"
  "gg-postgresql-repltest-02"
)

NEW_IDS=(
  "gg-postgresql-repltest-001"
  "gg-mssql-repltest-001"
  "gg-oracle-repltest-002"
  "gg-postgresql-repltest-002"
)

echo
echo "============================================================"
echo "1. CURRENT KUBERNETES CONTEXT"
echo "============================================================"
kubectl config current-context
kubectl cluster-info 2>&1 | head -20

echo
echo "============================================================"
echo "2. CONFIRM NEW RUNTIME IDENTITIES DO NOT EXIST"
echo "============================================================"

for id in "${NEW_IDS[@]}"; do
  suffix="${id#gg-}"
  app="goldengate-dev-${suffix}"
  appset="${app}-appset"

  echo
  echo "----- NEW ID: ${id} -----"

  kubectl get applicationset "$appset" -n "$ARGO_NS" \
    --ignore-not-found \
    -o custom-columns='APPSET:.metadata.name'

  kubectl get application "$app" -n "$ARGO_NS" \
    --ignore-not-found \
    -o custom-columns='APP:.metadata.name'

  kubectl get statefulset "$id" -n "$NS" \
    --ignore-not-found \
    -o custom-columns='STS:.metadata.name'
done

echo
echo "============================================================"
echo "3. OLD ARGO APPLICATIONSET / APPLICATION OWNERSHIP"
echo "============================================================"

for id in "${OLD_IDS[@]}"; do
  suffix="${id#gg-}"
  app="goldengate-dev-${suffix}"
  appset="${app}-appset"

  echo
  echo "===== ${id} ====="

  echo "--- ApplicationSet ---"
  kubectl get applicationset "$appset" -n "$ARGO_NS" \
    -o jsonpath='NAME={.metadata.name}{"\n"}UID={.metadata.uid}{"\n"}ENV={.metadata.labels.goldengate\.adcb/environment}{"\n"}DEPLOYMENT_ID={.metadata.labels.goldengate\.adcb/deployment-id}{"\n"}'

  echo
  echo "--- Application ---"
  kubectl get application "$app" -n "$ARGO_NS" \
    -o jsonpath='NAME={.metadata.name}{"\n"}SYNC={.status.sync.status}{"\n"}HEALTH={.status.health.status}{"\n"}OWNER_KIND={.metadata.ownerReferences[0].kind}{"\n"}OWNER_NAME={.metadata.ownerReferences[0].name}{"\n"}OWNER_UID={.metadata.ownerReferences[0].uid}{"\n"}'

  echo
  echo "--- Application conditions ---"
  kubectl get application "$app" -n "$ARGO_NS" \
    -o jsonpath='{range .status.conditions[*]}TYPE={.type} MESSAGE={.message}{"\n"}{end}'
done

echo
echo "============================================================"
echo "4. RETAINED PVC -> PV -> EFS ACCESS POINT IDENTITY"
echo "============================================================"

for id in "${OLD_IDS[@]}"; do
  pvc="${id}-u02"

  echo
  echo "===== ${pvc} ====="

  pv=$(kubectl get pvc "$pvc" -n "$NS" -o jsonpath='{.spec.volumeName}')

  echo "PVC=$pvc"
  echo "PV=$pv"

  kubectl get pvc "$pvc" -n "$NS" \
    -o jsonpath='PVC_STATUS={.status.phase}{"\n"}STORAGECLASS={.spec.storageClassName}{"\n"}PVC_UID={.metadata.uid}{"\n"}'

  kubectl get pv "$pv" \
    -o jsonpath='PV_STATUS={.status.phase}{"\n"}RECLAIM_POLICY={.spec.persistentVolumeReclaimPolicy}{"\n"}CSI_DRIVER={.spec.csi.driver}{"\n"}VOLUME_HANDLE={.spec.csi.volumeHandle}{"\n"}CLAIM_NAMESPACE={.spec.claimRef.namespace}{"\n"}CLAIM_NAME={.spec.claimRef.name}{"\n"}'
done

echo
echo "============================================================"
echo "5. STATEFULSET -> U02 PVC REFERENCES"
echo "============================================================"

for id in "${OLD_IDS[@]}"; do
  echo
  echo "===== ${id} ====="

  kubectl get statefulset "$id" -n "$NS" \
    -o jsonpath='STS={.metadata.name}{"\n"}READY={.status.readyReplicas}{"\n"}REPLICAS={.status.replicas}{"\n"}{range .spec.template.spec.volumes[*]}VOLUME={.name} CLAIM={.persistentVolumeClaim.claimName}{"\n"}{end}'
done

echo
echo "============================================================"
echo "6. GOLDENGATE INIT-CONTAINER FAILURE DETAILS"
echo "============================================================"

for id in "${OLD_IDS[@]}"; do
  pod="${id}-0"

  echo
  echo "===== ${pod} ====="

  kubectl get pod "$pod" -n "$NS" \
    -o jsonpath='POD={.metadata.name}{"\n"}PHASE={.status.phase}{"\n"}NODE={.spec.nodeName}{"\n"}{range .status.initContainerStatuses[*]}INIT={.name} READY={.ready} RESTARTS={.restartCount} WAITING_REASON={.state.waiting.reason} WAITING_MESSAGE={.state.waiting.message} TERMINATED_REASON={.state.terminated.reason} EXIT_CODE={.state.terminated.exitCode}{"\n"}{end}'

  echo
  echo "--- prepare-u02-permissions logs ---"
  kubectl logs "$pod" -n "$NS" \
    -c prepare-u02-permissions \
    --tail=100 2>&1 || true

  echo
  echo "--- recent pod events ---"
  kubectl get events -n "$NS" \
    --field-selector involvedObject.name="$pod" \
    --sort-by='.lastTimestamp' 2>&1 | tail -20
done

echo
echo "============================================================"
echo "7. SUMMARY"
echo "============================================================"

kubectl get applications -n "$ARGO_NS" \
  -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status'

echo

kubectl get statefulsets,pods,pvc -n "$NS" -o wide