1. First exit from oraade

You're currently here:

[oraade@vm-004...]

Run:

exit

Make sure you're back to:

[azureuser@vm-004...]
2. Confirm the unit really contains oraade
sudo systemctl cat oracle-database.service | grep -E '^(User|Group)='

Expected:

User=oraade
Group=dba

Now also prove that oraade can write the exact directory that previously failed:

sudo -u oraade touch /OraHome/ora26ai_DB_Home/rdbms/log/oraade-write-test

Check:

ls -l /OraHome/ora26ai_DB_Home/rdbms/log/oraade-write-test

It should show oraade dba.

Then remove test file:

sudo rm -f /OraHome/ora26ai_DB_Home/rdbms/log/oraade-write-test

If that succeeds, the previous startup.log: Permission denied problem should be solved.

3. Actually restart the oneshot service

First stop it:

sudo systemctl stop oracle-database.service

Then check:

sudo systemctl status oracle-database.service --no-pager

We should see something such as:

Active: inactive (dead)

Also check whether listener stopped:

sudo ss -lntp | grep 1521 || echo "1521 not listening"

Now reload the unit once more:

sudo systemctl daemon-reload
sudo systemctl reset-failed oracle-database.service

Then start it fresh:

sudo systemctl start oracle-database.service

Immediately check:

sudo systemctl status oracle-database.service --no-pager

And only look at the new journal entries:

sudo journalctl -u oracle-database.service --since "2 minutes ago" --no-pager

This is much better than -n 80, because the old permission errors won't confuse us.

4. Verify Oracle, not only systemd

Now:

sudo -iu oraade

Then:

export ORACLE_HOME=/OraHome/ora26ai_DB_Home
export ORACLE_SID=DFCASHUAT1
export PATH=$ORACLE_HOME/bin:$PATH

Run:

sqlplus / as sysdba

Then:

select instance_name, status from v$instance;
select name, open_mode, database_role from v$database;
exit;

We need something like:

INSTANCE_NAME   STATUS
DFCASHUAT1      OPEN

and:

NAME       OPEN_MODE    DATABASE_ROLE
DFCASHUA   READ WRITE   PRIMARY

Then:

lsnrctl status
5. Finally verify the health endpoint

Exit back:

exit

Wait around 15 seconds:

sleep 15
curl -i http://127.0.0.1:8080/health

Expected:

HTTP/1.0 200 OK

with:

"healthy": true,
"status": "HEALTHY"