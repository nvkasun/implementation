#!/usr/bin/env bash
# Read-only GoldenGate target Admin API diagnostic; concise screenshot-friendly output.
set -u
NS=goldengate-dev
MON_NS=goldengate-monitoring
POD=gg-postgresql-repltest-002-0
APP=goldengate-dev-postgresql-repltest-002
SVC=gg-postgresql-repltest-002
say(){ printf '\n=== %s ===\n' "$1"; }
run(){ "$@" 2>&1 | tail -n 14; }
status=0
say '1/6 TARGET AND MONITOR READINESS'
kubectl get pod "$POD" -n "$NS" -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount,NODE:.spec.nodeName' 2>&1
kubectl get deployment gg-monitor -n "$MON_NS" -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,DESIRED:.spec.replicas' 2>&1
say '2/6 SERVICE ENDPOINTS'
kubectl get svc "$SVC" -n "$NS" -o custom-columns='NAME:.metadata.name,IP:.spec.clusterIP,PORTS:.spec.ports[*].port' 2>&1
kubectl get endpointslice -n "$NS" -l "kubernetes.io/service-name=$SVC" -o custom-columns='NAME:.metadata.name,IPS:.endpoints[*].addresses,READY:.endpoints[*].conditions.ready' 2>&1
say '3/6 ADMIN HTTPS RESPONSE (NO CREDENTIALS)'
# HTTP 401 here is expected for endpoints requiring authentication; check transport only.
# Run via kubectl exec if curl exists inside the runtime image; no TLS verification bypass hidden.
if kubectl exec -n "$NS" "$POD" -c ogg-postgresql -- sh -c 'command -v curl >/dev/null' >/dev/null 2>&1; then
  kubectl exec -n "$NS" "$POD" -c ogg-postgresql -- sh -c 'curl -skS --max-time 8 -o /dev/null -w "local https://127.0.0.1:8443/ => HTTP %{http_code}\n" https://127.0.0.1:8443/ 2>&1' | tail -n 4
else
  echo 'SKIP: curl unavailable inside target container'
fi
say '4/6 TARGET CONTAINER RECENT ERRORS (FILTERED)'
kubectl logs -n "$NS" "$POD" -c ogg-postgresql --since=20m --tail=250 2>&1 | grep -Ei 'admin|unauthoriz|forbidden|HTTP|error|failed|exception|listen|nginx' | tail -n 12 || true
say '5/6 MONITOR DISCOVERY ERRORS (FILTERED)'
kubectl logs -n "$MON_NS" deployment/gg-monitor --since=8m --tail=1200 2>&1 | grep -E 'gg-postgresql-repltest-002|listing extracts failed|listing replicats failed' | tail -n 14 | cut -c 1-200 || true
say '6/6 ARGO CD HEALTH'
kubectl get application "$APP" -n argocd -o json 2>/dev/null | jq -r '"sync=\(.status.sync.status // "unknown") health=\(.status.health.status // "unknown")", ((.status.conditions // [])[] | "condition=\(.type): \(.message)")' | cut -c 1-200 || echo 'Not available'
printf '\n=== NEXT ===\nShare screenshots of sections 3, 4 and 5. HTTPError in monitor logs alone does not expose HTTP status; do not paste credentials.\n'
