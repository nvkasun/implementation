# ============================================================
# Oracle on Azure - Managed Identity
# ============================================================

resource "azurerm_user_assigned_identity" "oracle_binary_vm" {
  count = var.oracle_vm_on_azure_enabled ? 1 : 0

  name                = "id-oracle-binary-vm-${var.environment}-uan"
  resource_group_name = module.oracle_vm_resource_group[0].rg_name
  location            = var.location

  tags = local.tags
}