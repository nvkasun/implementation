#!/usr/bin/env bash
set -u

NODE="ip-10-238-186-172.eu-west-1.compute.internal"

section() {
  echo
  echo "===== $1 ====="
}

section "SECRETS STORE DAEMONSETS"
kubectl get daemonset -A \
  -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,DESIRED:.status.desiredNumberScheduled,CURRENT:.status.currentNumberScheduled,READY:.status.numberReady,AVAILABLE:.status.numberAvailable' \
  2>/dev/null \
  | grep -Ei 'secret|provider|csi' || true

section "SECRETS STORE PODS"
kubectl get pods -A -o wide 2>/dev/null \
  | grep -Ei 'secrets-store|provider-aws|provider.*aws' || true

section "AWS PROVIDER DAEMONSET DETAILS"
AWS_DS="$(kubectl get daemonset -A \
  -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name' \
  --no-headers 2>/dev/null \
  | grep -Ei 'provider.*aws|aws.*provider' \
  | head -1 || true)"

if [ -n "$AWS_DS" ]; then
  AWS_NS="$(echo "$AWS_DS" | awk '{print $1}')"
  AWS_NAME="$(echo "$AWS_DS" | awk '{print $2}')"

  echo "FOUND: ${AWS_NS}/${AWS_NAME}"

  kubectl describe daemonset "$AWS_NAME" -n "$AWS_NS" 2>/dev/null \
    | sed -n '/Events:/,$p'
else
  echo "AWS Secrets Store CSI provider DaemonSet: NOT FOUND"
fi

section "NODE POD CAPACITY"
kubectl get node "$NODE" \
  -o custom-columns='NODE:.metadata.name,CAPACITY_PODS:.status.capacity.pods,ALLOCATABLE_PODS:.status.allocatable.pods' \
  2>/dev/null

section "PODS ASSIGNED TO NODE"
printf "COUNT="
kubectl get pods -A \
  --field-selector spec.nodeName="$NODE" \
  --no-headers 2>/dev/null | wc -l

section "PENDING PROVIDER PODS"
kubectl get pods -A \
  --field-selector=status.phase=Pending \
  -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,NODE:.spec.nodeName' \
  2>/dev/null \
  | grep -Ei 'secret|provider|csi' || true