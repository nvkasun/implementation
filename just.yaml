
#!/usr/bin/env bash
set -euo pipefail

NS="goldengate-dev"

echo "========== GOLDENGATE STORAGE PRE-DELETE CHECK =========="

echo
echo "1. Remaining GoldenGate runtime resources"
kubectl -n "$NS" get sts,svc,ingress \
  --ignore-not-found

echo
echo "2. Current pods and PVC references"
kubectl -n "$NS" get pods \
  -o custom-columns='POD:.metadata.name,PVC:.spec.volumes[*].persistentVolumeClaim.claimName'

echo
echo "3. Existing old PVCs"
kubectl -n "$NS" get pvc

echo
echo "4. PV ownership, reclaim policy and EFS handles"
kubectl get pv \
  -o custom-columns='PV:.metadata.name,NAMESPACE:.spec.claimRef.namespace,CLAIM:.spec.claimRef.name,RECLAIM:.spec.persistentVolumeReclaimPolicy,EFS_HANDLE:.spec.csi.volumeHandle'

echo
echo "5. Remaining runtime EFS StorageClasses"
kubectl get storageclass \
  | grep -E 'NAME|gg-efs-dev' || true

echo
echo "========== STORAGE CHECK COMPLETE =========="
