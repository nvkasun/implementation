#!/usr/bin/env bash
set -u

NS_RUNTIME="goldengate-dev"
NS_MONITOR="goldengate-monitoring"
RUNTIME_POD="gg-mssql-repltest-001-0"
MONITOR_POD="$(kubectl get pods -n "$NS_MONITOR" -l app.kubernetes.io/name=gg-monitor -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
NODE="ip-10-238-186-172.eu-west-1.compute.internal"

section() {
  echo
  echo "===== $1 ====="
}

section "RUNTIME POD STATUS"
kubectl get pod "$RUNTIME_POD" -n "$NS_RUNTIME" \
  -o custom-columns='NAME:.metadata.name,STATUS:.status.phase,NODE:.spec.nodeName,INIT:.status.initContainerStatuses[*].state.waiting.reason,CONTAINER:.status.containerStatuses[*].state.waiting.reason' \
  2>/dev/null

section "RUNTIME POD EVENTS"
kubectl describe pod "$RUNTIME_POD" -n "$NS_RUNTIME" 2>/dev/null \
  | sed -n '/Events:/,$p'

section "RUNTIME INIT LOG"
kubectl logs "$RUNTIME_POD" -n "$NS_RUNTIME" \
  -c prepare-u02-permissions \
  --tail=80 2>&1 \
  | tail -n 80

section "MONITOR POD STATUS"
if [ -n "$MONITOR_POD" ]; then
  kubectl get pod "$MONITOR_POD" -n "$NS_MONITOR" \
    -o custom-columns='NAME:.metadata.name,STATUS:.status.phase,NODE:.spec.nodeName,WAITING:.status.containerStatuses[*].state.waiting.reason' \
    2>/dev/null
else
  echo "Monitor pod not found"
fi

section "MONITOR POD EVENTS"
if [ -n "$MONITOR_POD" ]; then
  kubectl describe pod "$MONITOR_POD" -n "$NS_MONITOR" 2>/dev/null \
    | sed -n '/Events:/,$p'
fi

section "RECENT RUNTIME WARNINGS"
kubectl get events -n "$NS_RUNTIME" \
  --field-selector type=Warning \
  --sort-by=.lastTimestamp \
  2>/dev/null \
  | tail -n 25

section "RECENT MONITOR WARNINGS"
kubectl get events -n "$NS_MONITOR" \
  --field-selector type=Warning \
  --sort-by=.lastTimestamp \
  2>/dev/null \
  | tail -n 20

section "NODE CONDITIONS"
kubectl get node "$NODE" \
  -o custom-columns='NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,MEMORY:.status.conditions[?(@.type=="MemoryPressure")].status,DISK:.status.conditions[?(@.type=="DiskPressure")].status,PID:.status.conditions[?(@.type=="PIDPressure")].status' \
  2>/dev/null

section "NODE TAINTS"
kubectl get node "$NODE" \
  -o jsonpath='{range .spec.taints[*]}{.key}={.value}:{.effect}{"\n"}{end}' \
  2>/dev/null

section "PODS ON AFFECTED NODE"
kubectl get pods -A \
  --field-selector spec.nodeName="$NODE" \
  -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,READY:.status.containerStatuses[*].ready,PHASE:.status.phase' \
  2>/dev/null