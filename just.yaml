# ============================================================
# Oracle on Azure - Blob Storage Private DNS VNet Link
# ============================================================

resource "azurerm_private_dns_zone_virtual_network_link" "oracle_binary_storage" {
  count = var.oracle_vm_on_azure_enabled ? 1 : 0

  provider = azurerm.connectivity

  name = "oracle-binary-storage-${var.environment}-vnl"

  resource_group_name  = data.azurerm_private_dns_zone.sa_dns_zone.resource_group_name
  private_dns_zone_name = data.azurerm_private_dns_zone.sa_dns_zone.name

  virtual_network_id = module.base-infra.vnet_id

  registration_enabled = false

  tags = local.tags
}