Now comes the most important test: reboot

Before rebooting, just confirm all three services are enabled:

sudo systemctl is-enabled oracle-hostname-fix.service
sudo systemctl is-enabled oracle-database.service
sudo systemctl is-enabled oracle-health.service

Expected:

enabled
enabled
enabled

Then reboot:

sudo reboot

Do nothing manually after the VM comes back. Give it maybe 1–2 minutes, SSH back in, and run this sequence:

hostname
hostname -I

df -hT | grep -E 'OraHome|OraData'

getent ahostsv4 "$(hostname)"

sudo systemctl status oracle-hostname-fix.service --no-pager
sudo systemctl status oracle-database.service --no-pager
sudo systemctl status oracle-health.service --no-pager

sudo ss -lntp | grep -E '1521|8080'

curl -i http://127.0.0.1:8080/health

sudo firewall-cmd --list-all

And finally verify Oracle independently:

sudo su - oracle
export ORACLE_HOME=/OraHome/ora26ai_DB_Home
export ORACLE_SID=DFCASHUAT1
export PATH=$ORACLE_HOME/bin:$PATH

sqlplus / as sysdba

Inside SQL*Plus:

select instance_name, status from v$instance;
select name, open_mode, database_role from v$database;
exit;

Then:

lsnrctl status