What we want

If the second command works, that's ideal. We can write a Python script like this:

import getpass
import oracledb
import time

DB_HOST = "10.114.32.134"
DB_PORT = 1521
DB_SERVICE = "pdb1"
DB_USER = "SYSTEM"

password = getpass.getpass("Oracle password: ")

dsn = f"{DB_HOST}:{DB_PORT}/{DB_SERVICE}"

for record_id in range(1, 11):
    with oracledb.connect(
        user=DB_USER,
        password=password,
        dsn=dsn
    ) as conn:
        cursor = conn.cursor()

        cursor.execute("""
            BEGIN
                EXECUTE IMMEDIATE '
                    CREATE TABLE LB_TEST_DATA (
                        TEST_ID NUMBER,
                        MESSAGE VARCHAR2(100),
                        BACKEND_HOST VARCHAR2(100),
                        CREATED_AT TIMESTAMP
                    )
                ';
            EXCEPTION
                WHEN OTHERS THEN
                    IF SQLCODE != -955 THEN
                        RAISE;
                    END IF;
            END;
        """)

        cursor.execute(
            "SELECT SYS_CONTEXT('USERENV', 'SERVER_HOST') FROM dual"
        )
        backend = cursor.fetchone()[0]

        cursor.execute("""
            INSERT INTO LB_TEST_DATA
                (TEST_ID, MESSAGE, BACKEND_HOST, CREATED_AT)
            VALUES
                (:1, :2, :3, SYSTIMESTAMP)
        """, [
            record_id,
            f"LB test record {record_id}",
            backend
        ])

        conn.commit()

        print(
            f"Record {record_id} inserted through "
            f"{DB_HOST}:{DB_PORT}/{DB_SERVICE} -> backend {backend}"
        )

    time.sleep(1)