First check exactly where Oracle listener is listening

Run these three commands on VM1:

sudo -iu oracle bash -lc '
export ORACLE_HOME=/u01/app/oracle/product/21.0.0/dbhome_1
export ORACLE_SID=ORCL
export PATH=$ORACLE_HOME/bin:$PATH
lsnrctl status
'

Then:

sudo ss -lntp | grep 1521

and:

ps -ef | grep tnslsnr | grep -v grep