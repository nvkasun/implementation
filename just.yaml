sudo ethtool -i eth0
sudo ethtool -i eth1

echo "ETH0 MAC:"
cat /sys/class/net/eth0/address

echo "ETH1 MAC:"
cat /sys/class/net/eth1/address

echo "=== LINK DETAILS ==="
ip -d link show eth0
ip -d link show eth1

echo "=== NM CONNECTIONS ==="
nmcli -f NAME,UUID,TYPE,DEVICE connection show

echo "=== AZURE/HYPER-V DEVICES ==="
ls -l /sys/class/net/eth0/device/driver 2>/dev/null
ls -l /sys/class/net/eth1/device/driver 2>/dev/null