cat > mssql-migration-state.sh <<'EOF'
#!/bin/bash
set -u

ARGO_NS="argocd"
GG_NS="goldengate-dev"

OLD_APP="goldengate-dev-mssql-repltest-01"
OLD_APPSET="goldengate-dev-mssql-repltest-01-appset"
OLD_ID="gg-mssql-repltest-01"

NEW_APP="goldengate-dev-mssql-repltest-001"
NEW_APPSET="goldengate-dev-mssql-repltest-001-appset"
NEW_ID="gg-mssql-repltest-001"

PVC="gg-mssql-repltest-01-u02"

echo "===== OLD IDENTITY ====="

for r in \
  "applicationset/$OLD_APPSET" \
  "application/$OLD_APP"
do
  if kubectl get "$r" -n "$ARGO_NS" >/dev/null 2>&1; then
    echo "$r=EXISTS"
  else
    echo "$r=ABSENT"
  fi
done

for r in \
  "statefulset/$OLD_ID" \
  "service/$OLD_ID" \
  "service/${OLD_ID}-headless"
do
  if kubectl get "$r" -n "$GG_NS" >/dev/null 2>&1; then
    echo "$r=EXISTS"
  else
    echo "$r=ABSENT"
  fi
done

echo
echo "===== RETAINED STORAGE ====="

if kubectl get pvc "$PVC" -n "$GG_NS" >/dev/null 2>&1; then
  PV="$(kubectl get pvc "$PVC" -n "$GG_NS" -o jsonpath='{.spec.volumeName}')"

  kubectl get pvc "$PVC" -n "$GG_NS" \
    -o jsonpath='PVC={.metadata.name}{" STATUS="}{.status.phase}{" PV="}{.spec.volumeName}{"\n"}'

  kubectl get pv "$PV" \
    -o jsonpath='PV={.metadata.name}{" STATUS="}{.status.phase}{" DRIVER="}{.spec.csi.driver}{" HANDLE="}{.spec.csi.volumeHandle}{"\n"}'
else
  echo "PVC=$PVC ABSENT"
fi

echo
echo "===== NEW IDENTITY ====="

for r in \
  "applicationset/$NEW_APPSET" \
  "application/$NEW_APP"
do
  if kubectl get "$r" -n "$ARGO_NS" >/dev/null 2>&1; then
    echo "$r=EXISTS"
  else
    echo "$r=ABSENT"
  fi
done

if kubectl get statefulset "$NEW_ID" -n "$GG_NS" >/dev/null 2>&1; then
  echo "statefulset/$NEW_ID=EXISTS"
else
  echo "statefulset/$NEW_ID=ABSENT"
fi
EOF

chmod +x mssql-migration-state.sh
./mssql-migration-state.sh