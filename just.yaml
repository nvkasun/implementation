        firewall-cmd \
            --permanent \
            --zone=public \
            --add-port="${ORACLE_PORT}/tcp" \
            >/dev/null 2>&1 || true
    fi

    firewall-cmd \
        --permanent \
        --zone=public \
        --add-port="${HEALTH_PORT}/tcp" \
        >/dev/null 2>&1 || true

    firewall-cmd --reload >/dev/null 2>&1 || true
else
    echo "WARNING: firewalld is not active. No host firewall changes were applied."
fi

# ============================================================
# Start service - errors are logged but never fail Terraform
# ============================================================

echo "==> Enabling and starting oracle-health.service"

systemctl enable oracle-health.service >/dev/null 2>&1 || true
systemctl restart oracle-health.service || true

sleep 2

if systemctl is-active --quiet oracle-health.service; then
    echo "==> oracle-health.service is active."
else
    echo "WARNING: oracle-health.service is not active."
    systemctl --no-pager --full status oracle-health.service || true
    journalctl -u oracle-health.service -n 100 --no-pager || true
fi

echo
echo "============================================================"
echo "Oracle Health Agent configuration"
echo "============================================================"
echo "Health-agent OS User : ${SERVICE_OS_USER}"
echo "Health-agent OS Home : ${SERVICE_OS_HOME}"
echo "Health-agent Group   : ${SERVICE_OS_GROUP}"
echo "Expected DB Port     : ${ORACLE_PORT}"
echo "Health Port          : ${HEALTH_PORT}"
echo "Environment File     : ${ENV_FILE}"
echo "Installer Log        : ${INSTALL_LOG}"
echo "Runtime Log          : ${RUNTIME_LOG}"
echo "============================================================"

echo
echo "==> Waiting for initial health checks"
sleep "$((CHECK_INTERVAL * SUCCESS_THRESHOLD + 3))" || true

echo
echo "==> Local health endpoint"

if command -v curl >/dev/null 2>&1; then
    curl \
        -i \
        --max-time 10 \
        "http://127.0.0.1:${HEALTH_PORT}/health" \
        || true
else
    /usr/bin/python3 - <<PY || true
import urllib.error
import urllib.request

url = "http://127.0.0.1:${HEALTH_PORT}/health"

try:
    response = urllib.request.urlopen(
        url,
        timeout=10,
    )
    print("HTTP", response.status)
    print(response.read().decode())

except urllib.error.HTTPError as exc:
    print("HTTP", exc.code)
    print(exc.read().decode())

except Exception as exc:
    print("Health request failed:", exc)
PY
fi

echo
echo "==> Recent installer/runtime logs"
tail -n 50 "${INSTALL_LOG}" 2>/dev/null || true
tail -n 50 "${RUNTIME_LOG}" 2>/dev/null || true

echo
echo "Installation attempt complete."
echo "Terraform-safe behavior: this installer always exits 0."
echo "Runtime health:"
echo "  HTTP 200 = healthy"
echo "  HTTP 503 = unhealthy/not ready"
echo "Logs:"
echo "  ${INSTALL_LOG}"
echo "  ${RUNTIME_LOG}"

exit 0
