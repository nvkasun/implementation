cat > gg-ddb-migration-check.sh <<'EOF'
#!/bin/bash
set -u

REGION="eu-west-1"
TABLE="gg-eks-pipeline"

PAIRS=(
  "gg-mssql-repltest-01|gg-mssql-repltest-001"
  "gg-oracle-repltest-01|gg-oracle-repltest-002"
  "gg-postgresql-repltest-01|gg-postgresql-repltest-001"
  "gg-postgresql-repltest-02|gg-postgresql-repltest-002"
)

check_item() {
  local id="$1"
  local err
  err="$(mktemp)"

  ITEM="$(
    aws dynamodb get-item \
      --region "$REGION" \
      --table-name "$TABLE" \
      --consistent-read \
      --key "{\"pipeline\":{\"S\":\"${id}\"},\"recordType\":{\"S\":\"CONFIG\"}}" \
      --output json 2>"$err"
  )"
  RC=$?

  if [ "$RC" -ne 0 ]; then
    echo "ERROR"
    echo "AWS_ERROR=$(tr '\n' ' ' < "$err")"
    rm -f "$err"
    return
  fi

  rm -f "$err"

  PIPELINE="$(printf '%s' "$ITEM" | python3 -c '
import json,sys
x=json.load(sys.stdin)
print(x.get("Item",{}).get("pipeline",{}).get("S",""))
')"

  if [ "$PIPELINE" = "$id" ]; then
    echo "EXISTS"
  else
    echo "ABSENT"
  fi
}

echo "===== AWS CALLER ====="
aws sts get-caller-identity \
  --query '{Account:Account,Arn:Arn}' \
  --output json

echo
echo "===== DYNAMODB CONFIG MIGRATION ====="

for pair in "${PAIRS[@]}"; do
  OLD="${pair%%|*}"
  NEW="${pair##*|}"

  echo
  echo "PAIR=$OLD -> $NEW"

  OLD_RESULT="$(check_item "$OLD")"
  NEW_RESULT="$(check_item "$NEW")"

  echo "OLD_CONFIG=$OLD_RESULT"
  echo "NEW_CONFIG=$NEW_RESULT"
done
EOF

chmod +x gg-ddb-migration-check.sh
./gg-ddb-migration-check.sh