cat > repair-node143.sh <<'EOF'
#!/bin/bash
set -euo pipefail

TARGET_NODE="ip-10-238-186-143.eu-west-1.compute.internal"
GG_NS="goldengate-dev"
MON_NS="goldengate-monitoring"
KUBE_NS="kube-system"

GG_IDS=(
  "gg-postgresql-repltest-01"
  "gg-mssql-repltest-01"
  "gg-oracle-repltest-01"
  "gg-postgresql-repltest-02"
)

CORDONED=0

cleanup() {
  if [ "$CORDONED" -eq 1 ]; then
    echo "SAFETY: uncordoning ${TARGET_NODE}"
    kubectl uncordon "$TARGET_NODE" >/dev/null 2>&1 || true
  fi
}
trap cleanup EXIT

echo "===== PRECHECK ====="

kubectl get node "$TARGET_NODE" >/dev/null

ALLOCATABLE="$(kubectl get node "$TARGET_NODE" -o jsonpath='{.status.allocatable.pods}')"
CURRENT="$(kubectl get pods -A --field-selector spec.nodeName="$TARGET_NODE" --no-headers | wc -l | tr -d ' ')"

echo "TARGET_NODE=$TARGET_NODE"
echo "PODS=$CURRENT/$ALLOCATABLE"

MONITOR_POD="$(
  kubectl get pods -n "$MON_NS" \
    --field-selector spec.nodeName="$TARGET_NODE",status.phase=Pending \
    -o name 2>/dev/null \
  | sed 's#pod/##' \
  | grep '^gg-monitor-' \
  | head -1 || true
)"

if [ -z "$MONITOR_POD" ]; then
  echo "ERROR: no Pending gg-monitor pod found on $TARGET_NODE"
  echo "No mutation performed."
  exit 1
fi

echo "PENDING_MONITOR_POD=$MONITOR_POD"

echo
echo "===== 1. CORDON TARGET NODE ====="

kubectl cordon "$TARGET_NODE"
CORDONED=1

echo
echo "===== 2. DELETE ONLY PENDING MONITOR POD ====="

kubectl delete pod "$MONITOR_POD" \
  -n "$MON_NS" \
  --wait=true \
  --timeout=60s

echo
echo "===== 3. WAIT FOR AWS SECRETS PROVIDER ON TARGET NODE ====="

PROVIDER_POD=""

for i in $(seq 1 90); do
  PROVIDER_POD="$(
    kubectl get pods -n "$KUBE_NS" \
      --field-selector spec.nodeName="$TARGET_NODE" \
      -o name 2>/dev/null \
    | sed 's#pod/##' \
    | grep '^secrets-store-csi-driver-provider-aws-' \
    | head -1 || true
  )"

  if [ -n "$PROVIDER_POD" ]; then
    PHASE="$(kubectl get pod "$PROVIDER_POD" -n "$KUBE_NS" -o jsonpath='{.status.phase}')"
    READY="$(kubectl get pod "$PROVIDER_POD" -n "$KUBE_NS" -o jsonpath='{.status.containerStatuses[0].ready}')"

    if [ "$PHASE" = "Running" ] && [ "$READY" = "true" ]; then
      break
    fi
  fi

  PROVIDER_POD=""
  sleep 2
done

if [ -z "$PROVIDER_POD" ]; then
  echo "ERROR: AWS Secrets Store provider did not become Ready on $TARGET_NODE"
  exit 1
fi

echo "PROVIDER_POD=$PROVIDER_POD"
echo "PROVIDER_STATUS=READY"

echo
echo "===== 4. WAIT FOR REPLACEMENT MONITOR POD ====="

NEW_MONITOR_POD=""

for i in $(seq 1 90); do
  LINE="$(
    kubectl get pods -n "$MON_NS" \
      -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.spec.nodeName}{"|"}{.status.phase}{"|"}{.status.containerStatuses[0].ready}{"\n"}{end}' \
    | awk -F'|' -v old="$MONITOR_POD" -v target="$TARGET_NODE" \
      '$1 ~ /^gg-monitor-/ && $1 != old && $2 != target && $3 == "Running" && $4 == "true" {print; exit}'
  )"

  if [ -n "$LINE" ]; then
    NEW_MONITOR_POD="$(echo "$LINE" | cut -d'|' -f1)"
    NEW_MONITOR_NODE="$(echo "$LINE" | cut -d'|' -f2)"
    break
  fi

  sleep 2
done

if [ -n "$NEW_MONITOR_POD" ]; then
  echo "MONITOR_POD=$NEW_MONITOR_POD"
  echo "MONITOR_NODE=$NEW_MONITOR_NODE"
  echo "MONITOR_STATUS=READY"
else
  echo "WARNING: replacement monitor pod is not Ready yet."
fi

echo
echo "===== 5. UNCORDON TARGET NODE ====="

kubectl uncordon "$TARGET_NODE"
CORDONED=0

echo
echo "===== 6. WAIT FOR GOLDENGATE RUNTIMES ====="

GG_OK=1

for id in "${GG_IDS[@]}"; do
  echo "WAITING=$id"

  if kubectl rollout status statefulset/"$id" \
      -n "$GG_NS" \
      --timeout=600s; then
    echo "$id=READY"
  else
    echo "$id=NOT_READY"
    GG_OK=0
  fi
done

echo
echo "===== FINAL RESULT ====="

echo "-- AWS provider on target node --"
kubectl get pods -n "$KUBE_NS" \
  --field-selector spec.nodeName="$TARGET_NODE" \
  -o custom-columns='NAME:.metadata.name,READY:.status.containerStatuses[*].ready,STATUS:.status.phase' \
  | grep 'secrets-store-csi-driver-provider-aws' || true

echo
echo "-- GoldenGate StatefulSets --"
kubectl get statefulsets -n "$GG_NS" \
  -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,REPLICAS:.status.replicas'

echo
echo "-- GoldenGate Pods --"
kubectl get pods -n "$GG_NS" \
  -o custom-columns='NAME:.metadata.name,READY:.status.containerStatuses[*].ready,STATUS:.status.phase,NODE:.spec.nodeName'

echo
echo "-- Monitor Pod --"
kubectl get pods -n "$MON_NS" \
  -o custom-columns='NAME:.metadata.name,READY:.status.containerStatuses[*].ready,STATUS:.status.phase,NODE:.spec.nodeName'

if [ "$GG_OK" -eq 1 ]; then
  echo
  echo "RESULT=SUCCESS"
else
  echo
  echo "RESULT=GOLDENGATE_NOT_READY"

  echo
  echo "===== FAILED POD EVENTS ====="

  for id in "${GG_IDS[@]}"; do
    pod="${id}-0"

    if ! kubectl get pod "$pod" -n "$GG_NS" \
        -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null \
        | grep -q '^true$'; then

      echo "--- $pod ---"

      kubectl get events -n "$GG_NS" \
        --field-selector involvedObject.name="$pod" \
        --sort-by='.lastTimestamp' \
        -o custom-columns='REASON:.reason,MESSAGE:.message' \
        | tail -8 || true
    fi
  done
fi
EOF

chmod +x repair-node143.sh
./repair-node143.sh