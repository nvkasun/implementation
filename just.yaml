cat > final-health-check.sh <<'EOF'
#!/bin/bash
set -u

echo "===== NODE CAPACITY ====="
for node in $(kubectl get nodes -o name | sed 's#node/##'); do
  alloc=$(kubectl get node "$node" -o jsonpath='{.status.allocatable.pods}')
  count=$(kubectl get pods -A --field-selector spec.nodeName="$node" --no-headers 2>/dev/null | wc -l | tr -d ' ')
  echo "$node PODS=$count/$alloc"
done

echo
echo "===== CSI PROVIDER ====="
kubectl get ds secrets-store-csi-driver-provider-aws -n kube-system \
  -o custom-columns='DESIRED:.status.desiredNumberScheduled,READY:.status.numberReady,AVAILABLE:.status.numberAvailable'

echo
echo "===== FLUENT BIT ====="
kubectl get ds gg-fluent-bit -n goldengate-dev \
  -o custom-columns='DESIRED:.status.desiredNumberScheduled,READY:.status.numberReady,AVAILABLE:.status.numberAvailable,UNAVAILABLE:.status.numberUnavailable'

kubectl get pods -n goldengate-dev \
  -l app.kubernetes.io/name=fluent-bit \
  -o custom-columns='POD:.metadata.name,READY:.status.containerStatuses[*].ready,STATUS:.status.phase,NODE:.spec.nodeName'

echo
echo "===== GOLDENGATE ====="
kubectl get sts -n goldengate-dev \
  -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,REPLICAS:.status.replicas'

echo
echo "===== ARGO APPLICATIONS ====="
kubectl get applications -n argocd \
  -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status' \
  | grep -E 'NAME|goldengate-dev-(postgresql|mssql|oracle)-repltest|goldengate-dev-platform|goldengate-monitor'

echo
echo "===== PENDING PODS ====="
kubectl get pods -A --field-selector status.phase=Pending \
  -o custom-columns='NS:.metadata.namespace,POD:.metadata.name,NODE:.spec.nodeName'
EOF

chmod +x final-health-check.sh
./final-health-check.sh