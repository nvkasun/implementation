Create a new file in your current Terraform root, for example:

terraform/private_dns_zone.tf

Use this:

resource "azurerm_private_dns_zone_virtual_network_link" "oracle_binary_blob" {
  provider = azurerm.connectivity

  name                  = local.virtual_network_links["cloudfactory"].name
  resource_group_name   = data.azurerm_private_dns_zone.sa_dns_zone.resource_group_name
  private_dns_zone_name = data.azurerm_private_dns_zone.sa_dns_zone.name
  virtual_network_id    = local.virtual_network_links["cloudfactory"].virtual_network_id
  registration_enabled  = false

  tags = local.tags
}