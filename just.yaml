#!/bin/bash

set -u

echo "===== 1. SECRETS STORE CSI ====="

echo "-- CSI Driver --"
kubectl get csidriver secrets-store.csi.k8s.io \
  -o jsonpath='NAME={.metadata.name}{" TOKEN_REQUESTS="}{.spec.tokenRequests}{"\n"}' 2>&1 || true

echo "-- CSI / AWS Provider DaemonSets --"
kubectl get daemonsets -A \
  -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name,DESIRED:.status.desiredNumberScheduled,READY:.status.numberReady' \
  | grep -Ei 'secret|csi|provider' || true

echo "-- CSI / AWS Provider Pods --"
kubectl get pods -A \
  -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name,READY:.status.containerStatuses[*].ready,STATUS:.status.phase,NODE:.spec.nodeName' \
  | grep -Ei 'secret|csi|provider' || true


echo
echo "===== 2. ARGO ECR TOKEN SYNC ====="

echo "-- ServiceAccount --"
kubectl get sa argocd-ecr-token-sync -n argocd \
  -o jsonpath='NAME={.metadata.name}{" ROLE_ARN="}{.metadata.annotations.eks\.amazonaws\.com/role-arn}{"\n"}' 2>&1 || true

echo "-- CronJob --"
kubectl get cronjob argocd-ecr-token-sync -n argocd \
  -o jsonpath='NAME={.metadata.name}{" SCHEDULE="}{.spec.schedule}{" LAST_SCHEDULE="}{.status.lastScheduleTime}{" LAST_SUCCESS="}{.status.lastSuccessfulTime}{"\n"}' 2>&1 || true

echo "-- Recent Jobs --"
kubectl get jobs -n argocd \
  --sort-by=.metadata.creationTimestamp \
  -o custom-columns='NAME:.metadata.name,SUCCEEDED:.status.succeeded,FAILED:.status.failed,START:.status.startTime,END:.status.completionTime' \
  | grep 'argocd-ecr-token-sync' | tail -5 || true

LATEST_JOB="$(kubectl get jobs -n argocd \
  --sort-by=.metadata.creationTimestamp \
  -o name 2>/dev/null \
  | grep 'argocd-ecr-token-sync' \
  | tail -1)"

echo
echo "-- Latest Token Sync Job Logs --"

if [ -n "$LATEST_JOB" ]; then
  echo "JOB=$LATEST_JOB"
  kubectl logs -n argocd "$LATEST_JOB" --tail=50 2>&1
else
  echo "NO_TOKEN_SYNC_JOB_FOUND"
fi


echo
echo "===== 3. ARGO GOLDENGATE OCI SECRET ====="

kubectl get secret argocd-ecr-goldengate-oci -n argocd \
  -o jsonpath='NAME={.metadata.name}{" TYPE="}{.type}{" CREATED="}{.metadata.creationTimestamp}{"\n"}' 2>&1 || true

echo -n "DATA_KEYS="
kubectl get secret argocd-ecr-goldengate-oci -n argocd \
  -o go-template='{{range $k,$v := .data}}{{$k}} {{end}}{{"\n"}}' 2>&1 || true