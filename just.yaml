
#!/usr/bin/env bash
set -u

NS="goldengate-dev"
TARGETS=(
  "gg-postgresql-repltest-001"
  "gg-postgresql-repltest-002"
)

echo "=== GoldenGate Admin API Comparison ==="

for APP in "${TARGETS[@]}"; do
  echo
  echo "===== $APP ====="

  POD="${APP}-0"

  kubectl get pod "$POD" -n "$NS" \
    -o jsonpath='Pod phase: {.status.phase}{"\n"}'

  kubectl exec -n "$NS" "$POD" \
    -c ogg-postgresql -- sh -c '
    for PATH_ in \
      "/" \
      "/services/v2/" \
      "/services/v2/extracts" \
      "/services/v2/replicats"
    do
      CODE=$(curl -sk \
        --max-time 10 \
        -o /dev/null \
        -w "%{http_code}" \
        "https://127.0.0.1:8443${PATH_}")

      echo "${PATH_} => HTTP ${CODE}"
    done
  ' 2>&1 | grep -E 'HTTP|not found|error'
done

echo
echo "=== Comparison Complete ==="
echo "No credentials used; no resources modified."
