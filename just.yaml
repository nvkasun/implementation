Create:

sudo vi /usr/local/sbin/oracle-hostname-fix.sh

Put this inside:

#!/bin/bash
set -e

SHORT_HOST="$(hostname -s)"
FQDN="$(hostname -f)"

IP="$(ip -4 route get 168.63.129.16 2>/dev/null | awk '
{
    for (i = 1; i <= NF; i++) {
        if ($i == "src") {
            print $(i+1)
            exit
        }
    }
}')"

if [ -z "$IP" ]; then
    IP="$(hostname -I | awk '{print $1}')"
fi

if [ -z "$IP" ]; then
    echo "ERROR: Unable to determine VM IPv4 address"
    exit 1
fi

# Remove the previous dynamically managed entry.
sed -i '/# ORACLE_VM_HOST_MAPPING/d' /etc/hosts

echo "${IP} ${SHORT_HOST} ${FQDN} # ORACLE_VM_HOST_MAPPING" >> /etc/hosts

echo "Oracle hostname mapping configured:"
echo "${IP} ${SHORT_HOST} ${FQDN}"

Save it and:

sudo chmod 755 /usr/local/sbin/oracle-hostname-fix.sh

Run it manually:

sudo /usr/local/sbin/oracle-hostname-fix.sh

Then check:

tail -5 /etc/hosts

and:

getent ahostsv4 "$(hostname)"

We want .136 right now.

Step 2 — create systemd startup service for that mapping

Create:

sudo vi /etc/systemd/system/oracle-hostname-fix.service

Put:

[Unit]
Description=Configure Oracle VM hostname mapping
After=network-online.target
Wants=network-online.target
Before=oracle-database.service

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/oracle-hostname-fix.sh
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target

Then:

sudo systemctl daemon-reload
sudo systemctl enable oracle-hostname-fix.service

Don't reboot yet.

