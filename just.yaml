#!/bin/bash

set -u

STORAGE_ACCOUNT="clftdevorabin40ayym"
CONTAINER_NAME="oracle-binaries"

MANAGED_IDENTITY_RESOURCE_ID="/subscriptions/1a233215-09f6-404f-8536-bc83100ba1fa/resourceGroups/rg-CloudFactory-dev-uaenorth-oracledb/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-oracle-binary-vm-dev-uan"

BLOB_HOST="${STORAGE_ACCOUNT}.blob.core.windows.net"
IMDS_URL="http://169.254.169.254/metadata/identity/oauth2/token"

TOKEN_FILE="$(mktemp)"
RESPONSE_FILE="$(mktemp)"
BODY_FILE="$(mktemp)"

cleanup() {
    rm -f "$TOKEN_FILE" "$RESPONSE_FILE" "$BODY_FILE"
    unset ACCESS_TOKEN
}

trap cleanup EXIT

echo
echo "Oracle Binary Storage Access Test"
echo "================================="
echo "Client VM       : $(hostname)"
echo "Storage account : ${STORAGE_ACCOUNT}"
echo "Container       : ${CONTAINER_NAME}"
echo "Blob endpoint   : https://${BLOB_HOST}"
echo

echo "Step 1 - Private DNS resolution"
echo "-------------------------------"

RESOLVED_IP=$(python3 - "$BLOB_HOST" <<'PY'
import socket
import sys

host = sys.argv[1]

try:
    addresses = socket.gethostbyname_ex(host)[2]
    print(addresses[0] if addresses else "")
except Exception:
    print("")
PY
)

if [ -z "$RESOLVED_IP" ]; then
    echo "DNS RESOLUTION   : FAILED"
    exit 1
fi

echo "DNS RESOLUTION   : SUCCESS"
echo "Resolved address : ${RESOLVED_IP}"

case "$RESOLVED_IP" in
    10.*|172.16.*|172.17.*|172.18.*|172.19.*|172.2[0-9].*|172.3[0-1].*|192.168.*)
        echo "PRIVATE ENDPOINT : SUCCESS"
        ;;
    *)
        echo "PRIVATE ENDPOINT : FAILED"
        echo "Storage hostname resolved to a non-private address."
        exit 1
        ;;
esac

echo
echo "Step 2 - Managed Identity authentication"
echo "----------------------------------------"

HTTP_CODE=$(curl \
    --silent \
    --show-error \
    --noproxy "*" \
    --output "$TOKEN_FILE" \
    --write-out "%{http_code}" \
    -H "Metadata: true" \
    --get \
    --data-urlencode "api-version=2018-02-01" \
    --data-urlencode "resource=https://storage.azure.com/" \
    --data-urlencode "mi_res_id=${MANAGED_IDENTITY_RESOURCE_ID}" \
    "$IMDS_URL")

if [ "$HTTP_CODE" != "200" ]; then
    echo "MANAGED IDENTITY : FAILED"
    echo "HTTP status      : ${HTTP_CODE}"
    echo
    cat "$TOKEN_FILE"
    echo
    exit 1
fi

ACCESS_TOKEN=$(python3 - "$TOKEN_FILE" <<'PY'
import json
import sys

try:
    with open(sys.argv[1], "r") as f:
        data = json.load(f)

    print(data.get("access_token", ""))
except Exception:
    print("")
PY
)

if [ -z "$ACCESS_TOKEN" ]; then
    echo "MANAGED IDENTITY : FAILED"
    echo "No access token was returned by Azure IMDS."
    exit 1
fi

echo "MANAGED IDENTITY : SUCCESS"
echo "Identity         : id-oracle-binary-vm-dev-uan"
echo "Token received   : YES"

echo
echo "Step 3 - Blob container access"
echo "------------------------------"

BLOB_URL="https://${BLOB_HOST}/${CONTAINER_NAME}?restype=container&comp=list"

HTTP_CODE=$(curl \
    --silent \
    --show-error \
    --noproxy "*" \
    --output "$RESPONSE_FILE" \
    --write-out "%{http_code}" \
    -H "Authorization: Bearer ${ACCESS_TOKEN}" \
    -H "x-ms-version: 2023-11-03" \
    -H "x-ms-date: $(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S GMT')" \
    "$BLOB_URL")

if [ "$HTTP_CODE" != "200" ]; then
    echo "BLOB ACCESS      : FAILED"
    echo "HTTP status      : ${HTTP_CODE}"
    echo

    if [ "$HTTP_CODE" = "403" ]; then
        echo "The VM reached the Storage Account, but access was denied."
        echo "Check the Storage Blob Data Reader role assignment for the VM Managed Identity."
    fi

    echo
    cat "$RESPONSE_FILE"
    echo
    exit 1
fi

echo "BLOB ACCESS      : SUCCESS"
echo "HTTP status      : 200"

echo
echo "Files in oracle-binaries"
echo "------------------------"

python3 - "$RESPONSE_FILE" <<'PY'
import sys
import xml.etree.ElementTree as ET

try:
    root = ET.parse(sys.argv[1]).getroot()
    blobs = []

    for blob in root.findall(".//Blob"):
        name = blob.find("Name")
        if name is not None and name.text:
            blobs.append(name.text)

    if not blobs:
        print("Container is accessible but currently contains no files.")
    else:
        for index, name in enumerate(blobs, 1):
            print("{:02d}. {}".format(index, name))

except Exception as exc:
    print("Unable to parse blob listing: {}".format(exc))
    sys.exit(1)
PY

if [ $? -ne 0 ]; then
    echo
    echo "FINAL RESULT: FAILED"
    exit 1
fi

echo
echo "FINAL RESULT: PASS"
echo "VM04 successfully accessed the Oracle binary Blob container"
echo "through the private endpoint using its Managed Identity."
echo