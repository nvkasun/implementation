First, check the exact ownership

Stay as azureuser and run this exact block:

sudo stat -c '%A %U:%G %n' \
/OraHome/ora26ai_DB_Home/network/log \
/OraHome/ora26ai_DB_Home/network/log/listener.log \
/OraHome/ora26ai_DB_Home/rdbms/log \
/OraHome/ora26ai_DB_Home/rdbms/log/startup.log \
/OraHome/ora26ai_DB_Home/rdbms/log/shutdown.log 2>/dev/null

Then:

sudo ls -la /OraHome/ora26ai_DB_Home/network/log

and:

sudo ls -la /OraHome/ora26ai_DB_Home/rdbms/log

I expect we may find something similar to:

oracle:dba ... listener.log
oracle:dba ... startup.log

while the directories themselves are owned by:

oraade:dba
If you see oracle ownership there

We can safely correct the ownership of these runtime log directories only:

sudo chown -R oraade:dba \
/OraHome/ora26ai_DB_Home/network/log \
/OraHome/ora26ai_DB_Home/rdbms/log

Then set directory permissions:

sudo chmod 750 \
/OraHome/ora26ai_DB_Home/network/log \
/OraHome/ora26ai_DB_Home/rdbms/log

And verify:

sudo stat -c '%A %U:%G %n' \
/OraHome/ora26ai_DB_Home/network/log \
/OraHome/ora26ai_DB_Home/rdbms/log

We want:

oraade:dba

Do not run a recursive chown against the whole /OraHome or the whole Oracle home. We're only fixing these runtime log locations.

Then test the listener manually as oraade

Before involving systemd again:

sudo -iu oraade

Then:

export ORACLE_HOME=/OraHome/ora26ai_DB_Home
export ORACLE_SID=DFCASHUAT1
export PATH=$ORACLE_HOME/bin:$PATH

Start the listener directly:

lsnrctl start

Then:

lsnrctl status

If that works, we should get:

STATUS of the LISTENER
...
Listening Endpoints Summary...
...
The command completed successfully

Then exit:

exit
Only after lsnrctl start works

Run the systemd service again from a completely clean state:

sudo systemctl stop oracle-database.service 2>/dev/null || true
sudo systemctl reset-failed oracle-database.service
sudo systemctl daemon-reload
sudo systemctl start oracle-database.service

Then:

sudo systemctl status oracle-database.service --no-pager

and importantly:

sudo journalctl -u oracle-database.service \
  --since "2 minutes ago" \
  --no-pager

One more important observation from your screenshot: your oraade-write-test succeeded:

-rw-r--r--. 1 oraade dba ... oraade-write-test

That proves oraade can write to the directory. So the problem is very likely an existing file inside that directory with old ownership/permissions, rather than the mount or filesystem itself.

