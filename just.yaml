
#!/usr/bin/env bash
set -u

NS="goldengate-dev"

APPS=(
  "gg-postgresql-repltest-001"
  "gg-mssql-repltest-001"
  "gg-oracle-repltest-002"
  "gg-postgresql-repltest-002"
)

echo "=== GOLDENGATE SERVICE MANAGER REGISTRATION CHECK ==="
echo "Namespace: $NS"
echo "Read-only: no Kubernetes modifications"
echo

for APP in "${APPS[@]}"; do
  echo "========== $APP =========="

  POD="${APP}-0"

  kubectl exec -n "$NS" "$POD" -- \
    sh -c '
      for PORT in 8443 8080; do
        case "$PORT" in
          8443) BASE="https://127.0.0.1:8443" ;;
          8080) BASE="http://127.0.0.1:8080" ;;
        esac

        CODE=$(curl -sk --max-time 5 \
          -o /dev/null -w "%{http_code}" \
          "$BASE/services/v2/deployments")

        echo "Service Manager API port=$PORT HTTP=$CODE"
      done
    ' 2>/dev/null || echo "Unable to execute check"

  echo
done

echo "=== CHECK COMPLETE ==="
echo "HTTP 401 = authentication required"
echo "HTTP 200 = endpoint accessible"
echo "HTTP 404 = endpoint/route not found"
echo "HTTP 000 = connection failed"
echo
echo "No credentials or persistent files accessed."
