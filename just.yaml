
-- GoldenGate POC: Create SQL Server target database
-- Execute through DBeaver.

IF DB_ID(N'goldengate_poc') IS NULL
BEGIN
    EXEC(N'CREATE DATABASE goldengate_poc');
END;

-- Verify database creation
SELECT
    name AS database_name,
    state_desc AS database_status,
    recovery_model_desc AS recovery_model
FROM sys.databases
WHERE name = N'goldengate_poc';
