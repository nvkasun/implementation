kubectl exec -n goldengate-dev \
  gg-postgresql-repltest-002-0 \
  -c ogg-postgresql -- sh -c '
echo "=== ADMIN SERVER LOG: LAST 50 LINES ==="
tail -n 50 /u02/Deployment/var/log/adminsrvr.log 2>/dev/null |
  sed -E "s/(password|token|secret)[=:][^ ,]+/\1=[REDACTED]/Ig" |
  cut -c 1-200

echo
echo "=== ADMIN SERVER CONFIG FILES ==="
find /u02/ServiceManager/var/run -maxdepth 1 \
  -iname "*adminsrvr*" -printf "%f\n" 2>/dev/null
'