
#!/usr/bin/env bash
set -u

NS="goldengate-dev"

echo "=== GOLDENGATE HTTP 502 DIAGNOSTICS ==="

for APP in gg-postgresql-repltest-001 gg-postgresql-repltest-002; do
  echo
  echo "========== $APP =========="

  POD="${APP}-0"

  kubectl exec -n "$NS" "$POD" -c ogg-postgresql -- sh -c '
    echo "--- GoldenGate and NGINX processes ---"
    ps -ef 2>/dev/null |
      grep -Ei "nginx|adminsrvr|ServiceManager" |
      grep -v grep |
      head -15

    echo "--- Listening TCP ports ---"
    if command -v ss >/dev/null 2>&1; then
      ss -lnt 2>/dev/null |
        grep -E "8443|900|901|902" |
        head -20
    else
      echo "ss command unavailable"
    fi

    echo "--- HTTPS status codes ---"
    for path in \
      / \
      /services/v2/extracts \
      /services/v2/replicats
    do
      code=$(curl -sk --max-time 8 \
        -o /dev/null \
        -w "%{http_code}" \
        "https://127.0.0.1:8443${path}")

      echo "${path}: HTTP ${code}"
    done
  ' 2>&1 | head -65

done

echo
echo "=== DIAGNOSTICS COMPLETE ==="
