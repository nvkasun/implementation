Also, for the backend health validation, I deployed a lightweight Python health-agent service on both Oracle DB VMs.

Azure Load Balancer periodically sends an HTTP health probe to <VM-IP>:8080/health. When the request is received, the agent performs Oracle-level validation rather than only checking whether the VM is reachable. It verifies the Oracle database/instance state, listener availability on port 1521, pdb1 service registration/readiness, PDB1 READ WRITE status, and executes a real SQL query against the PDB.

If all mandatory checks pass, the agent returns HTTP 200 / HEALTHY, and Azure keeps that VM eligible for new Oracle connections. If any critical check fails, the probe fails and Azure removes that VM from new-connection selection until it becomes healthy again.