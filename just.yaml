
set -euo pipefail

NS="argocd"

APPS=(
  goldengate-dev-mssql-repltest-001
  goldengate-dev-oracle-repltest-002
  goldengate-dev-postgresql-repltest-001
  goldengate-dev-postgresql-repltest-002
)

echo "=== GOLDENGATE RUNTIME APPLICATION STATUS ==="

for app in "${APPS[@]}"; do
  echo
  echo "APPLICATION: $app"

  kubectl -n "$NS" get application "$app" \
    -o jsonpath='Name: {.metadata.name}{"\n"}Deletion timestamp: {.metadata.deletionTimestamp}{"\n"}Finalizers: {.metadata.finalizers}{"\n"}Owner references: {.metadata.ownerReferences[*].name}{"\n"}Sync status: {.status.sync.status}{"\n"}Health status: {.status.health.status}{"\n"}' \
    2>&1 || true
done

echo
echo "=== REMAINING RUNTIME RESOURCES ==="

kubectl -n goldengate-dev get \
  statefulsets,pods,services,ingresses \
  --ignore-not-found

echo
echo "=== PVCs ==="
kubectl -n goldengate-dev get pvc

echo
echo "=== APPLICATION CHECK COMPLETE ==="
