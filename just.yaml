elif [[ "${{ github.event.inputs.MODULE }}" == "oracle-vm-infra" ]]; then
  echo "Deploying Oracle VM infrastructure dependencies..."

  terraform init -plugin-dir="$PWD/.terraform/providers" \
    -backend-config="config/${{ env.TFVARS_ENV }}.config"

  terraform refresh \
    -var-file="tfvars/${{ env.TFVARS_ENV }}.tfvars"

  terraform plan \
    --target=module.base-infra \
    --target=module.oracle_vm_resource_group \
    -var-file="tfvars/${{ env.TFVARS_ENV }}.tfvars" \
    -out=plan.tfout

else