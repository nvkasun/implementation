#!/usr/bin/env bash
# GoldenGate EKS | Argo CD morning reconciliation v3
# Scope: discovered Applications + ApplicationSets in argocd namespace.
# Requires: kubectl, jq, kubeconfig with get/list/annotate/patch access.
# Non-destructive: no force, prune, replace, pod restarts, deletion, or PVC modification.
set -Eeuo pipefail

NS="${ARGOCD_NAMESPACE:-argocd}"
EXPECTED_CONTEXT="${EXPECTED_CONTEXT:-}"
WAIT="${WAIT_SECONDS:-300}"
REFRESH_WAIT="${REFRESH_WAIT_SECONDS:-90}"
POLL="${POLL_SECONDS:-10}"
LOG_DIR="${LOG_DIR:-./argocd-morning-logs}"
DRY=false
HARD=false
REFRESH_ONLY=false
SYNC_ALL=false
SYNC_UNKNOWN=false
SKIP_ECR=false
ECR_TIMEOUT="${ECR_TIMEOUT_SECONDS:-360}"
ECR_CRONJOB="${ECR_CRONJOB:-argocd-ecr-token-sync}"

usage() {
  cat <<'HELP'
Usage: ./argocd-morning-reconcile-v3.sh [options]
  --dry-run           Preview annotations and sync decisions; make no changes
  --refresh-only      Request refreshes but do not sync
  --hard-refresh      Invalidate Argo CD manifest cache (use only when needed)
  --sync-all          Request safe sync even for Synced applications (not default)
  --sync-unknown      Disabled for safety: Unknown requires successful comparison
  --skip-ecr          Skip the credential refresh (diagnostic use only)
  --ecr-timeout N     Time allowed for the refresh Job (default: 360s)
  --namespace NAME    Argo CD namespace (default: argocd)
  --context NAME      Refuse to run if current kubeconfig context does not match
  --wait-seconds N    Maximum final health wait (default: 300)
  --refresh-wait N    Time allowed for comparison after refresh (default: 90)
  --poll-seconds N    Poll interval (default: 10)
  -h, --help          Show help

By default: run ECR credential refresh Job and require success, then
refresh ApplicationSets/Applications, wait for comparison,
sync only OutOfSync Applications, and print unresolved diagnostics.
Exit code: 0 = all apps Synced/Healthy, 1 = unresolved, 2 = prereq/config error.
HELP
}
while (($#)); do
  case "$1" in
    --dry-run) DRY=true ;;
    --refresh-only) REFRESH_ONLY=true ;;
    --hard-refresh) HARD=true ;;
    --sync-all) SYNC_ALL=true ;;
    --sync-unknown) echo "--sync-unknown is disabled: sync status must be known" >&2; exit 2 ;;
    --skip-ecr) SKIP_ECR=true ;;
    --namespace|--context|--wait-seconds|--refresh-wait|--poll-seconds|--ecr-timeout)
      (($# > 1)) || { echo "Missing value for $1" >&2; exit 2; }
      case "$1" in
        --namespace) NS="$2" ;;
        --context) EXPECTED_CONTEXT="$2" ;;
        --wait-seconds) WAIT="$2" ;;
        --refresh-wait) REFRESH_WAIT="$2" ;;
        --poll-seconds) POLL="$2" ;;
        --ecr-timeout) ECR_TIMEOUT="$2" ;;
      esac
      shift ;;
    -h|--help) usage; exit 0 ;;
    *) echo "Unknown option: $1" >&2; usage >&2; exit 2 ;;
  esac
  shift
done
for x in kubectl jq date tee; do command -v "$x" >/dev/null || { echo "Missing required command: $x" >&2; exit 2; }; done
[[ "$WAIT" =~ ^[0-9]+$ && "$REFRESH_WAIT" =~ ^[0-9]+$ && "$POLL" =~ ^[1-9][0-9]*$ && "$ECR_TIMEOUT" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid time argument" >&2; exit 2; }
CTX="$(kubectl config current-context)"
[[ -z "$EXPECTED_CONTEXT" || "$CTX" == "$EXPECTED_CONTEXT" ]] || { echo "Context mismatch: $CTX" >&2; exit 2; }
kubectl get --raw=/readyz >/dev/null || { echo "Kubernetes API not ready" >&2; exit 2; }
kubectl get crd applications.argoproj.io applicationsets.argoproj.io >/dev/null || exit 2
kubectl auth can-i list applications.argoproj.io -n "$NS" | grep -qx yes || { echo "No Application list access" >&2; exit 2; }
kubectl auth can-i list applicationsets.argoproj.io -n "$NS" | grep -qx yes || { echo "No ApplicationSet list access" >&2; exit 2; }
mkdir -p "$LOG_DIR"
LOG_FILE="$LOG_DIR/argocd-morning-$(date -u +%Y%m%dT%H%M%SZ).log"
exec > >(tee -a "$LOG_FILE") 2>&1
echo "=== GoldenGate Argo CD reconciliation | $(date -u -Is) | context=$CTX | namespace=$NS | dry=$DRY ==="

app_json() { kubectl get applications.argoproj.io -n "$NS" -o json; }
set_json() { kubectl get applicationsets.argoproj.io -n "$NS" -o json; }
do_cmd() {
  printf ' +'; printf ' %q' "$@"; echo
  if ! "$DRY"; then "$@"; fi
}
safe_to_sync() {
  # Reject Applications whose existing policy enables potentially destructive
  # behaviour (even when this specific operation requests prune=false).
  jq -e '
    (.metadata.deletionTimestamp == null)
    and (.metadata.annotations["argocd.argoproj.io/skip-reconcile"] != "true")
    and (.operation == null)
    and ((.spec.syncPolicy.syncOptions // [] |
      map(select(test("^(Force|Replace|ServerSideApply)=true$";"i"))) | length) == 0)
    and ([.status.resources[]? | select(.requiresPruning == true)] | length == 0)
    and (.spec.syncPolicy.automated.prune != true)
  ' >/dev/null
}
conditions_error() {
  jq -e '[.status.conditions[]? | select(
    (.type | test("ComparisonError|InvalidSpecError|UnknownError|ManifestGenerationError";"i"))
  )] | length > 0' >/dev/null
}
# Phase 0: refresh existing Argo CD ECR OCI repository credentials FIRST.
# Never print Secret data or ECR passwords. The existing chart-owned CronJob
# contains the approved IRSA, aws-cli, and kubectl Secret-apply implementation.
if ! "$SKIP_ECR"; then
  echo "=== PHASE 0 | ECR OCI REPOSITORY CREDENTIAL REFRESH ==="
  kubectl get cronjob "$ECR_CRONJOB" -n "$NS" >/dev/null || {
    echo "ERROR: required CronJob $NS/$ECR_CRONJOB not found; cannot proceed" >&2; exit 2;
  }
  suspended="$(kubectl get cronjob "$ECR_CRONJOB" -n "$NS" -o jsonpath='{.spec.suspend}')"
  if [[ "$suspended" == "true" ]]; then
    echo "ERROR: ECR credential-refresh CronJob is suspended; refusing bypass" >&2; exit 2
  fi
  if "$DRY"; then
    echo "DRY RUN: would launch a one-off Job from CronJob $ECR_CRONJOB and verify completion before reconciliation"
  else
    # kubectl create job uses the LIVE CronJob template; no redeployment required.
    # Unique job name prevents collisions with scheduled jobs.
    job="argocd-ecr-refresh-$(date -u +%s)-$$"
    echo "Launching approved refresh Job: $job"
    kubectl create job "$job" --from="cronjob/$ECR_CRONJOB" -n "$NS" || {
      echo "ERROR: failed creating token-sync Job" >&2; exit 1;
    }
    if ! kubectl wait -n "$NS" --for=condition=complete "job/$job" --timeout="${ECR_TIMEOUT}s"; then
      echo "ERROR: ECR refresh Job failed or timed out: $job" >&2
      kubectl get "job/$job" -n "$NS" -o wide || true
      kubectl get pods -n "$NS" -l "job-name=$job" -o wide || true
      echo "Inspect safely: kubectl logs -n $NS job/$job"
      exit 1
    fi
    # Do not echo the raw Job logs into a shared console or log file: repository
    # sync scripts can occasionally print sensitive command diagnostics.
    echo "ECR refresh Job completed: $job (raw logs intentionally omitted)"
    # Verify repository Secret metadata only, never values/passwords.
    for secret in argocd-ecr-goldengate-oci argocd-ecr-goldengate-monitor-oci \
                  argocd-ecr-goldengate-platform-oci argocd-ecr-amazon-cloudwatch-observability-oci; do
      if ! kubectl get secret "$secret" -n "$NS" -o json | jq -e '
        .metadata.labels["argocd.argoproj.io/secret-type"] == "repository"
        and ((.data.url // "") | length > 0)
        and ((.data.password // "") | length > 0)
      ' >/dev/null; then
        echo "ERROR: repository Secret $secret is missing/incomplete after token refresh" >&2
        exit 1
      fi
      echo "Verified repository Secret metadata: $secret"
    done
  fi
else
  echo "WARNING: --skip-ecr selected; no credential refresh attempted"
fi

SETS="$(set_json)"
APPS="$(app_json)"
echo "Discovered $(jq '.items|length' <<<"$SETS") ApplicationSets; $(jq '.items|length' <<<"$APPS") Applications"
jq -r '.items[] | " - ApplicationSet \(.metadata.name)"' <<<"$SETS"
jq -r '.items[] | " - Application \(.metadata.name)"' <<<"$APPS"

while IFS= read -r name; do
  [[ -n "$name" ]] || continue
  echo "[ApplicationSet] refresh $name"
  do_cmd kubectl annotate applicationset "$name" -n "$NS" \
    argocd.argoproj.io/application-set-refresh=true --overwrite
done < <(jq -r '.items[].metadata.name' <<<"$SETS")

# ApplicationSet controller can create Applications after its refresh.
if ! "$DRY"; then sleep 8; fi
APPS="$(app_json)"
REFRESH=normal
"$HARD" && REFRESH=hard
while IFS= read -r name; do
  [[ -n "$name" ]] || continue
  echo "[Application] $REFRESH refresh $name"
  do_cmd kubectl annotate application "$name" -n "$NS" \
    "argocd.argoproj.io/refresh=$REFRESH" --overwrite
done < <(jq -r '.items[].metadata.name' <<<"$APPS")

if "$DRY"; then
  echo "DRY RUN: no changes performed. Unknown status needs refreshed comparison/diagnostics on a live run."
  exit 0
fi

# Argo CD clears refresh annotation after processing it; wait instead of
# reading stale Unknown status immediately as in the earlier script.
echo "Waiting up to ${REFRESH_WAIT}s for Argo CD to process refresh requests..."
deadline=$((SECONDS + REFRESH_WAIT))
while :; do
  APPS="$(app_json)"
  pending="$(jq '[.items[] | select((.metadata.annotations["argocd.argoproj.io/refresh"] // "") != "")] | length' <<<"$APPS")"
  unknown="$(jq '[.items[] | select((.status.sync.status // "Unknown") == "Unknown")] | length' <<<"$APPS")"
  echo " refresh-pending=$pending sync-unknown=$unknown"
  if [[ "$pending" -eq 0 && "$unknown" -eq 0 ]]; then break; fi
  (( SECONDS < deadline )) || break
  sleep "$POLL"
done

failures=0
while IFS= read -r name; do
  [[ -n "$name" ]] || continue
  obj="$(jq -c --arg name "$name" '.items[] | select(.metadata.name == $name)' <<<"$APPS")"
  sync="$(jq -r '.status.sync.status // "Unknown"' <<<"$obj")"
  health="$(jq -r '.status.health.status // "Unknown"' <<<"$obj")"
  echo "[Check] $name sync=$sync health=$health"
  "$REFRESH_ONLY" && continue

  case "$sync" in
    OutOfSync) : ;;
    Synced) if ! "$SYNC_ALL"; then echo "  Synced; no sync requested"; continue; fi ;;
    Unknown)
      echo "  BLOCKED: Unknown desired-state comparison; inspect conditions, do not request sync"
      ((failures+=1)); continue
      ;;
    *) echo "  BLOCKED: unsupported sync status $sync"; ((failures+=1)); continue ;;
  esac
  if ! safe_to_sync <<<"$obj"; then
    echo "  BLOCKED: active operation, skip/deletion marker, potentially destructive sync option or pruning candidate."
    ((failures+=1)); continue
  fi
  echo "  Requesting non-pruning, non-forcing Argo CD sync."
  # Verified Argo CD CRD operation schema. Explicit prune=false, force=false.
  # IMPORTANT: do not touch application spec.syncPolicy.
  if ! do_cmd kubectl patch applications.argoproj.io "$name" -n "$NS" --type merge \
    -p '{"operation":{"initiatedBy":{"username":"morning-reconcile"},"sync":{"prune":false,"syncStrategy":{"apply":{"force":false}},"syncOptions":["Prune=false","Replace=false","Force=false","ServerSideApply=false"]}}}'; then
    echo "  ERROR: unable to request sync"
    ((failures+=1))
  fi
done < <(jq -r '.items[].metadata.name' <<<"$APPS")

echo "Waiting up to ${WAIT}s for application health/sync convergence..."
deadline=$((SECONDS + WAIT))
while :; do
  APPS="$(app_json)"
  unresolved="$(jq '[.items[] | select(.status.sync.status != "Synced" or .status.health.status != "Healthy" or .operation != null)] | length' <<<"$APPS")"
  echo " unresolved=$unresolved"
  [[ "$unresolved" -eq 0 ]] && break
  (( SECONDS < deadline )) || break
  sleep "$POLL"
done

echo "=== FINAL APPLICATION STATES ==="
jq -r '.items[] | [
  .metadata.name, (.status.sync.status // "Unknown"),
  (.status.health.status // "Unknown"),
  (.status.operationState.phase // "none"),
  (.status.operationState.message // "")
] | @tsv' <<<"$APPS"

echo "=== CONDITIONS / PROBLEM RESOURCES ==="
jq -r '.items[] | select(.status.sync.status != "Synced" or .status.health.status != "Healthy" or .operation != null) |
 "APP \(.metadata.name)\n" +
 "  Conditions: \((.status.conditions // []) | map("\(.type): \(.message)") | join(" | "))\n" +
 "  Operation: \(.status.operationState.message // "none")\n" +
 "  Resources: \((.status.resources // []) |
   map(select((.health.status // "Healthy") != "Healthy" or .status == "OutOfSync") |
       "\(.kind)/\(.name) [\(.health.status // "Unknown"), \(.status // "?")]: \(.health.message // "")") | join(" | "))"
' <<<"$APPS"

if [[ "$unresolved" -gt 0 || "$failures" -gt 0 ]]; then
  echo "UNRESOLVED: $unresolved application(s); $failures blocked/failed sync(s)."
  echo "If all Applications stay Unknown, inspect argocd-repo-server logs and ECR token-sync CronJob."
  echo "  kubectl logs -n $NS deployment/argocd-repo-server --since=30m --tail=200"
  echo "  kubectl get cronjobs,jobs -n $NS"
  echo "Log: $LOG_FILE"
  exit 1
fi
echo "SUCCESS: all Applications Synced and Healthy. Log: $LOG_FILE"
