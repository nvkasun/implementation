#!/usr/bin/env bash
# GoldenGate EKS DEV -- read-only pre-reset audit. Makes no changes: kubectl get/logs/exec (read-only commands only), AWS describe/get/query only.
# Never prints secret values: in-pod checks read OGG_ADMIN/OGG_ADMIN_PWD from the container environment and print deployment names only.
# Usage: bash gg-dev-reset-preflight.sh 2>&1 | tee gg-dev-reset-preflight-$(date +%Y%m%d-%H%M%S).log
set -u

ENV_NAME="${ENV_NAME:-dev}"
NS="${NS:-goldengate-dev}"
ARGO_NS="${ARGO_NS:-argocd}"
REGION="${AWS_REGION:-eu-west-1}"
DDB_TABLE="${DDB_TABLE:-gg-eks-pipeline}"
RUNTIMES="${RUNTIMES:-gg-postgresql-repltest-001 gg-mssql-repltest-001 gg-oracle-repltest-002 gg-postgresql-repltest-002}"
PRE_HIERARCHY_IDS="${PRE_HIERARCHY_IDS:-gg-postgresql-repltest-01 gg-mssql-repltest-01 gg-oracle-repltest-01 gg-postgresql-repltest-02}"

FINDINGS=()
section() { printf '\n==================== %s ====================\n' "$1"; }
note() { printf '%s\n' "$*"; }
finding() { FINDINGS+=("$1"); printf '>>> %s\n' "$1"; }
run() { printf '$ %s\n' "$*"; "$@" 2>&1 || printf '(command exited %s)\n' "$?"; }

section "0. Tooling and identity"
for tool in kubectl aws; do command -v "$tool" >/dev/null 2>&1 && note "OK: $tool $(command -v "$tool")" || finding "BLOCKER: $tool not found"; done
run aws sts get-caller-identity --query Account --output text --region "$REGION"
run kubectl config current-context
run kubectl version --request-timeout=20s

section "1. Argo CD ownership (runtime ApplicationSets/Applications)"
run kubectl -n "$ARGO_NS" get applicationsets.argoproj.io -o custom-columns=NAME:.metadata.name,CREATED:.metadata.creationTimestamp --request-timeout=30s
run kubectl -n "$ARGO_NS" get applications.argoproj.io -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision,DELETING:.metadata.deletionTimestamp --request-timeout=30s
for old in $PRE_HIERARCHY_IDS; do
  suffix="${old#gg-}"
  if kubectl -n "$ARGO_NS" get applications.argoproj.io "goldengate-${ENV_NAME}-${suffix}" >/dev/null 2>&1 || kubectl -n "$ARGO_NS" get applicationsets.argoproj.io "goldengate-${ENV_NAME}-${suffix}-appset" >/dev/null 2>&1; then
    finding "WARNING: pre-hierarchy Argo CD object still exists for ${old}"
  fi
done

section "2. Runtime compute"
run kubectl -n "$NS" get statefulsets -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,REPLICAS:.spec.replicas,REVISION:.status.currentRevision --request-timeout=30s
run kubectl -n "$NS" get pods -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[*].ready,RESTARTS:.status.containerStatuses[*].restartCount,STARTED:.status.startTime,NODE:.spec.nodeName --request-timeout=30s

for rt in $RUNTIMES; do
  section "2.${rt}"
  pod="${rt}-0"
  if ! kubectl -n "$NS" get pod "$pod" >/dev/null 2>&1; then
    note "pod ${pod} not present"
    continue
  fi
  container="$(kubectl -n "$NS" get pod "$pod" -o jsonpath='{.spec.containers[0].name}')"
  note "container: ${container}"
  note "image: $(kubectl -n "$NS" get pod "$pod" -o jsonpath='{.spec.containers[0].image}')"
  note "spec OGG_DEPLOYMENT: $(kubectl -n "$NS" get pod "$pod" -o jsonpath='{.spec.containers[0].env[?(@.name=="OGG_DEPLOYMENT")].value}')"
  note "spec OGG_DEPLOYMENT_SCRIPTS: $(kubectl -n "$NS" get pod "$pod" -o jsonpath='{.spec.containers[0].env[?(@.name=="OGG_DEPLOYMENT_SCRIPTS")].value}')"
  note "u02 claim: $(kubectl -n "$NS" get pod "$pod" -o jsonpath='{.spec.volumes[?(@.name=="u02")].persistentVolumeClaim.claimName}')"
  identity_mounts="$(kubectl -n "$NS" get pod "$pod" -o jsonpath='{range .spec.containers[0].volumeMounts[*]}{.name}={.mountPath}{"\n"}{end}' | grep goldengate-identity || true)"
  if [ -n "$identity_mounts" ]; then note "identity hook mounts:"; note "$identity_mounts"; else finding "WARNING: ${rt} pod has no goldengate-identity mounts (resolver chart not running on this pod)"; fi

  note "--- identity hook log lines (current container)"
  kubectl -n "$NS" logs "$pod" -c "$container" --tail=-1 2>/dev/null | grep 'goldengate-identity' | tail -n 10 || true

  note "--- image startup contract (read-only)"
  kubectl -n "$NS" exec "$pod" -c "$container" -- sh -c '
    head -1 /usr/local/bin/deployment-main.sh 2>/dev/null
    grep -nE "run_user_scripts|[[:space:]]source |^[[:space:]]*replace-variables\.sh|^start_ogg|^start_nginx" /usr/local/bin/deployment-main.sh 2>/dev/null
    for d in "${OGG_DEPLOYMENT_SCRIPTS:-/u01/ogg/scripts}/setup" "${OGG_DEPLOYMENT_SCRIPTS:-/u01/ogg/scripts}/startup"; do echo "dir $d:"; ls -1 "$d" 2>&1; done
    echo "rendered NGINX deployment routes:"; grep -ohE "/services/[^/ ]+/(adminsrvr|distsrvr|pmsrvr|recvsrvr)" /etc/nginx/*.conf 2>/dev/null | sort -u
    echo "persistent layout:"; for p in /u02/ServiceManager /u02/Deployment/etc /u02/ServiceManager/etc/conf/deploymentRegistry.dat; do [ -e "$p" ] && echo "present $p" || echo "absent  $p"; done
  ' 2>&1

  note "--- Service Manager registered deployments (names only)"
  kubectl -n "$NS" exec "$pod" -c "$container" -- python3 -c '
import base64, json, os, urllib.request
token = base64.b64encode((os.environ.get("OGG_ADMIN", "") + ":" + os.environ.get("OGG_ADMIN_PWD", "")).encode()).decode()
req = urllib.request.Request("http://127.0.0.1:9011/services/v2/deployments", headers={"Authorization": "Basic " + token, "Accept": "application/json"})
try:
    with urllib.request.build_opener(urllib.request.ProxyHandler({})).open(req, timeout=10) as r:
        items = json.loads(r.read()).get("response", {}).get("items", [])
        print("HTTP", r.status, "registered:", sorted(i.get("name") for i in items if isinstance(i, dict)))
except Exception as e:
    print("request failed:", type(e).__name__, getattr(e, "code", ""))
' 2>&1
done

section "3. Persistent volume claims and volumes"
run kubectl -n "$NS" get pvc -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,VOLUME:.spec.volumeName,SC:.spec.storageClassName,SYNC_OPTIONS:.metadata.annotations.argocd\\.argoproj\\.io/sync-options,CREATED:.metadata.creationTimestamp --request-timeout=30s
run kubectl get pv -o custom-columns=NAME:.metadata.name,CLAIM_NS:.spec.claimRef.namespace,CLAIM:.spec.claimRef.name,STATUS:.status.phase,RECLAIM:.spec.persistentVolumeReclaimPolicy,SC:.spec.storageClassName,HANDLE:.spec.csi.volumeHandle --request-timeout=30s
run kubectl get storageclass -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner,RECLAIM:.reclaimPolicy,FS:.parameters.fileSystemId,BASE:.parameters.basePath,PERMS:.parameters.directoryPerms --request-timeout=30s
non_retain="$(kubectl get pv -o jsonpath='{range .items[?(@.spec.claimRef.namespace=="'"$NS"'")]}{.metadata.name} {.spec.persistentVolumeReclaimPolicy}{"\n"}{end}' | awk '$2 != "Retain"')"
[ -n "$non_retain" ] && finding "WARNING: GoldenGate PV(s) without Retain: ${non_retain}"

section "4. Managed EFS filesystems (ManagedBy=goldengate-eks-app)"
GG_FS="$(aws efs describe-file-systems --region "$REGION" --query "FileSystems[?Tags[?Key=='ManagedBy' && Value=='goldengate-eks-app']].FileSystemId" --output text 2>/dev/null)"
run aws efs describe-file-systems --region "$REGION" --query "FileSystems[?Tags[?Key=='ManagedBy' && Value=='goldengate-eks-app']].{id:FileSystemId,token:CreationToken,state:LifeCycleState,mts:NumberOfMountTargets,deployment:Tags[?Key=='GoldenGateDeploymentId']|[0].Value,env:Tags[?Key=='GoldenGateEnvironment']|[0].Value}" --output table
old_tokens=0; canonical_tokens=0
for fs in $GG_FS; do
  token="$(aws efs describe-file-systems --region "$REGION" --file-system-id "$fs" --query 'FileSystems[0].CreationToken' --output text)"
  tag="$(aws efs describe-file-systems --region "$REGION" --file-system-id "$fs" --query "FileSystems[0].Tags[?Key=='GoldenGateDeploymentId']|[0].Value" --output text)"
  if [ "$token" = "${ENV_NAME}-${tag}-efs" ]; then canonical_tokens=$((canonical_tokens + 1)); else old_tokens=$((old_tokens + 1)); note "pre-reset token: ${fs} tag=${tag} token=${token}"; fi
  note "--- ${fs}: access points"
  aws efs describe-access-points --region "$REGION" --file-system-id "$fs" --query "AccessPoints[].{ap:AccessPointId,path:RootDirectory.Path,state:LifeCycleState,uid:PosixUser.Uid}" --output table 2>&1
  note "--- ${fs}: mount targets"
  aws efs describe-mount-targets --region "$REGION" --file-system-id "$fs" --query "MountTargets[].{mt:MountTargetId,subnet:SubnetId,az:AvailabilityZoneName,state:LifeCycleState}" --output table 2>&1
  note "--- ${fs}: replication / backup / file-system policy"
  aws efs describe-replication-configurations --region "$REGION" --file-system-id "$fs" --query "Replications[].Destinations[].{dest:FileSystemId,status:Status}" --output text 2>&1 | sed 's/^/replication: /'
  aws efs describe-backup-policy --region "$REGION" --file-system-id "$fs" --query "BackupPolicy.Status" --output text 2>&1 | sed 's/^/backup policy: /'
  aws efs describe-file-system-policy --region "$REGION" --file-system-id "$fs" --query "length(Policy)" --output text >/dev/null 2>&1 && note "file-system policy: present" || note "file-system policy: none"
  others="$(kubectl get pv -o jsonpath='{range .items[*]}{.metadata.name} {.spec.claimRef.namespace} {.spec.csi.volumeHandle}{"\n"}{end}' | awk -v fs="$fs" -v ns="$NS" 'index($3, fs) == 1 && $2 != ns')"
  [ -n "$others" ] && finding "BLOCKER: ${fs} is referenced by a PV outside ${NS}: ${others}"
done
note "GoldenGate filesystems: pre-reset tokens=${old_tokens} canonical tokens=${canonical_tokens}"
[ "$old_tokens" -gt 0 ] && finding "INFO: ${old_tokens} filesystem(s) carry pre-reset creation tokens -- with fbe560a on main every deploy run fails Phase 1 until they are retired"
[ "$canonical_tokens" -gt 0 ] && finding "WARNING: ${canonical_tokens} filesystem(s) already carry canonical tokens -- a Terraform apply has run against the new naming; review before continuing"

section "5. DynamoDB ${DDB_TABLE} items (keys and timestamps only)"
for id in $RUNTIMES $PRE_HIERARCHY_IDS; do
  out="$(aws dynamodb query --region "$REGION" --table-name "$DDB_TABLE" --key-condition-expression "pipeline = :p" \
        --expression-attribute-values "{\":p\":{\"S\":\"${id}\"}}" --projection-expression "recordType, recordedAt" \
        --query "Items[].[recordType.S, recordedAt.N]" --output text 2>&1)"
  note "${id}:"; note "${out:-  (none)}"
  case " $PRE_HIERARCHY_IDS " in *" $id "*) [ -n "$out" ] && finding "INFO: items remain under pre-hierarchy id ${id} (ignored by the monitor; optional cleanup)";; esac
  case " $RUNTIMES " in *" $id "*) echo "$out" | grep -E '^STATE#' | grep -v '^STATE#_deployment' >/dev/null && finding "WARNING: process STATE# rows exist under ${id}; they persist across the reset and would surface as stale rows";; esac
done

section "6. Not checkable from this host"
note "- Terraform state: ask the Terraform owner for 'terraform state list | grep goldengate_runtime_efs' and the creation_token of each instance."
note "- GitHub Actions: result of the automatic push run for commit fbe560a (00 | MAIN | GoldenGate EKS End-to-End Deployment)."

section "SUMMARY"
if [ "${#FINDINGS[@]}" -eq 0 ]; then note "no findings"; else printf '%s\n' "${FINDINGS[@]}"; fi
