name: Oracle DB on Azure Release

run-name: >-
  Oracle DB on Azure - ${{ inputs.mode }} -
  ${{ inputs.environment }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - tf-dev

      mode:
        description: "Run mode"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - plan_and_apply

      terraform_version:
        description: "Terraform version"
        type: string
        required: true
        default: "1.6.3"


permissions:
  contents: read
  id-token: write


# ============================================================
# CCOE APPROVAL
# ============================================================

jobs:

  Approval-CCOE:
    name: CCOE Approval
    runs-on: ubuntu-latest
    environment: approval-ccoe

    steps:
      - name: Approval CCOE
        run: |
          echo "CCOE approval completed."


  # ==========================================================
  # TERRAFORM INIT
  #
  # Purpose:
  # - Obtain CICD GitHub App token
  # - Checkout CIBG repository
  # - Authenticate access to private Terraform modules
  # - Download Terraform providers/modules
  # - Upload .terraform for the self-hosted plan runner
  # ==========================================================

  terraform-init:
    name: Terraform Init
    needs:
      - Approval-CCOE

    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TFVARS_ENV: ${{ vars.TFVARS_ENV }}

    steps:

      - name: Create CICD Bot token
        id: cicd-bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CICD_BOT_APP_ID || '981379' }}
          private-key: ${{ secrets.CICD_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}


      - name: Checkout CIBG repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.cicd-bot-token.outputs.token }}
          persist-credentials: false


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false


      - name: Terraform Init - Download Providers and Private Modules
        working-directory: terraform

        env:
          GH_TOKEN: ${{ steps.cicd-bot-token.outputs.token }}

        run: |
          set -euo pipefail

          echo "::add-mask::$GH_TOKEN"

          #
          # Make private GitHub Terraform module sources such as:
          #
          # git::https://github.com/AbuDhabiCommercialBank/maz-tf-module-storage.git
          #
          # authenticate using the CICD GitHub App token.
          #
          # The authentication is process-scoped and is NOT written
          # permanently to the self-hosted runner's git configuration.
          #

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"

          terraform init -backend=false

          terraform validate

          tar -czf terraform_modules.tar.gz .terraform

          if [ -f .terraform.lock.hcl ]; then
            tar -czf terraform_lock.tar.gz .terraform.lock.hcl
          fi


      - name: Upload Terraform Modules
        uses: actions/upload-artifact@v4
        with:
          name: oracle-terraform-modules
          path: terraform/terraform_modules.tar.gz
          retention-days: 1


      - name: Upload Terraform Lock
        uses: actions/upload-artifact@v4
        with:
          name: oracle-terraform-lock
          path: terraform/terraform_lock.tar.gz
          retention-days: 1
          if-no-files-found: ignore


  # ==========================================================
  # TERRAFORM PLAN
  #
  # Oracle implementation only.
  #
  # Existing Oracle subnet and RG remain part of the isolated
  # stack, but Terraform will only change them if code/state
  # actually differs.
  # ==========================================================

  terraform-plan:
    name: Terraform Plan
    needs:
      - terraform-init

    runs-on: self-hosted
    environment: ${{ inputs.environment }}

    env:
      TFVARS_ENV: ${{ vars.TFVARS_ENV }}

      AZURE_IDENTITY: ${{ vars.AZURE_IDENTITY }}
      AZURE_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION }}
      AZURE_TENANT: ${{ vars.AZURE_TENANT }}

      ARM_CLIENT_ID: ${{ vars.AZURE_IDENTITY }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT }}
      ARM_USE_OIDC: "true"

    steps:

      - name: Create CICD Bot token
        id: cicd-bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CICD_BOT_APP_ID || '981379' }}
          private-key: ${{ secrets.CICD_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}


      - name: Checkout CIBG repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.cicd-bot-token.outputs.token }}
          persist-credentials: false


      - name: Download Terraform Modules
        uses: actions/download-artifact@v4
        with:
          name: oracle-terraform-modules
          path: terraform


      - name: Download Terraform Lock
        uses: actions/download-artifact@v4
        with:
          name: oracle-terraform-lock
          path: terraform


      - name: Extract Terraform Modules
        working-directory: terraform
        run: |
          set -euo pipefail

          tar -xzf terraform_modules.tar.gz

          if [ -f terraform_lock.tar.gz ]; then
            tar -xzf terraform_lock.tar.gz
          fi

          rm -f terraform_modules.tar.gz terraform_lock.tar.gz


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false


      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_IDENTITY }}
          tenant-id: ${{ env.AZURE_TENANT }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION }}


      - name: Terraform Init
        working-directory: terraform

        env:
          GH_TOKEN: ${{ steps.cicd-bot-token.outputs.token }}

        run: |
          set -euo pipefail

          echo "::add-mask::$GH_TOKEN"

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"

          terraform init \
            -plugin-dir="$PWD/.terraform/providers" \
            -backend-config="config/${TFVARS_ENV}.config"


      - name: Terraform Plan - Oracle DB on Azure
        working-directory: terraform

        env:
          GH_TOKEN: ${{ steps.cicd-bot-token.outputs.token }}

        run: |
          set -euo pipefail

          echo "::add-mask::$GH_TOKEN"

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"

          echo "======================================================"
          echo "Planning Oracle DB on Azure"
          echo "Environment : ${TFVARS_ENV}"
          echo "======================================================"

          terraform plan \
            -no-color \
            -input=false \
            --target=module.base-infra \
            --target=module.oracle_vm_resource_group \
            --target=azurerm_user_assigned_identity.oracle_binary_vm \
            --target=module.oracle_binary_vm01 \
            --target=module.oracle_binary_vm02 \
            --target=azurerm_lb.oracle_db \
            --target=azurerm_lb_backend_address_pool.oracle_db \
            --target=azurerm_network_interface_backend_address_pool_association.oracle_db \
            --target=azurerm_lb_probe.oracle_db_health \
            --target=azurerm_lb_rule.oracle_db \
            --target=module.oracle_binary_storage \
            --target=azurerm_role_assignment.oracle_binary_blob_access \
            --target=azurerm_private_dns_zone_virtual_network_link.oracle_binary_storage \
            -var-file="tfvars/${TFVARS_ENV}.tfvars" \
            -out=oracle-plan.tfout


      - name: Show Terraform Plan
        working-directory: terraform
        run: |
          terraform show -no-color oracle-plan.tfout


      - name: Upload Oracle Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: oracle-terraform-plan
          path: terraform/oracle-plan.tfout
          retention-days: 1


  # ==========================================================
  # TERRAFORM APPLY
  #
  # Runs only when:
  #
  # mode = plan_and_apply
  #
  # The exact plan generated above is applied.
  # ==========================================================

  terraform-apply:
    name: Terraform Apply

    if: ${{ inputs.mode == 'plan_and_apply' }}

    needs:
      - terraform-plan

    runs-on: self-hosted
    environment: ${{ inputs.environment }}

    env:
      TFVARS_ENV: ${{ vars.TFVARS_ENV }}

      AZURE_IDENTITY: ${{ vars.AZURE_IDENTITY }}
      AZURE_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION }}
      AZURE_TENANT: ${{ vars.AZURE_TENANT }}

      ARM_CLIENT_ID: ${{ vars.AZURE_IDENTITY }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT }}
      ARM_USE_OIDC: "true"

    steps:

      - name: Create CICD Bot token
        id: cicd-bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CICD_BOT_APP_ID || '981379' }}
          private-key: ${{ secrets.CICD_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}


      - name: Checkout CIBG repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.cicd-bot-token.outputs.token }}
          persist-credentials: false


      - name: Download Terraform Modules
        uses: actions/download-artifact@v4
        with:
          name: oracle-terraform-modules
          path: terraform


      - name: Download Terraform Lock
        uses: actions/download-artifact@v4
        with:
          name: oracle-terraform-lock
          path: terraform


      - name: Download Oracle Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: oracle-terraform-plan
          path: terraform


      - name: Extract Terraform Modules
        working-directory: terraform
        run: |
          set -euo pipefail

          tar -xzf terraform_modules.tar.gz

          if [ -f terraform_lock.tar.gz ]; then
            tar -xzf terraform_lock.tar.gz
          fi

          rm -f terraform_modules.tar.gz terraform_lock.tar.gz


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false


      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_IDENTITY }}
          tenant-id: ${{ env.AZURE_TENANT }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION }}


      - name: Terraform Init
        working-directory: terraform

        env:
          GH_TOKEN: ${{ steps.cicd-bot-token.outputs.token }}

        run: |
          set -euo pipefail

          echo "::add-mask::$GH_TOKEN"

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"

          terraform init \
            -plugin-dir="$PWD/.terraform/providers" \
            -backend-config="config/${TFVARS_ENV}.config"


      - name: Terraform Apply - Oracle DB on Azure
        working-directory: terraform
        run: |
          set -euo pipefail

          echo "======================================================"
          echo "Applying approved Oracle DB on Azure Terraform plan"
          echo "Environment : ${TFVARS_ENV}"
          echo "======================================================"

          terraform apply \
            -input=false \
            -auto-approve \
            oracle-plan.tfout