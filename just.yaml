module "lb_test_vm03" {
  source = "./modules/virtual-machine"

  resource_group_name = module.oracle_db_resource_group.rg_name
  application_name    = "003"
  environment         = var.environment

  subnet_id    = module.base-infra.subnet_map["snet-lb-cl-factory-uaenorth-001"].id
  key_vault_id = module.azure_key_vault.id

  dns_servers   = []
  computer_name = "lbtestvm03"

  vm = {
    os_type = "linux"
  }

  vm_size          = "Standard_B1s"
  availability_zone = "1"

  source_image_reference = {
    publisher = "RedHat"
    offer     = "RHEL"
    sku       = "94_gen2"
    version   = "latest"
  }

  admin_username = "azureuser"
  admin_password = var.oracle_db_vm_admin_password

  managed_identities = {
    system_assigned = true
  }

  os_disk = {
    caching              = "ReadWrite"
    storage_account_type = "StandardSSD_LRS"
    disk_size_gb         = 32
  }

  accelerated_networking_enabled = false
  ip_forwarding_enabled          = false
  enable_boot_diagnostics        = true
  encryption_at_host_enabled     = false
  patch_mode_linux               = "ImageDefault"

  tags = local.tags
}