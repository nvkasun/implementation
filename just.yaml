kubectl exec -n goldengate-dev \
  gg-postgresql-repltest-002-0 \
  -c ogg-postgresql -- sh -c '
echo "=== GOLDENGATE ADMIN VALIDATION ==="

ps -ef | grep "[/]u01/ogg/bin/adminsrvr" || true

for path in \
  /services/v2/extracts \
  /services/v2/replicats
do
  code=$(curl -sk --max-time 10 \
    -o /dev/null -w "%{http_code}" \
    "https://127.0.0.1:8443${path}")

  echo "$path => HTTP $code"
done
'