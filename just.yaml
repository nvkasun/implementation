Next: prepare the health agent

Before I give you the VM4 health-agent code, let's check what Python this RHEL 9.8 build has. VM1/VM2 used an older Python-based agent, but I don't want to assume the same runtime exists here.

Run these as azureuser:

python3 --version
which python3

and:

python --version 2>&1
which python 2>/dev/null

Also verify that the Oracle service is reachable locally now:

timeout 5 bash -c '</dev/tcp/127.0.0.1/1521' \
&& echo "LOCAL 1521 SUCCESS" || echo "LOCAL 1521 FAILED"