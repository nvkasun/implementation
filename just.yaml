I’d replace your current load_balancer.tf with this:

# ==============================================================================
# Oracle on Azure - Database Internal Load Balancer
# ==============================================================================

resource "azurerm_lb" "oracle_db" {
  name                = "lb-CloudFactory-${var.environment}-uaenorth-oracledb"
  location            = var.location
  resource_group_name = module.oracle_db_resource_group.rg_name

  sku      = "Standard"
  sku_tier = "Regional"

  frontend_ip_configuration {
    name = "fe-oracledb"

    subnet_id = module.base-infra.subnet_map[
      "snet-lb-cl-factory-uaenorth-001"
    ].id

    private_ip_address_allocation = "Dynamic"
  }

  tags = local.tags
}


# ==============================================================================
# Oracle Database Backend Pool
# ==============================================================================

resource "azurerm_lb_backend_address_pool" "oracle_db" {
  name            = "be-oracledb"
  loadbalancer_id = azurerm_lb.oracle_db.id
}


# ==============================================================================
# Oracle VM Backend NICs
#
# All Oracle VMs participating in this LB are registered here.
# Add/remove VMs only from this map.
# ==============================================================================

locals {
  oracle_db_backend_nics = {
    vm01 = module.oracle_db_vm01.network_interface_id
    vm02 = module.oracle_db_vm02.network_interface_id
    vm03 = module.oracle_db_vm03.network_interface_id
    vm04 = module.oracle_db_vm04.network_interface_id
  }
}


# ==============================================================================
# Attach Oracle VMs to LB Backend Pool
# ==============================================================================

resource "azurerm_network_interface_backend_address_pool_association" "oracle_db" {
  for_each = local.oracle_db_backend_nics

  network_interface_id    = each.value
  ip_configuration_name   = "internal"
  backend_address_pool_id = azurerm_lb_backend_address_pool.oracle_db.id
}


# ==============================================================================
# Oracle Database Health Probe
#
# The Azure Load Balancer calls the custom Python health endpoint.
#
# LB -> VM:8080/health
#
# The Python health agent then checks Oracle internally using
# var.oracle_listener_port.
# ==============================================================================

resource "azurerm_lb_probe" "oracle_db_health" {
  name            = "hp-oracledb"
  loadbalancer_id = azurerm_lb.oracle_db.id

  protocol     = "Http"
  port         = 8080
  request_path = "/health"

  interval_in_seconds = 5
  number_of_probes    = 2
}


# ==============================================================================
# Oracle Database Load Balancing Rule
#
# Oracle application traffic uses the environment-specific listener port.
#
# Example:
# UAT  -> 1525
# PROD -> 1521
#
# Frontend and backend ports always use the same value.
# ==============================================================================

resource "azurerm_lb_rule" "oracle_db" {
  name            = "lbr-oracledb-${var.oracle_listener_port}"
  loadbalancer_id = azurerm_lb.oracle_db.id

  protocol = "Tcp"

  frontend_port = var.oracle_listener_port
  backend_port  = var.oracle_listener_port

  frontend_ip_configuration_name = "fe-oracledb"

  backend_address_pool_ids = [
    azurerm_lb_backend_address_pool.oracle_db.id
  ]

  probe_id = azurerm_lb_probe.oracle_db_health.id

  idle_timeout_in_minutes = 30

  tcp_reset_enabled  = true
  enable_floating_ip = false
}

Then in variables.tf, add:

variable "oracle_listener_port" {
  description = "Oracle listener port used by all Oracle database VMs in this environment"
  type        = number

  validation {
    condition = (
      var.oracle_listener_port >= 1 &&
      var.oracle_listener_port <= 65535
    )

    error_message = "oracle_listener_port must be between 1 and 65535."
  }
}

And in your tfvars/dev.tfvars, for example:

oracle_listener_port = 1521

If UAT uses another port:

oracle_listener_port = 1525