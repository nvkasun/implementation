Most likely correct fix

For oracle-database.service only, we should run Oracle's own startup utilities using the actual Oracle software owner, oraade.

Change:

User=oracle
Group=dba

to:

User=oraade
Group=dba

Do not change the health agent. oracle-health.service can remain:

User=oracle
Group=dba

because we've already proven the health agent works perfectly as that account.

So your corrected DB unit should be:

[Unit]
Description=Oracle Database and Listener
RequiresMountsFor=/OraHome /OraData
After=network-online.target oracle-hostname-fix.service
Wants=network-online.target
Requires=oracle-hostname-fix.service

[Service]
Type=oneshot
User=oraade
Group=dba
RemainAfterExit=yes

Environment="ORACLE_HOME=/OraHome/ora26ai_DB_Home"
Environment="ORACLE_SID=DFCASHUAT1"
Environment="PATH=/OraHome/ora26ai_DB_Home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin"
Environment="LD_LIBRARY_PATH=/OraHome/ora26ai_DB_Home/lib"

ExecStart=/bin/bash -c '/OraHome/ora26ai_DB_Home/bin/lsnrctl status >/dev/null 2>&1 || /OraHome/ora26ai_DB_Home/bin/lsnrctl start'
ExecStart=/bin/bash /OraHome/ora26ai_DB_Home/bin/dbstart /OraHome/ora26ai_DB_Home

ExecStop=/bin/bash /OraHome/ora26ai_DB_Home/bin/dbshut /OraHome/ora26ai_DB_Home
ExecStop=/bin/bash -c '/OraHome/ora26ai_DB_Home/bin/lsnrctl status >/dev/null 2>&1 && /OraHome/ora26ai_DB_Home/bin/lsnrctl stop || true'

TimeoutStartSec=300
TimeoutStopSec=300

[Install]
WantedBy=multi-user.target
Test before another reboot

Edit:

sudo vi /etc/systemd/system/oracle-database.service

Only change:

User=oracle

to:

User=oraade

Then:

sudo systemctl daemon-reload
sudo systemd-analyze verify /etc/systemd/system/oracle-database.service
sudo systemctl reset-failed oracle-database.service
sudo systemctl stop oracle-database.service 2>/dev/null || true
sudo systemctl start oracle-database.service

Now check:

sudo systemctl status oracle-database.service --no-pager

But this time don't trust only active (exited). We learned something important: dbstart can return exit code 0 even when its internal startup failed.

Check the real DB:

sudo -iu oraade

Then:

export ORACLE_HOME=/OraHome/ora26ai_DB_Home
export ORACLE_SID=DFCASHUAT1
export PATH=$ORACLE_HOME/bin:$PATH

sqlplus / as sysdba

Inside:

select instance_name, status from v$instance;
select name, open_mode, database_role from v$database;
exit;

We want:

DFCASHUAT1    OPEN

DFCASHUA      READ WRITE    PRIMARY

Then:

lsnrctl status

After that return to azureuser:

exit
sleep 15
curl -i http://127.0.0.1:8080/health

We want the health agent to automatically change back to:

HTTP/1.0 200 OK

with:

"healthy": true
"status": "HEALTHY"