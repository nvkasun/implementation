Current implementation uses the Linux oracle OS user with dba group access, and the health agent connects locally to the Oracle instance using sqlplus / as sysdba. With this approach, we do not need to maintain a DB username/password inside the health service. If we use a dedicated DB user instead, we would need to change the authentication method and also introduce a secure credential storage mechanism, such as Key Vault, Oracle Wallet, or another approved secret-management method. We would also need to grant that DB user the required monitoring privileges. For this reason, the current implementation is based on the local Oracle OS user and OS authentication.    Pasted markdown
The health agent currently executes the following SQL checks:
SELECT 'CHECK=1' FROM dual;

SELECT name FROM v$database;
SELECT open_mode FROM v$database;
SELECT database_role FROM v$database;
SELECT cdb FROM v$database;

These are used to confirm SQL connectivity, identify the database, check whether it is READ WRITE, determine the database role, and identify whether the database is running as CDB or non-CDB.    Pasted markdown
SELECT
    name,
    con_id,
    open_mode,
    restricted
FROM v$pdbs
WHERE UPPER(name) <> 'PDB$SEED'
ORDER BY con_id;

This is used to discover the available application PDBs and validate that the target PDB is open in READ WRITE mode and is not running in restricted mode.    Pasted markdown
SELECT
    name,
    network_name,
    con_id
FROM v$services
WHERE name NOT IN ('SYS$BACKGROUND', 'SYS$USERS')
ORDER BY con_id, name;

This is used to identify the Oracle service/network service associated with the selected database or PDB.    Pasted markdown
SELECT
    con_id,
    SUM(CASE WHEN type = 'USER' THEN 1 ELSE 0 END),
    SUM(CASE WHEN type = 'USER' AND status = 'ACTIVE' THEN 1 ELSE 0 END),
    SUM(CASE WHEN type = 'USER'
             AND blocking_session IS NOT NULL THEN 1 ELSE 0 END)
FROM v$session
GROUP BY con_id;

This is used to collect total user sessions, active sessions, and blocked sessions.    Pasted markdown
SELECT
    w.con_id,
    COUNT(DISTINCT b.sid)
FROM v$session w
JOIN v$session b
    ON b.sid = w.blocking_session
WHERE w.type = 'USER'
  AND w.blocking_session IS NOT NULL
GROUP BY w.con_id;

This identifies the number of blocking sessions for the selected container.    Pasted markdown
SELECT
    current_utilization,
    limit_value
FROM v$resource_limit
WHERE resource_name = 'sessions';

This is used to calculate the current session utilization against the configured Oracle session limit.    Pasted markdown
For the final target validation, the agent also runs:
SELECT 'TARGET_CHECK=1' || COUNT(*) FROM dual;

SELECT
    'TARGET_CONTAINER=' ||
    SYS_CONTEXT('USERENV', 'CON_NAME')
FROM dual;

If the selected target is a PDB, the agent first switches to the target container using:
ALTER SESSION SET CONTAINER = "<PDB_NAME>";

This confirms that SQL can actually be executed against the intended target database/PDB, not only against the root instance.    Pasted markdown
Apart from the SQL checks, the service also validates the Oracle listener using lsnrctl status and lsnrctl services, confirms the actual listener port matches the port passed from Terraform, checks local TCP connectivity to that listener port, and verifies that the expected Oracle service is registered and in READY status.    Pasted markdown