
-- GoldenGate POC - SQL Server msdb permission check
-- Read-only. No changes.

SELECT
    DB_NAME() AS current_database,
    SUSER_SNAME() AS connected_login;

SELECT
    dp.name AS msdb_user,
    rp.name AS assigned_role
FROM msdb.sys.database_role_members drm
JOIN msdb.sys.database_principals dp
    ON drm.member_principal_id = dp.principal_id
JOIN msdb.sys.database_principals rp
    ON drm.role_principal_id = rp.principal_id
WHERE dp.name = SUSER_SNAME()
ORDER BY rp.name;
