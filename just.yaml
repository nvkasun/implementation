#!/usr/bin/env bash
set -u

ARGO_NS="argocd"
GG_NS="goldengate-dev"

LATEST_JOB="$(
  kubectl get jobs -n "$ARGO_NS" \
    -l app.kubernetes.io/name=argocd-ecr-token-sync \
    --sort-by=.metadata.creationTimestamp \
    -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null
)"

TOKEN_POD=""
if [ -n "$LATEST_JOB" ]; then
  TOKEN_POD="$(
    kubectl get pods -n "$ARGO_NS" \
      -l job-name="$LATEST_JOB" \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null
  )"
fi

echo "===== NODE STATUS ====="
kubectl get nodes \
  -o custom-columns='NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,ALLOCATABLE-PODS:.status.allocatable.pods'

echo
echo "===== POD COUNT PER NODE ====="
for NODE in $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}'); do
  COUNT=$(kubectl get pods -A \
    --field-selector spec.nodeName="$NODE" \
    --no-headers 2>/dev/null | wc -l)
  echo "$NODE | pods=$COUNT"
done

echo
echo "===== PENDING PODS ====="
kubectl get pods -A \
  --field-selector=status.phase=Pending \
  -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,NODE:.spec.nodeName' \
  2>/dev/null

echo
echo "===== TOKEN SYNC JOB ====="
echo "JOB=${LATEST_JOB:-NONE}"
echo "POD=${TOKEN_POD:-NONE}"

if [ -n "$TOKEN_POD" ]; then
  kubectl describe pod "$TOKEN_POD" -n "$ARGO_NS" 2>/dev/null \
    | sed -n '/Events:/,$p'
fi

echo
echo "===== GOLDENGATE PENDING EVENT ====="
kubectl describe pod gg-mssql-repltest-001-0 -n "$GG_NS" 2>/dev/null \
  | sed -n '/Events:/,$p'

echo
echo "===== AWS SECRETS PROVIDER ====="
kubectl get daemonset secrets-store-csi-driver-provider-aws \
  -n kube-system \
  -o custom-columns='DESIRED:.status.desiredNumberScheduled,CURRENT:.status.currentNumberScheduled,READY:.status.numberReady,AVAILABLE:.status.numberAvailable' \
  2>/dev/null

echo
echo "===== RECENT SCHEDULING WARNINGS ====="
kubectl get events -A \
  --field-selector type=Warning \
  --sort-by=.lastTimestamp \
  2>/dev/null \
  | grep -Ei 'FailedScheduling|Too many pods|Insufficient|NodeAffinity|taint|FailedMount' \
  | tail -n 30