# ==============================================================================
# Specialized Linux Virtual Machine
#
# For a specialized Compute Gallery image, the OS disk is created above
# with the module DES/CMK and attached here as an existing managed OS disk.
# This avoids sending an OSProfile to Azure.
# ==============================================================================

resource "azurerm_linux_virtual_machine" "specialized_linux_vm" {
  count = local.specialized_image && lower(var.vm.os_type) == "linux" ? 1 : 0

  depends_on = [
    time_sleep.wait_for_kv_rbac,
    azurerm_managed_disk.image_os
  ]

  name                = local.vm_name
  location            = "uaenorth"
  resource_group_name = var.resource_group_name
  size                = var.vm_size

  network_interface_ids = [azurerm_network_interface.vm.id]
  zone                  = local.availability_zone

  proximity_placement_group_id = var.proximity_placement_group_id

  # Attach the OS disk created from the specialized gallery image.
  # Do not send admin credentials or any other OSProfile properties.
  os_managed_disk_id = local.attached_os_disk_id

  os_disk {
    caching                = var.os_disk.caching
    disk_encryption_set_id = azurerm_disk_encryption_set.des.id
  }

  dynamic "identity" {
    for_each = var.managed_identities.system_assigned || length(var.managed_identities.user_assigned_resource_ids) > 0 ? [1] : []

    content {
      type = var.managed_identities.system_assigned && length(var.managed_identities.user_assigned_resource_ids) > 0 ? "SystemAssigned, UserAssigned" : var.managed_identities.system_assigned ? "SystemAssigned" : "UserAssigned"
      identity_ids = length(var.managed_identities.user_assigned_resource_ids) > 0 ? var.managed_identities.user_assigned_resource_ids : null
    }
  }

  dynamic "boot_diagnostics" {
    for_each = var.enable_boot_diagnostics ? [1] : []

    content {
      storage_account_uri = var.boot_diagnostics_storage_account_uri
    }
  }

  allow_extension_operations = true
  encryption_at_host_enabled = var.encryption_at_host_enabled
  license_type               = var.vm.license_type

  tags = local.tags
}

# Preserve existing-data-disk support for specialized Linux VMs.
resource "azurerm_virtual_machine_data_disk_attachment" "existing_data_specialized_linux" {
  for_each = local.specialized_image && lower(var.vm.os_type) == "linux" ? var.existing_data_disks : {}

  managed_disk_id    = data.azurerm_managed_disk.existing_data[each.key].id
  virtual_machine_id = azurerm_linux_virtual_machine.specialized_linux_vm[0].id
  lun                = each.value.lun
  caching            = each.value.caching
}