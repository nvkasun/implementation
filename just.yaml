
set -u

NS="argocd"

APPS=(
  goldengate-dev-mssql-repltest-001
  goldengate-dev-oracle-repltest-002
  goldengate-dev-postgresql-repltest-001
  goldengate-dev-postgresql-repltest-002
)

echo "========== ARGO CD FINALIZER DIAGNOSTIC =========="

for app in "${APPS[@]}"; do
  echo
  echo "===== $app ====="

  kubectl -n "$NS" get application "$app" \
    -o jsonpath='Deletion: {.metadata.deletionTimestamp}{"\n"}Finalizers: {.metadata.finalizers}{"\n"}Operation: {.status.operationState.phase}{"\n"}'

  echo
  echo "Resource status:"
  kubectl -n "$NS" get application "$app" \
    -o jsonpath='{range .status.resources[*]}{.kind}{" | "}{.namespace}{" | "}{.name}{" | "}{.status}{" | "}{.health.status}{"\n"}{end}'

done

echo
echo "========== REMAINING GOLDENGATE RESOURCES =========="

kubectl -n goldengate-dev get \
  statefulsets,services,ingresses,pods,secretproviderclasses \
  --ignore-not-found

echo
echo "========== ARGO CD CONTROLLER PODS =========="

kubectl -n argocd get pods \
  -l app.kubernetes.io/name=argocd-application-controller

echo
echo "========== APPLICATION EVENTS =========="

for app in "${APPS[@]}"; do
  echo "--- $app ---"
  kubectl -n argocd describe application "$app" 2>&1 |
    tail -35
done

echo
echo "========== DIAGNOSTIC COMPLETE =========="
