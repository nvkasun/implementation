Run:

sudo ls -l /OraHome/ora26ai_DB_Home/dbs/

Then:

sudo strings /OraHome/ora26ai_DB_Home/dbs/spfileDFCASHUAT1.ora \
  | grep -Ei 'control_files|OraData|DFCASHUAT1|recovery'

Also:

sudo grep -R "/OraData" /OraHome/ora26ai_DB_Home \
  --include="*.ora" 2>/dev/null

If we see something like:

control_files=/OraData/DFCASHUAT1/control01.ctl,...

then we have definitive confirmation.

If it confirms /OraData

Then do:

sudo umount /mnt/oradata-check
sudo mkdir -p /OraData
sudo mount /dev/oradatavg/OraDatalv /OraData

Verify:

df -hT | grep -E 'OraHome|OraData'

We want:

/dev/mapper/oradatavg-OraHomelv   70G   ...  /OraHome
/dev/mapper/oradatavg-OraDatalv  300G   ...  /OraData

and:

ls -lah /OraData/DFCASHUAT1