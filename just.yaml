
#!/usr/bin/env bash

set -u

NS="goldengate-dev"
POD="gg-postgresql-repltest-001-0"
CONTAINER="ogg-postgresql"
DEPLOY="gg-postgresql-repltest-01"

echo "=== GOLDENGATE ADMIN ROUTING INVESTIGATION ==="

echo
echo "[1/4] GoldenGate process and listener inventory"

kubectl exec -n "$NS" "$POD" -c "$CONTAINER" -- sh -c '
ps -ef | grep -E "[S]erviceManager|[a]dminsrvr|[n]ginx" \
  | awk "{print \$2,\$3,\$8,\$9}"

if command -v ss >/dev/null 2>&1; then
  ss -lnt | grep -E ":(443|8443|9000|9001|9002|9011|9012|9013|9014)[[:space:]]"
else
  echo "ss not available"
fi
' 2>/dev/null

echo
echo "[2/4] Internal NGINX routing tests"

kubectl exec -n "$NS" "$POD" -c "$CONTAINER" -- \
  sh -s -- "$DEPLOY" <<'INNER'
DEPLOY="$1"

for path in \
  "/services/v2/content/index.html" \
  "/services/v2/deployments" \
  "/${DEPLOY}/adminsrvr/v2/content/index.html" \
  "/${DEPLOY}/adminsrvr/v2/extracts" \
  "/services/${DEPLOY}/adminsrvr/v2/content/index.html" \
  "/adminsrvr/v2/content/index.html"
do
  code=$(curl -sk --max-time 5 \
    -o /dev/null -w "%{http_code}" \
    "https://127.0.0.1:8443${path}" \
    2>/dev/null || true)

  echo "HTTP=$code PATH=$path"
done
INNER

echo
echo "[3/4] NGINX proxy route configuration"

kubectl exec -n "$NS" "$POD" -c "$CONTAINER" -- sh -c '
if command -v nginx >/dev/null 2>&1; then
  nginx -T 2>/dev/null |
    grep -E "^[[:space:]]*(location|proxy_pass|listen)[[:space:]]" |
    head -65 |
    sed -E "s#(https?://)[^/ ;]+#\1[upstream]#g"
else
  echo "NGINX executable not available"
fi
' 2>/dev/null

echo
echo "[4/4] Kubernetes ingress and service details"

kubectl get ingress -n "$NS" \
  -o custom-columns=NAME:.metadata.name,HOSTS:.spec.rules[*].host \
  2>/dev/null

kubectl get service "$DEPLOY" -n "$NS" \
  -o custom-columns=NAME:.metadata.name,PORTS:.spec.ports[*].port \
  2>/dev/null

echo
echo "=== INVESTIGATION COMPLETE ==="
echo "READ ONLY - No configuration changes made."
