Then do these exact commands.

sudo cp /etc/systemd/system/oracle-database.service \
/etc/systemd/system/oracle-database.service.backup-before-oraade

Now update only the service user:

sudo sed -i 's/^User=oracle$/User=oraade/' \
/etc/systemd/system/oracle-database.service

Verify:

grep -E '^(User|Group)=' /etc/systemd/system/oracle-database.service

Expected:

User=oraade
Group=dba

Then reload systemd:

sudo systemctl daemon-reload

Validate the unit:

sudo systemd-analyze verify /etc/systemd/system/oracle-database.service

No output = good.

Clear the previous failed state:

sudo systemctl reset-failed oracle-database.service

Because the listener from the previous attempt may still be running, that's okay. Now start the service:

sudo systemctl start oracle-database.service

Then:

sudo systemctl status oracle-database.service --no-pager

We want:

Active: active (exited)

But this time also check the logs carefully:

sudo journalctl -u oracle-database.service -n 80 --no-pager

We must not see:

startup.log: Permission denied
ORA-01034

Then verify Oracle itself using the actual software owner:

sudo -iu oraade

Set environment:

export ORACLE_HOME=/OraHome/ora26ai_DB_Home
export ORACLE_SID=DFCASHUAT1
export PATH=$ORACLE_HOME/bin:$PATH

Then:

sqlplus / as sysdba

Inside SQL*Plus:

select instance_name, status from v$instance;
select name, open_mode, database_role from v$database;
exit;

Target result:

DFCASHUAT1    OPEN
DFCASHUA      READ WRITE    PRIMARY

Then check listener:

lsnrctl status

Finally exit back:

exit

Wait for the health agent to detect recovery:

sleep 15
curl -i http://127.0.0.1:8080/health

We want:

HTTP/1.0 200 OK

and:

"healthy": true,
"status": "HEALTHY"