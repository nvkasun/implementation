import socket
import time
from datetime import datetime

LB_IP = "10.x.x.x"
LB_PORT = 1701

REQUESTS = 20
DELAY_SECONDS = 1

for i in range(1, REQUESTS + 1):
    start = time.time()

    try:
        with socket.create_connection(
            (LB_IP, LB_PORT),
            timeout=5
        ):
            latency_ms = (time.time() - start) * 1000

            print(
                f"[{datetime.now()}] "
                f"Request {i:02d} | "
                f"SUCCESS | "
                f"{LB_IP}:{LB_PORT} | "
                f"{latency_ms:.2f} ms"
            )

    except Exception as exc:
        print(
            f"[{datetime.now()}] "
            f"Request {i:02d} | "
            f"FAILED | "
            f"{LB_IP}:{LB_PORT} | "
            f"{exc}"
        )

    time.sleep(DELAY_SECONDS)





