Set ownership and permissions:

sudo chown -R oracle:dba /opt/oracle-health
sudo chmod 750 /opt/oracle-health/oracle_health.py

Before systemd, check the Python syntax:

sudo -u oracle /usr/bin/python3 -m py_compile \
/opt/oracle-health/oracle_health.py

No output = good.

Create the systemd service:
sudo vi /etc/systemd/system/oracle-health.service

Paste:

[Unit]
Description=Oracle Database Health Agent
After=network-online.target oracle-database.service
RequiresMountsFor=/OraHome /OraData
Wants=network-online.target

[Service]
Type=simple
User=oracle
Group=dba

Environment="ORACLE_HOME=/OraHome/ora26ai_DB_Home"
Environment="ORACLE_SID=DFCASHUAT1"
Environment="PATH=/OraHome/ora26ai_DB_Home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin"
Environment="LD_LIBRARY_PATH=/OraHome/ora26ai_DB_Home/lib"

ExecStart=/usr/bin/python3 /opt/oracle-health/oracle_health.py

Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target

Notice I'm deliberately using:

After=oracle-database.service

but not:

Requires=oracle-database.service

right now. Both services will be enabled at boot, and systemd will order them correctly. This also means starting the health agent now won't unnecessarily try to start Oracle again on top of the manually running DB.

Then:

sudo systemctl daemon-reload

sudo systemd-analyze verify \
/etc/systemd/system/oracle-health.service

Again, no output is good.

Enable and start it:

sudo systemctl enable oracle-health.service
sudo systemctl start oracle-health.service

Check:

sudo systemctl status oracle-health.service --no-pager

We want:

Active: active (running)
Now check port 8080:
sudo ss -lntp | grep 8080

Expected approximately:

LISTEN ... *:8080 ... python3

Then the important test:

curl -v http://127.0.0.1:8080/health

Only after local /health gives HTTP 200, add the Azure LB probe firewall rule:
sudo firewall-cmd --permanent \
  --add-rich-rule='rule family="ipv4" source address="168.63.129.16/32" port port="8080" protocol="tcp" accept'

Then:

sudo firewall-cmd --reload
sudo firewall-cmd --list-all

