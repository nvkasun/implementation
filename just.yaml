#!/usr/bin/env python

from __future__ import print_function

import getpass
import os
import socket
import subprocess
import sys
import time
import uuid
from collections import Counter
from datetime import datetime


LB_HOST = "10.114.32.134"
LB_PORT = 1521
SERVICE_NAME = "pdb1"
DB_USER = "SYSTEM"

ORACLE_HOME = "/u01/app/oracle/product/21.0.0/dbhome_1"
SQLPLUS = ORACLE_HOME + "/bin/sqlplus"

DEFAULT_CONNECTIONS = 20


def sql_escape(value):
    return value.replace("'", "''")


def oracle_environment():
    env = os.environ.copy()

    env["ORACLE_HOME"] = ORACLE_HOME
    env["PATH"] = ORACLE_HOME + "/bin:" + env.get("PATH", "")
    env["LD_LIBRARY_PATH"] = (
        ORACLE_HOME + "/lib:" +
        env.get("LD_LIBRARY_PATH", "")
    )

    return env


def build_connect_command(password):
    safe_password = password.replace('"', '""')

    return 'CONNECT {}/"{}"@{}:{}/{}\n'.format(
        DB_USER,
        safe_password,
        LB_HOST,
        LB_PORT,
        SERVICE_NAME
    )


def run_sqlplus(password, sql):
    sql_input = (
        build_connect_command(password) +
        sql
    )

    process = subprocess.Popen(
        [
            SQLPLUS,
            "-s",
            "-L",
            "/nolog"
        ],
        stdin=subprocess.PIPE,
        stdout=subprocess.PIPE,
        stderr=subprocess.STDOUT,
        env=oracle_environment(),
        universal_newlines=True
    )

    output, unused = process.communicate(sql_input)

    return process.returncode, output


def tcp_precheck():
    print()
    print("Step 1 - Load Balancer TCP Connectivity")
    print("---------------------------------------")
    print(
        "Testing TCP connection to {}:{} ...".format(
            LB_HOST,
            LB_PORT
        )
    )

    sock = socket.socket(
        socket.AF_INET,
        socket.SOCK_STREAM
    )

    sock.settimeout(5)

    try:
        sock.connect(
            (
                LB_HOST,
                LB_PORT
            )
        )

        local_ip, local_port = sock.getsockname()

        print("TCP CONNECTION       : SUCCESS")
        print(
            "Client connection    : {}:{} -> {}:{}".format(
                local_ip,
                local_port,
                LB_HOST,
                LB_PORT
            )
        )

        return True

    except Exception as exc:
        print("TCP CONNECTION       : FAILED")
        print(
            "Error                : {}".format(
                exc
            )
        )

        return False

    finally:
        sock.close()


def oracle_precheck(password):
    print()
    print("Step 2 - Oracle Application Connectivity")
    print("----------------------------------------")
    print(
        "Opening Oracle session to {}:{}/{} ...".format(
            LB_HOST,
            LB_PORT,
            SERVICE_NAME
        )
    )

    sql = """
WHENEVER OSERROR EXIT FAILURE
WHENEVER SQLERROR EXIT SQL.SQLCODE

SET HEADING OFF
SET FEEDBACK OFF
SET PAGESIZE 0
SET VERIFY OFF
SET ECHO OFF
SET LINESIZE 500
SET TRIMSPOOL ON

SELECT
    '__PRECHECK__|' ||
    SYS_CONTEXT('USERENV','SERVER_HOST') || '|' ||
    SYS_CONTEXT('USERENV','INSTANCE_NAME') || '|' ||
    SYS_CONTEXT('USERENV','SERVICE_NAME') || '|' ||
    SYS_CONTEXT('USERENV','CON_NAME')
FROM dual;

EXIT
"""

    return_code, output = run_sqlplus(
        password,
        sql
    )

    result = None

    for line in output.splitlines():
        clean = line.strip()

        if clean.startswith("__PRECHECK__|"):
            result = clean
            break

    if result:
        parts = result.split("|")

        print("ORACLE CONNECTION    : SUCCESS")
        print(
            "Selected backend     : {}".format(
                parts[1]
            )
        )
        print(
            "Oracle instance      : {}".format(
                parts[2]
            )
        )
        print(
            "Oracle service       : {}".format(
                parts[3]
            )
        )
        print(
            "PDB/container        : {}".format(
                parts[4]
            )
        )

        return True

    print("ORACLE CONNECTION    : FAILED")
    print(
        "SQL*Plus exit code   : {}".format(
            return_code
        )
    )

    print("SQL*Plus output:")
    print(output)

    return False


def build_test_sql(
    run_id,
    test_number,
    client_host
):
    test_id = "{}-{:02d}".format(
        run_id,
        test_number
    )

    message = "Azure LB test record {}".format(
        test_number
    )

    return """
WHENEVER OSERROR EXIT FAILURE
WHENEVER SQLERROR EXIT SQL.SQLCODE

SET HEADING OFF
SET FEEDBACK OFF
SET PAGESIZE 0
SET VERIFY OFF
SET ECHO OFF
SET LINESIZE 1000
SET TRIMSPOOL ON

SELECT
    '__SESSION__|' ||
    SYS_CONTEXT('USERENV','SERVER_HOST') || '|' ||
    SYS_CONTEXT('USERENV','INSTANCE_NAME') || '|' ||
    SYS_CONTEXT('USERENV','SERVICE_NAME') || '|' ||
    SYS_CONTEXT('USERENV','CON_NAME')
FROM dual;

BEGIN
    EXECUTE IMMEDIATE '
        CREATE TABLE LB_TEST_DATA (
            TEST_ID       VARCHAR2(80) PRIMARY KEY,
            TEST_RUN      VARCHAR2(80),
            TEST_NUMBER   NUMBER,
            CLIENT_HOST   VARCHAR2(128),
            BACKEND_HOST  VARCHAR2(128),
            INSTANCE_NAME VARCHAR2(64),
            SERVICE_NAME  VARCHAR2(128),
            MESSAGE       VARCHAR2(200),
            CREATED_AT    TIMESTAMP
        )
    ';
EXCEPTION
    WHEN OTHERS THEN
        IF SQLCODE != -955 THEN
            RAISE;
        END IF;
END;
/

INSERT INTO LB_TEST_DATA (
    TEST_ID,
    TEST_RUN,
    TEST_NUMBER,
    CLIENT_HOST,
    BACKEND_HOST,
    INSTANCE_NAME,
    SERVICE_NAME,
    MESSAGE,
    CREATED_AT
)
SELECT
    '{test_id}',
    '{run_id}',
    {test_number},
    '{client_host}',
    SYS_CONTEXT('USERENV','SERVER_HOST'),
    SYS_CONTEXT('USERENV','INSTANCE_NAME'),
    SYS_CONTEXT('USERENV','SERVICE_NAME'),
    '{message}',
    SYSTIMESTAMP
FROM dual;

COMMIT;

SELECT
    '__INSERT_OK__|' ||
    TEST_ID || '|' ||
    BACKEND_HOST || '|' ||
    INSTANCE_NAME || '|' ||
    SERVICE_NAME
FROM LB_TEST_DATA
WHERE TEST_ID = '{test_id}';

EXIT
""".format(
        test_id=sql_escape(test_id),
        run_id=sql_escape(run_id),
        test_number=test_number,
        client_host=sql_escape(client_host),
        message=sql_escape(message)
    )


def run_test(
    test_number,
    total,
    run_id,
    password,
    client_host
):
    print()
    print(
        "[{:02d}/{:02d}] NEW APPLICATION CONNECTION".format(
            test_number,
            total
        )
    )

    print(
        "          Target             : {}:{}/{}".format(
            LB_HOST,
            LB_PORT,
            SERVICE_NAME
        )
    )

    print(
        "          Connection status  : STARTING"
    )

    start_time = time.time()

    sql = build_test_sql(
        run_id,
        test_number,
        client_host
    )

    return_code, output = run_sqlplus(
        password,
        sql
    )

    backend = None
    instance = None
    service = None
    pdb = None
    insert_id = None

    for line in output.splitlines():
        clean = line.strip()

        if clean.startswith("__SESSION__|"):
            parts = clean.split("|")

            if len(parts) >= 5:
                backend = parts[1]
                instance = parts[2]
                service = parts[3]
                pdb = parts[4]

        elif clean.startswith("__INSERT_OK__|"):
            parts = clean.split("|")

            if len(parts) >= 2:
                insert_id = parts[1]

    elapsed = time.time() - start_time

    if backend:
        print(
            "          CONNECTION         : ESTABLISHED"
        )
        print(
            "          Selected backend   : {}".format(
                backend
            )
        )
        print(
            "          Oracle instance    : {}".format(
                instance
            )
        )
        print(
            "          Oracle service     : {}".format(
                service
            )
        )
        print(
            "          PDB/container      : {}".format(
                pdb
            )
        )

    if insert_id:
        print(
            "          DATA INSERT        : SUCCESS"
        )
        print(
            "          Test record ID     : {}".format(
                insert_id
            )
        )

    if (
        return_code == 0 and
        backend and
        insert_id
    ):
        print(
            "          COMMIT             : SUCCESS"
        )
        print(
            "          SESSION CLOSED     : SUCCESS"
        )
        print(
            "          Duration           : {:.2f} seconds".format(
                elapsed
            )
        )
        print(
            "          TEST RESULT        : PASS"
        )

        return True, backend

    print(
        "          TEST RESULT        : FAILED"
    )

    print(
        "          SQL*Plus exit code : {}".format(
            return_code
        )
    )

    print(
        "          SQL*Plus output:"
    )

    useful = [
        line.strip()
        for line in output.splitlines()
        if line.strip()
    ]

    for line in useful[-12:]:
        print(
            "            {}".format(
                line
            )
        )

    return False, backend


def main():
    try:
        total = int(sys.argv[1])
    except (IndexError, ValueError):
        total = DEFAULT_CONNECTIONS

    if not os.path.isfile(SQLPLUS):
        print(
            "ERROR: SQL*Plus not found at:"
        )
        print(SQLPLUS)
        sys.exit(1)

    client_host = socket.gethostname()

    run_id = "{}-{}".format(
        datetime.now().strftime(
            "%Y%m%d%H%M%S"
        ),
        uuid.uuid4().hex[:6]
    )

    print()
    print(
        "Oracle Azure Load Balancer End-to-End Test"
    )
    print(
        "==========================================="
    )

    print(
        "Purpose            : Application-to-Oracle LB validation"
    )
    print(
        "Client VM          : {}".format(
            client_host
        )
    )
    print(
        "LB IP              : {}".format(
            LB_HOST
        )
    )
    print(
        "Oracle port        : {}".format(
            LB_PORT
        )
    )
    print(
        "Oracle service     : {}".format(
            SERVICE_NAME
        )
    )
    print(
        "Database user      : {}".format(
            DB_USER
        )
    )
    print(
        "Test connections   : {}".format(
            total
        )
    )
    print(
        "Test run ID        : {}".format(
            run_id
        )
    )

    print()
    print(
        "VM1 and VM2 addresses are intentionally "
        "not used by this client."
    )
    print(
        "All Oracle sessions are opened only through "
        "the Azure Load Balancer."
    )

    password = getpass.getpass(
        "\nEnter Oracle SYSTEM password: "
    )

    if not tcp_precheck():
        print()
        print("FINAL RESULT: FAILED")
        print(
            "Load Balancer TCP connectivity failed."
        )
        sys.exit(1)

    if not oracle_precheck(password):
        print()
        print("FINAL RESULT: FAILED")
        print(
            "Oracle connectivity through the "
            "Load Balancer failed."
        )
        sys.exit(1)

    print()
    print(
        "Step 3 - Multi-Connection Load Balancing Test"
    )
    print(
        "---------------------------------------------"
    )

    print(
        "Creating {} independent Oracle sessions.".format(
            total
        )
    )

    backend_counts = Counter()

    successful = 0
    failed = 0

    for number in range(
        1,
        total + 1
    ):
        success, backend = run_test(
            number,
            total,
            run_id,
            password,
            client_host
        )

        if success:
            successful += 1

            if backend:
                backend_counts[backend] += 1

        else:
            failed += 1

        time.sleep(0.5)

    print()
    print("Final Test Summary")
    print("==================")

    print(
        "Client VM               : {}".format(
            client_host
        )
    )

    print(
        "LB endpoint             : {}:{}/{}".format(
            LB_HOST,
            LB_PORT,
            SERVICE_NAME
        )
    )

    print(
        "Total connections       : {}".format(
            total
        )
    )

    print(
        "Successful connections  : {}".format(
            successful
        )
    )

    print(
        "Failed connections      : {}".format(
            failed
        )
    )

    print()
    print("Backend Distribution")
    print("--------------------")

    if backend_counts:
        for backend in sorted(
            backend_counts
        ):
            print(
                "{:<35} {} connection(s)".format(
                    backend,
                    backend_counts[backend]
                )
            )
    else:
        print(
            "No successful backend connections detected."
        )

    print()

    if (
        failed == 0 and
        successful == total and
        len(backend_counts) >= 2
    ):
        print("FINAL RESULT: PASS")
        print(
            "Azure Load Balancer successfully distributed "
            "Oracle application connections across both "
            "healthy backend VMs."
        )

    elif (
        failed == 0 and
        successful == total and
        len(backend_counts) == 1
    ):
        print(
            "FINAL RESULT: CONNECTIVITY PASS"
        )
        print(
            "All Oracle connections through the "
            "Load Balancer succeeded."
        )
        print(
            "Only one backend was observed in this run."
        )
        print(
            "Confirm both backend health probes are Healthy "
            "and rerun with more connections."
        )

    else:
        print("FINAL RESULT: FAILED")
        print(
            "One or more Oracle application connections failed."
        )


if __name__ == "__main__":
    main()