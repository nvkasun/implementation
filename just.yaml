
-- SQL Server admin target permissions
-- READ ONLY

SELECT
    DB_NAME() AS database_name,
    SUSER_SNAME() AS connected_login,
    USER_NAME() AS database_user,
    IS_MEMBER('db_owner') AS is_db_owner,
    HAS_PERMS_BY_NAME(
        'gg_poc.replication_test',
        'OBJECT',
        'INSERT'
    ) AS can_insert,
    HAS_PERMS_BY_NAME(
        'gg_poc.replication_test',
        'OBJECT',
        'UPDATE'
    ) AS can_update,
    HAS_PERMS_BY_NAME(
        'gg_poc.replication_test',
        'OBJECT',
        'DELETE'
    ) AS can_delete;

-- Check SQL Server Agent role in msdb
SELECT
    IS_ROLEMEMBER(
        'SQLAgentUserRole',
        SUSER_SNAME()
    ) AS is_sql_agent_user;
