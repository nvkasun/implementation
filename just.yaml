{
  "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
  "contentVersion": "1.0.0.0",

  "parameters": {
    "galleryName": {
      "type": "string",
      "defaultValue": "acgCloudFactoryydevuaenorthoracledb",
      "metadata": {
        "description": "Existing Azure Compute Gallery name."
      }
    },

    "imageDefinitionName": {
      "type": "string",
      "defaultValue": "RHEL-9.8-oracle-db",
      "metadata": {
        "description": "Existing specialized image definition created for the Oracle VM."
      }
    },

    "imageVersion": {
      "type": "string",
      "defaultValue": "3.0.0",
      "metadata": {
        "description": "Azure Compute Gallery image version."
      }
    },

    "sourceVmName": {
      "type": "string",
      "defaultValue": "vm-004-dev-uan-b245iy",
      "metadata": {
        "description": "Prepared source VM containing the Oracle installation and configuration on the OS disk only."
      }
    },

    "location": {
      "type": "string",
      "defaultValue": "uaenorth",
      "metadata": {
        "description": "Azure region containing the source VM, gallery and Disk Encryption Set."
      }
    },

    "diskEncryptionSetResourceId": {
      "type": "string",
      "defaultValue": "/subscriptions/1a233215-09f6-404f-8536-bc83100ba1fa/resourceGroups/rg-CloudFactory-dev-uaenorth-oracledb/providers/Microsoft.Compute/diskEncryptionSets/vm-004-dev-uan-b245iy-des",
      "metadata": {
        "description": "Full resource ID of the Disk Encryption Set used for CMK encryption of the OS disk image."
      }
    }
  },

  "variables": {
    "commonTags": {
      "ApplicationName": "CloudFactory",
      "BusinessCriticality": "Low",
      "BusinessUnit": "TechnologyPlatform",
      "BusinessUnitOwner": "TechnologyPlatform",
      "CostCenter": "219",
      "DataClassification": "General",
      "DeployedBy": "Manual",
      "Environment": "dev",
      "RequestReference": "P015763"
    }
  },

  "resources": [
    {
      "type": "Microsoft.Compute/galleries/images/versions",
      "apiVersion": "2024-03-03",

      "name": "[format('{0}/{1}/{2}', parameters('galleryName'), parameters('imageDefinitionName'), parameters('imageVersion'))]",

      "location": "[parameters('location')]",

      "tags": "[variables('commonTags')]",

      "properties": {
        "publishingProfile": {
          "excludeFromLatest": false,
          "replicaCount": 1,
          "replicationMode": "Full",
          "storageAccountType": "Standard_ZRS",

          "targetRegions": [
            {
              "name": "[parameters('location')]",
              "regionalReplicaCount": 1,
              "storageAccountType": "Standard_ZRS",
              "excludeFromLatest": false,

              "encryption": {
                "osDiskImage": {
                  "diskEncryptionSetId": "[parameters('diskEncryptionSetResourceId')]"
                }
              }
            }
          ]
        },

        "storageProfile": {
          "source": {
            "virtualMachineId": "[resourceId('Microsoft.Compute/virtualMachines', parameters('sourceVmName'))]"
          }
        },

        "safetyProfile": {
          "allowDeletionOfReplicatedLocations": false,
          "blockDeletionBeforeEndOfLife": false
        }
      }
    }
  ],

  "outputs": {
    "imageVersionId": {
      "type": "string",
      "value": "[resourceId('Microsoft.Compute/galleries/images/versions', parameters('galleryName'), parameters('imageDefinitionName'), parameters('imageVersion'))]"
    },

    "sourceVmId": {
      "type": "string",
      "value": "[resourceId('Microsoft.Compute/virtualMachines', parameters('sourceVmName'))]"
    },

    "diskEncryptionSetId": {
      "type": "string",
      "value": "[parameters('diskEncryptionSetResourceId')]"
    }
  }
}