# Generate random id
resource "random_string" "unique_id" {
  length    = 6
  min_numeric = 2
  min_lower   = 2
  upper       = false
  special     = false
}


# ====================================================================================================
# Random Password Generation
# ====================================================================================================
resource "random_password" "admin" {
  count = local.generate_password ? 1 : 0

  length           = 24
  special          = true
  override_special = "!@#$%^&*()_-+=[]{}:?"
  min_lower        = 2
  min_upper        = 2
  min_numeric      = 2
  min_special      = 2
}


# main.tf (Key Vault secret)
moved {
  from = azurerm_key_vault_secret.admin_password
  to   = azurerm_key_vault_secret.admin_password[0]
}

resource "azurerm_key_vault_secret" "admin_password" {
  count = local.generate_password ? 1 : 0

  name            = coalesce(var.key_vault_secret_name, "${local.vm_name}-password")
  value           = random_password.admin[0].result
  key_vault_id    = var.key_vault_id
  expiration_date = var.expiration_date
  content_type    = "password"
  tags            = local.tags
}


# ====================================================================================================
# Disk Encryption
# ====================================================================================================

resource "azurerm_key_vault_key" "disk_encryption" {
  name         = "${local.vm_name}-disk-encryption-key"
  key_vault_id = var.key_vault_id
  key_type     = "RSA"
  key_size     = 2048
  key_opts     = ["decrypt", "encrypt", "sign", "unwrapKey", "verify", "wrapKey"]
  expiration_date = timeadd(timestamp(), "2160h") # Expiration date of 90 Days

  rotation_policy {
    automatic {
      time_before_expiry = "P30D"
    }
    expire_after         = "P90D"
    notify_before_expiry = "P29D"
  }

  lifecycle {
    ignore_changes = [
      expiration_date
    ]
  }
}

resource "azurerm_disk_encryption_set" "des" {
  name                = "${local.vm_name}-des"
  location            = "uaenorth"
  resource_group_name = var.resource_group_name
  key_vault_key_id    = azurerm_key_vault_key.disk_encryption.id

  identity {
    type = "SystemAssigned"
  }

  tags = local.tags
}

resource "azurerm_key_vault_access_policy" "des_policy" {
  key_vault_id = var.key_vault_id
  tenant_id    = azurerm_disk_encryption_set.des.identity[0].tenant_id
  object_id    = azurerm_disk_encryption_set.des.identity[0].principal_id

  key_permissions = [
    "Get",
    "WrapKey",
    "UnwrapKey"
  ]
}

# Grant DES the Key Vault Crypto Service Encryption User role
resource "azurerm_role_assignment" "des_kv_crypto" {
  scope                = var.key_vault_id
  role_definition_name = "Key Vault Crypto Service Encryption User"
  principal_id         = azurerm_disk_encryption_set.des.identity[0].principal_id
}

# Grant DES the Key Vault Reader role
resource "azurerm_role_assignment" "des_kv_reader" {
  scope                = var.key_vault_id
  role_definition_name = "Key Vault Reader"
  principal_id         = azurerm_disk_encryption_set.des.identity[0].principal_id
}


# ====================================================================================================
# Network Interface
# ====================================================================================================
resource "azurerm_network_interface" "vm" {
  name                = "${local.vm_name}-nic"
  location            = "uaenorth"
  resource_group_name = var.resource_group_name

  ip_configuration {
    name                          = "internal"
    subnet_id                     = var.subnet_id
    private_ip_address_allocation = var.private_ip_address != null ? "Static" : "Dynamic"
    private_ip_address            = var.private_ip_address
  }

  accelerated_networking_enabled = var.accelerated_networking_enabled
  ip_forwarding_enabled          = var.ip_forwarding_enabled
  tags                           = local.tags
}


# ====================================================================================================
# Windows Virtual Machine
# ====================================================================================================
resource "azurerm_windows_virtual_machine" "windows_vm" {
  depends_on = [time_sleep.wait_for_kv_rbac]
  count      = !local.attach_existing_disks && lower(var.vm.os_type) == "windows" ? 1 : 0

  name                = local.vm_name
  location            = "uaenorth"
  resource_group_name = var.resource_group_name
  size                = var.vm_size
  admin_username      = local.admin_username
  admin_password      = local.admin_password
  computer_name       = local.computer_name

  network_interface_ids = [azurerm_network_interface.vm.id]
  zone                  = local.availability_zone

  # OS Disk
  os_disk {
    name                   = "${local.vm_name}-osdisk"
    caching                = var.os_disk.caching
    storage_account_type   = var.os_disk.storage_account_type
    disk_size_gb           = var.os_disk.disk_size_gb
    disk_encryption_set_id = azurerm_disk_encryption_set.des.id
  }

  # Source Image
  source_image_id = var.source_image_id

  dynamic "source_image_reference" {
    for_each = var.source_image_id == null ? [1] : []
    content {
      publisher = var.source_image_reference.publisher
      offer     = var.source_image_reference.offer
      sku       = var.source_image_reference.sku
      version   = var.source_image_reference.version
    }
  }

  # Identity
  dynamic "identity" {
    for_each = var.managed_identities.system_assigned || length(var.managed_identities.user_assigned_resource_ids) > 0 ? [1] : []
    content {
      type         = var.managed_identities.system_assigned && length(var.managed_identities.user_assigned_resource_ids) > 0 ? "SystemAssigned, UserAssigned" : var.managed_identities.system_assigned ? "SystemAssigned" : "UserAssigned"
      identity_ids = length(var.managed_identities.user_assigned_resource_ids) > 0 ? var.managed_identities.user_assigned_resource_ids : null
    }
  }

  # Boot Diagnostics
  dynamic "boot_diagnostics" {
    for_each = var.enable_boot_diagnostics ? [1] : []
    content {
      storage_account_uri = var.boot_diagnostics_storage_account_uri
    }
  }

  # Additional Settings
  allow_extension_operations = true
  automatic_updates_enabled  = var.automatic_updates_enabled
  patch_mode                 = var.patch_mode
  provision_vm_agent         = true
  timezone                   = var.timezone
  license_type               = var.vm.license_type
  encryption_at_host_enabled = var.encryption_at_host_enabled
  secure_boot_enabled        = "true"
  vtpm_enabled               = "true"

  tags = local.tags
}

resource "time_sleep" "wait_for_kv_rbac" {
  depends_on = [
    azurerm_role_assignment.des_kv_crypto,
    azurerm_role_assignment.des_kv_reader
  ]

  create_duration = "120s"
}


# ====================================================================================================
# Linux Virtual Machine
# ====================================================================================================
resource "azurerm_linux_virtual_machine" "linux_vm" {
  depends_on = [time_sleep.wait_for_kv_rbac]
  count      = !local.attach_existing_disks && lower(var.vm.os_type) == "linux" ? 1 : 0

  name                = local.vm_name
  location            = "uaenorth"
  resource_group_name = var.resource_group_name
  size                = var.vm_size
  admin_username      = local.admin_username

  network_interface_ids = [azurerm_network_interface.vm.id]
  zone                  = local.availability_zone

  proximity_placement_group_id = var.proximity_placement_group_id

  # Authentication
  admin_password                  = local.admin_password
  disable_password_authentication = false

  # OS Disk
  os_disk {
    name                   = "${local.vm_name}-osdisk"
    caching                = var.os_disk.caching
    storage_account_type   = var.os_disk.storage_account_type
    disk_size_gb           = var.os_disk.disk_size_gb
    disk_encryption_set_id = azurerm_disk_encryption_set.des.id
  }

  # Source Image
  source_image_id = var.source_image_id

  dynamic "source_image_reference" {
    for_each = var.source_image_id == null ? [1] : []
    content {
      publisher = var.source_image_reference.publisher
      offer     = var.source_image_reference.offer
      sku       = var.source_image_reference.sku
      version   = var.source_image_reference.version
    }
  }

  # Identity
  dynamic "identity" {
    for_each = var.managed_identities.system_assigned || length(var.managed_identities.user_assigned_resource_ids) > 0 ? [1] : []
    content {
      type         = var.managed_identities.system_assigned && length(var.managed_identities.user_assigned_resource_ids) > 0 ? "SystemAssigned, UserAssigned" : var.managed_identities.system_assigned ? "SystemAssigned" : "UserAssigned"
      identity_ids = length(var.managed_identities.user_assigned_resource_ids) > 0 ? var.managed_identities.user_assigned_resource_ids : null
    }
  }

  # Boot Diagnostics
  dynamic "boot_diagnostics" {
    for_each = var.enable_boot_diagnostics ? [1] : []
    content {
      storage_account_uri = var.boot_diagnostics_storage_account_uri
    }
  }

  # Additional Settings
  allow_extension_operations = true
  patch_mode                 = var.patch_mode_linux
  provision_vm_agent         = true
  encryption_at_host_enabled = var.encryption_at_host_enabled
  license_type               = var.vm.license_type
  secure_boot_enabled        = "true"
  vtpm_enabled               = "true"

  tags = local.tags
}


# ====================================================================================================
# OS disk created from a specialized Compute Gallery image version
# (Only when source_image_id + source_image_specialized = true; attached by the VM below)
# ====================================================================================================
resource "azurerm_managed_disk" "image_os" {
  depends_on = [time_sleep.wait_for_kv_rbac]
  count      = local.specialized_image ? 1 : 0

  name                       = "${local.vm_name}-osdisk"
  location                   = "uaenorth"
  resource_group_name        = var.resource_group_name
  storage_account_type       = var.os_disk.storage_account_type
  create_option              = "FromImage"
  gallery_image_reference_id = var.source_image_id
  os_type                    = local.os_type_title
  disk_size_gb               = var.os_disk.disk_size_gb
  zone                       = local.availability_zone

  public_network_access_enabled = false
  disk_encryption_set_id         = azurerm_disk_encryption_set.des.id

  tags = local.tags

  lifecycle {
    # hyper_v_generation is ForceNew and not computed: Azure sets it (V2) from the image, the
    # config leaves it null, so every plan would replace the OS disk and VM with it.
    # network_access_policy is set to DenyAll by null_resource.disable_os_disk_public_access.
    ignore_changes = [hyper_v_generation, network_access_policy]
  }
}


# ====================================================================================================
# Specialized Linux Virtual Machine from Azure Compute Gallery
#
# For a specialized gallery image, the OS disk is created above using the module DES/CMK and then
# attached to the modern azurerm_linux_virtual_machine using os_managed_disk_id.
#
# IMPORTANT: Do not send OSProfile properties (admin_username, admin_password, computer_name,
# source_image_id/source_image_reference, provision_vm_agent, patch_mode, etc.) on this path.
# ====================================================================================================
resource "azurerm_linux_virtual_machine" "specialized_linux_vm" {
  count = local.specialized_image && lower(var.vm.os_type) == "linux" ? 1 : 0

  depends_on = [
    time_sleep.wait_for_kv_rbac,
    azurerm_managed_disk.image_os
  ]

  name                = local.vm_name
  location            = "uaenorth"
  resource_group_name = var.resource_group_name
  size                = var.vm_size

  network_interface_ids = [azurerm_network_interface.vm.id]
  zone                  = local.availability_zone

  proximity_placement_group_id = var.proximity_placement_group_id

  # Existing CMK-encrypted OS disk created from the specialized Gallery image.
  os_managed_disk_id = local.attached_os_disk_id

  os_disk {
    # With os_managed_disk_id, AzureRM requires the existing disk to carry its own
    # encryption configuration. The pre-created image_os disk above is already CMK
    # encrypted with azurerm_disk_encryption_set.des.
    caching = var.os_disk.caching
  }

  # Identity
  dynamic "identity" {
    for_each = var.managed_identities.system_assigned || length(var.managed_identities.user_assigned_resource_ids) > 0 ? [1] : []
    content {
      type         = var.managed_identities.system_assigned && length(var.managed_identities.user_assigned_resource_ids) > 0 ? "SystemAssigned, UserAssigned" : var.managed_identities.system_assigned ? "SystemAssigned" : "UserAssigned"
      identity_ids = length(var.managed_identities.user_assigned_resource_ids) > 0 ? var.managed_identities.user_assigned_resource_ids : null
    }
  }

  # Boot Diagnostics
  dynamic "boot_diagnostics" {
    for_each = var.enable_boot_diagnostics ? [1] : []
    content {
      storage_account_uri = var.boot_diagnostics_storage_account_uri
    }
  }

  allow_extension_operations = true
  encryption_at_host_enabled = var.encryption_at_host_enabled
  license_type               = var.vm.license_type

  tags = local.tags
}

# Preserve existing-data-disk support for specialized Linux VMs.
resource "azurerm_virtual_machine_data_disk_attachment" "existing_data_specialized_linux" {
  for_each = local.specialized_image && lower(var.vm.os_type) == "linux" ? var.existing_data_disks : {}

  managed_disk_id    = data.azurerm_managed_disk.existing_data[each.key].id
  virtual_machine_id = azurerm_linux_virtual_machine.specialized_linux_vm[0].id
  lun                = each.value.lun
  caching            = each.value.caching
}


# ====================================================================================================
# Virtual Machine built on pre-created (migrated) disks
#
# Existing OS disks and specialized Windows images remain on the legacy attach-mode resource.
# Specialized Linux gallery images are handled by specialized_linux_vm above.
# ====================================================================================================
resource "azurerm_virtual_machine" "attached_disks_vm" {
  count = (
    local.attach_existing_disks &&
    !(
      local.specialized_image &&
      lower(var.vm.os_type) == "linux"
    )
  ) ? 1 : 0

  name                = local.vm_name
  location            = "uaenorth"
  resource_group_name = var.resource_group_name
  vm_size             = var.vm_size

  network_interface_ids = [azurerm_network_interface.vm.id]
  zones                 = local.availability_zone == null ? null : [local.availability_zone]

  proximity_placement_group_id = var.proximity_placement_group_id

  # The disks carry migrated data - never let a VM replacement take them with it.
  delete_os_disk_on_termination    = false
  delete_data_disks_on_termination = false

  # OS Disk (existing, specialized)
  storage_os_disk {
    name            = local.attached_os_disk_name
    managed_disk_id = local.attached_os_disk_id
    create_option   = "Attach"
    caching         = var.os_disk.caching
    os_type         = local.os_type_title
  }

  # Data Disks (existing)
  dynamic "storage_data_disk" {
    for_each = var.existing_data_disks

    content {
      name            = data.azurerm_managed_disk.existing_data[storage_data_disk.key].name
      managed_disk_id = data.azurerm_managed_disk.existing_data[storage_data_disk.key].id
      create_option   = "Attach"
      disk_size_gb    = data.azurerm_managed_disk.existing_data[storage_data_disk.key].disk_size_gb
      lun             = storage_data_disk.value.lun
      caching         = storage_data_disk.value.caching
    }
  }

  # Identity
  dynamic "identity" {
    for_each = var.managed_identities.system_assigned || length(var.managed_identities.user_assigned_resource_ids) > 0 ? [1] : []
    content {
      type         = var.managed_identities.system_assigned && length(var.managed_identities.user_assigned_resource_ids) > 0 ? "SystemAssigned, UserAssigned" : var.managed_identities.system_assigned ? "SystemAssigned" : "UserAssigned"
      identity_ids = length(var.managed_identities.user_assigned_resource_ids) > 0 ? var.managed_identities.user_assigned_resource_ids : null
    }
  }

  # Boot Diagnostics - the legacy resource requires an explicit storage account URI,
  # it cannot use the managed (platform) boot diagnostics storage.
  dynamic "boot_diagnostics" {
    for_each = var.enable_boot_diagnostics && var.boot_diagnostics_storage_account_uri != null ? [1] : []
    content {
      enabled     = true
      storage_uri = var.boot_diagnostics_storage_account_uri
    }
  }

  license_type = local.os_type_title == "Windows" ? var.vm.license_type : null

  tags = local.tags

  # When an existing image based VM is converted to attach mode, the old VM has to
  # release the NIC before this one can claim it.
  depends_on = [
    azurerm_linux_virtual_machine.linux_vm,
    azurerm_windows_virtual_machine.windows_vm
  ]

  lifecycle {
    # Azure returns an empty `additionalCapabilities` object when reading the VM, which
    # the provider records as an `additional_capabilities {}` block in state. The module
    # never declares one, so every subsequent plan proposes removing it and reports the
    # VM as changed. The block's only member is `ultra_ssd_enabled`, which stays unset
    # either way, so the diff is cosmetic - but it masks real drift and tempts an
    # unnecessary write against a running VM.
    #
    # Ignoring it keeps plans clean without ever touching the VM. Set ultra_ssd_enabled
    # through a real input first if this module ever needs to manage it.
    ignore_changes = [additional_capabilities]
  }
}


# ====================================================================================================
# Data Disks
# ====================================================================================================
resource "azurerm_managed_disk" "data" {
  depends_on = [time_sleep.wait_for_kv_rbac]
  for_each   = var.data_disks

  name                 = "${local.vm_name}-datadisk-${each.key}"
  location             = "uaenorth"
  resource_group_name  = var.resource_group_name
  storage_account_type = each.value.storage_account_type
  create_option        = each.value.create_option
  disk_size_gb         = each.value.disk_size_gb
  zone                 = local.availability_zone

  public_network_access_enabled = false
  disk_encryption_set_id         = azurerm_disk_encryption_set.des.id

  tags = local.tags
}

resource "azurerm_virtual_machine_data_disk_attachment" "data" {
  for_each = var.data_disks

  managed_disk_id    = azurerm_managed_disk.data[each.key].id
  virtual_machine_id = local.vm_id
  lun                = each.value.lun
  caching            = each.value.caching
}


# ====================================================================================================
# Disable OS Disk Public Access
# ====================================================================================================

resource "null_resource" "disable_os_disk_public_access" {
  count = 1 # Always runs once when VM is created

  triggers = {
    vm_id = local.vm_id
  }

  provisioner "local-exec" {
    command     = "OS_DISK_ID=$(az vm show --ids ${local.vm_id} --query 'storageProfile.osDisk.managedDisk.id' -o tsv) && az disk update --ids \"$OS_DISK_ID\" --network-access-policy DenyAll"
    interpreter = ["/bin/bash", "-c"]
  }

  # Also waits on extensions: both this and azurerm_virtual_machine_extension
  # act on the same VM, and with no ordering between them Terraform runs them
  # concurrently - Azure then preempts one with "OperationPreempted" rather
  # than serializing the two operations itself.
  depends_on = [
    azurerm_linux_virtual_machine.linux_vm,
    azurerm_windows_virtual_machine.windows_vm,
    azurerm_linux_virtual_machine.specialized_linux_vm,
    azurerm_virtual_machine.attached_disks_vm,
    azurerm_virtual_machine_extension.extensions
  ]
}


# ====================================================================================================
# VM Extensions
# ====================================================================================================
resource "azurerm_virtual_machine_extension" "extensions" {
  for_each = var.extensions

  name                       = each.value.name
  virtual_machine_id         = local.vm_id
  publisher                  = each.value.publisher
  type                       = each.value.type
  type_handler_version       = each.value.type_handler_version
  auto_upgrade_minor_version = lookup(each.value, "auto_upgrade_minor_version", true)
  automatic_upgrade_enabled  = lookup(each.value, "automatic_upgrade_enabled", false)

  settings           = lookup(each.value, "settings", null)
  protected_settings = lookup(each.value, "protected_settings", null)

  tags = local.tags
}
