{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Sid": "GoldenGateMonitorEcrAuthorization",
      "Effect": "Allow",
      "Action": [
        "ecr:GetAuthorizationToken"
      ],
      "Resource": "*"
    },
    {
      "Sid": "GoldenGateMonitorEcrBuildAndPublish",
      "Effect": "Allow",
      "Action": [
        "ecr:DescribeRepositories",
        "ecr:DescribeImages",
        "ecr:GetRepositoryPolicy",
        "ecr:SetRepositoryPolicy",
        "ecr:CreateRepository",
        "ecr:TagResource",
        "ecr:BatchCheckLayerAvailability",
        "ecr:BatchGetImage",
        "ecr:GetDownloadUrlForLayer",
        "ecr:InitiateLayerUpload",
        "ecr:UploadLayerPart",
        "ecr:CompleteLayerUpload",
        "ecr:PutImage"
      ],
      "Resource": [
        "arn:aws:ecr:eu-west-1:229410149234:repository/goldengate-monitor",
        "arn:aws:ecr:eu-west-1:229410149234:repository/helm/goldengate-monitor"
      ]
    }
  ]
}