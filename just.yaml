Let's prove exactly what Azure gave VM5

Run this on VM5:

echo "===== BLOCK DEVICES ====="
lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS

echo
echo "===== ALL DISKS SEEN BY OS ====="
sudo fdisk -l | grep -E '^Disk /dev/'

echo
echo "===== LVM ====="
sudo pvs
sudo vgs
sudo lvs -o lv_name,vg_name,lv_size,lv_path,devices

echo
echo "===== FSTAB ====="
grep -E 'OraHome|OraData' /etc/fstab

I expect the last command to still show the two correct image entries:

UUID=... /OraHome xfs ...
UUID=... /OraData xfs ...

but pvs will probably only show the OS/root volume because the 400-GB disk isn't attached.

Now also ask Azure IMDS what disks it thinks VM5 has:

curl --noproxy "*" -s \
  -H Metadata:true \
  "http://169.254.169.254/metadata/instance?api-version=2025-04-07" \
  > /tmp/imds.json

python3 - <<'PY'
import json

with open("/tmp/imds.json") as f:
    x = json.load(f)

c = x["compute"]

print("VM Name:", c.get("name"))
print("Resource Group:", c.get("resourceGroupName"))
print("OS Disk:", c.get("storageProfile", {}).get("osDisk"))
print("Data Disks:", c.get("storageProfile", {}).get("dataDisks"))
PY

The important line is:

Data Disks:

If it gives:

Data Disks: []

then we have absolute confirmation that Azure created VM5 without any data disk, not merely that Linux failed to mount it.

Why this is interesting

Earlier, your 2.0.0 image version resource JSON showed:

"dataDiskImages": [
  {
    "lun": 0,
    "sizeInGB": 400,
    "hostCaching": "None"
  }
]

So we already have evidence that the gallery image version itself contains a 400-GB LUN 0 data-disk image.