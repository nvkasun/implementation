settings = jsonencode({
  commandToExecute = "printf 'ORACLE_PORT=%s\\nHEALTH_PORT=%s\\n' '${var.oracle_listener_port}' '${var.oracle_health_port}' > /etc/oracle-health.env"
})


variable "oracle_health_port" {
  description = "Port used by the Oracle Python health agent HTTP endpoint"
  type        = number
  default     = 8080
}


And your LB probe should also use the same Terraform variable:
resource "azurerm_lb_probe" "oracle_db_health" {
  # ...

  protocol     = "Http"
  port         = var.oracle_health_port
  request_path = "/health"
}