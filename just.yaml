# ============================================================
# Oracle on Azure - Resource Group
# ============================================================

module "oracle_vm_resource_group" {
  count = var.oracle_vm_on_azure_enabled ? 1 : 0

  source = "../azure-terraform/modules/resource-groups"

  rg_name  = var.oracle_vm_resource_group_name
  location = var.location
  tags     = local.tags
}