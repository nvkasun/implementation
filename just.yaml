cat > node-capacity-check.sh <<'EOF'
#!/bin/bash
set -u

TARGET_NODE="ip-10-238-186-143.eu-west-1.compute.internal"

echo "===== TARGET NODE CAPACITY ====="

kubectl get node "$TARGET_NODE" \
  -o jsonpath='NODE={.metadata.name}{"\n"}CAPACITY_PODS={.status.capacity.pods}{"\n"}ALLOCATABLE_PODS={.status.allocatable.pods}{"\n"}'

echo
echo "===== CURRENT POD COUNT ON TARGET NODE ====="

COUNT=$(kubectl get pods -A \
  --field-selector spec.nodeName="$TARGET_NODE" \
  --no-headers 2>/dev/null | wc -l)

echo "CURRENT_PODS=$COUNT"

echo
echo "===== PODS ON TARGET NODE ====="

kubectl get pods -A \
  --field-selector spec.nodeName="$TARGET_NODE" \
  -o custom-columns='NS:.metadata.namespace,POD:.metadata.name,OWNER_KIND:.metadata.ownerReferences[0].kind,OWNER_NAME:.metadata.ownerReferences[0].name,PHASE:.status.phase' \
  --sort-by=.metadata.namespace

echo
echo "===== ALL NODE POD CAPACITY ====="

for node in $(kubectl get nodes -o name | sed 's#node/##'); do
  alloc=$(kubectl get node "$node" -o jsonpath='{.status.allocatable.pods}')
  count=$(kubectl get pods -A --field-selector spec.nodeName="$node" --no-headers 2>/dev/null | wc -l)
  echo "NODE=$node PODS=$count ALLOCATABLE=$alloc"
done
EOF

chmod +x node-capacity-check.sh
./node-capacity-check.sh