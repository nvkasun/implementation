In variables.tf:

variable "oracle_listener_port" {
  description = "Oracle listener port used by all Oracle DB VMs in this environment"
  type        = number

  validation {
    condition = (
      var.oracle_listener_port >= 1 &&
      var.oracle_listener_port <= 65535
    )

    error_message = "oracle_listener_port must be between 1 and 65535."
  }
}

variable "oracle_lb_frontend_ip" {
  description = "Optional static private IP for the Oracle Internal Load Balancer"
  type        = string
  default     = null
  nullable    = true
}

Then your environment tfvars become something like:

# UAT
oracle_listener_port = 1525

and:

# PROD
oracle_listener_port = 1521