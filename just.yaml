cat > argo-status-check.sh <<'EOF'
#!/bin/bash
set -u

ARGO_NS="argocd"

APPS=(
  "goldengate-dev-mssql-repltest-001"
  "goldengate-dev-oracle-repltest-01"
  "goldengate-dev-postgresql-repltest-01"
  "goldengate-dev-postgresql-repltest-02"
)

echo "===== GOLDENGATE ARGO CONDITIONS ====="

for app in "${APPS[@]}"; do
  echo
  echo "APP=$app"

  kubectl get application "$app" -n "$ARGO_NS" \
    -o jsonpath='SYNC={.status.sync.status}{" HEALTH="}{.status.health.status}{" REVISION="}{.status.sync.revision}{"\n"}{range .status.conditions[*]}CONDITION={.type} MESSAGE={.message}{"\n"}{end}'
done

echo
echo "===== ECR TOKEN SYNC ====="

kubectl get cronjob argocd-ecr-token-sync -n "$ARGO_NS" \
  -o jsonpath='LAST_SCHEDULE={.status.lastScheduleTime}{" LAST_SUCCESS="}{.status.lastSuccessfulTime}{"\n"}' 2>&1 || true

LATEST_JOB="$(
  kubectl get jobs -n "$ARGO_NS" \
    --sort-by=.metadata.creationTimestamp \
    -o name 2>/dev/null \
  | grep 'argocd-ecr-token-sync' \
  | tail -1
)"

if [ -n "$LATEST_JOB" ]; then
  echo "LATEST_JOB=$LATEST_JOB"

  kubectl get "$LATEST_JOB" -n "$ARGO_NS" \
    -o jsonpath='SUCCEEDED={.status.succeeded}{" FAILED="}{.status.failed}{"\n"}'

  kubectl logs "$LATEST_JOB" -n "$ARGO_NS" --tail=20 2>&1 \
    | grep -Ei 'success|error|fail|forbidden|unauthorized|refreshed' || true
else
  echo "LATEST_JOB=NONE"
fi
EOF

chmod +x argo-status-check.sh
./argo-status-check.sh