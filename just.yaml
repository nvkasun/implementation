ls -l /u01/app/oracle/product/21.0.0/dbhome_1/bin/sqlplus

If you see the file, set the environment on VM3:

export ORACLE_HOME=/u01/app/oracle/product/21.0.0/dbhome_1
export PATH=$ORACLE_HOME/bin:$PATH
export LD_LIBRARY_PATH=$ORACLE_HOME/lib:$LD_LIBRARY_PATH

Then:

sqlplus -v

You should get:

SQL*Plus: Release 21.0.0.0.0 - Production
Version 21.3.0.0.0

Then test the LB manually with:

sqlplus -L SYSTEM@10.114.32.134:1521/pdb1