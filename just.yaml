
{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Sid": "GoldenGateMonitorEcrAuthorization",
      "Effect": "Allow",
      "Action": [
        "ecr:GetAuthorizationToken"
      ],
      "Resource": "*"
    },
    {
      "Sid": "GoldenGateMonitorEcrBuildAndPublish",
      "Effect": "Allow",
      "Action": [
        "ecr:DescribeRepositories",
        "ecr:DescribeImages",
        "ecr:GetRepositoryPolicy",
        "ecr:SetRepositoryPolicy",
        "ecr:CreateRepository",
        "ecr:TagResource",
        "ecr:BatchCheckLayerAvailability",
        "ecr:BatchGetImage",
        "ecr:GetDownloadUrlForLayer",
        "ecr:InitiateLayerUpload",
        "ecr:UploadLayerPart",
        "ecr:CompleteLayerUpload",
        "ecr:PutImage"
      ],
      "Resource": [
        "arn:aws:ecr:eu-west-1:229410149234:repository/goldengate-monitor",
        "arn:aws:ecr:eu-west-1:229410149234:repository/helm/goldengate-monitor",
        "arn:aws:ecr:eu-west-1:229410149234:repository/helm/argocd",
        "arn:aws:ecr:eu-west-1:229410149234:repository/helm/goldengate-platform",
        "arn:aws:ecr:eu-west-1:229410149234:repository/helm/goldengate"
      ]
    },
    {
      "Sid": "GoldenGateArtifactRead",
      "Effect": "Allow",
      "Action": [
        "ecr:DescribeRepositories",
        "ecr:DescribeImages",
        "ecr:BatchCheckLayerAvailability",
        "ecr:BatchGetImage",
        "ecr:GetDownloadUrlForLayer"
      ],
      "Resource": [
        "arn:aws:ecr:eu-west-1:229410149234:repository/aws-cloud-factory-fluent-bit",
        "arn:aws:ecr:eu-west-1:229410149234:repository/helm/amazon-cloudwatch-observability",
        "arn:aws:ecr:eu-west-1:229410149234:repository/aws-cloud-factory-cloudwatch-agent-operator",
        "arn:aws:ecr:eu-west-1:229410149234:repository/aws-cloud-factory-cloudwatch-agent",
        "arn:aws:ecr:eu-west-1:229410149234:repository/aws-cloud-factory-kube-state-metrics",
        "arn:aws:ecr:eu-west-1:229410149234:repository/aws-cloud-factory-node-exporter",
        "arn:aws:ecr:eu-west-1:229410149234:repository/ogg-oracle",
        "arn:aws:ecr:eu-west-1:229410149234:repository/ogg-postgresql",
        "arn:aws:ecr:eu-west-1:229410149234:repository/ogg-sqlserver"
      ]
    },
    {
      "Sid": "AllowDeleteGoldenGateCsiEfsAccessPoints",
      "Effect": "Allow",
      "Action": [
        "elasticfilesystem:DeleteAccessPoint"
      ],
      "Resource": "arn:aws:elasticfilesystem:eu-west-1:668311715351:access-point/*",
      "Condition": {
        "StringEquals": {
          "aws:ResourceTag/efs.csi.aws.com/cluster": "true"
        }
      }
    }
  ]
}
