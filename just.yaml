Step 1 — show us the disks and mount points

On VM4 as azureuser, run:

lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS

Then:

df -hT

And:

cat /etc/fstab

We are specifically looking for the ~400 GB disk and where it is mounted.

For example, we might discover:

sda       64G
└─sda1    /

sdc      400G
└─sdc1   /u01

If the 400 GB disk exists but its MOUNTPOINTS field is empty, then yes bro — that's probably the problem.

Step 2 — check whether the Oracle path actually exists

Run:

ls -ld /u01
ls -ld /u01/app
ls -ld /u01/app/oracle
ls -ld /u01/app/oracle/product/21.0.0/dbhome_1

Then:

ls -l /u01/app/oracle/product/21.0.0/dbhome_1/bin/sqlplus

and:

ls -l /u01/app/oracle/product/21.0.0/dbhome_1/bin/lsnrctl

If you get:

No such file or directory

then the Oracle installation is definitely not currently available at that path.

Step 3 — find the real Oracle installation

Use:

sudo find /u01 /opt /oracle /app -type f \
  \( -name sqlplus -o -name lsnrctl \) 2>/dev/null

Also check Oracle's configuration file:

cat /etc/oratab

You may see something like:

ORCL:/some/other/path/product/21.0.0/dbhome_1:N

That would tell us the real ORACLE_HOME.

Also run:

sudo -iu oracle env | grep -E 'ORACLE|PATH'

and:

sudo -iu oracle bash -lc 'echo ORACLE_HOME=$ORACLE_HOME; echo PATH=$PATH'
Step 4 — check whether any Oracle process is running at all
ps -ef | grep -E 'ora_pmon|tnslsnr' | grep -v grep

If Oracle were running, we'd expect something like:

ora_pmon_ORCL
tnslsnr