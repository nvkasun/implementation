#!/bin/bash

set -euo pipefail

ORACLE_HOME="${ORACLE_HOME:-/u01/app/oracle/product/21.0.0/dbhome_1}"
ORACLE_SID="${ORACLE_SID:-ORCL}"
ORACLE_USER="${ORACLE_USER:-oracle}"
ORACLE_GROUP="${ORACLE_GROUP:-oinstall}"
HEALTH_PORT="${HEALTH_PORT:-8080}"
ORACLE_PORT="${ORACLE_PORT:-1521}"

INSTALL_DIR="/opt/oracle-health"
HEALTH_SCRIPT="${INSTALL_DIR}/oracle_health.py"
SERVICE_FILE="/etc/systemd/system/oracle-health.service"
SQLPLUS="${ORACLE_HOME}/bin/sqlplus"
PYTHON="/usr/bin/python"

if [ "$(id -u)" -ne 0 ]; then
  echo "ERROR: Run this script with sudo or as root."
  exit 1
fi

if ! id "${ORACLE_USER}" >/dev/null 2>&1; then
  echo "ERROR: Oracle OS user '${ORACLE_USER}' does not exist."
  exit 1
fi

if [ ! -x "${SQLPLUS}" ]; then
  echo "ERROR: SQLPlus not found at ${SQLPLUS}."
  exit 1
fi

if [ ! -x "${PYTHON}" ]; then
  echo "ERROR: Python not found at ${PYTHON}."
  exit 1
fi

echo "Validating Oracle database..."

DB_STATUS=$(
  sudo -u "${ORACLE_USER}" env \
    ORACLE_HOME="${ORACLE_HOME}" \
    ORACLE_SID="${ORACLE_SID}" \
    PATH="${ORACLE_HOME}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin" \
    "${SQLPLUS}" -s "/ as sysdba" <<'SQL'
WHENEVER SQLERROR EXIT 2
WHENEVER OSERROR EXIT 3
SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
SELECT 'CHECK=' || COUNT(*) FROM dual;
SELECT 'OPEN_MODE=' || TRIM(open_mode) FROM v$database;
SELECT 'DATABASE_ROLE=' || TRIM(database_role) FROM v$database;
EXIT;
SQL
)

echo "${DB_STATUS}"

if ! echo "${DB_STATUS}" | grep -q "CHECK=1"; then
  echo "ERROR: Oracle validation query failed."
  exit 1
fi

if ! echo "${DB_STATUS}" | grep -q "OPEN_MODE=READ WRITE"; then
  echo "ERROR: Oracle database is not READ WRITE."
  exit 1
fi

mkdir -p "${INSTALL_DIR}"

cat > "${HEALTH_SCRIPT}" <<'PY'
#!/usr/bin/env python

import BaseHTTPServer
import SocketServer
import json
import os
import socket
import subprocess
import threading
import time

HOST = "0.0.0.0"
PORT = int(os.environ.get("HEALTH_PORT", "8080"))

ORACLE_HOME = os.environ.get(
    "ORACLE_HOME",
    "/u01/app/oracle/product/21.0.0/dbhome_1"
)
ORACLE_SID = os.environ.get("ORACLE_SID", "ORCL")
ORACLE_PORT = int(os.environ.get("ORACLE_PORT", "1521"))
SQLPLUS = os.path.join(ORACLE_HOME, "bin", "sqlplus")

CHECK_INTERVAL = 5
SUCCESS_THRESHOLD = 2
FAILURE_THRESHOLD = 3
SQL_TIMEOUT = 5

state_lock = threading.Lock()

state = {
    "healthy": False,
    "status": "STARTING",
    "last_check": None,
    "last_error": None,
    "open_mode": None,
    "database_role": None,
    "consecutive_successes": 0,
    "consecutive_failures": 0
}


def check_listener():
    sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    sock.settimeout(2)

    try:
        sock.connect(("127.0.0.1", ORACLE_PORT))
    finally:
        sock.close()


def check_database():
    sql = """
WHENEVER SQLERROR EXIT 2
WHENEVER OSERROR EXIT 3
SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
SELECT 'CHECK=' || COUNT(*) FROM dual;
SELECT 'OPEN_MODE=' || TRIM(open_mode) FROM v$database;
SELECT 'DATABASE_ROLE=' || TRIM(database_role) FROM v$database;
EXIT;
"""

    env = os.environ.copy()
    env["ORACLE_HOME"] = ORACLE_HOME
    env["ORACLE_SID"] = ORACLE_SID
    env["PATH"] = ORACLE_HOME + "/bin:" + env.get("PATH", "")

    process = subprocess.Popen(
        [SQLPLUS, "-s", "/ as sysdba"],
        stdin=subprocess.PIPE,
        stdout=subprocess.PIPE,
        stderr=subprocess.PIPE,
        env=env
    )

    process.stdin.write(sql)
    process.stdin.close()

    start_time = time.time()

    while process.poll() is None:
        if time.time() - start_time > SQL_TIMEOUT:
            process.kill()
            raise RuntimeError("SQLPlus health check timed out")

        time.sleep(0.1)

    stdout = process.stdout.read()
    stderr = process.stderr.read()

    if process.returncode != 0:
        raise RuntimeError(
            "SQLPlus failed: %s" % (stderr.strip() or stdout.strip())
        )

    output = stdout.strip()

    if "CHECK=1" not in output:
        raise RuntimeError("Oracle validation query failed")

    open_mode = None
    database_role = None

    for line in output.splitlines():
        line = line.strip()

        if line.startswith("OPEN_MODE="):
            open_mode = line.split("=", 1)[1].strip()

        if line.startswith("DATABASE_ROLE="):
            database_role = line.split("=", 1)[1].strip()

    if open_mode != "READ WRITE":
        raise RuntimeError(
            "Database OPEN_MODE is %s" % (open_mode or "UNKNOWN")
        )

    return open_mode, database_role


def monitor_database():
    while True:
        try:
            check_listener()
            open_mode, database_role = check_database()

            with state_lock:
                state["consecutive_successes"] += 1
                state["consecutive_failures"] = 0
                state["last_check"] = int(time.time())
                state["last_error"] = None
                state["open_mode"] = open_mode
                state["database_role"] = database_role

                if state["consecutive_successes"] >= SUCCESS_THRESHOLD:
                    state["healthy"] = True
                    state["status"] = "HEALTHY"

        except Exception as error:
            with state_lock:
                state["consecutive_successes"] = 0
                state["consecutive_failures"] += 1
                state["last_check"] = int(time.time())
                state["last_error"] = str(error)

                if state["consecutive_failures"] >= FAILURE_THRESHOLD:
                    state["healthy"] = False
                    state["status"] = "UNHEALTHY"

        time.sleep(CHECK_INTERVAL)


class HealthHandler(BaseHTTPServer.BaseHTTPRequestHandler):

    def do_GET(self):
        if self.path != "/health":
            self.send_response(404)
            self.end_headers()
            return

        with state_lock:
            response = dict(state)

        body = json.dumps(response)

        if response["healthy"]:
            status_code = 200
        else:
            status_code = 503

        self.send_response(status_code)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

    def log_message(self, format, *args):
        return


class ThreadedHTTPServer(
    SocketServer.ThreadingMixIn,
    BaseHTTPServer.HTTPServer
):
    daemon_threads = True


if __name__ == "__main__":
    monitor_thread = threading.Thread(target=monitor_database)
    monitor_thread.daemon = True
    monitor_thread.start()

    server = ThreadedHTTPServer((HOST, PORT), HealthHandler)
    server.serve_forever()
PY

chown "${ORACLE_USER}:${ORACLE_GROUP}" "${HEALTH_SCRIPT}"
chmod 750 "${HEALTH_SCRIPT}"

cat > "${SERVICE_FILE}" <<EOF
[Unit]
Description=Oracle Database Health Agent
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=${ORACLE_USER}
Group=${ORACLE_GROUP}
Environment=ORACLE_HOME=${ORACLE_HOME}
Environment=ORACLE_SID=${ORACLE_SID}
Environment=ORACLE_PORT=${ORACLE_PORT}
Environment=HEALTH_PORT=${HEALTH_PORT}
Environment=PATH=${ORACLE_HOME}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
ExecStart=${PYTHON} ${HEALTH_SCRIPT}
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
EOF

systemctl daemon-reload
systemctl enable oracle-health
systemctl restart oracle-health

if systemctl is-active --quiet firewalld; then
  firewall-cmd --permanent \
    --add-rich-rule="rule family=\"ipv4\" source address=\"168.63.129.16/32\" port protocol=\"tcp\" port=\"${HEALTH_PORT}\" accept" \
    >/dev/null 2>&1 || true

  firewall-cmd --reload
fi

echo "Waiting for health agent..."
sleep 12

echo
echo "Service status:"
systemctl --no-pager --full status oracle-health || true

echo
echo "Health endpoint:"
curl -i --max-time 5 "http://127.0.0.1:${HEALTH_PORT}/health"

echo
echo
echo "Oracle health agent installation completed."
echo "Health endpoint: http://<VM-IP>:${HEALTH_PORT}/health"