Hi Maria, Rizwan,

Following the successful implementation and validation of the source_image_id enhancement, we made a small change to our Oracle VM deployment approach.

Initially, our specialized Azure Compute Gallery image contained both the OS disk and the Oracle data disk. We have now changed the design so that the specialized gallery image contains only the OS disk, while the Oracle data disk is created and attached separately through the Terraform VM module.

During validation of this updated deployment model, we encountered an Azure Policy error during specialized VM creation related to the mandatory Customer-Managed Key (CMK) requirement. Although both the OS managed disk and the separately created data disk were already configured with the Disk Encryption Set (DES), Azure Policy requires the CMK/DES information to be explicitly available during the VM creation request as well.

After reviewing the latest base VM module implementation, I have prepared a proposed update to the specialized gallery-image flow to ensure the DES is correctly handled during VM creation while also preserving the existing CMK configuration and avoiding unnecessary disk/VM replacement during subsequent Terraform runs.

As Rizwan was on leave yesterday, I have raised a GitHub issue in the base module repository with the complete details and the proposed implementation for review:

GitHub Issue: <GitHub issue link>

I have also attached the CMK policy error screenshot for reference.

The proposed change has been validated locally with our specialized gallery image deployment, including a separately attached data disk, and both the OS and data disks remain encrypted using SSE with CMK.

Rizwan, when convenient, could you please review the proposed changes in the GitHub issue? If the approach is acceptable, your support in incorporating the required update into the base VM module would be appreciated.

