# ============================================================
# Oracle on Azure - Internal Load Balancer
# ============================================================

resource "azurerm_lb" "oracle_db" {
  count = var.oracle_vm_on_azure_enabled ? 1 : 0

  name                = "lb-cibg-${var.environment}-uaenorth-oracledb"
  location            = var.location
  resource_group_name = module.oracle_vm_resource_group[0].rg_name

  sku      = "Standard"
  sku_tier = "Regional"

  frontend_ip_configuration {
    name = "fe-oracledb"

    subnet_id = module.base-infra.subnet_map[
      "snet-oracle-vm-cibg-uaenorth-001"
    ].id

    private_ip_address_allocation = "Dynamic"
  }

  tags = local.tags
}


resource "azurerm_lb_backend_address_pool" "oracle_db" {
  count = var.oracle_vm_on_azure_enabled ? 1 : 0

  name            = "be-oracledb"
  loadbalancer_id = azurerm_lb.oracle_db[0].id
}


locals {
  oracle_db_backend_nics = var.oracle_vm_on_azure_enabled ? {
    vm01 = module.oracle_binary_vm01[0].network_interface_id
    vm02 = module.oracle_binary_vm02[0].network_interface_id
  } : {}
}


resource "azurerm_network_interface_backend_address_pool_association" "oracle_db" {
  for_each = local.oracle_db_backend_nics

  network_interface_id    = each.value
  ip_configuration_name   = "internal"
  backend_address_pool_id = azurerm_lb_backend_address_pool.oracle_db[0].id
}


resource "azurerm_lb_probe" "oracle_db_health" {
  count = var.oracle_vm_on_azure_enabled ? 1 : 0

  name            = "hp-oracledb"
  loadbalancer_id = azurerm_lb.oracle_db[0].id

  protocol     = "Http"
  port         = 8080
  request_path = "/health"

  interval_in_seconds = 5
  number_of_probes    = 2
}


resource "azurerm_lb_rule" "oracle_db" {
  count = var.oracle_vm_on_azure_enabled ? 1 : 0

  name            = "lbr-oracledb-${var.oracle_listener_port}"
  loadbalancer_id = azurerm_lb.oracle_db[0].id

  protocol = "Tcp"

  frontend_port = var.oracle_listener_port
  backend_port  = var.oracle_listener_port

  frontend_ip_configuration_name = "fe-oracledb"

  backend_address_pool_ids = [
    azurerm_lb_backend_address_pool.oracle_db[0].id
  ]

  probe_id = azurerm_lb_probe.oracle_db_health[0].id

  idle_timeout_in_minutes = 30
  tcp_reset_enabled       = true
  floating_ip_enabled     = false
}