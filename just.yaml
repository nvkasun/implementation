Now rerun the Oracle binary checks:
sudo find /OraHome /u01 /opt -type f \( -name sqlplus -o -name lsnrctl \) -print

Then also check the Oracle user's login environment:
sudo -iu oracle bash -lc '
echo "USER=$USER"
echo "ORACLE_HOME=$ORACLE_HOME"
echo "PATH=$PATH"
command -v sqlplus || echo "sqlplus not in PATH"
command -v lsnrctl || echo "lsnrctl not in PATH"
'