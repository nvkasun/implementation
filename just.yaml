Run the single installer:
chmod +x install_oracle_health_vm4.sh
sudo ./install_oracle_health_vm4.sh


Run:

sudo systemctl status oracle-health.service --no-pager

We want:

Active: active (running)

Then:

sudo ss -lntp | grep 8080

Expected:

LISTEN ... :8080 ... python3

Then:

curl -i http://127.0.0.1:8080/health

We want:

HTTP/1.0 200 OK

and JSON containing important values such as:

{
  "healthy": true,
  "status": "HEALTHY",
  "oracle_sid": "DFCASHUAT1",
  "target_pdb": "CDB$ROOT",
  "target_service": "DFCASHUAT1",
  "database_role": "PRIMARY",
  "pdb_open_mode": "READ WRITE",
  "sql_query": true,
  "listener_running": true,
  "listener_reachable": true,
  "service_registered": true,
  "service_ready": true
}

Finally check the firewall:

sudo firewall-cmd --list-all

Our target is:

ports: 1521/tcp

rich rules:
  rule family="ipv4" source address="168.63.129.16/32" port port="8080" protocol="tcp" accept

So, bro, don't manually run these setup operations afterward:

sudo chown ...
sudo chmod ...
sudo vi /etc/systemd/system/oracle-health.service
sudo systemctl enable oracle-health.service
sudo firewall-cmd --add-rich-rule ...

They're already handled by the installer.

The only manual commands I recommend after running the script are:

sudo systemctl status oracle-health.service --no-pager

sudo ss -lntp | grep 8080

curl -i http://127.0.0.1:8080/health

sudo firewall-cmd --list-all

If /health is not 200, also run:

sudo journalctl -u oracle-health.service -n 100 --no-pager