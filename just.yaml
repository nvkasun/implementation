First verify SQLPlus works once we provide the environment:
sudo -u oracle env \
ORACLE_HOME=/OraHome/ora26ai_DB_Home \
ORACLE_SID=DFCASHDEV2 \
PATH=/OraHome/ora26ai_DB_Home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin \
LD_LIBRARY_PATH=/OraHome/ora26ai_DB_Home/lib \
/OraHome/ora26ai_DB_Home/bin/sqlplus -V

We want a clean version output. If that works, Oracle Home discovery is proven.
Then check the exact Oracle executable metadata:
sudo stat /OraHome/ora26ai_DB_Home/bin/oracle

and:
sudo getcap /OraHome/ora26ai_DB_Home/bin/oracle 2>/dev/null

Also:
sudo namei -l /OraHome/ora26ai_DB_Home/bin/oracle

These only inspect permissions; they change nothing.
Then check the required libraries:
sudo -u oracle env \
ORACLE_HOME=/OraHome/ora26ai_DB_Home \
LD_LIBRARY_PATH=/OraHome/ora26ai_DB_Home/lib \
ldd /OraHome/ora26ai_DB_Home/bin/oracle | grep -i "not found"

Ideally this returns nothing.
And finally, let's test the actual local connection with a simpler invocation—no nested printf or heredoc:
sudo -u oracle env \
ORACLE_HOME=/OraHome/ora26ai_DB_Home \
ORACLE_SID=DFCASHDEV2 \
PATH=/OraHome/ora26ai_DB_Home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin \
LD_LIBRARY_PATH=/OraHome/ora26ai_DB_Home/lib \
/OraHome/ora26ai_DB_Home/bin/sqlplus "/ as sysdba"

If you get a SQL> prompt, just run:
SELECT name, open_mode, database_role, cdb FROM v$database;

then:
EXIT;