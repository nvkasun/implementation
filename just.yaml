extensions = {
  oracle_health_config = {
    name                 = "oracle-health-config"
    publisher            = "Microsoft.Azure.Extensions"
    type                 = "CustomScript"
    type_handler_version = "2.1"

    auto_upgrade_minor_version = true
    automatic_upgrade_enabled  = false

    settings = jsonencode({
      commandToExecute = "/opt/oracle-health/configure-health-agent.sh ${var.oracle_listener_port}"
    })

    protected_settings = null
  }
}