read -s -p "Enter Oracle SYSTEM password: " ORA_PWD
echo

{
  printf 'CONNECT SYSTEM/"%s"@10.114.32.134:1521/pdb1\n' "$ORA_PWD"

  cat <<'SQL'
WHENEVER SQLERROR EXIT 1

SET HEADING OFF
SET FEEDBACK OFF
SET PAGESIZE 0
SET VERIFY OFF
SET ECHO OFF
SET LINESIZE 500

SELECT
    'CONNECTED|' ||
    SYS_CONTEXT('USERENV','SERVER_HOST') || '|' ||
    SYS_CONTEXT('USERENV','INSTANCE_NAME') || '|' ||
    SYS_CONTEXT('USERENV','SERVICE_NAME') || '|' ||
    SYS_CONTEXT('USERENV','CON_NAME')
