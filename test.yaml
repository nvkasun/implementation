module "oracle_db_vm01" {
  source = "git::https://github.com/AbuDhabiCommercialBank/azure-terraform.git//modules/virtual-machine?ref=main"

  resource_group_name = module.oracle_db_resource_group.rg_name
  application_name    = var.application_name
  environment         = var.environment

  subnet_id    = module.base-infra.subnet_map["snet-lb-cl-factory-uaenorth-001"].id
  key_vault_id = module.azure_key_vault.id

  dns_servers   = []
  computer_name = "oracledb01"

  vm = {
    os_type = "linux"
  }

  vm_size           = "Standard_E2s_v5"
  availability_zone = "1"

  source_image_reference = {
    publisher = "RedHat"
    offer     = "RHEL"
    sku       = "9-lvm-gen2"
    version   = "latest"
  }

  admin_username = "azureuser"

  managed_identities = {
    system_assigned = true
  }

  os_disk = {
    caching              = "ReadWrite"
    storage_account_type = "StandardSSD_LRS"
    disk_size_gb         = 128
  }

  accelerated_networking_enabled = true
  ip_forwarding_enabled          = false
  enable_boot_diagnostics        = true
  encryption_at_host_enabled     = false
  patch_mode_linux               = "ImageDefault"

  tags = local.tags
}


-------------------
module "oracle_db_resource_group" {
  source = "git::https://github.com/AbuDhabiCommercialBank/azure-terraform.git//modules/resource-groups?ref=main"

  rg_name = format("rg-%s-%s-%s-oracledb", var.application_name, var.environment, var.location)
  tags    = local.tags
}