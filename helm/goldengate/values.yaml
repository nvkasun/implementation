global:
  environment: ""
  deploymentId: ""

# Deployment model switch.
# legacyPair: one Helm release per logical pipeline (source + target
# StatefulSet, its own Namespace, two-host Ingress).
# singleRuntime: one GoldenGate runtime StatefulSet per Helm release/Argo CD
# Application, deployed into a shared per-environment namespace this chart
# never creates or owns (see the runtime: block below).
deploymentModel: legacyPair

nameOverride: ""
fullnameOverride: ""

# EFS-backed persistence for /u02 (trails, checkpoints, config, recovery
# artifacts). Disabled by default (emptyDir) unless a deployment opts in.
# Only the EFS filesystem ID is consumed here; the filesystem itself is
# provisioned outside this chart.
persistence:
  enabled: false
  provider: efs
  efs:
    fileSystemId: ""
    storageClass:
      create: false
      name: ""
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      directoryPerms: "0777"
      basePath: ""
      subPathPattern: "${.PVC.name}"
      ensureUniqueDirectory: "true"
      mountOptions:
        - tls

imagePullSecrets: []

podSecurityContext: {}

securityContext: {}

source:
  enabled: false
  name: ""
  fullnameOverride: ""
  component: source
  engine: oracle
  replicas: 1
  containerName: ogg-oracle

  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  ogg:
    deploymentName: ""
    domain: ""
    secureDeployment: false

  admin:
    existingSecret: ""
    usernameKey: OGG_ADMIN
    passwordKey: OGG_ADMIN_PWD

  csi:
    enabled: false
    region: eu-west-1
    serviceAccountRoleArn: ""

    admin:
      enabled: false
      providerClassName: ogg-oracle-admin
      secretName: ogg-oracle-admin
      objectName: ""
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath:
        - path: OGG_ADMIN
          objectAlias: OGG_ADMIN
        - path: OGG_ADMIN_PWD
          objectAlias: OGG_ADMIN_PWD

    certificate:
      enabled: false
      providerClassName: ogg-oracle-certificate
      objectName: ""
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath:
        - path: '"ogg.key"'
          objectAlias: ogg.key
        - path: '"ogg.pem"'
          objectAlias: ogg.pem
        - path: '"ca-chain.pem"'
          objectAlias: ca-chain.pem

  initPermissions:
    enabled: true
    mode: "0777"

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  service:
    type: ClusterIP
    ports:
      https: 8443
      dist: 9013
      metrics: 9015

  # Supported storage.u02.type values: emptyDir, existingClaim, efs.
  storage:
    u02:
      type: emptyDir
      existingClaim: ""
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany
    u03:
      type: emptyDir

  readinessProbe:
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 12

  livenessProbe:
    initialDelaySeconds: 180
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []
  extraContainers: []

target:
  enabled: false
  name: ""
  fullnameOverride: ""
  component: target
  engine: postgresql
  replicas: 1
  containerName: ogg-postgresql

  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  ogg:
    deploymentName: ""
    domain: ""
    secureDeployment: false

  admin:
    existingSecret: ""
    usernameKey: OGG_ADMIN
    passwordKey: OGG_ADMIN_PWD

  csi:
    enabled: false
    region: eu-west-1
    serviceAccountRoleArn: ""

    admin:
      enabled: false
      providerClassName: ogg-postgresql-admin
      secretName: ogg-postgresql-admin
      objectName: ""
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath:
        - path: OGG_ADMIN
          objectAlias: OGG_ADMIN
        - path: OGG_ADMIN_PWD
          objectAlias: OGG_ADMIN_PWD

    certificate:
      enabled: false
      providerClassName: ogg-postgresql-certificate
      objectName: ""
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath:
        - path: '"ogg.key"'
          objectAlias: ogg.key
        - path: '"ogg.pem"'
          objectAlias: ogg.pem
        - path: '"ca-chain.pem"'
          objectAlias: ca-chain.pem

  initPermissions:
    enabled: true
    mode: "0777"

  serviceAccount:
    create: false
    name: ogg-oracle-sa
    annotations: {}

  service:
    type: ClusterIP
    ports:
      https: 8443
      receiver: 9014
      metrics: 9015

  # Supported storage.u02.type values: emptyDir, existingClaim, efs.
  storage:
    u02:
      type: emptyDir
      existingClaim: ""
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany
    u03:
      type: emptyDir

  readinessProbe:
    initialDelaySeconds: 180
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 20

  livenessProbe:
    initialDelaySeconds: 240
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 8

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []
  extraContainers: []

# Generic single-runtime GoldenGate deployment (singleRuntime only --
# ignored in legacyPair mode). Exactly one container per pod: no
# runtime.extraContainers key exists -- no observer/utility/Fluent Bit
# sidecar in this model.
runtime:
  enabled: false

  name: ""
  fullnameOverride: ""

  deploymentType: ""
  businessDomain: ""
  containerName: ""

  replicas: 1

  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  # OGG_DEPLOYMENT/OGG_DOMAIN and the admin Secret name are derived
  # from the runtime name (Release.Name) -- see _helpers.tpl.
  ogg:
    secureDeployment: false

  admin:
    usernameKey: OGG_ADMIN
    passwordKey: OGG_ADMIN_PWD

  csi:
    enabled: false
    region: eu-west-1
    serviceAccountRoleArn: ""

    admin:
      enabled: false
      providerClassName: ""
      secretName: ""
      objectName: ""
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath: []

    certificate:
      enabled: false
      providerClassName: ""
      objectName: ""
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath: []

  initPermissions:
    enabled: true
    mode: "0777"

  serviceAccount:
    create: false
    name: ""
    annotations: {}

  service:
    type: ClusterIP
    ports:
      https: 8443
      dist: null
      receiver: null
      metrics: 9015

  storage:
    u02:
      type: emptyDir
      existingClaim: ""
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany
    u03:
      type: emptyDir

  readinessProbe:
    initialDelaySeconds: 180
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 20

  livenessProbe:
    initialDelaySeconds: 240
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 8

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

ingress:
  enabled: false
  # mode: shared  -> join an existing (resident) ALB group; emit only
  #                   application/group-level annotations.
  # mode: standalone -> this Ingress owns its own ALB; emit full ALB
  #                      annotations (scheme, subnets, certificateArn, ...).
  mode: shared
  className: alb

  # legacyPair only.
  hosts:
    source: ""
    target: ""

  # singleRuntime only. host, if set, is used verbatim; otherwise it is
  # derived as "<runtimeName>.<hostDomain>".
  host: ""
  hostDomain: ""

  alb:
    # These are library defaults only -- ingress.enabled is false by default,
    # so nothing renders out of the box. If a deployment sets
    # ingress.enabled=true and this alb.listenPorts (or an override) contains
    # "HTTPS", ingress.alb.certificateArn MUST also be provided, or the chart
    # fails to render. Environment values files (envs/<env>/<deployment>/values.yaml)
    # are expected to fully override this alb block with real, deployment-specific
    # ALB settings (group name/order, certificate ARN, listen ports, etc.) --
    # these library defaults are not meant to be deployed as-is.
    scheme: internal
    targetType: ip
    groupName: ""
    groupOrder: ""
    certificateArn: ""
    backendProtocol: HTTPS
    listenPorts: '[{"HTTP":80},{"HTTPS":443}]'
    sslRedirect: "443"
    healthcheckProtocol: HTTPS
    healthcheckPort: traffic-port
    healthcheckPath: /
    successCodes: "200-499"
    sslPolicy: ""
    subnets: ""
    securityGroups: ""
    inboundCidrs: ""
    loadBalancerAttributes: ""

  annotations: {}

configJob:
  enabled: false

monitoring:
  labels:
    enabled: true

  # legacyPair-only observer sidecar. Disabled by default; a deployment
  # opts in via monitoring.observer.enabled=true (see _observer.tpl).
  observer:
    enabled: false

    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent

    awsRegion: eu-west-1
    dynamodbTable: gg-eks-pipeline
    cloudWatchNamespace: GoldenGate/Pipelines

    adminHost: 127.0.0.1
    metricsHost: 127.0.0.1
    u02Path: /u02

    checkIntervalSeconds: 30
    connectTimeoutSeconds: 3

    health:
      # 18080 (not 8080): all containers in a GoldenGate pod share the same
      # network namespace, and something else in the pod already listens on
      # 8080 -- the observer's ThreadingHTTPServer failed to bind with
      # "OSError: [Errno 98] Address already in use" and crash-looped. 18080
      # is a dedicated port for the observer's own health endpoint only.
      port: 18080
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 3
      failureThreshold: 3

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

nodeSelector: {}

tolerations: []

affinity: {}