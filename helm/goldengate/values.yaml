global:
  environment: ""

# Deployment model switch; singleRuntime is the only supported value (see goldengate.assertSupportedDeploymentModel in _helpers.tpl). No default: a deployment values file must always state it explicitly.
deploymentModel: ""

nameOverride: ""
fullnameOverride: ""

# EFS-backed persistence for /u02; disabled by default (emptyDir) unless a deployment opts in. This chart never provisions or resolves the filesystem itself -- it only consumes a concrete fileSystemId, whether that ID is an operator-committed existing filesystem or one a Terraform/workflow managed-mode pipeline resolved before rendering; persistence.efs.mode has no default and must always be set explicitly to "existing" or "managed" by the deployment values file.
persistence:
  enabled: false
  provider: efs
  efs:
    mode: ""
    fileSystemId: ""
    storageClass:
      create: false
      name: ""
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      directoryPerms: "0777"
      basePath: ""
      subPathPattern: "${.PVC.name}"
      ensureUniqueDirectory: "true"
      mountOptions:
        - tls

imagePullSecrets: []

podSecurityContext: {}

securityContext: {}

# Generic single-runtime GoldenGate deployment; exactly one container per pod, no observer/utility/Fluent Bit sidecar in this model.
runtime:
  enabled: false

  name: ""
  fullnameOverride: ""

  deploymentType: ""
  businessDomain: ""
  containerName: ""

  replicas: 1

  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  # OGG_DEPLOYMENT/OGG_DOMAIN and the admin Secret name are derived from the runtime name (Release.Name) -- see _helpers.tpl.
  ogg:
    secureDeployment: false

  admin:
    usernameKey: OGG_ADMIN
    passwordKey: OGG_ADMIN_PWD

  csi:
    enabled: false
    region: ""
    serviceAccountRoleArn: ""

    admin:
      enabled: false
      providerClassName: ""
      secretName: ""
      objectName: ""
      objectType: secretsmanager
      mountPath: /mnt/secrets-store/admin
      jmesPath: []

    certificate:
      enabled: false
      providerClassName: ""
      objectName: ""
      objectType: secretsmanager
      mountPath: /etc/nginx/cert
      jmesPath: []

  initPermissions:
    enabled: true
    mode: "0777"

  serviceAccount:
    create: false
    name: ""
    annotations: {}

  service:
    type: ClusterIP
    ports:
      https: 8443
      dist: null
      receiver: null
      metrics: 9015

  storage:
    u02:
      type: emptyDir
      existingClaim: ""
      claimName: ""
      size: 20Gi
      accessModes:
        - ReadWriteMany
    u03:
      type: emptyDir

  readinessProbe:
    initialDelaySeconds: 180
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 20

  livenessProbe:
    initialDelaySeconds: 240
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 8

  resources: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

ingress:
  enabled: false
  # mode: shared -> join an existing ALB group (app/group-level annotations only); standalone -> owns its own ALB (full annotations).
  mode: shared
  className: alb

  # host, if set, is used verbatim; otherwise derived as "<runtimeName>.<hostDomain>".
  host: ""
  hostDomain: ""

  alb:
    # Library defaults only, not meant to be deployed as-is: environment values files are expected to fully override this block. If ingress.enabled=true and listenPorts contains "HTTPS", certificateArn MUST also be provided.
    scheme: internal
    targetType: ip
    groupName: ""
    groupOrder: ""
    certificateArn: ""
    backendProtocol: HTTPS
    listenPorts: '[{"HTTP":80},{"HTTPS":443}]'
    sslRedirect: "443"
    healthcheckProtocol: HTTPS
    healthcheckPort: traffic-port
    healthcheckPath: /
    successCodes: "200-499"
    sslPolicy: ""
    subnets: ""
    securityGroups: ""
    inboundCidrs: ""
    loadBalancerAttributes: ""

  annotations: {}

configJob:
  enabled: false

monitoring:
  labels:
    enabled: true

nodeSelector: {}

tolerations: []

affinity: {}