{{- if and .Values.runtime.enabled .Values.runtime.csi.enabled }}
{{- if .Values.runtime.csi.admin.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "goldengate.runtimeAdminProviderClassName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate.runtimeLabels" . | nindent 4 }}
spec:
  provider: aws
  secretObjects:
    - secretName: {{ include "goldengate.runtimeAdminSecretName" . }}
      type: Opaque
      data:
        - objectName: OGG_ADMIN
          key: {{ .Values.runtime.admin.usernameKey | default "OGG_ADMIN" }}
        - objectName: OGG_ADMIN_PWD
          key: {{ .Values.runtime.admin.passwordKey | default "OGG_ADMIN_PWD" }}
  parameters:
    region: {{ .Values.runtime.csi.region | quote }}
    objects: |
      - objectName: "{{ required "runtime.csi.admin.objectName is required when runtime.csi.admin.enabled=true" .Values.runtime.csi.admin.objectName }}"
        objectType: "{{ .Values.runtime.csi.admin.objectType | default "secretsmanager" }}"
        jmesPath:
{{- range .Values.runtime.csi.admin.jmesPath }}
          - path: {{ .path | quote }}
            objectAlias: {{ .objectAlias | quote }}
{{- end }}
---
{{- end }}
{{- if .Values.runtime.csi.certificate.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "goldengate.runtimeCertificateProviderClassName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate.runtimeLabels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.runtime.csi.region | quote }}
    objects: |
      - objectName: "{{ required "runtime.csi.certificate.objectName is required when runtime.csi.certificate.enabled=true" .Values.runtime.csi.certificate.objectName }}"
        objectType: "{{ .Values.runtime.csi.certificate.objectType | default "secretsmanager" }}"
        jmesPath:
{{- range .Values.runtime.csi.certificate.jmesPath }}
          - path: {{ .path | quote }}
            objectAlias: {{ .objectAlias | quote }}
{{- end }}
{{- end }}
{{- end }}
