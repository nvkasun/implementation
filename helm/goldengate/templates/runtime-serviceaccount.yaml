{{- if and (eq (default "legacyPair" .Values.deploymentModel) "singleRuntime") .Values.runtime.enabled .Values.runtime.serviceAccount.create }}
{{- $annotations := dict }}
{{- if and .Values.runtime.csi.enabled .Values.runtime.csi.serviceAccountRoleArn }}
{{- $_ := set $annotations "eks.amazonaws.com/role-arn" .Values.runtime.csi.serviceAccountRoleArn }}
{{- end }}
{{- with .Values.runtime.serviceAccount.annotations }}
{{- range $key, $value := . }}
{{- $_ := set $annotations $key $value }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "goldengate.runtimeServiceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate.runtimeLabels" . | nindent 4 }}
{{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
{{- end }}
{{- end }}
