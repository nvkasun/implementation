{{- if .Values.runtime.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goldengate.runtimeName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate.runtimeLabels" . | nindent 4 }}
spec:
  type: {{ .Values.runtime.service.type | default "ClusterIP" }}
  selector:
    {{- include "goldengate.runtimeSelectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.runtime.service.ports.https }}
      targetPort: https
      protocol: TCP
{{- if .Values.runtime.service.ports.dist }}
    - name: dist
      port: {{ .Values.runtime.service.ports.dist }}
      targetPort: dist
      protocol: TCP
{{- end }}
{{- if .Values.runtime.service.ports.receiver }}
    - name: receiver
      port: {{ .Values.runtime.service.ports.receiver }}
      targetPort: receiver
      protocol: TCP
{{- end }}
    - name: metrics
      port: {{ .Values.runtime.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
{{- end }}
