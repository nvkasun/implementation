# Base values for the argocd wrapper chart; no environment-specific settings here (see envs/<environment>/argocd/values.yaml). Upstream chart values must be namespaced under `argo-cd:` (see helm/argocd/charts/argo-cd/values.yaml for supported keys).
argo-cd: {}

# Structural toggle, disabled by default; environments that need the in-cluster ECR token-refresh CronJob enable it and supply role ARN/registry/repositories/image in their own values.yaml overlay.
ecrTokenSync:
  enabled: false
  repositories: []

# Structural toggle, disabled by default; environments that need to expose the Argo CD UI on the shared internal ALB enable it and supply hostname/ALB group/certificate in their own values.yaml overlay.
argocdServerIngress:
  enabled: false
