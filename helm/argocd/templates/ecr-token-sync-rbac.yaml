{{- if and .Values.ecrTokenSync .Values.ecrTokenSync.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.ecrTokenSync.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-ecr-token-sync
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  # "create" can't be scoped by resourceNames (object doesn't exist yet at authorization time); get/update/patch below are scoped to the specific Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs:
      - create
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
{{- range .Values.ecrTokenSync.repositories }}
      - {{ .argocdRepositorySecretName }}
{{- end }}
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.ecrTokenSync.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-ecr-token-sync
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.ecrTokenSync.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.ecrTokenSync.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
