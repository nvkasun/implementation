{{- if .Values.networkPolicy.enabled }}
# Ingress-only NetworkPolicy: restricts who may reach the portal's HTTP port,
# but deliberately does NOT declare an Egress policyType/rules. Egress
# CIDRs for the DynamoDB VPC endpoint, DNS, and the exact source behavior of
# ALB Controller target-group traffic have not been confirmed for this
# cluster -- guessing them here could silently break DynamoDB access or ALB
# health checks. Enable this policy only after those are confirmed; until
# then it is safe to leave networkPolicy.enabled=false (the chart default).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gg-monitor
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate-monitor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "goldengate-monitor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
