{{- /*
Generated from the staged canonical config (files/goldengate-deployments.yaml,
never committed there -- see .github/workflows/goldengate-monitor.yaml). One
admin-credential object per ENABLED deployment, plus the one shared TLS
object -- never a second hand-authored secret list.
*/ -}}
{{- $canonical := .Files.Get "files/goldengate-deployments.yaml" | fromYaml }}
{{- if not $canonical.tlsSecret }}
{{- fail "goldengate-deployments.yaml is missing tlsSecret." }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "goldengate-monitor.secretProviderClassName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate-monitor.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.aws.region | quote }}
    objects: |
{{- range $canonical.deployments }}
{{- if .enabled }}
      - objectName: "{{ .adminSecret }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "OGG_ADMIN"
            objectAlias: "{{ .name }}-admin-user"
          - path: "OGG_ADMIN_PWD"
            objectAlias: "{{ .name }}-admin-password"
{{- end }}
{{- end }}
      - objectName: "{{ $canonical.tlsSecret }}"
        objectType: "secretsmanager"
        jmesPath:
          # The monitor is a TLS *client* to the runtime admin endpoints --
          # it only needs the CA to verify their server certificates.
          - path: '"ca-chain.pem"'
            objectAlias: "ca-chain-pem"
