{{- if not .Values.image.repository }}
{{- fail "image.repository cannot be empty." }}
{{- end }}
{{- if not .Values.image.tag }}
{{- fail "image.tag cannot be empty." }}
{{- end }}
{{- if not .Values.canonicalConfig.root }}
{{- fail "canonicalConfig.root cannot be empty -- the portal reads its canonical runtime/topology inventory from this mounted path." }}
{{- end }}
{{- if not .Values.aws.region }}
{{- fail "aws.region cannot be empty." }}
{{- end }}
{{- if not .Values.dynamodb.tableName }}
{{- fail "dynamodb.tableName cannot be empty." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gg-monitor
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "goldengate-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "goldengate-monitor.labels" . | nindent 8 }}
      annotations:
        checksum/canonical-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "goldengate-monitor.serviceAccountName" . }}
      # IRSA requires the projected ServiceAccount token to be mounted.
      automountServiceAccountToken: true
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          {{- toYaml .Values.securityContext.seccompProfile | nindent 10 }}
      containers:
        - name: gg-monitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            privileged: false
            capabilities:
              {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
          env:
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.aws.region | quote }}
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: "regional"
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: DYNAMODB_TABLE
              value: {{ .Values.dynamodb.tableName | quote }}
            - name: REPO_CONFIG_ROOT
              value: {{ .Values.canonicalConfig.root | quote }}
            - name: LEGACY_FALLBACK_ENABLED
              value: {{ .Values.legacyFallback.enabled | default false | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: STALE_AFTER_SECONDS
              value: {{ .Values.staleAfterSeconds | quote }}
            - name: REFRESH_SECONDS
              value: {{ .Values.refreshSeconds | quote }}
            - name: MONITOR_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: AWS_CONFIG_FILE
              value: /tmp/.aws/config
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /tmp/.aws/credentials
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: canonical-config
              mountPath: {{ .Values.canonicalConfig.root }}
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # read-only-root-filesystem compatibility: the app writes nothing
        # persistent, but boto3/AWS SDK config/cache paths above point at
        # /tmp, which must be writable.
        - name: tmp
          emptyDir: {}
        - name: canonical-config
          configMap:
            name: goldengate-monitor-canonical-config
            items:
              - key: deployments.yaml
                path: pipelines/deployments.yaml
{{- range $path, $_ := .Files.Glob "files/topologies/dev/*.yaml" }}
              - key: {{ base $path }}
                path: topologies/dev/{{ base $path }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
