{{- /*
Mirrors envs/dev/goldengate-deployments.yaml verbatim into a ConfigMap --
this is a STAGED COPY under this chart's files/ directory, not a
hand-authored second list. The base repository chart never carries this
staged copy: the deploying workflow (.github/workflows/goldengate-monitor.yaml)
stages it into a temporary chart directory immediately before packaging.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: goldengate-monitor-canonical-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate-monitor.labels" . | nindent 4 }}
data:
  goldengate-deployments.yaml: |
{{ .Files.Get "files/goldengate-deployments.yaml" | indent 4 }}
