{{- if .Values.serviceAccount.create }}
{{- if not .Values.serviceAccount.roleArn }}
{{- fail "serviceAccount.roleArn is required when serviceAccount.create=true (IRSA needs the role ARN to annotate the ServiceAccount with)." }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "goldengate-monitor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "goldengate-monitor.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
{{- end }}
