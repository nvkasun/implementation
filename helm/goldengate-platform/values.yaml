# Shared GoldenGate platform bootstrap, library defaults only (all inert until an environment values file opts in). Single owner of the shared namespaces, runtime ServiceAccounts, and platform Fluent Bit DaemonSet -- individual runtime releases (helm/goldengate) must only reference these by name, never create or own them.

environment: ""

namespaces:
  runtime:
    create: false
    name: ""

# Single shared runtime ServiceAccount for EVERY GoldenGate deployment regardless of deploymentType (restored stable identity boundary): every singleRuntime pod assumes the same runtime IAM role via this one identity, so onboarding a new engine never requires a new IRSA trust subject. name is a fixed platform invariant; roleArn is empty by default -- the deploy workflow populates it with the one runtime IAM role every deploymentType already shares. Never a per-type map, never a fixed per-flavour template branch.
runtimeServiceAccount:
  name: gg-runtime-sa
  roleArn: ""

# Centralized container logging (platform-level DaemonSet, never a runtime/observer sidecar); collects Kubernetes stdout/stderr only, not EFS /u02 GoldenGate file logs.
fluentBit:
  create: false
  image:
    # One complete, immutable private ECR digest reference (FLUENT_BIT_IMAGE), never a repository/tag pair; empty by default so the chart fails clearly rather than falling back to a public/tag-based image.
    reference: ""
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: gg-fluent-bit
    # Required whenever create=true; dedicated least-privilege logging role -- never GoldenGateSecretsReadRole-dev/GoldenGateMonitorReadRole-dev/GoldenGateEKSDeployRole-dev.
    roleArn: ""

  aws:
    region: ""

  # Namespaces this DaemonSet is permitted to ship logs from; other namespaces are dropped before reaching an OUTPUT, never collected cluster-wide.
  namespaces:
    runtime: goldengate-dev
    monitoring: goldengate-monitoring

  # Pre-created (Terraform-managed) CloudWatch Logs destinations; this DaemonSet never has logs:CreateLogGroup. Must match envs/dev/cloudwatch_logs.tf exactly.
  cloudwatch:
    runtimeLogGroupName: /adcb/goldengate/dev/runtime
    monitorLogGroupName: /adcb/goldengate/dev/monitor
    logStreamPrefix: fluent-bit-

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Bounded filesystem-backed chunk buffering: outputQueueLimit becomes each OUTPUT's storage.total_limit_size; stateVolumeSizeLimit becomes the fluent-bit-state emptyDir's sizeLimit -- keep both in the same rough order of magnitude.
  buffering:
    outputQueueLimit: 128M
    stateVolumeSizeLimit: 300Mi

  # UID/GID deliberately left unset by default: the image's non-root UID hasn't been verified, and a wrong guess with runAsNonRoot=true would refuse to schedule; every other hardening control below is still fully enforced.
  securityContext:
    runAsNonRoot: false
    runAsUser: ""
    runAsGroup: ""
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
    fsGroup: ""
    fsGroupChangePolicy: OnRootMismatch

  nodeSelector: {}
  tolerations:
    # None by default: an unconditional toleration set would also schedule onto unrelated tainted node pools this chart has no business running on.
    []
  annotations: {}
