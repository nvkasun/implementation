# Shared GoldenGate platform bootstrap -- library defaults only. Everything
# is inert (create: false / empty) by default; an environment values file
# (e.g. platform/dev/goldengate-platform/values.yaml) opts in explicitly.
#
# This chart is the SINGLE designated owner of the shared namespaces, the
# shared engine-level runtime ServiceAccounts, and (Phase 6A) the
# platform-level Fluent Bit DaemonSet with its supporting RBAC, ConfigMap,
# and ServiceAccount. It must never be confused with an individual
# GoldenGate runtime release (helm/goldengate, deploymentModel=singleRuntime)
# -- those reference the shared ServiceAccounts above by name only
# (serviceAccount.create=false) and must never create or own them, and never
# run a Fluent Bit/observer/manager-utility logging sidecar of their own.

environment: ""

namespaces:
  runtime:
    create: false
    name: ""

# Shared, engine-level IRSA identities. One ServiceAccount per GoldenGate
# engine (not per runtime release, not per deployment) -- gg-oracle-payments-01
# and any future additional Oracle single-runtime release would all use the
# same serviceAccounts.oracle identity.
serviceAccounts:
  oracle:
    create: false
    name: ""
    # Required (chart fails to render otherwise) whenever create=true --
    # IRSA needs the role ARN to annotate the ServiceAccount with. Never
    # hard-code an account-specific role ARN here; the environment values
    # file / deploying workflow supplies it.
    roleArn: ""
  postgresql:
    create: false
    name: ""
    roleArn: ""

# Phase 6A: centralized container logging (platform-level DaemonSet, never a
# GoldenGate runtime/observer sidecar). Collects Kubernetes container
# stdout/stderr only -- this does NOT provide EFS /u02 GoldenGate file-log
# (ggserr.log, dirrpt/*.rpt) coverage; that remains a separate, later,
# explicitly-approved mechanism. Deployed into namespaces.runtime.name
# (goldengate-dev) alongside the shared engine ServiceAccounts above --
# DaemonSet pods still schedule on every node regardless of the namespace
# they are defined in, so this does not require a second shared namespace.
fluentBit:
  create: false
  image:
    # One complete, immutable image reference -- never a repository/tag
    # pair. Must be the private ECR digest reference published as the
    # FLUENT_BIT_IMAGE GitHub repository variable, e.g.:
    #   229410149234.dkr.ecr.eu-west-1.amazonaws.com/aws-cloud-factory-fluent-bit@sha256:<64 hex>
    # Never public.ecr.aws (the upstream AWS-published image is mirrored
    # into the approved private ECR account first) and never a mutable tag
    # (a tag can move; a digest cannot). Deliberately empty by default --
    # the chart must fail clearly (see fluent-bit-daemonset.yaml's
    # `required`) rather than silently fall back to any public or
    # tag-based image when fluentBit.create=true and this was not supplied.
    reference: ""
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: gg-fluent-bit
    # Required (chart fails to render otherwise) whenever create=true.
    # Dedicated least-privilege logging role -- never
    # GoldenGateSecretsReadRole-dev/GoldenGateMonitorReadRole-dev/
    # GoldenGateEKSDeployRole-dev.
    roleArn: ""

  aws:
    region: ""

  # Namespaces this DaemonSet is permitted to ship logs from. A record
  # whose kubernetes.namespace_name is not in this list is dropped by the
  # grep filter before it ever reaches an OUTPUT -- never collected
  # cluster-wide by default.
  namespaces:
    runtime: goldengate-dev
    monitoring: goldengate-monitoring

  # Pre-created (Terraform-managed) CloudWatch Logs destinations -- this
  # DaemonSet is never granted logs:CreateLogGroup and never relies on
  # auto_create_group. Must match envs/dev/cloudwatch_logs.tf exactly.
  cloudwatch:
    runtimeLogGroupName: /adcb/goldengate/dev/runtime
    monitorLogGroupName: /adcb/goldengate/dev/monitor
    logStreamPrefix: fluent-bit-

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Bounded filesystem-backed chunk buffering (Section 6 correction): the
  # earlier design bounded only in-memory buffering (Mem_Buf_Limit) and the
  # in-flight backlog (storage.backlog.mem_limit), neither of which bounds
  # how large the filesystem-backed buffer directory itself can grow on
  # node ephemeral storage. outputQueueLimit becomes each cloudwatch_logs
  # OUTPUT's storage.total_limit_size; stateVolumeSizeLimit becomes the
  # fluent-bit-state emptyDir's sizeLimit, so the two are meant to be kept
  # in the same rough order of magnitude (the emptyDir must be large enough
  # to hold both outputs' queues plus the tail position DB).
  buffering:
    outputQueueLimit: 128M
    stateVolumeSizeLimit: 300Mi

  # UID/GID are deliberately left unset (empty) by default: the private
  # immutable image (FLUENT_BIT_IMAGE) has not been verified against a
  # specific non-root UID from this repository, and asserting
  # runAsNonRoot=true with a guessed UID that turns out wrong would refuse
  # to schedule at all (or silently break log collection), not just add
  # friction -- guessing here is worse than leaving it unset. Every other
  # hardening control below is fully and unconditionally enforced
  # regardless of which user the container ultimately runs as.
  #
  # Once the image's actual supported non-root user has been verified
  # (e.g. `docker run --rm <FLUENT_BIT_IMAGE> id`), set runAsNonRoot: true
  # and runAsUser/runAsGroup to that UID/GID, and set fsGroup (with
  # fsGroupChangePolicy) to the same GID so the writable fluent-bit-state
  # emptyDir is writable by that user too.
  securityContext:
    runAsNonRoot: false
    runAsUser: ""
    runAsGroup: ""
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
    fsGroup: ""
    fsGroupChangePolicy: OnRootMismatch

  nodeSelector: {}
  tolerations:
    # DaemonSets must run on every node that can host a GoldenGate or
    # monitor pod -- an unconditional toleration set would also schedule
    # onto unrelated tainted node pools this chart has no business running
    # on, so none are set by default. Add environment-specific tolerations
    # here only if the target node group actually requires them.
    []
  annotations: {}
