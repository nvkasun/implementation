{{- if .Values.serviceAccounts.runtime.create }}
{{- if not .Values.serviceAccounts.runtime.name }}
{{- fail "serviceAccounts.runtime.name is required when serviceAccounts.runtime.create=true." }}
{{- end }}
{{- if not .Values.serviceAccounts.runtime.roleArn }}
{{- fail "serviceAccounts.runtime.roleArn is required when serviceAccounts.runtime.create=true (IRSA needs the role ARN to annotate the ServiceAccount with)." }}
{{- end }}
{{- if not .Values.namespaces.runtime.name }}
{{- fail "namespaces.runtime.name is required when serviceAccounts.runtime.create=true." }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.runtime.name }}
  namespace: {{ .Values.namespaces.runtime.name | quote }}
  labels:
    {{- include "goldengate-platform.labels" . | nindent 4 }}
    goldengate.adcb/purpose: runtime
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccounts.runtime.roleArn | quote }}
    # Shared identity across every GoldenGate deployment type -- Application cascading deletion or a future prune must never remove it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
{{- end }}
{{- if .Values.serviceAccounts.oracle.create }}
{{- if not .Values.serviceAccounts.oracle.name }}
{{- fail "serviceAccounts.oracle.name is required when serviceAccounts.oracle.create=true." }}
{{- end }}
{{- if not .Values.serviceAccounts.oracle.roleArn }}
{{- fail "serviceAccounts.oracle.roleArn is required when serviceAccounts.oracle.create=true (IRSA needs the role ARN to annotate the ServiceAccount with)." }}
{{- end }}
{{- if not .Values.namespaces.runtime.name }}
{{- fail "namespaces.runtime.name is required when serviceAccounts.oracle.create=true." }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.oracle.name }}
  namespace: {{ .Values.namespaces.runtime.name | quote }}
  labels:
    {{- include "goldengate-platform.labels" . | nindent 4 }}
    goldengate.adcb/engine: oracle
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccounts.oracle.roleArn | quote }}
    # Shared, engine-level identity -- Application cascading deletion or a future prune must never remove it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
{{- end }}
{{- if .Values.serviceAccounts.postgresql.create }}
{{- if not .Values.serviceAccounts.postgresql.name }}
{{- fail "serviceAccounts.postgresql.name is required when serviceAccounts.postgresql.create=true." }}
{{- end }}
{{- if not .Values.serviceAccounts.postgresql.roleArn }}
{{- fail "serviceAccounts.postgresql.roleArn is required when serviceAccounts.postgresql.create=true (IRSA needs the role ARN to annotate the ServiceAccount with)." }}
{{- end }}
{{- if not .Values.namespaces.runtime.name }}
{{- fail "namespaces.runtime.name is required when serviceAccounts.postgresql.create=true." }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.postgresql.name }}
  namespace: {{ .Values.namespaces.runtime.name | quote }}
  labels:
    {{- include "goldengate-platform.labels" . | nindent 4 }}
    goldengate.adcb/engine: postgresql
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccounts.postgresql.roleArn | quote }}
    # Shared, engine-level identity -- Application cascading deletion or a future prune must never remove it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
{{- end }}
