{{- range $type, $sa := .Values.runtimeServiceAccounts }}
{{- if not $sa.name }}
{{- fail (printf "runtimeServiceAccounts.%s.name is required." $type) }}
{{- end }}
{{- if not $sa.roleArn }}
{{- fail (printf "runtimeServiceAccounts.%s.roleArn is required (IRSA needs the role ARN to annotate the ServiceAccount with)." $type) }}
{{- end }}
{{- if not $.Values.namespaces.runtime.name }}
{{- fail (printf "namespaces.runtime.name is required when runtimeServiceAccounts.%s is set." $type) }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $.Values.namespaces.runtime.name | quote }}
  labels:
    {{- include "goldengate-platform.labels" $ | nindent 4 }}
    goldengate.adcb/engine: {{ $type }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $sa.roleArn | quote }}
    # Shared, engine-level identity -- Application cascading deletion or a future prune must never remove it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
{{- end }}
