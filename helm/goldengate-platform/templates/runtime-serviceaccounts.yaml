{{- if not .Values.runtimeServiceAccount.name }}
{{- fail "runtimeServiceAccount.name is required." }}
{{- end }}
{{- if not .Values.runtimeServiceAccount.roleArn }}
{{- fail "runtimeServiceAccount.roleArn is required (IRSA needs the role ARN to annotate the ServiceAccount with)." }}
{{- end }}
{{- if not .Values.namespaces.runtime.name }}
{{- fail "namespaces.runtime.name is required when runtimeServiceAccount is set." }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.runtimeServiceAccount.name }}
  namespace: {{ .Values.namespaces.runtime.name | quote }}
  labels:
    {{- include "goldengate-platform.labels" . | nindent 4 }}
    goldengate.adcb/purpose: runtime
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.runtimeServiceAccount.roleArn | quote }}
    # Shared, platform-level identity -- Application cascading deletion or a future prune must never remove it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
{{- range .Values.transitionalRuntimeServiceAccounts }}
{{- if not .name }}
{{- fail "transitionalRuntimeServiceAccounts entries require name." }}
{{- end }}
{{- if not .engine }}
{{- fail (printf "transitionalRuntimeServiceAccounts.%s requires engine (preserves its pre-migration goldengate.adcb/engine label)." .name) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespaces.runtime.name | quote }}
  labels:
    {{- include "goldengate-platform.labels" $ | nindent 4 }}
    goldengate.adcb/engine: {{ .engine }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $.Values.runtimeServiceAccount.roleArn | quote }}
    # Transitional migration-compatibility identity (fixed, reviewed list -- never derived from the folder inventory): old historical runtimes may still reference it until reconciled onto runtimeServiceAccount. Application cascading deletion or a future prune must never remove it while that remains true.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
{{- end }}
