{{- if .Values.fluentBit.create }}
{{- if not .Values.fluentBit.serviceAccount.create }}
{{- fail "fluentBit.serviceAccount.create must be true when fluentBit.create=true -- Fluent Bit always needs its own dedicated IRSA identity, never the default ServiceAccount." }}
{{- end }}
{{- if not .Values.fluentBit.serviceAccount.name }}
{{- fail "fluentBit.serviceAccount.name is required when fluentBit.create=true." }}
{{- end }}
{{- if not .Values.fluentBit.serviceAccount.roleArn }}
{{- fail "fluentBit.serviceAccount.roleArn is required when fluentBit.create=true (IRSA needs the role ARN to annotate the ServiceAccount with)." }}
{{- end }}
{{- if not .Values.namespaces.runtime.name }}
{{- fail "namespaces.runtime.name is required when fluentBit.create=true." }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.fluentBit.serviceAccount.name }}
  namespace: {{ .Values.namespaces.runtime.name | quote }}
  labels:
    {{- include "goldengate-platform.fluentBit.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.fluentBit.serviceAccount.roleArn | quote }}
{{- end }}
