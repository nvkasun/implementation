{{- if .Values.namespaces.runtime.create }}
{{- if not .Values.namespaces.runtime.name }}
{{- fail "namespaces.runtime.name is required when namespaces.runtime.create=true." }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.runtime.name }}
  labels:
    {{- include "goldengate-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    # Prune=false,Delete=false (not PruneLast=true): this is a shared,
    # engine-level resource -- Application cascading deletion or a future
    # prune must never remove it. PruneLast alone only affects prune
    # *ordering*, not whether the object is prunable/deletable at all.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
{{- end }}
