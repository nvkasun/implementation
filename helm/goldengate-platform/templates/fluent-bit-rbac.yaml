{{- if .Values.fluentBit.create }}
# Read-only, cluster-scoped: the Fluent Bit "kubernetes" filter resolves pod/namespace metadata via the API server; get/list/watch only, no control permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.fluentBit.serviceAccount.name }}
  labels:
    {{- include "goldengate-platform.fluentBit.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.fluentBit.serviceAccount.name }}
  labels:
    {{- include "goldengate-platform.fluentBit.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.fluentBit.serviceAccount.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.fluentBit.serviceAccount.name }}
    namespace: {{ .Values.namespaces.runtime.name | quote }}
{{- end }}
