{{- if not .Values.secrets.oracle.admin.objectName }}
{{- fail "secrets.oracle.admin.objectName is required." }}
{{- end }}
{{- if not .Values.secrets.postgresql.admin.objectName }}
{{- fail "secrets.postgresql.admin.objectName is required." }}
{{- end }}
{{- if not .Values.secrets.tls.objectName }}
{{- fail "secrets.tls.objectName is required." }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gg-monitor-secrets
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "gg-monitor.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.secrets.region | quote }}
    objects: |
      - objectName: "{{ .Values.secrets.oracle.admin.objectName }}"
        objectType: "{{ .Values.secrets.oracle.admin.objectType | default "secretsmanager" }}"
        jmesPath:
          - path: {{ .Values.secrets.oracle.admin.usernameKey | default "OGG_ADMIN" | quote }}
            objectAlias: "oracle-ogg-admin"
          - path: {{ .Values.secrets.oracle.admin.passwordKey | default "OGG_ADMIN_PWD" | quote }}
            objectAlias: "oracle-ogg-admin-pwd"
      - objectName: "{{ .Values.secrets.postgresql.admin.objectName }}"
        objectType: "{{ .Values.secrets.postgresql.admin.objectType | default "secretsmanager" }}"
        jmesPath:
          - path: {{ .Values.secrets.postgresql.admin.usernameKey | default "OGG_ADMIN" | quote }}
            objectAlias: "postgresql-ogg-admin"
          - path: {{ .Values.secrets.postgresql.admin.passwordKey | default "OGG_ADMIN_PWD" | quote }}
            objectAlias: "postgresql-ogg-admin-pwd"
      - objectName: "{{ .Values.secrets.tls.objectName }}"
        objectType: "{{ .Values.secrets.tls.objectType | default "secretsmanager" }}"
        jmesPath:
          # gg-monitor is a TLS *client* to the runtime admin endpoints -- it
          # only needs the CA to verify their server certificates, never its
          # own key/certificate pair (unlike the runtime pods' own nginx
          # frontend, which mounts ogg.key/ogg.pem too).
          - path: '"ca-chain.pem"'
            objectAlias: "ca-chain-pem"
