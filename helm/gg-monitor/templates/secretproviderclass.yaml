{{- if not .Values.secrets.admin.usernameKey }}
{{- fail "secrets.admin.usernameKey is required." }}
{{- end }}
{{- if not .Values.secrets.admin.passwordKey }}
{{- fail "secrets.admin.passwordKey is required." }}
{{- end }}

{{- /*
Manager-alignment correction (fix 1): the manager gives every GoldenGate
deployment its OWN credential identity (credentialsSecretId, one Secrets
Manager object per deployment -- see charts/gg-deployment/values.yaml /
templates/statefulset.yaml in the manager reference, inspected read-only).
This chart preserves that same DEPLOYMENT-level identity concept while
using this repository's approved CSI SecretProviderClass delivery
mechanism (the manager instead uses a fetch-secrets.py init container --
not adopted here; only the underlying "one credential identity per
deployment, never per engine type" concept is).

Every object below is GENERATED from the staged canonical
pipelines/deployments.yaml + topologies/dev/*.yaml -- there is no manually
duplicated Oracle/PostgreSQL runtime list here. Each enabled deployment's
own secretReferences.admin becomes one (possibly shared) CSI object, and
each deployment gets its own deterministic alias pair
"<pipeline>-admin-user" / "<pipeline>-admin-password" -- the EXACT same
naming rule monitoring/gg-monitor-core/inventory.py's
_credential_alias_paths() derives independently from the same canonical
data, so both sides always agree without cross-referencing each other at
render/runtime. A future second Oracle deployment with a different secret
object needs only its own topology entry -- no chart change.
*/ -}}
{{- $deploymentsDoc := .Files.Get "files/pipelines/deployments.yaml" | fromYaml }}
{{- $enabledNames := dict }}
{{- range $deploymentsDoc.deployments }}
{{- if .enabled }}
{{- $_ := set $enabledNames (printf "gg-%s" .name) true }}
{{- end }}
{{- end }}

{{- $adminByObject := dict }}
{{- $tlsObjects := dict }}
{{- range $path, $_ := .Files.Glob "files/topologies/dev/*.yaml" }}
{{- $doc := $.Files.Get $path | fromYaml }}
{{- range $role, $detail := $doc.deployments }}
{{- $pipeline := $detail.deploymentName }}
{{- if hasKey $enabledNames $pipeline }}
{{- $refs := $detail.secretReferences | default dict }}
{{- $adminObj := $refs.admin }}
{{- if not $adminObj }}
{{- fail (printf "%s: secretReferences.admin is required" $pipeline) }}
{{- end }}
{{- $entries := get $adminByObject $adminObj | default list }}
{{- if not (has $pipeline $entries) }}
{{- $entries = append $entries $pipeline }}
{{- end }}
{{- $_ := set $adminByObject $adminObj $entries }}

{{- $tlsObj := $refs.tls }}
{{- if not $tlsObj }}
{{- fail (printf "%s: secretReferences.tls is required" $pipeline) }}
{{- end }}
{{- $_ := set $tlsObjects $tlsObj true }}
{{- end }}
{{- end }}
{{- end }}

{{- if gt (len $tlsObjects) 1 }}
{{- fail "multiple distinct secretReferences.tls objects found across enabled deployments -- this monitor supports exactly one shared CA_FILE today" }}
{{- end }}

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gg-monitor-secrets
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "gg-monitor.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.secrets.region | quote }}
    objects: |
      {{- range $objectName, $pipelines := $adminByObject }}
      - objectName: "{{ $objectName }}"
        objectType: "{{ $.Values.secrets.admin.objectType | default "secretsmanager" }}"
        jmesPath:
          {{- range $pipelines }}
          - path: {{ $.Values.secrets.admin.usernameKey | quote }}
            objectAlias: "{{ . }}-admin-user"
          - path: {{ $.Values.secrets.admin.passwordKey | quote }}
            objectAlias: "{{ . }}-admin-password"
          {{- end }}
      {{- end }}
      {{- range $objectName, $_ := $tlsObjects }}
      - objectName: "{{ $objectName }}"
        objectType: "{{ $.Values.secrets.tls.objectType | default "secretsmanager" }}"
        jmesPath:
          # gg-monitor is a TLS *client* to the runtime admin endpoints -- it
          # only needs the CA to verify their server certificates, never its
          # own key/certificate pair.
          - path: '"ca-chain.pem"'
            objectAlias: "ca-chain-pem"
      {{- end }}
