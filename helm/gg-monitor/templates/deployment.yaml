{{- if not .Values.image.repository }}
{{- fail "image.repository cannot be empty." }}
{{- end }}
{{- if not .Values.image.tag }}
{{- fail "image.tag cannot be empty." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gg-monitor
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "gg-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "gg-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gg-monitor.labels" . | nindent 8 }}
      annotations:
        checksum/canonical-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "gg-monitor.serviceAccountName" . }}
      automountServiceAccountToken: true
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          {{- toYaml .Values.securityContext.seccompProfile | nindent 10 }}
      containers:
        - name: gg-monitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            privileged: false
            capabilities:
              {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
          env:
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.aws.region | quote }}
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: "regional"
            # Required: never silently fall back to the EKS node/EC2
            # instance role -- this pod must only ever use its own IRSA
            # identity (gg-monitor-dev-role).
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: DDB_TABLE
              value: {{ .Values.dynamodb.tableName | quote }}
            - name: REPO_CONFIG_ROOT
              value: "/etc/gg-canonical"
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TZ
              value: "Asia/Dubai"
            - name: ORACLE_ADMIN_USER_FILE
              value: "/mnt/secrets-store/oracle-ogg-admin"
            - name: ORACLE_ADMIN_PASSWORD_FILE
              value: "/mnt/secrets-store/oracle-ogg-admin-pwd"
            - name: POSTGRESQL_ADMIN_USER_FILE
              value: "/mnt/secrets-store/postgresql-ogg-admin"
            - name: POSTGRESQL_ADMIN_PASSWORD_FILE
              value: "/mnt/secrets-store/postgresql-ogg-admin-pwd"
            - name: CA_FILE
              value: "/mnt/secrets-store/ca-chain-pem"
            - name: AWS_CONFIG_FILE
              value: /tmp/.aws/config
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /tmp/.aws/credentials
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: canonical-config
              mountPath: /etc/gg-canonical
              readOnly: true
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: canonical-config
          configMap:
            name: gg-monitor-canonical-config
            items:
              - key: deployments.yaml
                path: pipelines/deployments.yaml
{{- range $path, $_ := .Files.Glob "files/topologies/dev/*.yaml" }}
              - key: {{ base $path }}
                path: topologies/dev/{{ base $path }}
{{- end }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: gg-monitor-secrets
{{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
