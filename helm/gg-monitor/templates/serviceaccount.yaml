{{- if .Values.serviceAccount.create }}
{{- if not .Values.serviceAccount.name }}
{{- fail "serviceAccount.name is required when serviceAccount.create=true." }}
{{- end }}
{{- if not .Values.serviceAccount.roleArn }}
{{- fail "serviceAccount.roleArn is required when serviceAccount.create=true (IRSA needs the role ARN to annotate the ServiceAccount with)." }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "gg-monitor.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
{{- end }}
