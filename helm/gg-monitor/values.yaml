# gg-monitor -- shared, passive GoldenGate runtime poller/writer (Phase 4).
#
# Library defaults only. An environment values file
# (envs/dev/goldengate-monitoring-dev... see platform/dev pattern) supplies
# image.repository/tag and serviceAccount.roleArn per environment.

global:
  environment: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

namespace:
  # Created by helm/goldengate-platform (Phase 2) -- this chart does not
  # create or own the namespace, only deploys into it.
  name: goldengate-monitoring-dev

replicaCount: 1

aws:
  region: eu-west-1

dynamodb:
  tableName: gg-eks-pipeline

# IRSA. Required (see templates/serviceaccount.yaml `required` guard)
# whenever serviceAccount.create=true -- trust is scoped to exactly
# system:serviceaccount:goldengate-monitoring-dev:gg-monitor (see
# envs/dev/policies/gg-monitor-dev-role/). Never
# GoldenGateSecretsReadRole-dev or either runtime role.
serviceAccount:
  create: true
  name: gg-monitor
  roleArn: ""

# Secrets Store CSI Driver mounts -- same jmesPath pattern already proven by
# the Oracle/PostgreSQL runtime SecretProviderClasses (helm/goldengate/
# templates/runtime-secretproviderclass.yaml). Secret VALUES are never
# stored here or anywhere in Git -- only object-name references, mounted at
# runtime as files.
#
# Manager-alignment correction (fix 1): admin secret OBJECT NAMES are no
# longer configured per engine type here -- they are DEPLOYMENT-level and
# generated from canonical pipelines/deployments.yaml + topologies/dev/*.yaml
# (see templates/secretproviderclass.yaml). The only knobs that remain here
# are the shared facts true of every admin secret regardless of which
# deployment it belongs to: the CSI provider region, the secret's internal
# JSON key names (every GoldenGate admin secret in this system uses the
# same OGG_ADMIN/OGG_ADMIN_PWD keys), and the TLS object's type default.
secrets:
  region: eu-west-1
  admin:
    objectType: secretsmanager
    usernameKey: OGG_ADMIN
    passwordKey: OGG_ADMIN_PWD
  tls:
    objectType: secretsmanager

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}
